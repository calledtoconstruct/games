<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f0d8">
<title>Word Search</title>
<style>
  :root {
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffaf0;
    --gold: #e2a62e;
    --found: #f3d48a;
    --preview: #d5ead8;
    --ring: #2f8a3e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    height: 100dvh;
  }
  button { font-family: inherit; color: var(--ink); cursor: pointer; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  #mute, #full {
    position: fixed; z-index: 50; top: 8px;
    width: 72px; height: 72px; padding: 0;
    border: 3px solid var(--ink); border-radius: 18px;
    background: var(--card);
  }
  #mute { left: 8px; }
  #full { left: 88px; font-size: 13px; font-weight: 800; line-height: 1.05; }
  #mute svg { width: 40px; height: 40px; display: block; margin: 0 auto; }
  #back {
    position: fixed; z-index: 50; top: 8px; right: 8px;
    min-width: 72px; min-height: 72px; padding: 8px 14px;
    border: 3px solid var(--ink); border-radius: 18px;
    background: var(--card); font-weight: 800; font-size: 18px;
  }
  #eyes {
    position: fixed; z-index: 46; top: 18px; left: 170px;
    background: var(--card); border-radius: 999px; padding: 7px 12px;
    font-weight: 800; font-size: 16px; pointer-events: none;
  }
  #banner {
    position: fixed; z-index: 40; pointer-events: none;
    top: 8px; left: 168px; right: 200px; height: 72px;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 4px 14px; font-size: clamp(13px, 1.6vw, 20px); font-weight: 800;
    text-align: center; overflow: hidden; line-height: 1.15;
  }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border: none; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #dead {
    position: fixed; z-index: 80; left: 0; bottom: 0;
    width: 36px; height: 36px; pointer-events: auto;
  }
  [hidden] { display: none !important; }
  .card {
    background: var(--card); border-radius: 28px;
    margin: 0 auto; padding: 0;
    width: min(460px, calc(100% - 16px));
    max-height: 100%;
    overflow: hidden;
  }
  h1 { font-size: 42px; line-height: 1; margin: 4px 0 10px; text-align: center; }
  .line { text-align: center; margin: 0 0 8px; font-size: 18px; }
  .band, #go, #another, #backward {
    display: block; width: 100%; min-height: 0; margin: 0;
    border: 3px solid transparent; border-radius: 18px;
    background: var(--card); font-weight: 800; text-align: left; padding: 4px 10px;
    box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  .band b { display: block; font-size: 26px; }
  .band small { display: block; font-size: 15px; font-weight: 700; }
  .band.on, #go, #another { background: var(--gold); }
  #go, #another, #backward { text-align: center; font-size: 26px; }
  #play { margin: 0 auto; width: max-content; max-width: 100%; }
  .chips, .bank { display: grid; }
  .chips button, .bank button {
    min-width: 0; min-height: 0; border: 3px solid var(--ink); border-radius: 16px;
    background: var(--card); font-weight: 800; font-size: 20px;
    padding: 4px; overflow: hidden; line-height: 1.1;
  }
  .chips button { padding: 8px; }
  .bank button.found { background: var(--found); }
  .cell.preview { background: var(--preview); }
  .cell.anchor { box-shadow: inset 0 0 0 3px var(--ring); }
  .grid { display: grid; position: relative; }
  .bands {
    position: absolute; left: 0; top: 0; overflow: visible;
    pointer-events: none; z-index: 0;
  }
  .cell {
    border: none; border-radius: 8px;
    background: transparent; font-weight: 800; padding: 0;
    position: relative; z-index: 1;
  }
  #reveal { margin-top: 8px; pointer-events: none; display: flex; justify-content: center; }
  canvas { pointer-events: none; display: block; }
  .cell.pulse { animation: ws-pulse 650ms ease-in-out 1; }
  @keyframes ws-pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .cell.pulse { animation: none; }
  }
  #selfcheck-result { white-space: pre-wrap; margin: 12px; }
</style>
</head>
<body>
<button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<div id="dead" aria-hidden="true"></div>
<p id="banner" role="status">Look at the first letter and the last letter.</p>
<section id="screen-menu" class="card">
  <h1>Word Search</h1>
  <p class="line">Look at the first letter and the last letter.</p>
  <p class="line">Ages 2 and up.</p>
  <button id="tiny" class="band on" type="button" aria-pressed="true"><b>First Words</b><small>Ages 2 to 3. Three words, across.</small></button>
  <button id="little" class="band" type="button" aria-pressed="false"><b>Word Row</b><small>Ages 4 to 5. A few more words, still across.</small></button>
  <button id="shop" class="band" type="button" aria-pressed="false"><b>Crossword</b><small>Ages 6 to 8. Across and down.</small></button>
  <button id="rush" class="band" type="button" aria-pressed="false"><b>Every Way</b><small>Ages 9 and up. Across, down, and slanted.</small></button>
  <button id="go" type="button">Let's go</button>
</section>
<div id="play" hidden></div>
<section id="screen-rest" class="card" hidden></section>
<script>
(function () {
  "use strict";
  var GAZE_URL = "ws://127.0.0.1:7081";
  var PLAY_DWELL_MS = 650;
  var MENU_DWELL_MS = 1300;
  var GAZE_FRESH_MS = 500;
  var LEAVE_MS = 280;
  var DIRS = [
    { name: "right", dr: 0, dc: 1 },
    { name: "left", dr: 0, dc: -1 },
    { name: "down", dr: 1, dc: 0 },
    { name: "up", dr: -1, dc: 0 },
    { name: "downRight", dr: 1, dc: 1 },
    { name: "downLeft", dr: 1, dc: -1 },
    { name: "upRight", dr: -1, dc: 1 },
    { name: "upLeft", dr: -1, dc: -1 }
  ];
  var DIR_BY = {};
  for (var di = 0; di < DIRS.length; di++) DIR_BY[DIRS[di].name] = DIRS[di];
  var DENY = ["ASS", "FAG", "FUK", "NIG", "SEX", "TIT", "CUM"];
  var ALPHA = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  var BACKWARD = { left: 1, up: 1, upLeft: 1, upRight: 1 };
  var DIAGONAL = { downRight: 1, downLeft: 1, upRight: 1, upLeft: 1 };

  function makeRng(seed) { return { state: seed >>> 0 }; }
  function rngUint(rng) {
    rng.state = (rng.state + 0x6D2B79F5) >>> 0;
    var t = Math.imul(rng.state ^ (rng.state >>> 15), rng.state | 1);
    var mixed = Math.imul(t ^ (t >>> 7), t | 61);
    t = (t ^ ((t + mixed) >>> 0)) >>> 0;
    return (t ^ (t >>> 14)) >>> 0;
  }
  function rngInt(rng, lo, hi) { return lo + (rngUint(rng) % (hi - lo + 1)); }
  function rngShuffle(rng, items) {
    var a = items.slice();
    for (var i = a.length - 1; i >= 1; i--) {
      var j = rngInt(rng, 0, i);
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function playSeed(clockMs, counter) {
    return Math.imul(((clockMs >>> 0) ^ Math.imul(counter >>> 0, 0x9E3779B9)) >>> 0, 0x85EBCA6B) >>> 0;
  }
  function wordHygiene(words) {
    if (!words || words.length === 0) return { ok: false, reason: "empty" };
    var seen = Object.create(null);
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      if (typeof w !== "string" || !/^[A-Z]+$/.test(w)) return { ok: false, reason: "alphabet" };
      if (seen[w]) return { ok: false, reason: "duplicate" };
      seen[w] = true;
    }
    for (var a = 0; a < words.length; a++) {
      for (var b = 0; b < words.length; b++) {
        if (a === b) continue;
        var A = words[a], B = words[b];
        var rev = B.split("").reverse().join("");
        if (B.indexOf(A) !== -1 || rev.indexOf(A) !== -1) return { ok: false, reason: "substring" };
      }
    }
    return { ok: true, reason: "" };
  }
  function spanKey(cells, cols) {
    var idx = [];
    for (var i = 0; i < cells.length; i++) idx.push(cells[i].r * cols + cells[i].c);
    idx.sort(function (x, y) { return x - y; });
    return idx.join(",");
  }
  function wordSpanList(grid, word) {
    var rows = grid.length, cols = grid[0].length, keys = Object.create(null), list = [];
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        for (var d = 0; d < DIRS.length; d++) {
          var dir = DIRS[d], cells = [], ok = true;
          for (var i = 0; i < word.length; i++) {
            var rr = r + dir.dr * i, cc = c + dir.dc * i;
            if (rr < 0 || cc < 0 || rr >= rows || cc >= cols || grid[rr][cc] !== word[i]) { ok = false; break; }
            cells.push({ r: rr, c: cc });
          }
          if (!ok) continue;
          var key = spanKey(cells, cols);
          if (!keys[key]) { keys[key] = true; list.push(cells); }
        }
      }
    }
    return list;
  }
  function wordSpans(grid, word) {
    var g = typeof grid[0] === "string" ? grid.map(function (s) { return s.split(""); }) : grid;
    return wordSpanList(g, word).length;
  }
  function gridOk(grid, words) {
    for (var i = 0; i < words.length; i++) if (wordSpanList(grid, words[i]).length !== 1) return false;
    for (var k = 0; k < DENY.length; k++) if (wordSpanList(grid, DENY[k]).length !== 0) return false;
    return true;
  }
  function cellsShare(placements, cols) {
    var owner = Object.create(null);
    for (var p = 0; p < placements.length; p++) {
      var place = placements[p], dir = DIR_BY[place.dir];
      for (var i = 0; i < place.word.length; i++) {
        var idx = (place.row + dir.dr * i) * cols + (place.col + dir.dc * i);
        var prev = owner[idx];
        if (prev && prev !== place.word) return true;
        owner[idx] = place.word;
      }
    }
    return false;
  }
  function playDirs(group, harder) {
    var names = group.directions.slice();
    if (harder && group.band === "rush") names.push("left", "up", "upLeft", "upRight");
    var out = [];
    for (var i = 0; i < names.length; i++) out.push(DIR_BY[names[i]]);
    return out;
  }
  function filler(grid, words, rng) {
    var rows = grid.length, cols = grid[0].length;
    var snapshot = grid.map(function (row) { return row.slice(); });
    var empty = [];
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) if (grid[r][c] === "") empty.push([r, c]);
    for (var n = 0; n < 30; n++) {
      for (var rr = 0; rr < rows; rr++) for (var cc = 0; cc < cols; cc++) grid[rr][cc] = snapshot[rr][cc];
      var order = rngShuffle(rng, empty);
      var ok = true;
      for (var i = 0; i < order.length; i++) {
        var er = order[i][0], ec = order[i][1];
        var letters = rngShuffle(rng, ALPHA.slice());
        var placed = false;
        for (var k = 0; k < letters.length; k++) {
          grid[er][ec] = letters[k];
          if (gridOk(grid, words)) { placed = true; break; }
        }
        if (!placed) { ok = false; break; }
      }
      if (ok && (order.length === 0 || gridOk(grid, words))) return true;
    }
    for (var r2 = 0; r2 < rows; r2++) for (var c2 = 0; c2 < cols; c2++) grid[r2][c2] = snapshot[r2][c2];
    return false;
  }
  function searchSize(words, rows, cols, dirs, seed, requireShare) {
    var rng = makeRng(seed);
    var keyed = words.map(function (w) { return { word: w, key: rngUint(rng) }; });
    keyed.sort(function (a, b) {
      if (a.word.length !== b.word.length) return b.word.length - a.word.length;
      return a.key < b.key ? -1 : a.key > b.key ? 1 : 0;
    });
    var grid = [];
    for (var r = 0; r < rows; r++) {
      var row = [];
      for (var c = 0; c < cols; c++) row.push("");
      grid.push(row);
    }
    var placements = [];
    var attempts = 0;
    function placeWord(index) {
      if (index === keyed.length) {
        if (!gridOk(grid, words)) return false;
        if (requireShare && !cellsShare(placements, cols)) return false;
        if (!filler(grid, words, rng)) return false;
        return true;
      }
      var word = keyed[index].word;
      var cands = [];
      for (var rr = 0; rr < rows; rr++) {
        for (var cc = 0; cc < cols; cc++) {
          for (var di2 = 0; di2 < dirs.length; di2++) {
            var dir = dirs[di2], cells = [], legal = true, score = 0;
            for (var i = 0; i < word.length; i++) {
              var r3 = rr + dir.dr * i, c3 = cc + dir.dc * i;
              if (r3 < 0 || c3 < 0 || r3 >= rows || c3 >= cols) { legal = false; break; }
              var cur = grid[r3][c3];
              if (cur === "") cells.push({ r: r3, c: c3, ch: word[i], write: true });
              else if (cur === word[i]) { score++; cells.push({ r: r3, c: c3, ch: word[i], write: false }); }
              else { legal = false; break; }
            }
            if (legal) cands.push({ r: rr, c: cc, dir: dir, score: score, cells: cells });
          }
        }
      }
      cands.sort(function (a, b) { return b.score - a.score; });
      var i2 = 0;
      while (i2 < cands.length) {
        var j = i2 + 1;
        while (j < cands.length && cands[j].score === cands[i2].score) j++;
        var sh = rngShuffle(rng, cands.slice(i2, j));
        for (var k = 0; k < sh.length; k++) cands[i2 + k] = sh[k];
        i2 = j;
      }
      for (var ci = 0; ci < cands.length; ci++) {
        if (attempts >= 4000) return false;
        attempts++;
        var cand = cands[ci], written = [];
        for (var wi = 0; wi < cand.cells.length; wi++) {
          var cell = cand.cells[wi];
          if (cell.write) { grid[cell.r][cell.c] = cell.ch; written.push(cell); }
        }
        placements.push({ word: word, row: cand.r, col: cand.c, dir: cand.dir.name });
        if (placeWord(index + 1)) return true;
        placements.pop();
        for (var wj = 0; wj < written.length; wj++) grid[written[wj].r][written[wj].c] = "";
      }
      return false;
    }
    if (!placeWord(0)) return null;
    return { grid: grid.map(function (row) { return row.join(""); }), placements: placements.slice() };
  }
  function acceptFallback(group, harder) {
    var hy = wordHygiene(group.words);
    if (!hy.ok) return { ok: false };
    var rows = group.fallback;
    if (!rows || !rows.length) return { ok: false };
    var cols = rows[0].length;
    for (var i = 0; i < rows.length; i++) {
      if (typeof rows[i] !== "string" || rows[i].length !== cols || !/^[A-Z]+$/.test(rows[i])) return { ok: false };
    }
    var grid = rows.map(function (s) { return s.split(""); });
    if (!gridOk(grid, group.words)) return { ok: false };
    var dirs = playDirs(group, harder);
    var placements = [];
    for (var wi = 0; wi < group.words.length; wi++) {
      var word = group.words[wi];
      var spans = wordSpanList(grid, word);
      if (spans.length !== 1) return { ok: false };
      var want = spanKey(spans[0], cols);
      var chosen = null;
      for (var d = 0; d < dirs.length && !chosen; d++) {
        var dir = dirs[d];
        for (var s = 0; s < spans[0].length && !chosen; s++) {
          var start = spans[0][s], cells = [], ok = true;
          for (var k = 0; k < word.length; k++) {
            var rr = start.r + dir.dr * k, cc = start.c + dir.dc * k;
            if (rr < 0 || cc < 0 || rr >= grid.length || cc >= cols || grid[rr][cc] !== word[k]) { ok = false; break; }
            cells.push({ r: rr, c: cc });
          }
          if (ok && spanKey(cells, cols) === want) chosen = { word: word, row: start.r, col: start.c, dir: dir.name };
        }
      }
      if (!chosen) return { ok: false };
      placements.push(chosen);
    }
    if (group.requireShare && !cellsShare(placements, cols)) return { ok: false };
    return {
      ok: true,
      grid: rows.slice(),
      placements: placements,
      fallbackUsed: true,
      directions: dirs.map(function (d) { return d.name; })
    };
  }
  function wordSearchGenerate(group, seed, harder) {
    var hy = wordHygiene(group.words);
    if (!hy.ok) return { ok: false };
    var dirs = playDirs(group, !!harder);
    var found = searchSize(group.words, group.rows, group.cols, dirs, seed >>> 0, !!group.requireShare);
    if (!found && group.band === "rush" && group.rows === 6 && group.cols === 6) {
      found = searchSize(group.words, 7, 6, dirs, seed >>> 0, !!group.requireShare);
    }
    var names = dirs.map(function (d) { return d.name; });
    if (found) {
      return { ok: true, grid: found.grid, placements: found.placements, fallbackUsed: false, directions: names };
    }
    var fb = acceptFallback(group, !!harder);
    if (fb.ok) return fb;
    return { ok: false };
  }

  function bandBase(band) {
    if (band === "tiny") return { rows: 3, cols: 5, directions: ["right"], requireShare: true };
    if (band === "little") return { rows: 5, cols: 4, directions: ["right"], requireShare: false };
    if (band === "shop") return { rows: 6, cols: 6, directions: ["right", "down"], requireShare: true };
    return { rows: 6, cols: 6, directions: ["right", "down", "downRight", "downLeft"], requireShare: true };
  }
  function makeGroup(band, id, name, words, rows, share) {
    var b = bandBase(band);
    return {
      id: id, name: name, band: band, rows: b.rows, cols: b.cols,
      words: words.slice(), directions: b.directions.slice(), fallback: rows.slice(),
      requireShare: share == null ? b.requireShare : share
    };
  }
  var PLAY = {
    tiny: [
      makeGroup("tiny", "body", "Body", ["EAR", "ARM", "EYE"], ["EARME", "STRMX", "EYEDH"]),
      makeGroup("tiny", "farm", "Farm", ["COW", "OWL", "HEN"], ["COWLE", "STRMX", "HENDH"]),
      makeGroup("tiny", "small-animals", "Small animals", ["BEE", "EEL", "CUB"], ["BEELE", "STRMX", "CUBDH"]),
      makeGroup("tiny", "play", "Play", ["CAP", "APE", "BOX"], ["CAPEE", "STRMX", "BOXDH"])
    ],
    little: [
      makeGroup("little", "snack", "Snack", ["BUN", "NUT", "PIE", "CAKE"], ["SPIE", "CAKE", "FIRB", "NUTM", "BUNR"]),
      makeGroup("little", "toys", "Toys", ["NET", "TOP", "KITE", "BALL"], ["KHYK", "KITE", "BALL", "BTOP", "HNET"]),
      makeGroup("little", "animals", "Animals", ["PUP", "PIG", "CALF", "LAMB"], ["KHYK", "CALF", "LAMB", "BPIG", "HPUP"]),
      makeGroup("little", "clothes", "Clothes", ["HAT", "TIE", "SHOE", "SOCK"], ["KHYK", "SHOE", "SOCK", "BTIE", "HHAT"]),
      makeGroup("little", "home", "Home", ["TUB", "BED", "RUG", "CRIB"], ["SRUG", "CRIB", "FIRB", "BEDM", "TUBR"]),
      makeGroup("little", "outside", "Outside", ["BUD", "DEW", "LOG", "SUN", "HAY"], ["PDEW", "HHAY", "LOGG", "XSUN", "BUDZ"])
    ],
    shop: [
      makeGroup("shop", "kitchen", "Kitchen", ["FORK", "BOWL", "OVEN", "SINK", "TRAY", "SPOON"], ["FVSYPS", "OJPHYI", "RWOVEN", "KBOWLK", "LJNKXI", "TVTRAY"]),
      makeGroup("shop", "animals", "Animals", ["FROG", "DUCK", "BEAR", "WOLF", "LION", "GOAT", "MULE"], ["OWOLFG", "BEARRG", "DUCKOG", "COMUGO", "FMULEA", "LIONHT"]),
      makeGroup("shop", "garden", "Garden", ["TREE", "LEAF", "ROSE", "VINE", "SEED", "SOIL", "BULB", "STEM"], ["VINEGU", "IKBULB", "SRTREE", "OOSEED", "ISTEMO", "LEAFFH"]),
      makeGroup("shop", "weather", "Weather", ["RAIN", "SNOW", "WIND", "HAIL", "CLOUD", "STORM"], ["BYSNOW", "LCTBMW", "CLOUDI", "IRRAIN", "ILMIXD", "QLHAIL"]),

      if (st.found.length !== 0 || st.anchor !== "1-1") fail("shop-no-diagonal locked the diagonal.");
    });
    runCase("harder-off", function () {
      if (state().harder) fail("harder-off started with Backward on.");
      start("rush");
      seed(1);
      group("orchard");
      var st = state();
      if (st.directions.join(",") !== "right,down,downRight,downLeft") fail("harder-off changed the rush directions.");
      for (var i = 0; i < st.placements.length; i++) if (BACKWARD[st.placements[i].dir]) fail("harder-off placed a backward word.");
      var p = st.placements[0];
      var dir = DIR_BY[p.dir];
      var end = (p.row + dir.dr * (p.word.length - 1)) + "-" + (p.col + dir.dc * (p.word.length - 1));
      var startId = p.row + "-" + p.col;
      tapId("cell-" + end); tapId("cell-" + startId);
      if (state().found.indexOf(p.word) === -1 || state().found.length !== 1) fail("harder-off did not lock a forward word from the far end.");
    });
    runCase("harder-on", function () {
      start("tiny");
      backward();
      if (state().harder) fail("harder-on let Backward change Tiny Tots.");
      start("rush");
      backward();
      if (!state().harder) fail("harder-on did not turn Backward on.");
      var fx = null;
      for (var i = 0; i < FIXTURES.length; i++) if (FIXTURES[i].id === "rush-animals") fx = FIXTURES[i];
      var res = wordSearchGenerate(fx, 1, true);
      var hardRows = ["KCUDHD", "CGYEGG", "WRBEOL", "BEARAI", "PNFBTO", "EWOLFN"];
      if (!res.ok || res.grid.join("|") !== hardRows.join("|")) fail("harder-on did not match the harder grid.");
      if (res.directions.join(",") !== "right,down,downRight,downLeft,left,up,upLeft,upRight") fail("harder-on did not list the eight directions.");
      for (var w = 0; w < fx.words.length; w++) if (wordSpans(res.grid, fx.words[w]) !== 1) fail("harder-on lost a one-span word.");
      var hv = new URLSearchParams(window.location.search).get("harder");
      if (hv && document.documentElement.textContent.indexOf(hv) !== -1) fail("harder-on wrote the flag value into the page.");
    });
    runCase("fallback-unique", function () {
      start("tiny"); useFallback("body");
      var body = findPlay("tiny", "body");
      if (state().grid.join("|") !== body.fallback.join("|") || !state().shared || !state().fallbackUsed) fail("fallback-unique missed the body rows.");
      start("little"); useFallback("snack");
      var snack = findPlay("little", "snack");
      var st = state();
      if (st.grid.join("|") !== snack.fallback.join("|") || st.shared || st.rows !== 5 || st.cols !== 4 || !st.fallbackUsed) fail("fallback-unique changed the snack rows.");
      for (var i = 0; i < snack.words.length; i++) if (wordSpans(st.grid, snack.words[i]) !== 1) fail("fallback-unique gave snack an extra span.");
      start("shop"); useFallback("kitchen");
      var kitchen = findPlay("shop", "kitchen");
      if (state().grid.join("|") !== kitchen.fallback.join("|") || !state().shared || !state().fallbackUsed) fail("fallback-unique missed the kitchen rows.");
      start("rush"); useFallback("orchard");
      var orchard = findPlay("rush", "orchard");
      if (state().grid.join("|") !== orchard.fallback.join("|") || !state().shared || !state().fallbackUsed) fail("fallback-unique missed the orchard rows.");
    });
    runCase("no-drag", function () {
      placeBand("tiny", "farm");
      var p = pointOf("cell-2-0");
      hold(p.nx, p.ny);
      release();
      if (state().found.length !== 0 || state().anchor !== null) fail("no-drag treated a press as a stroke.");
      tapId("cell-2-0"); tapId("cell-2-2");
      if (state().found.join(",") !== "HEN") fail("no-drag did not lock HEN with two taps.");
    });
    function columnCount(box, prefix) {
      var xs = {};
      var n = 0;
      var side = 0;
      for (var i = 0; i < box.targets.length; i++) {
        if (box.targets[i].id.indexOf(prefix) !== 0) continue;
        xs[box.targets[i].x] = true;
        side = box.targets[i].w;
        n += 1;
      }
      return { n: n, cols: Object.keys(xs).length, side: side };
    }
    runCase("cell-size", function () {
      var views = [[390, 844], [1024, 768], [300, 600], [1280, 800], [2000, 1125], [780, 493]];
      placeBand("shop", "kitchen");
      for (var i = 0; i < views.length; i++) {
        var box = targetsAt(views[i][0], views[i][1]);
        sceneFits(box, views[i][0], views[i][1], "cell-size shop");
        var shop = columnCount(box, "cell-");
        if (shop.n !== 36 || shop.cols !== 6) fail("cell-size hid a Shopkeeper column.");
        if (shop.side > 168) fail("cell-size grew a Shopkeeper cell past 168.");
      }
      var wide = columnCount(targetsAt(2000, 1125), "cell-");
      if (wide.side > 180 || wide.side < 80) fail("cell-size did not scale the wide Shopkeeper grid to the screen.");
      placeBand("tiny", "body");
      var tiny = columnCount(targetsAt(390, 844), "cell-");
      sceneFits(targetsAt(390, 844), 390, 844, "cell-size tiny");
      if (tiny.n !== 15 || tiny.cols !== 5) fail("cell-size did not show five Tiny Tots columns.");
      placeBand("little", "snack");
      var little = columnCount(targetsAt(390, 844), "cell-");
      sceneFits(targetsAt(390, 844), 390, 844, "cell-size little");
      if (little.n !== 20 || little.cols !== 4) fail("cell-size did not show four Little Pals columns.");
      placeBand("rush", "clothing");
      if (state().rows !== 7 || state().cols !== 6) fail("cell-size did not keep the Clothing rows.");
      var rush = columnCount(targetsAt(2000, 1090), "cell-");
      sceneFits(targetsAt(2000, 1090), 2000, 1090, "cell-size clothing");
      sceneFits(targetsAt(390, 844), 390, 844, "cell-size clothing narrow");
      if (rush.n !== 42 || rush.cols !== 6) fail("cell-size hid a Clothing column.");
    });
    runCase("fit-no-scroll", function () {
      var views = [[390, 844], [1024, 768], [300, 600], [1280, 800], [2000, 1125], [780, 493]];
      start("shop");
      for (var i = 0; i < views.length; i++) sceneFits(targetsAt(views[i][0], views[i][1]), views[i][0], views[i][1], "fit-no-scroll shop groups");
      var shopGroups = columnCount(targetsAt(2000, 1125), "group-");
      if (shopGroups.n !== 8 || shopGroups.side > 160) fail("fit-no-scroll grew the Shopkeeper groups.");
      start("rush");
      for (var r = 0; r < views.length; r++) sceneFits(targetsAt(views[r][0], views[r][1]), views[r][0], views[r][1], "fit-no-scroll rush groups");
      if (!targetsAt(390, 844).targets.some(function (t) { return t.id === "backward"; })) fail("fit-no-scroll hid Backward.");
      function onScreen(label) {
        render();
        var buttons = document.querySelectorAll("button");
        for (var b = 0; b < buttons.length; b++) {
          var btn = buttons[b];
          if (!buttonVisible(btn)) continue;
          var rect = btn.getBoundingClientRect();
          if (rect.left < -1 || rect.top < -1 || rect.right > window.innerWidth + 1 || rect.bottom > window.innerHeight + 1) {
            fail(label + " let " + btn.id + " leave the window.");
          }
        }
        if (document.documentElement.scrollHeight > window.innerHeight + 2) fail(label + " grew taller than the window.");
      }
      go("menu");
      onScreen("fit-no-scroll menu");
      placeBand("shop", "kitchen");
      onScreen("fit-no-scroll puzzle");
      if (document.getElementById("prev") || document.getElementById("next")) fail("fit-no-scroll drew a pager.");
      if (state().col0 !== 0) fail("fit-no-scroll moved the first column.");
      var liveCells = document.querySelectorAll(".cell");
      if (liveCells.length !== 36) fail("fit-no-scroll did not draw every Shopkeeper letter.");
      start("tiny");
      onScreen("fit-no-scroll tiny groups");
      seed(1); group("body");
      if (!tapId("bank-EAR")) fail("fit-no-scroll could not open a picture.");
      onScreen("fit-no-scroll reveal");
      forceWidth = 0;
      forceHeight = 0;
      go("menu");
    });
    runCase("group-reject", function () {
      forceWidth = 0;
      var screenBefore = state().screen;
      group("not-a-group");
      if (state().screen !== screenBefore || document.getElementById("group-not-a-group")) fail("group-reject inserted an unknown id.");
      if ((document.body.innerText || "").indexOf("not-a-group") !== -1) fail("group-reject showed the unknown id.");
      start("tiny");
      group("kitchen");
      if (state().screen !== "group" || (state().words || []).indexOf("FORK") !== -1) fail("group-reject opened a shop list on Tiny Tots.");
      start("shop");
      group("animals");
      var want = ["FROG", "DUCK", "BEAR", "WOLF", "LION", "GOAT", "MULE"].join(",");
      if (state().words.join(",") !== want) fail("group-reject opened the fixture animals list.");
    });
    runCase("cap-rest", function () {
      placeBand("tiny", "body");
      tapId("cell-0-0"); tapId("cell-0-2");
      tapId("cell-0-1"); tapId("cell-0-3");
      tapId("cell-2-0"); tapId("cell-2-2");
      var st = state();
      if (st.screen !== "rest" || st.puzzlesDone !== 1 || st.banner !== "All the words.") fail("cap-rest did not rest after the first puzzle.");
      var ids = centers().map(function (c) { return c.id; });
      if (ids.indexOf("another") === -1) fail("cap-rest hid Another.");
      if ((restEl.innerText || "").toLowerCase().indexOf("grade") !== -1) fail("cap-rest showed a grade.");
      var band = st.level;
      var t0 = arm("another");
      step(t0 + 600);
      if (state().screen !== "rest") fail("cap-rest left rest at 600 ms.");
      tick = t0 + 600;
      releaseLook();
      var t1 = arm("another");
      step(t1 + 1300);
      tick = t1 + 1300;
      if (state().screen !== "group" || state().level !== band || state().puzzlesDone !== 1) fail("cap-rest did not return to the same band.");
      seed(1); group("body");
      tapId("cell-0-0"); tapId("cell-0-2");
      tapId("cell-0-1"); tapId("cell-0-3");
      tapId("cell-2-0"); tapId("cell-2-2");
      st = state();
      if (st.puzzlesDone !== 2 || document.getElementById("another")) fail("cap-rest offered Another after the second puzzle.");
      var before = st.screen;
      another();
      if (state().screen !== before) fail("cap-rest let a direct Another call change the screen.");
      var banned = ["miss", "score", "clock", "wrongs", "lives", "rank", "msLeft"];
      for (var i = 0; i < banned.length; i++) if (banned[i] in st) fail("cap-rest stored a " + banned[i] + " field.");
    });
    runCase("pulse-once", function () {
      placeBand("tiny", "body");
      releaseLook();
      var startAt = idleSince;
      step(startAt + 19999);
      if (state().pulse !== null || state().anchor !== null) fail("pulse-once pulsed too early.");
      step(startAt + 20000);
      if (state().pulse !== "0-0" || state().found.length !== 0 || state().anchor !== null) fail("pulse-once missed the first letter.");
      step(startAt + 20650);
      if (state().pulse !== null) fail("pulse-once kept the pulse.");
      step(startAt + 40650);
      tick = startAt + 40650;
      if (state().pulse !== null) fail("pulse-once pulsed a second time.");
    });
    runCase("seed-pin", function () {
      placeBand("tiny", "body");
      var before = state().grid.join("|");
      seed(4);
      if (state().grid.join("|") !== before) fail("seed-pin changed the grid already on screen.");
      var body = findPlay("tiny", "body");
      group("body");
      var gen4 = wordSearchGenerate(body, 4, state().harder);
      if (state().grid.join("|") !== gen4.grid.join("|")) fail("seed-pin did not use seed 4.");
      if (pin !== null) fail("seed-pin kept the pin.");
      var counterBefore = playCounter;
      var realNow = Date.now;
      Date.now = function () { return 123456789; };
      try { group("body"); }
      finally { Date.now = realNow; }
      var expectSeed = playSeed(123456789, counterBefore);
      var genU = wordSearchGenerate(body, expectSeed, state().harder);
      if (state().grid.join("|") !== genU.grid.join("|")) fail("seed-pin reused the old pin.");
      seed(1); group("body");
      if (state().grid.join("|") !== body.fallback.join("|")) fail("seed-pin did not return the Body rows.");
    });
    runCase("no-remote", function () {
      var all = document.getElementsByTagName("*");
      for (var i = 0; i < all.length; i++) {
        if (all[i].tagName === "IMG") fail("no-remote found an image file.");
        var src = all[i].getAttribute("src");
        var href = all[i].getAttribute("href");
        if ((src && /^[a-z]+:/i.test(src)) || (href && /^[a-z]+:/i.test(href))) fail("no-remote found a network URL.");
      }
      var authored = Object.create(null);
      var bands = ["tiny", "little", "shop", "rush"];
      for (var b = 0; b < bands.length; b++) for (var g = 0; g < PLAY[bands[b]].length; g++) for (var w = 0; w < PLAY[bands[b]][g].words.length; w++) authored[PLAY[bands[b]][g].words[w]] = true;
      for (var f = 0; f < FIXTURES.length; f++) for (var fw = 0; fw < FIXTURES[f].words.length; fw++) authored[FIXTURES[f].words[fw]] = true;
      for (var u = 0; u < utterances.length; u++) if (!authored[utterances[u]]) fail("no-remote spoke a word that was not authored.");
    });
    runCase("family-no-storage", function () {
      if (storageCalls !== 0) fail("family-no-storage saw a storage write.");
      if (storageReadable) {
        if (window.localStorage.getItem("word-search") !== null) fail("family-no-storage found a word-search key.");
        if (window.localStorage.getItem("pop-pals-v1") !== popBefore) fail("family-no-storage changed pop-pals-v1.");
      }
    });
    forceWidth = 0;
    forceHeight = 0;
    return { ok: failures.length === 0, failures: failures };
  }

  window.wordSearch = {
    start: start, go: go, look: look, releaseLook: releaseLook, hold: hold, release: release,
    tap: tap, step: step, dwell: dwell, eyes: eyes, centers: centers, targetsAt: targetsAt,
    state: state, seed: seed, selfCheck: selfCheck, group: group, anchor: anchor, commit: commit,
    pressCell: pressCell, reveal: reveal, useFallback: useFallback, backward: backward
  };
  render();
  var params = new URLSearchParams(window.location.search);
  function hasFlag(name) { return params.has(name); }
  if (hasFlag("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) { try { gazeSock.close(); } catch (e) {} gazeSock = null; }
    var result;
    try { result = selfCheck(); }
    catch (e) { result = { ok: false, failures: ["The self-check stopped on an error."] }; }
    var pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
    return;
  }
  if (hasFlag("harder")) harder = true;
  if (hasFlag("rush")) start("rush");
  else if (hasFlag("play")) start("tiny");
  connectGaze();
  function frame(now) {
    if (checking) return;
    step(now);
    window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
