<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>Feelings and Choices</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; touch-action: none; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 28; pointer-events: none;
    background: var(--card); border-radius: 999px; padding: 6px 8px;
    font-weight: 800; font-size: 16px; line-height: 20px;
    text-align: center; overflow: hidden;
  }
  #banner {
    position: fixed; z-index: 25; pointer-events: none; margin: 0;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 4px 12px; font-size: 16px; font-weight: 800;
    text-align: center; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #menu-card, #rest-card {
    position: fixed; z-index: 2; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #screen-menu, #screen-rest, #play, #menu-copy, #rest-line, #stage, #bubble, h1, p, b, small {
    pointer-events: none;
  }
  #menu-copy, #rest-line {
    position: fixed; z-index: 24; margin: 0; text-align: center; overflow: hidden;
  }
  #menu-copy h1 { margin: 0; font-size: 26px; line-height: 28px; }
  #menu-copy p { margin: 0; font-size: 14px; line-height: 16px; }
  #rest-line {
    font-size: 28px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  #mute, #full, #back, #lets-go, #tiny, #little, #shop, #rush, #another, #play button {
    position: fixed; z-index: 30; pointer-events: auto;
  }
  #mute, #full, #back {
    z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1; font-size: 15px; line-height: 1.1;
    padding: 4px; overflow: hidden;
  }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; display: block; }
  #tiny, #little, #shop, #rush {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; color: var(--ink); text-align: left;
    padding: 4px 10px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  #tiny b, #little b, #shop b, #rush b { display: block; font-size: 18px; line-height: 20px; }
  #tiny small, #little small, #shop small, #rush small {
    display: block; font-size: 12px; line-height: 14px; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go, #another {
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink); font-weight: 800;
    box-shadow: 0 5px 0 var(--sun-d); font-size: 26px;
  }
  #stage {
    position: fixed; z-index: 4; pointer-events: none;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }
  #bo-svg { width: 100%; flex: 1 1 auto; min-height: 0; }
  #bubble {
    flex: 0 0 72px; width: calc(100% - 16px); margin: 0 8px 8px;
    background: var(--card); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; overflow: hidden; padding: 4px 8px;
  }
  #bubble-text { margin: 0; font-size: 18px; font-weight: 800; line-height: 22px; }
  #bubble-svg { width: 64px; height: 64px; }
  #play button {
    border: 4px solid var(--ink); border-radius: 22px;
    background: var(--card); color: var(--ink);
    padding: 4px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #play button svg { width: 72%; flex: 1 1 auto; min-height: 0; pointer-events: none; }
  #play button span {
    font-size: 20px; font-weight: 800; line-height: 22px;
    pointer-events: none; max-width: 100%;
  }
  @media (prefers-reduced-motion: reduce) {
    #bo-svg { animation: none; }
  }
</style>
</head>
<body>
<button id="mute" type="button" aria-label="Mute sound">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8l6 8"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner">Look at a face to answer.</p>
<section id="screen-menu">
  <div id="menu-card"></div>
  <div id="menu-copy">
    <h1>Feelings and Choices</h1>
    <p>Look at a face or picture. Bo listens.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>Faces</b><small>Ages 2 to 3. Two big faces.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Talk with Bo</b><small>Ages 4 to 5. Three choices.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Bo's Day</b><small>Ages 6 to 8. Four choices.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Bo's Friend</b><small>Ages 9 and up. Four choices and a follow-up.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden>
  <div id="stage">
    <svg id="bo-svg" viewBox="0 0 200 220"></svg>
    <div id="bubble" data-kind="face">
      <svg id="bubble-svg" viewBox="0 0 100 100"></svg>
      <p id="bubble-text" hidden></p>
    </div>
  </div>
  <button id="ans-0" type="button" hidden><svg viewBox="0 0 100 100"></svg><span></span></button>
  <button id="ans-1" type="button" hidden><svg viewBox="0 0 100 100"></svg><span></span></button>
  <button id="ans-2" type="button" hidden><svg viewBox="0 0 100 100"></svg><span></span></button>
  <button id="ans-3" type="button" hidden><svg viewBox="0 0 100 100"></svg><span></span></button>
</div>
<section id="screen-rest" hidden>
  <div id="rest-card"></div>
  <p id="rest-line">Thanks for telling Bo.</p>
  <button id="another" type="button">Another</button>
</section>
<script>
(function () {
  "use strict";
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const REACT_MS = 2500;
  const BAND_IDS = ["tiny", "little", "shop", "rush"];
  const INK = "#2c2416";
  const SUN = "#ffc857";
  const CREAM = "#fffdf6";
  const POSES = ["smile", "sit", "breathe", "close", "yawn", "relax", "laugh", "gasp", "hug", "eat", "play", "wear", "walk", "listen"];
  const HELP_FEEL = { sad: 1, mad: 1, scared: 1, tired: 1 };
  const FACES = {
    happy: { word: "Happy", face: "big smile, open eyes" },
    sad: { word: "Sad", face: "down-turned mouth, one tear" },
    mad: { word: "Mad", face: "slanted brows, flat mouth" },
    scared: { word: "Scared", face: "round eyes, small open mouth, raised brows" },
    tired: { word: "Tired", face: "half-closed eyes, small yawn" },
    silly: { word: "Silly", face: "tongue out, one eye winking" },
    calm: { word: "Calm", face: "closed curved eyes, soft smile" },
    surprised: { word: "Surprised", face: "big round eyes, O mouth" }
  };
  const WORDS = {
    apple: "Apple", banana: "Banana", cracker: "Cracker", carrot: "Carrot",
    ball: "Ball", bubbles: "Bubbles", blocks: "Blocks", swing: "Swing",
    hat: "Hat", boots: "Boots", scarf: "Scarf",
    park: "Park", beach: "Beach", library: "Library", farm: "Farm",
    drums: "Drums", bells: "Bells", dance: "Dance", quiet: "Quiet",
    hug: "Hug", rest: "Rest", snack: "Snack", music: "Music"
  };
  const QUESTIONS = {
    feel: { ask: "How do you feel?", bubble: "face", kind: "feeling",
      answers: { tiny: ["happy", "sad"], little: ["happy", "sad", "tired"], shop: ["happy", "sad", "mad", "scared"], rush: ["happy", "sad", "mad", "scared"] },
      reactions: {
        happy: { pose: "smile", text: "Bo is happy too!" },
        sad: { pose: "sit", text: "It's okay to feel sad. Bo sits with you." },
        mad: { pose: "breathe", text: "Feeling mad is okay. Bo takes a big breath with you." },
        scared: { pose: "close", text: "Bo is right here with you." },
        tired: { pose: "yawn", text: "Bo yawns too. Rest is good." } } },
    feelNow: { ask: "How do you feel now?", bubble: "face", kind: "feeling",
      answers: { rush: ["calm", "silly", "tired", "surprised"] },
      reactions: {
        calm: { pose: "relax", text: "Calm is a nice feeling." },
        silly: { pose: "laugh", text: "Bo makes a silly face back!" },
        tired: { pose: "yawn", text: "Bo yawns too. Rest is good." },
        surprised: { pose: "gasp", text: "Wow! Bo is surprised too." } } },
    help: { ask: "What would help?", bubble: "heart", kind: "choice",
      answers: { rush: ["hug", "rest", "snack", "music"] },
      reactions: {
        hug: { pose: "hug", text: "Here is a big hug from Bo." },
        rest: { pose: "sit", text: "Let's rest for a little while." },
        snack: { pose: "eat", text: "A snack can help. Bo shares an apple." },
        music: { pose: "listen", text: "Bo plays a soft song." } } },
    snack: { ask: "What snack would you like?", bubble: "apple", kind: "choice",
      answers: { tiny: ["apple", "banana"], little: ["apple", "banana", "cracker"], shop: ["apple", "banana", "cracker", "carrot"], rush: ["apple", "banana", "cracker", "carrot"] },
      reactions: {
        apple: { pose: "eat", text: "Crunch! Bo loves apples too." },
        banana: { pose: "eat", text: "Bo peels a banana. Yum." },
        cracker: { pose: "eat", text: "Bo shares the crackers." },
        carrot: { pose: "eat", text: "Crunchy carrots. Good choice." } } },
    play: { ask: "What should we play?", bubble: "ball", kind: "choice",
      answers: { tiny: ["ball", "bubbles"], little: ["ball", "bubbles", "blocks"], shop: ["ball", "bubbles", "blocks", "swing"], rush: ["ball", "bubbles", "blocks", "swing"] },
      reactions: {
        ball: { pose: "play", text: "Bo rolls the ball to you." },
        bubbles: { pose: "play", text: "Bo blows lots of bubbles." },
        blocks: { pose: "play", text: "Bo builds a tall tower." },
        swing: { pose: "play", text: "Whee! Bo swings high." } } },
    wear: { ask: "What should Bo wear today?", bubble: "hat", kind: "choice",
      answers: { little: ["hat", "boots", "scarf"] },
      reactions: {
        hat: { pose: "wear", text: "Bo puts on the hat. So nice!" },
        boots: { pose: "wear", text: "Rain boots! Bo looks for puddles." },
        scarf: { pose: "wear", text: "A cozy scarf for Bo." } } },
    go: { ask: "Where should we go?", bubble: "house", kind: "choice",
      answers: { shop: ["park", "beach", "library", "farm"], rush: ["park", "beach", "library", "farm"] },
      reactions: {
        park: { pose: "walk", text: "Off to the park!" },
        beach: { pose: "walk", text: "Bo packs a bucket for the beach." },
        library: { pose: "walk", text: "Bo picks a book to share." },
        farm: { pose: "walk", text: "Bo says hello to the cows." } } },
    music: { ask: "What music should we play?", bubble: "note", kind: "choice",
      answers: { shop: ["drums", "bells", "dance", "quiet"] },
      reactions: {
        drums: { pose: "listen", text: "Boom, boom! Bo taps along." },
        bells: { pose: "listen", text: "Soft bells. Lovely." },
        dance: { pose: "laugh", text: "Bo dances!" },
        quiet: { pose: "relax", text: "Quiet is nice too." } } }
  };
  const VISITS = {
    tiny: ["feel", "snack", "play"],
    little: ["feel", "snack", "play", "wear"],
    shop: ["feel", "snack", "play", "go", "music"],
    rush: ["feel", "snack", "play", "go", "feelNow"]
  };
  const MENU_BANNER = "Look at a face to answer.";
  const REST_BANNER = "Thanks for telling Bo.";

  const SVG_NS = "http://www.w3.org/2000/svg";
  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const backBtn = document.getElementById("back");
  const eyesEl = document.getElementById("eyes");
  const gazeEl = document.getElementById("gaze");
  const bannerEl = document.getElementById("banner");
  const menuEl = document.getElementById("screen-menu");
  const menuCard = document.getElementById("menu-card");
  const menuCopy = document.getElementById("menu-copy");
  const playEl = document.getElementById("play");
  const restEl = document.getElementById("screen-rest");
  const restCard = document.getElementById("rest-card");
  const restLine = document.getElementById("rest-line");
  const stageEl = document.getElementById("stage");
  const boSvg = document.getElementById("bo-svg");
  const bubbleEl = document.getElementById("bubble");
  const bubbleSvg = document.getElementById("bubble-svg");
  const bubbleText = document.getElementById("bubble-text");
  const soundOn = document.getElementById("sound-on");
  const soundOff = document.getElementById("sound-off");

  let screen = "menu";
  let level = "tiny";
  let muted = false;
  let qIndex = 0;
  let shown = [];
  let phase = "ask";
  let picked = null;
  let feelAnswer = null;
  let reactAcc = 0;
  let reactMark = -1;
  let pin = null;
  let counter = 1;
  let checking = false;
  let suppressReconnect = false;
  let clock = 0;
  let clockSet = false;
  let ac = null;
  let master = null;
  let boKey = "";
  let bubbleKey = "";
  let layoutFault = "";

  let gazeSock = null;
  let gazeTimer = 0;
  let gazeBuf = new Uint8Array(0);
  let gazeWarp = null;
  let gazeHold = null;
  let refreshHold = false;
  let haveSmooth = false;
  let smoothed = null;
  let gazePoint = null;
  let gazeAt = 0;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;
  let dwellMs = PLAY_DWELL_MS;
  let dwellOffAt = 0;
  let pointerDown = false;
  let armedId = null;

  function svgEl(name, attrs) {
    const node = document.createElementNS(SVG_NS, name);
    if (attrs) {
      const keys = Object.keys(attrs);
      for (let i = 0; i < keys.length; i++) node.setAttribute(keys[i], String(attrs[keys[i]]));
    }
    return node;
  }
  function clearNode(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }
  function labelOf(id) {
    if (FACES[id]) return FACES[id].word;
    return WORDS[id] || id;
  }
  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  function knownBand(band) { return BAND_IDS.indexOf(band) >= 0; }
  function visitPlan() {
    if (!knownBand(level)) return [];
    const list = VISITS[level].slice();
    if (level === "rush" && feelAnswer && HELP_FEEL[feelAnswer]) {
      const at = list.indexOf("feel");
      if (at >= 0) list.splice(at + 1, 0, "help");
    }
    return list;
  }
  function currentQuestion() {
    const plan = visitPlan();
    if (screen !== "play" || qIndex < 0 || qIndex >= plan.length) return null;
    return QUESTIONS[plan[qIndex]] || null;
  }
  function liveReaction() {
    if (screen !== "play" || phase !== "react" || !picked) return null;
    const q = currentQuestion();
    return q && q.reactions[picked] ? q.reactions[picked] : null;
  }
  function livePose() {
    const react = liveReaction();
    return react ? react.pose : "smile";
  }
  function makeRng(seed) {
    let state = seed >>> 0;
    return function () {
      state = (state + 0x6D2B79F5) >>> 0;
      let t = Math.imul(state ^ (state >>> 15), state | 1);
      t = t ^ (t + Math.imul(t ^ (t >>> 7), t | 61));
      return (t ^ (t >>> 14)) >>> 0;
    };
  }
  function rngInt(next, lo, hi) { return lo + (next() % (hi - lo + 1)); }
  function rngShuffle(next, items) {
    const a = items.slice();
    for (let i = a.length - 1; i >= 1; i--) {
      const j = rngInt(next, 0, i);
      const tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }
  function playSeed(clockMs, n) {
    return (Math.imul(((clockMs >>> 0) ^ Math.imul(n >>> 0, 0x9E3779B9)), 0x85EBCA6B)) >>> 0;
  }
  function takePageSeed() {
    let s;
    if (pin !== null) s = pin;
    else if (checking) s = 1;
    else s = playSeed(Date.now(), counter);
    pin = null;
    counter += 1;
    return s >>> 0;
  }

  function bannerText() {
    if (screen === "menu") return MENU_BANNER;
    if (screen === "rest") return REST_BANNER;
    if (phase === "react") {
      if (level === "tiny") return "Bo is with you.";
      const react = liveReaction();
      return react ? react.text : "Bo is with you.";
    }
    if (level === "tiny") return "Look at a picture.";
    const q = currentQuestion();
    return q ? q.ask : "Look at a picture.";
  }

  function dealQuestion() {
    const plan = visitPlan();
    const q = QUESTIONS[plan[qIndex]];
    const list = q.answers[level].slice();
    shown = rngShuffle(makeRng(takePageSeed()), list);
    phase = "ask";
    picked = null;
    reactAcc = 0;
    reactMark = -1;
  }
  function go(id) {
    if (id !== "menu" && id !== "play" && id !== "rest") {
      render();
      return;
    }
    screen = id;
    if (id !== "play") {
      phase = "ask";
      picked = null;
      feelAnswer = null;
      shown = [];
      reactAcc = 0;
      reactMark = -1;
      qIndex = 0;
    }
    clearDwell();
    render();
  }
  function highlight(band) {
    if (!knownBand(band)) {
      render();
      return;
    }
    level = band;
    render();
  }
  function start(band) {
    if (!knownBand(band)) {
      render();
      return;
    }
    level = band;
    feelAnswer = null;
    qIndex = 0;
    reactAcc = 0;
    dealQuestion();
    go("play");
  }
  function another() {
    if (screen !== "rest") {
      render();
      return;
    }
    start(level);
  }
  function finishReact() {
    reactAcc = 0;
    reactMark = -1;
    qIndex += 1;
    if (qIndex >= visitPlan().length) {
      shown = [];
      picked = null;
      phase = "ask";
      go("rest");
      return;
    }
    dealQuestion();
    clearDwell();
    render();
  }
  function pick(id) {
    if (screen !== "play" || phase !== "ask") {
      render();
      return;
    }
    if (shown.indexOf(id) < 0) {
      render();
      return;
    }
    const q = currentQuestion();
    const react = q && q.reactions[id];
    if (!react) {
      render();
      return;
    }
    picked = id;
    phase = "react";
    reactAcc = 0;
    reactMark = clock;
    const plan = visitPlan();
    if (level === "rush" && plan[qIndex] === "feel") feelAnswer = id;
    playPick();
    playFeel(id);
    render();
  }

  function state() {
    const snap = {
      level: level,
      screen: screen,
      banner: bannerText(),
      muted: muted,
      question: screen === "play" && visitPlan()[qIndex] ? visitPlan()[qIndex] : null,
      answers: screen === "play" && phase === "ask" ? shown.slice() : [],
      phase: screen === "play" ? phase : null,
      pose: screen === "play" ? livePose() : null,
      picked: screen === "play" && phase === "react" ? picked : null,
      index: screen === "play" ? qIndex : 0
    };
    render();
    return snap;
  }

  function intersects(a, b) {
    if (!a || !b) return false;
    return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  }
  function eyesBox(w) {
    const chrome = chromeBoxes(w);
    if (!chrome) return { x: 8, y: 26, w: 72, h: 36 };
    return chrome.eye;
  }
  function chromeBoxes(w) {
    const y = 8;
    const bh = 72;
    if (w < 320) return null;
    const full = { id: "full", x: w - 8 - 72, y: y, w: 72, h: bh };
    const mute = { id: "mute", x: full.x - 8 - 72, y: y, w: 72, h: bh };
    const back = { id: "back", x: 8, y: y, w: 72, h: bh };
    let eyeX = mute.x - 8 - 72;
    if (eyeX >= back.x + back.w + 8) {
      back.w = Math.min(200, eyeX - 8 - back.x);
    } else {
      eyeX = back.x + back.w + 4;
      if (eyeX + 72 > mute.x - 4) return null;
    }
    const eye = { x: eyeX, y: 26, w: 72, h: 36 };

      if (state().question !== "feel") fail("follow-up", "Rush did not start on feel.");
      pick("sad");
      if (state().phase !== "react" || state().pose !== "sit") fail("follow-up", "Sad did not sit with Bo.");
      endReact();
      if (state().question !== "help") fail("follow-up", "Sad did not ask what would help.");
      if (state().answers.length !== 4) fail("follow-up", "Help did not show four answers.");
      pick("hug");
      endReact();
      if (state().question !== "snack") fail("follow-up", "Help did not return to the visit.");
      resetInput();
      seed(1);
      start("rush");
      pick("happy");
      endReact();
      if (state().question !== "snack") fail("follow-up", "Happy asked a follow-up.");
      if (state().question === "help") fail("follow-up", "Happy asked what would help.");
    });
    run("no-storage", function () {
      resetInput();
      seed(1);
      start("little");
      let guard = 0;
      let last = "";
      while (state().screen === "play" && guard < 8) {
        last = pickSafe();
        endReact();
        guard += 1;
      }
      if (state().screen !== "rest") fail("no-storage", "The visit did not rest.");
      const snap = state();
      if (snap.picked || (snap.answers && snap.answers.length) || snap.question) fail("no-storage", "An answer stayed after rest.");
      if (snap.banner !== REST_BANNER) fail("no-storage", "Rest did not thank Bo.");
      const json = JSON.stringify(snap);
      if (last && json.indexOf(last) >= 0) fail("no-storage", "The last answer was still in state.");
      if (writes !== 0) fail("no-storage", "The visit wrote storage.");
    });
    run("sizes", function () {
      const views = [[390, 700], [1024, 768]];
      for (let b = 0; b < BAND_IDS.length; b++) {
        resetInput();
        seed(1);
        start(BAND_IDS[b]);
        for (let v = 0; v < views.length; v++) {
          const w = views[v][0];
          const h = views[v][1];
          const lay = targetsAt(w, h);
          if (!lay.ok) fail("sizes", BAND_IDS[b] + " at " + w + " by " + h + " was not ok (" + layoutFault + ").");
          const cards = (lay.targets || []).filter(function (t) { return String(t.id).indexOf("ans-") === 0; });
          if (!cards.length) fail("sizes", "No answer cards at " + w + ".");
          for (let i = 0; i < cards.length; i++) {
            const box = cards[i];
            const floor = w >= 1000 ? 180 : 112;
            if (Math.min(box.w, box.h) < floor) fail("sizes", box.id + " was under " + floor + " at " + w + " by " + h + ".");
            if (box.x < 16 || box.y < 16 || box.x + box.w > w - 16 || box.y + box.h > h - 16) {
              fail("sizes", box.id + " crossed the inset at " + w + " by " + h + ".");
            }
          }
        }
      }
    });
    run("eyes-gap", function () {
      resetInput();
      function check(where) {
        const views = [[390, 700], [1024, 768]];
        for (let v = 0; v < views.length; v++) {
          const w = views[v][0];
          const h = views[v][1];
          const plan = layoutAll(w, h);
          if (!plan) {
            fail("eyes-gap", where + " at " + w + " by " + h + " had no layout (" + layoutFault + ").");
            continue;
          }
          const eye = plan.eyes;
          if (Math.abs(eye.y - (h - 48)) < 1) fail("eyes-gap", "Eyes used the bottom slot at " + w + " by " + h + ".");
          const blocks = plan.targets.slice();
          if (plan.menu) blocks.push(plan.menu.card, plan.menu.title);
          if (plan.rest) blocks.push(plan.rest.card);
          if (plan.banner) blocks.push(plan.banner);
          if (plan.stage) blocks.push(plan.stage);
          for (let i = 0; i < blocks.length; i++) {
            if (intersects(eye, blocks[i])) fail("eyes-gap", where + " Eyes sat on " + (blocks[i].id || "block") + " at " + w + " by " + h + ".");
          }
        }
        look(0.5, 0.02);
        step(clock || 10000);
        const placed = eyesEl.getBoundingClientRect();
        const live = eyesBox(window.innerWidth);
        if (eyesEl.hidden) fail("eyes-gap", "Eyes was hidden while a look was held during " + where + ".");
        if (Math.abs(placed.left - live.x) > 1 || Math.abs(placed.top - live.y) > 1 || Math.abs(placed.width - live.w) > 1 || Math.abs(placed.height - live.h) > 1) {
          fail("eyes-gap", "The running layout did not place Eyes from eyesBox during " + where + ".");
        }
        const buttons = document.querySelectorAll("button");
        for (let i = 0; i < buttons.length; i++) {
          const btn = buttons[i];
          if (!buttonVisible(btn)) continue;
          const r = btn.getBoundingClientRect();
          const box = { x: r.left, y: r.top, w: r.width, h: r.height };
          if (intersects(box, { x: placed.left, y: placed.top, w: placed.width, h: placed.height })) {
            fail("eyes-gap", "Eyes hit the " + btn.id + " button at " + window.innerWidth + " by " + window.innerHeight + ".");
          }
        }
        releaseLook();
      }
      go("menu");
      check("menu");
      for (let b = 0; b < BAND_IDS.length; b++) {
        seed(1);
        start(BAND_IDS[b]);
        check(BAND_IDS[b]);
      }
      go("rest");
      check("rest");
    });
    run("card-click", function () {
      resetInput();
      seed(1);
      start("tiny");
      const ans = state().answers[0];
      const btn = document.getElementById("ans-0");
      if (!btn || btn.getAttribute("data-answer") !== ans) fail("card-click", "The first card was missing.");
      else {
        const rect = btn.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        const point = { bubbles: true, cancelable: true, clientX: x, clientY: y, button: 0, view: window };
        btn.dispatchEvent(new PointerEvent("pointerdown", {
          bubbles: true, cancelable: true, clientX: x, clientY: y, button: 0, view: window,
          pointerId: 1, pointerType: "mouse", isPrimary: true
        }));
        btn.dispatchEvent(new PointerEvent("pointerup", {
          bubbles: true, cancelable: true, clientX: x, clientY: y, button: 0, view: window,
          pointerId: 1, pointerType: "mouse", isPrimary: true
        }));
        btn.dispatchEvent(new MouseEvent("click", point));
        if (!btn.isConnected || document.getElementById("ans-0") !== btn) fail("card-click", "The click replaced the card.");
        if (state().phase !== "react" || state().picked !== ans || state().pose !== QUESTIONS.feel.reactions[ans].pose) {
          fail("card-click", "A click did not do the same act as a tap.");
        }
      }
    });
    run("family-plain-state", function () {
      const before = JSON.stringify(state());
      start("nope");
      go("sideways");
      if (JSON.stringify(state()) !== before) fail("family-plain-state", "An unknown band or screen changed the state.");
      const end = state();
      if (!("level" in end) || !("screen" in end) || !("banner" in end) || !("muted" in end)) {
        fail("family-plain-state", "level, screen, banner, or muted was missing.");
      }
    });
    try { assertJunk("at the end"); }
    catch (err) { fail("family-query-inert", err && err.message ? err.message : "The junk check threw."); }
    try {
      if (writes !== 0) fail("family-no-storage", "The page called setItem or removeItem.");
      if (storeLen !== null && localStorage.length !== storeLen) fail("family-no-storage", "localStorage gained a key.");
      if (storeLen !== null && localStorage.getItem("pop-pals-v1") !== pop) fail("family-no-storage", "pop-pals-v1 changed.");
    } catch (err) {
      fail("family-no-storage", "Storage could not be read.");
    }
    if (speakCalls !== 0) fail("no-speech", "Speech was called.");
    try {
      if (origSet) localStorage.setItem = origSet;
      if (origRem) localStorage.removeItem = origRem;
      if (origSpeak && window.speechSynthesis) window.speechSynthesis.speak = origSpeak;
    } catch (err) {}
    return { ok: failures.length === 0, failures: failures };
  }

  window.feelingsAndChoices = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    pick: pick,
    selfCheck: selfCheck
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let result;
    try { result = selfCheck(); }
    catch (err) {
      result = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] };
    }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("rush")) start("rush");
    else if (params.has("play")) start("tiny");
    connectGaze();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
