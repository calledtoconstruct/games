<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>Star Pictures</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; touch-action: none; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; pointer-events: none; z-index: 1;
  }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 28; pointer-events: none;
    background: var(--card); border-radius: 999px; padding: 8px 12px;
    font-weight: 800; font-size: 16px;
  }
  #banner {
    position: fixed; z-index: 25; pointer-events: none;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 6px 14px; font-size: 18px; font-weight: 800;
    text-align: center;
  }
  #menu-card, #rest-card {
    position: fixed; z-index: 2; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #screen-menu, #screen-rest, #play, #dots, #menu-copy, #rest-line, h1, p, b, small {
    pointer-events: none;
  }
  #dots { position: fixed; inset: 0; z-index: 4; }
  #dots i {
    position: fixed; z-index: 4; pointer-events: none;
    color: #f4f0d8; font-style: normal; font-weight: 800;
    font-size: 18px; line-height: 18px; width: 18px; height: 18px;
    text-align: center;
  }
  #dots b {
    position: fixed; z-index: 4; pointer-events: none;
    background: #fff; border-radius: 50%;
  }
  #menu-copy, #rest-line {
    position: fixed; z-index: 24; margin: 0; text-align: center; overflow: hidden;
  }
  #menu-copy h1 { margin: 0; font-size: 26px; line-height: 28px; }
  #menu-copy p { margin: 0; font-size: 14px; line-height: 16px; }
  #rest-line { font-size: 26px; font-weight: 800; line-height: 32px; }
  #mute, #full, #back, #lets-go, #tiny, #little, #shop, #rush, #another, #play button {
    position: fixed; z-index: 30; pointer-events: auto;
  }
  #mute, #full, #back {
    z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1; font-size: 15px; line-height: 1.1;
    padding: 4px;
  }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; display: block; }
  #tiny, #little, #shop, #rush {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; color: var(--ink); text-align: left;
    padding: 4px 10px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  #tiny b, #little b, #shop b, #rush b { display: block; font-size: 18px; line-height: 20px; }
  #tiny small, #little small, #shop small, #rush small {
    display: block; font-size: 12px; line-height: 14px; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go, #another {
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink); font-weight: 800;
    box-shadow: 0 5px 0 var(--sun-d); font-size: 26px;
  }
  #play button.star {
    border: none; padding: 0; background: transparent;
    color: var(--ink); font-weight: 800; font-size: 28px; line-height: 1;
  }
  #play button.star svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; display: block;
  }
  #play button.star span {
    position: absolute; inset: 0; display: grid; place-items: center;
    pointer-events: none; transform: translateY(-6px);
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<button id="mute" type="button" aria-label="Mute sound">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8l6 8"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner">Pick a night sky.</p>
<section id="screen-menu">
  <div id="menu-card"></div>
  <div id="menu-copy">
    <h1>Star Pictures</h1>
    <p>Look at the big star and a line joins it.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>Twinkle</b><small>Ages 2 to 3. A few big stars.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Starry</b><small>Ages 4 to 5. Count the stars.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Night Sky</b><small>Ages 6 to 8. More stars.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Star Map</b><small>Ages 9 and up. Letters and big pictures.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden><div id="dots"></div></div>
<section id="screen-rest" hidden>
  <div id="rest-card"></div>
  <p id="rest-line">The sky is full of pictures.</p>
  <button id="another" type="button">Another</button>
</section>
<script>
(function () {
  "use strict";
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const BAND_IDS = ["tiny", "little", "shop", "rush"];
  const LINE_MS = 300;
  const NAME_MS = 1800;
  const SCALE_SEMIS = [0, 2, 4, 5, 7, 9, 11, 12];
  const TWINKLES = [
    [0.08, 0.22], [0.18, 0.16], [0.33, 0.2], [0.62, 0.14],
    [0.8, 0.18], [0.92, 0.28], [0.12, 0.78], [0.22, 0.9],
    [0.84, 0.72], [0.93, 0.88], [0.7, 0.92], [0.48, 0.12]
  ];

  const PICTURES = {
    tent:      { name: "Tent",      fill: "#E69F00", points: [[0.5,0.15],[0.88,0.85],[0.12,0.85]] },
    kite:      { name: "Kite",      fill: "#D55E00", points: [[0.5,0.1],[0.8,0.45],[0.5,0.9],[0.2,0.45]] },
    house:     { name: "House",     fill: "#E69F00", points: [[0.2,0.9],[0.2,0.45],[0.5,0.15],[0.8,0.45],[0.8,0.9]] },
    star:      { name: "Star",      fill: "#F0E442", points: [[0.5,0.1],[0.74,0.88],[0.12,0.4],[0.88,0.4],[0.26,0.88]] },
    gem:       { name: "Gem",       fill: "#CC79A7", points: [[0.3,0.2],[0.7,0.2],[0.9,0.4],[0.5,0.9],[0.1,0.4]] },
    crown:     { name: "Crown",     fill: "#F0E442", points: [[0.1,0.85],[0.1,0.3],[0.3,0.55],[0.5,0.2],[0.7,0.55],[0.9,0.3],[0.9,0.85]] },
    fish:      { name: "Fish",      fill: "#56B4E9", points: [[0.15,0.5],[0.4,0.25],[0.7,0.35],[0.9,0.15],[0.9,0.85],[0.7,0.65],[0.4,0.75]] },
    boat:      { name: "Boat",      fill: "#0072B2", points: [[0.25,0.85],[0.1,0.6],[0.5,0.6],[0.5,0.1],[0.8,0.55],[0.9,0.6],[0.75,0.85]] },
    tree:      { name: "Tree",      fill: "#009E73", points: [[0.45,0.9],[0.45,0.7],[0.15,0.7],[0.5,0.1],[0.85,0.7],[0.55,0.7],[0.55,0.9]] },
    heart:     { name: "Heart",     fill: "#D55E00", points: [[0.5,0.3],[0.3,0.12],[0.1,0.3],[0.15,0.55],[0.5,0.9],[0.85,0.55],[0.9,0.3],[0.7,0.12]] },
    cat:       { name: "Cat",       fill: "#E69F00", points: [[0.2,0.15],[0.35,0.35],[0.65,0.35],[0.8,0.15],[0.85,0.5],[0.75,0.75],[0.5,0.88],[0.25,0.75],[0.15,0.5]] },
    rocket:    { name: "Rocket",    fill: "#CC79A7", points: [[0.5,0.08],[0.65,0.3],[0.65,0.65],[0.8,0.85],[0.6,0.78],[0.4,0.78],[0.2,0.85],[0.35,0.65],[0.35,0.3]] },
    butterfly: { name: "Butterfly", fill: "#56B4E9", points: [[0.5,0.2],[0.25,0.08],[0.08,0.3],[0.3,0.5],[0.12,0.75],[0.4,0.88],[0.5,0.6],[0.6,0.88],[0.88,0.75],[0.7,0.5],[0.92,0.3],[0.75,0.08]] },
    castle:    { name: "Castle",    fill: "#BBBBBB", points: [[0.1,0.9],[0.1,0.25],[0.25,0.25],[0.25,0.4],[0.4,0.4],[0.4,0.15],[0.6,0.15],[0.6,0.4],[0.75,0.4],[0.75,0.25],[0.9,0.25],[0.9,0.9],[0.6,0.9],[0.6,0.7],[0.4,0.7],[0.4,0.9]] }
  };
  const BANDS = {
    tiny:   { pictures: ["tent","kite","house","star","gem"], labels: "none", perSitting: 3 },
    little: { pictures: ["house","star","gem","crown","fish","boat","tree","heart"], labels: "numbers", perSitting: 4 },
    shop:   { pictures: ["crown","fish","boat","tree","heart","cat","rocket","butterfly"], labels: "numbers", perSitting: 4 },
    rush:   { pictures: ["heart","cat","rocket","butterfly","castle","fish","boat","tree"], labels: "letters", perSitting: 4 }
  };

  function makeRng(seed) {
    let state = seed >>> 0;
    return function () {
      state = (state + 0x6D2B79F5) >>> 0;
      let t = Math.imul(state ^ (state >>> 15), state | 1);
      t = (t ^ (t + Math.imul(t ^ (t >>> 7), t | 61))) >>> 0;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }
  function playSeed(clockMs, n) {
    return (Math.imul(((clockMs >>> 0) ^ Math.imul(n >>> 0, 0x9E3779B9)), 0x85EBCA6B)) >>> 0;
  }

  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d");
  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const backBtn = document.getElementById("back");
  const eyesEl = document.getElementById("eyes");
  const gazeEl = document.getElementById("gaze");
  const bannerEl = document.getElementById("banner");
  const menuEl = document.getElementById("screen-menu");
  const menuCard = document.getElementById("menu-card");
  const menuCopy = document.getElementById("menu-copy");
  const playEl = document.getElementById("play");
  const dotsEl = document.getElementById("dots");
  const restEl = document.getElementById("screen-rest");
  const restCard = document.getElementById("rest-card");
  const restLine = document.getElementById("rest-line");
  const anotherBtn = document.getElementById("another");
  const soundOn = document.getElementById("sound-on");
  const soundOff = document.getElementById("sound-off");

  let screen = "menu";
  let level = "tiny";
  let muted = false;
  let order = [];
  let place = 0;
  let index = 0;
  let note = 0;
  let nameClock = 0;
  let anim = null;
  let pin = null;
  let counter = 1;
  let checking = false;
  let suppressReconnect = false;
  let clock = 0;
  let ac = null;
  let master = null;
  let pointerDown = false;
  let armedId = null;
  let gazeSock = null;
  let gazeTimer = 0;
  let gazeBuf = new Uint8Array(0);
  let gazeWarp = null;
  let gazeHold = null;
  let refreshHold = false;
  let haveSmooth = false;
  let smoothed = null;
  let gazePoint = null;
  let gazeAt = 0;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;
  let dwellMs = PLAY_DWELL_MS;
  let dwellOffAt = 0;
  let trailOn = false;

  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  function knownBand(band) { return BAND_IDS.indexOf(band) >= 0; }
  function pictureNow() {
    if (!order.length || place < 0 || place >= order.length) return null;
    return PICTURES[order[place]] || null;
  }
  function markAt(i) {
    const mode = BANDS[level] ? BANDS[level].labels : "none";
    if (mode === "numbers") return String(i + 1);
    if (mode === "letters") return "ABCDEFGHIJKLMNOPQRSTUVWXYZ".charAt(i) || "";
    return "";
  }
  function article(name) {
    return "A " + name.charAt(0).toLowerCase() + name.slice(1) + "!";
  }
  function bannerText() {
    if (screen === "menu") return "Pick a night sky.";
    if (screen === "rest") return "The sky is full of pictures.";
    const pic = pictureNow();
    if (pic && index >= pic.points.length) return article(pic.name);
    return "Look at the big star.";
  }
  function lineCount(pic) {
    if (!pic) return 0;
    const n = pic.points.length;
    if (index <= 1) return 0;
    if (index >= n) return n;
    return index - 1;
  }

  function takePageSeed() {
    let s;
    if (pin !== null) s = pin;
    else if (checking) s = 1;
    else s = playSeed(Date.now(), counter);
    pin = null;
    counter += 1;
    return s >>> 0;
  }
  function deal() {
    const list = BANDS[level].pictures.slice();
    const rng = makeRng(takePageSeed());
    for (let i = list.length - 1; i >= 1; i--) {
      const j = rng() % (i + 1);
      const tmp = list[i];
      list[i] = list[j];
      list[j] = tmp;
    }
    order = list.slice(0, BANDS[level].perSitting);
    place = 0;
    note = 0;
    beginPicture();
  }
  function beginPicture() {
    index = 0;
    nameClock = 0;
    anim = null;
  }
  function useBand(band) {
    if (!knownBand(band)) return false;
    level = band;
    return true;
  }
  function go(id) {
    if (id !== "menu" && id !== "play" && id !== "rest") {
      render();
      return;
    }
    screen = id;
    render();
  }
  function highlight(band) {
    if (!useBand(band)) {
      render();
      return;
    }
    render();
  }
  function start(band) {
    if (!useBand(band)) {
      render();
      return;
    }
    deal();
    go("play");
  }
  function advance() {
    place += 1;
    if (place >= order.length) go("rest");
    else {
      beginPicture();
      render();
    }
  }
  function joinStar() {
    const pic = pictureNow();
    if (screen !== "play" || !pic || index >= pic.points.length) {
      render();
      return;
    }
    anim = { to: index, t0: clock, close: index + 1 === pic.points.length };
    index += 1;
    playNote();
    if (index >= pic.points.length) {
      nameClock = clock;
      chime();
    }
    render();
  }

  function chromeBoxes(w) {
    const y = 8;
    const h = 72;
    const mute = { id: "mute", x: 8, y: y, w: 72, h: h };
    const full = { id: "full", x: 88, y: y, w: 72, h: h };
    const room = w - 176 - 8;
    const backW = Math.max(72, Math.min(176, room));
    const back = { id: "back", x: w - 8 - backW, y: y, w: backW, h: h };
    return { mute: mute, full: full, back: back };
  }
  function menuLayout(w, h) {
    const btnH = 72;
    const gap = 8;
    const titleH = 64;
    const ids = ["tiny", "little", "shop", "rush", "lets-go"];
    const columnH = titleH + gap + ids.length * btnH + (ids.length - 1) * gap;
    const belowTop = 92;
    const fitsBelow = belowTop + columnH <= h - 8;
    let cardW;
    let cardX;
    let top;
    if (fitsBelow) {
      cardW = w < 480 ? w - 16 : Math.min(460, w - 24);
      cardX = (w - cardW) / 2;
      top = belowTop;
    } else if (8 + columnH <= h - 8) {
      const leftLimit = 168;
      const rightLimit = w - 8;
      cardW = Math.min(460, Math.max(72, rightLimit - leftLimit));
      cardX = leftLimit + Math.max(0, (rightLimit - leftLimit - cardW) / 2);
      top = 8;
    } else {
      cardW = w < 480 ? w - 16 : Math.min(460, w - 24);
      cardX = (w - cardW) / 2;
      top = 8;
    }
    const buttons = [];
    const useGrid = top + columnH > h - 8;
    let title;
    if (!useGrid) {
      title = { x: cardX, y: top, w: cardW, h: titleH };
      let y = top + titleH + gap;
      for (let i = 0; i < ids.length; i++) {
        buttons.push({ id: ids[i], x: cardX, y: y, w: Math.max(72, cardW), h: btnH });
        y += btnH + gap;
      }
      const card = { x: cardX, y: top, w: cardW, h: y - gap - top };
      return { title: title, buttons: buttons, card: card };
    }
    const gridTitle = 48;
    title = { x: cardX, y: top, w: cardW, h: gridTitle };
    const colW = Math.max(72, Math.floor((cardW - gap) / 2));
    const gridW = colW * 2 + gap;
    const gridX = cardX + Math.max(0, (cardW - gridW) / 2);
    let y = top + gridTitle + gap;
    const bandIds = ["tiny", "little", "shop", "rush"];
    for (let i = 0; i < bandIds.length; i++) {
      const col = i % 2;
      const row = Math.floor(i / 2);
      buttons.push({
        id: bandIds[i],
        x: gridX + col * (colW + gap),
        y: y + row * (btnH + gap),
        w: colW,
        h: btnH
      });
    }
    y += 2 * (btnH + gap);
    buttons.push({ id: "lets-go", x: cardX, y: y, w: Math.max(72, cardW), h: btnH });
    const card = { x: cardX, y: top, w: cardW, h: y + btnH - top };
    return { title: title, buttons: buttons, card: card };
  }
  function restLayout(w, h) {
    const cardW = w < 480 ? Math.max(72, w - 32) : Math.min(460, w - 48);
    const cardX = Math.max(16, (w - cardW) / 2);
    const cardH = 200;
    const y = Math.max(96, Math.min((h - cardH) / 2, h - cardH - 16));
    return {
      card: { x: cardX, y: y, w: cardW, h: cardH },
      line: { x: cardX + 16, y: y + 24, w: Math.max(72, cardW - 32), h: 72 },
      another: { id: "another", x: cardX + 16, y: y + 112, w: Math.max(72, cardW - 32), h: 72 }
    };
  }
  function pictureSquare(w, h) {
    const top = 88;
    const bottom = 40;
    const side = Math.floor(Math.min(w - 32, h - top - bottom));
    const x = Math.floor((w - side) / 2);
    const y = top + Math.floor((h - top - bottom - side) / 2);
    return { x: x, y: y, side: side };
  }
  function starButtonBox(w, h, px, py) {
    const sq = pictureSquare(w, h);
    const size = 112;
    const inset = 16;
    const maxX = w - inset - size;
    const maxY = h - inset - size;
    if (maxX < inset || maxY < inset || sq.side < 32) return null;
    const cx = sq.x + px * sq.side;
    const cy = sq.y + py * sq.side;
    const x = Math.min(maxX, Math.max(inset, cx - size / 2));
    const y = Math.min(maxY, Math.max(inset, cy - size / 2));
    return { x: x, y: y, w: size, h: size, cx: cx, cy: cy };
  }
  function starBoxFor(w, h) {
    const pic = pictureNow();
    if (screen !== "play" || !pic || index >= pic.points.length) return null;
    const pt = pic.points[index];
    const box = starButtonBox(w, h, pt[0], pt[1]);
    if (!box) return null;
    box.id = "star-" + index;
    return box;
  }
  function layoutTargets(w, h) {
    if (!(w >= 320)) return null;
    const chrome = chromeBoxes(w);
    const targets = [chrome.mute, chrome.full];
    if (screen !== "menu") targets.push(chrome.back);
    if (screen === "menu") {
      const menu = menuLayout(w, h);
      for (let i = 0; i < menu.buttons.length; i++) targets.push(menu.buttons[i]);
    }
    if (screen === "play") {
      const star = starBoxFor(w, h);
      if (pictureNow() && index < pictureNow().points.length) {
        if (!star) return null;
        targets.push(star);
      }
    }
    if (screen === "rest") {
      const rest = restLayout(w, h);
      targets.push(rest.another);
    }
    for (let i = 0; i < targets.length; i++) {
      const box = targets[i];
      if (Math.min(box.w, box.h) < 72) return null;
      if (box.x < -0.5 || box.y < -0.5 || box.x + box.w > w + 0.5 || box.y + box.h > h + 0.5) return null;
    }
    return targets;
  }
  function targetsAt(w, h) {
    render();

      if (origSet) localStorage.setItem = origSet;
      if (origRem) localStorage.removeItem = origRem;
      if (origSpeak && window.speechSynthesis) window.speechSynthesis.speak = origSpeak;
    } catch (err) {}
    return { ok: failures.length === 0, failures: failures };
  }

  window.starPictures = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    selfCheck: selfCheck
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let result;
    try { result = selfCheck(); }
    catch (err) {
      result = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] };
    }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("rush")) start("rush");
    else if (params.has("play")) start("tiny");
    connectGaze();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
