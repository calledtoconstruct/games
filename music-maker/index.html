<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>Music Maker</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; touch-action: none; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 28; pointer-events: none;
    background: var(--card); border-radius: 999px; padding: 8px 12px;
    font-weight: 800; font-size: 16px;
  }
  #banner {
    position: fixed; z-index: 25; pointer-events: none;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 6px 14px; font-size: 18px; font-weight: 800;
    text-align: center;
  }
  #menu-card, #rest-card {
    position: fixed; z-index: 2; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #screen-menu, #screen-rest, #play, #menu-copy, #rest-line, h1, p, b, small,
  #lane-bells, #lane-beats {
    pointer-events: none;
  }
  #menu-copy, #rest-line {
    position: fixed; z-index: 24; margin: 0; text-align: center; overflow: hidden;
  }
  #menu-copy h1 { margin: 0; font-size: 26px; line-height: 28px; }
  #menu-copy p { margin: 0; font-size: 14px; line-height: 16px; }
  #rest-line { font-size: 28px; font-weight: 800; }
  #lane-bells, #lane-beats {
    position: fixed; z-index: 24; margin: 0; font-weight: 800; font-size: 16px;
    line-height: 1; overflow: hidden;
  }
  #mute, #full, #back, #lets-go, #tiny, #little, #shop, #rush, #another, #play button {
    position: fixed; z-index: 30; pointer-events: auto;
  }
  #mute, #full, #back {
    z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1; font-size: 15px; line-height: 1.1;
    padding: 4px;
  }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; display: block; }
  #tiny, #little, #shop, #rush {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; color: var(--ink); text-align: left;
    padding: 4px 10px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  #tiny b, #little b, #shop b, #rush b { display: block; font-size: 18px; line-height: 20px; }
  #tiny small, #little small, #shop small, #rush small {
    display: block; font-size: 12px; line-height: 14px; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go, #another {
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink); font-weight: 800;
    box-shadow: 0 5px 0 var(--sun-d); font-size: 26px;
  }
  #play button {
    display: flex; align-items: center; justify-content: center;
    border: 3px solid transparent; border-radius: 18px;
    background: var(--card); color: var(--ink); text-align: center;
    padding: 4px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
    font-weight: 800; font-size: 18px;
  }
  #play button .pop {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; gap: 2px; pointer-events: none;
  }
  #play button svg { width: 46%; height: 42%; display: block; pointer-events: none; }
  #play button .lbl { font-size: 15px; font-weight: 800; line-height: 18px; color: var(--ink); pointer-events: none; }
  #play button.picked { border-color: var(--sun); }
  #play button.lit { border-color: #2f8a3e; }
  #play button.slot-empty { border-style: dashed; border-color: var(--ink); }
  #play button.dim { opacity: 0.4; }
  #play button[aria-pressed="true"] { border-color: var(--ink); background: #fff6df; }
  #play button#play-toggle {
    border: none; background: var(--sun); color: var(--ink);
    box-shadow: 0 5px 0 var(--sun-d); font-size: 24px;
  }
  @keyframes pop {
    0% { transform: translateY(0); }
    35% { transform: translateY(-8px); }
    100% { transform: translateY(0); }
  }
  #play button.bounce .pop { animation: pop 280ms ease; }
  @media (prefers-reduced-motion: reduce) {
    #play button.bounce .pop { animation: none; }
    #play button.bounce { box-shadow: 0 0 0 5px #ffc857; }
  }
</style>
</head>
<body>
<button id="mute" type="button" aria-label="Mute sound">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8l6 8"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner">Pick who is playing.</p>
<section id="screen-menu">
  <div id="menu-card"></div>
  <div id="menu-copy">
    <h1>Music Maker</h1>
    <p>Look at bells and drums to play them.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>Bells</b><small>Ages 2 to 3. Four bells.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Band</b><small>Ages 4 to 5. Six sounds.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Loop</b><small>Ages 6 to 8. Make a loop.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Studio</b><small>Ages 9 and up. Two lanes and tempo.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden>
  <button id="tab-sounds" type="button">Sounds</button>
  <button id="tab-loop" type="button">Loop</button>
  <p id="lane-bells" hidden>Bells</p>
  <p id="lane-beats" hidden>Beats</p>
  <button id="page-prev" type="button">Previous</button>
  <button id="page-next" type="button">Next</button>
  <button id="tempo-slow" type="button">Slow</button>
  <button id="tempo-medium" type="button">Medium</button>
  <button id="tempo-fast" type="button">Fast</button>
  <button id="play-toggle" type="button">Play</button>
  <button id="clear" type="button">Clear all</button>
  <button id="done" type="button">Done</button>
</div>
<section id="screen-rest" hidden>
  <div id="rest-card"></div>
  <p id="rest-line">That was lovely music.</p>
  <button id="another" type="button">Another</button>
</section>
<script>
(function () {
  "use strict";
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const STEP_GAP_MS = 120000;
  const LOG_CAP = 64;
  const BAND_IDS = ["tiny", "little", "shop", "rush"];
  const SOUNDS = {
    c:      { label: "C",      kind: "bell", freq: 262, shape: "circle",   color: "#E69F00" },
    d:      { label: "D",      kind: "bell", freq: 294, shape: "square",   color: "#F0E442" },
    e:      { label: "E",      kind: "bell", freq: 330, shape: "triangle", color: "#009E73" },
    g:      { label: "G",      kind: "bell", freq: 392, shape: "diamond",  color: "#56B4E9" },
    a:      { label: "A",      kind: "bell", freq: 440, shape: "star",     color: "#0072B2" },
    hiC:    { label: "High C", kind: "bell", freq: 523, shape: "heart",    color: "#CC79A7" },
    drum:   { label: "Drum",   kind: "drum",   shape: "drum",   color: "#D55E00" },
    shaker: { label: "Shaker", kind: "shaker", shape: "shaker", color: "#BBBBBB" },
    clap:   { label: "Clap",   kind: "clap",   shape: "hand",   color: "#C89B5B" }
  };
  const BANDS = {
    tiny:   { sounds: ["c", "e", "g", "hiC"], loop: false },
    little: { sounds: ["c", "d", "e", "g", "a", "drum"], loop: false },
    shop:   { sounds: ["c", "d", "e", "g", "a", "drum", "shaker", "clap"], loop: "one" },
    rush:   { sounds: ["c", "d", "e", "g", "a", "drum", "shaker", "clap"], loop: "two", tempos: { slow: 500, medium: 400, fast: 300 } }
  };
  const SOUND_IDS = ["c", "d", "e", "g", "a", "hiC", "drum", "shaker", "clap"];
  const STAR = (function () {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? 36 : 15;
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      pts.push((50 + Math.cos(a) * r).toFixed(1) + "," + (48 + Math.sin(a) * r).toFixed(1));
    }
    return pts.join(" ");
  })();

  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const backBtn = document.getElementById("back");
  const eyesEl = document.getElementById("eyes");
  const gazeEl = document.getElementById("gaze");
  const bannerEl = document.getElementById("banner");
  const menuEl = document.getElementById("screen-menu");
  const menuCard = document.getElementById("menu-card");
  const menuCopy = document.getElementById("menu-copy");
  const playEl = document.getElementById("play");
  const restEl = document.getElementById("screen-rest");
  const restCard = document.getElementById("rest-card");
  const restLine = document.getElementById("rest-line");
  const soundOn = document.getElementById("sound-on");
  const soundOff = document.getElementById("sound-off");
  const letsBtn = document.getElementById("lets-go");
  const anotherBtn = document.getElementById("another");
  const playToggle = document.getElementById("play-toggle");
  const MANAGED_IDS = [
    "tab-sounds", "tab-loop", "lane-bells", "lane-beats", "page-prev", "page-next",
    "tempo-slow", "tempo-medium", "tempo-fast", "play-toggle", "clear", "done"
  ];

  let screen = "menu";
  let level = "tiny";
  let muted = false;
  let pin = null;
  let checking = false;
  let suppressReconnect = false;
  let clock = 0;
  let ac = null;
  let master = null;
  let pointerDown = false;
  let armedId = null;
  let gazeSock = null;
  let gazeTimer = 0;
  let gazeBuf = new Uint8Array(0);
  let gazeWarp = null;
  let gazeHold = null;
  let refreshHold = false;
  let haveSmooth = false;
  let smoothed = null;
  let gazePoint = null;
  let gazeAt = 0;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;
  let dwellMs = PLAY_DWELL_MS;
  let dwellOffAt = 0;
  let trailOn = false;
  let selected = null;
  let loopOne = blankSteps();
  let bells = blankSteps();
  let beats = blankSteps();
  let playing = false;
  let playhead = null;
  let playOrigin = 0;
  let loopGen = 0;
  let visits = [];
  let heard = [];
  let lastSound = null;
  let slotPage = 0;
  let playTab = "sounds";
  let tempoName = "medium";
  let bounce = null;
  let layoutFault = "";
  const managed = [];

  function blankSteps() {
    return [null, null, null, null, null, null, null, null];
  }
  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  function knownBand(band) { return BAND_IDS.indexOf(band) >= 0; }
  function svgEl(name, attrs) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", name);
    if (attrs) {
      for (const k in attrs) el.setAttribute(k, attrs[k]);
    }
    return el;
  }
  function clearNode(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }
  function drawShape(svg, shape, color) {
    clearNode(svg);
    const ink = "#2c2416";
    function mark(name, attrs) {
      if (!attrs.fill) attrs.fill = color;
      if (!attrs.stroke) attrs.stroke = ink;
      if (!attrs["stroke-width"]) attrs["stroke-width"] = "4";
      attrs["stroke-linejoin"] = "round";
      svg.appendChild(svgEl(name, attrs));
    }
    if (shape === "circle") mark("circle", { cx: "50", cy: "48", r: "30" });
    else if (shape === "square") mark("rect", { x: "18", y: "16", width: "64", height: "64", rx: "8" });
    else if (shape === "triangle") mark("polygon", { points: "50,12 90,84 10,84" });
    else if (shape === "diamond") mark("polygon", { points: "50,8 92,48 50,90 8,48" });
    else if (shape === "star") mark("polygon", { points: STAR });
    else if (shape === "heart") {
      mark("path", { d: "M50 84 C20 60 10 42 26 28 C38 18 48 26 50 36 C52 26 62 18 74 28 C90 42 80 60 50 84 Z" });
    } else if (shape === "drum") {
      mark("ellipse", { cx: "50", cy: "64", rx: "30", ry: "18" });
      mark("rect", { x: "20", y: "42", width: "60", height: "16", rx: "6" });
      mark("line", { x1: "28", y1: "28", x2: "48", y2: "46", fill: "none", stroke: ink, "stroke-width": "4", "stroke-linecap": "round" });
      mark("line", { x1: "72", y1: "26", x2: "54", y2: "44", fill: "none", stroke: ink, "stroke-width": "4", "stroke-linecap": "round" });
    } else if (shape === "shaker") {
      mark("rect", { x: "34", y: "14", width: "32", height: "72", rx: "14" });
      mark("circle", { cx: "46", cy: "36", r: "3", fill: ink, stroke: "none" });
      mark("circle", { cx: "56", cy: "48", r: "3", fill: ink, stroke: "none" });
      mark("circle", { cx: "44", cy: "58", r: "3", fill: ink, stroke: "none" });
      mark("circle", { cx: "55", cy: "68", r: "3", fill: ink, stroke: "none" });
    } else if (shape === "hand") {
      mark("path", { d: "M32 78 L32 46 Q32 34 42 34 Q50 34 50 46 L50 56 L54 32 Q54 22 64 22 Q72 22 72 34 L72 56 L76 38 Q78 28 86 32 Q94 36 88 50 L82 78 Z" });
    }
  }
  function makePop(btn) {
    const pop = document.createElement("span");
    pop.className = "pop";
    const svg = svgEl("svg", { viewBox: "0 0 100 100", "aria-hidden": "true" });
    const lbl = document.createElement("span");
    lbl.className = "lbl";
    pop.appendChild(svg);
    pop.appendChild(lbl);
    btn.appendChild(pop);
    return btn;
  }
  function makeSound(id) {
    const spec = SOUNDS[id];
    const btn = document.createElement("button");
    btn.type = "button";
    btn.id = "sound-" + id;
    btn.setAttribute("data-play", "true");
    btn.setAttribute("data-sound", id);
    btn.setAttribute("aria-label", spec.label);
    makePop(btn);
    const svg = btn.querySelector("svg");
    drawShape(svg, spec.shape, spec.color);
    btn.querySelector(".lbl").textContent = spec.label;
    btn.hidden = true;
    playEl.appendChild(btn);
    managed.push(btn);
  }
  function makeSlot(id, lane, index) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.id = id;
    btn.setAttribute("data-play", "true");
    btn.setAttribute("data-lane", lane);
    btn.setAttribute("data-index", String(index));
    makePop(btn);
    btn.hidden = true;
    playEl.appendChild(btn);
    managed.push(btn);
  }
  for (let i = 0; i < SOUND_IDS.length; i++) makeSound(SOUND_IDS[i]);
  for (let i = 0; i < 8; i++) {
    makeSlot("slot-" + i, "one", i);
    makeSlot("bell-" + i, "bells", i);
    makeSlot("beat-" + i, "beats", i);
  }
  for (let i = 0; i < MANAGED_IDS.length; i++) {
    const el = document.getElementById(MANAGED_IDS[i]);
    if (el) managed.push(el);
  }

  function resetSitting() {
    selected = null;
    loopOne = blankSteps();
    bells = blankSteps();
    beats = blankSteps();
    playing = false;
    playhead = null;
    playOrigin = 0;
    loopGen = 0;
    visits = [];
    heard = [];
    lastSound = null;
    slotPage = 0;
    playTab = "sounds";
    tempoName = "medium";
    bounce = null;
  }
  function bannerText() {
    if (screen === "play") return "Look at a bell.";
    if (screen === "rest") return "That was lovely music.";
    return "Pick who is playing.";
  }
  function go(id) {
    if (id !== "menu" && id !== "play" && id !== "rest") {
      render();
      return;
    }
    if (id !== "play") playing = false;
    screen = id;
    render();
  }
  function highlight(band) {
    if (!knownBand(band)) {
      render();
      return;
    }
    level = band;
    render();
  }
  function start(band) {
    if (!knownBand(band)) {
      render();
      return;
    }
    level = band;
    resetSitting();
    go("play");
  }
  function currentTempo() {
    if (level === "rush") return BANDS.rush.tempos[tempoName] || 400;
    return 400;
  }
  function state() {
    const loop = BANDS[level] ? BANDS[level].loop : false;
    const snap = {
      level: level,
      screen: screen,
      banner: bannerText(),
      muted: muted,
      lastSound: lastSound,
      selected: selected,
      playing: playing,
      playhead: playhead,
      tempo: loop ? currentTempo() : null,
      tempoName: level === "rush" ? tempoName : null,
      page: slotPage,
      tab: playTab,
      steps: loop === "one" ? loopOne.slice() : null,
      bells: loop === "two" ? bells.slice() : null,
      beats: loop === "two" ? beats.slice() : null,
      heard: heard.slice(),
      visits: visits.slice()
    };
    render();
    return snap;
  }

  function remember(list, value) {
    list.push(value);
    if (list.length > LOG_CAP) list.splice(0, list.length - LOG_CAP);
  }
  function playSound(soundId, bounceId) {
    if (!SOUNDS[soundId]) return;
    lastSound = soundId;
    remember(heard, soundId);
    bounce = { id: bounceId || ("sound-" + soundId), t: clock };
    voice(soundId);
  }
  function chooseSound(soundId) {
    const band = BANDS[level];
    if (!band || band.sounds.indexOf(soundId) < 0) {
      render();
      return;
    }
    if (band.loop) selected = soundId;
    else selected = null;
    playSound(soundId, "sound-" + soundId);
    render();
  }
  function laneArray(lane) {
    if (level === "shop" && lane === "one") return loopOne;
    if (level === "rush" && lane === "bells") return bells;
    if (level === "rush" && lane === "beats") return beats;
    return null;
  }
  function laneWrong(lane) {
    if (level !== "rush" || !selected || !SOUNDS[selected]) return false;
    const bell = SOUNDS[selected].kind === "bell";
    if (bell && lane === "beats") return true;
    if (!bell && lane === "bells") return true;
    return false;
  }
  function placeAt(lane, index) {
    const arr = laneArray(lane);
    if (!arr || index < 0 || index > 7 || !selected) {
      render();
      return;
    }
    if (laneWrong(lane)) {
      render();
      return;
    }
    const prefix = lane === "one" ? "slot-" : lane === "bells" ? "bell-" : "beat-";
    if (arr[index] === selected) arr[index] = null;
    else {
      arr[index] = selected;
      playSound(selected, prefix + index);
    }
    render();
  }
  function clearAll() {
    loopOne = blankSteps();
    bells = blankSteps();
    beats = blankSteps();
    render();
  }
  function togglePlay() {
    const loop = BANDS[level] && BANDS[level].loop;
    if (!loop) {
      render();
      return;
    }
    if (playing) playing = false;
    else {
      playing = true;
      playOrigin = clock;
      loopGen = 0;
      playhead = null;
      visits = [];
    }
    render();
  }
  function setTempo(name) {
    if (!BANDS.rush.tempos[name]) {
      render();
      return;
    }
    if (name === tempoName) {
      render();
      return;
    }
    const prev = currentTempo();
    if (playing && prev > 0) pumpLoop(clock);
    tempoName = name;
    const next = currentTempo();
    if (playing && prev > 0 && next > 0 && prev !== next) {
      playOrigin = clock - loopGen * next;
    }
    render();
  }
  function chooseTab(tab) {
    if (tab !== "sounds" && tab !== "loop") {
      render();
      return;
    }
    playTab = tab;
    render();
  }
  function flipPage(dir) {
    if (!(level === "rush" && window.innerWidth < 700)) {
      render();
      return;
    }
    const next = slotPage + dir;
    if (next < 0 || next > 1) {
      render();
      return;
    }
    slotPage = next;
    render();
  }
  function fireStep(idx) {
    if (level === "shop") {
      if (loopOne[idx]) playSound(loopOne[idx], "slot-" + idx);
    } else if (level === "rush") {
      if (bells[idx]) playSound(bells[idx], "bell-" + idx);
      if (beats[idx]) playSound(beats[idx], "beat-" + idx);
    }
  }
  function pumpLoop(now) {
    if (!playing || screen !== "play") return;
    if (level !== "shop" && level !== "rush") return;
    const ms = currentTempo();
    if (!(ms > 0)) return;
    const elapsed = now - playOrigin;

        const hit = buttonAt(lets.nx * window.innerWidth, lets.ny * window.innerHeight);
        if (!hit || hit.id !== "lets-go") fail("family-menu-dwell", "The Let's go center was not the button.");
        enterLook(lets, 20000);
        if (dwell() !== 0) fail("family-menu-dwell", "The menu entry step filled the ring.");
        step(20600);
        if (state().screen !== "menu") fail("family-menu-dwell", "600 ms on Let's go left the menu.");
        step(21300);
        if (state().screen !== "play") fail("family-menu-dwell", "1300 ms on Let's go did not open play.");
      }
      const back = targetById(centers().targets, "back");
      if (!back) fail("family-menu-dwell", "Back to Menu was not a target.");
      else {
        enterLook(back, 24000);
        step(24600);
        if (state().screen !== "play") fail("family-menu-dwell", "600 ms on Back left the music.");
        step(25300);
        if (state().screen !== "menu") fail("family-menu-dwell", "1300 ms on Back did not return to the menu.");
      }
    });
    run("family-pointer-blocks", function () {
      resetInput();
      start("tiny");
      const box = targetById(centers().targets, "sound-c");
      hold(box.nx, box.ny);
      look(box.nx, box.ny);
      step(30000);
      step(30660);
      if (state().lastSound !== null || dwell() !== 0) fail("family-pointer-blocks", "A look during hold played or filled the ring.");
      release();
      releaseLook();
      enterLook(box, 32000);
      step(32660);
      if (state().lastSound !== "c") fail("family-pointer-blocks", "A fresh look after release did not play.");
    });
    run("family-stale", function () {
      resetInput();
      start("tiny");
      const box = targetById(centers().targets, "sound-c");
      try {
        enterLook(box, 36000);
        step(36200);
        if (!(dwell() > 0) || state().lastSound !== null) fail("family-stale", "The ring did not fill before the sample went stale.");
        refreshHold = false;
        step(36700);
        if (dwell() !== 0) fail("family-stale", "A sample 500 ms old still filled the ring.");
        if (state().lastSound !== null) fail("family-stale", "A stale sample played the bell.");
      } finally {
        refreshHold = true;
      }
    });
    run("family-target-size", function () {
      resetInput();
      go("menu");
      function checkView(where) {
        const views = [[390, 844], [1024, 768]];
        for (let v = 0; v < views.length; v++) {
          const lay = targetsAt(views[v][0], views[v][1]);
          if (!lay.ok) fail("family-target-size", where + " at " + views[v][0] + " by " + views[v][1] + " was not ok. " + (lay.fault || ""));
          const list = lay.targets || [];
          for (let i = 0; i < list.length; i++) {
            if (Math.min(list[i].w, list[i].h) < 72) fail("family-target-size", where + " target " + list[i].id + " was under 72.");
          }
        }
        const small = targetsAt(300, 600);
        if (small.ok || (small.targets && small.targets.length)) fail("family-target-size", "A 300 px width was treated as ok.");
      }
      const before = muteBtn.getBoundingClientRect();
      const beforeShort = Math.min(before.width, before.height);
      checkView("menu");
      const after = muteBtn.getBoundingClientRect();
      if (Math.min(after.width, after.height) + 1 < beforeShort) fail("family-target-size", "targetsAt shrank a live button.");
      if (targetById(centers().targets, "back")) fail("family-target-size", "Back was listed on the menu.");
      for (let b = 0; b < BAND_IDS.length; b++) {
        start(BAND_IDS[b]);
        checkView(BAND_IDS[b]);
      }
      const liveBefore = targetById(centers().targets, "mute");
      const liveAfter = targetById(centers().targets, "mute");
      if (liveBefore && liveAfter && Math.min(liveAfter.w, liveAfter.h) + 1 < Math.min(liveBefore.w, liveBefore.h)) {
        fail("family-target-size", "targetsAt shrank a live play button.");
      }
      go("rest");
      checkView("rest");
      go("menu");
    });
    run("family-eyes", function () {
      resetInput();
      go("menu");
      step(40000);
      look(0.5, 0.5);
      step(40020);
      const eye = eyes();
      const keys = Object.keys(eye);
      if (keys.length !== 2 || keys.indexOf("on") < 0 || keys.indexOf("live") < 0) fail("family-eyes", "eyes() did not return only on and live.");
      if (typeof eye.on !== "boolean" || typeof eye.live !== "boolean") fail("family-eyes", "on or live was not a boolean.");
      if (eye.on !== true || eye.live !== true) fail("family-eyes", "A fresh look did not set on and live.");
      if (gazeSock) fail("family-eyes", "The socket was open.");
      if (eyesEl.hidden || eyesEl.textContent !== "Eyes") fail("family-eyes", "The Eyes chip was hidden or mislabeled.");
      releaseLook();
      if (!eyesEl.hidden) fail("family-eyes", "The Eyes chip stayed up after release.");
    });
    run("family-mute", function () {
      resetInput();
      go("menu");
      const muteText = (muteBtn.innerText || "").replace(/\s+/g, "");
      if (muteText !== "") fail("family-mute", "The mute button had visible text.");
      if ((muteBtn.innerText || "").indexOf("Mute") >= 0 || (muteBtn.innerText || "").indexOf("Sound") >= 0) {
        fail("family-mute", "Mute or Sound was visible.");
      }
      if (muteBtn.querySelectorAll("svg").length !== 2) fail("family-mute", "The mute button did not hold two speaker icons.");
      if (state().muted !== false) fail("family-mute", "Sound did not start on.");
      const box = targetById(centers().targets, "mute");
      tap(box.nx, box.ny);
      if (state().muted !== true) fail("family-mute", "The first tap did not mute.");
      tap(box.nx, box.ny);
      if (state().muted !== false) fail("family-mute", "The second tap did not turn sound on.");
    });
    run("free-play", function () {
      resetInput();
      start("tiny");
      const box = targetById(centers().targets, "sound-e");
      if (!box || !box.play) fail("free-play", "The E bell was not a play target.");
      else {
        step(50000);
        look(box.nx, box.ny);
        step(50000);
        step(50640);
        if (state().lastSound !== null) fail("free-play", "A 640 ms look played a bell.");
        step(50660);
        if (state().lastSound !== "e") fail("free-play", "A 660 ms look did not record the bell.");
      }
    });
    run("select-then-place", function () {
      resetInput();
      start("shop");
      step(60000);
      const sound = targetById(centers().targets, "sound-c");
      enterLook(sound, 60000);
      step(60640);
      if (state().selected !== null || state().steps[0] !== null) fail("select-then-place", "640 ms selected or placed a sound.");
      step(60660);
      if (state().selected !== "c" || state().lastSound !== "c") fail("select-then-place", "660 ms did not select the sound.");
      const slot = targetById(centers().targets, "slot-0");
      enterLook(slot, 62000);
      step(62640);
      if (state().steps[0] !== null) fail("select-then-place", "640 ms on the slot placed the sound.");
      step(62660);
      if (state().steps[0] !== "c") fail("select-then-place", "The slot did not hold the selected sound.");
      enterLook(slot, 64000);
      step(64660);
      if (state().steps[0] !== null) fail("select-then-place", "The same sound on that slot did not clear it.");
      if (state().selected !== "c") fail("select-then-place", "Clearing the slot dropped the selected sound.");
    });
    run("rush-lanes", function () {
      resetInput();
      start("rush");
      openTab("tab-sounds");
      tapId("sound-c");
      openTab("tab-loop");
      tapId("beat-0");
      if (state().beats[0] !== null) fail("rush-lanes", "A bell was placed in the Beats lane.");
      openTab("tab-sounds");
      tapId("sound-drum");
      openTab("tab-loop");
      tapId("bell-0");
      if (state().bells[0] !== null) fail("rush-lanes", "A drum was placed in the Bells lane.");
      openTab("tab-sounds");
      tapId("sound-c");
      openTab("tab-loop");
      tapId("bell-0");
      if (state().bells[0] !== "c") fail("rush-lanes", "A bell did not place in the Bells lane.");
      openTab("tab-sounds");
      tapId("sound-drum");
      openTab("tab-loop");
      tapId("beat-0");
      if (state().beats[0] !== "drum") fail("rush-lanes", "A drum did not place in the Beats lane.");
    });
    run("loop-steps", function () {
      resetInput();
      start("shop");
      const ids = ["c", "d", "e", "g", "a", "drum", "shaker", "clap"];
      for (let i = 0; i < ids.length; i++) {
        tapId("sound-" + ids[i]);
        tapId("slot-" + i);
      }
      if (state().tempo !== 400) fail("loop-steps", "The loop was not 400 ms per step.");
      step(80000);
      const before = state().heard.length;
      tapId("play-toggle");
      if (!state().playing) fail("loop-steps", "Play did not start.");
      step(80000);
      if (state().visits.length !== 0) fail("loop-steps", "The playhead moved before the first step.");
      step(83200);
      const snap = state();
      if (snap.visits.join(",") !== "0,1,2,3,4,5,6,7") fail("loop-steps", "3200 ms did not advance through all 8 slots once.");
      if (snap.playhead !== 7) fail("loop-steps", "The playhead did not finish on the last slot.");
      if (snap.heard.slice(before).join(",") !== ids.join(",")) fail("loop-steps", "The eight steps did not play in order.");
      if (!snap.playing) fail("loop-steps", "The loop stopped before it finished the row.");
    });
    run("stop", function () {
      resetInput();
      start("shop");
      tapId("sound-c");
      tapId("slot-0");
      step(90000);
      tapId("play-toggle");
      step(90400);
      const mid = state();
      if (mid.playhead !== 0) fail("stop", "The playhead did not reach the first step.");
      const n = mid.heard.length;
      const head = mid.playhead;
      tapId("play-toggle");
      if (state().playing) fail("stop", "Stop did not halt playback.");
      step(98000);
      const end = state();
      if (end.heard.length !== n) fail("stop", "Stop did not halt recorded sounds.");
      if (end.playhead !== head) fail("stop", "Stop did not halt the playhead.");
      if (end.playing) fail("stop", "The loop started again on its own.");
    });
    run("rush-tempo", function () {
      resetInput();
      start("rush");
      openTab("tab-sounds");
      tapId("sound-c");
      openTab("tab-loop");
      tapId("bell-0");
      tapId("tempo-slow");
      if (state().tempo !== 500) fail("rush-tempo", "Slow was not 500 ms per step.");
      const t0 = 200000;
      step(t0);
      tapId("play-toggle");
      if (!state().playing) fail("rush-tempo", "Play did not start.");
      step(t0 + 4000);
      const slow = state();
      if (slow.visits.join(",") !== "0,1,2,3,4,5,6,7") fail("rush-tempo", "4000 ms at Slow did not advance through all 8 slots once.");
      if (slow.playhead !== 7) fail("rush-tempo", "The playhead did not finish on the last slot.");
      const visitsSlow = slow.visits.length;
      const heardSlow = slow.heard.length;
      tapId("tempo-fast");
      if (state().tempo !== 300) fail("rush-tempo", "Fast was not 300 ms per step.");
      if (state().visits.length !== visitsSlow || state().heard.length !== heardSlow) fail("rush-tempo", "Changing tempo scheduled notes.");
      step(t0 + 4000 + 299);
      if (state().visits.length !== visitsSlow || state().heard.length !== heardSlow) fail("rush-tempo", "Speeding up scheduled a backlog of notes.");
      step(t0 + 4000 + 300);
      const sped = state();
      if (sped.visits.length !== visitsSlow + 1 || sped.visits[sped.visits.length - 1] !== 0) fail("rush-tempo", "The next step did not wait one fast interval.");
      if (sped.heard.length !== heardSlow + 1) fail("rush-tempo", "The next step did not play its sound.");
      const fastMark = t0 + 4000 + 300;
      tapId("tempo-slow");
      if (state().tempo !== 500) fail("rush-tempo", "Slow did not return to 500 ms per step.");
      if (state().visits.length !== sped.visits.length) fail("rush-tempo", "Slowing down scheduled notes.");
      step(fastMark + 499);
      if (state().visits.length !== sped.visits.length) fail("rush-tempo", "Slowing down moved the playhead early.");
      step(fastMark + 500);
      const slowed = state();
      if (slowed.visits.length !== sped.visits.length + 1 || slowed.visits[slowed.visits.length - 1] !== 1) fail("rush-tempo", "Slowing down stalled the playhead past one slow interval.");
      const gapFrom = fastMark + 500;
      step(gapFrom + 120000);
      const skipped = state();
      if (skipped.visits.length !== slowed.visits.length) fail("rush-tempo", "A 120s gap did not skip the missed steps.");
      if (skipped.heard.length !== slowed.heard.length) fail("rush-tempo", "A 120s gap played the missed steps.");
      step(gapFrom + 120000 + 500);
      const resumed = state();
      if (resumed.visits.length !== slowed.visits.length + 1) fail("rush-tempo", "The loop did not resume one step after a 120s gap.");
      if (resumed.heard.length !== slowed.heard.length) fail("rush-tempo", "The empty step after a 120s gap played a sound.");
    });
    run("sizes", function () {
      resetInput();
      const views = [[390, 700], [1024, 768]];
      function checkBoxes(list, w, h, where) {
        for (let i = 0; i < list.length; i++) {
          const box = list[i];
          const id = String(box.id);
          const tracked = id.indexOf("sound-") === 0 || id.indexOf("slot-") === 0 || id.indexOf("bell-") === 0 || id.indexOf("beat-") === 0 || id === "page-prev" || id === "page-next";
          if (!tracked) continue;
          if (Math.min(box.w, box.h) < 72) fail("sizes", where + " " + id + " was under 72 at " + w + " by " + h + ".");
          if (box.x < 16 || box.y < 16 || box.x + box.w > w - 16 || box.y + box.h > h - 16) {
            fail("sizes", where + " " + id + " was not fully inside the 16 px margin at " + w + " by " + h + ".");
          }
        }
        for (let i = 0; i < list.length; i++) {
          for (let j = i + 1; j < list.length; j++) {
            if (intersects(list[i], list[j])) fail("sizes", where + " " + list[i].id + " hit " + list[j].id + " at " + w + " by " + h + ".");
          }
        }
      }
      function expectIds(list, ids, where) {
        for (let i = 0; i < ids.length; i++) {
          if (!targetById(list, ids[i])) fail("sizes", where + " was missing " + ids[i] + ".");
        }
      }
      for (let b = 0; b < BAND_IDS.length; b++) {
        const band = BAND_IDS[b];
        start(band);
        for (let v = 0; v < views.length; v++) {
          const w = views[v][0];
          const h = views[v][1];
          if (band === "rush" && w < 700) {
            playTab = "sounds";
            slotPage = 0;
            const soundsLay = targetsAt(w, h);
            if (!soundsLay.ok) fail("sizes", band + " sounds at " + w + " by " + h + " was not ok. " + (soundsLay.fault || ""));
            else {
              checkBoxes(soundsLay.targets, w, h, band + " sounds");
              expectIds(soundsLay.targets, BANDS.rush.sounds.map(function (id) { return "sound-" + id; }), band + " sounds");
            }
            playTab = "loop";
            slotPage = 0;
            const page0 = targetsAt(w, h);
            if (!page0.ok) fail("sizes", band + " loop page 0 at " + w + " by " + h + " was not ok. " + (page0.fault || ""));
            else {
              checkBoxes(page0.targets, w, h, band + " page 0");
              expectIds(page0.targets, ["bell-0", "bell-1", "bell-2", "bell-3", "beat-0", "beat-1", "beat-2", "beat-3", "page-prev", "page-next"], band + " page 0");
            }
            slotPage = 1;
            const page1 = targetsAt(w, h);
            if (!page1.ok) fail("sizes", band + " loop page 1 at " + w + " by " + h + " was not ok. " + (page1.fault || ""));
            else {
              checkBoxes(page1.targets, w, h, band + " page 1");
              expectIds(page1.targets, ["bell-4", "bell-5", "bell-6", "bell-7", "beat-4", "beat-5", "beat-6", "beat-7", "page-prev", "page-next"], band + " page 1");
            }
            playTab = "sounds";
            slotPage = 0;
          } else {
            const lay = targetsAt(w, h);
            if (!lay.ok) fail("sizes", band + " at " + w + " by " + h + " was not ok. " + (lay.fault || ""));
            else {
              checkBoxes(lay.targets, w, h, band);
              expectIds(lay.targets, BANDS[band].sounds.map(function (id) { return "sound-" + id; }), band);
              if (band === "shop") {
                const slots = [];
                for (let s = 0; s < 8; s++) slots.push("slot-" + s);
                expectIds(lay.targets, slots, band);
              }
              if (band === "rush") {
                const slots = [];
                for (let s = 0; s < 8; s++) {
                  slots.push("bell-" + s);
                  slots.push("beat-" + s);
                }
                expectIds(lay.targets, slots, band);
              }
            }
          }
        }
      }
    });
    run("eyes-gap", function () {
      resetInput();
      function check(where) {
        const views = [[390, 700], [1024, 768]];
        for (let v = 0; v < views.length; v++) {
          const w = views[v][0];
          const h = views[v][1];
          const boxes = layoutTargets(w, h);
          if (!boxes) {
            fail("eyes-gap", where + " at " + w + " by " + h + " had no button boxes. " + layoutFault);
            continue;
          }
          const eye = eyesBox(w, h);
          if (intersects(eye, bannerBox(w, h))) fail("eyes-gap", "Eyes covered the banner at " + w + " by " + h + " during " + where + ".");
          for (let i = 0; i < boxes.length; i++) {
            if (intersects(eye, boxes[i])) fail("eyes-gap", "Eyes hit " + boxes[i].id + " at " + w + " by " + h + " during " + where + ".");
          }
          if (screen === "menu") {
            const menu = menuLayout(w, h);
            if (menu && (intersects(eye, menu.card) || intersects(eye, menu.title))) {
              fail("eyes-gap", "Eyes hit the menu card at " + w + " by " + h + ".");
            }
          }
          if (screen === "rest") {
            const rest = restLayout(w, h);
            if (rest && intersects(eye, rest.card)) fail("eyes-gap", "Eyes hit the rest card at " + w + " by " + h + ".");
          }
        }
        look(0.5, 0.02);
        step(clock || 10000);
        const placed = eyesEl.getBoundingClientRect();
        const live = eyesBox(window.innerWidth, window.innerHeight);
        if (eyesEl.hidden) fail("eyes-gap", "Eyes was hidden while a look was held during " + where + ".");
        if (Math.abs(placed.left - live.x) > 1 || Math.abs(placed.top - live.y) > 1 || Math.abs(placed.width - live.w) > 1 || Math.abs(placed.height - live.h) > 1) {
          fail("eyes-gap", "The running layout did not place Eyes from eyesBox during " + where + ".");
        }
        const buttons = document.querySelectorAll("button");
        for (let i = 0; i < buttons.length; i++) {
          const btn = buttons[i];
          if (!buttonVisible(btn)) continue;
          const r = btn.getBoundingClientRect();
          const box = { x: r.left, y: r.top, w: r.width, h: r.height };
          if (intersects(box, { x: placed.left, y: placed.top, w: placed.width, h: placed.height })) {
            fail("eyes-gap", "Eyes hit the " + btn.id + " button at " + window.innerWidth + " by " + window.innerHeight + ".");
          }
        }
        releaseLook();
      }
      go("menu");
      check("menu");
      for (let b = 0; b < BAND_IDS.length; b++) {
        start(BAND_IDS[b]);
        if (BAND_IDS[b] === "rush") {
          playTab = "sounds";
          slotPage = 0;
          check("rush-sounds");
          playTab = "loop";
          slotPage = 0;
          check("rush-loop");
          slotPage = 1;
          check("rush-page");
          playTab = "sounds";
          slotPage = 0;
        } else check(BAND_IDS[b]);
      }
      go("rest");
      check("rest");
    });
    run("family-plain-state", function () {
      const before = JSON.stringify(state());
      start("nope");
      go("sideways");
      if (JSON.stringify(state()) !== before) fail("family-plain-state", "An unknown band or screen changed the state.");
      const end = state();
      if (!("level" in end) || !("screen" in end) || !("banner" in end) || !("muted" in end)) {
        fail("family-plain-state", "level, screen, banner, or muted was missing.");
      }
    });
    run("no-speech", function () {
      if (speakCalls !== 0) fail("no-speech", "speechSynthesis.speak was called.");
      if (Object.prototype.hasOwnProperty.call(state(), "speech")) fail("no-speech", "state kept a speech field.");
    });
    try {
      assertJunk("at the end");
    } catch (err) {
      fail("family-query-inert", err && err.message ? err.message : "The junk check threw.");
    }
    try {
      if (writes !== 0) fail("family-no-storage", "The page called setItem or removeItem.");
      if (storeLen !== null && localStorage.length !== storeLen) fail("family-no-storage", "localStorage gained a key.");
      if (storeLen !== null && localStorage.getItem("pop-pals-v1") !== pop) fail("family-no-storage", "pop-pals-v1 changed.");
    } catch (err) {
      fail("family-no-storage", "Storage could not be read.");
    }
    try {
      if (origSet) localStorage.setItem = origSet;
      if (origRem) localStorage.removeItem = origRem;
      if (origSpeak && window.speechSynthesis) window.speechSynthesis.speak = origSpeak;
    } catch (err) {}
    return { ok: failures.length === 0, failures: failures };
  }

  window.musicMaker = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    selfCheck: selfCheck
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let result;
    try { result = selfCheck(); }
    catch (err) {
      result = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] };
    }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("rush")) start("rush");
    else if (params.has("play")) start("tiny");
    connectGaze();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
