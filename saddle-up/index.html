      document.getElementById("teeth").click();
      if (state().vet.checked.length !== 2 || state().vet.lesson !== "pending" || state().banner !== "Which hoof is clean?") {
        vetFail("little pending " + state().banner + " " + JSON.stringify(state().vet));
      }
      const cleanBox = document.getElementById("lesson-clean").getBoundingClientRect();
      const dirtyBox = document.getElementById("lesson-dirty").getBoundingClientRect();
      if (lessonHidden("lesson-clean") || lessonHidden("lesson-dirty") || Math.min(cleanBox.width, cleanBox.height) < 72 || Math.min(dirtyBox.width, dirtyBox.height) < 72) {
        vetFail("picture size " + Math.round(cleanBox.width) + "x" + Math.round(cleanBox.height));
      }
      const cleanBg = rgbChannels(getComputedStyle(document.getElementById("lesson-clean")).backgroundColor);
      const dirtyBg = rgbChannels(getComputedStyle(document.getElementById("lesson-dirty")).backgroundColor);
      if (!cleanBg || colorDist(cleanBg, HOOF) > 8 || !dirtyBg || colorDist(dirtyBg, DIRT) > 8) {
        vetFail("hoof colors " + JSON.stringify(cleanBg) + " " + JSON.stringify(dirtyBg));
      }
      document.getElementById("lesson-dirty").click();
      if (state().vet.lesson !== "pending" || state().banner !== "Look again.") vetFail("dirty hoof " + state().banner);
      document.getElementById("lesson-clean").click();
      if (state().vet.lesson !== "right" || state().banner !== "The vet says all set.") vetFail("clean hoof " + state().banner + " " + JSON.stringify(state().vet));

      level("tiny");
      go("vet");
      if (state().vet.caseId !== null || state().vet.lessonId !== null || state().vet.lesson !== "none") vetFail("tiny open " + JSON.stringify(state().vet));
      document.getElementById("mouth").click();
      if (state().banner !== "The vet says all set." || state().vet.lesson !== "none" || !lessonHidden("lesson-yes")) {
        vetFail("tiny all set " + state().banner + " " + JSON.stringify(state().vet));
      }

      level("rush");
      go("vet");
      document.getElementById("teeth").click();
      if (state().banner !== "The vet smooths a tooth." || state().vet.lesson !== "none") vetFail("teeth " + state().banner);
      document.getElementById("hooves").click();
      document.getElementById("mouth").click();
      if (state().vet.lesson !== "pending" || state().vet.lessonId !== "teeth" || state().vet.checked.length !== 3) vetFail("rush teeth " + JSON.stringify(state().vet));
      document.getElementById("lesson-yes").click();
      if (!state().vet || state().vet.checked.length !== 0 || state().vet.lessonId !== "water" || state().vet.lesson !== "none" || state().vet.caseId !== "dusty") {
        vetFail("rush next " + JSON.stringify(state().vet));
      }
      if (!lessonHidden("lesson-water") || !lessonHidden("lesson-empty")) vetFail("buckets showed early");
      const savedMotion = reduceMotion;
      reduceMotion = true;
      document.getElementById("eyes").click();
      if (session.vet.leanUntil !== 0 || state().banner !== "Bright eyes." || state().vet.lesson !== "none") {
        vetFail("reduced lean " + session.vet.leanUntil + " " + state().banner);
      }
      reduceMotion = savedMotion;
      document.getElementById("belly").click();
      if (state().vet.lesson !== "none" || state().vet.checked.length !== 2) vetFail("rush water early " + JSON.stringify(state().vet));
      document.getElementById("coat").click();
      if (state().vet.checked.length !== 3 || state().vet.lesson !== "pending" || state().banner !== "Which bucket is water?") {
        vetFail("rush water " + state().banner + " " + JSON.stringify(state().vet));
      }
      const waterBg = rgbChannels(getComputedStyle(document.getElementById("lesson-water")).backgroundColor);
      const emptyBg = rgbChannels(getComputedStyle(document.getElementById("lesson-empty")).backgroundColor);
      if (!waterBg || colorDist(waterBg, WATER) > 8 || !emptyBg || colorDist(emptyBg, TROUGH_EMPTY) > 8) {
        vetFail("bucket colors " + JSON.stringify(waterBg) + " " + JSON.stringify(emptyBg));
      }
      document.getElementById("lesson-empty").click();
      if (state().vet.lesson !== "pending" || state().banner !== "Look again.") vetFail("empty bucket " + state().banner);
      document.getElementById("lesson-water").click();
      if (state().vet.lesson !== "right" || state().banner !== "The vet says all set.") vetFail("water right " + state().banner + " " + JSON.stringify(state().vet));
      document.getElementById("lesson-water").click();
      if (state().vet.lesson !== "right") vetFail("second water answer");

      vetLayout(390, 844).checks.concat(vetLayout(390, 844).lessons).forEach((box) => {
        if (Math.min(box.w, box.h) < 72) vetFail("390 " + box.id + " " + box.w + "x" + box.h);
      });
      if (localStorage.getItem("saddle-up") !== null || localStorage.getItem("pop-pals-v1") !== popsBefore) vetFail("storage changed");
      if ((bannerEl.textContent || "").indexOf("lose") >= 0) vetFail("banner said lose");
      const breedBefore = state().breed;
      const spotsBefore = state().hoofSpots;
      applyDeepLink(new URLSearchParams("vet"));
      if (state().level !== "little" || state().place !== "vet" || state().breed !== breedBefore || state().hoofSpots !== spotsBefore) {
        vetFail("vet link " + JSON.stringify({ level: state().level, place: state().place, breed: state().breed, hoofSpots: state().hoofSpots }));
      }
      if (!state().vet || state().vet.lesson !== "none" || state().vet.checked.length !== 0 || state().vet.caseId !== "morning" || state().vet.lessonId !== "hoof") {
        vetFail("vet link case " + JSON.stringify(state().vet));
      }
      if ((state().banner || "").indexOf("lose") >= 0) vetFail("link banner said lose");
    } catch (err) {
      failures.push("Case error: " + (err && err.stack ? err.stack : err));
    }
    return { ok: failures.length === 0, failures: failures };
  }

  function applyDeepLink(params) {
    if (params.has("play")) {
      if (!session.horse) pickBreed("palomino");
      level("tiny");
      go("stable");
    } else if (params.has("jumps")) {
      if (!session.horse) pickBreed("palomino");
      level("little");
      go("jumps");
    } else if (params.has("race")) {
      if (!session.horse) pickBreed("palomino");
      level("shop");
      go("race");
    } else if (params.has("cattle")) {
      if (!session.horse) pickBreed("palomino");
      level("little");
      go("cattle");
    } else if (params.has("chores")) {
      if (!session.horse) pickBreed("palomino");
      level("shop");
      go("chores");
    } else if (params.has("vet")) {
      if (!session.horse) pickBreed("palomino");
      level("little");
      go("vet");
    }
  }

  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(window.innerWidth * dpr));
    canvas.height = Math.max(1, Math.round(window.innerHeight * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    render();
  }

  function frame(now) {
    if (!checking) step(now);
    requestAnimationFrame(frame);
  }

  BREEDS.forEach((meta) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "breed";
    btn.id = meta.id;
    btn.dataset.breed = meta.id;
    btn.style.background = meta.coat;
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.style.background = PAPER;
    chip.style.color = INK;
    const name = document.createElement("b");
    name.textContent = meta.name;
    const small = document.createElement("small");
    small.textContent = meta.parent;
    chip.appendChild(name);
    chip.appendChild(small);
    btn.appendChild(chip);
    btn.addEventListener("click", () => breed(meta.id));
    document.getElementById("breeds").appendChild(btn);
  });

  document.querySelectorAll("[data-level]").forEach((btn) => {
    btn.addEventListener("click", () => level(btn.dataset.level));
  });
  letsGoBtn.addEventListener("click", letsGo);
  backBtn.addEventListener("click", onBack);
  document.getElementById("brush").addEventListener("click", brushHorse);
  document.getElementById("water").addEventListener("click", fillTrough);
  document.getElementById("saddle").addEventListener("click", putSaddle);
  document.getElementById("dock-hooves").addEventListener("click", () => go("hoof"));
  document.getElementById("apples").addEventListener("click", () => feed("apple"));
  document.getElementById("carrots").addEventListener("click", () => feed("carrot"));
  ["spot-1", "spot-2", "spot-3", "spot-4"].forEach((id) => {
    document.getElementById(id).addEventListener("click", () => clearSpot(id));
  });
  document.getElementById("hoof-done").addEventListener("click", () => go("stable"));
  document.getElementById("speed-walk").addEventListener("click", () => setSpeed("walk"));
  document.getElementById("speed-trot").addEventListener("click", () => setSpeed("trot"));
  document.getElementById("speed-canter").addEventListener("click", () => setSpeed("canter"));
  document.getElementById("jump-go").addEventListener("click", () => {
    if (session.place === "race") startRace();
    else startChoose();
  });
  document.getElementById("faster").addEventListener("click", pressFaster);
  document.getElementById("field").addEventListener("click", () => loopCow(null));
  for (let i = 1; i <= 6; i++) {
    const cowId = "cow-" + i;
    document.getElementById(cowId).addEventListener("click", () => loopCow(cowId));
  }
  document.getElementById("barn-back").addEventListener("click", () => go("stable"));
  document.getElementById("barn-cattle").addEventListener("click", () => go("chores"));
  document.getElementById("day-again").addEventListener("click", again);
  document.getElementById("day-yard").addEventListener("click", leaveChores);
  document.getElementById("strap").addEventListener("click", fixBuckle);
  [1, 2, 3, 4].forEach((n) => {
    document.getElementById("shoe-" + n).addEventListener("click", tapShoe);
  });
  VET_PARTS.forEach((part) => {
    document.getElementById(part).addEventListener("click", () => vetCheck(part));
  });
  document.getElementById("lesson-clean").addEventListener("click", () => answerLesson("clean"));
  document.getElementById("lesson-dirty").addEventListener("click", () => answerLesson("dirty"));
  document.getElementById("lesson-yes").addEventListener("click", () => answerLesson("yes"));
  document.getElementById("lesson-no").addEventListener("click", () => answerLesson("no"));
  document.getElementById("lesson-water").addEventListener("click", () => answerLesson("water"));
  document.getElementById("lesson-empty").addEventListener("click", () => answerLesson("empty"));
  document.getElementById("jump-up").addEventListener("click", () => pickHeight(1));
  document.getElementById("jump-low").addEventListener("click", () => pickHeight(1));
  document.getElementById("jump-mid").addEventListener("click", () => pickHeight(2));
  document.getElementById("jump-high").addEventListener("click", () => pickHeight(3));
  muteBtn.addEventListener("click", () => {
    mute = !mute;
    muteBtn.setAttribute("aria-pressed", mute ? "true" : "false");
    muteBtn.setAttribute("aria-label", mute ? "Turn sound on" : "Mute sound");
    document.getElementById("sound-on").hidden = mute;
    document.getElementById("sound-off").hidden = !mute;
    if (master) master.gain.value = mute ? 0 : 0.5;
  });
  fullBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      const req = document.documentElement.requestFullscreen;
      if (req) req.call(document.documentElement).catch(() => {});
    } else if (document.exitFullscreen) document.exitFullscreen();
  });

  document.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    if (activePointer !== null) return;
    activePointer = e.pointerId;
    pointerActive = true;
    boostLatch = false;
    boostOffSince = 0;
    const hit = e.target && e.target.closest ? e.target.closest("#faster") : null;
    if (hit) {
      fasterPointer = true;
      fasterDownAt = clock;
      if (session.race && session.race.phase === "run") session.race.boost = true;
    }
    ensureAudio();
    dwellKey = null;
    dwellFired = false;
    dwellProgress = 0;
  }, true);
  function endPointer(e) {
    if (e.pointerId !== activePointer) return;
    activePointer = null;
    pointerActive = false;
    fasterPointer = false;
  }
  document.addEventListener("pointerup", endPointer, true);
  document.addEventListener("pointercancel", endPointer, true);

  const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
  if (motionQuery.addEventListener) {
    motionQuery.addEventListener("change", () => { reduceMotion = motionQuery.matches; render(); });
  }

  window.addEventListener("resize", resize);
  resize();

  window.saddleUp = {
    level: level,
    breed: breed,
    go: go,
    look: look,
    releaseLook: releaseLook,
    dwell: () => dwellProgress,
    eyes: () => ({ on: eyesOn(), live: eyesLive(clock) }),
    tap: tap,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    step: step,
    selfCheck: selfCheck
  };

  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    const result = selfCheck();
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    applyDeepLink(params);
    requestAnimationFrame(frame);
    connectGaze();
  }
})();
</script>
</body>
</html>
