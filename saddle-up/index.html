      [3, 2, 1].forEach((step, i) => {
        const y = top + 4 + i * Math.max(6, (gh - 12) / 3);
        ctx.fillStyle = stepColor(step, j.need);
        ctx.fillRect(x - gw / 2, y, gw, Math.max(5, gh * 0.1));
      });
    }
    if (session.horse) paintEars(w, h, breedMeta(session.horse.breedId));
  }

  function paintJumps(w, h) {
    if (session.jumps && session.jumps.view === "first") paintFirstCourse(w, h);
    else paintSideCourse(w, h);
  }

  function paint() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    if (w < 2 || h < 2) return;
    ctx.clearRect(0, 0, w, h);
    if (session.place === "hoof") paintHoof(w, h);
    else if (session.place === "jumps") paintJumps(w, h);
    else if (session.place === "race") paintRace(w, h);
    else if (session.place === "cattle" || session.place === "chores") paintCattle(w, h);
    else if (session.place === "vet") paintVet(w, h);
    else paintStable(w, h);
  }

  function paintVetPerson(x, y, lean) {
    const shift = lean ? -26 : 0;
    const px = x + shift;
    ctx.fillStyle = "#f0d2b0";
    ctx.beginPath();
    ctx.arc(px, y, 22, 0, Math.PI * 2);
    ctx.fill();
    strokeInk();
    ctx.stroke();
    ctx.fillStyle = WOOD;
    ctx.fillRect(px - 26, y - 30, 52, 10);
    ctx.fillRect(px - 16, y - 48, 32, 20);
    strokeInk();
    ctx.strokeRect(px - 26, y - 30, 52, 10);
    ctx.strokeRect(px - 16, y - 48, 32, 20);
    roundFill(px - 28, y + 24, 56, 72, "#c46a3a", 14);
    ctx.fillStyle = "#3d4f73";
    ctx.fillRect(px - 22, y + 92, 16, 46);
    ctx.fillRect(px + 6, y + 92, 16, 46);
    roundFill(px + 34, y + 50, 36, 30, SADDLE, 8);
    ctx.font = "700 18px " + FONT;
    const label = "The vet";
    const chipW = Math.max(88, ctx.measureText(label).width + 20);
    const chipX = px - chipW / 2;
    const chipY = y - 84;
    roundFill(chipX, chipY, chipW, 28, PAPER, 12);
    ctx.fillStyle = INK;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, px, chipY + 14);
  }

  function paintPartBadge(x, y, part) {
    const coat = session.horse ? breedMeta(session.horse.breedId).coat : PAPER;
    const fill = part === "hooves" ? HOOF
      : part === "mouth" ? APPLE
      : part === "teeth" ? PAPER
      : part === "belly" ? CARROT
      : part === "eyes" ? "#fffdf6"
      : coat;
    ctx.beginPath();
    ctx.arc(x, y, 18, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    strokeInk();
    ctx.stroke();
    if (part === "eyes") {
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.arc(x + 4, y, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function paintVet(w, h) {
    ctx.fillStyle = "#9fd4f2";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = GRASS;
    ctx.fillRect(0, Math.round(h * 0.62), w, h);
    const box = { x: 16, y: 120, w: Math.max(220, w * 0.58), h: Math.max(200, h * 0.46) };
    drawHorse(ctx, box, "stand");
    if (session.horse) {
      const parts = horseParts(box, "stand");
      paintSweat(parts.head.x - 8, parts.head.y - parts.head.r - 10);
    }
    const lean = !!(session.vet && !reduceMotion && session.vet.leanUntil && clock < session.vet.leanUntil);
    paintVetPerson(Math.round(w * 0.76), Math.round(h * 0.46), lean);
    if (session.vet && session.vet.part) paintPartBadge(Math.round(w * 0.55), Math.round(h * 0.32), session.vet.part);
  }

  function raceFacing(progress) {
    const a = Math.PI / 2 + progress * Math.PI * 2;
    const dx = -Math.sin(a);
    const ddx = -Math.cos(a);
    const sign = Math.abs(dx) < 1e-4 ? (ddx >= 0 ? 1 : -1) : (dx < 0 ? -1 : 1);
    if (reduceMotion) return { scale: sign, bend: 0 };
    const adx = Math.abs(dx);
    let bend = adx >= 0.55 ? 0 : (0.55 - adx) / 0.55;
    if (dx * ddx > 0) bend *= 0.2;
    if (adx < 0.12) bend *= adx / 0.12;
    return { scale: sign * (1 - bend * 0.28), bend: bend };
  }

  function trackLayout(w, h) {
    const top = Math.max(176, Math.round(h * 0.22));
    const bottom = h - Math.max(112, Math.round(h * 0.14));
    const side = Math.max(16, Math.round(w * 0.025));
    const outerRx = Math.max(80, (w - side * 2) * 0.5);
    const availH = Math.max(80, bottom - top);
    let outerRy = Math.min(availH * 0.5, outerRx * 0.72);
    if (outerRy < 170) outerRy = Math.min(availH * 0.5, 170);
    let innerRx = Math.max(36, outerRx * 0.6);
    if (outerRx - innerRx < 120) innerRx = Math.max(36, outerRx - 120);
    let innerRy = Math.max(16, outerRy * 0.36);
    if (outerRy - innerRy < 120) innerRy = Math.max(16, outerRy - Math.min(120, outerRy * 0.8));
    return {
      cx: w * 0.5,
      cy: top + outerRy,
      rx: (innerRx + outerRx) / 2,
      ry: (innerRy + outerRy) / 2,
      outerRx: outerRx,
      outerRy: outerRy,
      innerRx: innerRx,
      innerRy: innerRy
    };
  }

  function raceUnit(g) {
    return Math.max(96, Math.min(124, (g.outerRx - g.innerRx) * 0.48));
  }

  function raceBody(unit, scale) {
    const rw = unit * scale;
    const rh = unit * 0.78 * scale;
    const rx = Math.round(Math.min(140, rw * 0.22, rh * 0.28));
    const ry = Math.round(rx * 0.62);
    const hr = Math.round(Math.min(38, Math.max(22, ry * 0.55)));
    const s = ry / 78;
    const foot = ry * 0.38 + 90 * s + 8;
    const up = foot + ry * 1.05 + 3 * s + hr * 1.83 + 6;
    return { ry: ry, hr: hr, foot: foot, up: up };
  }

  function dirtBand(g, x, sin) {
    const nx = (x - g.cx) / g.outerRx;
    if (nx * nx >= 1) return null;
    const yo = g.outerRy * Math.sqrt(1 - nx * nx);
    const ix = (x - g.cx) / g.innerRx;
    if (ix * ix >= 1) return { top: g.cy - yo, bot: g.cy + yo };
    const yi = g.innerRy * Math.sqrt(1 - ix * ix);
    if (sin >= 0) return { top: g.cy + yi, bot: g.cy + yo };
    return { top: g.cy - yo, bot: g.cy - yi };
  }

  function trackPoint(w, h, progress, lane) {
    const g = trackLayout(w, h);
    const a = Math.PI / 2 + progress * Math.PI * 2;
    const cos = Math.cos(a);
    const sin = Math.sin(a);
    const depth = sin;
    const scale = 0.75 + 0.25 * ((depth + 1) / 2);
    const body = raceBody(raceUnit(g), scale);
    const gx = cos / g.rx;
    const gy = sin / g.ry;
    const glen = Math.hypot(gx, gy) || 1;
    const nx = gx / glen;
    const ny = gy / glen;
    let x = g.cx + cos * g.rx;
    let y = g.cy + sin * g.ry;
    const band0 = dirtBand(g, x, sin);
    const spare = band0 ? (band0.bot - band0.top - body.up) / 2 : 0;
    const maxLane = Math.max(0, spare - 8);
    const used = Math.max(-maxLane, Math.min(maxLane, lane || 0));
    x += nx * used;
    y += ny * used + body.up / 2;
    const band = dirtBand(g, x, sin);
    if (band) {
      const lo = band.top + body.up + 8;
      const hi = band.bot - 10;
      y = lo <= hi ? Math.max(lo, Math.min(hi, y)) : hi;
    }
    return {
      x: x,
      y: y,
      scale: scale,
      depth: depth,
      cx: g.cx,
      cy: g.cy,
      rx: g.rx,
      ry: g.ry,
      outerRx: g.outerRx,
      outerRy: g.outerRy,
      innerRx: g.innerRx,
      innerRy: g.innerRy
    };
  }

  function raceWalkLive() {
    if (!raceWalk || checking || reduceMotion || session.place !== "race" || !session.race) return false;
    return clock < raceWalk.start + 2600 + session.race.rivals.length * 340;
  }

  function paintRaceBarn(w, h, hoofY) {
    const barnW = Math.min(240, Math.max(156, Math.round(w * 0.2)));
    const barnH = Math.min(270, Math.max(188, Math.round(h * 0.34)));
    const floor = Math.min(h - 96, hoofY + 14);
    const top = Math.max(108, floor - barnH);
    const wallH = Math.max(80, floor - top - 34);
    ctx.fillStyle = "#8c3b2a";
    ctx.beginPath();
    ctx.moveTo(0, top + 40);
    ctx.lineTo(barnW * 0.58, top);
    ctx.lineTo(barnW + 16, top + 40);
    ctx.closePath();
    ctx.fill();
    strokeInk();
    ctx.stroke();
    ctx.fillStyle = WOOD;
    ctx.fillRect(0, top + 34, barnW, wallH);
    strokeInk();
    ctx.strokeRect(0, top + 34, barnW, wallH);
    ctx.fillStyle = "#8d5a32";
    for (let x = 22; x < barnW; x += 28) ctx.fillRect(x, top + 34, 4, wallH);
    const dw = 56;
    const dh = Math.min(92, wallH - 16);
    const dx = barnW - dw - 8;
    const dy = top + 34 + wallH - dh;
    ctx.fillStyle = "#2a2118";
    ctx.fillRect(dx, dy, dw, dh);
    strokeInk();
    ctx.strokeRect(dx, dy, dw, dh);
    ctx.fillStyle = "#9fd4f2";
    ctx.fillRect(22, top + 52, 34, 26);
    strokeInk();
    ctx.strokeRect(22, top + 52, 34, 26);
    return { x: dx + dw / 2, y: hoofY };
  }

  function paintRace(w, h) {
    const g = trackLayout(w, h);
    ctx.fillStyle = "#9fd4f2";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = GRASS;
    ctx.fillRect(0, Math.round(h * 0.18), w, h);
    ctx.fillStyle = "#c4a574";
    ctx.beginPath();
    ctx.ellipse(g.cx, g.cy, g.outerRx, g.outerRy, 0, 0, Math.PI * 2);
    ctx.fill();
    strokeInk();
    ctx.stroke();
    ctx.fillStyle = GRASS;
    ctx.beginPath();
    ctx.ellipse(g.cx, g.cy, g.innerRx, g.innerRy, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    const race = session.race;
    const coming = !!(race && session.horse && raceWalkLive());
    let door = null;
    if (coming) {
      const hoofY = trackPoint(w, h, 0, 0).y;
      ctx.fillStyle = "#c4a574";
      ctx.beginPath();
      const pathX = Math.min(170, g.cx - g.outerRx + 80);
      ctx.roundRect(pathX, hoofY - 16, Math.max(48, g.cx - pathX), 46, 16);
      ctx.fill();
      strokeInk();
      ctx.stroke();
      door = paintRaceBarn(w, h, hoofY);
    }
    ctx.strokeStyle = PAPER;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(g.cx - 10, g.cy + g.outerRy - 10);
    ctx.lineTo(g.cx - 10, g.cy + g.innerRy + 8);
    ctx.stroke();
    if (!race || !session.horse) return;
    const unit = raceUnit(g);
    const near = raceBody(unit, 1);
    const spare = ((g.outerRy - g.innerRy) - near.up) / 2;
    const gap = Math.max(5, Math.min(16, (spare - 8) / 1.5));
    const lanes = { child: -1.5 * gap, Pip: -0.5 * gap, Dot: 0.5 * gap, Hank: 1.5 * gap };
    const horses = [{ key: "child", progress: race.child, appearance: null, label: session.horse.name, exit: 0 }];
    race.rivals.forEach((v, index) => {
      const look = RIVALS[v.name];
      horses.push({
        key: v.name,
        progress: v.progress,
        label: v.name,
        exit: index + 1,
        appearance: {
          id: look.id,
          coat: look.coat,
          mane: look.mane,
          ribbon: look.ribbon,
          care: { brushed: false, saddle: "off", foods: { apple: false, carrot: false } }
        }
      });
    });
    const placed = horses.map((horse) => {
      const point = trackPoint(w, h, coming ? 0 : horse.progress, lanes[horse.key] || 0);
      let hoofX = point.x;
      let hoofY = point.y;
      let gait = trackGait(horse.key);
      let face = raceFacing(coming ? 0 : horse.progress);
      let showChip = true;
      if (coming && door) {
        const raw = (clock - raceWalk.start - horse.exit * 340) / 2600;
        if (raw < 0) return null;
        const u = Math.min(1, raw);
        const move = Math.min(1, u / 0.72);
        const eased = move * move * (3 - 2 * move);
        hoofX = door.x + (point.x - door.x) * eased;
        hoofY = door.y + (point.y - door.y) * eased;
        gait = "walk";
        face = u < 0.72 ? { scale: 1, bend: 0 } : haunchFacing(1, -1, (u - 0.72) / 0.28);
        showChip = move > 0.42;
      }
      return { horse: horse, x: hoofX, y: hoofY, scale: point.scale, gait: gait, face: face, showChip: showChip };
    }).filter((item) => item);
    placed.sort((a, b) => a.y - b.y || a.x - b.x);
    placed.forEach((item) => {
      const scale = item.scale;
      const body = raceBody(unit, scale);
      const box = {
        x: 0,
        y: 0,
        w: unit * scale,
        h: unit * 0.78 * scale,
        anchorX: item.x,
        anchorY: item.y - body.foot
      };
      drawHorse(ctx, box, item.gait, item.horse.appearance, item.face);
      if (!item.showChip) return;
      const label = item.horse.label;
      ctx.font = "700 16px " + FONT;
      const chipW = Math.max(72, ctx.measureText(label).width + 18);
      const chipX = item.x - chipW / 2;
      const chipY = Math.max(150, item.y - body.foot - body.ry * 1.05 - body.hr * 1.85 - 14);
      roundFill(chipX, chipY, chipW, 26, PAPER, 10);
      ctx.fillStyle = INK;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, item.x, chipY + 13);
    });
  }

  function paintCow(cow, w, h) {
    const x = cow.xFrac * w;
    const y = cow.yFrac * h;
    ctx.fillStyle = "#6b3a22";
    ctx.fillRect(x - 46, y + 10, 8, 22);
    ctx.fillStyle = "#f7f1dc";
    ctx.beginPath();
    ctx.ellipse(x, y, 42, 26, 0, 0, Math.PI * 2);
    ctx.fill();
    strokeInk();
    ctx.stroke();
    ctx.fillStyle = "#6b3a22";
    ctx.beginPath();
    ctx.ellipse(x - 8, y - 2, 16, 11, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#f7f1dc";
    ctx.beginPath();
    ctx.ellipse(x + 36, y - 10, 16, 14, 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#f7f1dc";
    ctx.beginPath();
    ctx.ellipse(x + 28, y - 22, 6, 8, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#fffdf8";
    ctx.beginPath();
    ctx.arc(x + 42, y - 12, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.arc(x + 43, y - 12, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x - 30, y + 18);
    ctx.lineTo(x - 34, y + 36);
    ctx.moveTo(x - 12, y + 22);
    ctx.lineTo(x - 10, y + 38);
    ctx.moveTo(x + 10, y + 22);
    ctx.lineTo(x + 14, y + 38);
    ctx.moveTo(x + 24, y + 18);
    ctx.lineTo(x + 30, y + 36);
    ctx.stroke();
    if (cow.state === "loop" && cow.loopMs < 350 && !reduceMotion) {
      ctx.beginPath();
      ctx.arc(x - 4, y - 28, 18, 0, Math.PI * 2);
      ctx.strokeStyle = "#e2a62e";
      ctx.lineWidth = 4;
      ctx.stroke();
    }
  }

  function paintCattle(w, h) {
    ctx.fillStyle = "#9fd4f2";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = GRASS;
    ctx.fillRect(0, Math.round(h * 0.2), w, h);
    const pen = penRect(w, h);
    ctx.fillStyle = "#c4a574";
    ctx.fillRect(pen.x, pen.y, pen.w, pen.h);
    strokeInk();
    ctx.strokeRect(pen.x + 2, pen.y + 2, pen.w - 4, pen.h - 4);
    ctx.strokeStyle = WOOD;
    ctx.lineWidth = 8;
    [0.22, 0.5, 0.78].forEach((frac) => {
      const y = pen.y + pen.h * frac;
      ctx.beginPath();
      ctx.moveTo(pen.x, y);
      ctx.lineTo(pen.x + pen.w, y);
      ctx.stroke();
    });
    ctx.fillStyle = WOOD;
    ctx.fillRect(pen.x - 6, pen.y, 12, pen.h);
    ctx.fillRect(pen.x + pen.w - 6, pen.y, 12, pen.h);
    if (session.horse) {
      const unit = w < 520 ? 150 : 190;
      const homeX = TUNE.field.horseXFrac * w;
      const homeY = h * 0.84;
      const hx = chase.x == null ? homeX : chase.x;
      const hy = chase.y == null ? homeY : chase.y;
      const fieldGait = chase.x == null ? "stand" : chase.gait;
      drawHorse(ctx, {
        x: 0,
        y: 0,
        w: unit,
        h: unit * 0.72,
        anchorX: hx,
        anchorY: hy
      }, fieldGait, null, chaseFacing());
      paintSweat(hx - 20, hy - 70);
    }
    const cattle = session.cattle;
    if (!cattle) return;
    const drawn = cattle.cows.filter((cow) => cow.shown);
    drawn.sort((a, b) => a.yFrac - b.yFrac);
    drawn.forEach((cow) => paintCow(cow, w, h));
  }

  function paintSweat(x, y) {
    if (!session.horse || !session.horse.needs.drink) return;
    ctx.fillStyle = WATER;
    [0, 16, 32].forEach((dx, i) => {
      ctx.beginPath();
      ctx.arc(x + dx, y + (i === 1 ? 10 : 0), 5, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function placeBox(el, box) {
    el.style.left = box.x + "px";
    el.style.top = box.y + "px";
    el.style.width = box.w + "px";
    el.style.height = box.h + "px";
  }

  function syncYard() {
    const key = session.levelId + ":" + ACTIVITIES.length;
    if (key === yardKey) return;
    yardKey = key;
    const host = document.getElementById("activities");
    host.replaceChildren();
    ACTIVITIES.forEach((activity) => {
      if (activity.levels.indexOf(session.levelId) < 0) return;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "big";
      btn.id = "act-" + activity.id;
      btn.dataset.activity = activity.id;
      btn.textContent = activity.label;
      btn.addEventListener("click", () => go(activity.id));
      host.appendChild(btn);
    });
  }

  function syncBack() {
    const place = session.place;
    if (place === "level" || session.chores) {
      backBtn.hidden = true;
      return;
    }
    backBtn.hidden = false;
    let label = "Back";
    if (place === "breed" || place === "yard") label = "Back to Menu";
    else if (place === "stable" || place === "jumps" || place === "race" || place === "cattle" || place === "vet") label = "Back to the yard";
    backBtn.textContent = label;
    backBtn.setAttribute("aria-label", label);
  }

  function render() {
    const place = session.place;
    panelLevel.hidden = place !== "level";
    panelBreed.hidden = place !== "breed";
    panelYard.hidden = place !== "yard";
    dockEl.hidden = place !== "stable";
    hoofUi.hidden = place !== "hoof";
    jumpUi.hidden = place !== "jumps" && place !== "race";
    raceUi.hidden = place !== "race";
    cattleUi.hidden = place !== "cattle" && place !== "chores";
    if (session.horse) whoEl.textContent = session.horse.name;
    const text = bannerText();
    bannerEl.textContent = text;
    bannerEl.hidden = place === "level" || place === "breed";
    document.querySelectorAll("[data-level]").forEach((btn) => {
      btn.setAttribute("aria-pressed", btn.dataset.level === session.levelId ? "true" : "false");
    });
    syncYard();
    syncBack();
    const w = window.innerWidth;
    const h = window.innerHeight;
    dockLayout(w, h).forEach((box) => {
      const el = document.getElementById(box.id);
      if (el) placeBox(el, box);
    });
    const hoof = hoofLayout(w, h, 4);
    hoof.spots.forEach((spot) => {
      const el = document.getElementById(spot.id);
      if (!el) return;
      const live = session.horse && session.horse.care.spots.some((s) => s.id === spot.id);
      el.hidden = place !== "hoof" || !live;
      placeBox(el, spot);
    });
    const done = document.getElementById("hoof-done");
    done.hidden = place !== "hoof";
    placeBox(done, hoofLayout(w, h, spotCount()).done);
    syncJumps(w, h);
    syncCattle(w, h);
    syncDay(w, h);
    syncVet(w, h);
    paint();
  }

  function overlaps(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function barnLayout(w, h) {
    const parts = horseParts(horseBox(w, h), "stand");
    const strap = {
      id: "strap",
      x: Math.round(parts.saddle.cx - 36),
      y: Math.round(parts.saddle.cy - 36),
      w: 72,
      h: 72
    };
    const water = {
      id: "water",
      x: Math.round(parts.trough.cx - 36),
      y: Math.round(parts.trough.cy - 36),
      w: 72,
      h: 72
    };
    if (overlaps(strap, water)) strap.y = Math.max(88, water.y - 80);
    const gap = 8;
    const shoeW = 72;
    const rowW = shoeW * 4 + gap * 3;
    let sx = Math.round((w - rowW) / 2);
    const shoeY = Math.max(88, h - 72 - gap - 72 - 16);
    const shoes = [1, 2, 3, 4].map((n) => {
      const box = { id: "shoe-" + n, x: sx, y: shoeY, w: shoeW, h: shoeW };
      sx += shoeW + gap;
      return box;
    });
    const backY = Math.max(88, h - 72 - 16);
    const cattle = { id: "barn-cattle", x: 16, y: backY, w: Math.max(72, w - 32), h: 72 };
    const again = { id: "day-again", x: Math.round(w / 2 - 168), y: backY, w: 160, h: 72 };
    const yard = { id: "day-yard", x: Math.round(w / 2 + 8), y: backY, w: Math.max(72, Math.min(220, w / 2 - 24)), h: 72 };
    const barnBack = { id: "barn-back", x: Math.round((w - 220) / 2), y: backY, w: 220, h: 72 };
    return { strap: strap, water: water, shoes: shoes, cattle: cattle, again: again, yard: yard, barnBack: barnBack };
  }

  function formatClock(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function syncDay(w, h) {
    const day = session.chores;
    const barn = !!(day && session.place === "stable" && day.phase === "barn");
    const morning = session.place === "stable" && !day;
    ["brush", "saddle", "dock-hooves", "apples", "carrots"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.hidden = !morning;
    });
    const layout = barnLayout(w, h);
    const water = document.getElementById("water");
    const wantWater = !!(session.horse && (session.horse.care.trough !== "full" || session.horse.needs.drink));
    if (barn) {
      water.hidden = !wantWater;
      if (wantWater) placeBox(water, layout.water);
    } else if (morning) {
      water.hidden = false;
    } else {
      water.hidden = true;
    }
    const barnUi = document.getElementById("barn-ui");
    barnUi.hidden = !barn;
    const strap = document.getElementById("strap");
    const wantStrap = barn && session.horse && session.horse.care.saddle === "buckle";
    strap.hidden = !wantStrap;
    placeBox(strap, layout.strap);
    const wantShoes = barn && session.horse && session.horse.needs.shoes > 0;
    layout.shoes.forEach((box) => {
      const el = document.getElementById(box.id);
      el.hidden = !wantShoes;
      placeBox(el, box);
    });
    const cattleBtn = document.getElementById("barn-cattle");
    cattleBtn.hidden = !barn;
    placeBox(cattleBtn, layout.cattle);
    const dayUi = document.getElementById("day-ui");
    const onField = !!(day && session.place === "chores" && day.phase === "field");
    const ending = !!(day && session.place === "chores" && (day.phase === "done" || day.phase === "long"));
    dayUi.hidden = !onField && !ending;
    const barnBack = document.getElementById("barn-back");
    barnBack.hidden = !onField;
    placeBox(barnBack, layout.barnBack);
    const again = document.getElementById("day-again");
    const yard = document.getElementById("day-yard");
    again.hidden = !ending;
    yard.hidden = !ending;
    placeBox(again, layout.again);
    placeBox(yard, layout.yard);
    const clockEl = document.getElementById("clock");
    const showClock = !!(day && (day.phase === "field" || day.phase === "barn"));
    clockEl.hidden = !showClock;
    if (showClock) {
      clockEl.textContent = formatClock(day.msLeft);
      clockEl.classList.toggle("warm", day.msLeft > 0 && day.msLeft <= 30000);
    }
  }

  function vetLayout(w, h) {
    const size = 72;
    const gap = 8;
    const cols = w >= 520 ? 6 : 3;
    const rowW = cols * size + (cols - 1) * gap;
    const left = Math.round((w - rowW) / 2);
    const rows = Math.ceil(VET_PARTS.length / cols);
    const checksTop = h - (rows * size + (rows - 1) * gap) - 16;
    const checks = VET_PARTS.map((id, i) => ({
      id: id,
      x: left + (i % cols) * (size + gap),
      y: checksTop + Math.floor(i / cols) * (size + gap),
      w: size,
      h: size
    }));
    const lessonW = Math.max(72, Math.min(160, Math.floor((w - 48) / 2)));
    const lessonY = Math.max(88, checksTop - gap - size);
    const lessonLeft = Math.round((w - (lessonW * 2 + gap)) / 2);
    const pair = [
      ["lesson-clean", "hoof", 0],
      ["lesson-dirty", "hoof", 1],
      ["lesson-yes", "teeth", 0],
      ["lesson-no", "teeth", 1],
      ["lesson-water", "water", 0],
      ["lesson-empty", "water", 1]
    ];
    const lessons = pair.map((item) => ({
      id: item[0],
      kind: item[1],
      x: lessonLeft + item[2] * (lessonW + gap),
      y: lessonY,
      w: lessonW,
      h: size
    }));
    return { checks: checks, lessons: lessons };
  }

  function syncVet(w, h) {
    const on = session.place === "vet" && !!session.vet;
    vetUi.hidden = !on;
    const layout = vetLayout(w, h);
    const lessonId = on && session.vet.lesson === "pending" ? session.vet.lessonId : null;
    layout.checks.forEach((box) => {
      const el = document.getElementById(box.id);
      el.hidden = !on;
      placeBox(el, box);
    });
    layout.lessons.forEach((box) => {
      const el = document.getElementById(box.id);
      el.hidden = !(on && lessonId === box.kind);
      placeBox(el, box);
    });
  }

  function syncCattle(w, h) {
    const onField = session.place === "cattle" || (session.place === "chores" && session.chores && session.chores.phase !== "barn");
    const on = onField && session.cattle;
    const field = document.getElementById("field");
    placeBox(field, { x: 0, y: 0, w: w, h: h });
    field.hidden = !on;
    const size = TUNE.cowBoxPx;
    for (let i = 1; i <= 6; i++) {
      const el = document.getElementById("cow-" + i);
      const cow = on ? session.cattle.cows.find((c) => c.id === el.id) : null;
      const show = !!(cow && cow.shown && cow.state !== "wait");
      el.hidden = !show;
      if (!show) continue;
      placeBox(el, {
        x: Math.round(cow.xFrac * w - size / 2),
        y: Math.round(cow.yFrac * h - size / 2),
        w: size,
        h: size
      });
    }
  }

  function jumpLayout(w, h) {
    const course = courseNow();
    const size = 72;
    const gap = 8;
    const boxes = [];
    const multi = course.speeds.length > 1;
    const speedW = 72;
    const goW = 120;
    const speeds = ["walk", "trot", "canter"];
    const shownSpeeds = multi ? course.speeds : [];
    const rowW = shownSpeeds.length * speedW + Math.max(0, shownSpeeds.length - 1) * gap + (shownSpeeds.length ? gap : 0) + goW;
    let x = Math.round((w - rowW) / 2);
    const y = Math.max(0, h - size - 16);
    speeds.forEach((id) => {
      const used = shownSpeeds.indexOf(id) >= 0;
      boxes.push({ id: "speed-" + id, x: used ? x : 0, y: y, w: speedW, h: size, used: used });
      if (used) x += speedW + gap;
    });
    boxes.push({ id: "jump-go", x: x, y: y, w: goW, h: size, used: true });
    const ladderIds = session.levelId === "tiny"
      ? ["jump-up"]
      : ["jump-high", "jump-mid", "jump-low"];
    const allLadder = ["jump-up", "jump-high", "jump-mid", "jump-low"];
    const lw = 96;
    const ly = 168;
    const lx = Math.max(0, w - lw - 12);
    allLadder.forEach((id) => {
      const index = ladderIds.indexOf(id);
      const used = index >= 0;
      boxes.push({
        id: id,
        x: lx,
        y: used ? ly + index * (size + gap) : 0,
        w: lw,
        h: size,
        used: used
      });
    });
    return boxes;
  }

  function syncJumps(w, h) {
    const onJump = session.place === "jumps" && session.jumps;
    const onRace = session.place === "race" && session.race;
    jumpUi.hidden = !onJump && !onRace;
    const phase = onJump ? session.jumps.phase : (onRace ? session.race.phase : "");
    const showMove = onJump ? (phase === "ready" || phase === "miss") : phase === "ready";
    const showLadder = onJump && phase === "choose";
    const speedNow = onJump ? session.jumps.speed : (onRace ? session.race.speed : "");
    const colors = {
      "jump-up": [LOW_COLOR, "#fffdf6"],
      "jump-low": [LOW_COLOR, "#fffdf6"],
      "jump-mid": [MID_COLOR, INK],
      "jump-high": [HIGH_COLOR, "#fffdf6"]
    };
    jumpLayout(w, h).forEach((box) => {
      const el = document.getElementById(box.id);
      if (!el) return;
      placeBox(el, box);
      const ladder = box.id !== "jump-go" && box.id.indexOf("jump-") === 0;
      const speed = box.id.indexOf("speed-") === 0;
      if (box.id === "jump-go") el.hidden = !showMove;
      else if (speed) el.hidden = !showMove || !box.used;
      else el.hidden = !showLadder || !box.used;
      if (speed) {
        const name = box.id.slice(6);
        const pressed = speedNow === name;
        el.setAttribute("aria-pressed", pressed ? "true" : "false");
        el.style.background = pressed ? "#ffc857" : PAPER;
        el.style.color = INK;
      } else if (box.id === "jump-go") {
        el.style.background = "#ffc857";
        el.style.color = INK;
      } else if (colors[box.id]) {
        el.style.background = colors[box.id][0];
        el.style.color = colors[box.id][1];
      }
      if (ladder) el.setAttribute("aria-pressed", "false");
    });
    const faster = document.getElementById("faster");
    const fasterBox = { id: "faster", x: Math.round((w - 160) / 2), y: Math.max(0, h - 88), w: 160, h: 72 };
    placeBox(faster, fasterBox);
    faster.hidden = !(onRace && session.race.phase === "run");
  }

  function boxOf(el) {
    const r = el.getBoundingClientRect();
    const x = r.left + r.width / 2;
    const y = r.top + r.height / 2;
    return {
      x: x, y: y,
      nx: x / window.innerWidth,
      ny: y / window.innerHeight,
      w: r.width, h: r.height,
      left: r.left, top: r.top
    };
  }

  function buttonVisible(btn) {
    if (!btn || btn.disabled) return false;
    let el = btn;
    while (el) {
      if (el.hidden) return false;
      el = el.parentElement;
    }
    const r = btn.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }

  function centers() {
    const targets = {};
    document.querySelectorAll("button").forEach((btn) => {
      if (!buttonVisible(btn)) return;
      const key = btn.id || btn.dataset.level || btn.dataset.breed || btn.textContent;
      targets[key] = boxOf(btn);
    });
    const w = window.innerWidth;
    const h = window.innerHeight;
    const parts = horseParts(horseBox(w, h), pose);
    const hoof = hoofLayout(w, h, 4);
    const spots = {};
    hoof.spots.forEach((s) => { spots[s.id] = { x: s.cx, y: s.cy }; });
    const ladder = {};
    if (targets["jump-high"]) ladder.high = targets["jump-high"];
    if (targets["jump-mid"]) ladder.mid = targets["jump-mid"];
    if (targets["jump-low"]) ladder.low = targets["jump-low"];
    if (targets["jump-up"]) ladder.up = targets["jump-up"];
    return {
      targets: targets,
      ladder: ladder,
      samples: {
        trough: { x: parts.trough.cx, y: parts.trough.cy },
        saddle: { x: parts.saddle.cx, y: parts.saddle.cy },
        hoof: spots["spot-1"],
        mouth: { x: parts.mouth.x, y: parts.mouth.y },
        coat: { x: parts.marks[1].x, y: parts.marks[1].y },
        spots: spots,
        leather: { x: hoof.cx, y: hoof.cy }
      }
    };
  }

  function targetsAt(w, h) {
    const targets = [
      { id: "mute", x: 10, y: 10, w: 72, h: 72 },
      { id: "full", x: 90, y: 10, w: 72, h: 72 },
      { id: "back", x: Math.max(172, w - 168), y: 10, w: Math.min(158, Math.max(72, w - 182)), h: 72 }
    ];
    dockLayout(w, h).forEach((box) => targets.push(box));
    const hoof = hoofLayout(w, h, spotCount());
    hoof.spots.forEach((spot) => targets.push({ id: spot.id, x: spot.x, y: spot.y, w: spot.w, h: spot.h }));
    targets.push(hoof.done);
    jumpLayout(w, h).forEach((box) => {
      if (box.used) targets.push({ id: box.id, x: box.x, y: box.y, w: box.w, h: box.h });
    });
    targets.push({ id: "faster", x: Math.round((w - 160) / 2), y: Math.max(0, h - 88), w: 160, h: 72 });
    const barn = barnLayout(w, h);
    targets.push(barn.strap, barn.water, barn.cattle, barn.again, barn.yard, barn.barnBack);
    barn.shoes.forEach((box) => targets.push(box));
    const vet = vetLayout(w, h);
    vet.checks.forEach((box) => targets.push(box));
    vet.lessons.forEach((box) => targets.push(box));
    const cow = TUNE.cowBoxPx;
    TUNE.field.lanes.forEach((lane, i) => {
      const cx = TUNE.field.patrolX[0] * w;
      const cy = lane * h;
      targets.push({ id: "cow-" + (i + 1), x: Math.round(cx - cow / 2), y: Math.round(cy - cow / 2), w: cow, h: cow });
    });
    const panelW = Math.min(460, Math.max(72, w - 24));
    targets.push({ id: "lets-go", x: (w - panelW) / 2, y: 200, w: panelW, h: 76 });
    return { targets: targets };
  }

  function state() {
    const horse = session.horse;
    const cleared = horse ? horse.care.spots.filter((s) => s.cleared).length : 0;
    return {
      level: session.levelId,
      place: session.place,
      breed: horse ? horse.breedId : null,
      name: horse ? horse.name : null,
      brushed: horse ? horse.care.brushed : false,
      trough: horse ? horse.care.trough : "empty",
      saddle: horse ? horse.care.saddle : "off",
      hoofCleared: cleared,
      hoofSpots: horse ? horse.care.spots.length : 0,
      apple: horse ? horse.care.foods.apple : false,
      carrot: horse ? horse.care.foods.carrot : false,
      ready: ready(horse),
      needs: horse ? { drink: horse.needs.drink, shoes: horse.needs.shoes } : { drink: false, shoes: 0 },
      banner: bannerText(),
      jumps: jumpsPublic(),
      race: racePublic(),
      cattle: cattlePublic(),
      chores: choresPublic(),
      vet: vetPublic()
    };
  }

  function jumpsPublic() {
    const j = session.jumps;
    if (!j || session.place !== "jumps") return null;
    return {
      view: j.view,
      speed: j.speed,
      index: j.index,
      need: j.need,
      phase: j.phase,
      approach: j.phase === "choose" ? j.approach : 0,
      pick: j.pick,
      cleared: j.cleared,
      windowMs: j.windowMs
    };
  }

  function racePublic() {
    const race = session.race;
    if (!race || session.place !== "race") return null;
    return {
      speed: race.speed,
      phase: race.phase,
      child: race.child,
      rivals: race.rivals.map((v) => ({ name: v.name, progress: v.progress })),
      place: race.place,
      boost: !!race.boost
    };
  }

  function cattlePublic() {
    const cattle = session.cattle;
    if (!cattle || (session.place !== "cattle" && !session.chores)) return null;
    return {
      phase: cattle.phase,
      pen: cattle.pen,
      cows: cattle.cows.map((cow) => ({ id: cow.id, state: cow.state }))
    };
  }

  function vetPublic() {
    const vet = session.vet;
    if (!vet || session.place !== "vet") return null;
    return {
      caseId: vet.caseId,
      checked: vet.checked.slice(),
      lessonId: vet.lessonId,
      lesson: vet.lesson
    };
  }

  function choresPublic() {
    const day = session.chores;
    if (!day) return null;
    return {
      phase: day.phase,
      msLeft: day.msLeft,
      rideMs: day.rideMs,
      events: {
        drink: !!day.events.drink,
        buckle: !!day.events.buckle,
        shoes: !!day.events.shoes
      },
      morning: { trough: day.morning.trough, saddle: day.morning.saddle }
    };
  }

  function tap(nx, ny) {
    const x = nx * window.innerWidth;
    const y = ny * window.innerHeight;
    const el = document.elementFromPoint(x, y);
    const btn = el && el.closest("button");
    if (btn) btn.click();
    render();
  }

  function eyesOn() {
    return !!(gazeHold || (gazeSock && gazeSock.readyState === 1));
  }

  function eyesLive(now) {
    return !!(gazePoint && now - gazeAt < GAZE_FRESH_MS && eyesOn());
  }

  function gazeTarget() {
    if (!gazePoint) return null;
    const el = document.elementFromPoint(gazePoint.x, gazePoint.y);
    const btn = el && el.closest("button");
    if (btn && buttonVisible(btn)) {
      const play = btn.getAttribute("data-play") === "true";
      return {
        key: btn,
        ms: play ? PLAY_DWELL_MS : MENU_DWELL_MS,
        fire: () => {
          ensureAudio();
          gazeCommit = btn.id === "faster";
          btn.click();
          gazeCommit = false;
        }
      };
    }
    return null;
  }

  function stepGaze(now) {
    const on = eyesOn();
    eyesEl.hidden = !on;
    const live = eyesLive(now);
    if (!live) {
      gazeEl.hidden = true;
      dwellKey = null;
      dwellFired = false;
      dwellProgress = 0;
      gazeEl.style.setProperty("--p", "0%");
      return;
    }
    if (pointerActive) {
      dwellKey = null;
      dwellFired = false;
      dwellProgress = 0;
      gazeEl.hidden = false;
      gazeEl.style.left = gazePoint.x + "px";
      gazeEl.style.top = gazePoint.y + "px";
      gazeEl.style.setProperty("--p", "0%");
      return;
    }
    gazeEl.hidden = false;
    gazeEl.style.left = gazePoint.x + "px";
    gazeEl.style.top = gazePoint.y + "px";
    const target = gazeTarget();
    const key = target ? target.key : null;
    if (key !== dwellKey) {
      dwellKey = key;
      dwellStart = now;
      dwellFired = false;
    }
    let p = 0;
    if (target && !dwellFired) {
      p = Math.min(1, (now - dwellStart) / target.ms);
      if (now - dwellStart >= target.ms) {
        dwellFired = true;
        p = 1;
        target.fire();
      }
    } else if (target) p = 1;
    dwellProgress = target ? p : 0;
    gazeEl.style.setProperty("--p", Math.round((target ? p : 0) * 100) + "%");
  }

  function step(now) {
    const prev = clock;
    const dtSec = (now - prev) / 1000;
    clock = now;
    if (pose === "brush" && brushUntil && now >= brushUntil) pose = "stand";
    if (pose === "eat" && eatUntil && now >= eatUntil) {
      pose = "stand";
      eatUntil = 0;
      eating = null;
    }
    if (travel && now >= travel.start + travel.ms) {
      const dest = travel.dest;
      const kind = travel.kind;
      travel = null;
      if (kind === "out") {
        pose = "stand";
        go(dest, { arrive: true });
      } else if (pose === "walk") pose = "stand";
    }
    if (session.place === "hoof" && hoofReturnAt && now >= hoofReturnAt) {
      hoofReturnAt = 0;
      go("stable");
    }
    if (gazeHold) {
      if (!haveSmooth) {
        smoothed = { x: gazeHold.x, y: gazeHold.y };
        haveSmooth = true;
      } else {
        smoothed.x += (gazeHold.x - smoothed.x) * 0.45;
        smoothed.y += (gazeHold.y - smoothed.y) * 0.45;
      }
      gazePoint = smoothed;
      if (refreshHold) gazeAt = now;
    }
    if (dtSec > 0 && dtSec < 120) advanceCattle(now - prev);
    stepGaze(now);
    if (dtSec > 0 && dtSec < 120) {
      advanceJumps(now - prev);
      advanceRace(prev, now);
      advanceChores(now - prev);
      updateChase(now - prev);
    }
    render();
  }

  function trackGait(key) {
    const race = session.race;
    if (!race || race.phase === "ready" || race.phase === "done") return "stand";
    if (key === "child") return race.boost ? "gallop" : race.speed;
    if (key === "Pip") return "trot";
    if (key === "Dot") return "canter";
    if (key === "Hank") return "gallop";
    return "trot";
  }

  function updateChase(dtMs) {
    const playing = session.place === "cattle" || (session.place === "chores" && session.chores && session.chores.phase === "field");
    if (!playing || !session.cattle || !session.horse) return;
    const w = window.innerWidth;
    const h = window.innerHeight;
    if (w < 2 || h < 2) return;
    const homeX = TUNE.field.horseXFrac * w;
    const homeY = h * 0.84;
    if (chase.x == null) {
      chase.x = homeX;
      chase.y = homeY;
    }
    if (reduceMotion) {
      chase.x = homeX;
      chase.y = homeY;
      chase.gait = "stand";
      chase.face = 1;
      chase.shown = 1;
      chase.turnFrom = 0;
      chase.turnTo = 1;
      return;
    }
    const target = session.cattle.cows.find((cow) => cow.state === "loop");
    let goalX = homeX;
    let goalY = homeY;
    if (target) {
      const cowX = target.xFrac * w;
      const dir = cowX >= chase.x ? 1 : -1;
      goalX = cowX - dir * 86;
      goalY = target.yFrac * h;
    }
    const dx = goalX - chase.x;
    const dy = goalY - chase.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 6) {
      const speed = dist > 170 ? 320 : 180;
      const stepPx = Math.min(dist, speed * dtMs / 1000);
      chase.x += (dx / dist) * stepPx;
      chase.y += (dy / dist) * stepPx;
      chase.gait = dist > 170 ? "gallop" : "canter";
    } else {
      chase.gait = target ? "canter" : "stand";
    }
    let want = chase.shown;
    if (dist > 6 && Math.abs(dx) > 4) want = dx < 0 ? -1 : 1;
    else if (!target) want = 1;
    askChaseTurn(want);
  }

  function finishChaseTurn() {
    if (!chase.turnFrom || clock - chase.turnFrom < 650) return;
    chase.shown = chase.turnTo;
    chase.face = chase.shown;
    chase.turnFrom = 0;
  }

  function askChaseTurn(want) {
    finishChaseTurn();
    if (chase.turnFrom) return;
    if (want === chase.shown) {
      chase.face = chase.shown;
      return;
    }
    chase.turnFrom = clock;
    chase.turnTo = want;
    chase.face = want;
  }

  function chaseFacing() {
    if (!chase.turnFrom) return { scale: chase.shown || 1, bend: 0 };
    const t = (clock - chase.turnFrom) / 650;
    if (t <= 0) return { scale: chase.shown || 1, bend: 0 };
    if (t >= 1) return { scale: chase.turnTo || 1, bend: 0 };
    return haunchFacing(chase.shown || 1, chase.turnTo || 1, t);
  }

  function look(nx, ny) {
    gazeHold = { x: nx * window.innerWidth, y: ny * window.innerHeight };
    refreshHold = true;
    if (!haveSmooth) {
      smoothed = { x: gazeHold.x, y: gazeHold.y };
      haveSmooth = true;
      gazePoint = smoothed;
      gazeAt = clock;
    }
  }

  function releaseLook() {
    gazeHold = null;
    refreshHold = false;
    haveSmooth = false;
    smoothed = null;
    gazePoint = null;
    gazeAt = 0;
    dwellKey = null;
    dwellFired = false;
    dwellProgress = 0;
    gazeEl.hidden = true;
    eyesEl.hidden = true;
    gazeEl.style.setProperty("--p", "0%");
  }

  function scheduleGaze() {
    if (gazeTimer || suppressReconnect || checking) return;
    gazeTimer = setTimeout(() => { gazeTimer = 0; connectGaze(); }, 2000);
  }

  function connectGaze() {
    if (suppressReconnect || checking) return;
    if (gazeSock && gazeSock.readyState <= 1) return;
    let sock;
    try { sock = new WebSocket(GAZE_URL); }
    catch (e) { scheduleGaze(); return; }
    gazeSock = sock;
    sock.binaryType = "arraybuffer";
    sock.onopen = () => {
      if (checking) { sock.close(); return; }
      gazeBuf = new Uint8Array(0);
      sock.send(new Uint8Array([1, 4, 0, 0, 0, 0, 5, 0, 0]));
    };
    sock.onmessage = (ev) => {
      if (ev.data instanceof ArrayBuffer) takeGaze(new Uint8Array(ev.data));
    };
    sock.onerror = () => {};
    sock.onclose = () => {
      if (gazeSock === sock) gazeSock = null;
      if (!gazeHold && !checking) { gazePoint = null; gazeAt = 0; }
      if (!suppressReconnect && !checking) scheduleGaze();
    };
  }

  function takeGaze(chunk) {
    if (checking || gazeHold) return;
    const buf = gazeBuf.length ? concatBytes(gazeBuf, chunk) : chunk;
    const view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    let pos = 0;
    while (pos + 5 <= buf.length) {
      const len = view.getUint32(pos + 1, true);
      if (len > 1048576) { gazeBuf = new Uint8Array(0); return; }
      if (pos + 5 + len > buf.length) break;
      const payload = new DataView(buf.buffer, buf.byteOffset + pos + 5, len);
      if (buf[pos] === 1 && len >= 56) applyGaze(payload);
      else if (buf[pos] === 4) applyWarpMessage(payload);
      pos += 5 + len;
    }
    gazeBuf = pos === 0 ? buf : buf.slice(pos);
  }

  function concatBytes(a, b) {
    const out = new Uint8Array(a.length + b.length);
    out.set(a, 0);
    out.set(b, a.length);
    return out;
  }

  function pushRaw(raw) {
    if (!haveSmooth) {
      smoothed = { x: raw.x, y: raw.y };
      haveSmooth = true;
    } else {
      smoothed.x += (raw.x - smoothed.x) * 0.45;
      smoothed.y += (raw.y - smoothed.y) * 0.45;
    }
    gazePoint = smoothed;
    gazeAt = clock || performance.now();
  }

  function applyGaze(view) {
    const mask = view.getUint32(0, true);
    if ((mask & 64) === 0) return;
    if (mask & 12) {
      const left = (mask & 4) ? view.getUint32(8, true) : 4;
      const right = (mask & 8) ? view.getUint32(12, true) : 4;
      if (left !== 0 && right !== 0) return;
    }
    const x = view.getFloat64(40, true);
    const y = view.getFloat64(48, true);
    if (!Number.isFinite(x) || !Number.isFinite(y) || x < 0 || y < 0) return;
    const point = warpPoint(x, y);
    pushRaw({ x: point.x * window.innerWidth, y: point.y * window.innerHeight });
  }

  function applyWarpMessage(view) {
    if (view.byteLength === 0) { gazeWarp = null; return; }
    if (view.byteLength < 72) return;
    const next = new Float64Array(9);
    for (let i = 0; i < 9; i++) next[i] = view.getFloat64(i * 8, true);
    for (let i = 0; i < 9; i++) if (!Number.isFinite(next[i])) return;
    gazeWarp = next;
  }

  function warpPoint(x, y) {
    const h = gazeWarp;
    if (!h) return { x: x, y: y };
    const w = h[6] * x + h[7] * y + h[8];
    if (Math.abs(w) < 1e-9) return { x: x, y: y };
    return {
      x: (h[0] * x + h[1] * y + h[2]) / w,
      y: (h[3] * x + h[4] * y + h[5]) / w
    };
  }

  function pixelAt(x, y) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const px = Math.max(0, Math.min(canvas.width - 1, Math.round(x * dpr)));
    const py = Math.max(0, Math.min(canvas.height - 1, Math.round(y * dpr)));
    const data = ctx.getImageData(px, py, 1, 1).data;
    return { r: data[0], g: data[1], b: data[2] };
  }

  function hexRgb(hex) {
    return {
      r: parseInt(hex.slice(1, 3), 16),
      g: parseInt(hex.slice(3, 5), 16),
      b: parseInt(hex.slice(5, 7), 16)
    };
  }

  function colorDist(px, hex) {
    const c = hexRgb(hex);
    return Math.hypot(px.r - c.r, px.g - c.g, px.b - c.b);
  }

  function nearColor(px, hex, tol) {
    const c = hexRgb(hex);
    return Math.abs(px.r - c.r) <= tol && Math.abs(px.g - c.g) <= tol && Math.abs(px.b - c.b) <= tol;
  }

  function rgbChannels(css) {
    const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(css || "");
    if (!m) return null;
    return { r: +m[1], g: +m[2], b: +m[3] };
  }

  function visibleHeading() {
    const list = document.querySelectorAll("h1");
    for (let i = 0; i < list.length; i++) {
      if (list[i].getClientRects().length > 0) return list[i].textContent.trim();
    }
    return "";
  }

  function selfCheck() {
    const failures = [];
    checking = true;
    suppressReconnect = true;
    function fail(name, detail) { failures.push(name + ": " + detail); }
    try {
      if (window.innerWidth < 320 || window.innerHeight < 320) {
        fail("Case 12", "window is too small (" + window.innerWidth + "x" + window.innerHeight + ")");
        return { ok: false, failures: failures };
      }
      let t = 10000;
      step(t);

      go("breed");
      const pat = centers().targets.pinto;
      tap(pat.nx, pat.ny);
      if (state().name !== "Patches" || visibleHeading() !== "Patches") {
        fail("Case 1", "name " + state().name + " heading " + JSON.stringify(visibleHeading()) + " place " + state().place);
      }

      go("stable");
      const brush = centers().targets.brush;
      tap(brush.nx, brush.ny);
      const coat = pixelAt(centers().samples.coat.x, centers().samples.coat.y);
      const coatHex = breedMeta("pinto").coat;
      if (!state().brushed || state().banner === "Brush." || bannerEl.textContent === "Brush." || nearColor(coat, coatHex, 12)) {
        fail("Case 2", "brushed " + state().brushed + " banner " + state().banner + " coat " + coat.r + "," + coat.g + "," + coat.b);
      }

      const water = centers().targets.water;
      tap(water.nx, water.ny);
      const wet = pixelAt(centers().samples.trough.x, centers().samples.trough.y);
      if (state().trough !== "full" || wet.b < wet.r + 30) {
        fail("Case 3", "trough " + state().trough + " pixel " + wet.r + "," + wet.g + "," + wet.b);
      }

      tap(water.nx, water.ny);
      const wet2 = pixelAt(centers().samples.trough.x, centers().samples.trough.y);
      if (state().trough !== "full" || wet2.b < wet2.r + 30) {
        fail("Case 4", "trough " + state().trough + " pixel " + wet2.r + "," + wet2.g + "," + wet2.b);
      }

      const beforeSaddle = pixelAt(centers().samples.saddle.x, centers().samples.saddle.y);
      const beforeDist = colorDist(beforeSaddle, SADDLE);
      tap(centers().targets.saddle.nx, centers().targets.saddle.ny);
      const afterSaddle = pixelAt(centers().samples.saddle.x, centers().samples.saddle.y);
      const afterDist = colorDist(afterSaddle, SADDLE);
      if (!(afterDist < beforeDist)) {
        fail("Case 5", "saddle did not move toward the leather " + beforeDist.toFixed(1) + " -> " + afterDist.toFixed(1) + " at " + Math.round(centers().samples.saddle.x) + "," + Math.round(centers().samples.saddle.y));
      }
      tap(centers().targets.saddle.nx, centers().targets.saddle.ny);
      if (state().saddle !== "on") fail("Case 5", "second saddle is " + state().saddle);

      go("hoof");
      const spot1 = centers().targets["spot-1"];
      tap(spot1.nx, spot1.ny);
      if (state().hoofCleared !== 1 || state().ready) {
        fail("Case 6", "cleared " + state().hoofCleared + " ready " + state().ready);
      }
      tap(spot1.nx, spot1.ny);
      const dirt = pixelAt(centers().samples.spots["spot-2"].x, centers().samples.spots["spot-2"].y);
      if (state().hoofCleared !== 1 || !nearColor(dirt, DIRT, 2)) {
        fail("Case 6", "count " + state().hoofCleared + " dirt " + dirt.r + "," + dirt.g + "," + dirt.b);
      }

      tap(centers().targets["spot-2"].nx, centers().targets["spot-2"].ny);
      const clean = pixelAt(centers().samples.spots["spot-2"].x, centers().samples.spots["spot-2"].y);
      if (state().hoofCleared !== state().hoofSpots || !nearColor(clean, HOOF, 2)) {
        fail("Case 7", "cleared " + state().hoofCleared + "/" + state().hoofSpots + " pixel " + clean.r + "," + clean.g + "," + clean.b + " place " + state().place);
      }
      step(clock + TUNE.hoofReturnMs + 50);
      t = clock;
      if (state().place !== "stable") fail("Case 7", "place after return " + state().place);

      const mouthBefore = pixelAt(centers().samples.mouth.x, centers().samples.mouth.y);
      const mouthBeforeDist = colorDist(mouthBefore, APPLE);
      tap(centers().targets.apples.nx, centers().targets.apples.ny);
      const mouth = pixelAt(centers().samples.mouth.x, centers().samples.mouth.y);
      if (!state().apple || !(colorDist(mouth, APPLE) < mouthBeforeDist)) {
        fail("Case 8", "apple " + state().apple + " mouth " + mouth.r + "," + mouth.g + "," + mouth.b + " at " + Math.round(centers().samples.mouth.x) + "," + Math.round(centers().samples.mouth.y));
      }
      tap(centers().targets.apples.nx, centers().targets.apples.ny);
      if (!state().apple) fail("Case 8", "second apple cleared the flag");
      tap(centers().targets.carrots.nx, centers().targets.carrots.ny);
      if (!state().carrot || !state().apple) fail("Case 8", "foods apple " + state().apple + " carrot " + state().carrot);

      if (!state().ready || state().banner !== "Patches is ready." || bannerEl.textContent !== "Patches is ready.") {
        fail("Case 9", "ready " + state().ready + " banner " + state().banner);
      }

      releaseLook();
      breed("gray");
      go("stable");
      const freshBrush = centers().targets.brush;
      look(freshBrush.nx, freshBrush.ny);
      t = Math.max(t, clock);
      step(t);
      step(t + 640);
      if (state().brushed) fail("Case 10", "brush fired at 640 ms");
      step(t + 660);
      t = t + 660;
      if (!state().brushed) fail("Case 10", "brush missed at 660 ms");
      releaseLook();
      tap(centers().targets.carrots.nx, centers().targets.carrots.ny);
      if (!state().carrot) fail("Case 10", "carrot tap after gaze did not feed");

      go("level");
      releaseLook();
      const lets = centers().targets["lets-go"];
      look(lets.nx, lets.ny);
      t = Math.max(t, clock);
      step(t);
      step(t + 600);
      if (state().place !== "level") fail("Case 11", "left level at 600 ms to " + state().place);
      step(t + 1300);
      t = t + 1300;
      if (state().place === "level") fail("Case 11", "still on level at 1300 ms");
      if (state().place !== "yard") fail("Case 11", "horse path landed on " + state().place);
      releaseLook();

      const savedHorse = session.horse;
      const savedPlace = session.place;
      session.horse = null;
      go("level");
      releaseLook();
      const letsEmpty = centers().targets["lets-go"];
      look(letsEmpty.nx, letsEmpty.ny);
      t = Math.max(t, clock) + 1;
      step(t);
      step(t + 1300);
      t = t + 1300;
      if (state().place !== "breed") fail("Case 11", "no-horse path landed on " + state().place);
      releaseLook();
      session.horse = savedHorse;
      session.place = savedPlace;
      render();

      function assertShort(list, label) {
        list.forEach((box) => {
          const short = Math.min(box.w, box.h);
          if (!(short >= 72)) fail("Case 12", label + " " + box.id + " is " + Math.round(box.w) + "x" + Math.round(box.h));
        });
      }
      assertShort(targetsAt(390, 844).targets, "390");
      assertShort(targetsAt(1024, 768).targets, "1024");
      if (window.innerWidth >= 390 && window.innerHeight >= 700) {
        ["level", "breed", "yard", "stable", "hoof"].forEach((place) => {
          go(place);
          document.querySelectorAll("button").forEach((btn) => {
            if (!buttonVisible(btn)) return;
            const r = btn.getBoundingClientRect();
            const short = Math.min(r.width, r.height);
            if (short < 72) {
              fail("Case 12", place + " " + (btn.id || btn.textContent) + " is " + Math.round(r.width) + "x" + Math.round(r.height));
            }
          });
        });
      }

      go("breed");
      ["pinto", "bay"].forEach((id) => {
        const btn = document.getElementById(id);
        const chip = btn.querySelector(".chip");
        const chipBg = rgbChannels(getComputedStyle(chip).backgroundColor);
        const chipFg = rgbChannels(getComputedStyle(chip).color);
        const btnBg = rgbChannels(getComputedStyle(btn).backgroundColor);
        const paper = hexRgb(PAPER);
        const ink = hexRgb(INK);
        const coat = hexRgb(breedMeta(id).coat);
        const chipOk = chipBg && Math.abs(chipBg.r - paper.r) <= 1 && Math.abs(chipBg.g - paper.g) <= 1 && Math.abs(chipBg.b - paper.b) <= 1;
        const inkOk = chipFg && Math.abs(chipFg.r - ink.r) <= 1 && Math.abs(chipFg.g - ink.g) <= 1 && Math.abs(chipFg.b - ink.b) <= 1;
        const coatOk = btnBg && Math.abs(btnBg.r - coat.r) <= 1 && Math.abs(btnBg.g - coat.g) <= 1 && Math.abs(btnBg.b - coat.b) <= 1;
        if (!chipOk || !inkOk || !coatOk) {
          fail("Case 13", id + " chip " + JSON.stringify(chipBg) + " ink " + JSON.stringify(chipFg) + " coat " + JSON.stringify(btnBg));
        }
      });

      level("tiny");
      breed("bay");
      go("hoof");
      releaseLook();
      const liveSpot = centers().targets["spot-1"];
      look(liveSpot.nx, liveSpot.ny);
      t = Math.max(t, clock) + 1;
      step(t);
      step(t + 660);
      t = t + 660;
      if (state().hoofCleared !== 1) fail("Case 13", "spot look cleared " + state().hoofCleared);
      releaseLook();
      const leather = centers().samples.leather;
      const hit = document.elementFromPoint(leather.x, leather.y);
      const hitBtn = hit && hit.closest("button");
      if (hitBtn) fail("Case 13", "leather point hit " + (hitBtn.id || hitBtn.textContent));
      look(leather.x / window.innerWidth, leather.y / window.innerHeight);
      t = Math.max(t, clock) + 1;
      step(t);
      step(t + 660);
      if (state().hoofCleared !== 1) fail("Case 13", "leather look cleared " + state().hoofCleared);
      releaseLook();

      const careSnap = {
        breed: state().breed,
        brushed: state().brushed,
        trough: state().trough,
        saddle: state().saddle,
        hoofCleared: state().hoofCleared,
        hoofSpots: state().hoofSpots,
        apple: state().apple,
        carrot: state().carrot
      };
      function careSame() {
        return state().breed === careSnap.breed && state().brushed === careSnap.brushed &&
          state().trough === careSnap.trough && state().saddle === careSnap.saddle &&
          state().hoofCleared === careSnap.hoofCleared && state().hoofSpots === careSnap.hoofSpots &&
          state().apple === careSnap.apple && state().carrot === careSnap.carrot;
      }
      function jumpFail(detail) { fail("Jumps", detail); }
      function reachIndex(index) {
        let guard = 0;
        while (state().jumps && state().jumps.index < index && guard < 12) {
          guard += 1;
          const phase = state().jumps.phase;
          if (phase === "ready" || phase === "miss") document.getElementById("jump-go").click();
          if (state().jumps.phase !== "choose") {
            jumpFail("needed choose to reach " + index + " and found " + state().jumps.phase);
            return;
          }
          const before = state().jumps.index;
          pickHeight(state().jumps.need);
          step(clock + TUNE.jumpMs);
          if (state().jumps.phase === "gap") step(clock + TUNE.gapMs);
          if (state().jumps.index === before) {
            jumpFail("index stayed " + before);
            return;
          }
        }
      }

      level("tiny");
      go("jumps");
      if (!careSame()) jumpFail("ride rewrote care");
      if (!state().jumps || state().jumps.phase !== "ready" || state().jumps.speed !== "walk" || state().jumps.view !== "side") {
        jumpFail("tiny ready " + JSON.stringify(state().jumps));
      }
      if (centers().targets["speed-walk"] || centers().targets["jump-up"]) jumpFail("tiny ready showed a speed or a ladder");
      if (state().banner !== "Ready.") jumpFail("ready banner " + state().banner);
      document.getElementById("jump-go").click();
      if (state().jumps.phase !== "choose" || state().jumps.pick !== null || state().jumps.approach !== 0) {
        jumpFail("go did not open choose " + JSON.stringify(state().jumps));
      }
      if (!centers().targets["jump-up"] || centers().targets["jump-low"] || centers().targets["jump-go"]) {
        jumpFail("tiny choose targets " + Object.keys(centers().targets).join(","));
      }
      step(clock + 1500);
      if (state().jumps.phase !== "choose" || Math.abs(state().jumps.approach - 0.5) > 0.02 || state().jumps.index !== 0) {
        jumpFail("half window " + JSON.stringify(state().jumps));
      }
      step(clock + 1500);
      if (state().jumps.phase !== "miss" || state().jumps.approach !== 0 || state().jumps.index !== 0 || state().jumps.cleared !== 0) {
        jumpFail("timeout " + JSON.stringify(state().jumps));
      }
      if (state().banner !== "Try again." || bannerEl.textContent !== "Try again.") jumpFail("miss banner " + state().banner);
      document.getElementById("jump-go").click();
      step(clock + 120000);
      if (state().jumps.phase !== "choose" || state().jumps.approach !== 0 || state().jumps.index !== 0) {
        jumpFail("120s step moved the window " + JSON.stringify(state().jumps));
      }
      step(clock + 10000);
      if (state().jumps.phase !== "miss" || state().jumps.index !== 0) jumpFail("10s step did not expire " + JSON.stringify(state().jumps));
      document.getElementById("jump-go").click();
      document.getElementById("jump-up").click();
      if (state().jumps.phase !== "jump" || state().jumps.cleared !== 1 || state().jumps.approach !== 0) {
        jumpFail("up " + JSON.stringify(state().jumps));
      }
      step(clock + TUNE.jumpMs);
      if (state().jumps.cleared !== 1 || state().jumps.phase !== "done" || state().banner !== "All the jumps.") {
        jumpFail("after the log " + JSON.stringify(state().jumps) + " banner " + state().banner);
      }
      pickHeight(1);
      if (state().jumps.phase !== "done" || state().jumps.cleared !== 1) jumpFail("pick after done changed the course");

      level("shop");
      go("jumps");
      if (state().jumps.speed !== "walk" || state().jumps.windowMs !== 3000 || state().jumps.view !== "side") {
        jumpFail("shop ready " + JSON.stringify(state().jumps));
      }
      if (!centers().targets["speed-walk"] || !centers().targets["speed-trot"] || centers().targets["speed-canter"]) {
        jumpFail("shop speeds " + Object.keys(centers().targets).join(","));
      }
      document.getElementById("jump-go").click();
      pickHeight(1);
      step(clock + TUNE.jumpMs);
      if (state().jumps.phase !== "gap") jumpFail("shop first jump " + state().jumps.phase);
      step(clock + TUNE.gapMs);
      if (state().jumps.phase !== "choose" || state().jumps.index !== 1 || state().jumps.need !== 2) {
        jumpFail("shop middle " + JSON.stringify(state().jumps));
      }
      pickHeight(1);
      if (state().jumps.phase !== "miss" || state().jumps.index !== 1 || state().jumps.approach !== 0 || state().jumps.cleared !== 1) {
        jumpFail("low on middle " + JSON.stringify(state().jumps));
      }
      if (state().banner !== "Try again.") jumpFail("shop miss banner " + state().banner);
      document.getElementById("jump-go").click();
      pickHeight(2);
      if (state().jumps.phase !== "jump" || state().jumps.cleared !== 2 || state().jumps.pick !== 2 || state().jumps.index !== 1) {
        jumpFail("middle after go " + JSON.stringify(state().jumps));
      }
      pickHeight(1);
      if (state().jumps.phase !== "jump" || state().jumps.pick !== 2) jumpFail("second pick replaced a clear");

      level("rush");
      go("jumps");
      if (state().jumps.view !== "first" || state().jumps.speed !== "trot" || state().jumps.windowMs !== 2000) {
        jumpFail("rush ready " + JSON.stringify(state().jumps));
      }
      document.getElementById("jump-go").click();
      const highBox = centers().ladder.high;
      if (!highBox || Math.min(highBox.w, highBox.h) < 72) jumpFail("high ladder " + JSON.stringify(highBox));
      ["jump-high", "jump-mid", "jump-low"].forEach((id) => {
        const box = centers().targets[id];
        if (!box || Math.min(box.w, box.h) < 72) jumpFail(id + " short side");
        if (box.left < 0 || box.top < 0 || box.left + box.w > window.innerWidth + 1 || box.top + box.h > window.innerHeight + 1) {
          jumpFail(id + " off screen");
        }
      });
      look(0.5, 0.2);
      t = Math.max(t, clock) + 1;
      step(t);
      step(t + 660);
      if (state().jumps.pick !== null || state().jumps.phase !== "choose") {
        jumpFail("sky look " + JSON.stringify(state().jumps));
      }
      releaseLook();

      go("jumps");
      document.getElementById("speed-canter").click();
      if (state().jumps.speed !== "canter" || state().jumps.windowMs !== 1600) jumpFail("canter " + JSON.stringify(state().jumps));
      document.getElementById("jump-go").click();
      const lowBox = centers().targets["jump-low"];
      const highPick = centers().targets["jump-high"];
      t = clock + 1;
      look(lowBox.nx, lowBox.ny);
      step(t);
      step(t + 400);
      if (state().jumps.phase !== "choose" || state().jumps.pick !== null) jumpFail("low dwell committed early");
      look(highPick.nx, highPick.ny);
      for (let i = 0; i < 8; i++) step(t + 400);
      if (state().jumps.phase !== "choose" || state().jumps.pick !== null) jumpFail("high look committed before 650 ms");
      step(t + 1060);
      if (state().jumps.phase !== "jump" || state().jumps.pick !== 3 || state().jumps.need !== 1) {
        jumpFail("corrected to high " + JSON.stringify(state().jumps));
      }
      releaseLook();

      go("jumps");
      reachIndex(3);
      if (!state().jumps || state().jumps.phase !== "choose" || state().jumps.need !== 3 || state().jumps.index !== 3) {
        jumpFail("high obstacle " + JSON.stringify(state().jumps));
      }
      const beforeHigh = state().jumps.cleared;
      const lowMiss = centers().targets["jump-low"];
      t = clock + 1;
      look(lowMiss.nx, lowMiss.ny);
      step(t);
      step(t + 660);
      if (state().jumps.phase !== "miss" || state().jumps.index !== 3 || state().jumps.cleared !== beforeHigh || state().jumps.approach !== 0) {
        jumpFail("low on high " + JSON.stringify(state().jumps));
      }
      releaseLook();
      const highAfter = centers().targets["jump-high"];
      if (highAfter) jumpFail("ladder stayed up after a miss");
      look(0.82, 0.45);
      t = clock + 1;
      step(t);
      step(t + 660);
      if (state().jumps.phase !== "miss" || state().jumps.cleared !== beforeHigh || state().jumps.index !== 3) {
        jumpFail("high look cleared a miss " + JSON.stringify(state().jumps));
      }
      releaseLook();
      document.getElementById("jump-go").click();
      const highGo = centers().targets["jump-high"];
      t = clock + 1;
      look(highGo.nx, highGo.ny);
      step(t);
      step(t + 660);
      if (state().jumps.phase !== "jump" || state().jumps.pick !== 3 || state().jumps.cleared !== beforeHigh + 1 || state().jumps.index !== 3) {
        jumpFail("high clear " + JSON.stringify(state().jumps));
      }
      releaseLook();
      if (!careSame()) jumpFail("ride rewrote care after the course");
      if (state().race || state().cattle || state().chores || state().vet) jumpFail("later records appeared");
      applyDeepLink(new URLSearchParams("jumps"));
      if (state().level !== "little" || state().place !== "jumps" || !state().jumps || state().jumps.phase !== "ready" || state().jumps.view !== "side") {
        jumpFail("jumps link " + JSON.stringify({ level: state().level, place: state().place, jumps: state().jumps }));
      }
      if (state().breed !== careSnap.breed || state().hoofSpots !== careSnap.hoofSpots || state().hoofCleared !== careSnap.hoofCleared) {
        jumpFail("jumps link rebuilt the horse");
      }

      function raceFail(detail) { fail("Race", detail); }
      level("tiny");
      go("yard");
      if (document.getElementById("act-race")) raceFail("tiny shows a race");
      go("race");
      if (state().place !== "yard" || state().race) raceFail("tiny entered the race");
      level("little");
      go("race");
      if (!careSame()) raceFail("race rewrote care");
      if (!state().race || state().race.phase !== "ready" || state().race.speed !== "walk" || state().race.rivals.length !== 1) {
        raceFail("little ready " + JSON.stringify(state().race));
      }
      if (centers().targets.faster) raceFail("faster showed before the lap");
      document.getElementById("jump-go").click();
      if (state().race.phase !== "run" || state().race.child !== 0 || state().banner !== "Race.") {
        raceFail("go " + JSON.stringify(state().race) + " " + state().banner);
      }
      const fasterBox = centers().targets.faster;
      if (!fasterBox || Math.min(fasterBox.w, fasterBox.h) < 72) raceFail("faster size " + JSON.stringify(fasterBox));
      step(clock + 120000);
      if (state().race.child !== 0 || state().race.phase !== "run") raceFail("120s step moved the lap " + state().race.child);
      step(clock + 10000);
      if (!(state().race.child > 0.75 && state().race.child < 0.85)) raceFail("10s step child " + state().race.child);

      go("race");
      document.getElementById("jump-go").click();
      let guard = 0;
      while (state().race.phase === "run" && guard < 40) {
        step(clock + 1000);
        guard += 1;
      }
      const pip = state().race.rivals[0];
      if (state().race.phase !== "done" || state().race.place !== 2 || state().race.child !== 1 || !pip || pip.progress < 0.999) {
        raceFail("no faster " + JSON.stringify(state().race));
      }
      if (state().banner.indexOf("You finished.") !== 0 || state().banner.indexOf("Second.") < 0 || state().banner.indexOf("Pip got there first.") < 0) {
        raceFail("banner " + JSON.stringify(state().banner));
      }
      if (state().banner.toLowerCase().indexOf("lose") >= 0 || bannerEl.textContent.toLowerCase().indexOf("lose") >= 0) {
        raceFail("sad banner");
      }
      step(clock + 3000);
      if (state().race.child !== 1 || state().race.rivals[0].progress !== pip.progress || state().race.phase !== "done") {
        raceFail("lap continued");
      }

      go("race");
      document.getElementById("jump-go").click();
      const childAtTap = state().race.child;
      tap(centers().targets.faster.nx, centers().targets.faster.ny);
      if (!state().race.boost) raceFail("tap did not boost");
      step(clock + 200);
      const childMid = state().race.child;
      if (!state().race.boost) raceFail("boost ended before 400 ms");
      if (Math.abs((childMid - childAtTap) - 0.028) > 0.008) raceFail("tap slice " + (childMid - childAtTap));
      step(clock + 300);
      if (state().race.boost) raceFail("tap boost lasted past 400 ms");
      const tail = state().race.child - childMid;
      if (Math.abs(tail - 0.036) > 0.01) raceFail("tap tail " + tail);

      go("race");
      document.getElementById("jump-go").click();
      const held = centers().targets.faster;
      look(held.nx, held.ny);
      t = clock + 1;
      step(t);
      step(t + 660);
      if (!state().race.boost || state().race.phase !== "run") raceFail("latch " + JSON.stringify(state().race));
      guard = 0;
      while (state().race.phase === "run" && guard < 20) {
        step(clock + 2000);
        guard += 1;
      }
      const heldPip = state().race.rivals[0];
      if (state().race.place !== 1 || state().race.child !== 1 || !heldPip || heldPip.progress >= 0.999) {
        raceFail("held lap " + JSON.stringify(state().race));
      }
      if (state().banner.indexOf("First!") < 0 || state().banner.indexOf("You finished.") !== 0) {
        raceFail("held banner " + JSON.stringify(state().banner));
      }
      releaseLook();
