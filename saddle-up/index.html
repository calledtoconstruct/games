<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>Saddle Up!</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border: none; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #gaze[hidden], #eyes-chip[hidden], .panel[hidden], #back[hidden],
  #dock[hidden], #hoof-ui[hidden], #jump-ui[hidden], #race-ui[hidden], #cattle-ui[hidden],
  #day-ui[hidden], #barn-ui[hidden], #clock[hidden], #banner[hidden], #vet-ui[hidden] { display: none !important; }
  #eyes-chip {
    position: fixed; z-index: 46;
    top: calc(18px + env(safe-area-inset-top));
    left: 172px;
    background: var(--card); border-radius: 999px; padding: 7px 12px;
    font-weight: 800; font-size: 16px;
  }
  #banner {
    position: fixed; z-index: 40; pointer-events: none;
    left: 50%; top: calc(92px + env(safe-area-inset-top));
    transform: translateX(-50%);
    max-width: min(520px, calc(100% - 24px));
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 8px 18px; font-size: 22px; font-weight: 800;
    text-align: center; white-space: pre-line;
  }
  .panel {
    position: fixed; z-index: 50; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(460px, calc(100% - 24px));
    max-height: calc(100dvh - 24px); overflow: auto;
    background: var(--card); border-radius: 28px;
    padding: 22px 16px 16px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.28);
  }
  h1 { font-size: 48px; line-height: 0.95; margin: 4px 0 10px; text-align: center; letter-spacing: -1px; }
  .tag { text-align: center; margin: 0 0 12px; font-size: 18px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .choice, .breed, .big {
    border: none; border-radius: 18px; min-height: 76px;
    font-weight: 800; color: var(--ink);
  }
  .choice {
    background: #fffdf6; text-align: left; padding: 8px 14px;
    box-shadow: 0 4px 0 #e2d0b4; border: 3px solid transparent;
  }
  .choice b { display: block; font-size: 26px; }
  .choice small { display: block; font-size: 14px; color: #5c4e3a; }
  .choice[aria-pressed="true"] { border-color: var(--ink); background: #fff6df; }
  .breed {
    min-height: 84px; padding: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .chip {
    display: flex; flex-direction: column; align-items: center;
    background: #f4f0d8; color: #2c2416;
    border-radius: 14px; padding: 4px 14px 6px; line-height: 1.05;
  }
  .chip b { font-size: 28px; }
  .chip small { font-size: 14px; font-weight: 800; }
  .big {
    background: var(--sun); box-shadow: 0 5px 0 var(--sun-d);
    font-size: 32px; width: 100%;
  }
  .big:active, .choice:active, .breed:active { transform: translateY(2px); }
  #mute, #full, #back {
    position: fixed; z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1;
    top: calc(10px + env(safe-area-inset-top));
    height: 72px; font-size: 16px;
  }
  #mute, #full { width: 72px; }
  #mute { left: 10px; display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; }
  #mute svg[hidden] { display: none !important; }
  #full { left: 90px; }
  #back { right: 10px; width: auto; min-width: 72px; padding: 0 14px; }
  #dock, #hoof-ui { position: fixed; inset: 0; z-index: 44; pointer-events: none; }
  #dock button, #hoof-ui button { position: fixed; pointer-events: auto; }
  #dock button {
    width: 72px; height: 72px; padding: 4px;
    border: none; border-radius: 16px;
    background: var(--paper); color: var(--ink);
    font-weight: 800; font-size: 15px; line-height: 1.05;
    box-shadow: 0 4px 0 #c8b48a;
  }
  #hoof-ui .spot {
    width: 72px; height: 72px; padding: 0;
    border: none; border-radius: 50%;
    background: transparent;
  }
  #hoof-done {
    width: 180px; height: 72px;
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink);
    font-weight: 800; font-size: 28px;
    box-shadow: 0 5px 0 var(--sun-d);
  }
  #jump-ui { position: fixed; inset: 0; z-index: 44; pointer-events: none; }
  #jump-ui button {
    position: fixed; pointer-events: auto;
    border: none; border-radius: 16px;
    font-weight: 800; font-size: 16px; line-height: 1.05;
    box-shadow: 0 4px 0 #c8b48a;
    padding: 4px;
  }
  #jump-ui button[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--ink); }
  #race-ui { position: fixed; inset: 0; z-index: 44; pointer-events: none; }
  #race-ui button {
    position: fixed; pointer-events: auto;
    border: none; border-radius: 16px;
    background: var(--sun); color: var(--ink);
    font-weight: 800; font-size: 22px;
    box-shadow: 0 4px 0 var(--sun-d);
  }
  #cattle-ui { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
  #cattle-ui button {
    position: fixed; pointer-events: auto;
    border: none; padding: 0; border-radius: 18px;
    background: transparent;
  }
  #clock {
    position: fixed; z-index: 40; pointer-events: none;
    left: 50%; top: calc(12px + env(safe-area-inset-top));
    transform: translateX(-50%);
    min-width: 72px; text-align: center;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 6px 14px; font-size: 22px; font-weight: 800;
  }
  #clock.warm { background: #fff6df; }
  #day-ui, #barn-ui { position: fixed; inset: 0; z-index: 45; pointer-events: none; }
  #day-ui button, #barn-ui button {
    position: fixed; pointer-events: auto;
    border: none; border-radius: 16px;
    background: var(--paper); color: var(--ink);
    font-weight: 800; font-size: 18px;
    box-shadow: 0 4px 0 #c8b48a;
  }
  #day-again, #barn-back { background: var(--sun); box-shadow: 0 4px 0 var(--sun-d); }
  #vet-ui { position: fixed; inset: 0; z-index: 44; pointer-events: none; }
  #vet-ui button {
    position: fixed; pointer-events: auto;
    border: none; border-radius: 16px;
    background: var(--paper); color: var(--ink);
    font-weight: 800; font-size: 15px; line-height: 1.05;
    box-shadow: 0 4px 0 #c8b48a;
    padding: 4px;
  }
  #vet-ui #lesson-clean { background: #f0d2b0; color: var(--ink); }
  #vet-ui #lesson-dirty { background: #6b4a2a; color: var(--paper); }
  #vet-ui #lesson-yes { background: var(--sun); color: var(--ink); box-shadow: 0 4px 0 var(--sun-d); font-size: 22px; }
  #vet-ui #lesson-no { font-size: 22px; }
  #vet-ui #lesson-water { background: #3d8fd4; color: #fffdf6; }
  #vet-ui #lesson-empty { background: #c4a574; color: var(--ink); }
</style>
</head>
<body>
<canvas id="view"></canvas>
<button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/>
  </svg>
</button>
<button id="full" type="button" aria-label="Fullscreen">Full</button>
<button id="back" type="button" hidden>Back to Menu</button>
<p id="banner" role="status" hidden></p>
<div id="eyes-chip" hidden>Eyes</div>
<div id="gaze" hidden></div>

<section id="panel-level" class="panel">
  <h1>Saddle Up!</h1>
  <p class="tag">Horse farm</p>
  <div class="stack" id="levels">
    <button class="choice" type="button" data-level="tiny" aria-pressed="true"><b>Tiny Tots</b><small>Ages 2 to 3. Take care of your horse, then a short walk. No clock.</small></button>
    <button class="choice" type="button" data-level="little" aria-pressed="false"><b>Little Pals</b><small>Ages 4 to 5. Care, a ride, and a gentle race. No clock.</small></button>
    <button class="choice" type="button" data-level="shop" aria-pressed="false"><b>Shopkeeper</b><small>Ages 6 to 8. Jumps, a race, cattle, and a long barn day.</small></button>
    <button class="choice" type="button" data-level="rush" aria-pressed="false"><b>Rush</b><small>Ages 9 and up. Faster jumps from the saddle, cattle, and a shorter barn day.</small></button>
  </div>
  <div class="stack" style="margin-top:12px">
    <button id="lets-go" class="big" type="button">Let's go</button>
  </div>
</section>

<section id="panel-breed" class="panel" hidden>
  <h1>Pick a horse.</h1>
  <div class="stack" id="breeds"></div>
</section>

<section id="panel-yard" class="panel" hidden>
  <h1 id="who">Sunny</h1>
  <div class="stack" id="activities"></div>
</section>

<div id="dock" hidden>
  <button id="brush" type="button" data-play="true">Brush</button>
  <button id="water" type="button" data-play="true">Water</button>
  <button id="saddle" type="button" data-play="true">Saddle</button>
  <button id="dock-hooves" type="button" data-play="true">Hooves</button>
  <button id="apples" type="button" data-play="true">Apples</button>
  <button id="carrots" type="button" data-play="true">Carrots</button>
</div>

<div id="hoof-ui" hidden>
  <button id="spot-1" class="spot" type="button" data-play="true" aria-label="Dirt"></button>
  <button id="spot-2" class="spot" type="button" data-play="true" aria-label="Dirt"></button>
  <button id="spot-3" class="spot" type="button" data-play="true" aria-label="Dirt"></button>
  <button id="spot-4" class="spot" type="button" data-play="true" aria-label="Dirt"></button>
  <button id="hoof-done" type="button">Done</button>
</div>

<div id="jump-ui" hidden>
  <button id="speed-walk" type="button">Walk</button>
  <button id="speed-trot" type="button">Trot</button>
  <button id="speed-canter" type="button">Canter</button>
  <button id="jump-go" type="button">Go</button>
  <button id="jump-up" type="button" data-play="true">Up</button>
  <button id="jump-low" type="button" data-play="true">Low</button>
  <button id="jump-mid" type="button" data-play="true">Middle</button>
  <button id="jump-high" type="button" data-play="true">High</button>
</div>

<div id="race-ui" hidden>
  <button id="faster" type="button" data-play="true">Faster</button>
</div>

<div id="cattle-ui" hidden>
  <button id="field" type="button" data-play="true" aria-label="Grass"></button>
  <button id="cow-1" type="button" data-play="true" aria-label="Cow"></button>
  <button id="cow-2" type="button" data-play="true" aria-label="Cow"></button>
  <button id="cow-3" type="button" data-play="true" aria-label="Cow"></button>
  <button id="cow-4" type="button" data-play="true" aria-label="Cow"></button>
  <button id="cow-5" type="button" data-play="true" aria-label="Cow"></button>
  <button id="cow-6" type="button" data-play="true" aria-label="Cow"></button>
</div>

<div id="clock" hidden>0:00</div>
<div id="day-ui" hidden>
  <button id="barn-back" type="button">Back to the barn</button>
  <button id="day-again" type="button">Go again</button>
  <button id="day-yard" type="button">Back to the yard</button>
</div>
<div id="barn-ui" hidden>
  <button id="strap" type="button" data-play="true">Strap</button>
  <button id="shoe-1" type="button" data-play="true">Shoe</button>
  <button id="shoe-2" type="button" data-play="true">Shoe</button>
  <button id="shoe-3" type="button" data-play="true">Shoe</button>
  <button id="shoe-4" type="button" data-play="true">Shoe</button>
  <button id="barn-cattle" type="button">Back to the cattle</button>
</div>

<div id="vet-ui" hidden>
  <button id="hooves" type="button" data-play="true">Hooves</button>
  <button id="mouth" type="button" data-play="true">Mouth</button>
  <button id="teeth" type="button" data-play="true">Teeth</button>
  <button id="belly" type="button" data-play="true">Belly</button>
  <button id="eyes" type="button" data-play="true">Eyes</button>
  <button id="coat" type="button" data-play="true">Coat</button>
  <button id="lesson-clean" type="button" data-play="true" hidden>Clean hoof</button>
  <button id="lesson-dirty" type="button" data-play="true" hidden>Dirty hoof</button>
  <button id="lesson-yes" type="button" data-play="true" hidden>Yes</button>
  <button id="lesson-no" type="button" data-play="true" hidden>No</button>
  <button id="lesson-water" type="button" data-play="true" hidden>Water</button>
  <button id="lesson-empty" type="button" data-play="true" hidden>Empty</button>
</div>

<script>
(function () {
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;

  const INK = "#2c2416";
  const PAPER = "#f4f0d8";
  const GRASS = "#7dae4a";
  const WOOD = "#a56b3c";
  const WATER = "#3d8fd4";
  const SADDLE = "#8c3b2a";
  const DIRT = "#6b4a2a";
  const HOOF = "#f0d2b0";
  const APPLE = "#d6453d";
  const CARROT = "#e07a1f";
  const TROUGH_EMPTY = "#c4a574";
  const FONT = '"Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif';

  const TUNE = {
    minTargetPx: 72,
    hoofSpots: { tiny: 2, little: 3, shop: 4, rush: 4 },
    hoofReturnMs: 800,
    brushMs: 700,
    drinkMs: 600,
    jumpMs: 700,
    gapMs: 1500,
    windowsMs: { walk: 3000, trot: 2000, canter: 1600 },
    gateXFrac: { far: 0.92, near: 0.46 },
    gatePx: { far: 24, near: 180 },
    courses: {
      tiny: { view: "side", speeds: ["walk"], needs: [1] },
      little: { view: "side", speeds: ["walk"], needs: [1, 1, 2] },
      shop: { view: "side", speeds: ["walk", "trot"], needs: [1, 2, 1, 2, 3] },
      rush: { view: "first", speeds: ["walk", "trot", "canter"], needs: [1, 2, 2, 3, 2, 3] }
    },
    raceRates: { walk: 0.08, trot: 0.11, canter: 0.14, boost: 0.06, pip: 0.10, dot: 0.13, hank: 0.17 },
    tapBoostMs: 400,
    field: {
      scroll: false,
      horseXFrac: 0.18,
      pen: { x: 0.02, y: 0.08, w: 0.24, h: 0.84 },
      lanes: [0.38, 0.72],
      patrolX: [0.48, 0.78],
      waitXFrac: 1.15,
      onScreen: 2,
      enterMs: 400,
      walkToPenPxPerSec: 120
    },
    herds: {
      little: { cows: 2, pxPerSec: 18 },
      shop: { cows: 4, pxPerSec: 32 },
      rush: { cows: 6, pxPerSec: 48 }
    },
    cowBoxPx: 96,
    chores: {
      shop: { budgetMs: 240000, drinkMs: 20000, buckleMs: 50000, shoesMs: 80000 },
      rush: { budgetMs: 180000, drinkMs: 15000, buckleMs: 35000, shoesMs: 55000 }
    },
    shoeTaps: 4
  };

  const VET_CASES = {
    tiny: [],
    little: [{ id: "morning", lessonId: "hoof", checksNeeded: 2 }],
    shop: [{ id: "morning", lessonId: "teeth", checksNeeded: 3 }],
    rush: [
      { id: "morning", lessonId: "teeth", checksNeeded: 3 },
      { id: "dusty", lessonId: "water", checksNeeded: 3 }
    ]
  };

  const VET_PARTS = ["hooves", "mouth", "teeth", "belly", "eyes", "coat"];

  const BREEDS = [
    { id: "palomino", name: "Sunny", parent: "Gold", coat: "#e2b84a", mane: "#f3e2a0", ribbon: "#e23b3b" },
    { id: "pinto", name: "Patches", parent: "Spots", coat: "#8a4b2a", mane: "#2a2118", ribbon: "#ffc857" },
    { id: "gray", name: "Cloud", parent: "Gray", coat: "#d5d8de", mane: "#f7f7f5", ribbon: "#6eb5e8" },
    { id: "bay", name: "Buddy", parent: "Brown", coat: "#6b3a22", mane: "#1c140f", ribbon: "#2f8a3e" }
  ];

  const ACTIVITIES = [
    { id: "stable", label: "Stable", levels: ["tiny", "little", "shop", "rush"] },
    { id: "jumps", label: "Ride", levels: ["tiny", "little", "shop", "rush"] },
    { id: "race", label: "Race", levels: ["little", "shop", "rush"] },
    { id: "cattle", label: "Cattle", levels: ["little", "shop", "rush"] },
    { id: "chores", label: "Barn day", levels: ["shop", "rush"] },
    { id: "vet", label: "Call the vet", levels: ["tiny", "little", "shop", "rush"] }
  ];

  const RIVALS = {
    Pip: { id: "pip", coat: "#f7f1dc", mane: "#8a5a32", ribbon: "#3d8fd4" },
    Dot: { id: "dot", coat: "#d6453d", mane: "#2c2416", ribbon: "#ffc857" },
    Hank: { id: "hank", coat: "#2c2416", mane: "#1c140f", ribbon: "#e07030" }
  };

  const PLACES = ["level", "breed", "yard", "stable", "hoof", "jumps", "race", "cattle", "chores", "vet"];
  const LIVE = { level: true, breed: true, yard: true, stable: true, hoof: true, jumps: true, race: true, cattle: true, chores: true, vet: true };
  const LOW_COLOR = "#2f8a3e";
  const MID_COLOR = "#e2a62e";
  const HIGH_COLOR = "#e07030";

  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const backBtn = document.getElementById("back");
  const bannerEl = document.getElementById("banner");
  const eyesEl = document.getElementById("eyes-chip");
  const gazeEl = document.getElementById("gaze");
  const panelLevel = document.getElementById("panel-level");
  const panelBreed = document.getElementById("panel-breed");
  const panelYard = document.getElementById("panel-yard");
  const whoEl = document.getElementById("who");
  const dockEl = document.getElementById("dock");
  const hoofUi = document.getElementById("hoof-ui");
  const jumpUi = document.getElementById("jump-ui");
  const raceUi = document.getElementById("race-ui");
  const cattleUi = document.getElementById("cattle-ui");
  const vetUi = document.getElementById("vet-ui");
  const letsGoBtn = document.getElementById("lets-go");

  const session = {
    levelId: "tiny",
    place: "level",
    horse: null,
    cheered: false,
    jumps: null,
    race: null,
    cattle: null,
    chores: null,
    vet: null
  };

  let boostLatch = false;
  let boostOffSince = 0;
  let tapBoostUntil = 0;
  let fasterPointer = false;
  let fasterDownAt = 0;
  let gazeCommit = false;

  let pose = "stand";
  let brushUntil = 0;
  let drinkUntil = 0;
  let eatUntil = 0;
  let eating = null;
  let pourUntil = 0;
  let travel = null;
  const chase = { x: null, y: null, gait: "stand", face: 1, shown: 1, turnFrom: 0, turnTo: 1 };
  let raceWalk = null;
  let hoofReturnAt = 0;
  let phaseMs = 0;
  let clock = 0;
  let reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let mute = false;
  let ac = null;
  let master = null;
  let yardKey = "";
  let checking = false;
  let suppressReconnect = false;
  let pointerActive = false;
  let activePointer = null;

  let gazeSock = null;
  let gazeBuf = new Uint8Array(0);
  let gazeWarp = null;
  let gazeTimer = 0;
  let gazePoint = null;
  let gazeAt = 0;
  let gazeHold = null;
  let refreshHold = false;
  let haveSmooth = false;
  let smoothed = null;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;

  function breedMeta(id) {
    for (let i = 0; i < BREEDS.length; i++) if (BREEDS[i].id === id) return BREEDS[i];
    return null;
  }

  function ready(horse) {
    if (!horse) return false;
    const care = horse.care;
    return care.brushed && care.trough === "full" && care.saddle === "on" &&
      care.spots.every((s) => s.cleared) && (care.foods.apple || care.foods.carrot);
  }

  function bannerText() {
    const horse = session.horse;
    if (session.place === "breed" || (session.place !== "level" && !horse)) return "Pick a horse.";
    if (session.place === "level") return "Let's go.";
    if (!horse) return "Pick a horse.";
    if (session.place === "yard") return horse.name;
    if (session.place === "jumps" && session.jumps) {
      const phase = session.jumps.phase;
      if (phase === "ready") return "Ready.";
      if (phase === "choose") return "Jump.";
      if (phase === "jump" || phase === "gap") return horse.name + " went over.";
      if (phase === "miss") return "Try again.";
      if (phase === "done") return "All the jumps.";
    }
    if (session.place === "race" && session.race) {
      const race = session.race;
      if (race.phase === "ready") return "Ready.";
      if (race.phase === "run") return "Race.";
      const line = ["", "First!", "Second.", "Third.", "Fourth."][race.place] || "";
      let text = "You finished.\n" + line;
      if (race.place > 1) {
        const who = raceLeader();
        if (who) text += "\n" + who + " got there first.";
      }
      return text;
    }
    if (session.chores && (session.place === "chores" || (session.place === "stable" && session.chores.phase === "barn"))) {
      const day = session.chores;
      if (day.phase === "done") return "All in.";
      if (day.phase === "long") return "The day got long. The cattle can wait.";
      if (day.phase === "barn") return needBanner() || "The clock is waiting.";
      return herdBanner();
    }
    if (session.place === "cattle" && session.cattle) return herdBanner();
    if (session.place === "vet" && session.vet) return vetBanner();
    if (session.place === "hoof") {
      return horse.care.spots.every((s) => s.cleared) ? "Clean hooves." : "Hooves.";
    }
    if (session.place === "stable") {
      if (!horse.care.brushed) return "Brush.";
      if (horse.care.trough !== "full") return "Water.";
      if (horse.care.saddle !== "on") return "Saddle.";
      if (!horse.care.spots.every((s) => s.cleared)) return "Hooves.";
      if (!horse.care.foods.apple && !horse.care.foods.carrot) return "Apples or carrots.";
      return horse.name + " is ready.";
    }
    return horse.name;
  }

  function maybeCheer() {
    if (!session.horse || session.cheered) return;
    if (session.place === "stable" && !session.chores && ready(session.horse)) {
      session.cheered = true;
      playSound("cheer");
    }
  }

  function pickBreed(id) {
    const meta = breedMeta(id);
    if (!meta) return false;
    if (session.horse && session.horse.breedId === id) return false;
    const n = TUNE.hoofSpots[session.levelId] || 2;
    const spots = [];
    for (let i = 1; i <= n; i++) spots.push({ id: "spot-" + i, cleared: false });
    session.horse = {
      breedId: meta.id,
      name: meta.name,
      care: {
        brushed: false,
        trough: "empty",
        saddle: "off",
        spots: spots,
        foods: { apple: false, carrot: false }
      },
      needs: { drink: false, shoes: 0 }
    };
    session.cheered = false;
    pose = "stand";
    brushUntil = 0;
    drinkUntil = 0;
    eatUntil = 0;
    eating = null;
    pourUntil = 0;
    travel = null;
    hoofReturnAt = 0;
    return true;
  }

  function breed(id) {
    if (!pickBreed(id)) return;
    go("yard");
  }

  function level(id) {
    if (!TUNE.hoofSpots[id]) return;
    session.levelId = id;
    render();
  }

  function go(place, opts) {
    opts = opts || {};
    if (PLACES.indexOf(place) < 0) return;
    if (!LIVE[place]) return;
    if (session.chores) {
      if (place === "stable") {
        if (session.chores.phase !== "field") return;
        session.chores.phase = "barn";
        session.place = "stable";
        render();
        return;
      }
      if (place === "chores") {
        if (session.chores.phase !== "barn" && session.chores.phase !== "field") return;
        session.chores.phase = "field";
        session.place = "chores";
        render();
        return;
      }
      return;
    }
    if (!opts.arrive && !checking && !reduceMotion && session.place === "stable" && place === "yard" && session.horse) {
      if (!travel || travel.kind !== "out") {
        travel = { kind: "out", dest: "yard", start: clock, ms: 2600, turnMs: 900 };
        pose = "walk";
        render();
      }
      return;
    }
    if ((place === "yard" || place === "stable" || place === "hoof" || place === "jumps" || place === "race" || place === "cattle" || place === "chores" || place === "vet") && !session.horse) {
      if (place === "yard") place = "breed";
      else return;
    }
    if (place === "race" && !rivalNames().length) return;
    if (place === "cattle" && !herdNow()) return;
    if (place === "chores" && !TUNE.chores[session.levelId]) return;
    if (place !== "hoof") hoofReturnAt = 0;
    if (place !== "jumps") endJumps();
    if (place !== "race") endRace();
    if (place !== "cattle") endCattle();
    if (place !== "vet") endVet();
    const from = session.place;
    session.place = place;
    if (!opts.arrive && !checking && !reduceMotion && from === "yard" && place === "stable" && session.horse) {
      travel = { kind: "in", dest: "stable", start: clock, ms: 1700 };
      pose = "walk";
    } else {
      travel = null;
      if (pose === "walk") pose = "stand";
    }
    if (place === "jumps") beginJumps();
    if (place === "race") beginRace();
    if (place === "cattle") beginCattle();
    if (place === "chores") beginChores();
    if (place === "vet") beginVet();
    maybeCheer();
    render();
  }

  function rivalNames() {
    if (session.levelId === "little") return ["Pip"];
    if (session.levelId === "shop") return ["Pip", "Dot"];
    if (session.levelId === "rush") return ["Pip", "Dot", "Hank"];
    return [];
  }

  function beginRace() {
    const names = rivalNames();
    if (!names.length || !session.horse) return;
    const speed = defaultSpeed(courseNow());
    session.race = {
      speed: speed,
      phase: "ready",
      child: 0,
      rivals: names.map((name) => ({ name: name, progress: 0 })),
      place: null,
      boost: false
    };
    boostLatch = false;
    boostOffSince = 0;
    tapBoostUntil = 0;
    fasterPointer = false;
    pose = "stand";
    raceWalk = (!checking && !reduceMotion) ? { start: clock } : null;
  }

  function endRace() {
    session.race = null;
    raceWalk = null;
    boostLatch = false;
    boostOffSince = 0;
    tapBoostUntil = 0;
    fasterPointer = false;
  }

  function herdNow() {
    return TUNE.herds[session.levelId] || null;
  }

  function countWord(n) {
    return ["Zero", "One", "Two", "Three", "Four", "Five", "Six"][n] || String(n);
  }

  function beginCattle() {
    const herd = herdNow();
    if (!herd || !session.horse) return;
    const cows = [];
    for (let i = 0; i < herd.cows; i++) {
      const shown = i < TUNE.field.onScreen;
      const lane = shown ? i : -1;
      cows.push({
        id: "cow-" + (i + 1),
        state: "out",
        lane: lane,
        shown: shown,
        xFrac: shown ? TUNE.field.patrolX[0] : TUNE.field.waitXFrac,
        yFrac: shown ? TUNE.field.lanes[lane] : TUNE.field.lanes[0],
        dir: 1,
        entering: false,
        enterLeft: 0,
        loopMs: 0
      });
    }
    session.cattle = { phase: "run", pen: 0, cows: cows, notice: null };
    chase.x = null;
    chase.y = null;
    chase.gait = "stand";
    chase.face = 1;
    chase.shown = 1;
    chase.turnFrom = 0;
    chase.turnTo = 1;
  }

  function endCattle() {
    session.cattle = null;
    chase.x = null;
    chase.y = null;
    chase.gait = "stand";
    chase.face = 1;
    chase.shown = 1;
    chase.turnFrom = 0;
    chase.turnTo = 1;
  }

  function herdBlock() {
    const horse = session.horse;
    if (!horse) return "drink";
    if (horse.needs.drink) return "drink";
    if (horse.care.saddle === "buckle") return "buckle";
    if (horse.needs.shoes > 0) return "shoes";
    return null;
  }

  function needBanner() {
    const block = herdBlock();
    if (block === "drink") return "Time for a drink.";
    if (block === "buckle") return "The saddle needs a buckle.";
    if (block === "shoes") return "The shoes need a tap.";
    return null;
  }

  function herdBanner() {
    const cattle = session.cattle;
    if (!cattle) return "Cattle.";
    if (cattle.phase === "done") return "All in.";
    const need = needBanner();
    if (need) return need;
    if (cattle.notice === "grass") return "Try again.";
    if (cattle.pen > 0) {
      const left = cattle.cows.length - cattle.pen;
      return "In the pen.\n" + countWord(left) + " to go.";
    }
    return "Cattle.";
  }

  function onHerdField() {
    if (session.place === "cattle" && !session.chores) return true;
    return !!(session.place === "chores" && session.chores && session.chores.phase === "field");
  }

  function loopCow(id) {
    if (!onHerdField()) {
      if (session.chores) return;
      if (session.place !== "cattle") go("cattle");
    }
    const cattle = session.cattle;
    if (!cattle || cattle.phase === "done") return;
    const block = herdBlock();
    if (block) {
      cattle.notice = block;
      playSound("miss");
      render();
      return;
    }
    if (id == null) {
      cattle.notice = "grass";
      playSound("miss");
      render();
      return;
    }
    const cow = cattle.cows.find((c) => c.id === id);
    if (!cow || cow.state !== "out" || !cow.shown) {
      render();
      return;
    }
    cow.state = "loop";
    cow.loopMs = 0;
    cattle.notice = null;
    playSound("loop");
    render();
  }

  function penRect(w, h) {
    const pen = TUNE.field.pen;
    return { x: pen.x * w, y: pen.y * h, w: pen.w * w, h: pen.h * h };
  }

  function insidePen(x, y, pen) {
    return x >= pen.x && x <= pen.x + pen.w && y >= pen.y && y <= pen.y + pen.h;
  }

  function promoteWaiter(lane) {
    const cattle = session.cattle;
    if (!cattle || lane < 0) return;
    const waiter = cattle.cows.find((c) => !c.shown && c.state === "out");
    if (!waiter) return;
    waiter.shown = true;
    waiter.lane = lane;
    waiter.entering = true;
    waiter.enterLeft = TUNE.field.enterMs;
    waiter.xFrac = TUNE.field.waitXFrac;
    waiter.yFrac = TUNE.field.lanes[lane];
    waiter.dir = 1;
    waiter.state = "out";
  }

  function arriveCow(cow) {
    const cattle = session.cattle;
    if (!cattle || cow.state === "in") return;
    const lane = cow.lane;
    cow.state = "in";
    cow.entering = false;
    cow.shown = true;
    cattle.pen += 1;
    const pen = TUNE.field.pen;
    cow.xFrac = pen.x + pen.w * 0.5;
    cow.yFrac = pen.y + pen.h * (cattle.pen / (cattle.cows.length + 1));
    cattle.notice = null;
    if (cattle.pen >= cattle.cows.length) {
      cattle.phase = "done";
      playSound("cheer");
      if (session.chores && session.chores.phase === "field" && session.chores.msLeft > 0) {
        session.chores.phase = "done";
      }
    } else {
      promoteWaiter(lane);
    }
  }

  function beginChores() {
    const tune = TUNE.chores[session.levelId];
    if (!tune || !session.horse || !herdNow()) return;
    const saddle = session.horse.care.saddle === "buckle" ? "on" : session.horse.care.saddle;
    session.chores = {
      phase: "field",
      msLeft: tune.budgetMs,
      rideMs: 0,
      events: { drink: false, buckle: false, shoes: false },
      morning: { trough: session.horse.care.trough, saddle: saddle }
    };
    beginCattle();
  }

  function again() {
    if (!session.chores || !session.horse) return;
    const tune = TUNE.chores[session.levelId];
    if (!tune) return;
    const morning = session.chores.morning;
    session.horse.care.trough = morning.trough;
    session.horse.care.saddle = morning.saddle === "buckle" ? "on" : morning.saddle;
    session.horse.needs.drink = false;
    session.horse.needs.shoes = 0;
    session.chores.msLeft = tune.budgetMs;
    session.chores.rideMs = 0;
    session.chores.events = { drink: false, buckle: false, shoes: false };
    session.chores.phase = "field";
    session.place = "chores";
    beginCattle();
    render();
  }

  function leaveChores() {
    if (!session.chores || !session.horse) return;
    if (session.chores.phase !== "done" && session.chores.phase !== "long") return;
    const morning = session.chores.morning;
    session.horse.care.trough = morning.trough;
    session.horse.care.saddle = morning.saddle === "buckle" ? "on" : morning.saddle;
    session.horse.needs.drink = false;
    session.horse.needs.shoes = 0;
    session.chores = null;
    endCattle();
    go("yard");
  }

  function advanceChores(dtMs) {
    const day = session.chores;
    if (!day || session.place !== "chores" || day.phase !== "field") return;
    const tune = TUNE.chores[session.levelId];
    if (!tune) return;
    day.rideMs += dtMs;
    day.msLeft = Math.max(0, day.msLeft - dtMs);
    const full = session.cattle && session.cattle.pen >= session.cattle.cows.length;
    if (!full) {
      if (!day.events.drink && day.rideMs >= tune.drinkMs) {
        day.events.drink = true;
        emptyTrough();
      }
      if (!day.events.buckle && day.rideMs >= tune.buckleMs) {
        day.events.buckle = true;
        openBuckle();
      }
      if (!day.events.shoes && day.rideMs >= tune.shoesMs) {
        day.events.shoes = true;
        askShoes();
      }
    }
    if (day.phase !== "field") return;
    const fullNow = session.cattle && session.cattle.pen >= session.cattle.cows.length;
    if (fullNow && day.msLeft > 0) day.phase = "done";
    else if (day.msLeft <= 0) day.phase = "long";
  }

  function patrolCow(cow, dt, w) {
    const herd = herdNow();
    if (!herd) return;
    const lo = TUNE.field.patrolX[0] * w;
    const hi = TUNE.field.patrolX[1] * w;
    let x = cow.xFrac * w + cow.dir * herd.pxPerSec * dt;
    let guard = 0;
    while (guard < 8 && (x < lo || x > hi)) {
      if (x > hi) {
        x = hi - (x - hi);
        cow.dir = -1;
      } else {
        x = lo + (lo - x);
        cow.dir = 1;
      }
      guard += 1;
    }
    cow.xFrac = Math.max(lo, Math.min(hi, x)) / w;
    if (cow.lane >= 0) cow.yFrac = TUNE.field.lanes[cow.lane];
  }

  function walkToPen(cow, dt, w, h) {
    const pen = penRect(w, h);
    const tx = pen.x + pen.w / 2;
    const ty = pen.y + pen.h / 2;
    let x = cow.xFrac * w;
    let y = cow.yFrac * h;
    const dx = tx - x;
    const dy = ty - y;
    const dist = Math.hypot(dx, dy);
    const stepPx = TUNE.field.walkToPenPxPerSec * dt;
    if (dist <= stepPx) {
      x = tx;
      y = ty;
    } else if (dist > 0) {
      x += (dx / dist) * stepPx;
      y += (dy / dist) * stepPx;
    }
    if (insidePen(x, y, pen)) {
      arriveCow(cow);
      return;
    }
    cow.xFrac = x / w;
    cow.yFrac = y / h;
  }

  function advanceOneCow(cow, dtMs, w, h, frozen) {
    if (cow.state === "in" || !cow.shown) return;
    if (cow.state === "loop") {
      cow.loopMs += dtMs;
      walkToPen(cow, dtMs / 1000, w, h);
      return;
    }
    if (frozen) return;
    if (cow.entering) {
      const use = Math.min(dtMs, cow.enterLeft);
      cow.enterLeft -= use;
      const span = TUNE.field.enterMs;
      const done = span <= 0 ? 1 : 1 - cow.enterLeft / span;
      const wait = TUNE.field.waitXFrac;
      const start = TUNE.field.patrolX[0];
      cow.xFrac = wait + (start - wait) * done;
      if (cow.lane >= 0) cow.yFrac = TUNE.field.lanes[cow.lane];
      if (cow.enterLeft <= 0) {
        cow.entering = false;
        cow.xFrac = start;
        cow.dir = 1;
        const rest = (dtMs - use) / 1000;
        if (rest > 0) patrolCow(cow, rest, w);
      }
      return;
    }
    patrolCow(cow, dtMs / 1000, w);
  }

  function gazedCowId() {
    const target = gazeTarget();
    if (!target || !target.key || !target.key.id) return null;
    return target.key.id.indexOf("cow-") === 0 ? target.key.id : null;
  }

  function advanceCattle(dtMs) {
    const cattle = session.cattle;
    const playing = session.place === "cattle" || (session.place === "chores" && session.chores && session.chores.phase === "field");
    if (!cattle || !playing || cattle.phase !== "run") return;
    const w = window.innerWidth;
    const h = window.innerHeight;
    if (w < 2 || h < 2) return;
    const freezeId = gazedCowId();
    cattle.cows.forEach((cow) => advanceOneCow(cow, dtMs, w, h, cow.id === freezeId));
  }

  function raceLeader() {
    const race = session.race;
    if (!race) return null;
    const rates = { Hank: TUNE.raceRates.hank, Dot: TUNE.raceRates.dot, Pip: TUNE.raceRates.pip };
    let best = null;
    race.rivals.forEach((v) => {
      if (v.progress < 0.999) return;
      if (!best || rates[v.name] > rates[best]) best = v.name;
    });
    return best;
  }

  function gazeOnFaster() {
    const target = gazeTarget();
    return !!(target && target.key && target.key.id === "faster");
  }

  function boostedAt(t) {
    if (fasterPointer) return true;
    if (boostLatch) {
      if (!boostOffSince || t < boostOffSince + LEAVE_MS) return true;
      return false;
    }
    return !!(tapBoostUntil && t < tapBoostUntil);
  }

  function applyRaceDt(race, dt, boosted) {
    if (race.phase !== "run" || dt <= 0) return;
    const beforeChild = race.child;
    const beforeRivals = race.rivals.map((v) => v.progress);
    const rate = TUNE.raceRates[race.speed] + (boosted ? TUNE.raceRates.boost : 0);
    let used = dt;
    if (rate > 0 && race.child < 1) {
      const need = (1 - race.child) / rate;
      if (need < used) used = need;
    }
    race.child = Math.min(1, race.child + used * rate);
    race.rivals.forEach((v) => {
      v.progress = Math.min(1, v.progress + used * TUNE.raceRates[v.name.toLowerCase()]);
    });
    if (beforeChild < 1 && race.child >= 0.999999) {
      race.child = 1;
      let ahead = 0;
      beforeRivals.forEach((p) => { if (p >= 0.999) ahead += 1; });
      race.place = ahead + 1;
      race.phase = "done";
      race.boost = false;
      boostLatch = false;
      boostOffSince = 0;
      tapBoostUntil = 0;
      playSound("race");
    }
  }

  function advanceRace(prev, now) {
    const race = session.race;
    if (!race || session.place !== "race" || race.phase !== "run") {
      if (race && session.place === "race") race.boost = false;
      return;
    }
    let cursor = prev;
    while (cursor < now - 0.001 && race.phase === "run") {
      let next = now;
      if (boostLatch && !fasterPointer && !gazeOnFaster()) {
        if (!boostOffSince) boostOffSince = cursor;
        const releaseAt = boostOffSince + LEAVE_MS;
        if (releaseAt > cursor && releaseAt < next) next = releaseAt;
      } else if (boostLatch) {
        boostOffSince = 0;
      }
      if (!boostLatch && !fasterPointer && tapBoostUntil > cursor && tapBoostUntil < next) next = tapBoostUntil;
      applyRaceDt(race, (next - cursor) / 1000, boostedAt(cursor));
      if (boostLatch && !fasterPointer && !gazeOnFaster() && boostOffSince && next >= boostOffSince + LEAVE_MS) {
        boostLatch = false;
        boostOffSince = 0;
      }
      if (next <= cursor) break;
      cursor = next;
    }
    if (race.phase === "run") race.boost = boostedAt(now);
  }

  function startRace() {
    const race = session.race;
    if (!race || race.phase !== "ready") return;
    race.phase = "run";
    race.child = 0;
    race.place = null;
    race.boost = false;
    race.rivals.forEach((v) => { v.progress = 0; });
    raceWalk = null;
    playSound("race");
    render();
  }

  function pressFaster() {
    if (gazeCommit) {
      boostLatch = true;
      boostOffSince = 0;
      if (session.race && session.race.phase === "run") session.race.boost = true;
      render();
      return;
    }
    if (fasterDownAt && clock - fasterDownAt > 250) return;
    tapBoostUntil = Math.max(tapBoostUntil, clock + TUNE.tapBoostMs);
    if (session.race && session.race.phase === "run") session.race.boost = true;
    render();
  }

  function courseNow() {
    return TUNE.courses[session.levelId] || TUNE.courses.tiny;
  }

  function defaultSpeed(course) {
    if (session.levelId === "rush" && course.speeds.indexOf("trot") >= 0) return "trot";
    return course.speeds[0];
  }

  function beginJumps() {
    const course = courseNow();
    if (!course || !session.horse) return;
    const speed = defaultSpeed(course);
    session.jumps = {
      view: course.view,
      speed: speed,
      index: 0,
      need: course.needs[0],
      phase: "ready",
      approach: 0,
      pick: null,
      cleared: 0,
      windowMs: TUNE.windowsMs[speed]
    };
    phaseMs = 0;
    pose = "stand";
    brushUntil = 0;
    drinkUntil = 0;
    eatUntil = 0;
    eating = null;
    pourUntil = 0;
    travel = null;
  }

  function endJumps() {
    session.jumps = null;
    phaseMs = 0;
    if (pose === "jump" || pose === "run") pose = "stand";
  }

  function setSpeed(speed) {
    const course = courseNow();
    if (course.speeds.indexOf(speed) < 0) return;
    const j = session.place === "race" ? session.race : session.jumps;
    if (!j || (j.phase !== "ready" && j.phase !== "miss")) return;
    j.speed = speed;
    if (j.windowMs !== undefined) j.windowMs = TUNE.windowsMs[speed];
    render();
  }

  function startChoose() {
    const j = session.jumps;
    if (!j || (j.phase !== "ready" && j.phase !== "miss")) return;
    const course = courseNow();
    j.phase = "choose";
    j.approach = 0;
    j.pick = null;
    j.need = course.needs[j.index];
    j.windowMs = TUNE.windowsMs[j.speed];
    phaseMs = 0;
    render();
  }

  function pickHeight(step) {
    const j = session.jumps;
    if (!j || j.phase !== "choose") return;
    const height = Number(step);
    if (!(height >= 1)) return;
    j.pick = height;
    j.approach = 0;
    phaseMs = 0;
    if (height >= j.need) {
      j.phase = "jump";
      j.cleared += 1;
      playSound("jump");
    } else {
      j.phase = "miss";
      pose = "stand";
      playSound("miss");
    }
    render();
  }

  function missJump() {
    const j = session.jumps;
    if (!j || j.phase !== "choose") return;
    j.phase = "miss";
    j.approach = 0;
    j.pick = null;
    phaseMs = 0;
    pose = "stand";
    playSound("miss");
  }

  function finishJump() {
    const j = session.jumps;
    const course = courseNow();
    phaseMs = 0;
    j.approach = 0;
    if (j.index + 1 >= course.needs.length) {
      j.phase = "done";
      pose = "stand";
      return;
    }
    j.phase = "gap";
  }

  function finishGap() {
    const j = session.jumps;
    const course = courseNow();
    j.index += 1;
    j.need = course.needs[j.index];
    j.phase = "choose";
    j.approach = 0;
    j.pick = null;
    j.windowMs = TUNE.windowsMs[j.speed];
    phaseMs = 0;
  }

  function advanceJumps(dtMs) {
    const j = session.jumps;
    if (!j || session.place !== "jumps") return;
    if (j.phase === "choose") {
      phaseMs += dtMs;
      j.approach = Math.min(1, phaseMs / j.windowMs);
      if (phaseMs >= j.windowMs) missJump();
    } else if (j.phase === "jump") {
      phaseMs += dtMs;
      if (phaseMs >= TUNE.jumpMs) finishJump();
    } else if (j.phase === "gap") {
      phaseMs += dtMs;
      if (phaseMs >= TUNE.gapMs) finishGap();
    }
  }

  function stopTravel() {
    if (!travel) return;
    travel = null;
    if (pose === "walk") pose = "stand";
  }

  function brushHorse() {
    const horse = session.horse;
    if (!horse || horse.care.brushed) return;
    stopTravel();
    horse.care.brushed = true;
    pose = reduceMotion ? "stand" : "brush";
    brushUntil = reduceMotion ? 0 : clock + 1700;
    playSound("brush");
    maybeCheer();
    render();
  }

  function fillTrough() {
    const horse = session.horse;
    if (!horse) return;
    if (horse.care.trough === "full" && !horse.needs.drink) return;
    stopTravel();
    horse.care.trough = "full";
    horse.needs.drink = false;
    pose = "drink";
    pourUntil = reduceMotion ? 0 : clock + 2200;
    drinkUntil = reduceMotion ? clock : pourUntil + TUNE.drinkMs;
    playSound("water");
    maybeCheer();
    render();
  }

  function emptyTrough() {
    const horse = session.horse;
    if (!horse) return;
    if (horse.care.trough === "empty" && horse.needs.drink) return;
    horse.care.trough = "empty";
    horse.needs.drink = true;
    pourUntil = 0;
    render();
  }

  function putSaddle() {
    const horse = session.horse;
    if (!horse || horse.care.saddle !== "off") return;
    stopTravel();
    horse.care.saddle = "on";
    playSound("saddle");
    maybeCheer();
    render();
  }

  function openBuckle() {
    const horse = session.horse;
    if (!horse || horse.care.saddle === "buckle") return;
    horse.care.saddle = "buckle";
    playSound("buckle");
    render();
  }

  function fixBuckle() {
    const horse = session.horse;
    if (!horse || horse.care.saddle !== "buckle") return;
    horse.care.saddle = "on";
    playSound("buckle");
    maybeCheer();
    render();
  }

  function clearSpot(id) {
    const horse = session.horse;
    if (!horse) return;
    const spot = horse.care.spots.find((s) => s.id === id);
    if (!spot || spot.cleared) return;
    spot.cleared = true;
    playSound("hoof");
    if (horse.care.spots.every((s) => s.cleared) && session.place === "hoof") {
      const wait = reduceMotion ? 0 : TUNE.hoofReturnMs;
      if (wait === 0) {
        hoofReturnAt = 0;
        go("stable");
        return;
      }
      hoofReturnAt = clock + wait;
    }
    maybeCheer();
    render();
  }

  function feed(kind) {
    const horse = session.horse;
    if (!horse) return;
    if (kind !== "apple" && kind !== "carrot") return;
    if (horse.care.foods[kind]) return;
    stopTravel();
    horse.care.foods[kind] = true;
    if (!reduceMotion) {
      pose = "eat";
      eatUntil = clock + 2400;
      eating = kind;
    }
    playSound("munch");
    maybeCheer();
    render();
  }

  function askShoes() {
    const horse = session.horse;
    if (!horse || horse.needs.shoes === 4) return;
    horse.needs.shoes = 4;
    render();
  }

  function tapShoe() {
    const horse = session.horse;
    if (!horse || horse.needs.shoes <= 0) return;
    horse.needs.shoes -= 1;
    playSound("hoof");
    render();
  }

  function beginVet() {
    const rows = VET_CASES[session.levelId] || [];
    const row = rows[0] || null;
    session.vet = {
      caseIndex: 0,
      caseId: row ? row.id : null,
      checked: [],
      lessonId: row ? row.lessonId : null,
      lesson: "none",
      line: "The vet.",
      part: null,
      leanUntil: 0
    };
  }

  function endVet() {
    session.vet = null;
  }

  function vetBanner() {
    const vet = session.vet;
    if (!vet) return "The vet.";
    const rows = VET_CASES[session.levelId] || [];
    if (vet.lesson === "right") return "The vet says all set.";
    if (!rows.length && vet.checked.length >= 1) return "The vet says all set.";
    if (vet.lesson === "pending" && vet.line === "Look again.") return "Look again.";
    if (vet.lesson === "pending") {
      if (vet.lessonId === "hoof") return "Which hoof is clean?";
      if (vet.lessonId === "teeth") return "Does a horse need smooth teeth to chew?";
      if (vet.lessonId === "water") return "Which bucket is water?";
    }
    return vet.line || "The vet.";
  }

  function vetSentence(part, horse) {
    if (part === "hooves") {
      const dirty = horse.care.spots.some((spot) => !spot.cleared);
      return "The vet looks.\n" + (dirty ? "Let's pick the dirt." : "Clean hooves.");
    }
    if (part === "mouth") return "The vet looks in the mouth.";
    if (part === "teeth") return "The vet smooths a tooth.";
    if (part === "belly") {
      return "The vet listens.\n" + (horse.needs.drink ? "Time for a drink." : "The belly sounds fine.");
    }
    if (part === "eyes") return "Bright eyes.";
    if (part === "coat") return horse.care.brushed ? "The coat is shiny." : "A brush would help.";
    return "The vet.";
  }

  function vetCheck(part) {
    const vet = session.vet;
    const horse = session.horse;
    if (!vet || !horse || session.place !== "vet") return;
    if (VET_PARTS.indexOf(part) < 0) return;
    const line = vetSentence(part, horse);
    const fresh = vet.checked.indexOf(part) < 0;
    if (fresh) {
      vet.checked.push(part);
      playSound("vet");
      if (part === "hooves") {
        horse.care.spots.forEach((spot) => {
          if (!spot.cleared) clearSpot(spot.id);
        });
      } else if (part === "belly" && horse.needs.drink) {
        fillTrough();
      }
      const rows = VET_CASES[session.levelId] || [];
      const row = rows[vet.caseIndex];
      if (row && vet.lesson === "none" && vet.checked.length >= row.checksNeeded) vet.lesson = "pending";
    }
    vet.part = part;
    vet.line = line;
    vet.leanUntil = reduceMotion ? 0 : clock + 700;
    render();
  }

  function lessonRight(lessonId, choice) {
    if (lessonId === "hoof") return choice === "clean";
    if (lessonId === "teeth") return choice === "yes";
    if (lessonId === "water") return choice === "water";
    return false;
  }

  function answerLesson(choice) {
    const vet = session.vet;
    if (!vet || session.place !== "vet") return;
    if (vet.lesson === "right") return;
    if (vet.lesson !== "pending") return;
    if (!lessonRight(vet.lessonId, choice)) {
      vet.line = "Look again.";
      render();
      return;
    }
    vet.lesson = "right";
    vet.line = "The vet says all set.";
    const rows = VET_CASES[session.levelId] || [];
    const next = rows[vet.caseIndex + 1];
    if (next) {
      vet.caseIndex += 1;
      vet.caseId = next.id;
      vet.checked = [];
      vet.lessonId = next.lessonId;
      vet.lesson = "none";
      vet.line = "The vet.";
      vet.part = null;
      vet.leanUntil = 0;
    }
    render();
  }

  function letsGo() {
    go(session.horse ? "yard" : "breed");
  }

  function onBack() {
    if (session.place === "breed" || session.place === "yard") go("level");
    else if (session.place === "stable" || session.place === "jumps" || session.place === "race" || session.place === "cattle" || session.place === "vet") go("yard");
    else if (session.place === "hoof") go("stable");
  }

  function playSound(name) {
    if (!ac || mute) return;
    const t = ac.currentTime + 0.01;
    if (name === "brush") osc(t, 0.12, "triangle", 320, 480, 0.06);
    else if (name === "water") osc(t, 0.2, "sine", 220, 160, 0.06);
    else if (name === "saddle") osc(t, 0.1, "triangle", 180, 120, 0.06);
    else if (name === "hoof") osc(t, 0.08, "triangle", 160, 110, 0.05);
    else if (name === "munch") osc(t, 0.1, "sine", 260, 180, 0.05);
    else if (name === "cheer") {
      osc(t, 0.12, "triangle", 523, 659, 0.06);
      osc(t + 0.12, 0.16, "sine", 659, 784, 0.05);
    } else if (name === "jump") osc(t, 0.16, "triangle", 300, 520, 0.06);
    else if (name === "miss") osc(t, 0.16, "sine", 200, 140, 0.05);
    else if (name === "race") osc(t, 0.1, "triangle", 440, 660, 0.05);
    else if (name === "loop") osc(t, 0.14, "sine", 360, 280, 0.05);
    else if (name === "buckle") osc(t, 0.08, "triangle", 240, 180, 0.05);
    else if (name === "vet") osc(t, 0.12, "sine", 480, 520, 0.04);
  }

  function ensureAudio() {
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = mute ? 0 : 0.5;
        master.connect(ac.destination);
      }
      if (ac.state === "suspended") ac.resume();
    } catch (e) { /* a headless check has no audio device */ }
  }

  function envGain(t, dur, peak) {
    const g = ac.createGain();
    g.connect(master);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.03, dur));
    return g;
  }

  function osc(t, dur, type, f0, f1, peak) {
    const o = ac.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(40, f0), t);
    if (f1 && Math.abs(f1 - f0) > 1) o.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    o.connect(envGain(t, dur, peak));
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function dockLayout(w, h) {
    const gap = 8;
    const size = 72;
    const narrow = w < 480;
    const cols = narrow ? 3 : 6;
    const rows = narrow ? 2 : 1;
    const rowW = cols * size + (cols - 1) * gap;
    const left = Math.round((w - rowW) / 2);
    const totalH = rows * size + (rows - 1) * gap;
    const top = h - totalH - 16;
    const ids = ["brush", "water", "saddle", "dock-hooves", "apples", "carrots"];
    return ids.map((id, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = left + col * (size + gap);
      const y = top + row * (size + gap);
      return { id: id, x: x, y: y, w: size, h: size };
    });
  }

  function hoofLayout(w, h, n) {
    const cx = w / 2;
    const cy = Math.min(Math.max(h * 0.42, 330), h - 280);
    const offsets = {
      "spot-1": [-100, -80],
      "spot-2": [100, -80],
      "spot-3": [-100, 70],
      "spot-4": [100, 70]
    };
    const ids = ["spot-1", "spot-2", "spot-3", "spot-4"].slice(0, n);
    const spots = ids.map((id) => {
      const off = offsets[id];
      const sx = cx + off[0];
      const sy = cy + off[1];
      return { id: id, x: sx - 36, y: sy - 36, w: 72, h: 72, cx: sx, cy: sy };
    });
    const done = { id: "hoof-done", x: w / 2 - 90, y: h - 96, w: 180, h: 72 };
    return { cx: cx, cy: cy, spots: spots, done: done };
  }

  function spotCount() {
    if (session.horse) return session.horse.care.spots.length;
    return TUNE.hoofSpots[session.levelId] || 2;
  }

  function horseBox(w, h) {
    const dockTop = dockLayout(w, h)[0].y;
    const y = 118;
    const bottom = Math.max(y + 220, dockTop - 24);
    return { x: 12, y: y, w: Math.max(200, w - 24), h: bottom - y };
  }

  function horseParts(box, poseName) {
    const shown = poseName === "drink" || poseName === "brush" || poseName === "eat" ? poseName : "stand";
    const rx = Math.round(Math.min(140, box.w * 0.22, box.h * 0.28));
    const ry = Math.round(rx * 0.62);
    const groupW = rx * 2 + 18 + 96;
    let cx = Math.round(box.x + Math.max(0, (box.w - groupW) / 2) + rx);
    let cy = Math.round(box.y + box.h * 0.48);
    if (box.anchorX != null) cx = Math.round(box.anchorX);
    if (box.anchorY != null) cy = Math.round(box.anchorY);
    if (poseName === "jump") cy -= Math.round(ry * 0.9);
    const body = { cx: cx, cy: cy, rx: rx, ry: ry };
    const trough = {
      x: Math.round(body.cx + body.rx + 18),
      y: Math.round(body.cy + body.ry * 0.35),
      w: 96,
      h: 52
    };
    if (trough.x + trough.w > box.x + box.w - 4) trough.x = Math.round(box.x + box.w - 4 - trough.w);
    trough.cx = trough.x + trough.w / 2;
    trough.cy = trough.y + trough.h / 2;
    const saddle = {
      x: Math.round(body.cx - body.rx * 0.15 - 36),
      y: Math.round(body.cy - body.ry * 0.55),
      w: 72,
      h: 34
    };
    saddle.cx = saddle.x + saddle.w / 2;
    saddle.cy = saddle.y + saddle.h / 2;
    const mark = {
      x: Math.round(body.cx + body.rx * 0.18),
      y: Math.round(body.cy + body.ry * 0.30)
    };
    const marks = [
      { x: mark.x - 28, y: mark.y },
      { x: mark.x, y: mark.y },
      { x: mark.x + 28, y: mark.y }
    ];
    const patch = {
      x: Math.round(body.cx - body.rx * 0.42),
      y: Math.round(body.cy + body.ry * 0.05),
      rx: 22,
      ry: 14
    };
    const hr = Math.round(Math.min(38, Math.max(22, ry * 0.55)));
    const standHead = {
      x: Math.round(body.cx + body.rx * 0.72),
      y: Math.round(body.cy - ry * 1.05),
      r: hr
    };
    const drinkHead = {
      x: Math.round(trough.x + 28),
      y: Math.round(trough.y - hr - 8),
      r: hr
    };
    const brushHead = { x: standHead.x - 6, y: standHead.y + 10, r: hr };
    let head = standHead;
    if (shown === "drink") {
      if (reduceMotion || !drinkUntil || clock >= drinkUntil) head = drinkHead;
      else {
        const u = Math.max(0, Math.min(1, 1 - (drinkUntil - clock) / TUNE.drinkMs));
        head = {
          x: Math.round(standHead.x + (drinkHead.x - standHead.x) * u),
          y: Math.round(standHead.y + (drinkHead.y - standHead.y) * u),
          r: hr
        };
      }
    } else if (shown === "brush") head = brushHead;
    else if (shown === "eat") {
      const eatHead = { x: standHead.x + 10, y: standHead.y + Math.round(hr * 0.55), r: hr };
      const span = 2400;
      if (reduceMotion || !eatUntil || clock <= eatUntil - span || clock >= eatUntil) head = standHead;
      else {
        const u = Math.max(0, Math.min(1, 1 - (eatUntil - clock) / span));
        const dip = Math.sin(u * Math.PI);
        head = {
          x: Math.round(standHead.x + (eatHead.x - standHead.x) * dip),
          y: Math.round(standHead.y + (eatHead.y - standHead.y) * dip),
          r: hr
        };
      }
    }
    const mouth = {
      x: Math.round(head.x + head.r * 0.2),
      y: Math.round(head.y + head.r * 0.35)
    };
    return { body: body, trough: trough, saddle: saddle, marks: marks, patch: patch, head: head, mouth: mouth };
  }

  function strokeInk() {
    ctx.strokeStyle = INK;
    ctx.lineWidth = 4;
  }

  function roundFill(x, y, w, h, fill, radius) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, radius);
    ctx.fillStyle = fill;
    ctx.fill();
    strokeInk();
    ctx.stroke();
  }

  function shade(hex, amt) {
    const c = hexRgb(hex);
    const clamp = (v) => Math.max(0, Math.min(255, Math.round(v + amt)));
    return "rgb(" + clamp(c.r) + "," + clamp(c.g) + "," + clamp(c.b) + ")";
  }

  function gaitName(poseName) {
    if (poseName === "run") return "gallop";
    if (poseName === "walk" || poseName === "trot" || poseName === "canter" || poseName === "gallop" || poseName === "jump") return poseName;
    return "stand";
  }

  function gaitSpec(name) {
    if (name === "walk") return { stance: 0.62, reach: 0.72, lift: 0.38, offsets: { nearHind: 0, farHind: 0.5, nearFore: 0.25, farFore: 0.75 } };
    if (name === "trot") return { stance: 0.42, reach: 0.88, lift: 0.62, offsets: { nearHind: 0, farHind: 0.5, nearFore: 0.5, farFore: 0 } };
    if (name === "canter") return { stance: 0.34, reach: 0.95, lift: 0.72, suspend: 0.82, offsets: { nearHind: 0.33, farHind: 0, nearFore: 0.62, farFore: 0.33 } };
    if (name === "gallop") return { stance: 0.22, reach: 1.05, lift: 0.85, suspend: 0.74, offsets: { nearHind: 0, farHind: 0.16, nearFore: 0.34, farFore: 0.52 } };
    return null;
  }

  function appearanceSalt(meta) {
    if (!meta || !meta.id) return 0;
    let n = 0;
    for (let i = 0; i < meta.id.length; i++) n += meta.id.charCodeAt(i);
    return (n % 17) / 17;
  }

  function gaitPhase(name, salt) {
    if (name === "stand" || name === "jump") return 0;
    const hz = name === "walk" ? 0.95 : name === "trot" ? 1.45 : name === "canter" ? 1.75 : 2.35;
    if (reduceMotion) return name === "gallop" ? 0.2 : name === "canter" ? 0.15 : name === "trot" ? 0.1 : 0.05;
    return ((clock / 1000) * hz + (salt || 0)) % 1;
  }

  function legShift(name, gait, phase) {
    if (gait === "jump") {
      if (name === "farHind") return { x: -1.15, y: -0.22, tuck: 0 };
      if (name === "nearHind") return { x: -0.95, y: -0.08, tuck: 0 };
      if (name === "farFore") return { x: 0.95, y: -0.7, tuck: 0 };
      return { x: 1.15, y: -0.9, tuck: 0 };
    }
    const spec = gaitSpec(gait);
    if (!spec) {
      if (reduceMotion) return { x: 0, y: 0, tuck: 0 };
      const sway = Math.sin(clock / 1800) * 0.05;
      if (name === "farHind") return { x: 0.3 + sway, y: -0.1, tuck: 0.12 };
      if (name === "nearHind") return { x: -0.05, y: 0, tuck: 0 };
      if (name === "farFore") return { x: 0.05 - sway, y: 0, tuck: 0 };
      return { x: -0.03, y: 0, tuck: 0 };
    }
    if (spec.suspend && phase >= spec.suspend) {
      const fore = name.indexOf("Fore") >= 0;
      return { x: fore ? 0.22 : -0.18, y: -0.95, tuck: 1 };
    }
    let p = (phase + spec.offsets[name]) % 1;
    if (p < 0) p += 1;
    if (p < spec.stance) {
      const u = p / spec.stance;
      return { x: spec.reach * (1 - 2 * u), y: 0, tuck: 0 };
    }
    const u = (p - spec.stance) / (1 - spec.stance);
    return { x: spec.reach * (-1 + 2 * u), y: -Math.sin(u * Math.PI) * spec.lift, tuck: 0 };
  }

  function twoBone(ax, ay, hx, hy, len1, len2, bend) {
    const dx = hx - ax;
    const dy = hy - ay;
    const dist = Math.max(1, Math.hypot(dx, dy));
    const max = len1 + len2 - 0.5;
    const min = Math.abs(len1 - len2) + 0.5;
    const d = Math.min(max, Math.max(min, dist));
    const ux = dx / dist;
    const uy = dy / dist;
    const tx = ax + ux * d;
    const ty = ay + uy * d;
    const cos = (len1 * len1 + d * d - len2 * len2) / (2 * len1 * d);
    const ang = Math.acos(Math.max(-1, Math.min(1, cos)));
    const knee = Math.atan2(ty - ay, tx - ax) + bend * ang;
    return { kx: ax + Math.cos(knee) * len1, ky: ay + Math.sin(knee) * len1, hx: tx, hy: ty };
  }

  function fillBone(ax, ay, bx, by, w1, w2, coat) {
    const ang = Math.atan2(by - ay, bx - ax);
    const nx = Math.sin(ang);
    const ny = -Math.cos(ang);
    ctx.beginPath();
    ctx.moveTo(ax + nx * w1, ay + ny * w1);
    ctx.lineTo(bx + nx * w2, by + ny * w2);
    ctx.lineTo(bx - nx * w2, by - ny * w2);
    ctx.lineTo(ax - nx * w1, ay - ny * w1);
    ctx.closePath();
    ctx.fillStyle = coat;
    ctx.fill();
    strokeInk();
    ctx.lineWidth = Math.max(2, Math.min(w1, w2) * 0.22);
    ctx.stroke();
  }

  function drawLeg(attach, shift, drop, reachPx, upper, lower, width, coat, bend) {
    let hx = attach.x + shift.x * reachPx;
    let hy = attach.y + drop + shift.y * drop * 0.85;
    if (shift.tuck) {
      hx = attach.x + (hx - attach.x) * 0.35;
      hy = attach.y + drop * 0.28;
    }
    const joint = twoBone(attach.x, attach.y, hx, hy, upper, lower, bend);
    fillBone(attach.x, attach.y, joint.kx, joint.ky, width, width * 0.72, coat);
    fillBone(joint.kx, joint.ky, joint.hx, joint.hy, width * 0.62, width * 0.4, coat);
    ctx.fillStyle = coat;
    ctx.beginPath();

  function drawTail(body, gait, phase, mane) {

  function travelShift() {
    if (!travel || checking || reduceMotion || session.place !== "stable") return 0;
    const dist = Math.min(460, Math.max(220, window.innerWidth * 0.42));
    if (travel.kind === "in") {
      const u = Math.max(0, Math.min(1, (clock - travel.start) / travel.ms));
      const ease = u * u * (3 - 2 * u);
      return (1 - ease) * -dist;
    }
    const turnMs = travel.turnMs || 0;
    const walked = clock - travel.start - turnMs;
    if (walked <= 0) return 0;
    const u = Math.max(0, Math.min(1, walked / Math.max(1, travel.ms - turnMs)));
    const ease = u * u * (3 - 2 * u);
    return ease * -dist;
  }

  function turnScale(from, to, t) {

    if (t < 0.8) return { scale: turnScale(from, to, (t - 0.62) / 0.18), bend: 1 };
    return { scale: to, bend: Math.cos(((t - 0.8) / 0.2) * Math.PI / 2) };

  function travelFacing() {
    if (!travel || checking || reduceMotion || session.place !== "stable" || travel.kind !== "out") return null;
    const turnMs = travel.turnMs || 0;
    if (!turnMs) return { scale: -1, bend: 0 };
    return haunchFacing(1, -1, (clock - travel.start) / turnMs);

  function facingOf(face) {
    if (face && typeof face === "object") {

      if (scale > 1) scale = 1;
      if (scale < -1) scale = -1;
      let bend = face.bend > 0 ? face.bend : 0;
      if (bend > 1) bend = 1;
      return { scale: scale, bend: bend };
    }
    if (typeof face === "number" && face < 0) return { scale: -1, bend: 0 };
    return { scale: 1, bend: 0 };

    return (phase >= 0.74 ? -7 : 0) + Math.sin(phase * Math.PI * 2) * 3;

    if (poseName === "drink" || poseName === "eat") return { x: 0.25, y: 0.75, ear: 0.2 };
    const onField = session.place === "cattle" || (session.place === "chores" && session.chores && session.chores.phase === "field");
    if (!appearance && onField) return { x: 0.8, y: 0, ear: 0.65 };
    if (reduceMotion) return { x: 0.12, y: 0, ear: 0.08 };
    return { x: Math.sin(clock / 1700) * 0.42, y: Math.sin(clock / 2600) * 0.12, ear: Math.sin(clock / 1700) * 0.48 };
  }

  function drawHorse(ctx, box, poseName, appearance, face) {

    const reachPx = 48 * s;
    const far = shade(meta.coat, -36);
    function paintLeg(name, at, upper, lower, width, coat, knee) {
      const raw = legShift(name, gait, phase);
      const shift = { x: raw.x, y: raw.y, tuck: raw.tuck };
      if (turn > 0.04) {
        if (name === "nearFore") {
          shift.x += turn * 0.9;
          shift.y -= turn * 0.2;
        } else if (name === "farFore") {
          shift.x -= turn * 0.75;
          shift.y -= turn * 0.35;
        } else {
          const hold = 1 - 0.8 * turn;
          shift.x *= hold;
          shift.y *= hold;
        }
      }
      drawLeg(at, shift, ground - at.y, reachPx, upper, lower, width, coat, knee);
    }
    paintLeg("farHind", { x: hip.x + 10 * s, y: hip.y - 6 * s }, 46 * s, 52 * s, Math.max(7, 16 * s), far, 1);
    paintLeg("farFore", { x: shoulder.x - 8 * s, y: shoulder.y - 4 * s }, 42 * s, 50 * s, Math.max(7, 14 * s), far, -1);
    drawBarrel(body, meta.coat);
    paintLeg("nearHind", hip, 46 * s, 54 * s, Math.max(8, 20 * s), meta.coat, 1);
    paintLeg("nearFore", shoulder, 42 * s, 52 * s, Math.max(8, 18 * s), meta.coat, -1);
    if (gait === "gallop" && !reduceMotion) {
      const puff = (phase * 4) % 1;
      ctx.fillStyle = "rgba(196, 165, 116, " + ((1 - puff) * 0.4).toFixed(3) + ")";
      ctx.beginPath();
      ctx.ellipse(body.cx - body.rx * 0.85 - puff * 28, ground - 6, 7 + puff * 12, 4 + puff * 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    const withersX = body.cx + body.rx * 0.12;
    const withersY = body.cy - body.ry * 0.42;
    ctx.save();
    if (turn > 0.04) {
      ctx.translate(withersX, withersY);
      ctx.rotate(-turn * 1.15);
      ctx.translate(-withersX, -withersY);
    }
    drawNeck(body, vis, meta.coat, meta.mane);
    drawHorseHead(vis, meta.coat, meta.mane, meta.ribbon, glance, poseName);
    ctx.restore();
    if (meta.id === "pinto") {
      ctx.beginPath();
      ctx.ellipse(parts.patch.x, parts.patch.y, parts.patch.rx, parts.patch.ry, -0.4, 0, Math.PI * 2);
      ctx.fillStyle = "#fff6ea";
      ctx.fill();
    }
    if (poseName === "brush" && !reduceMotion) drawBrushArm(body, parts);
    if (horse.care.brushed) {
      parts.marks.forEach((m) => {
        ctx.beginPath();
        ctx.roundRect(m.x - 14, m.y - 4, 28, 8, 4);
        ctx.fillStyle = INK;
        ctx.fill();
      });
    }
    if (horse.care.saddle !== "off") drawHorseSaddle(body, horse.care.saddle, parts.saddle);
    if (poseName === "eat" && eatUntil && clock < eatUntil) {
      const foodX = vis.x + (parts.mouth.x - head.x);
      const foodY = vis.y + (parts.mouth.y - head.y);
      const bite = 1 - (eatUntil - clock) / 2400;
      const foodScale = bite < 0.45 ? 1 : Math.max(0, 1 - (bite - 0.45) / 0.55);
      if (foodScale > 0.04) {
        ctx.save();
        ctx.translate(foodX, foodY);
        ctx.scale(foodScale, foodScale);
        if (eating === "carrot") {
          ctx.fillStyle = CARROT;
          ctx.beginPath();
          ctx.moveTo(-28, -28);
          ctx.lineTo(-14, -8);
          ctx.lineTo(-34, -6);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "#2f8a3e";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-28, -28);
          ctx.lineTo(-34, -38);
          ctx.stroke();
        }
        if (eating === "apple") {
          ctx.strokeStyle = "#2f8a3e";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-1, -12);
          ctx.lineTo(-4, -24);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 0, 14, 0, Math.PI * 2);
          ctx.fillStyle = APPLE;
          ctx.fill();
        }
        ctx.restore();
      }
    }
    if (poseName === "drink" && !reduceMotion && drinkUntil && clock >= drinkUntil) {
      const pulse = (Math.sin(clock / 150) + 1) / 2;
      ctx.fillStyle = shade(meta.coat, -20);
      ctx.beginPath();
      ctx.ellipse(vis.x - vis.r * 0.32, vis.y + vis.r * 0.12, vis.r * 0.16, vis.r * (0.08 + pulse * 0.08), 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawRackSaddle(x, y) {
    ctx.fillStyle = "#f7f1dc";
    ctx.beginPath();
    ctx.ellipse(x + 30, y + 20, 32, 12, -0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + 8, y + 22);
    ctx.quadraticCurveTo(x + 12, y + 2, x + 24, y + 12);
    ctx.quadraticCurveTo(x + 40, y + 20, x + 52, y + 8);
    ctx.quadraticCurveTo(x + 58, y + 4, x + 56, y + 16);
    ctx.quadraticCurveTo(x + 40, y + 30, x + 10, y + 26);
    ctx.closePath();
    ctx.fillStyle = SADDLE;
    ctx.fill();
    strokeInk();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 48, y + 12);
    ctx.quadraticCurveTo(x + 54, y - 2, x + 58, y + 6);
    ctx.quadraticCurveTo(x + 52, y + 14, x + 46, y + 14);
    ctx.closePath();
    ctx.fillStyle = SADDLE;
    ctx.fill();
    strokeInk();
    ctx.stroke();
    ctx.fillStyle = shade(SADDLE, -36);
    ctx.fillRect(x + 24, y + 26, 8, 20);
    ctx.fillRect(x + 36, y + 26, 8, 14);
  }

  function paintStable(w, h) {
    ctx.fillStyle = "#9fd4f2";
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = WOOD;
    ctx.fillRect(0, 78, w, h);
    ctx.fillStyle = "#8d5a32";
    for (let x = 0; x < w; x += 46) ctx.fillRect(x, 78, 4, h);
    const floorY = Math.round(h * 0.78);
    ctx.fillStyle = GRASS;
    ctx.fillRect(0, floorY, w, h - floorY);
    ctx.fillStyle = "#6b4a2a";
    ctx.fillRect(Math.round(w * 0.18), floorY - 8, Math.round(w * 0.64), 18);

    const box = horseBox(w, h);
    const parts = horseParts(box, pose);
    drawHorse(ctx, box, pose);
    if (session.horse && session.horse.needs.drink) paintSweat(parts.head.x - 10, parts.head.y - 24);

    const rackX = 28;
    const rackY = 150;
    roundFill(rackX, rackY, 92, 18, "#8d5a32", 6);
    ctx.fillStyle = "#6b4424";
    ctx.fillRect(rackX + 16, rackY + 16, 10, 26);
    ctx.fillRect(rackX + 64, rackY + 16, 10, 26);
    if (!session.horse || session.horse.care.saddle === "off") drawRackSaddle(rackX + 16, rackY + 22);

    const bucketY = Math.max(parts.body.cy + parts.body.ry + 78, floorY - 36);
    drawBucket(20, bucketY, "apple");
    drawBucket(92, bucketY, "carrot");

    const trough = parts.trough;
    const troughFill = session.horse && session.horse.care.trough === "full" ? WATER : TROUGH_EMPTY;
    roundFill(trough.x, trough.y, trough.w, trough.h, troughFill, 10);
    paintBarnWater(trough);

    if (session.horse) {
      const flags = pipFlags();
      const pipY = 168;
      const gap = 28;
      const x0 = w / 2 - gap * 2;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.arc(x0 + i * gap, pipY, 8, 0, Math.PI * 2);
        ctx.fillStyle = flags[i] ? "#2f8a3e" : PAPER;
        ctx.fill();
        strokeInk();
        ctx.stroke();
      }
    }
  }

  function pipFlags() {
    const horse = session.horse;
    if (!horse) return [false, false, false, false, false];
    return [
      horse.care.brushed,
      horse.care.trough === "full",
      horse.care.saddle === "on",
      horse.care.spots.every((s) => s.cleared),
      horse.care.foods.apple || horse.care.foods.carrot
    ];
  }

  function drawBucket(x, y, kind) {
    const horse = session.horse;
    const filled = !horse || !horse.care.foods[kind];
    roundFill(x, y, 58, 46, "#d7b48a", 8);
    ctx.fillStyle = WOOD;
    ctx.fillRect(x + 6, y + 8, 46, 28);
    if (filled) {
      ctx.beginPath();
      ctx.arc(x + 29, y + 18, 12, 0, Math.PI * 2);
      ctx.fillStyle = kind === "apple" ? APPLE : CARROT;
      ctx.fill();
    }
    ctx.strokeStyle = "#8d97a1";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x + 29, y + 2, 16, Math.PI, 0);
    ctx.stroke();
    ctx.strokeRect(x + 6, y + 6, 46, 5);
  }

  function stampTrough(trough) {
    if (!session.horse || session.horse.care.trough !== "full") return;
    ctx.beginPath();
    ctx.ellipse(trough.cx, trough.cy, 16, 9, 0, 0, Math.PI * 2);
    ctx.fillStyle = WATER;
    ctx.fill();
  }

  function paintBarnWater(trough) {
    const fx = trough.x + trough.w - 6;
    const fy = trough.y - 78;
    ctx.fillStyle = "#b7c0c8";
    ctx.fillRect(fx, fy, Math.max(20, window.innerWidth - fx), 12);
    ctx.fillRect(fx - 6, fy, 16, 52);
    ctx.fillRect(fx - 28, fy + 40, 36, 12);
    ctx.fillStyle = "#8d97a1";
    ctx.beginPath();
    ctx.arc(fx + 2, fy + 8, 9, 0, Math.PI * 2);
    ctx.fill();
    strokeInk();
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(fx - 6, fy + 8);
    ctx.lineTo(fx + 10, fy + 8);
    ctx.moveTo(fx + 2, fy);
    ctx.lineTo(fx + 2, fy + 16);
    ctx.stroke();
    const pouring = !reduceMotion && pourUntil && clock < pourUntil && session.horse && session.horse.care.trough === "full";
    if (!pouring) {
      stampTrough(trough);
      return;
    }
    const u = Math.max(0, Math.min(1, 1 - (pourUntil - clock) / 2200));
    const homeX = fx - 46;
    const homeY = fy + 54;
    const rimX = trough.x - 8;
    const rimY = trough.y - 36;
    let bx = homeX;
    let by = homeY;
    let tilt = 0;
    if (u < 0.35) {
      ctx.strokeStyle = WATER;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(fx - 22, fy + 52);
      ctx.lineTo(bx + 24, by + 2);
      ctx.stroke();
    } else if (u < 0.7) {
      const k = (u - 0.35) / 0.35;
      bx = homeX + (rimX - homeX) * k;
      by = homeY + (rimY - homeY) * k;
    } else {
      const k = (u - 0.7) / 0.3;
      bx = rimX;
      by = rimY;
      tilt = -1 * k;
      ctx.strokeStyle = WATER;
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(bx + 40, by + 4);
      ctx.quadraticCurveTo(trough.x + 6, trough.y - 8, trough.x + 10, trough.y + 18);
      ctx.stroke();
    }
    ctx.save();
    ctx.translate(bx + 24, by + 16);
    ctx.rotate(tilt);
    roundFill(-24, -16, 50, 34, "#d5dde4", 8);
    ctx.strokeStyle = "#8d97a1";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, -16, 14, Math.PI, 0);
    ctx.stroke();
    ctx.fillStyle = WATER;
    const level = u < 0.35 ? 8 + (u / 0.35) * 14 : u < 0.7 ? 22 : 22 - ((u - 0.7) / 0.3) * 16;
    ctx.fillRect(-16, 8 - level * 0.4, 32, Math.max(4, level * 0.45));
    ctx.restore();
    stampTrough(trough);
  }

  function paintHoof(w, h) {
    const horse = session.horse;
    ctx.fillStyle = WOOD;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#8d5a32";
    for (let x = 0; x < w; x += 46) ctx.fillRect(x, 0, 4, h);
    const n = horse ? horse.care.spots.length : 0;
    const hoof = hoofLayout(w, h, Math.max(n, 1));
    ctx.beginPath();
    ctx.arc(hoof.cx, hoof.cy, 160, 0, Math.PI * 2);
    ctx.fillStyle = HOOF;
    ctx.fill();
    strokeInk();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(hoof.cx, hoof.cy + 36);
    ctx.lineTo(hoof.cx, hoof.cy + 120);
    strokeInk();
    ctx.stroke();
    if (!horse) return;
    horse.care.spots.forEach((spot) => {
      const s = hoof.spots.find((p) => p.id === spot.id);
      if (!s) return;
      ctx.beginPath();
      ctx.arc(s.cx, s.cy, 26, 0, Math.PI * 2);
      ctx.fillStyle = spot.cleared ? HOOF : DIRT;
      ctx.fill();
    });
  }

  function ridePose() {
    const j = session.jumps;
    if (!j) return "stand";
    if (j.phase === "jump") return "jump";
    if (j.phase === "choose" || j.phase === "gap") return j.speed || "walk";
    return "stand";
  }

  function visualApproach() {
    const j = session.jumps;
    if (!j) return 0;
    if (j.phase === "jump") return 1;
    if (j.phase === "choose") return j.approach;
    return 0;
  }

  function gateCenterX(w) {
    const a = visualApproach();
    return w * (TUNE.gateXFrac.far + (TUNE.gateXFrac.near - TUNE.gateXFrac.far) * a);
  }

  function stepColor(step, need) {
    const full = step === 1 ? LOW_COLOR : step === 2 ? MID_COLOR : HIGH_COLOR;
    if (step === need) return full;
    const c = hexRgb(full);
    const mix = (v) => Math.round(v * 0.35 + 244 * 0.65);
    return "rgb(" + mix(c.r) + "," + mix(c.g) + "," + mix(c.b) + ")";
  }

  function paintLog(x, ground) {
    roundFill(x - 78, ground - 40, 156, 36, LOW_COLOR, 16);
    ctx.fillStyle = WOOD;
    ctx.beginPath();
    ctx.arc(x - 70, ground - 22, 16, 0, Math.PI * 2);
    ctx.arc(x + 70, ground - 22, 16, 0, Math.PI * 2);
    ctx.fill();
    strokeInk();
    ctx.stroke();
  }

  function paintRails(x, ground, need) {
    const postH = 128;
    const top = ground - postH;
    ctx.fillStyle = WOOD;
    ctx.fillRect(x - 58, top, 14, postH);
    ctx.fillRect(x + 44, top, 14, postH);
    strokeInk();
    ctx.strokeRect(x - 58, top, 14, postH);
    ctx.strokeRect(x + 44, top, 14, postH);
    [3, 2, 1].forEach((step, i) => {
      const y = top + 12 + i * 38;
      ctx.fillStyle = stepColor(step, need);
      ctx.fillRect(x - 52, y, 104, 16);
      strokeInk();
      ctx.strokeRect(x - 52, y, 104, 16);
    });
  }

  function paintSideCourse(w, h) {
    ctx.fillStyle = "#9fd4f2";
    ctx.fillRect(0, 0, w, h);
    const ground = Math.round(h * 0.78);
    ctx.fillStyle = GRASS;
    ctx.fillRect(0, Math.round(h * 0.5), w, h);
    ctx.fillStyle = "#d7c49a";
    ctx.fillRect(0, ground, w, h - ground);
    ctx.fillStyle = "#6b4a2a";
    ctx.fillRect(0, ground - 6, w, 10);
    const j = session.jumps;
    if (j && j.phase !== "done") {
      const x = gateCenterX(w);
      if (session.levelId === "tiny") paintLog(x, ground);
      else paintRails(x, ground, j.need);
    }
    const box = {
      x: 0,
      y: 70,
      w: w,
      h: Math.max(240, ground - 80),
      anchorX: w * 0.28,
      anchorY: ground - 150
    };
    drawHorse(ctx, box, ridePose());
  }

  function paintEars(w, h, meta) {
    const cx = w / 2;
    const base = h - 6;
    ctx.fillStyle = meta.coat;
    ctx.beginPath();
    ctx.moveTo(cx - 46, base);
    ctx.lineTo(cx - 24, base - 80);
    ctx.lineTo(cx - 6, base);
    ctx.closePath();
    ctx.fill();
    strokeInk();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 6, base);
    ctx.lineTo(cx + 24, base - 80);
    ctx.lineTo(cx + 46, base);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = meta.mane;
    ctx.beginPath();
    ctx.moveTo(cx - 14, base);
    ctx.lineTo(cx, base - 62);
    ctx.lineTo(cx + 14, base);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  function paintFirstCourse(w, h) {
    const horizon = h * 0.45;
    ctx.fillStyle = "#9fd4f2";
    ctx.fillRect(0, 0, w, h);
    const span = w * 0.40;
    ctx.fillStyle = GRASS;
    ctx.beginPath();
    ctx.moveTo((w - span) / 2, horizon);
    ctx.lineTo((w + span) / 2, horizon);
    ctx.lineTo(w + 20, h);
    ctx.lineTo(-20, h);
    ctx.closePath();
    ctx.fill();
    const pathTop = span * 0.32;
    ctx.fillStyle = "#4e7a32";
    ctx.beginPath();
    ctx.moveTo((w - pathTop) / 2, horizon);
    ctx.lineTo((w + pathTop) / 2, horizon);
    ctx.lineTo(w * 0.66, h);
    ctx.lineTo(w * 0.34, h);
    ctx.closePath();
    ctx.fill();
    const j = session.jumps;
    if (j && j.phase !== "done") {
      const a = visualApproach();
      const gh = TUNE.gatePx.far + (TUNE.gatePx.near - TUNE.gatePx.far) * a;
      const gw = 48 + 150 * a;
      const base = horizon + 8 + a * Math.max(24, (h - horizon) * 0.22);
      const top = base - gh;
      const x = w / 2;
      ctx.fillStyle = WOOD;
      ctx.fillRect(x - gw / 2, top, 8, gh);
      ctx.fillRect(x + gw / 2 - 8, top, 8, gh);
      strokeInk();
      ctx.strokeRect(x - gw / 2, top, 8, gh);
      ctx.strokeRect(x + gw / 2 - 8, top, 8, gh);
