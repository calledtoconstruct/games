<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>Memory Match</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; touch-action: none; pointer-events: auto; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 28; pointer-events: none;
    background: var(--card); border-radius: 999px; padding: 8px 12px;
    font-weight: 800; font-size: 16px;
  }
  #banner {
    position: fixed; z-index: 25; pointer-events: none;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 6px 14px; font-size: 18px; font-weight: 800;
    text-align: center;
  }
  #menu-card, #rest-card {
    position: fixed; z-index: 2; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #screen-menu, #screen-rest, #play, #deck-host, #board, #menu-copy, #rest-line, h1, p, b, small {
    pointer-events: none;
  }
  #menu-copy, #rest-line {
    position: fixed; z-index: 24; margin: 0; text-align: center; overflow: hidden;
  }
  #menu-copy h1 { margin: 0; font-size: 26px; line-height: 28px; }
  #menu-copy p { margin: 0; font-size: 14px; line-height: 16px; }
  #rest-line { font-size: 28px; font-weight: 800; }
  #mute, #full, #back, #lets-go, #tiny, #little, #shop, #rush, #another,
  #animals, #food, #shapes, #board button {
    position: fixed; z-index: 30; pointer-events: auto;
  }
  #mute, #full, #back {
    z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1; font-size: 15px; line-height: 1.1;
    padding: 4px;
  }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; display: block; }
  #full { font-size: 13px; }
  #tiny, #little, #shop, #rush {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; color: var(--ink); text-align: left;
    padding: 4px 10px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  #tiny b, #little b, #shop b, #rush b { display: block; font-size: 18px; line-height: 20px; }
  #tiny small, #little small, #shop small, #rush small {
    display: block; font-size: 12px; line-height: 14px; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go, #another {
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink); font-weight: 800;
    box-shadow: 0 5px 0 var(--sun-d); font-size: 26px;
  }
  #animals, #food, #shapes {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; border: 4px solid var(--ink); border-radius: 24px;
    background: var(--card); color: var(--ink); font-weight: 800; font-size: 28px;
    box-shadow: 0 6px 0 #e4d7b8;
  }
  #animals svg, #food svg, #shapes svg { width: 96px; height: 96px; display: block; }
  #board button {
    border: 4px solid var(--ink); border-radius: 18px; padding: 0;
    background: var(--card); color: var(--ink);
    box-shadow: 0 4px 0 #e4d7b8; overflow: hidden;
  }
  #board button * { pointer-events: none; }
  #board button .flip {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform 250ms linear;
    transform: rotateY(180deg);
  }
  #board button.up .flip { transform: rotateY(0deg); }
  #board button .front, #board button .back {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 12px; overflow: hidden;
  }
  #board button .back { transform: rotateY(180deg); background: var(--card); }
  #board button .back svg { width: 100%; height: 100%; display: block; }
  #board button .front {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--card); gap: 2px;
  }
  #board button svg.face { width: 74%; height: 62%; display: block; }
  #board button .name { font-size: 14px; line-height: 16px; font-weight: 800; }
  #board button .check {
    position: absolute; top: 6px; right: 6px; width: 28px; height: 28px;
    border-radius: 50%; background: #1f8a4c;
    display: grid; place-items: center;
  }
  #board button .check svg { width: 20px; height: 20px; display: block; }
  @media (prefers-reduced-motion: reduce) {
    #board button .flip { transition: none; }
  }
</style>
</head>
<body>
<button id="mute" type="button" aria-label="Mute sound">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8l6 8"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner">Pick who is playing.</p>
<section id="screen-menu">
  <div id="menu-card"></div>
  <div id="menu-copy">
    <h1>Memory Match</h1>
    <p>Turn over two cards to find a pair.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>Peek Pairs</b><small>Ages 2 to 3. Two pairs.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Pair Party</b><small>Ages 4 to 5. Three pairs.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Card Table</b><small>Ages 6 to 8. Six pairs.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Big Deck</b><small>Ages 9 and up. Eight pairs.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden>
  <div id="deck-host">
    <button id="animals" type="button"><span class="sample"></span><b>Animals</b></button>
    <button id="food" type="button"><span class="sample"></span><b>Food</b></button>
    <button id="shapes" type="button"><span class="sample"></span><b>Shapes</b></button>
  </div>
  <div id="board" hidden></div>
</div>
<section id="screen-rest" hidden>
  <div id="rest-card"></div>
  <p id="rest-line">You found them all.</p>
  <button id="another" type="button">Another</button>
</section>
<script>
(function () {
  "use strict";
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;

  const LEAVE_MS = 280;

  const INK = "#2c2416";
  const SVG_NS = "http://www.w3.org/2000/svg";
  const BANDS = {
    tiny: { pairs: 2, pause: 1500, portrait: [2, 2], landscape: [2, 2] },
    little: { pairs: 3, pause: 1200, portrait: [2, 3], landscape: [3, 2] },

  };
  const DECKS = {

      { id: "bird",  label: "Bird",  color: "#F0E442" }, // round body, small triangle beak, wing arc
      { id: "frog",  label: "Frog",  color: "#009E73" }, // wide oval head, two circle eyes on top, smile line
      { id: "pig",   label: "Pig",   color: "#CC79A7" }, // round head, oval snout with two dots, small ears
      { id: "bunny", label: "Bunny", color: "#BBBBBB" }, // round head, two tall oval ears
      { id: "bee",   label: "Bee",   color: "#F0E442" }  // oval body with three dark stripes, two wing ovals

    food: [

      { id: "banana", label: "Banana", color: "#F0E442" }, // thick crescent
      { id: "pear",   label: "Pear",   color: "#009E73" }, // small circle on big circle, stem
      { id: "grapes", label: "Grapes", color: "#CC79A7" }, // triangle of six circles, stem
      { id: "carrot", label: "Carrot", color: "#E69F00" }, // long triangle, three green leaf strokes
      { id: "cheese", label: "Cheese", color: "#F0E442" }, // wedge triangle with three hole circles
      { id: "bread",  label: "Bread",  color: "#C89B5B" }, // loaf: rectangle with a domed top
      { id: "milk",   label: "Milk",   color: "#56B4E9" }  // carton: rectangle with a peaked top
    ],
    shapes: [
      { id: "circle",   label: "Circle",   color: "#0072B2" },
      { id: "square",   label: "Square",   color: "#E69F00" },
      { id: "triangle", label: "Triangle", color: "#009E73" },
      { id: "star",     label: "Star",     color: "#F0E442" },

      { id: "cross",    label: "Cross",    color: "#2C2416" }
    ]
  };

  function svgEl(name, attrs) {
    const node = document.createElementNS(SVG_NS, name);
    if (attrs) {
      for (const key in attrs) node.setAttribute(key, attrs[key]);
    }
    return node;
  }
  function add(parent, name, attrs) {
    const node = svgEl(name, attrs);
    parent.appendChild(node);
    return node;
  }
  function strokeOf(color) {
    return { fill: color, stroke: INK, "stroke-width": "3", "stroke-linejoin": "round" };
  }
  function starPoints() {
    const pts = [];
    for (let i = 0; i < 5; i++) {
      const outer = -Math.PI / 2 + i * 2 * Math.PI / 5;
      const inner = outer + Math.PI / 5;
      pts.push((50 + 38 * Math.cos(outer)).toFixed(1) + "," + (52 + 38 * Math.sin(outer)).toFixed(1));
      pts.push((50 + 16 * Math.cos(inner)).toFixed(1) + "," + (52 + 16 * Math.sin(inner)).toFixed(1));
    }
    return pts.join(" ");
  }
  const STAR_POINTS = starPoints();

  const FACE = {
    cat: function (svg, color) {
      add(svg, "polygon", Object.assign({ points: "20,44 34,16 48,44" }, strokeOf(color)));
      add(svg, "polygon", Object.assign({ points: "52,44 66,16 80,44" }, strokeOf(color)));
      add(svg, "circle", Object.assign({ cx: "50", cy: "58", r: "26" }, strokeOf(color)));
      const whisk = [[16, 54, 38, 58], [14, 62, 38, 62], [16, 70, 38, 66], [62, 58, 84, 54], [62, 62, 86, 62], [62, 66, 84, 70]];
      for (let i = 0; i < whisk.length; i++) {
        const w = whisk[i];
        add(svg, "line", { x1: w[0], y1: w[1], x2: w[2], y2: w[3], stroke: INK, "stroke-width": "2", "stroke-linecap": "round" });

    },
    dog: function (svg, color) {
      add(svg, "ellipse", Object.assign({ cx: "26", cy: "66", rx: "12", ry: "24", transform: "rotate(18 26 66)" }, strokeOf(color)));
      add(svg, "ellipse", Object.assign({ cx: "74", cy: "66", rx: "12", ry: "24", transform: "rotate(-18 74 66)" }, strokeOf(color)));
      add(svg, "circle", Object.assign({ cx: "50", cy: "52", r: "26" }, strokeOf(color)));
      add(svg, "ellipse", { cx: "50", cy: "62", rx: "10", ry: "8", fill: INK });
    },
    fish: function (svg, color) {
      add(svg, "ellipse", Object.assign({ cx: "46", cy: "52", rx: "28", ry: "18" }, strokeOf(color)));
      add(svg, "polygon", Object.assign({ points: "70,52 94,32 94,72" }, strokeOf(color)));
      add(svg, "circle", { cx: "32", cy: "46", r: "4", fill: INK });
    },
    bird: function (svg, color) {
      add(svg, "circle", Object.assign({ cx: "46", cy: "54", r: "26" }, strokeOf(color)));
      add(svg, "polygon", Object.assign({ points: "68,48 90,56 68,64" }, strokeOf(color)));
      add(svg, "path", { d: "M28 58 Q 46 36 66 58", fill: "none", stroke: INK, "stroke-width": "4", "stroke-linecap": "round" });
    },
    frog: function (svg, color) {
      add(svg, "ellipse", Object.assign({ cx: "50", cy: "60", rx: "34", ry: "22" }, strokeOf(color)));
      add(svg, "circle", { cx: "32", cy: "36", r: "10", fill: "#fffdf6", stroke: INK, "stroke-width": "3" });
      add(svg, "circle", { cx: "68", cy: "36", r: "10", fill: "#fffdf6", stroke: INK, "stroke-width": "3" });
      add(svg, "path", { d: "M34 66 Q 50 78 66 66", fill: "none", stroke: INK, "stroke-width": "3", "stroke-linecap": "round" });
    },
    pig: function (svg, color) {
      add(svg, "ellipse", Object.assign({ cx: "28", cy: "36", rx: "8", ry: "10" }, strokeOf(color)));
      add(svg, "ellipse", Object.assign({ cx: "72", cy: "36", rx: "8", ry: "10" }, strokeOf(color)));
      add(svg, "circle", Object.assign({ cx: "50", cy: "56", r: "28" }, strokeOf(color)));
      add(svg, "ellipse", { cx: "50", cy: "64", rx: "14", ry: "10", fill: "#f4d2e4", stroke: INK, "stroke-width": "3" });
      add(svg, "circle", { cx: "45", cy: "64", r: "2.5", fill: INK });
      add(svg, "circle", { cx: "55", cy: "64", r: "2.5", fill: INK });
    },
    bunny: function (svg, color) {
      add(svg, "ellipse", Object.assign({ cx: "36", cy: "32", rx: "10", ry: "22" }, strokeOf(color)));
      add(svg, "ellipse", Object.assign({ cx: "64", cy: "32", rx: "10", ry: "22" }, strokeOf(color)));
      add(svg, "circle", Object.assign({ cx: "50", cy: "64", r: "26" }, strokeOf(color)));
    },
    bee: function (svg, color) {
      add(svg, "ellipse", { cx: "32", cy: "40", rx: "14", ry: "9", fill: "#fffdf6", stroke: INK, "stroke-width": "3" });
      add(svg, "ellipse", { cx: "68", cy: "40", rx: "14", ry: "9", fill: "#fffdf6", stroke: INK, "stroke-width": "3" });
      add(svg, "ellipse", Object.assign({ cx: "50", cy: "56", rx: "22", ry: "26" }, strokeOf(color)));
      add(svg, "line", { x1: "32", y1: "48", x2: "68", y2: "48", stroke: INK, "stroke-width": "5", "stroke-linecap": "round" });
      add(svg, "line", { x1: "30", y1: "58", x2: "70", y2: "58", stroke: INK, "stroke-width": "5", "stroke-linecap": "round" });
      add(svg, "line", { x1: "32", y1: "68", x2: "68", y2: "68", stroke: INK, "stroke-width": "5", "stroke-linecap": "round" });

      add(svg, "circle", Object.assign({ cx: "50", cy: "58", r: "28" }, strokeOf(color)));
      add(svg, "line", { x1: "50", y1: "32", x2: "50", y2: "16", stroke: INK, "stroke-width": "4", "stroke-linecap": "round" });

      add(svg, "path", Object.assign({ d: "M30 64 C 32 34, 58 20, 80 30 C 68 36, 58 42, 54 58 C 50 74, 62 82, 76 78 C 52 92, 28 82, 30 64 Z" }, strokeOf(color)));
    },
    pear: function (svg, color) {
      add(svg, "circle", Object.assign({ cx: "50", cy: "66", r: "24" }, strokeOf(color)));
      add(svg, "circle", Object.assign({ cx: "50", cy: "40", r: "16" }, strokeOf(color)));

    grapes: function (svg, color) {
      const pts = [[50, 30], [36, 44], [64, 44], [28, 58], [50, 58], [72, 58]];
      for (let i = 0; i < pts.length; i++) {

    },
    cheese: function (svg, color) {
      add(svg, "polygon", Object.assign({ points: "16,80 50,18 84,80" }, strokeOf(color)));

      add(svg, "circle", { cx: "60", cy: "62", r: "5", fill: "#fffdf6" });

    bread: function (svg, color) {

      add(svg, "circle", Object.assign({ cx: "50", cy: "50", r: "32" }, strokeOf(color)));
    },
    square: function (svg, color) {
      add(svg, "rect", Object.assign({ x: "18", y: "18", width: "64", height: "64", rx: "4" }, strokeOf(color)));
    },
    triangle: function (svg, color) {
      add(svg, "polygon", Object.assign({ points: "50,14 90,84 10,84" }, strokeOf(color)));
    },
    star: function (svg, color) {
      add(svg, "polygon", Object.assign({ points: STAR_POINTS }, strokeOf(color)));
    },
    heart: function (svg, color) {
      add(svg, "path", Object.assign({ d: "M50 84 C 18 60, 12 40, 24 30 C 34 20, 46 28, 50 38 C 54 28, 66 20, 76 30 C 88 40, 82 60, 50 84 Z" }, strokeOf(color)));
    },
    moon: function (svg, color) {
      add(svg, "path", Object.assign({ d: "M68 18 A 32 32 0 1 0 68 82 A 24 24 0 1 1 68 18 Z", "fill-rule": "evenodd" }, strokeOf(color)));
    },
    diamond: function (svg, color) {
      add(svg, "polygon", Object.assign({ points: "50,10 90,50 50,90 10,50" }, strokeOf(color)));
    },
    cross: function (svg, color) {
      add(svg, "rect", Object.assign({ x: "38", y: "12", width: "24", height: "76", rx: "4" }, strokeOf(color)));
      add(svg, "rect", Object.assign({ x: "12", y: "38", width: "76", height: "24", rx: "4" }, strokeOf(color)));
    }
  };

  function drawBack(svg) {
    add(svg, "rect", { x: "0", y: "0", width: "100", height: "100", fill: "#fffdf6" });
    for (let y = 12; y <= 90; y += 16) {
      for (let x = 12; x <= 90; x += 16) {
        add(svg, "polygon", {
          points: x + "," + (y - 5) + " " + (x + 5) + "," + y + " " + x + "," + (y + 5) + " " + (x - 5) + "," + y,
          fill: "#ffc857",
          stroke: "#e2a62e",
          "stroke-width": "1"
        });
      }
    }
  }

  function makeRng(seed) {
    let state = seed >>> 0;
    return {
      uint: function () {
        state = (state + 0x6D2B79F5) >>> 0;
        let t = Math.imul(state ^ (state >>> 15), state | 1);
        t = t ^ (t + Math.imul(t ^ (t >>> 7), t | 61));
        return (t ^ (t >>> 14)) >>> 0;
      }
    };
  }
  function rngUint(rng) { return rng.uint(); }
  function rngInt(rng, lo, hi) {
    return lo + (rngUint(rng) % (hi - lo + 1));

      if (eyesEl.hidden || eyesEl.textContent !== "Eyes") fail("family-eyes", "The Eyes chip was hidden or mislabeled.");
      releaseLook();
      if (!eyesEl.hidden) fail("family-eyes", "The Eyes chip stayed up after release.");
    });
    run("family-mute", function () {
      resetInput();
      go("menu");
      const muteText = (muteBtn.innerText || "").replace(/\s+/g, "");
      if (muteText !== "") fail("family-mute", "The mute button had visible text.");
      if ((muteBtn.innerText || "").indexOf("Mute") >= 0 || (muteBtn.innerText || "").indexOf("Sound") >= 0) {
        fail("family-mute", "Mute or Sound was visible.");
      }
      if (muteBtn.querySelectorAll("svg").length !== 2) fail("family-mute", "The mute button did not hold two speaker icons.");
      if (state().muted !== false) fail("family-mute", "Sound did not start on.");
      const box = targetById(centers().targets, "mute");
      tap(box.nx, box.ny);
      if (state().muted !== true) fail("family-mute", "The first tap did not mute.");
      tap(box.nx, box.ny);
      if (state().muted !== false) fail("family-mute", "The second tap did not turn sound on.");
    });
    run("deal-pairs", function () {
      const counts = { tiny: 4, little: 6, shop: 12, rush: 16 };
      let firstOrder = null;
      let differed = false;
      for (let b = 0; b < BAND_IDS.length; b++) {
        const band = BAND_IDS[b];
        for (let d = 0; d < DECK_IDS.length; d++) {
          const deck = DECK_IDS[d];
          const allowed = {};
          for (let f = 0; f < DECKS[deck].length; f++) allowed[DECKS[deck][f].id] = true;
          for (let n = 1; n <= 8; n++) {
            openPlay(band, deck, n);
            const snap = state();
            if (snap.cards.length !== counts[band]) fail("deal-pairs", band + " " + deck + " seed " + n + " dealt " + snap.cards.length + " cards.");
            const tally = {};
            for (let i = 0; i < snap.cards.length; i++) {
              const face = snap.cards[i].face;
              if (!allowed[face]) fail("deal-pairs", band + " " + deck + " seed " + n + " used a face from another deck.");
              if (snap.cards[i].up || snap.cards[i].found) fail("deal-pairs", "A card started face up.");
              tally[face] = (tally[face] || 0) + 1;
            }
            const ids = Object.keys(tally);
            if (ids.length !== BANDS[band].pairs) fail("deal-pairs", band + " " + deck + " seed " + n + " did not draw that many faces.");
            for (let i = 0; i < ids.length; i++) {
              if (tally[ids[i]] !== 2) fail("deal-pairs", band + " " + deck + " seed " + n + " did not pair " + ids[i] + ".");
            }
            if (band === "tiny" || band === "little") {
              const names = boardEl.querySelectorAll(".name");
              for (let i = 0; i < names.length; i++) {
                if (!names[i].hidden || names[i].textContent !== "") fail("deal-pairs", "A young band showed a printed label.");
              }
            }
            if (band === "shop" || band === "rush") {
              const names = boardEl.querySelectorAll(".name");
              if (names.length !== snap.cards.length) fail("deal-pairs", "An older band missed a label.");
              for (let i = 0; i < names.length; i++) {
                const face = faceById(snap.cards[i].face);
                if (names[i].hidden || names[i].textContent !== face.label) fail("deal-pairs", "A label did not sit under its picture.");
              }
            }
            if (band === "tiny" && deck === "animals") {
              const order = snap.cards.map(function (card) { return card.face; }).join(",");
              if (firstOrder === null) firstOrder = order;
              else if (order !== firstOrder) differed = true;
            }
          }
        }
      }
      if (!differed) fail("deal-pairs", "Seeds 1 to 8 dealt the same tiny animals order.");
    });
    run("first-flip", function () {
      openPlay("little", "food", 3);
      step(50000);
      const box = cardTarget(0);
      look(box.nx, box.ny);
      step(50000);
      step(50640);
      if (state().cards[0].up) fail("first-flip", "A 640 ms look turned the card over.");
      if (state().banner !== "Find a pair.") fail("first-flip", "The banner changed before the flip.");
      step(50660);
      const snap = state();
      if (!snap.cards[0].up) fail("first-flip", "A 660 ms look did not turn the card over.");
      for (let i = 1; i < snap.cards.length; i++) if (snap.cards[i].up) fail("first-flip", "Another card turned over.");
      if (snap.banner !== "Look at another card.") fail("first-flip", "The banner did not ask for another card.");
    });
    run("pair-stays", function () {
      openPlay("tiny", "shapes", 4);
      step(60000);
      const seen = {};
      let pair = null;
      const snap = state().cards;
      for (let i = 0; i < snap.length; i++) {
        if (seen[snap[i].face] === undefined) seen[snap[i].face] = i;
        else pair = [seen[snap[i].face], i];
      }
      const a = cardTarget(pair[0]);
      const b = cardTarget(pair[1]);
      tap(a.nx, a.ny);
      tap(b.nx, b.ny);
      const after = state();
      if (!after.cards[pair[0]].up || !after.cards[pair[1]].up) fail("pair-stays", "The pair did not stay face up.");
      if (!after.cards[pair[0]].found || !after.cards[pair[1]].found) fail("pair-stays", "The pair was not marked found.");
      if (after.banner !== "A pair!") fail("pair-stays", "The banner did not say a pair.");
      const btn = document.getElementById("card-" + pair[0]);
      if (btn.getAttribute("data-play") === "true" || btn.getAttribute("aria-disabled") !== "true") {
        fail("pair-stays", "A found card stayed a play target.");
      }
      if (btn.querySelector(".check").hidden) fail("pair-stays", "The pair had no check.");
    });
    run("mismatch-returns", function () {
      for (let b = 0; b < BAND_IDS.length; b++) {
        const band = BAND_IDS[b];
        const pause = BANDS[band].pause;
        openPlay(band, "animals", 2);
        const t0 = 70000 + b * 10000;
        step(t0);
        const cardsNow = state().cards;
        let first = -1;
        let second = -1;
        let third = -1;
        for (let i = 0; i < cardsNow.length; i++) {
          if (first < 0) first = i;
          else if (second < 0 && cardsNow[i].face !== cardsNow[first].face) second = i;
          else if (third < 0 && i !== first && i !== second) third = i;
        }
        tap(cardTarget(first).nx, cardTarget(first).ny);
        tap(cardTarget(second).nx, cardTarget(second).ny);
        if (!state().cards[first].up || !state().cards[second].up) fail("mismatch-returns", band + " did not leave the two cards up.");
        const other = cardTarget(third);
        look(other.nx, other.ny);
        step(t0);
        step(t0 + 660);
        if (dwell() !== 0) fail("mismatch-returns", band + " filled the ring during the pause.");
        if (state().cards[third].up) fail("mismatch-returns", band + " accepted a look during the pause.");
        step(t0 + pause - 1);
        if (!state().cards[first].up || !state().cards[second].up) fail("mismatch-returns", band + " turned back before the pause.");
        step(t0 + pause);
        const done = state();
        if (done.cards[first].up || done.cards[second].up) fail("mismatch-returns", band + " did not turn the cards back after " + pause + " ms.");
        if (done.cards[third].up) fail("mismatch-returns", band + " turned a third card.");
        if (done.banner.indexOf("wrong") >= 0 || done.banner === "No") fail("mismatch-returns", "The banner scolded.");
        const live = document.getElementById("card-" + third);
        if (live.getAttribute("data-play") !== "true") fail("mismatch-returns", band + " left a face-down card inert after the pause.");
      }
    });
    run("face-up-inert", function () {
      openPlay("shop", "food", 5);
      step(120000);
      tap(cardTarget(0).nx, cardTarget(0).ny);
      const box = cardTarget(0);
      look(box.nx, box.ny);
      step(120000);
      step(120660);
      if (dwell() !== 0) fail("face-up-inert", "The ring filled on a face-up card.");
      const snap = state();
      if (!snap.cards[0].up || snap.cards[0].found) fail("face-up-inert", "The face-up card changed.");
      for (let i = 1; i < snap.cards.length; i++) if (snap.cards[i].up) fail("face-up-inert", "A look on a face-up card turned another card.");
    });
    run("finish-rest", function () {
      for (let b = 0; b < BAND_IDS.length; b++) {
        const band = BAND_IDS[b];
        openPlay(band, "shapes", 6);
        const t0 = 130000 + b * 20000;
        step(t0);
        let guard = 0;
        while (state().screen === "play" && guard < 20) {
          const nowCards = state().cards;
          const seen = {};
          let pair = null;
          for (let i = 0; i < nowCards.length; i++) {
            if (nowCards[i].found || nowCards[i].up) continue;
            if (seen[nowCards[i].face] === undefined) seen[nowCards[i].face] = i;
            else { pair = [seen[nowCards[i].face], i]; break; }
          }
          if (!pair) break;
          const a = cardTarget(pair[0]);
          const b2 = cardTarget(pair[1]);
          tap(a.nx, a.ny);
          tap(b2.nx, b2.ny);
          guard += 1;
        }
        if (guard !== BANDS[band].pairs) fail("finish-rest", band + " did not clear every pair.");
        step(t0 + 899);
        if (state().screen !== "play") fail("finish-rest", band + " left play before 900 ms.");
        step(t0 + 900);
        const snap = state();
        if (snap.screen !== "rest") fail("finish-rest", band + " did not rest after 900 ms.");
        if (snap.banner !== "You found them all.") fail("finish-rest", "The rest banner was not the calm sentence.");
        if (restLine.textContent !== "You found them all.") fail("finish-rest", "The rest line changed.");
        if (/grade|score|wrong|lives|rank/i.test(restLine.textContent)) fail("finish-rest", "The rest card showed a grade.");
        const again = targetById(centers().targets, "another");
        if (!again || again.play) fail("finish-rest", "Another was missing or marked as play.");
        const held = snap.level;
        tap(again.nx, again.ny);
        if (state().screen !== "deck" || state().level !== held) fail("finish-rest", "Another did not replay the same band.");
      }
    });
    run("sizes", function () {
      const expectCols = {
        tiny: { p: 2, l: 2, size390: 168 },
        little: { p: 2, l: 3, size390: 168 },
        shop: { p: 3, l: 4, size390: 114 },
        rush: { p: 4, l: 4, size390: 83 }
      };
      for (let b = 0; b < BAND_IDS.length; b++) {
        const band = BAND_IDS[b];
        openPlay(band, "animals", 1);
        const views = [[390, 700], [1024, 768]];
        for (let v = 0; v < views.length; v++) {
          const w = views[v][0];
          const h = views[v][1];
          const lay = targetsAt(w, h);
          if (!lay.ok) fail("sizes", band + " at " + w + " by " + h + " was not ok.");
          const cardsLay = (lay.targets || []).filter(function (t) { return String(t.id).indexOf("card-") === 0; });
          if (cardsLay.length !== BANDS[band].pairs * 2) fail("sizes", band + " did not report every card.");
          let cols = 0;
          for (let i = 0; i < cardsLay.length; i++) {
            const box = cardsLay[i];
            if (Math.min(box.w, box.h) < 72) fail("sizes", band + " card " + box.id + " was under 72 at " + w + ".");
            if (box.w !== box.h) fail("sizes", band + " card was not square.");
            if (box.w > 168) fail("sizes", band + " card grew past 168.");
            if (box.x < 16 || box.y < 88 || box.x + box.w > w - 15 || box.y + box.h > h - 15) {
              fail("sizes", band + " card " + box.id + " left the board inset.");
            }
            if (Math.abs(box.y - cardsLay[0].y) < 1) cols += 1;
          }
          const want = h >= w ? expectCols[band].p : expectCols[band].l;
          if (cols !== want) fail("sizes", band + " at " + w + " by " + h + " used " + cols + " columns.");
          if (w === 390 && expectCols[band].size390 && cardsLay[0] && cardsLay[0].w !== expectCols[band].size390) {
            fail("sizes", band + " at 390 was " + (cardsLay[0] ? cardsLay[0].w : 0) + " px, not " + expectCols[band].size390 + ".");
          }
          if (w === 1024 && (band === "tiny" || band === "little") && cardsLay[0] && cardsLay[0].w !== 168) {
            fail("sizes", band + " at 1024 was not capped at 168.");
          }
        }
      }
    });
    run("family-plain-state", function () {
      const before = JSON.stringify(state());
      start("nope");
      go("sideways");
      if (JSON.stringify(state()) !== before) fail("family-plain-state", "An unknown band or screen changed the state.");
      const end = state();
      if (!("level" in end) || !("screen" in end) || !("banner" in end) || !("muted" in end)) {
        fail("family-plain-state", "level, screen, banner, or muted was missing.");
      }
    });
    try {
      assertJunk("at the end");
    } catch (err) {
      fail("family-query-inert", err && err.message ? err.message : "The junk check threw.");
    }
    try {
      if (speakCalls !== 0) fail("family-plain-state", "speechSynthesis.speak was called.");
      if (writes !== 0) fail("family-no-storage", "The page called setItem or removeItem.");
      if (storeLen !== null && localStorage.length !== storeLen) fail("family-no-storage", "localStorage gained a key.");
      if (storeLen !== null && localStorage.getItem("pop-pals-v1") !== pop) fail("family-no-storage", "pop-pals-v1 changed.");
    } catch (err) {
      fail("family-no-storage", "Storage could not be read.");
    }
    try {
      if (origSet) localStorage.setItem = origSet;
      if (origRem) localStorage.removeItem = origRem;
      if (origSpeak && window.speechSynthesis) window.speechSynthesis.speak = origSpeak;
    } catch (err) {}
    return { ok: failures.length === 0, failures: failures };
  }

  window.memoryMatch = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    state: state,
    eyes: eyes,
    dwell: dwell,
    targetsAt: targetsAt,
    centers: centers,
    seed: seed,
    selfCheck: selfCheck
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let result;
    try { result = selfCheck(); }
    catch (err) {
      result = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] };
    }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("rush")) start("rush");
    else if (params.has("play")) start("tiny");
    connectGaze();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
