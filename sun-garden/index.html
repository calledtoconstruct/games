<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8ec6ef">
<title>Sun Garden</title>
<style>
  :root {
    color-scheme: light;
    --ink: #243024;
    --paper: #c9e7f8;
    --card: rgba(255, 250, 240, 0.96);
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border: none; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(255, 250, 240, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(255, 250, 240, 0.95);
  }
  #gaze.holding { box-shadow: 0 0 0 3px #fffaf0, inset 0 0 0 12px #3aaa6a; }
  #gaze[hidden], #eyes[hidden], .panel[hidden], #back[hidden], #card[hidden], #tray[hidden] { display: none !important; }
  #eyes, #status {
    position: fixed; z-index: 46;
    background: var(--card); border-radius: 999px; font-weight: 800;
  }
  #eyes { top: calc(18px + env(safe-area-inset-top)); left: 172px; padding: 7px 12px; font-size: 16px; }
  #status {
    top: calc(18px + env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    padding: 8px 14px; font-size: 18px; max-width: min(420px, 46vw); text-align: center;
  }
  .panel {
    position: fixed; z-index: 50; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(480px, calc(100% - 24px));
    max-height: calc(100dvh - 16px); overflow: auto;
    background: var(--card); border-radius: 28px;
    padding: 22px 16px 16px;
    box-shadow: 0 18px 50px rgba(20, 40, 20, 0.28);
  }
  h1 { font-size: 52px; line-height: 0.9; margin: 6px 0 8px; text-align: center; letter-spacing: -1px; }
  .tag, .ages { text-align: center; margin: 0 0 8px; }
  .ages { color: #4d624d; font-size: 15px; }
  .tag { font-size: 18px; }
  .stack { display: flex; gap: 10px; }
  .big, .mid {
    flex: 1; border: none; border-radius: 18px; min-height: 76px;
    font-size: 28px; font-weight: 800; color: var(--ink);
  }
  .big { background: var(--sun); box-shadow: 0 5px 0 var(--sun-d); }
  .mid { background: #b7e4c7; box-shadow: 0 5px 0 #6eae80; }
  .big:active, .mid:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  .big:disabled, .mid:disabled { opacity: 0.45; }
  #mute, #full, #back, #tray > button {
    position: fixed; z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1;
  }
  #mute, #full, #back { top: calc(10px + env(safe-area-inset-top)); width: 72px; height: 72px; font-size: 15px; }
  #mute { left: 10px; display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; }
  #mute svg[hidden] { display: none !important; }
  #full { left: 90px; }
  #back { right: 10px; }
  #tray > button {
    bottom: calc(16px + env(safe-area-inset-bottom));
    width: 92px; height: 92px; font-size: 18px;
  }
  #tray > button[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 3px; }
  #tool-water { left: 16px; background: #7ec8e3; }
  #tool-sun { left: 50%; margin-left: -46px; background: var(--sun); }
  #tool-shade { right: 16px; background: #6b8f71; color: #fffaf0; }
  #card {
    position: fixed; z-index: 40; top: calc(78px + env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px;
    max-width: min(640px, calc(100% - 24px));
    background: var(--card); border-radius: 18px; padding: 8px 14px;
    font-weight: 800;
  }
  #swatches { display: flex; gap: 6px; flex: none; }
  #card .swatch { width: 28px; height: 28px; border-radius: 50%; flex: none; }
  #ask { line-height: 1.25; }
  #mood { flex-basis: 100%; font-size: 15px; color: #3d4a32; }
  #face {
    width: 40px; height: 40px; border-radius: 50%; flex: none; position: relative;
    background: #ffd7a1; box-shadow: inset 0 -3px 0 rgba(90, 50, 20, 0.12);
  }
  #face i {
    position: absolute; top: 13px; width: 5px; height: 5px;
    border-radius: 50%; background: #3d3428;
  }
  #face i.l { left: 10px; }
  #face i.r { right: 10px; }
  #face b {
    position: absolute; left: 11px; top: 22px; width: 18px; height: 8px;
    border: 3px solid #3d3428; border-top: 0; border-radius: 0 0 12px 12px;
    background: transparent; box-sizing: border-box;
  }
  #face.happy { background: #ffe08a; }
  #face.happy b { height: 11px; top: 20px; }
  #face.content b { height: 6px; }
  #face.unsure b {
    height: 0; top: 26px; border: 0; border-bottom: 3px solid #3d3428; border-radius: 0;
  }
  #face.tired { background: #f0c4a0; }
  #face.tired b {
    top: 24px; height: 8px; border-radius: 12px 12px 0 0;
    border: 3px solid #3d3428; border-bottom: 0;
  }
  #live {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%);
  }
  .levels { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .choice {
    text-align: left; border-radius: 16px; border: 3px solid transparent;
    background: #fff; padding: 8px 12px; color: var(--ink);
  }
  .choice b { display: block; font-size: 18px; }
  .choice small { display: block; margin-top: 2px; color: #4d624d; font-size: 13px; }
  .choice[aria-pressed="true"] { border-color: #e2a62e; background: #fff6df; }
  @media (max-width: 700px) {
    h1 { font-size: 40px; }
    #status { left: 168px; right: 90px; transform: none; font-size: 14px; max-width: none; }
    #tray > button { width: 76px; height: 76px; font-size: 16px; }
    #tool-sun { margin-left: -38px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .big, .mid, .choice { transition: none; }
  }
</style>
</head>
<body>
<canvas id="view" aria-hidden="true"></canvas>
<button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/>
  </svg>
</button>
<button id="full" type="button" aria-label="Fullscreen">Full</button>
<button id="back" type="button" hidden aria-label="Back to the start screen">Back</button>
<div id="eyes" hidden>Eyes</div>
<div id="status" hidden></div>
<div id="card" hidden><span id="face" class="content" aria-hidden="true"><i class="l"></i><i class="r"></i><b></b></span><span id="swatches"></span><span id="ask"></span><span id="mood">The town is content.</span></div>
<div id="tray" hidden>
  <button id="tool-water" type="button" aria-pressed="true">Water</button>
  <button id="tool-sun" type="button" aria-pressed="false" hidden>Sun</button>
  <button id="tool-shade" type="button" aria-pressed="false" hidden>Shade</button>
</div>
<div id="gaze" hidden></div>
<p id="live" aria-live="polite"></p>
<div class="panel" id="screen-start">
  <p class="tag" id="tag">A garden for a sunny day</p>
  <h1>Sun Garden</h1>
  <p class="ages">Ages 2 and up. Tap, drag, or look.</p>
  <div class="stack">
    <button id="flowers" class="big" type="button">Flowers</button>
    <button id="market" class="mid" type="button">Market</button>
  </div>
  <div class="levels" id="level-choices">
    <button class="choice" type="button" data-level="tiny" aria-pressed="true"><b>Tiny Tots</b><small>Ages 2 to 3. Two big flowers. Water them while the sun moves.</small></button>
    <button class="choice" type="button" data-level="little" aria-pressed="false"><b>Little Pals</b><small>Ages 4 to 5. A flower garden, or a small food market. Move the sun.</small></button>
    <button class="choice" type="button" data-level="shop" aria-pressed="false"><b>Shopkeeper</b><small>Ages 6 to 8. Flowers, or food with trees. Shade lasts half a day.</small></button>
    <button class="choice" type="button" data-level="rush" aria-pressed="false"><b>Rush</b><small>Ages 9 and up. The sun's trip is the clock. The town may ask for two foods, or more when they all grow quickly.</small></button>
  </div>
</div>
<script>
(function () {
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const GARDENS = {
    tiny: {
      flowers: [
        { kind: "sunflower", name: "Sunflower", likes: "sun", bed: 0, x: 0.34, hue: "#f2c14e" },
        { kind: "daisy", name: "Daisy", likes: "sun", bed: 0, x: 0.68, hue: "#fff6ea" }
      ]
    },
    little: {
      flowers: [
        { kind: "sunflower", name: "Sunflower", likes: "sun", bed: 0, x: 0.24, hue: "#f2c14e" },
        { kind: "daisy", name: "Daisy", likes: "sun", bed: 0, x: 0.78, hue: "#fff6ea" },
        { kind: "rose", name: "Rose", likes: "sun", bed: 0, x: 0.5, hue: "#d6457a" },
        { kind: "violet", name: "Violet", likes: "shade", bed: 0, x: 0.08, hue: "#7a4ea3" },
        { kind: "fern", name: "Fern", likes: "shade", bed: 0, x: 0.62, hue: "#2f8a3e" }
      ],
      market: [
        { kind: "wheat", name: "Wheat", likes: "sun", bed: 0, x: 0.14, hue: "#e2b84a" },
        { kind: "tomato", name: "Tomato", likes: "sun", bed: 0, x: 0.42, hue: "#e23b3b" },
        { kind: "carrot", name: "Carrot", likes: "sun", bed: 0, x: 0.68, hue: "#e07a2f" },
        { kind: "lettuce", name: "Lettuce", likes: "shade", bed: 0, x: 0.88, hue: "#7dcea0" }
      ]
    },
    shop: {
      flowers: [
        { kind: "sunflower", name: "Sunflower", likes: "sun", bed: 0, x: 0.16, hue: "#f2c14e" },
        { kind: "rose", name: "Rose", likes: "sun", bed: 0, x: 0.38, hue: "#d6457a" },
        { kind: "fern", name: "Fern", likes: "shade", bed: 1, x: 0.64, hue: "#2f8a3e" },
        { kind: "daisy", name: "Daisy", likes: "sun", bed: 1, x: 0.86, hue: "#fff6ea" },
        { kind: "violet", name: "Violet", likes: "shade", bed: 1, x: 0.5, hue: "#7a4ea3" }
      ],
      market: [
        { kind: "coconut", name: "Coconut", likes: "sun", bed: 0, x: 0.08, hue: "#8d6a45" },
        { kind: "banana", name: "Banana", likes: "sun", bed: 0, x: 0.28, hue: "#efe07a" },
        { kind: "wheat", name: "Wheat", likes: "sun", bed: 0, x: 0.48, hue: "#e2b84a" },
        { kind: "tomato", name: "Tomato", likes: "sun", bed: 1, x: 0.68, hue: "#e23b3b" },
        { kind: "lettuce", name: "Lettuce", likes: "shade", bed: 1, x: 0.84, hue: "#7dcea0" },
        { kind: "carrot", name: "Carrot", likes: "sun", bed: 1, x: 0.94, hue: "#e07a2f" },
        { kind: "potato", name: "Potato", likes: "sun", bed: 0, x: 0.58, hue: "#c4a574" }
      ]
    }
  };
  GARDENS.rush = GARDENS.shop;

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d");
  const gazeEl = document.getElementById("gaze");
  const eyesEl = document.getElementById("eyes");
  const statusEl = document.getElementById("status");
  const cardEl = document.getElementById("card");
  const askEl = document.getElementById("ask");
  const moodEl = document.getElementById("mood");
  const faceEl = document.getElementById("face");
  const swatchesEl = document.getElementById("swatches");
  const liveEl = document.getElementById("live");
  const screen = document.getElementById("screen-start");
  const tray = document.getElementById("tray");
  const tag = document.getElementById("tag");
  const flowersBtn = document.getElementById("flowers");
  const marketBtn = document.getElementById("market");
  const backBtn = document.getElementById("back");
  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const waterBtn = document.getElementById("tool-water");
  const sunBtn = document.getElementById("tool-sun");
  const shadeBtn = document.getElementById("tool-shade");

  let levelId = "tiny";
  let mode = "flowers";
  let playing = false;
  let tool = "water";
  let plants = [];
  let requests = [];
  let requestIndex = 0;
  let cardSig = "";
  let townMood = 0.52;
  let fatigue = {};
  let sunU = 0.15;
  let sunParked = false;
  let cart = null;
  let sunsets = 0;
  let bloomed = false;
  let watering = -1;
  let aimX = 0;
  let aimY = 0;
  let sprays = [];
  let lastSquirt = 0;
  let sunDrag = false;
  let shadeArm = -1;
  let pointerActive = false;
  let capId = null;
  let clock = 0;
  let checking = false;
  let suppressReconnect = false;
  let ac = null;
  let master = null;
  let mute = false;
  let said = "";

  let gazeSock = null;
  let gazeBuf = new Uint8Array(0);
  let gazeTimer = 0;
  let gazePoint = null;
  let gazeAt = 0;
  let gazeHold = null;
  let gazeWarp = null;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;
  let leaveAt = 0;
  let latch = null;

  function spec() {
    return {
      sunTool: levelId !== "tiny",
      shadeTool: levelId === "shop" || levelId === "rush",
      sunSeconds: levelId === "rush" ? 16 : levelId === "tiny" ? 48 : 36
    };
  }
  const KINDS = {
    sunflower: { n: 3, days: 2.6, sky: 0.86, spread: 0.16, sip: 0.032, shade: 0.016, wilt: 0.55 },
    daisy: { n: 5, days: 2.2, sky: 0.46, spread: 0.14, sip: 0.022, shade: 0.012, wilt: 0.58 },
    rose: { n: 3, days: 2.8, sky: 0.58, spread: 0.13, sip: 0.024, shade: 0.013, wilt: 0.55 },
    violet: { n: 6, days: 2.3, sky: 0.15, spread: 0.14, sip: 0.020, shade: 0.007, wilt: 0.68 },
    fern: { n: 3, days: 3.0, sky: 0.52, spread: 0.15, sip: 0.026, shade: 0.008, wilt: 0.72 },
    tomato: { n: 3, days: 3.4, sky: 0.18, spread: 0.16, scorch: 0.9, habit: "vine", sip: 0.035, shade: 0.017, wilt: 0.60 },
    lettuce: { n: 3, days: 2.0, sky: 0.22, spread: 0.13, sip: 0.030, shade: 0.014, wilt: 0.70 },
    wheat: { n: 7, days: 2.7, sky: 0.62, spread: 0.14, sip: 0.023, shade: 0.013, wilt: 0.45 },
    carrot: { n: 5, days: 2.5, sky: 0.32, spread: 0.1, scorch: 0.9, sip: 0.032, shade: 0.016, wilt: 0.65 },
    potato: { n: 3, days: 3.0, sky: 0.34, spread: 0.13, scorch: 0.84, sip: 0.035, shade: 0.017, wilt: 0.65 },
    banana: { n: 1, days: 4.5, sky: 0.74, spread: 0.02, sip: 0.042, shade: 0.018, wilt: 0.65 },
    coconut: { n: 1, days: 5.5, sky: 0.94, spread: 0.02, sip: 0.028, shade: 0.015, wilt: 0.50 }
  };
  function unitRand(n) {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function seedStems(p) {
    const kind = KINDS[p.kind] || KINDS.daisy;
    const n = kind.n;
    p.stems = [];
    for (let i = 0; i < n; i++) {
      const slot = n === 1 ? 0 : (i / (n - 1)) * 2 - 1;
      p.stems.push({
        slot,
        age: 0.17 + unitRand(p.i * 20 + i + 3) * 0.08,
        vigor: 0.84 + unitRand(p.i * 20 + i + 9) * 0.32,
        thirst: 0.5 + unitRand(p.i + i * 4 + 2) * 0.8,
        water: 0.35,
        heading: (unitRand(i * 13 + p.i + 5) - 0.5) * 0.55,
        lean: (unitRand(i + p.i + 8) - 0.5) * 0.25,
        sunPull: 0.55 + unitRand(i + 40 + p.i) * 0.9,
        ripeShift: (unitRand(i * 3 + 70 + p.i) - 0.4) * 0.18,
        mirror: unitRand(p.i * 9 + i + 17) < 0.5 ? -1 : 1,
        stress: 0
      });
    }
    p.growth = p.stems.reduce((sum, stem) => sum + stem.age, 0) / n;
  }
  function gardenRows() {
    const book = GARDENS[levelId];
    if (mode === "market" && levelId !== "tiny" && book.market) return book.market;
    return book.flowers;
  }
  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const swap = list[i];
      list[i] = list[j];
      list[j] = swap;
    }
    return list;
  }
  function freshPlants() {
    const rows = gardenRows();
    const kinds = rows.map((row) => ({
      kind: row.kind, name: row.name, likes: row.likes, hue: row.hue
    }));
    if (!checking) shuffle(kinds);
    return rows.map((row, i) => {
      const pick = kinds[i];
      const plant = {
        i, kind: pick.kind, name: pick.name, likes: pick.likes, bed: row.bed, x: row.x,
        hue: pick.hue, growth: 0.22, water: 0.35, cloth: false, shade: 0
      };
      seedStems(plant);
      armTree(plant);
      return plant;
    });
  }
  function armTree(p) {
    p.bear = (p.kind === "banana" || p.kind === "coconut") ? 2 + (Math.random() < 0.5 ? 0 : 1) : 0;
  }
  function harvestsFruit(p) {
    if (p.kind !== "banana" && p.kind !== "coconut") return false;
    return (p.bear || 2) > 1;
  }
  function pickFruit(p) {
    p.growth = 0.66;
    (p.stems || []).forEach((stem) => { stem.age = 0.66; });
    p.bear = Math.max(1, (p.bear || 2) - 1);
  }
  function replant(p) {
    const rows = gardenRows();
    const others = new Set(plants.filter((q) => q.i !== p.i).map((q) => q.kind));
    let choices = rows.filter((row) => row.kind !== p.kind && !others.has(row.kind));
    if (!choices.length) choices = rows.filter((row) => row.kind !== p.kind);
    if (!choices.length) choices = rows;
    const row = choices[Math.floor(Math.random() * choices.length)];
    p.kind = row.kind;
    p.name = row.name;
    p.likes = row.likes;
    p.hue = row.hue;
    p.growth = 0.22;
    p.water = Math.max(p.water, 0.35);
    p.cloth = false;
    p.shade = 0;
    seedStems(p);
    armTree(p);
    return p.name;
  }
  function buildRequests() {
    const order = (levelId === "shop" || levelId === "rush")
      ? [plants[0], plants[2], plants[1], plants[3]]
      : plants.slice();
    plants.forEach((p) => { if (order.indexOf(p) < 0) order.push(p); });
    const kinds = order.filter(Boolean).map((p) => p.kind);
    if (!checking) shuffle(kinds);
    return kinds;
  }
  function plotForKind(kind, claimed) {
    let best = null;
    plants.forEach((p) => {
      if (p.kind !== kind || claimed.has(p.i)) return;
      if (!best || p.growth > best.growth) best = p;
    });
    return best;
  }
  function repairRequests() {
    if (mode !== "market" || !plants.length) return;
    const have = [];
    const seen = new Set();
    plants.forEach((p) => {
      if (seen.has(p.kind)) return;
      seen.add(p.kind);
      have.push(p.kind);
    });
    const current = requests.length ? requests[((requestIndex % requests.length) + requests.length) % requests.length] : have[0];
    const kept = [];
    const keptSet = new Set();
    requests.forEach((kind) => {
      if (!seen.has(kind) || keptSet.has(kind)) return;
      kept.push(kind);
      keptSet.add(kind);
    });
    have.forEach((kind) => {
      if (!keptSet.has(kind)) kept.push(kind);
    });
    requests = kept.length ? kept : have.slice();
    const at = requests.indexOf(current);
    requestIndex = at >= 0 ? at : 0;
  }
  function wishSpan(daysList, rush) {
    const base = rush ? 2 : 1;
    const cap = 4;
    const fast = (d) => d <= 3;
    const chosen = [];
    for (let i = 0; i < daysList.length && chosen.length < cap; i++) {
      const days = daysList[i];
      if (chosen.length >= base && (!rush || !chosen.every(fast) || !fast(days))) break;
      chosen.push(days);
    }
    return chosen.length;
  }
  function wantedPlots() {
    if (mode !== "market") return [];
    repairRequests();
    if (!requests.length) return [];
    const claimed = new Set();
    const candidates = [];
    for (let n = 0; n < requests.length; n++) {
      const p = plotForKind(requests[(requestIndex + n) % requests.length], claimed);
      if (!p) continue;
      claimed.add(p.i);
      candidates.push(p);
    }

  function render() {

    canvas.height = Math.round(L.h * dpr);

      const pos = plantXY(p);
      drawMound(pos.x, pos.y + 6, moundWidth(p), wantIds.has(p.i));
    });

    const focus = waterFocus();
    if (focus >= 0 && plants[focus]) drawGrowth(plants[focus]);

    drawCan();
    drawCart(L);
    const orb = arcPoint(sunU);
    ctx.fillStyle = "#ffd45a";
    ctx.beginPath();
    ctx.arc(orb.x, orb.y, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#e2a62e";
    ctx.lineWidth = 4;
    ctx.stroke();

  function boxOf(el) {

  }

  function gazeTarget() {
    if (!gazePoint) return null;
    const buttons = playing
      ? [[backBtn, showStart, "back"], [waterBtn, () => selectTool("water"), "water"], [sunBtn, () => selectTool("sun"), "sun"], [shadeBtn, () => selectTool("shade"), "shade"], [muteBtn, toggleMute, "mute"], [fullBtn, toggleFull, "full"]]
      : [[flowersBtn, () => start("flowers"), "flowers"], [marketBtn, () => start("market"), "market"]]
        .concat(Array.from(document.querySelectorAll("[data-level]")).map((btn) => [btn, () => selectLevel(btn.dataset.level), "level-" + btn.dataset.level]));
    for (const row of buttons) {
      if (hitButton(row[0])) return { key: row[2], ms: MENU_DWELL_MS, fire: row[1] };
    }
    if (!playing) return null;
    if (sunHit(gazePoint.x, gazePoint.y)) {
      return { key: "sun", ms: PLAY_DWELL_MS, fire: () => { latch = { kind: "sun" }; sunParked = true; } };
    }
    const hit = plantAt(gazePoint.x, gazePoint.y);

  function hitButton(el) {

  function stepGaze(now) {

    const live = gazePoint && gazeAt && now - gazeAt <= GAZE_FRESH_MS;
    if (!live) {

      dwellKey = null;
      dwellFired = false;
      dwellProgress = 0;
      if (latch && gazeAt && now - gazeAt >= GAZE_FRESH_MS) releaseLatch();

    gazeEl.hidden = false;
    gazeEl.style.left = gazePoint.x + "px";
    gazeEl.style.top = gazePoint.y + "px";
    if (pointerActive) {

      dwellFired = false;
      dwellProgress = 0;

    if (latch && latch.kind === "sun") {

      sunU = sunFromX(gazePoint.x);

    }
    if (latch && latch.kind === "water") {

    gazeEl.classList.remove("holding");

  function step(now) {

  function scheduleGaze() {

  function connectGaze() {

  function toggleMute() {

  }

  function selfCheck() {
    const failures = [];
    checking = true;
    suppressReconnect = true;
    if (gazeTimer) { clearTimeout(gazeTimer); gazeTimer = 0; }
    if (gazeSock) {
      const sock = gazeSock;
      gazeSock = null;
      sock.onopen = null;
      sock.onclose = null;
      sock.onmessage = null;
      try { sock.close(); } catch (e) { /* already closing */ }
    }
    function fail(name, detail) { failures.push(name + ": " + detail); }
    try {
      if (window.innerWidth < 320 || window.innerHeight < 320) {
        fail("size", window.innerWidth + "x" + window.innerHeight);
        return { ok: false, failures };
      }
      selectLevel("tiny");
      start("market");
      let s = state();
      if (s.mode !== "flowers" || s.plants.length !== 2) fail("tiny", "market became " + s.mode + " with " + s.plants.length + " plants");
      if (!cardEl.hidden) fail("tiny", "town card showed in flowers");

      selectLevel("little");
      start("flowers");
      placeSun(0.24);
      hold(centers().plants[0].nx, centers().plants[0].ny);
      let t = 5000;
      for (let i = 0; i < 20; i++) { t += 100; step(t); }
      release();
      s = state();
      if (!(s.plants[0].water > 0.7)) fail("water", "sunflower water " + s.plants[0].water);
      const before = s.plants[0].growth;
      const tomatoBefore = s.plants[1].growth;
      hold(centers().plants[0].nx, centers().plants[0].ny);
      for (let i = 0; i < 45; i++) {
        plants[1].water = 1;
        t += 1000;
        step(t);
      }
      release();
      s = state();
      if (!(s.plants[0].growth > before + 0.18)) fail("grow", "sunflower " + before + " to " + s.plants[0].growth);
      if (!(s.plants[0].growth - before > s.plants[1].growth - tomatoBefore + 0.08)) fail("sun", "neighbor grew " + (s.plants[1].growth - tomatoBefore) + " and sunflower grew " + (s.plants[0].growth - before));

      start("flowers");
      selectTool("water");
      const c = centers().plants[1];
      look(c.nx, c.ny);
      t = 8000;
      step(t);
      step(t + 640);
      s = state();
      if (s.latch) fail("dwell", "latched before 650ms");
      step(t + 660);
      s = state();
      if (s.latch !== "water") fail("dwell", "latch " + s.latch);
      step(t + 1200);
      s = state();
      if (!(s.plants[1].water > 0.35)) fail("dwell-water", "water " + s.plants[1].water);
      releaseLook();
      step(t + 1600);
      s = state();
      if (s.latch) fail("away", "latch still " + s.latch);

      start("market");
      plants[0].growth = 1;
      plants[0].water = 1;
      plants[1].growth = 0.55;
      t = 20000;
      step(t);
      s = state();
      if (!s.cart) fail("cart", "no cart for a ready sunflower");
      step(t + 1100);
      step(t + 1700);
      s = state();
      if (s.plants[0].growth >= 1) fail("cart", "sunflower stayed ripe " + s.plants[0].growth);
      if (s.plants[1].growth < 0.45) fail("cart", "unready tomato was taken, growth " + s.plants[1].growth);
      if (!s.request || s.request.kind !== "tomato") fail("next", "request is " + (s.request && s.request.kind));
      if (!requestPlant() || requestPlant().i !== s.request.i) fail("next", "town wants a missing plant");
      if (plants[0].kind === "wheat") fail("replant", "harvested plot stayed wheat");
      if (s.face !== "content" || !(s.mood > 0.6 && s.mood < 0.78)) fail("mood", s.face + " " + s.mood);
      if (moodEl.textContent.indexOf("content") < 0) fail("mood", moodEl.textContent);
      if (s.wants.length !== 1 || s.wants[0].kind !== "tomato") fail("wants", "little " + s.wants.map((w) => w.kind).join(","));
      plants[1].growth = 1;
      for (let i = 0; i < 8; i++) { t = 21700 + (i + 1) * 1000; step(t); }
      s = state();
      if (s.face !== "happy" || s.mood < 0.78) fail("mood", "two gifts " + s.face + " " + s.mood);
      if (moodEl.textContent.indexOf("happy") < 0) fail("mood", moodEl.textContent);
      if (!s.request || s.request.kind !== "carrot") fail("next", "after two gifts " + (s.request && s.request.kind));
      if (plants[1].growth >= 1) fail("cart", "second gift stayed " + plants[1].growth);

      start("market");
      plants[0].kind = "tomato";
      plants[0].name = "Tomato";
      plants[0].hue = "#e23b3b";
      plants[0].likes = "sun";
      plants[0].growth = 0.4;
      plants[2].growth = 1;
      repairRequests();
      if (wantedPlots().some((p) => p.kind === "wheat" || !plants.some((q) => q.i === p.i && q.kind === p.kind))) fail("missing", "want is not growing");
      t = 40000;
      step(t);
      step(t + 1100);
      step(t + 1700);
      s = state();
      if (plants[2].kind === "carrot" && plants[2].growth >= 1) fail("extra", "ripe carrot stayed");
      if (!s.request || !plants.some((p) => p.i === s.request.i && p.kind === s.request.kind)) fail("missing", "request " + (s.request && s.request.kind));
      if (s.request.kind === "wheat" || askEl.textContent.indexOf("Wheat") >= 0) fail("missing", askEl.textContent);

      start("flowers");
      selectLevel("shop");
      start("flowers");
      selectTool("shade");
      placeSun(0.64);
      const fern = centers().plants[2];
      tap(fern.nx, fern.ny);
      s = state();
      if (!s.plants[2].cloth || !s.plants[2].happy) fail("shade", JSON.stringify(s.plants[2]));
      if (s.plants[0].happy) fail("shade", "sunflower was happy in the shade");
      t = 60000;
      const hops = Math.ceil(spec().sunSeconds * 0.5) + 2;
      for (let i = 0; i < hops; i++) { t += 1000; step(t); }
      s = state();

      start("market");
      s = state();

      if (s.wants.some((w) => !plants[w.i] || plants[w.i].kind !== w.kind)) fail("wants", "town wants a missing plant");

      if (wishSpan([2, 2.5, 2.7, 3, 3.4], true) !== 4) fail("wants", "fast cap");
      if (wishSpan([2, 2.5, 3.4], true) !== 2) fail("wants", "slow tail");
      if (wishSpan([2.7, 3.4, 2], false) !== 1) fail("wants", "single");
      if (wishSpan([2, 2.5, 2.7, 3], false) !== 1) fail("wants", "little fast");
      plants[0].growth = 1;
      plants[1].growth = 0.4;
      placeSun(0.99);
      sunParked = false;
      t = 30000;
      step(t);
      step(t + 400);
      s = state();
      if (s.sunsets < 1) fail("sunset", "sunsets " + s.sunsets + " sun " + s.sunU);
      step(t + 1600);
      s = state();
      if (s.plants[0].growth >= 1) fail("sunset", "ready plant stayed");
      if (s.plants[1].growth < 0.35) fail("sunset", "unready plant was taken " + s.plants[1].growth);
      if (plants[0].kind !== "coconut") fail("fruit", "first crop felled the tree, now " + plants[0].kind);
      if (!(plants[0].growth > 0.55 && plants[0].growth < 0.74)) fail("fruit", "coconut growth " + plants[0].growth);
      if (!plants[0].stems || plants[0].stems.some((stem) => stem.age >= 0.74)) fail("fruit", "nuts still on the tree");

      start("market");
      plants[0].bear = 1;
      plants[0].growth = 1;
      plants[0].water = 1;
      plants.forEach((p, i) => { if (i) p.growth = 0.2; });
      const youngBanana = plants[1];
      if (!harvestsFruit(youngBanana)) fail("fruit", "a new banana tree would be felled");
      youngBanana.bear = 1;
      if (harvestsFruit(youngBanana)) fail("fruit", "a spent banana tree kept its crown");
      youngBanana.growth = 0.2;
      t = 500000;
      step(t);
      step(t + 1100);
      step(t + 1700);
      s = state();
      if (plants[0].kind === "coconut") fail("fell", "coconut tree stayed");
      if (plants[0].growth > 0.45) fail("fell", "growth " + plants[0].growth);
      if (liveEl.textContent.indexOf("whole") < 0) fail("fell", liveEl.textContent);

        plants[5].name = "Carrot";
        plants[5].likes = "sun";
        plants[5].hue = "#e07a2f";

      t = sendCarrot(100000);

      if (!(s.mood < 0.45)) fail("tired", "mood stayed " + s.mood);
      t = sendCarrot(t);
      s = state();
      if (s.face !== "tired" || s.mood >= 0.28) fail("tired", s.face + " " + s.mood);
      if ((s.fatigue.carrot || 0) < 0.5) fail("tired", "fatigue " + s.fatigue.carrot);
      if (moodEl.textContent.toLowerCase().indexOf("carrot") < 0) fail("tired", moodEl.textContent);
      if (!s.wants.length || s.wants.some((w) => !plants[w.i] || plants[w.i].kind !== w.kind)) fail("tired", "missing want");
    } catch (err) {
      fail("throw", String(err && err.stack || err));
    }

  }

  canvas.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    ensureAudio();
    const x = e.clientX;
    const y = e.clientY;
    pointerDown(x, y);
    if (sunDrag || watering >= 0 || shadeArm >= 0) {

  });

    if (capId === null) pointerActive = false;

  document.addEventListener("pointercancel", () => {
    if (capId === null) pointerActive = false;
  }, true);

  waterBtn.addEventListener("click", () => selectTool("water"));
  sunBtn.addEventListener("click", () => selectTool("sun"));
  shadeBtn.addEventListener("click", () => selectTool("shade"));
  document.querySelectorAll("[data-level]").forEach((btn) => {

  });
  flowersBtn.addEventListener("click", () => start("flowers"));
  marketBtn.addEventListener("click", () => { if (levelId !== "tiny") start("market"); });
  backBtn.addEventListener("click", showStart);
  muteBtn.addEventListener("click", toggleMute);
  fullBtn.addEventListener("click", toggleFull);
  window.addEventListener("resize", () => { if (!checking) render(); });

  function frame(now) {
    if (!checking) step(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  connectGaze();
  selectLevel("tiny");
  render();

  window.sunGarden = {
    start, look, releaseLook, dwell: () => dwellProgress,
    eyes: () => ({ on: !!(gazeSock && gazeSock.readyState === 1) }),
    tap, hold, move, release, placeSun, centers, state, step, selfCheck,
    level: selectLevel, tool: selectTool
  };

  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    const result = selfCheck();
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else if (params.has("market")) {
    selectLevel(params.get("level") || "little");
    start("market");
  } else if (params.has("play")) {
    selectLevel(params.get("level") || "tiny");
    start("flowers");
  }
})();
</script>
</body>
</html>
