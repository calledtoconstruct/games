<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>Two Pairs of Eyes</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; touch-action: none; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; pointer-events: none; z-index: 0;
  }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 1; pointer-events: none;
    background: var(--card); border-radius: 999px; padding: 4px 8px;
    font-weight: 800; font-size: 16px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #banner {
    position: fixed; z-index: 4; pointer-events: none; margin: 0;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 2px 8px; font-size: 13px; font-weight: 800; line-height: 15px;
    text-align: center; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #menu-card, #setup-card, #rest-card, #wait-card {
    position: fixed; z-index: 2; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #screen-menu, #screen-setup, #screen-rest, #screen-wait, #play,
  #menu-copy, #setup-copy, #rest-line, #wait-line, #setup-note, h1, p, b, small {
    pointer-events: none;
  }
  #menu-copy, #setup-copy, #rest-line, #wait-line, #setup-note {
    position: fixed; z-index: 24; margin: 0; text-align: center; overflow: hidden;
  }
  #menu-copy h1, #setup-copy h1 { margin: 0; font-size: 26px; line-height: 28px; }
  #menu-copy p, #setup-copy p, #setup-note { margin: 0; font-size: 14px; line-height: 16px; }
  #rest-line, #wait-line { font-size: 26px; font-weight: 800; line-height: 30px; }
  #mute, #full, #back, #lets-go, #tiny, #little, #shop, #rush, #another,
  #open-helper, #one-screen, #solo, #play button {
    position: fixed; z-index: 30; pointer-events: auto;
  }
  #mute, #full, #back, #another {
    z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1; font-size: 14px; line-height: 1.1;
    padding: 4px;
  }
  #another { background: var(--sun); box-shadow: 0 5px 0 var(--sun-d); font-size: 22px; }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; display: block; }
  #tiny, #little, #shop, #rush, #open-helper, #one-screen, #solo {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; color: var(--ink); text-align: left;
    padding: 4px 10px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  #tiny b, #little b, #shop b, #rush b,
  #open-helper b, #one-screen b, #solo b { display: block; font-size: 18px; line-height: 20px; }
  #tiny small, #little small, #shop small, #rush small,
  #open-helper small, #one-screen small, #solo small {
    display: block; font-size: 12px; line-height: 14px; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go {
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink); font-weight: 800;
    box-shadow: 0 5px 0 var(--sun-d); font-size: 26px;
  }
  #play button {
    border: 0; border-radius: 10px; padding: 0; background: transparent;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<button id="mute" type="button" aria-label="Mute sound">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8l6 8"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner">Pick a cave.</p>
<section id="screen-menu">
  <div id="menu-card"></div>
  <div id="menu-copy">
    <h1>Two Pairs of Eyes</h1>
    <p>A game for two: a guide who looks and a helper who clicks.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>Little Cave</b><small>Ages 2 to 3 (with a grown-up helper). A small cave, one gem.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Cozy Cave</b><small>Ages 4 to 5. Two gems.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Deep Cave</b><small>Ages 6 to 8. Three gems and puddles.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Giant Cave</b><small>Ages 9 and up. Four gems.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<section id="screen-setup" hidden>
  <div id="setup-card"></div>
  <div id="setup-copy">
    <h1>How will you play?</h1>
    <p>One computer. A guide and a helper.</p>
  </div>
  <p id="setup-note"></p>
  <button id="open-helper" type="button"><b>Open the helper's screen</b><small>Helper: click here</small></button>
  <button id="one-screen" type="button"><b>One screen</b><small>Map and cave together.</small></button>
  <button id="solo" type="button"><b>Solo</b><small>Look next to the explorer to walk.</small></button>
</section>
<div id="play" hidden></div>
<section id="screen-rest" hidden>
  <div id="rest-card"></div>
  <p id="rest-line">You found every gem together.</p>
  <button id="another" type="button">Another</button>
</section>
<section id="screen-wait" hidden>
  <div id="wait-card"></div>
  <p id="wait-line">Waiting for the map...</p>
</section>
<script>
(function () {
  "use strict";
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const BAND_IDS = ["tiny", "little", "shop", "rush"];
  const GEM_COUNT = { tiny: 1, little: 2, shop: 3, rush: 4 };
  const LIGHT = { tiny: 2, little: 2, shop: 1, rush: 1 };
  const DIM = { tiny: [4, 4], little: [5, 5], shop: [6, 6], rush: [8, 6] };
  const CAVES = {
    tiny: ["S..#", ".#..", ".#.#", "...G"],
    little: ["S...#", ".##.G", ".#...", ".#.#.", "G..#."],
    shop: ["S.#...", "..#.#G", ".~..#.", "##.##.", "G..~..", ".#..#G"],
    rush: ["S..#....", ".#.#.##G", ".#...~..", ".####.#.", "G~..#...", ".#.G..#G"]
  };
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const DIR_NAMES = ["up", "down", "left", "right"];
  const inPagePeer = { role: "cave" };

  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d");
  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const backBtn = document.getElementById("back");
  const eyesEl = document.getElementById("eyes");
  const gazeEl = document.getElementById("gaze");
  const bannerEl = document.getElementById("banner");
  const menuEl = document.getElementById("screen-menu");
  const menuCard = document.getElementById("menu-card");
  const menuCopy = document.getElementById("menu-copy");
  const setupEl = document.getElementById("screen-setup");
  const setupCard = document.getElementById("setup-card");
  const setupCopy = document.getElementById("setup-copy");
  const setupNote = document.getElementById("setup-note");
  const playEl = document.getElementById("play");
  const restEl = document.getElementById("screen-rest");
  const restCard = document.getElementById("rest-card");
  const restLine = document.getElementById("rest-line");
  const anotherBtn = document.getElementById("another");
  const waitEl = document.getElementById("screen-wait");
  const waitCard = document.getElementById("wait-card");
  const waitLine = document.getElementById("wait-line");
  const soundOn = document.getElementById("sound-on");
  const soundOff = document.getElementById("sound-off");
  const letsBtn = document.getElementById("lets-go");

  let role = "map";
  let screen = "menu";
  let level = "tiny";
  let mode = null;
  let muted = false;
  let note = "";
  let mirror = false;
  let grid = [];
  let explorer = null;
  let found = [];
  let mark = null;
  let pendingRest = false;
  let restFrom = 0;
  let trail = [];
  let walk = null;
  let bump = null;
  let caveWindow = null;
  let pin = null;
  let checking = false;
  let suppressReconnect = false;
  let clock = 0;
  let ac = null;
  let master = null;
  let pointerDown = false;
  let armedId = null;
  let gazeSock = null;
  let gazeTimer = 0;
  let gazeBuf = new Uint8Array(0);
  let gazeWarp = null;
  let gazeHold = null;
  let refreshHold = false;
  let haveSmooth = false;
  let smoothed = null;
  let gazePoint = null;
  let gazeAt = 0;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;
  let dwellMs = PLAY_DWELL_MS;
  let dwellOffAt = 0;
  let lastLookSent = -1;
  let sent = [];
  let mapHidden = false;
  let cavePhase = "wait";
  let remote = null;
  let remoteFoundN = -1;
  let remoteMarkKey = "";
  let lastLayout = null;
  const playButtons = {};

  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  function knownBand(band) { return BAND_IDS.indexOf(band) >= 0; }
  function caveQuery(search) {
    const q = search.charAt(0) === "?" ? search.slice(1) : search;
    const p = new URLSearchParams(q);
    if (p.has("selfcheck")) return false;
    return p.has("cave");
  }
  function wouldSocket(protocol, pageRole, blocked) {
    if (blocked) return false;
    if (pageRole !== "map") return false;
    if (protocol === "https:") return false;
    return true;
  }
  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
  function overlaps(a, b) {
    if (!a || !b) return false;
    return a.x < b.x + b.w - 0.5 && b.x < a.x + a.w - 0.5 && a.y < b.y + b.h - 0.5 && b.y < a.y + a.h - 0.5;
  }
  function charAt(rows, c, r) {
    if (!rows || r < 0 || c < 0 || r >= rows.length) return "#";
    const row = rows[r];
    if (c >= row.length) return "#";
    return row.charAt(c);
  }
  function passable(ch) { return ch === "." || ch === "S" || ch === "G" || ch === "~"; }
  function findChar(rows, ch) {
    const out = [];
    for (let r = 0; r < rows.length; r++) {
      for (let c = 0; c < rows[r].length; c++) {
        if (rows[r].charAt(c) === ch) out.push([c, r]);
      }
    }
    return out;
  }
  function listGems(rows) { return findChar(rows, "G"); }
  function findStart(rows) {
    const s = findChar(rows, "S");
    return s.length ? s[0] : null;
  }
  function countChar(rows, ch) {
    let n = 0;
    for (let r = 0; r < rows.length; r++) {
      for (let c = 0; c < rows[r].length; c++) if (rows[r].charAt(c) === ch) n += 1;
    }
    return n;
  }
  function flipRows(rows) {
    return rows.map(function (row) { return row.split("").reverse().join(""); });
  }
  function reachesGems(rows) {
    const start = findStart(rows);
    const gems = listGems(rows);
    if (!start || !gems.length) return false;
    const seen = {};
    const q = [start];
    seen[start[0] + "," + start[1]] = true;
    let guard = 0;
    while (q.length && guard < 400) {
      guard += 1;
      const cur = q.shift();
      for (let i = 0; i < DIR_NAMES.length; i++) {
        const d = DIRS[DIR_NAMES[i]];
        const c = cur[0] + d[0];
        const r = cur[1] + d[1];
        const key = c + "," + r;
        if (seen[key] || !passable(charAt(rows, c, r))) continue;
        seen[key] = true;
        q.push([c, r]);
      }
    }
    for (let i = 0; i < gems.length; i++) {
      if (!seen[gems[i][0] + "," + gems[i][1]]) return false;
    }
    return true;
  }
  function saneRows(rows) {
    if (!Array.isArray(rows) || rows.length < 1 || rows.length > 12) return null;
    const w = rows[0].length;
    if (w < 1 || w > 12) return null;
    const out = [];
    for (let i = 0; i < rows.length; i++) {
      if (typeof rows[i] !== "string" || rows[i].length !== w) return null;
      if (!/^[#.SG~]+$/.test(rows[i])) return null;
      out.push(rows[i]);
    }
    return out;
  }
  function pairOK(cell) {
    return Array.isArray(cell) && cell.length === 2 &&
      typeof cell[0] === "number" && typeof cell[1] === "number" &&
      cell[0] === (cell[0] | 0) && cell[1] === (cell[1] | 0);
  }
  function markKey(cell) { return cell ? cell[0] + "," + cell[1] : ""; }
  function sameCell(a, b) { return !!a && !!b && a[0] === b[0] && a[1] === b[1]; }
  function modeName() { return mode === "one" ? "one" : "map"; }
  function bannerText() {
    if (note) return note;
    if (screen === "setup") return "Choose a way to play.";
    if (screen === "play") return "Look where the explorer should go.";
    if (screen === "rest") return "You found every gem together.";
    return "Pick a cave.";
  }
  function seed(n) { pin = n >>> 0; render(); }

  function ensureAudio() {
    if (checking || ac) {
      if (ac && ac.state === "suspended") {
        try { ac.resume(); } catch (err) {}
      }
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    try {
      ac = new Ctx();
      master = ac.createGain();
      master.gain.value = muted ? 0 : 0.5;
      master.connect(ac.destination);
      if (ac.state === "suspended") ac.resume();
    } catch (err) {
      ac = null;
      master = null;
    }
  }
  function tone(freq, dur, when, gain) {
    if (checking || !ac || !master) return;
    try {
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      osc.connect(g);
      g.connect(master);
      const t0 = ac.currentTime + (when || 0);
      g.gain.setValueAtTime(gain || 0.22, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (err) {}
  }
  function gemSound() {
    tone(523, 0.2, 0, 0.16);
    tone(659, 0.2, 0.02, 0.16);
    tone(784, 0.22, 0.04, 0.16);
  }
  function bumpSound() { tone(120, 0.06, 0, 0.28); }
  function markSound() { tone(880, 0.06, 0, 0.2); }
  function splashSound() {
    if (checking || !ac || !master) return;
    try {
      const n = Math.max(1, Math.floor(ac.sampleRate * 0.15));
      const buf = ac.createBuffer(1, n, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource();
      src.buffer = buf;
      const filter = ac.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 900;
      const g = ac.createGain();
      const t0 = ac.currentTime;
      g.gain.setValueAtTime(0.35, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
      src.connect(filter);
      filter.connect(g);
      g.connect(master);
      src.start(t0);
      src.stop(t0 + 0.15);
    } catch (err) {}
  }
  function toggleMute() {
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 0.5;
    render();
  }
  function toggleFull() {
    const root = document.documentElement;
    try {
      if (document.fullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen();
      } else if (root.requestFullscreen) {
        const pending = root.requestFullscreen();
        if (pending && pending.catch) pending.catch(function () {});
      }
    } catch (err) {}
    render();
  }

  function chromeBoxes(w) {
    const y = 8;
    const bh = 72;
    const edge = 8;
    const gap = w < 760 ? 4 : 8;
    const mute = { id: "mute", x: edge, y: y, w: 72, h: bh };
    const full = { id: "full", x: mute.x + 72 + gap, y: y, w: 72, h: bh };
    let backW = w < 760 ? 96 : 168;
    let backX = w - edge - backW;
    if (backX < full.x + full.w + gap) {
      backW = Math.max(72, w - edge - (full.x + full.w + gap) - edge);
      backX = w - edge - backW;
    }
    const back = { id: "back", x: backX, y: y, w: backW, h: bh };
    const bannerX = full.x + full.w + gap;
    const banner = { id: "banner", x: bannerX, y: 14, w: Math.max(0, back.x - gap - bannerX), h: 56 };
    return { mute: mute, full: full, back: back, banner: banner };
  }
  function mapPaneBox(w, h, which) {
    const top = 84;
    const bottom = 16;
    const edge = 16;
    const contentH = Math.max(0, h - top - bottom);
    const contentW = Math.max(0, w - edge * 2);
    if (which === "one" && w >= 800) {
      const panel = Math.floor(w * 0.6);
      return { x: edge, y: top, w: Math.max(0, panel - edge - 28), h: contentH, panel: panel, side: true };
    }
    if (which === "one") {
      const gap = 8;
      const mh = Math.floor((contentH - gap) / 2);
      return { x: edge, y: top, w: contentW, h: Math.max(0, mh), stack: true, gap: gap, contentH: contentH };
    }
    return { x: edge, y: top, w: contentW, h: contentH };
  }
  function bandFits(band, w, h, which) {
    if (!(w >= 320) || !DIM[band]) return false;
    const pane = mapPaneBox(w, h, which || "map");
    const spec = DIM[band];
    if (pane.w < 1 || pane.h < 1) return false;
    return Math.min(pane.w / spec[0], pane.h / spec[1]) >= 72;
  }
  function offeredBands(w, h, which) {
    const out = [];
    for (let i = 0; i < BAND_IDS.length; i++) {
      if (bandFits(BAND_IDS[i], w, h, which)) out.push(BAND_IDS[i]);
    }
    return out;
  }
  function columnLayout(w, h, ids, titleH, top) {
    const btnH = 72;
    const gap = 8;
    const cardW = w < 520 ? w - 16 : Math.min(480, w - 24);
    const cardX = Math.round((w - cardW) / 2);
    const buttons = [];
    const columnH = titleH + (ids.length ? gap : 0) + ids.length * btnH + Math.max(0, ids.length - 1) * gap;
    let useTop = top;
    if (useTop + columnH > h - 8) useTop = 8;
    if (useTop + columnH <= h - 8 && cardW >= 72) {
      let y = useTop + titleH + (ids.length ? gap : 0);
      for (let i = 0; i < ids.length; i++) {
        buttons.push({ id: ids[i], x: cardX, y: y, w: cardW, h: btnH });
        y += btnH + gap;
      }
      const card = { x: cardX, y: useTop, w: cardW, h: Math.max(titleH, y - gap - useTop) };
      return {
        title: { x: cardX, y: useTop, w: cardW, h: titleH },
        card: card,
        buttons: buttons,
        ok: true
      };
    }
    const bands = ids.filter(function (id) { return id !== "lets-go" && id !== "open-helper" && id !== "one-screen" && id !== "solo"; });
    const tail = ids.filter(function (id) { return bands.indexOf(id) < 0; });
    const colW = Math.max(72, Math.floor((cardW - gap) / 2));
    const gridW = colW * 2 + gap;
    const gridX = cardX + Math.max(0, (cardW - gridW) / 2);
    const rows = Math.ceil(bands.length / 2);
    const gridTitle = Math.min(titleH, 56);
    const gridTop = 84;
    let y = gridTop + gridTitle + gap;
    for (let i = 0; i < bands.length; i++) {
      const col = i % 2;
      const row = Math.floor(i / 2);
      buttons.push({
        id: bands[i],
        x: gridX + col * (colW + gap),
        y: y + row * (btnH + gap),
        w: colW,
        h: btnH
      });
    }
    y += rows * (btnH + gap);
    for (let i = 0; i < tail.length; i++) {
      buttons.push({ id: tail[i], x: cardX, y: y, w: cardW, h: btnH });
      y += btnH + gap;
    }
    const card = { x: cardX, y: gridTop, w: cardW, h: Math.max(gridTitle, y - gap - gridTop) };
    const fits = card.y + card.h <= h + 0.5 && card.x >= 8 - 0.5;
    return {
      title: { x: cardX, y: gridTop, w: cardW, h: gridTitle },
      card: card,
      buttons: buttons,
      ok: fits
    };
  }

      step(50000);
      const startAt = state().explorer.slice();
      handleMap({ type: "move", dir: "up" }, inPagePeer);
      if (state().explorer[0] !== startAt[0] || state().explorer[1] !== startAt[1]) fail("move-rules", "A move into a wall changed the explorer.");
      handleMap({ type: "move", dir: "right" }, inPagePeer);
      if (!state().explorer || state().explorer[0] !== 1 || state().explorer[1] !== 0) fail("move-rules", "A move onto floor did not walk one cell.");
      handleMap({ type: "move", dir: "right" }, inPagePeer);
      if (state().explorer[0] !== 1 || state().explorer[1] !== 0) fail("move-rules", "A second move into a wall left the floor cell.");
      start("shop");
      enterMode("one");
      step(52000);
      handleMap({ type: "move", dir: "down" }, inPagePeer);
      handleMap({ type: "move", dir: "down" }, inPagePeer);
      if (state().explorer[0] !== 0 || state().explorer[1] !== 2) fail("move-rules", "The walk did not reach the cell beside the puddle.");
      handleMap({ type: "move", dir: "right" }, inPagePeer);
      if (state().explorer[0] !== 2 || state().explorer[1] !== 2) fail("move-rules", "A puddle did not slide one more floor cell.");
    });
    run("gems-rest", function () {
      resetInput();
      start("tiny");
      enterMode("one");
      step(60000);
      const route = pathToGems();
      if (!route) fail("gems-rest", "Tiny Cave had no walk to the gem.");
      else {
        const before = sent.length;
        for (let i = 0; i < route.length; i++) handleMap({ type: "move", dir: route[i] }, inPagePeer);
        if (state().found.length !== 1 || state().screen !== "play") fail("gems-rest", "The gem did not stay on the play screen before the pause.");
        step(61499);
        if (state().screen !== "play") fail("gems-rest", "Rest opened before 1500 ms.");
        let early = false;
        for (let i = before; i < sent.length; i++) if (sent[i].type === "rest") early = true;
        if (early) fail("gems-rest", "A rest message went out before 1500 ms.");
        step(61500);
        if (state().screen !== "rest") fail("gems-rest", "The map was not on rest after 1500 ms.");
        let rests = 0;
        for (let i = before; i < sent.length; i++) if (sent[i].type === "rest") rests += 1;
        if (rests !== 1) fail("gems-rest", "Rest was not sent once.");
        if (state().banner !== "You found every gem together.") fail("gems-rest", "The rest sentence changed.");
      }
    });
    run("mark-dwell", function () {
      resetInput();
      start("tiny");
      enterMode("one");
      const box = targetById(centers().targets, "mc-2-0");
      if (!box) fail("mark-dwell", "The floor cell was missing.");
      else {
        enterLook(box, 70000);
        step(70640);
        if (state().mark) fail("mark-dwell", "640 ms placed a mark.");
        step(70660);
        if (!state().mark || state().mark[0] !== 2 || state().mark[1] !== 0) fail("mark-dwell", "660 ms did not place the mark.");
        releaseLook();
        enterLook(box, 72000);
        step(72660);
        if (state().mark) fail("mark-dwell", "Looking at the marked cell again did not clear it.");
      }
    });
    run("look-messages", function () {
      resetInput();
      start("tiny");
      enterMode("one");
      const lay = layoutFor(window.innerWidth, window.innerHeight);
      const box = lay.grids && lay.grids.mapGrid;
      if (!box) fail("look-messages", "The map grid was missing.");
      else {
        const nx = (box.x + box.w / 2) / window.innerWidth;
        const ny = (box.y + box.h / 2) / window.innerHeight;
        step(80000);
        look(nx, ny);
        const startN = sent.length;
        for (let t = 0; t <= 1000; t += 10) step(80000 + t);
        let n = 0;
        for (let i = startN; i < sent.length; i++) if (sent[i].type === "look") n += 1;
        if (n < 10 || n > 15) fail("look-messages", "A fresh look sent " + n + " messages in one second.");
        for (let i = startN; i < sent.length; i++) {
          if (sent[i].type !== "look") continue;
          if (typeof sent[i].x !== "number" || typeof sent[i].y !== "number" || sent[i].x < 0 || sent[i].y < 0 || sent[i].x > 1 || sent[i].y > 1) {
            fail("look-messages", "A look message was outside the cave.");
          }
        }
        const mid = sent.length;
        refreshHold = false;
        try {
          step(82000);
          step(82500);
          step(83000);
        } finally {
          refreshHold = true;
        }
        let staleN = 0;
        for (let i = mid; i < sent.length; i++) if (sent[i].type === "look") staleN += 1;
        if (staleN !== 0) fail("look-messages", "A stale look still sent a message.");
      }
    });
    run("message-filter", function () {
      resetInput();
      start("tiny");
      enterMode("one");
      step(90000);
      const before = JSON.stringify(state());
      handleMap({ type: "sprint", dir: "right" }, inPagePeer);
      handleMap({ type: "move", dir: "right" }, { role: "other" });
      try {
        window.dispatchEvent(new MessageEvent("message", { data: { type: "move", dir: "right" }, source: window }));
      } catch (err) {}
      if (JSON.stringify(state()) !== before) fail("message-filter", "An unknown type or an unknown source changed the cave.");
      handleMap({ type: "move", dir: "right" }, inPagePeer);
      if (!state().explorer || state().explorer[0] !== 1) fail("message-filter", "The paired window could not move.");
    });
    run("solo", function () {
      resetInput();
      start("tiny");
      enterMode("solo");
      const near = targetById(centers().targets, "mc-1-0");
      const far = targetById(centers().targets, "mc-2-0");
      if (!near || !far) fail("solo", "A floor cell was missing.");
      else {
        const startAt = state().explorer.slice();
        enterLook(far, 100000);
        step(100660);
        if (state().explorer[0] !== startAt[0] || state().explorer[1] !== startAt[1]) fail("solo", "A cell two away moved the explorer.");
        releaseLook();
        enterLook(near, 102000);
        step(102640);
        if (state().explorer[0] !== startAt[0] || state().explorer[1] !== startAt[1]) fail("solo", "640 ms walked the explorer.");
        step(102660);
        if (state().explorer[0] !== 1 || state().explorer[1] !== 0) fail("solo", "660 ms did not walk onto the next floor.");
      }
    });
    run("band-fit", function () {
      resetInput();
      go("menu");
      mode = "one";
      const mid = bandIdsOf(targetsAt(1024, 768));
      if (mid.indexOf("rush") >= 0) fail("band-fit", "Giant Cave was offered on one screen at 1024 by 768.");
      if (mid.indexOf("tiny") < 0 || mid.indexOf("little") < 0 || mid.indexOf("shop") < 0) fail("band-fit", "A smaller cave was hidden on one screen at 1024 by 768.");
      const wide = bandIdsOf(targetsAt(1280, 800));
      if (wide.indexOf("rush") < 0) fail("band-fit", "Giant Cave was hidden on one screen at 1280 by 800.");
      mode = null;
      const phone = bandIdsOf(targetsAt(390, 700));
      if (phone.length !== 1 || phone[0] !== "tiny") fail("band-fit", "The phone offered more than Little Cave.");
      mode = "one";
      const phoneOne = bandIdsOf(targetsAt(390, 700));
      if (phoneOne.length !== 1 || phoneOne[0] !== "tiny") fail("band-fit", "One screen on a phone offered more than Little Cave.");
      mode = null;
      go("menu");
    });
    run("eyes-clear", function () {
      function check(where, w, h) {
        const lay = layoutFor(w, h);
        if (!lay.eyes) fail("eyes-clear", "No eyes spot for " + where + ".");
        else {
          const all = (lay.targets || []).concat(lay.blocks || []);
          for (let i = 0; i < all.length; i++) {
            if (overlaps(lay.eyes, all[i])) fail("eyes-clear", "Eyes sat on " + (all[i].id || "a card") + " for " + where + ".");
          }
        }
      }
      mode = null;
      go("menu");
      check("menu 390", 390, 700);
      check("menu 1024", 1024, 768);
      start("tiny");
      enterMode("solo");
      check("solo 390", 390, 700);
      check("solo 1024", 1024, 768);
      enterMode("one");
      check("one 390", 390, 700);
      check("one 1024", 1024, 768);
    });
    run("family-plain-state", function () {
      const before = JSON.stringify(state());
      start("nope");
      go("sideways");
      if (JSON.stringify(state()) !== before) fail("family-plain-state", "An unknown band or screen changed the state.");
      const end = state();
      if (!("level" in end) || !("screen" in end) || !("banner" in end) || !("muted" in end)) {
        fail("family-plain-state", "level, screen, banner, or muted was missing.");
      }
    });
    try { assertJunk("at the end"); }
    catch (err) { fail("family-query-inert", "The junk check threw."); }
    try {
      if (writes !== 0) fail("family-no-storage", "The page called setItem or removeItem.");
      if (storeLen !== null && localStorage.length !== storeLen) fail("family-no-storage", "localStorage gained a key.");
      if (storeLen !== null && localStorage.getItem("pop-pals-v1") !== pop) fail("family-no-storage", "pop-pals-v1 changed.");
    } catch (err) {
      fail("family-no-storage", "Storage could not be read.");
    }
    try {
      if (origSet) localStorage.setItem = origSet;
      if (origRem) localStorage.removeItem = origRem;
    } catch (err) {}
    return { ok: failures.length === 0, failures: failures };
  }

  window.twoPairsOfEyes = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    selfCheck: selfCheck
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let result;
    try { result = selfCheck(); }
    catch (err) {
      result = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] };
    }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else if (caveQuery(location.search)) {
    role = "cave";
    render();
    if (window.opener && !window.opener.closed) {
      try { window.opener.postMessage({ type: "hello" }, "*"); } catch (err) {}
    }
    requestAnimationFrame(frame);
  } else {
    if (params.has("rush")) start("rush");
    else if (params.has("play")) start("tiny");
    connectGaze();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
