<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>Shy Creatures</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; touch-action: none; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; pointer-events: none; z-index: 1;
  }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 28; pointer-events: none;
    background: var(--card); border-radius: 999px; padding: 8px 12px;
    font-weight: 800; font-size: 16px;
  }
  #banner {
    position: fixed; z-index: 25; pointer-events: none;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 6px 14px; font-size: 18px; font-weight: 800;
    text-align: center;
  }
  #menu-card, #rest-card {
    position: fixed; z-index: 2; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #screen-menu, #screen-rest, #play, #menu-copy, #rest-line, h1, p, b, small {
    pointer-events: none;
  }
  #menu-copy, #rest-line {
    position: fixed; z-index: 24; margin: 0; text-align: center; overflow: hidden;
  }
  #menu-copy h1 { margin: 0; font-size: 26px; line-height: 28px; }
  #menu-copy p { margin: 0; font-size: 14px; line-height: 16px; }
  #rest-line { font-size: 22px; font-weight: 800; line-height: 28px; }
  #mute, #full, #back, #lets-go, #tiny, #little, #shop, #rush, #another, #play button {
    position: fixed; z-index: 30; pointer-events: auto;
  }
  #mute, #full, #back {
    z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1; font-size: 15px; line-height: 1.1;
    padding: 4px;
  }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; display: block; }
  #tiny, #little, #shop, #rush {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; color: var(--ink); text-align: left;
    padding: 4px 10px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  #tiny b, #little b, #shop b, #rush b { display: block; font-size: 18px; line-height: 20px; }
  #tiny small, #little small, #shop small, #rush small {
    display: block; font-size: 12px; line-height: 14px; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go, #another {
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink); font-weight: 800;
    box-shadow: 0 5px 0 var(--sun-d); font-size: 26px;
  }
  #creature {
    border: 3px solid var(--ink); border-radius: 28px; padding: 0;
    background: transparent;
    box-shadow: 0 4px 0 #d5c4a1;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<button id="mute" type="button" aria-label="Mute sound">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8l6 8"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner">Pick a meadow.</p>
<section id="screen-menu">
  <div id="menu-card"></div>
  <div id="menu-copy">
    <h1>Shy Creatures</h1>
    <p>Look away and wait. A friend will peek, then step out.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>Peekaboo</b><small>Ages 2 to 3. Two friends. Quick to come out.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Quiet Meadow</b><small>Ages 4 to 5. Three friends.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Still Meadow</b><small>Ages 6 to 8. Four friends.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Patient Meadow</b><small>Ages 9 and up. Five friends.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden>
  <button id="creature" type="button" hidden></button>
</div>
<section id="screen-rest" hidden>
  <div id="rest-card"></div>
  <p id="rest-line">Your meadow friends feel safe with you.</p>
  <button id="another" type="button">Another</button>
</section>
<script>
(function () {
  "use strict";
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const MOUSE_FRESH_MS = 2000;
  const REST_WAIT_MS = 1500;
  const BAND_IDS = ["tiny", "little", "shop", "rush"];
  const SPOTS = {
    burrow: { center: [0.2, 0.75], shapes: [{ e: [0.5, 0.7, 0.45, 0.2], f: "#6b4a2b" }, { e: [0.5, 0.72, 0.3, 0.12], f: "#2c2416" }] },
    log: { center: [0.8, 0.75], shapes: [{ r: [0.05, 0.5, 0.9, 0.35, 0.15], f: "#8C5A2B" }, { e: [0.9, 0.675, 0.08, 0.17], f: "#C89B5B" }] },
    flowers: { center: [0.2, 0.35], shapes: [{ c: [0.3, 0.6, 0.12], f: "#CC79A7" }, { c: [0.55, 0.5, 0.12], f: "#F0E442" }, { c: [0.75, 0.65, 0.12], f: "#56B4E9" }, { r: [0.1, 0.7, 0.8, 0.25, 0.1], f: "#009E73" }] },
    bush: { center: [0.8, 0.35], shapes: [{ c: [0.3, 0.6, 0.28], f: "#2f7d4a" }, { c: [0.6, 0.5, 0.32], f: "#2f7d4a" }, { c: [0.75, 0.7, 0.22], f: "#2f7d4a" }] },
    grass: { center: [0.5, 0.55], shapes: [{ p: [[0.1, 0.95], [0.2, 0.3], [0.3, 0.95], [0.4, 0.2], [0.5, 0.95], [0.6, 0.25], [0.7, 0.95], [0.8, 0.35], [0.9, 0.95]], f: "#5a9a3a" }] }
  };
  const CREATURES = [
    { id: "rabbit", name: "rabbit", spot: "burrow",
      peek: [{ e: [0.38, 0.4, 0.08, 0.3], f: "#BBBBBB" }, { e: [0.62, 0.4, 0.08, 0.3], f: "#BBBBBB" }, { c: [0.5, 0.8, 0.2], f: "#BBBBBB" }, { c: [0.43, 0.78, 0.03], f: "#2c2416" }, { c: [0.57, 0.78, 0.03], f: "#2c2416" }],
      out: [{ e: [0.5, 0.7, 0.28, 0.22], f: "#BBBBBB" }, { c: [0.5, 0.42, 0.16], f: "#BBBBBB" }, { e: [0.43, 0.18, 0.05, 0.16], f: "#BBBBBB" }, { e: [0.57, 0.18, 0.05, 0.16], f: "#BBBBBB" }, { c: [0.45, 0.4, 0.025], f: "#2c2416" }, { c: [0.55, 0.4, 0.025], f: "#2c2416" }, { c: [0.75, 0.75, 0.06], f: "#fffdf6" }] },
    { id: "hedgehog", name: "hedgehog", spot: "log",
      peek: [{ e: [0.5, 0.8, 0.25, 0.15], f: "#6b4a2b" }, { c: [0.4, 0.78, 0.03], f: "#2c2416" }, { c: [0.75, 0.82, 0.03], f: "#2c2416" }],
      out: [{ e: [0.5, 0.65, 0.38, 0.25], f: "#6b4a2b" }, { p: [[0.15, 0.6], [0.25, 0.3], [0.35, 0.5], [0.45, 0.25], [0.55, 0.48], [0.65, 0.28], [0.75, 0.5], [0.85, 0.4], [0.85, 0.65]], f: "#4a3220" }, { e: [0.85, 0.7, 0.1, 0.08], f: "#C89B5B" }, { c: [0.82, 0.65, 0.025], f: "#2c2416" }] },
    { id: "mouse", name: "mouse", spot: "flowers",
      peek: [{ c: [0.4, 0.75, 0.1], f: "#9a9a9a" }, { c: [0.6, 0.75, 0.1], f: "#9a9a9a" }, { c: [0.5, 0.85, 0.12], f: "#9a9a9a" }, { c: [0.46, 0.83, 0.02], f: "#2c2416" }, { c: [0.54, 0.83, 0.02], f: "#2c2416" }],
      out: [{ e: [0.5, 0.7, 0.25, 0.16], f: "#9a9a9a" }, { c: [0.3, 0.6, 0.12], f: "#9a9a9a" }, { c: [0.25, 0.48, 0.07], f: "#CC79A7" }, { c: [0.27, 0.6, 0.02], f: "#2c2416" }, { l: [0.75, 0.72, 0.95, 0.6], s: "#9a9a9a", w: 0.03 }] },
    { id: "fox", name: "fox", spot: "bush",
      peek: [{ p: [[0.3, 0.5], [0.38, 0.25], [0.46, 0.5]], f: "#D55E00" }, { p: [[0.54, 0.5], [0.62, 0.25], [0.7, 0.5]], f: "#D55E00" }, { c: [0.5, 0.7, 0.2], f: "#D55E00" }, { c: [0.43, 0.68, 0.03], f: "#2c2416" }, { c: [0.57, 0.68, 0.03], f: "#2c2416" }],
      out: [{ e: [0.5, 0.65, 0.3, 0.2], f: "#D55E00" }, { c: [0.25, 0.45, 0.16], f: "#D55E00" }, { p: [[0.12, 0.35], [0.16, 0.15], [0.24, 0.32]], f: "#D55E00" }, { p: [[0.26, 0.3], [0.34, 0.13], [0.38, 0.33]], f: "#D55E00" }, { e: [0.88, 0.55, 0.12, 0.2], f: "#D55E00" }, { e: [0.92, 0.42, 0.06, 0.08], f: "#fffdf6" }, { c: [0.22, 0.43, 0.025], f: "#2c2416" }] },
    { id: "fawn", name: "fawn", spot: "grass",
      peek: [{ e: [0.38, 0.45, 0.06, 0.12], f: "#C89B5B" }, { e: [0.62, 0.45, 0.06, 0.12], f: "#C89B5B" }, { c: [0.5, 0.7, 0.18], f: "#C89B5B" }, { c: [0.44, 0.68, 0.03], f: "#2c2416" }, { c: [0.56, 0.68, 0.03], f: "#2c2416" }],
      out: [{ e: [0.5, 0.55, 0.3, 0.16], f: "#C89B5B" }, { r: [0.28, 0.62, 0.05, 0.3, 0.02], f: "#C89B5B" }, { r: [0.67, 0.62, 0.05, 0.3, 0.02], f: "#C89B5B" }, { c: [0.2, 0.35, 0.12], f: "#C89B5B" }, { c: [0.45, 0.5, 0.03], f: "#fffdf6" }, { c: [0.6, 0.55, 0.03], f: "#fffdf6" }, { c: [0.17, 0.33, 0.02], f: "#2c2416" }] }
  ];
  const BANDS = {
    tiny: { count: 2, peekMs: 1500, outMs: 1000, duck: false },
    little: { count: 3, peekMs: 2000, outMs: 1500, duck: true },
    shop: { count: 4, peekMs: 3000, outMs: 2000, duck: true },
    rush: { count: 5, peekMs: 4000, outMs: 2500, duck: true }
  };
  const SHY_RADIUS = { fraction: 0.3, minPx: 150 };
  const SPOT_LABEL = { burrow: "burrow", log: "log", flowers: "flowers", bush: "bush", grass: "tall grass" };

  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d");
  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const backBtn = document.getElementById("back");
  const eyesEl = document.getElementById("eyes");
  const gazeEl = document.getElementById("gaze");
  const bannerEl = document.getElementById("banner");
  const menuEl = document.getElementById("screen-menu");
  const menuCard = document.getElementById("menu-card");
  const menuCopy = document.getElementById("menu-copy");
  const playEl = document.getElementById("play");
  const creatureBtn = document.getElementById("creature");
  const restEl = document.getElementById("screen-rest");
  const restCard = document.getElementById("rest-card");
  const restLine = document.getElementById("rest-line");
  const soundOn = document.getElementById("sound-on");
  const soundOff = document.getElementById("sound-off");

  let screen = "menu";
  let level = "tiny";
  let active = 0;
  let shown = "hidden";
  let awayMs = 0;
  let restAt = 0;
  let bannerMode = "away";
  let duckAnim = null;
  let heart = null;
  let epoch = 0;
  let trustedThisStep = false;
  let pin = null;
  let muted = false;
  let checking = false;
  let suppressReconnect = false;
  let clock = 0;
  let ac = null;
  let master = null;
  let pointerDown = false;
  let armedId = null;
  let gazeSock = null;
  let gazeTimer = 0;
  let gazeBuf = new Uint8Array(0);
  let gazeWarp = null;
  let gazeHold = null;
  let refreshHold = false;
  let haveSmooth = false;
  let smoothed = null;
  let gazePoint = null;
  let gazeAt = 0;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;
  let dwellMs = PLAY_DWELL_MS;
  let dwellOffAt = 0;
  let trailOn = false;
  let mousePoint = null;
  let mouseAt = 0;
  let touchDown = false;
  let touchPoint = null;

  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  function knownBand(band) { return BAND_IDS.indexOf(band) >= 0; }
  function bandSpec() { return BANDS[level] || BANDS.tiny; }
  function bandCount() { return bandSpec().count; }
  function shyRadius(sceneSize) {
    return Math.max(SHY_RADIUS.fraction * sceneSize, SHY_RADIUS.minPx);
  }

  function bannerText() {
    if (screen === "menu") return "Pick a meadow.";
    if (screen === "rest" || bannerMode === "safe") return "Your meadow friends feel safe with you.";
    if (screen !== "play" || active >= bandCount()) return "Your meadow friends feel safe with you.";
    if (bannerMode === "duck") return "Look away and wait.";
    if (shown === "peek") return "Someone is peeking.";
    if (shown === "out") return "Look at the " + CREATURES[active].name + ", gently.";
    const spot = CREATURES[active] ? CREATURES[active].spot : "burrow";
    return "Look away from the " + SPOT_LABEL[spot] + " and wait.";
  }

  function go(id) {
    if (id !== "menu" && id !== "play" && id !== "rest") {
      render();
      return;
    }
    screen = id;
    render();
  }
  function highlight(band) {
    if (!knownBand(band)) {
      render();
      return;
    }
    level = band;
    render();
  }
  function start(band) {
    if (!knownBand(band)) {
      render();
      return;
    }
    level = band;
    active = 0;
    shown = "hidden";
    awayMs = 0;
    restAt = 0;
    bannerMode = "away";
    duckAnim = null;
    heart = null;
    epoch += 1;
    go("play");
  }
  function trust() {
    if (screen !== "play" || shown !== "out" || active >= bandCount()) {
      render();
      return;
    }
    const doneIndex = active;
    active += 1;
    shown = "hidden";
    awayMs = 0;
    bannerMode = "away";
    duckAnim = null;
    trustedThisStep = true;
    heart = { index: doneIndex, t0: clock, float: !reducedMotion() };
    const last = active >= bandCount();
    playTrust(last);
    if (last) {
      restAt = clock + REST_WAIT_MS;
      bannerMode = "safe";
    }
    render();
  }

  function eyesBox(w, h) {
    const ew = 72;
    const eh = 36;
    return { x: Math.max(8, w - 8 - ew), y: Math.max(8, h - 8 - eh), w: ew, h: eh };
  }
  function chromeBoxes(w) {
    const y = 8;
    const h = 72;
    if (screen === "menu") {
      return {
        mute: { id: "mute", x: 8, y: y, w: 72, h: h },
        full: { id: "full", x: 88, y: y, w: 72, h: h },
        back: { id: "back", x: Math.max(8, w - 8 - 160), y: y, w: Math.min(160, Math.max(72, w - 16)), h: h }
      };
    }
    const full = { id: "full", x: w - 8 - 72, y: y, w: 72, h: h };
    const mute = { id: "mute", x: full.x - 8 - 72, y: y, w: 72, h: h };
    const backMax = mute.x - 16;
    const backW = Math.max(72, Math.min(168, backMax));
    return {
      mute: mute,
      full: full,
      back: { id: "back", x: 8, y: y, w: backW, h: h }
    };
  }
  function bannerBox(w, h, chrome) {
    const eye = eyesBox(w, h);
    if (screen === "menu") {
      const left = chrome.full.x + chrome.full.w + 8;
      const bw = w - 8 - left;
      if (bw >= 140) return { x: left, y: 16, w: bw, h: 52 };
      return { x: 8, y: 88, w: Math.max(72, Math.min(w - 16, eye.x - 16)), h: 44 };
    }
    const left = chrome.back.x + chrome.back.w + 8;
    const right = chrome.mute.x - 8;
    if (right - left >= 140) return { x: left, y: 16, w: right - left, h: 52 };
    return { x: 8, y: 88, w: Math.max(72, w - 16), h: 44 };
  }
  function contentTop(banner) {
    if (banner.y >= 80) return banner.y + banner.h + 8;
    return 92;
  }
  function sceneBox(w, h, banner) {
    const top = contentTop(banner);
    const eye = eyesBox(w, h);
    const availW = w - 32;
    if (!(availW >= 112) || !(h - top >= 112)) return null;
    let size = w <= 420 ? Math.min(358, availW) : Math.min(600, availW);
    let floor = h - 16;
    let x = Math.round((w - size) / 2);
    if (x < eye.x + eye.w && x + size > eye.x) floor = eye.y - 8;
    if (size > floor - top) size = floor - top;
    if (!(size >= 160)) return null;
    x = Math.round((w - size) / 2);
    if (x < 16) x = 16;
    const y = Math.round(top + Math.max(0, (floor - top - size) / 2));
    if (y < top || y + size > h) return null;
    return { x: x, y: y, size: size };
  }
  function menuLayout(w, h, banner) {
    const btnH = 72;
    const gap = 8;
    const titleH = 64;
    const ids = ["tiny", "little", "shop", "rush", "lets-go"];
    const columnH = titleH + gap + ids.length * btnH + (ids.length - 1) * gap;
    const belowTop = contentTop(banner);
    const fitsBelow = belowTop + columnH <= h - 8;
    let cardW;
    let cardX;
    let top;
    if (fitsBelow) {
      cardW = w < 480 ? w - 16 : Math.min(460, w - 24);
      cardX = (w - cardW) / 2;
      top = belowTop;
    } else if (8 + columnH <= h - 8) {
      const leftLimit = 168;
      const rightLimit = w - 8;
      cardW = Math.min(460, Math.max(72, rightLimit - leftLimit));
      cardX = leftLimit + Math.max(0, (rightLimit - leftLimit - cardW) / 2);
      top = 8;
    } else {
      cardW = w < 480 ? w - 16 : Math.min(460, w - 24);
      cardX = (w - cardW) / 2;
      top = 8;
    }
    const buttons = [];
    const useGrid = top + columnH > h - 8;
    let title;
    if (!useGrid) {
      title = { x: cardX, y: top, w: cardW, h: titleH };
      let y = top + titleH + gap;
      for (let i = 0; i < ids.length; i++) {
        buttons.push({ id: ids[i], x: cardX, y: y, w: Math.max(72, cardW), h: btnH });
        y += btnH + gap;
      }
      return { title: title, buttons: buttons, card: { x: cardX, y: top, w: cardW, h: y - gap - top } };
    }
    const gridTitle = 48;
    title = { x: cardX, y: top, w: cardW, h: gridTitle };
    const colW = Math.max(72, Math.floor((cardW - gap) / 2));
    const gridW = colW * 2 + gap;
    const gridX = cardX + Math.max(0, (cardW - gridW) / 2);
    let y = top + gridTitle + gap;
    const bandIds = ["tiny", "little", "shop", "rush"];
    for (let i = 0; i < bandIds.length; i++) {
      const col = i % 2;
      const row = Math.floor(i / 2);
      buttons.push({
        id: bandIds[i],
        x: gridX + col * (colW + gap),
        y: y + row * (btnH + gap),
        w: colW,
        h: btnH
      });
    }
    y += 2 * (btnH + gap);
    buttons.push({ id: "lets-go", x: cardX, y: y, w: Math.max(72, cardW), h: btnH });
    return { title: title, buttons: buttons, card: { x: cardX, y: top, w: cardW, h: y + btnH - top } };
  }

      if (keys.length !== 2 || keys.indexOf("on") < 0 || keys.indexOf("live") < 0) fail("family-eyes", "eyes() did not return only on and live.");
      if (typeof eye.on !== "boolean" || typeof eye.live !== "boolean") fail("family-eyes", "on or live was not a boolean.");
      if (eye.on !== true || eye.live !== true) fail("family-eyes", "A fresh look did not set on and live.");
      if (gazeSock) fail("family-eyes", "The socket was open.");
      if (eyesEl.hidden || eyesEl.textContent !== "Eyes") fail("family-eyes", "The Eyes chip was hidden or mislabeled.");
      releaseLook();
      if (!eyesEl.hidden) fail("family-eyes", "The Eyes chip stayed up after release.");
    });
    run("family-mute", function () {
      resetInput();
      go("menu");
      const muteText = (muteBtn.innerText || "").replace(/\s+/g, "");
      if (muteText !== "") fail("family-mute", "The mute button had visible text.");
      if ((muteBtn.innerText || "").indexOf("Mute") >= 0 || (muteBtn.innerText || "").indexOf("Sound") >= 0) {
        fail("family-mute", "Mute or Sound was visible.");
      }
      if (muteBtn.querySelectorAll("svg").length !== 2) fail("family-mute", "The mute button did not hold two speaker icons.");
      if (state().muted !== false) fail("family-mute", "Sound did not start on.");
      const box = targetById(centers().targets, "mute");
      tap(box.nx, box.ny);
      if (state().muted !== true) fail("family-mute", "The first tap did not mute.");
      tap(box.nx, box.ny);
      if (state().muted !== false) fail("family-mute", "The second tap did not turn sound on.");
    });
    run("away-peek-out", function () {
      const bands = ["tiny", "little", "shop", "rush"];
      for (let b = 0; b < bands.length; b++) {
        const band = bands[b];
        const spec = BANDS[band];
        resetInput();
        seed(1);
        start(band);
        const away = pointOutside(CREATURES[0].spot);
        if (!away) fail("away-peek-out", band + " lacked a point outside the shy circle.");
        else {
          const spot = spotPixel(CREATURES[0].spot);
          if (Math.hypot(away.x - spot.x, away.y - spot.y) <= spot.r) fail("away-peek-out", band + " look was inside the circle.");
          const t = 80000 + b * 20000;
          step(t);
          look(away.nx, away.ny);
          step(t);
          step(t + spec.peekMs);
          const peeked = state();
          if (peeked.phase !== "peek" || peeked.active !== CREATURES[0].id) fail("away-peek-out", band + " did not peek on time.");
          step(t + spec.peekMs + spec.outMs);
          const out = state();
          if (out.phase !== "out" || out.active !== CREATURES[0].id) fail("away-peek-out", band + " did not step out on time.");
          const plays = centers().targets.filter(function (item) { return item.play; });
          if (plays.length !== 1) fail("away-peek-out", band + " did not show one play target.");
        }
      }
    });
    run("no-look-counts-away", function () {
      resetInput();
      seed(1);
      start("shop");
      releaseLook();
      if (lookPoint(90000)) fail("no-look-counts-away", "A look point existed.");
      const spec = BANDS.shop;
      const t = 90000;
      step(t);
      step(t + spec.peekMs);
      if (state().phase !== "peek") fail("no-look-counts-away", "The creature did not peek with an empty look.");
      step(t + spec.peekMs + spec.outMs);
      if (state().phase !== "out") fail("no-look-counts-away", "The creature did not come out with an empty look.");
    });
    run("inside-pauses", function () {
      resetInput();
      seed(1);
      start("tiny");
      const inside = pointInside("burrow");
      const t = 100000;
      step(t);
      look(inside.nx, inside.ny);
      step(t);
      step(t + BANDS.tiny.peekMs + BANDS.tiny.outMs + 4000);
      if (state().phase !== "hidden" || state().active !== "rabbit") fail("inside-pauses", "A look on the burrow let the rabbit come out.");
      const away = pointOutside("burrow");
      look(away.nx, away.ny);
      const half = BANDS.tiny.peekMs / 2;
      const t2 = t + BANDS.tiny.peekMs + BANDS.tiny.outMs + 4000;
      step(t2);
      step(t2 + half);
      if (state().phase !== "hidden") fail("inside-pauses", "Half the peek time already showed the rabbit.");
      look(inside.nx, inside.ny);
      step(t2 + half);
      step(t2 + half + 3000);
      if (state().phase !== "hidden" || state().away !== 0) fail("inside-pauses", "Looking back did not hold the timer at zero.");
      look(away.nx, away.ny);
      const t3 = t2 + half + 3000;
      step(t3);
      step(t3 + half);
      if (state().phase !== "hidden") fail("inside-pauses", "The peek timer kept time from before the look.");
      step(t3 + BANDS.tiny.peekMs);
      if (state().phase !== "peek") fail("inside-pauses", "A full peek after looking away did not peek.");
    });
    run("duck", function () {
      resetInput();
      seed(1);
      start("little");
      const away = pointOutside("burrow");
      const inside = pointInside("burrow");
      const spec = BANDS.little;
      const t = 120000;
      step(t);
      look(away.nx, away.ny);
      step(t);
      step(t + spec.peekMs);
      if (state().phase !== "peek") fail("duck", "Quiet Meadow did not peek.");
      look(inside.nx, inside.ny);
      step(t + spec.peekMs);
      if (state().phase !== "hidden" || state().away !== 0) fail("duck", "A look during peek did not duck and restart.");
      if (state().banner !== "Look away and wait.") fail("duck", "The banner after a duck changed.");
      look(away.nx, away.ny);
      const t2 = t + spec.peekMs;
      step(t2);
      step(t2 + spec.peekMs - 1);
      if (state().phase !== "hidden") fail("duck", "The restarted peek arrived early.");
      step(t2 + spec.peekMs);
      if (state().phase !== "peek") fail("duck", "The restarted peek did not arrive on time.");
      resetInput();
      seed(1);
      start("tiny");
      const awayT = pointOutside("burrow");
      const insideT = pointInside("burrow");
      const tiny = BANDS.tiny;
      const u = 140000;
      step(u);
      look(awayT.nx, awayT.ny);
      step(u);
      step(u + tiny.peekMs);
      if (state().phase !== "peek") fail("duck", "Peekaboo did not peek.");
      look(insideT.nx, insideT.ny);
      step(u + tiny.peekMs);
      if (state().phase !== "peek") fail("duck", "Peekaboo ducked when a look arrived.");
      step(u + tiny.peekMs + tiny.outMs);
      if (state().phase !== "out") fail("duck", "Peekaboo did not keep coming out while looked at.");
    });
    run("trust-dwell", function () {
      resetInput();
      seed(1);
      start("tiny");
      releaseLook();
      const t = 160000;
      step(t);
      const hiddenPlays = centers().targets.filter(function (item) { return item.play; });
      if (hiddenPlays.length !== 0) fail("trust-dwell", "A hidden creature was a play target.");
      step(t + BANDS.tiny.peekMs);
      const peekPlays = centers().targets.filter(function (item) { return item.play; });
      if (state().phase !== "peek" || peekPlays.length !== 0) fail("trust-dwell", "A peeking creature was a play target.");
      const tOut = t + BANDS.tiny.peekMs + BANDS.tiny.outMs;
      step(tOut);
      const box = targetById(centers().targets, "creature");
      if (!box || !box.play || state().phase !== "out") fail("trust-dwell", "The out rabbit was not a play target.");
      else {
        enterLook(box, tOut + 1000);
        step(tOut + 1640);
        if (state().phase !== "out" || state().active !== "rabbit") fail("trust-dwell", "640 ms trusted the rabbit.");
        step(tOut + 1660);
        const next = state();
        if (next.creatures[0].phase !== "trusted" || next.active !== "hedgehog" || next.phase !== "hidden") {
          fail("trust-dwell", "660 ms did not trust the rabbit and wake the hedgehog.");
        }
        const nextPlays = centers().targets.filter(function (item) { return item.play; });
        if (nextPlays.length !== 0) fail("trust-dwell", "The next hidden creature was a play target.");
      }
      const tapOut = bringOut("little", 180000);
      const tapBox = targetById(centers().targets, "creature");
      tap(tapBox.nx, tapBox.ny);
      if (state().active !== "hedgehog" || state().creatures[0].phase !== "trusted") fail("trust-dwell", "A tap did not trust the rabbit.");
      if (tapOut < 0) fail("trust-dwell", "The tap clock was empty.");
    });
    run("radius", function () {
      resetInput();
      go("play");
      shown = "hidden";
      active = 0;
      const phone = targetsAt(390, 700);
      if (!phone.ok) fail("radius", "390 by 700 was not ok.");
      else {
        if (Math.abs(phone.scene - 358) > 1) fail("radius", "The meadow was not 358 px at 390 by 700.");
        if (phone.radius !== 150) fail("radius", "The shy circle was not 150 px at 390 by 700.");
      }
      const desk = targetsAt(1024, 768);
      if (!desk.ok) fail("radius", "1024 by 768 was not ok.");
      else {
        const expect = 0.3 * desk.scene;
        if (!(expect > 150)) fail("radius", "The desk meadow was not wide enough for the fraction.");
        if (Math.abs(desk.radius - expect) > 0.01) fail("radius", "The shy circle was not 0.3 of the scene width.");
      }
      bringOut("rush", 190000);
      const wide = targetsAt(1024, 768);
      const narrow = targetsAt(390, 700);
      const wideC = targetById(wide.targets, "creature");
      const narrowC = targetById(narrow.targets, "creature");
      if (!wideC || wideC.w < 112 || wideC.x < 16 || wideC.y < 16 || wideC.x + wideC.w > 1024 - 16) {
        fail("radius", "The desk creature left the 16 px margin or shrank under 112.");
      }
      if (!narrowC || narrowC.w < 112 || narrowC.x < 16 || narrowC.y < 16 || narrowC.x + narrowC.w > 390 - 16 || narrowC.y + narrowC.h > 700 - 16) {
        fail("radius", "The phone creature left the 16 px margin or shrank under 112.");
      }
    });
    run("rest", function () {
      resetInput();
      seed(1);
      start("tiny");
      releaseLook();
      const spec = BANDS.tiny;
      let t = 200000;
      step(t);
      step(t + spec.peekMs + spec.outMs);
      let box = targetById(centers().targets, "creature");
      if (!box) fail("rest", "The first friend never stepped out.");
      else tap(box.nx, box.ny);
      if (state().active !== "hedgehog") fail("rest", "The first trust did not wake the next friend.");
      t = clock;
      step(t);
      step(t + spec.peekMs + spec.outMs);
      box = targetById(centers().targets, "creature");
      if (!box || state().active !== "hedgehog" || state().phase !== "out") fail("rest", "The last friend did not step out.");
      else tap(box.nx, box.ny);
      const ready = clock;
      if (state().screen !== "play" || state().phase !== "wait") fail("rest", "The last trust left the meadow early.");
      step(ready + REST_WAIT_MS - 1);
      if (state().screen !== "play") fail("rest", "Rest opened before 1500 ms.");
      step(ready + REST_WAIT_MS);
      const snap = state();
      if (snap.screen !== "rest") fail("rest", "Trusting the last friend did not open rest.");
      if (snap.banner !== "Your meadow friends feel safe with you.") fail("rest", "The rest banner changed.");
      const restText = restEl.innerText || "";
      if (/grade|miss|rank|time|score/i.test(restText)) fail("rest", "The rest card showed a grade.");
      const anotherBtn = document.getElementById("another");
      if (!anotherBtn || anotherBtn.getAttribute("data-play") === "true") fail("rest", "Another was missing or marked as play.");
      const anotherBox = targetById(centers().targets, "another");
      if (!anotherBox) fail("rest", "Another was not a target.");
      else tap(anotherBox.nx, anotherBox.ny);
      if (state().screen !== "play" || state().level !== "tiny" || state().phase !== "hidden" || state().active !== "rabbit") {
        fail("rest", "Another did not start Peekaboo again.");
      }
    });
    run("eyes-gap", function () {
      function check(where) {
        const views = [[390, 700], [1024, 768]];
        for (let v = 0; v < views.length; v++) {
          const w = views[v][0];
          const h = views[v][1];
          const boxes = layoutTargets(w, h);
          if (!boxes) {
            fail("eyes-gap", where + " at " + w + " by " + h + " missed its button boxes.");
            continue;
          }
          const eye = eyesBox(w, h);
          const chrome = chromeBoxes(w);
          const banner = bannerBox(w, h, chrome);
          if (overlaps(eye, banner)) fail("eyes-gap", "Eyes covered the banner at " + w + " by " + h + " during " + where + ".");
          for (let i = 0; i < boxes.targets.length; i++) {
            if (overlaps(eye, boxes.targets[i])) fail("eyes-gap", "Eyes hit " + boxes.targets[i].id + " at " + w + " by " + h + " during " + where + ".");
          }
        }
      }
      resetInput();
      go("menu");
      check("menu");
      start("tiny");
      shown = "hidden";
      check("hidden");
      shown = "out";
      check("out");
      go("rest");
      check("rest");
      look(0.5, 0.5);
      const placed = eyesEl.getBoundingClientRect();
      const live = eyesBox(window.innerWidth, window.innerHeight);
      if (eyesEl.hidden) fail("eyes-gap", "Eyes was hidden while a look was held.");
      if (Math.abs(placed.left - live.x) > 1 || Math.abs(placed.top - live.y) > 1) fail("eyes-gap", "The running layout did not place Eyes from eyesBox.");
      const z = window.getComputedStyle(eyesEl).zIndex;
      if (Number(z) > 28) fail("eyes-gap", "Eyes was raised over the card.");
      releaseLook();
    });
    run("family-plain-state", function () {
      const before = JSON.stringify(state());
      start("nope");
      go("sideways");
      if (JSON.stringify(state()) !== before) fail("family-plain-state", "An unknown band or screen changed the state.");
      const end = state();
      if (!("level" in end) || !("screen" in end) || !("banner" in end) || !("muted" in end)) {
        fail("family-plain-state", "level, screen, banner, or muted was missing.");
      }
    });
    try {
      assertJunk("at the end");
    } catch (err) {
      fail("family-query-inert", err && err.message ? err.message : "The junk check threw.");
    }
    try {
      if (writes !== 0) fail("family-no-storage", "The page called setItem or removeItem.");
      if (storeLen !== null && localStorage.length !== storeLen) fail("family-no-storage", "localStorage gained a key.");
      if (storeLen !== null && localStorage.getItem("pop-pals-v1") !== pop) fail("family-no-storage", "pop-pals-v1 changed.");
    } catch (err) {
      fail("family-no-storage", "Storage could not be read.");
    }
    try {
      if (origSet) localStorage.setItem = origSet;
      if (origRem) localStorage.removeItem = origRem;
    } catch (err) {}
    return { ok: failures.length === 0, failures: failures };
  }

  window.shyCreatures = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    selfCheck: selfCheck
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let result;
    try { result = selfCheck(); }
    catch (err) {
      result = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] };
    }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("rush")) start("rush");
    else if (params.has("play")) start("tiny");
    connectGaze();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
