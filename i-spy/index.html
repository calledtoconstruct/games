<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>I Spy</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; touch-action: none; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 28; pointer-events: none;
    background: var(--card); border-radius: 999px; padding: 4px 10px;
    font-weight: 800; font-size: 16px; line-height: 28px; text-align: center;
  }
  #banner {
    position: fixed; z-index: 25; pointer-events: none;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 6px 14px; font-size: 18px; font-weight: 800;
    text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    overflow: hidden;
  }
  #banner-art { width: 48px; height: 48px; flex: none; }
  #banner-art svg { width: 48px; height: 48px; display: block; }
  #menu-card, #rest-card {
    position: fixed; z-index: 2; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #screen-menu, #screen-rest, #play, #menu-copy, #rest-line, #scene, h1, p, b, small {
    pointer-events: none;
  }
  #menu-copy, #rest-line {
    position: fixed; z-index: 24; margin: 0; text-align: center; overflow: hidden;
  }
  #menu-copy h1 { margin: 0; font-size: 26px; line-height: 28px; }
  #menu-copy p { margin: 0; font-size: 14px; line-height: 16px; }
  #rest-line { font-size: 28px; font-weight: 800; line-height: 32px; }
  #scene {
    position: fixed; z-index: 4; overflow: hidden;
  }
  #scene svg { display: block; width: 100%; height: 100%; }
  #mute, #full, #back, #lets-go, #tiny, #little, #shop, #rush, #another, #spot {
    position: fixed; z-index: 30; pointer-events: auto;
  }
  #mute, #full, #back {
    z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1; font-size: 15px; line-height: 1.1;
    padding: 4px;
  }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; display: block; }
  #tiny, #little, #shop, #rush {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; color: var(--ink); text-align: left;
    padding: 4px 10px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  #tiny b, #little b, #shop b, #rush b { display: block; font-size: 18px; line-height: 20px; }
  #tiny small, #little small, #shop small, #rush small {
    display: block; font-size: 12px; line-height: 14px; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go, #another {
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink); font-weight: 800;
    box-shadow: 0 5px 0 var(--sun-d); font-size: 26px;
  }
  #spot {
    border: 0; border-radius: 16px; padding: 0;
    background: transparent;
  }
  #spot.spark {
    box-shadow: 0 0 0 4px #fffdf6, 0 0 0 8px #2f8a4c;
    animation: spark-pop 650ms ease-out 1;
  }
  #spot.hint {
    outline: 6px solid var(--sun);
    outline-offset: 2px;
    animation: hint-pulse 650ms ease-in-out 1;
  }
  .sparkle { animation: spark-pop 650ms ease-out 1; }
  @keyframes spark-pop {
    from { opacity: 0.35; }
    to { opacity: 1; }
  }
  @keyframes hint-pulse {
    0% { outline-color: transparent; }
    40% { outline-color: var(--sun); }
    100% { outline-color: var(--sun); }
  }
  @media (prefers-reduced-motion: reduce) {
    #spot.spark, #spot.hint, .sparkle { animation: none; }
    #spot.hint { outline: 6px solid var(--sun); }
    #spot.spark { box-shadow: 0 0 0 4px #2f8a4c; }
  }
</style>
</head>
<body>
<button id="mute" type="button" aria-label="Mute sound">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8l6 8"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner"><span id="banner-art" hidden></span><span id="banner-text">Pick who is playing.</span></p>
<section id="screen-menu">
  <div id="menu-card"></div>
  <div id="menu-copy">
    <h1>I Spy</h1>
    <p>Find the thing in the picture.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>Look Look</b><small>Ages 2 to 3. A few big things.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Spy Kids</b><small>Ages 4 to 5. More things to see.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Sharp Eyes</b><small>Ages 6 to 8. Busy rooms.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Eagle Eye</b><small>Ages 9 and up. Very busy.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden>
  <div id="scene"></div>
</div>
<section id="screen-rest" hidden>
  <div id="rest-card"></div>
  <p id="rest-line">You spied everything.</p>
  <button id="another" type="button">Another</button>
</section>
<script>
(function () {
  "use strict";

  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const BAND_IDS = ["tiny", "little", "shop", "rush"];
  const RANK = { tiny: 0, little: 1, shop: 2, rush: 3 };
  const FINDS = { tiny: 1, little: 2, shop: 3, rush: 4 };
  const SCENE_N = { tiny: 3, little: 3, shop: 3, rush: 4 };
  const SHOWN_N = { tiny: 4, little: 6, shop: 9, rush: 12 };
  const SVG_NS = "http://www.w3.org/2000/svg";
  const REST_LINE = "You spied everything.";

  const ITEMS = {
    ball:     { name: "ball",     shapes: [{c:[.5,.5,.45],f:"#D55E00"},{l:[.05,.5,.95,.5],s:"#fffdf6",w:.06}] },
    cat:      { name: "cat",      shapes: [{c:[.5,.55,.35],f:"#E69F00"},{p:[[.2,.35],[.3,.05],[.42,.25]],f:"#E69F00"},{p:[[.58,.25],[.7,.05],[.8,.35]],f:"#E69F00"},{c:[.38,.5,.05],f:"#2c2416"},{c:[.62,.5,.05],f:"#2c2416"}] },
    shoe:     { name: "shoe",     shapes: [{r:[.1,.45,.8,.3,.1],f:"#0072B2"},{r:[.1,.25,.35,.3,.05],f:"#0072B2"},{r:[.05,.72,.9,.08,.04],f:"#2c2416"}] },
    cup:      { name: "cup",      shapes: [{r:[.2,.25,.5,.6,.06],f:"#56B4E9"},{c:[.78,.5,.12],f:"none",s:"#56B4E9",w:.07}] },
    book:     { name: "book",     shapes: [{r:[.15,.2,.7,.6,.04],f:"#009E73"},{r:[.2,.25,.6,.5,.02],f:"#fffdf6"},{l:[.5,.25,.5,.75],s:"#2c2416",w:.03}] },
    star:     { name: "star",     shapes: [{p:[[.5,.05],[.62,.38],[.97,.38],[.69,.59],[.79,.94],[.5,.73],[.21,.94],[.31,.59],[.03,.38],[.38,.38]],f:"#F0E442"}] },
    duck:     { name: "duck",     shapes: [{e:[.5,.65,.38,.25],f:"#F0E442"},{c:[.68,.35,.18],f:"#F0E442"},{p:[[.83,.35],[.98,.4],[.83,.45]],f:"#E69F00"},{c:[.72,.32,.03],f:"#2c2416"}] },
    apple:    { name: "apple",    shapes: [{c:[.5,.58,.38],f:"#D55E00"},{l:[.5,.2,.55,.05],s:"#8C5A2B",w:.05},{e:[.65,.15,.12,.06],f:"#009E73"}] },
    hat:      { name: "hat",      shapes: [{r:[.05,.7,.9,.12,.06],f:"#CC79A7"},{r:[.25,.3,.5,.42,.08],f:"#CC79A7"},{r:[.25,.6,.5,.08,0],f:"#2c2416"}] },
    key:      { name: "key",      shapes: [{c:[.25,.5,.18],f:"#F0E442"},{c:[.25,.5,.07],f:"#fffdf6"},{r:[.4,.45,.5,.1,0],f:"#F0E442"},{r:[.75,.55,.06,.15,0],f:"#F0E442"},{r:[.85,.55,.06,.12,0],f:"#F0E442"}] },
    clock:    { name: "clock",    shapes: [{c:[.5,.5,.42],f:"#fffdf6",s:"#2c2416",w:.05},{l:[.5,.5,.5,.22],s:"#2c2416",w:.05},{l:[.5,.5,.7,.5],s:"#2c2416",w:.05}] },
    flower:   { name: "flower",   shapes: [{l:[.5,.5,.5,.95],s:"#009E73",w:.06},{c:[.5,.24,.13],f:"#CC79A7"},{c:[.27,.4,.13],f:"#CC79A7"},{c:[.73,.4,.13],f:"#CC79A7"},{c:[.36,.62,.13],f:"#CC79A7"},{c:[.64,.62,.13],f:"#CC79A7"},{c:[.5,.44,.1],f:"#F0E442"}] },
    fish:     { name: "fish",     shapes: [{e:[.45,.5,.35,.22],f:"#56B4E9"},{p:[[.75,.5],[.97,.3],[.97,.7]],f:"#56B4E9"},{c:[.25,.45,.04],f:"#2c2416"}] },
    car:      { name: "toy car",  shapes: [{r:[.05,.45,.9,.3,.08],f:"#D55E00"},{r:[.25,.25,.45,.25,.08],f:"#D55E00"},{c:[.25,.78,.12],f:"#2c2416"},{c:[.75,.78,.12],f:"#2c2416"}] },
    sock:     { name: "sock",     shapes: [{r:[.35,.05,.3,.55,.05],f:"#009E73"},{r:[.35,.5,.55,.3,.15],f:"#009E73"},{r:[.35,.05,.3,.1,0],f:"#fffdf6"}] },
    spoon:    { name: "spoon",    shapes: [{e:[.5,.25,.18,.22],f:"#BBBBBB"},{r:[.46,.42,.08,.53,.04],f:"#BBBBBB"}] },
    bucket:   { name: "bucket",   shapes: [{p:[[.15,.3],[.85,.3],[.75,.9],[.25,.9]],f:"#E69F00"},{l:[.15,.3,.5,.05],s:"#2c2416",w:.04},{l:[.5,.05,.85,.3],s:"#2c2416",w:.04}] },
    shell:    { name: "shell",    shapes: [{p:[[.5,.1],[.9,.6],[.7,.9],[.3,.9],[.1,.6]],f:"#CC79A7"},{l:[.5,.1,.5,.9],s:"#2c2416",w:.03},{l:[.5,.1,.3,.9],s:"#2c2416",w:.03},{l:[.5,.1,.7,.9],s:"#2c2416",w:.03}] },
    leaf:     { name: "leaf",     shapes: [{e:[.5,.5,.4,.22],f:"#009E73"},{l:[.12,.5,.88,.5],s:"#2c2416",w:.03}] },
    bird:     { name: "bird",     shapes: [{e:[.45,.55,.3,.22],f:"#0072B2"},{c:[.7,.38,.14],f:"#0072B2"},{p:[[.82,.38],[.97,.42],[.82,.46]],f:"#E69F00"},{c:[.72,.35,.03],f:"#2c2416"}] },
    umbrella: { name: "umbrella", shapes: [{p:[[.05,.5],[.5,.08],[.95,.5]],f:"#CC79A7"},{l:[.5,.5,.5,.9],s:"#2c2416",w:.05},{l:[.5,.9,.38,.9],s:"#2c2416",w:.05}] }
  };

  const SCENES = [
    { id: "bedroom", name: "Bedroom",
      background: [{r:[0,0,1,.6,0],f:"#f3e6c8"},{r:[0,.6,1,.4,0],f:"#c89b5b"},{r:[.38,.08,.24,.2,.01],f:"#56B4E9",s:"#fffdf6",w:.01},{r:[.05,.62,.4,.2,.02],f:"#CC79A7"}],
      items: [["ball",0,3,"tiny"],["cat",3,3,"tiny"],["shoe",1,3,"tiny"],["book",2,0,"tiny"],["sock",0,2,"little"],["clock",3,0,"little"],["hat",1,1,"shop"],["star",2,2,"shop"],["duck",0,0,"shop"],["key",3,2,"rush"],["cup",2,3,"rush"],["car",1,2,"rush"]] },
    { id: "park", name: "Park",
      background: [{r:[0,0,1,.5,0],f:"#cfe8f5"},{r:[0,.5,1,.5,0],f:"#9fd38a"},{r:[.44,.2,.06,.35,0],f:"#8C5A2B"},{c:[.47,.18,.14],f:"#009E73"}],
      items: [["ball",1,3,"tiny"],["bird",0,0,"tiny"],["flower",3,3,"tiny"],["duck",2,2,"tiny"],["leaf",3,1,"little"],["star",2,0,"little"],["hat",0,2,"shop"],["shoe",1,1,"shop"],["umbrella",3,0,"shop"],["apple",0,3,"rush"],["key",2,3,"rush"],["bucket",1,2,"rush"]] },
    { id: "kitchen", name: "Kitchen",
      background: [{r:[0,0,1,1,0],f:"#f3e6c8"},{r:[0,.55,1,.1,0],f:"#8C5A2B"},{r:[0,.65,1,.35,0],f:"#e7d3a8"},{r:[.05,.05,.4,.2,.02],f:"#d9c08c"},{r:[.55,.05,.4,.2,.02],f:"#d9c08c"}],
      items: [["apple",0,2,"tiny"],["cup",2,2,"tiny"],["spoon",3,1,"tiny"],["cat",1,3,"tiny"],["fish",3,3,"little"],["clock",1,0,"little"],["book",3,0,"shop"],["bucket",0,0,"shop"],["key",2,3,"shop"],["sock",0,3,"rush"],["star",2,0,"rush"],["duck",1,1,"rush"]] },
    { id: "beach", name: "Beach",
      background: [{r:[0,0,1,.4,0],f:"#cfe8f5"},{r:[0,.4,1,.2,0],f:"#56B4E9"},{r:[0,.6,1,.4,0],f:"#f0d9a0"},{c:[.85,.1,.07],f:"#F0E442"}],
      items: [["shell",1,3,"tiny"],["bucket",2,2,"tiny"],["fish",0,1,"tiny"],["ball",3,3,"tiny"],["umbrella",3,0,"little"],["bird",1,0,"little"],["hat",0,3,"shop"],["shoe",2,3,"shop"],["star",3,2,"shop"],["duck",2,1,"rush"],["car",0,2,"rush"],["leaf",1,2,"rush"]] }
  ];

  function makeRng(seed) {
    let state = seed >>> 0;
    return {
      uint() {
        state = (state + 0x6D2B79F5) >>> 0;
        let t = Math.imul(state ^ (state >>> 15), state | 1);
        t = t ^ (t + Math.imul(t ^ (t >>> 7), t | 61));
        return (t ^ (t >>> 14)) >>> 0;
      }
    };
  }
  function rngUint(rng) { return rng.uint(); }
  function rngInt(rng, lo, hi) {
    return lo + (rngUint(rng) % (hi - lo + 1));
  }
  function rngShuffle(rng, items) {
    const a = items.slice();
    for (let i = a.length - 1; i >= 1; i--) {
      const j = rngInt(rng, 0, i);
      const tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }
  function playSeed(clockMs, counter) {
    return (Math.imul(((clockMs >>> 0) ^ Math.imul(counter >>> 0, 0x9E3779B9)), 0x85EBCA6B)) >>> 0;
  }
  function knownBand(band) { return BAND_IDS.indexOf(band) >= 0; }
  function sceneById(id) {
    for (let i = 0; i < SCENES.length; i++) if (SCENES[i].id === id) return SCENES[i];
    return null;
  }

  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const backBtn = document.getElementById("back");
  const eyesEl = document.getElementById("eyes");
  const gazeEl = document.getElementById("gaze");
  const bannerEl = document.getElementById("banner");
  const bannerText = document.getElementById("banner-text");
  const bannerArt = document.getElementById("banner-art");
  const menuEl = document.getElementById("screen-menu");
  const menuCard = document.getElementById("menu-card");
  const menuCopy = document.getElementById("menu-copy");
  const playEl = document.getElementById("play");
  const sceneEl = document.getElementById("scene");
  const restEl = document.getElementById("screen-rest");
  const restCard = document.getElementById("rest-card");
  const restLine = document.getElementById("rest-line");
  const anotherBtn = document.getElementById("another");
  const soundOn = document.getElementById("sound-on");
  const soundOff = document.getElementById("sound-off");

  let screen = "menu";
  let level = "tiny";
  let muted = false;
  let pin = null;
  let counter = 1;
  let checking = false;
  let suppressReconnect = false;
  let clock = 0;
  let ac = null;
  let master = null;
  let pointerDown = false;
  let armedId = null;
  let gazeSock = null;
  let gazeTimer = 0;
  let gazeBuf = new Uint8Array(0);
  let gazeWarp = null;
  let gazeHold = null;
  let refreshHold = false;
  let haveSmooth = false;
  let smoothed = null;
  let gazePoint = null;
  let gazeAt = 0;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;
  let dwellMs = PLAY_DWELL_MS;
  let dwellOffAt = 0;
  let trailOn = false;
  let sittingRng = null;
  let sceneQueue = [];
  let sceneIndex = 0;
  let shown = [];
  let asks = [];
  let askIndex = 0;
  let foundIds = [];
  let idleSince = 0;
  let pendingAt = 0;
  let sceneId = null;
  let pictureKey = "";
  let artKey = "";

  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  function takePageSeed() {
    let s;
    if (pin !== null) s = pin;
    else if (checking) s = 1;
    else s = playSeed(Date.now(), counter);
    pin = null;
    counter += 1;
    return s >>> 0;
  }
  function currentId() {
    if (!asks.length || screen !== "play") return null;
    if (askIndex < asks.length) return asks[askIndex];
    return asks[asks.length - 1];
  }
  function hintActive(now) {
    if (screen !== "play" || pendingAt || askIndex >= asks.length || !asks.length) return false;
    const elapsed = now - idleSince;
    if (!(elapsed >= 20000)) return false;
    return (elapsed % 20000) < 650;
  }
  function bannerSentence() {
    if (screen === "rest") return REST_LINE;
    if (screen === "play") {
      const id = currentId();
      if (id && ITEMS[id]) return "Find the " + ITEMS[id].name + ".";
    }
    return "Pick who is playing.";
  }
  function clearSitting() {
    sittingRng = null;
    sceneQueue = [];
    sceneIndex = 0;
    shown = [];
    asks = [];
    askIndex = 0;
    foundIds = [];
    idleSince = clock;
    pendingAt = 0;
    sceneId = null;
    pictureKey = "";
  }
  function loadScene() {
    const sc = sceneById(sceneQueue[sceneIndex]);
    sceneId = sc ? sc.id : null;
    shown = [];
    if (sc) {
      for (let i = 0; i < sc.items.length; i++) {
        const it = sc.items[i];
        if (RANK[it[3]] <= RANK[level]) shown.push({ id: it[0], col: it[1], row: it[2], band: it[3] });
      }
    }
    const ids = [];
    for (let i = 0; i < shown.length; i++) ids.push(shown[i].id);
    asks = sittingRng ? rngShuffle(sittingRng, ids).slice(0, FINDS[level]) : [];
    askIndex = 0;
    foundIds = [];
    idleSince = clock;
    pendingAt = 0;
  }
  function beginSitting() {
    sittingRng = makeRng(takePageSeed());
    const ids = [];
    for (let i = 0; i < SCENES.length; i++) ids.push(SCENES[i].id);
    sceneQueue = rngShuffle(sittingRng, ids).slice(0, SCENE_N[level]);
    sceneIndex = 0;
    loadScene();
  }
  function go(id) {
    if (id !== "menu" && id !== "play" && id !== "rest") {
      render();
      return;
    }
    if (id !== "play") pendingAt = 0;
    screen = id;
    render();
  }
  function highlight(band) {
    if (!knownBand(band)) {
      render();
      return;
    }
    level = band;
    render();
  }
  function start(band) {
    if (!knownBand(band)) {
      render();
      return;
    }
    level = band;
    beginSitting();
    go("play");
  }
  function another() {
    if (screen !== "rest") {
      render();
      return;
    }
    start(level);
  }
  function findCurrent() {
    if (screen !== "play" || pendingAt || askIndex >= asks.length) {
      render();
      return;
    }
    const id = asks[askIndex];
    foundIds.push(id);
    askIndex += 1;
    if (askIndex >= asks.length) {
      pendingAt = clock + 1200;
      chime([523, 659, 784]);
    } else {
      idleSince = clock;
      chime([660, 880]);
    }
    render();
  }
  function advanceScene() {
    pendingAt = 0;
    sceneIndex += 1;
    if (sceneIndex >= sceneQueue.length) {
      asks = asks.slice();
      go("rest");

            if (RANK[scene.items[i][3]] <= RANK[band]) expect.push(scene.items[i][0]);
          }
          if (st.shown.join(",") !== expect.join(",")) fail("band-counts", band + " did not show that band's items.");
          for (let f = 0; f < FINDS[band]; f++) {
            const spot = targetById(centers().targets, "spot");
            if (!spot) fail("band-counts", band + " had no target.");
            else tap(spot.nx, spot.ny);
          }
          if (s + 1 < scenes) {
            step(t + 1200);
            t = t + 1200;
          }
        }
      }
    });
    run("hint", function () {
      resetInput();
      step(200000);
      seed(1);
      start("shop");
      if (state().hint !== false) fail("hint", "The hint was on at the start of a find.");
      step(219999);
      if (state().hint !== false || state().found.length !== 0) fail("hint", "The hint was on before 20000 ms.");
      step(220000);
      if (state().hint !== true) fail("hint", "The hint was not on at 20000 ms.");
      step(220649);
      if (state().hint !== true) fail("hint", "The hint did not stay for 650 ms.");
      step(220650);
      if (state().hint !== false) fail("hint", "The hint stayed after 650 ms.");
      step(240000);
      if (state().hint !== true) fail("hint", "The hint did not return 20 seconds later.");
      const spot = targetById(centers().targets, "spot");
      tap(spot.nx, spot.ny);
      if (state().hint !== false) fail("hint", "A new find started with the hint on.");
      step(259999);
      if (state().hint !== false) fail("hint", "The next find hinted before 20000 ms.");
      step(260000);
      if (state().hint !== true) fail("hint", "The next find did not hint at 20000 ms.");
    });
    run("sitting-rest", function () {
      const bands = ["tiny", "little", "shop", "rush"];
      for (let b = 0; b < bands.length; b++) {
        const band = bands[b];
        resetInput();
        seed(1);
        start(band);
        const scenes = SCENE_N[band];
        let t = 300000 + b * 30000;
        step(t);
        for (let s = 0; s < scenes; s++) {
          if (state().screen !== "play" || state().sceneIndex !== s) fail("sitting-rest", band + " was not on scene " + s + ".");
          for (let f = 0; f < FINDS[band]; f++) {
            const spot = targetById(centers().targets, "spot");
            if (!spot) fail("sitting-rest", band + " lost its target.");
            else tap(spot.nx, spot.ny);
          }
          step(t + 1199);
          if (state().screen !== "play") fail("sitting-rest", band + " left the scene before 1200 ms.");
          step(t + 1200);
          t = t + 1200;
        }
        if (state().screen !== "rest") fail("sitting-rest", band + " did not rest after " + scenes + " scenes.");
        if (state().banner !== REST_LINE || restLine.textContent !== REST_LINE) fail("sitting-rest", "Rest did not say you spied everything.");
        const restText = (restEl.innerText || "").toLowerCase();
        if (/grade|miss|rank|score|wrong|time/.test(restText)) fail("sitting-rest", "Rest showed a grade, a time, or a miss.");
      }
      const again = targetById(centers().targets, "another");
      if (!again || again.play) fail("sitting-rest", "Another was missing on rest.");
      else tap(again.nx, again.ny);
      if (state().screen !== "play" || state().level !== "rush") fail("sitting-rest", "Another did not start the same band.");
    });
    run("sizes", function () {
      resetInput();
      seed(1);
      start("rush");
      const views = [[390, 700], [1024, 768]];
      const want = [72, 120];
      for (let v = 0; v < views.length; v++) {
        const w = views[v][0];
        const h = views[v][1];
        const lay = targetsAt(w, h);
        if (!lay.ok) fail("sizes", "Play at " + w + " by " + h + " was not ok.");
        const list = lay.targets || [];
        for (let i = 0; i < list.length; i++) {
          const t = list[i];
          if (t.x < -0.5 || t.y < -0.5 || t.x + t.w > w + 0.5 || t.y + t.h > h + 0.5) {
            fail("sizes", t.id + " was off the " + w + " by " + h + " page.");
          }
          if (Math.min(t.w, t.h) < 72) fail("sizes", t.id + " was under 72 at " + w + " by " + h + ".");
          if (t.id === "spot" && (t.w !== want[v] || t.h !== want[v])) {
            fail("sizes", "The item hit box at " + w + " by " + h + " was " + t.w + " by " + t.h + ".");
          }
          if (t.id === "spot" && (t.x < 16 || t.y < 16 || t.x + t.w > w - 16 || t.y + t.h > h - 16)) {
            fail("sizes", "The item hit box was inside the outer 16 px.");
          }
        }
        if (!targetById(list, "spot")) fail("sizes", "The item hit box was missing at " + w + " by " + h + ".");
      }
      go("menu");
      for (let v = 0; v < views.length; v++) {
        const lay = targetsAt(views[v][0], views[v][1]);
        if (!lay.ok) fail("sizes", "The menu at " + views[v][0] + " by " + views[v][1] + " was not ok.");
      }
      const root = document.documentElement;
      if (root.scrollWidth > root.clientWidth + 2 || root.scrollHeight > root.clientHeight + 2) {
        fail("sizes", "The page needed scrolling.");
      }
    });
    run("eyes-gap", function () {
      function hit(where, w, h) {
        const lay = targetsAt(w, h);
        const eye = lay && lay.eyes;
        if (!lay.ok || !eye) fail("eyes-gap", where + " at " + w + " by " + h + " had no Eyes box.");
        else if (eye.w !== 72 || eye.h !== 36) fail("eyes-gap", "The Eyes chip was not 72 by 36.");
        else {
          const list = lay.targets || [];
          for (let i = 0; i < list.length; i++) {
            if (overlaps(eye, list[i])) fail("eyes-gap", where + " Eyes sat on " + list[i].id + " at " + w + " by " + h + ".");
          }
        }
      }
      resetInput();
      go("menu");
      hit("menu", 390, 700);
      hit("menu", 1024, 768);
      seed(1);
      start("rush");
      hit("play", 390, 700);
      hit("play", 1024, 768);
      go("rest");
      hit("rest", 390, 700);
      hit("rest", 1024, 768);
      step(200000);
      look(0.5, 0.02);
      step(200020);
      const liveW = window.innerWidth;
      const liveH = window.innerHeight;
      const live = targetsAt(liveW, liveH);
      const rect = eyesEl.getBoundingClientRect();
      if (eyesEl.hidden) fail("eyes-gap", "The Eyes chip was hidden on the running path.");
      else if (!live.eyes) fail("eyes-gap", "The running path had no Eyes box.");
      else if (Math.abs(rect.left - live.eyes.x) > 1 || Math.abs(rect.top - live.eyes.y) > 1 ||
        Math.abs(rect.width - live.eyes.w) > 1 || Math.abs(rect.height - live.eyes.h) > 1) {
        fail("eyes-gap", "render did not place the Eyes chip in the open gap.");
      } else {
        const buttons = document.querySelectorAll("button");
        for (let i = 0; i < buttons.length; i++) {
          if (!buttonVisible(buttons[i])) continue;
          const r = buttons[i].getBoundingClientRect();
          if (overlaps({ x: rect.left, y: rect.top, w: rect.width, h: rect.height }, { x: r.left, y: r.top, w: r.width, h: r.height })) {
            fail("eyes-gap", "The live Eyes chip sat on " + buttons[i].id + ".");
          }
        }
      }
      releaseLook();
    });
    run("no-speech", function () {
      if (speakCalls !== 0) fail("no-speech", "speechSynthesis.speak was called.");
      if (Object.prototype.hasOwnProperty.call(state(), "speech")) fail("no-speech", "state kept a speech field.");
    });
    run("family-plain-state", function () {
      const before = JSON.stringify(state());
      start("nope");
      go("sideways");
      if (JSON.stringify(state()) !== before) fail("family-plain-state", "An unknown band or screen changed the state.");
      const end = state();
      if (!("level" in end) || !("screen" in end) || !("banner" in end) || !("muted" in end)) {
        fail("family-plain-state", "level, screen, banner, or muted was missing.");
      }
    });
    try { assertJunk("at the end"); }
    catch (err) { fail("family-query-inert", err && err.message ? err.message : "The junk check threw."); }
    try {
      if (writes !== 0) fail("family-no-storage", "The page called setItem or removeItem.");
      if (storeLen !== null && localStorage.length !== storeLen) fail("family-no-storage", "localStorage gained a key.");
      if (storeLen !== null && localStorage.getItem("pop-pals-v1") !== pop) fail("family-no-storage", "pop-pals-v1 changed.");
    } catch (err) {
      fail("family-no-storage", "Storage could not be read.");
    }
    try {
      if (origSet) localStorage.setItem = origSet;
      if (origRem) localStorage.removeItem = origRem;
      if (origSpeak && window.speechSynthesis) window.speechSynthesis.speak = origSpeak;
    } catch (err) {}
    return { ok: failures.length === 0, failures: failures };
  }

  window.iSpy = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    selfCheck: selfCheck
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let result;
    try { result = selfCheck(); }
    catch (err) {
      result = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] };
    }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("rush")) start("rush");
    else if (params.has("play")) start("tiny");
    connectGaze();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
