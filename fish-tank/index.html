<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>Fish Tank</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; touch-action: none; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 28; pointer-events: none;
    background: var(--card); border-radius: 999px; padding: 4px 8px;
    font-weight: 800; font-size: 16px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #banner {
    position: fixed; z-index: 25; pointer-events: none;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 6px 14px; font-size: 18px; font-weight: 800;
    text-align: center; overflow: hidden;
  }
  #menu-card, #rest-card, #chooser-card {
    position: fixed; z-index: 20; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #screen-menu, #screen-rest, #play, #chooser, #tank, #menu-copy, #rest-line, h1, p, b, small {
    pointer-events: none;
  }
  #menu-copy, #rest-line {
    position: fixed; z-index: 24; margin: 0; text-align: center; overflow: hidden;
  }
  #menu-copy h1 { margin: 0; font-size: 26px; line-height: 28px; }
  #menu-copy p { margin: 0; font-size: 14px; line-height: 16px; }
  #rest-line { font-size: 28px; font-weight: 800; }
  button { position: fixed; z-index: 40; pointer-events: auto; }
  #mute, #full, #back {
    border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1; font-size: 15px; line-height: 1.1;
    padding: 4px;
  }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; display: block; }
  #tiny, #little, #shop, #rush {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; color: var(--ink); text-align: left;
    padding: 4px 10px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  #tiny b, #little b, #shop b, #rush b { display: block; font-size: 18px; line-height: 20px; }
  #tiny small, #little small, #shop small, #rush small {
    display: block; font-size: 12px; line-height: 14px; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go, #another, #done {
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink); font-weight: 800;
    box-shadow: 0 5px 0 var(--sun-d); font-size: 26px;
  }
  #done { font-size: 22px; }
  #tank {
    position: fixed; z-index: 1; overflow: hidden; border-radius: 18px;
    background: #9fd3ea;
    box-shadow: inset 0 0 0 4px #2c2416;
  }
  #tank svg { width: 100%; height: 100%; display: block; }
  .tool {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; border-radius: 18px; border: 3px solid transparent;
    background: var(--card); color: var(--ink); font-weight: 800; font-size: 16px;
    box-shadow: 0 4px 0 #d5c4a1; padding: 4px; overflow: hidden;
  }
  .tool svg { width: 36px; height: 36px; display: block; }
  .tool[aria-pressed="true"] { border-color: #e2a62e; box-shadow: 0 0 0 4px #ffc857; }
  #food, .spot {
    border: 3px dashed #2c2416; background: rgba(255, 253, 246, 0.28); padding: 0;
  }
  #food { border-radius: 50%; }
  .spot { border-radius: 16px; }
  .smudge { border: none; background: transparent; padding: 0; border-radius: 46%; }
  .choice {
    display: flex; align-items: center; justify-content: center; text-align: center;
    border-radius: 18px; border: 3px solid var(--ink); background: var(--card);
    color: var(--ink); font-weight: 800; font-size: 18px; line-height: 1.15;
    box-shadow: 0 4px 0 #d5c4a1; padding: 6px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<button id="mute" type="button" aria-label="Mute sound">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8l6 8"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner">Pick who is playing.</p>
<section id="screen-menu">
  <div id="menu-card"></div>
  <div id="menu-copy">
    <h1>Fish Tank</h1>
    <p>Feed the fish, wipe the glass, and add plants.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>Little Bowl</b><small>Ages 2 to 3. Feed and clean.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Tank</b><small>Ages 4 to 5. Add plants.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Big Tank</b><small>Ages 6 to 8. Add fish too.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Reef</b><small>Ages 9 and up. Fish have wishes.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden>
  <div id="tank"></div>
  <button id="food" type="button" data-play="true" aria-label="Food" hidden></button>
  <button id="smudge-0" class="smudge" type="button" data-play="true" aria-label="Smudge" hidden></button>
  <button id="smudge-1" class="smudge" type="button" data-play="true" aria-label="Smudge" hidden></button>
  <button id="smudge-2" class="smudge" type="button" data-play="true" aria-label="Smudge" hidden></button>
  <button id="smudge-3" class="smudge" type="button" data-play="true" aria-label="Smudge" hidden></button>
  <button id="smudge-4" class="smudge" type="button" data-play="true" aria-label="Smudge" hidden></button>
  <button id="smudge-5" class="smudge" type="button" data-play="true" aria-label="Smudge" hidden></button>
  <button id="spot-0" class="spot" type="button" data-play="true" aria-label="Plant spot" hidden></button>
  <button id="spot-1" class="spot" type="button" data-play="true" aria-label="Plant spot" hidden></button>
  <button id="spot-2" class="spot" type="button" data-play="true" aria-label="Plant spot" hidden></button>
  <button id="spot-3" class="spot" type="button" data-play="true" aria-label="Plant spot" hidden></button>
  <button id="spot-4" class="spot" type="button" data-play="true" aria-label="Plant spot" hidden></button>
  <button id="spot-5" class="spot" type="button" data-play="true" aria-label="Plant spot" hidden></button>
  <button id="tool-feed" class="tool" type="button" data-play="true" aria-pressed="false">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="16" y="4" width="16" height="22" rx="4" fill="#ffc857" stroke="#2c2416" stroke-width="2"/><circle cx="20" cy="34" r="3" fill="#e2a62e" stroke="#2c2416" stroke-width="1.5"/><circle cx="28" cy="39" r="3" fill="#e2a62e" stroke="#2c2416" stroke-width="1.5"/><circle cx="24" cy="32" r="2.4" fill="#e2a62e" stroke="#2c2416" stroke-width="1.5"/></svg>
    <span>Feed</span>
  </button>
  <button id="tool-clean" class="tool" type="button" data-play="true" aria-pressed="false">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="14" width="32" height="22" rx="7" fill="#ffd27a" stroke="#2c2416" stroke-width="2"/><circle cx="18" cy="24" r="3" fill="#f4f0d8" stroke="#2c2416" stroke-width="1.5"/><circle cx="28" cy="22" r="3" fill="#f4f0d8" stroke="#2c2416" stroke-width="1.5"/><circle cx="24" cy="30" r="3" fill="#f4f0d8" stroke="#2c2416" stroke-width="1.5"/></svg>
    <span>Clean</span>
  </button>
  <button id="tool-plant" class="tool" type="button" data-play="true" aria-pressed="false">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 42 V16" stroke="#2c2416" stroke-width="3" fill="none"/><ellipse cx="24" cy="14" rx="6" ry="10" fill="#009E73" stroke="#2c2416" stroke-width="2"/><ellipse cx="14" cy="22" rx="8" ry="5" fill="#2f7d4a" stroke="#2c2416" stroke-width="2"/><ellipse cx="34" cy="24" rx="8" ry="5" fill="#009E73" stroke="#2c2416" stroke-width="2"/></svg>
    <span>Plant</span>
  </button>
  <button id="tool-addFish" class="tool" type="button" data-play="true" aria-pressed="false">
    <svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="22" cy="28" rx="12" ry="8" fill="#56B4E9" stroke="#2c2416" stroke-width="2"/><polygon points="32,28 42,20 42,36" fill="#56B4E9" stroke="#2c2416" stroke-width="2"/><path d="M10 8 V20 M4 14 H16" stroke="#2c2416" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
    <span>Add fish</span>
  </button>
  <div id="chooser" hidden>
    <div id="chooser-card"></div>
    <button id="decor-weed" class="choice" type="button">Tall weed</button>
    <button id="decor-bush" class="choice" type="button">Round bush</button>
    <button id="decor-rock" class="choice" type="button">Rock</button>
    <button id="decor-shell" class="choice" type="button">Shell</button>
    <button id="pick-goldie" class="choice" type="button">Goldie</button>
    <button id="pick-stripe" class="choice" type="button">Stripe</button>
    <button id="pick-spot" class="choice" type="button">Spot</button>
    <button id="pick-fin" class="choice" type="button">Fin</button>
    <button id="pick-bubbles" class="choice" type="button">Bubbles</button>
    <button id="pick-zip" class="choice" type="button">Zip</button>
  </div>
  <button id="done" type="button">Done</button>
</div>
<section id="screen-rest" hidden>
  <div id="rest-card"></div>
  <p id="rest-line">The fish are happy.</p>
  <button id="another" type="button">Another</button>
</section>
<script>
(function () {
  "use strict";
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const HUNGER_MS = 90000;
  const SMUDGE_EVERY_MS = 60000;
  const MAX_SMUDGES = 3;
  const BAND_IDS = ["tiny", "little", "shop", "rush"];
  const FOOD_AT = [0.5, 0.1];
  const FLAKE_XS = [460, 520, 490];
  const FLAKE_Y0 = [180, 140, 200];
  const FLAKE_DY = [620, 640, 600];
  const SPOT_AT = [[0.15, 0.88], [0.38, 0.88], [0.62, 0.88], [0.85, 0.88], [0.27, 0.7], [0.73, 0.7]];
  const SMUDGE_AT = [[0.15, 0.3], [0.5, 0.3], [0.85, 0.3], [0.15, 0.52], [0.5, 0.52], [0.85, 0.52]];
  const FISH = [
    { id: "goldie", name: "Goldie", color: "#E69F00", pattern: "plain", body: "round", likes: "plants" },
    { id: "stripe", name: "Stripe", color: "#56B4E9", pattern: "stripes", body: "long", likes: "rocks" },
    { id: "spot", name: "Spot", color: "#F0E442", pattern: "dots", body: "round", likes: "plants" },
    { id: "fin", name: "Fin", color: "#CC79A7", pattern: "longfin", body: "long", likes: "plants" },
    { id: "bubbles", name: "Bubbles", color: "#009E73", pattern: "spikes", body: "puffer", likes: "rocks" },
    { id: "zip", name: "Zip", color: "#D55E00", pattern: "plain", body: "slim", likes: "rocks" }
  ];
  const DECOR = [
    { id: "weed", name: "Tall weed", kind: "plants", color: "#009E73" },
    { id: "bush", name: "Round bush", kind: "plants", color: "#2f7d4a" },
    { id: "rock", name: "Rock", kind: "rocks", color: "#8a8a8a" },
    { id: "shell", name: "Shell", kind: "rocks", color: "#CC79A7" }
  ];
  const BANDS = {
    tiny: { tools: ["feed", "clean"], fish: ["goldie", "stripe"], spots: 0, oneStep: true, wishes: false },
    little: { tools: ["feed", "clean", "plant"], fish: ["goldie", "stripe", "spot"], spots: 4, oneStep: false, wishes: false },
    shop: { tools: ["feed", "clean", "plant", "addFish"], fish: ["goldie", "stripe", "spot"], spots: 6, maxFish: 6, oneStep: false, wishes: false },
    rush: { tools: ["feed", "clean", "plant", "addFish"], fish: ["goldie", "stripe", "spot"], spots: 6, maxFish: 6, oneStep: false, wishes: true }
  };
  const SVG_NS = "http://www.w3.org/2000/svg";

  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const backBtn = document.getElementById("back");
  const eyesEl = document.getElementById("eyes");
  const gazeEl = document.getElementById("gaze");
  const bannerEl = document.getElementById("banner");
  const menuEl = document.getElementById("screen-menu");
  const menuCard = document.getElementById("menu-card");
  const menuCopy = document.getElementById("menu-copy");
  const playEl = document.getElementById("play");
  const tankEl = document.getElementById("tank");
  const chooserEl = document.getElementById("chooser");
  const chooserCard = document.getElementById("chooser-card");
  const restEl = document.getElementById("screen-rest");
  const restCard = document.getElementById("rest-card");
  const restLine = document.getElementById("rest-line");
  const soundOn = document.getElementById("sound-on");
  const soundOff = document.getElementById("sound-off");

  let screen = "menu";
  let level = "tiny";
  let muted = false;
  let tankFish = [];
  let fedAt = {};
  let placed = [];
  let smudges = [];
  let smudgeNext = SMUDGE_EVERY_MS;
  let smudgeOrder = [0, 1, 2, 3, 4, 5];
  let smudgeCursor = 0;
  let careMs = 0;
  let tool = null;
  let chooser = null;
  let pending = -1;
  let flakeAt = -100000;
  let tankScene = "";
  let pin = null;
  let counter = 1;
  let checking = false;
  let suppressReconnect = false;
  let clock = 0;
  let layoutFault = "";
  let ac = null;
  let master = null;
  let pointerDown = false;
  let armedId = null;
  let gazeSock = null;
  let gazeTimer = 0;
  let gazeBuf = new Uint8Array(0);
  let gazeWarp = null;
  let gazeHold = null;
  let refreshHold = false;
  let haveSmooth = false;
  let smoothed = null;
  let gazePoint = null;
  let gazeAt = 0;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;
  let dwellMs = PLAY_DWELL_MS;
  let dwellOffAt = 0;

  function makeRng(seed) {
    let state = seed >>> 0;
    return {
      uint: function () {
        state = (state + 0x6D2B79F5) >>> 0;
        let t = Math.imul(state ^ (state >>> 15), state | 1);
        t = t ^ (t + Math.imul(t ^ (t >>> 7), t | 61));
        return (t ^ (t >>> 14)) >>> 0;
      }
    };
  }
  function shuffleSpots(seed) {
    const a = [0, 1, 2, 3, 4, 5];
    const rng = makeRng(seed);
    for (let i = a.length - 1; i >= 1; i--) {
      const j = rng.uint() % (i + 1);
      const tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }
  function takeSeed() {
    let s;
    if (pin !== null) s = pin;
    else if (checking) s = 1;
    else s = (Date.now() + counter * 0x9E3779B1) >>> 0;
    pin = null;
    counter += 1;
    return s >>> 0;
  }
  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  function knownBand(band) { return BAND_IDS.indexOf(band) >= 0; }
  function bandSpec() { return BANDS[level] || BANDS.tiny; }
  function fishById(id) {
    for (let i = 0; i < FISH.length; i++) if (FISH[i].id === id) return FISH[i];
    return null;
  }
  function decorById(id) {
    for (let i = 0; i < DECOR.length; i++) if (DECOR[i].id === id) return DECOR[i];
    return null;
  }
  function fishIndex(id) {
    for (let i = 0; i < FISH.length; i++) if (FISH[i].id === id) return i;
    return 0;
  }
  function kindPresent(kind) {
    for (let i = 0; i < placed.length; i++) {
      const decor = placed[i] ? decorById(placed[i]) : null;
      if (decor && decor.kind === kind) return true;
    }
    return false;
  }
  function fishHungry(id) {
    return careMs - (fedAt[id] || 0) >= HUNGER_MS;
  }
  function fishHappy(spec) {
    return !!(spec && bandSpec().wishes && kindPresent(spec.likes));
  }
  function maxFish() {
    const spec = bandSpec();
    return spec.maxFish || spec.fish.length;
  }
  function unhappyFish() {
    if (!bandSpec().wishes) return null;
    for (let i = 0; i < FISH.length; i++) {
      if (tankFish.indexOf(FISH[i].id) < 0) continue;
      if (!fishHappy(FISH[i])) return FISH[i];
    }
    return null;
  }
  function bannerText() {
    if (screen === "menu") return "Pick who is playing.";
    if (screen === "rest") return "The fish are happy.";
    if (screen !== "play") return "Pick who is playing.";
    for (let i = 0; i < tankFish.length; i++) {
      if (fishHungry(tankFish[i])) return "Someone is hungry.";
    }
    const needy = unhappyFish();
    if (needy) {
      const thing = needy.likes === "rocks" ? "rock" : "plant";
      return needy.name + " would like a " + thing + ".";
    }
    return "The fish are swimming.";
  }
  function happyNow() {
    const ids = [];
    if (!bandSpec().wishes) return ids;
    for (let i = 0; i < tankFish.length; i++) {
      if (fishHappy(fishById(tankFish[i]))) ids.push(tankFish[i]);
    }
    return ids;
  }

  function go(id) {
    if (id !== "menu" && id !== "play" && id !== "rest") {
      render();
      return;
    }
    screen = id;
    if (id !== "play") {
      chooser = null;
      pending = -1;
    }
    render();
  }
  function highlight(band) {
    if (!knownBand(band)) {
      render();
      return;
    }
    level = band;
    render();
  }
  function start(band) {
    if (!knownBand(band)) {
      render();
      return;
    }
    level = band;
    const spec = BANDS[band];
    tankFish = spec.fish.slice();
    fedAt = {};
    careMs = 0;
    for (let i = 0; i < tankFish.length; i++) fedAt[tankFish[i]] = 0;
    placed = [];
    for (let i = 0; i < spec.spots; i++) placed.push(null);
    smudges = [];
    smudgeNext = SMUDGE_EVERY_MS;
    smudgeOrder = shuffleSpots(takeSeed());
    smudgeCursor = 0;
    tool = null;
    chooser = null;
    pending = -1;
    flakeAt = -100000;
    go("play");
  }
  function doFeed() {
    if (screen !== "play") {
      render();
      return;
    }
    for (let i = 0; i < tankFish.length; i++) fedAt[tankFish[i]] = careMs;
    flakeAt = clock;
    playFeed();
    render();
  }
  function useTool(name) {
    if (screen !== "play") {
      render();
      return;
    }
    const spec = bandSpec();
    if (spec.tools.indexOf(name) < 0) {
      render();
      return;
    }
    if (name === "feed" && spec.oneStep) {
      tool = null;
      chooser = null;
      pending = -1;
      doFeed();
      return;
    }
    if (tool === name) {
      if (name === "addFish" && chooser !== "fish" && tankFish.length < maxFish()) {
        chooser = "fish";
        pending = -1;
        render();
        return;
      }
      tool = null;
      chooser = null;
      pending = -1;
      render();
      return;
    }
    tool = name;
    pending = -1;
    chooser = name === "addFish" ? "fish" : null;
    render();
  }
  function wipeSmudge(index) {
    if (screen !== "play") {
      render();
      return;
    }
    if (!bandSpec().oneStep && tool !== "clean") {
      render();
      return;
    }
    const at = smudges.indexOf(index);
    if (at < 0) {
      render();
      return;
    }
    smudges.splice(at, 1);
    playSqueak();
    render();
  }
  function openSpot(index) {
    if (screen !== "play" || tool !== "plant") {
      render();
      return;
    }
    if (index < 0 || index >= placed.length) {
      render();
      return;
    }
    pending = index;
    chooser = "decor";
    render();
  }
  function placeDecor(id) {
    if (screen !== "play" || chooser !== "decor" || pending < 0 || pending >= placed.length) {
      render();
      return;
    }
    if (!decorById(id)) {
      render();
      return;
    }

          const fish = fishOf(snap, ids[i]);
          if (!fish) fail("hunger-harmless", ids[i] + " was missing.");
          else if (!fish.hungry) fail("hunger-harmless", ids[i] + " was not hungry after 10 minutes.");
        }
        if (snap.banner !== "Someone is hungry.") fail("hunger-harmless", "The banner was not the hungry line.");
        const ban = ["dead", "sick", "score", "lives", "wrong"];
        const json = JSON.stringify(snap);
        for (let i = 0; i < ban.length; i++) {
          if (json.indexOf(ban[i]) >= 0) fail("hunger-harmless", "state mentioned " + ban[i] + ".");
        }
      }
    });
    run("smudges", function () {
      resetInput();
      seed(1);
      start("little");
      step(10000);
      if (state().smudges.length !== 0) fail("smudges", "A smudge was there at the start.");
      advance(SMUDGE_EVERY_MS);
      if (state().smudges.length !== 1) fail("smudges", "One smudge did not appear at 60 seconds.");
      advance(SMUDGE_EVERY_MS);
      if (state().smudges.length !== 2) fail("smudges", "A second smudge did not appear.");
      advance(SMUDGE_EVERY_MS);
      if (state().smudges.length !== 3) fail("smudges", "A third smudge did not appear.");
      advance(SMUDGE_EVERY_MS);
      if (state().smudges.length !== 3) fail("smudges", "More than 3 smudges appeared.");
      const marks = state().smudges.slice();
      if (targetById(centers().targets, "smudge-" + marks[0])) fail("smudges", "A smudge was a target before Clean.");
      press("smudges", "tool-clean");
      const hit = targetById(centers().targets, "smudge-" + marks[0]);
      if (!hit || !hit.play) fail("smudges", "Clean did not make the smudge a play target.");
      else tap(hit.nx, hit.ny);
      if (state().smudges.indexOf(marks[0]) >= 0 || state().smudges.length !== 2) fail("smudges", "Clean did not wipe the smudge.");
      resetInput();
      seed(1);
      start("tiny");
      step(10000);
      advance(SMUDGE_EVERY_MS);
      const tinyMarks = state().smudges.slice();
      if (state().tool !== null) fail("smudges", "Tiny had a tool selected.");
      const tinyHit = targetById(centers().targets, "smudge-" + tinyMarks[0]);
      if (!tinyHit) fail("smudges", "Tiny hid the smudge target.");
      else tap(tinyHit.nx, tinyHit.ny);
      if (state().smudges.length !== 0) fail("smudges", "Tiny did not wipe without Clean.");
    });
    run("plant-and-swap", function () {
      resetInput();
      seed(1);
      start("little");
      step(10000);
      if (targetById(centers().targets, "spot-0")) fail("plant-and-swap", "A spot was a target before Plant.");
      press("plant-and-swap", "tool-plant");
      if (!targetById(centers().targets, "spot-0") || targetById(centers().targets, "spot-4")) {
        fail("plant-and-swap", "Little Bowl spots were not the bottom four.");
      }
      press("plant-and-swap", "spot-0");
      if (state().chooser !== "decor") fail("plant-and-swap", "The spot did not open the chooser.");
      press("plant-and-swap", "decor-rock");
      if (state().spots[0] !== "rock") fail("plant-and-swap", "Rock was not placed.");
      if (state().chooser !== null) fail("plant-and-swap", "The chooser stayed open.");
      press("plant-and-swap", "spot-0");
      press("plant-and-swap", "decor-weed");
      if (state().spots[0] !== "weed") fail("plant-and-swap", "The filled spot did not swap.");
    });
    run("add-fish-cap", function () {
      resetInput();
      seed(1);
      start("shop");
      step(10000);
      if (state().fish.length !== 3) fail("add-fish-cap", "Big Tank did not start with 3 fish.");
      press("add-fish-cap", "tool-addFish");
      for (let n = 0; n < 3; n++) {
        const list = centers().targets.filter(function (t) { return t.id.indexOf("pick-") === 0; });
        if (!list.length) fail("add-fish-cap", "Add fish offered none before the tank was full.");
        else tap(list[0].nx, list[0].ny);
      }
      if (state().fish.length !== 6) fail("add-fish-cap", "The tank did not reach 6 fish.");
      if (centers().targets.some(function (t) { return t.id.indexOf("pick-") === 0; })) {
        fail("add-fish-cap", "A full tank still offered a fish.");
      }
      press("add-fish-cap", "tool-addFish");
      if (centers().targets.some(function (t) { return t.id.indexOf("pick-") === 0; })) {
        fail("add-fish-cap", "Add fish offered a fish after 6.");
      }
      if (state().fish.length !== 6) fail("add-fish-cap", "The tank grew past 6.");
    });
    run("wishes", function () {
      resetInput();
      seed(1);
      start("rush");
      step(10000);
      press("wishes", "tool-addFish");
      press("wishes", "pick-zip");
      const zip = fishOf(state(), "zip");
      if (!zip || zip.happy) fail("wishes", "Zip was happy before a rock or shell.");
      press("wishes", "tool-plant");
      press("wishes", "spot-0");
      press("wishes", "decor-weed");
      if (fishOf(state(), "zip").happy) fail("wishes", "A plant made Zip happy.");
      if (!fishOf(state(), "goldie").happy) fail("wishes", "A weed did not please Goldie.");
      if (state().banner !== "Stripe would like a rock.") fail("wishes", "The banner did not name the rock wish.");
      press("wishes", "spot-1");
      press("wishes", "decor-rock");
      if (!fishOf(state(), "zip").happy || !fishOf(state(), "stripe").happy) fail("wishes", "A rock did not please Zip.");
      press("wishes", "spot-1");
      press("wishes", "decor-weed");
      if (fishOf(state(), "zip").happy) fail("wishes", "Zip stayed happy after the rock was swapped away.");
      press("wishes", "spot-1");
      press("wishes", "decor-shell");
      if (!fishOf(state(), "zip").happy) fail("wishes", "A shell did not please Zip.");
    });
    run("done-rest", function () {
      resetInput();
      seed(1);
      start("rush");
      step(80000);
      press("done-rest", "done");
      const snap = state();
      if (snap.screen !== "rest" || snap.banner !== "The fish are happy.") fail("done-rest", "Done did not rest.");
      if (restLine.textContent !== "The fish are happy.") fail("done-rest", "Rest did not say the fish are happy.");
      const restText = restEl.innerText || "";
      if (/grade|miss|rank|score|wrong|time/i.test(restText)) fail("done-rest", "Rest showed a grade or a time.");
      const again = targetById(centers().targets, "another");
      if (!again || again.play) fail("done-rest", "Another was missing or marked as play.");
      else tap(again.nx, again.ny);
      if (state().screen !== "play" || state().level !== "rush") fail("done-rest", "Another did not start the same band.");
      if (state().fish.length !== 3) fail("done-rest", "Another did not reset the tank.");
    });
    run("sizes", function () {
      function every(where, w, h, check) {
        const lay = targetsAt(w, h);
        if (!lay.ok) fail("sizes", where + " at " + w + " by " + h + " was not ok (" + layoutFault + ").");
        else check(lay.targets || [], w, h);
      }
      resetInput();
      go("menu");
      every("menu", 390, 700, function (list, w, h) {
        for (let i = 0; i < list.length; i++) {
          if (Math.min(list[i].w, list[i].h) < 72) fail("sizes", list[i].id + " was under 72 on the menu.");
          if (list[i].x < -0.5 || list[i].y < -0.5 || list[i].x + list[i].w > w + 0.5 || list[i].y + list[i].h > h + 0.5) {
            fail("sizes", list[i].id + " was off the menu.");
          }
        }
      });
      every("menu", 1024, 768, function (list) {
        for (let i = 0; i < list.length; i++) {
          if (Math.min(list[i].w, list[i].h) < 72) fail("sizes", list[i].id + " was under 72 on the wide menu.");
        }
      });
      seed(1);
      start("rush");
      step(90000);
      advance(SMUDGE_EVERY_MS * 3);
      press("sizes", "tool-clean");
      const views = [[390, 700], [1024, 768]];
      for (let v = 0; v < views.length; v++) {
        const w = views[v][0];
        const h = views[v][1];
        const lay = targetsAt(w, h);
        if (!lay.ok) fail("sizes", "Clean at " + w + " by " + h + " was not ok (" + layoutFault + ").");
        else {
          const list = lay.targets;
          const want = w >= 1000 ? 112 : 72;
          const toolW = w >= 1000 ? 160 : 83;
          const toolH = w >= 1000 ? 112 : 88;
          for (let i = 0; i < list.length; i++) {
            if (Math.min(list[i].w, list[i].h) < 72) fail("sizes", list[i].id + " was under 72 at " + w + ".");
            if (list[i].x < -0.5 || list[i].y < -0.5 || list[i].x + list[i].w > w + 0.5 || list[i].y + list[i].h > h + 0.5) {
              fail("sizes", list[i].id + " was off the " + w + " by " + h + " page.");
            }
            if (list[i].id.indexOf("smudge-") === 0 && (list[i].w !== want || list[i].h !== want)) {
              fail("sizes", "A smudge was " + list[i].w + " at " + w + ".");
            }
            if (list[i].id.indexOf("tool-") === 0 && (list[i].w !== toolW || list[i].h !== toolH)) {
              fail("sizes", list[i].id + " was " + list[i].w + " by " + list[i].h + " at " + w + ".");
            }
          }
          if (!list.some(function (t) { return t.id.indexOf("smudge-") === 0; })) fail("sizes", "Smudges were missing at " + w + ".");
        }
      }
      press("sizes", "tool-plant");
      for (let v = 0; v < views.length; v++) {
        const lay = targetsAt(views[v][0], views[v][1]);
        const want = views[v][0] >= 1000 ? 112 : 72;
        if (!lay.ok) fail("sizes", "Plant spots were not ok (" + layoutFault + ").");
        else {
          const spots = lay.targets.filter(function (t) { return t.id.indexOf("spot-") === 0; });
          if (spots.length !== 6) fail("sizes", "Reef did not show 6 spots.");
          for (let i = 0; i < spots.length; i++) {
            if (spots[i].w !== want || spots[i].h !== want) fail("sizes", "A spot was not " + want + " px.");
          }
        }
      }
      press("sizes", "spot-0");
      for (let v = 0; v < views.length; v++) {
        const lay = targetsAt(views[v][0], views[v][1]);
        if (!lay.ok) fail("sizes", "The decor chooser was not ok (" + layoutFault + ").");
        else {
          const choices = lay.targets.filter(function (t) { return t.id.indexOf("decor-") === 0; });
          if (choices.length !== 4) fail("sizes", "The decor chooser did not show 4 buttons.");
          for (let i = 0; i < choices.length; i++) {
            if (Math.min(choices[i].w, choices[i].h) < 112) fail("sizes", choices[i].id + " was under 112.");
          }
        }
      }
      go("menu");
      press("sizes", "shop");
      press("sizes", "lets-go");
      press("sizes", "tool-addFish");
      const fishLay = targetsAt(390, 700);
      if (!fishLay.ok) fail("sizes", "The fish chooser was not ok (" + layoutFault + ").");
      else {
        const picks = fishLay.targets.filter(function (t) { return t.id.indexOf("pick-") === 0; });
        if (picks.length < 1) fail("sizes", "The fish chooser was empty.");
        for (let i = 0; i < picks.length; i++) {
          if (Math.min(picks[i].w, picks[i].h) < 112) fail("sizes", "A fish choice was under 112.");
        }
      }
      const root = document.documentElement;
      if (root.scrollWidth > root.clientWidth + 2 || root.scrollHeight > root.clientHeight + 2) {
        fail("sizes", "The page needed scrolling.");
      }
    });
    run("eyes-gap", function () {
      function hit(where, w, h) {
        const lay = targetsAt(w, h);
        const eye = lay && lay.eyes;
        if (!lay.ok || !eye) fail("eyes-gap", where + " at " + w + " by " + h + " had no Eyes box (" + layoutFault + ").");
        else if (eye.w !== 72 || eye.h !== 36) fail("eyes-gap", "The Eyes chip was not 72 by 36.");
        else if (Math.abs(eye.y - (h - 48)) < 1) fail("eyes-gap", "The Eyes chip used the bottom slot.");
        else {
          const list = lay.targets || [];
          for (let i = 0; i < list.length; i++) {
            if (overlaps(eye, list[i])) fail("eyes-gap", where + " Eyes sat on " + list[i].id + " at " + w + " by " + h + ".");
          }
        }
      }
      resetInput();
      go("menu");
      hit("menu", 390, 700);
      hit("menu", 1024, 768);
      seed(1);
      start("rush");
      step(120000);
      advance(SMUDGE_EVERY_MS * 3);
      press("eyes-gap", "tool-plant");
      hit("play", 390, 700);
      hit("play", 1024, 768);
      go("rest");
      hit("rest", 390, 700);
      hit("rest", 1024, 768);
      step(200000);
      look(0.5, 0.02);
      step(200020);
      const liveW = window.innerWidth;
      const liveH = window.innerHeight;
      const live = targetsAt(liveW, liveH);
      const rect = eyesEl.getBoundingClientRect();
      if (eyesEl.hidden) fail("eyes-gap", "The Eyes chip was hidden on the running path.");
      else if (!live.eyes) fail("eyes-gap", "The running path had no Eyes box.");
      else if (Math.abs(rect.left - live.eyes.x) > 1 || Math.abs(rect.top - live.eyes.y) > 1 ||
        Math.abs(rect.width - live.eyes.w) > 1 || Math.abs(rect.height - live.eyes.h) > 1) {
        fail("eyes-gap", "render did not place the Eyes chip in the open gap.");
      } else {
        const buttons = document.querySelectorAll("button");
        for (let i = 0; i < buttons.length; i++) {
          if (!buttonVisible(buttons[i])) continue;
          const r = buttons[i].getBoundingClientRect();
          if (overlaps(
            { x: rect.left, y: rect.top, w: rect.width, h: rect.height },
            { x: r.left, y: r.top, w: r.width, h: r.height }
          )) {
            fail("eyes-gap", "The live Eyes chip sat on " + buttons[i].id + ".");
          }
        }
      }
      releaseLook();
    });
    run("no-speech", function () {
      if (speakCalls !== 0) fail("no-speech", "speechSynthesis.speak was called.");
      if (Object.prototype.hasOwnProperty.call(state(), "speech")) fail("no-speech", "state kept a speech field.");
    });
    run("family-plain-state", function () {
      const before = JSON.stringify(state());
      start("nope");
      go("sideways");
      if (JSON.stringify(state()) !== before) fail("family-plain-state", "An unknown band or screen changed the state.");
      const end = state();
      if (!("level" in end) || !("screen" in end) || !("banner" in end) || !("muted" in end)) {
        fail("family-plain-state", "level, screen, banner, or muted was missing.");
      }
    });
    try { assertJunk("at the end"); }
    catch (err) { fail("family-query-inert", err && err.message ? err.message : "The junk check threw."); }
    try {
      if (writes !== 0) fail("family-no-storage", "The page called setItem or removeItem.");
      if (storeLen !== null && localStorage.length !== storeLen) fail("family-no-storage", "localStorage gained a key.");
      if (storeLen !== null && localStorage.getItem("pop-pals-v1") !== pop) fail("family-no-storage", "pop-pals-v1 changed.");
    } catch (err) {
      fail("family-no-storage", "Storage could not be read.");
    }
    try {
      if (origSet) localStorage.setItem = origSet;
      if (origRem) localStorage.removeItem = origRem;
      if (origSpeak && window.speechSynthesis) window.speechSynthesis.speak = origSpeak;
    } catch (err) {}
    return { ok: failures.length === 0, failures: failures };
  }

  window.fishTank = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    selfCheck: selfCheck
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let result;
    try { result = selfCheck(); }
    catch (err) {
      result = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] };
    }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("rush")) start("rush");
    else if (params.has("play")) start("tiny");
    connectGaze();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
