<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>Sky Keeper</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; touch-action: none; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 28; pointer-events: none;
    background: var(--card); border-radius: 999px; padding: 8px 12px;
    font-weight: 800; font-size: 16px;
  }
  #banner {
    position: fixed; z-index: 25; pointer-events: none;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 6px 14px; font-size: 18px; font-weight: 800;
    text-align: center;
  }
  #menu-card, #rest-card {
    position: fixed; z-index: 2; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #screen-menu, #screen-rest, #play, #menu-copy, #rest-line, h1, p, b, small {
    pointer-events: none;
  }
  #scene, #scene * { pointer-events: none; }
  #menu-copy, #rest-line {
    position: fixed; z-index: 24; margin: 0; text-align: center; overflow: hidden;
  }
  #menu-copy h1 { margin: 0; font-size: 26px; line-height: 28px; }
  #menu-copy p { margin: 0; font-size: 14px; line-height: 16px; }
  #rest-line { font-size: 28px; font-weight: 800; }
  #mute, #full, #back, #lets-go, #tiny, #little, #shop, #rush, #another, #done, #play button {
    position: fixed; z-index: 30; pointer-events: auto;
  }
  #mute, #full, #back {
    z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1; font-size: 15px; line-height: 1.1;
    padding: 4px;
  }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; display: block; }
  #tiny, #little, #shop, #rush {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; color: var(--ink); text-align: left;
    padding: 4px 10px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  #tiny b, #little b, #shop b, #rush b { display: block; font-size: 18px; line-height: 20px; }
  #tiny small, #little small, #shop small, #rush small {
    display: block; font-size: 12px; line-height: 14px; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go, #another, #done {
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink); font-weight: 800;
    box-shadow: 0 5px 0 var(--sun-d); font-size: 26px;
  }
  #play button.cloud {
    border: 3px solid #fff;
    border-radius: 50%;
    padding: 0;
    background: #fff;
    box-shadow: 0 8px 0 #d5dde6;
  }
  #play button.cloud.busy {
    background: #6f86a6;
    border-color: #d5dde6;
    pointer-events: none;
    box-shadow: 0 10px 0 #5c7394;
  }
  #scene {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 1; display: block;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(4px); }
  }
  @keyframes bob-busy {
    0%, 100% { transform: translateY(0) scale(1.08); }
    50% { transform: translateY(4px) scale(1.08); }
  }
  @keyframes drip {
    from { transform: translateY(-6px); }
    to { transform: translateY(6px); }
  }
  @keyframes dance {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  #play button.cloud { animation: bob 3.2s ease-in-out infinite; }
  #play button.cloud.busy { animation: bob-busy 3.2s ease-in-out infinite; }
  .drip { animation: drip 0.9s linear infinite; }
  .dance { animation: dance 0.8s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    #play button.cloud, #play button.cloud.busy, .drip, .dance { animation: none !important; }
    #play button.cloud.busy { transform: scale(1.08); }
  }
</style>
</head>
<body>
<button id="mute" type="button" aria-label="Mute sound">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8l6 8"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner">Pick who is playing.</p>
<section id="screen-menu">
  <div id="menu-card"></div>
  <div id="menu-copy">
    <h1>Sky Keeper</h1>
    <p>You are the sky over a tiny village. Look at a cloud to bring rain.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>Little Sky</b><small>Ages 2 to 3. Two fields.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Village Sky</b><small>Ages 4 to 5. Three fields.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Farm Sky</b><small>Ages 6 to 8. Four fields, thirsty pumpkins.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Weather Keeper</b><small>Ages 9 and up. Not too much rain.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden>
  <svg id="scene" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
  <button id="cloud-0" class="cloud" type="button" data-play="true" data-field="0" aria-label="Wheat cloud"></button>
  <button id="cloud-1" class="cloud" type="button" data-play="true" data-field="1" aria-label="Carrots cloud"></button>
  <button id="cloud-2" class="cloud" type="button" data-play="true" data-field="2" aria-label="Corn cloud"></button>
  <button id="cloud-3" class="cloud" type="button" data-play="true" data-field="3" aria-label="Pumpkins cloud"></button>
  <button id="done" type="button">Done</button>
</div>
<section id="screen-rest" hidden>
  <div id="rest-card"></div>
  <p id="rest-line">The village thanks the sky.</p>
  <button id="another" type="button">Another</button>
</section>
<script>
(function () {
  "use strict";
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const BAND_IDS = ["tiny", "little", "shop", "rush"];
  const CROPS = {
    wheat: { name: "Wheat", drainMs: 10000, colors: { sprout: "#7fbf6a", ripe: "#F0E442" }, shape: "tall thin stalks with grain heads" },
    carrots: { name: "Carrots", drainMs: 10000, colors: { sprout: "#7fbf6a", ripe: "#E69F00" }, shape: "leafy tufts; ripe shows orange tops" },
    corn: { name: "Corn", drainMs: 10000, colors: { sprout: "#7fbf6a", ripe: "#F0E442" }, shape: "tall stalks with broad leaves and cobs" },
    pumpkins: { name: "Pumpkins", drainMs: 6000, colors: { sprout: "#7fbf6a", ripe: "#D55E00" }, shape: "low vines; ripe shows round ribbed pumpkins" }
  };
  const BANDS = {
    tiny: { fields: ["wheat", "carrots"], stageMs: 10000, festivalEvery: 2, tooWet: false },
    little: { fields: ["wheat", "carrots", "corn"], stageMs: 15000, festivalEvery: 3, tooWet: false },
    shop: { fields: ["wheat", "carrots", "corn", "pumpkins"], stageMs: 20000, festivalEvery: 4, tooWet: false },
    rush: { fields: ["wheat", "carrots", "corn", "pumpkins"], stageMs: 20000, festivalEvery: 4, tooWet: true }
  };
  const RAIN_MS = 6000;
  const PLANT_DELAY_MS = 5000;
  const HARVEST_DELAY_MS = 3000;
  const FESTIVAL_MS = 8000;
  const PUDDLE_MS = 10000;
  const FESTIVALS_TO_REST = 3;
  const STAGE_NAME = ["empty", "seed", "sprout", "growing", "ripe"];
  const NS = "http://www.w3.org/2000/svg";

  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const backBtn = document.getElementById("back");
  const eyesEl = document.getElementById("eyes");
  const gazeEl = document.getElementById("gaze");
  const bannerEl = document.getElementById("banner");
  const menuEl = document.getElementById("screen-menu");
  const menuCard = document.getElementById("menu-card");
  const menuCopy = document.getElementById("menu-copy");
  const playEl = document.getElementById("play");
  const restEl = document.getElementById("screen-rest");
  const restCard = document.getElementById("rest-card");
  const restLine = document.getElementById("rest-line");
  const scene = document.getElementById("scene");
  const soundOn = document.getElementById("sound-on");
  const soundOff = document.getElementById("sound-off");
  const doneBtn = document.getElementById("done");
  const anotherBtn = document.getElementById("another");
  const cloudBtns = [0, 1, 2, 3].map(function (i) { return document.getElementById("cloud-" + i); });

  let level = "tiny";
  let screen = "menu";
  let muted = false;
  let fields = [];
  let harvests = 0;
  let sinceFest = 0;
  let festivals = 0;
  let festLeft = 0;
  let baskets = 0;
  let pin = null;
  let checking = false;
  let suppressReconnect = false;
  let clock = 0;
  let ac = null;
  let master = null;
  let rainSrc = null;
  let rainGain = null;
  let rainStop = 0;
  let festNoteAt = 0;
  let festNoteI = 0;
  let pointerDown = false;
  let armedId = null;
  let gazeSock = null;
  let gazeTimer = 0;
  let gazeBuf = new Uint8Array(0);
  let gazeWarp = null;
  let gazeHold = null;
  let refreshHold = false;
  let haveSmooth = false;
  let smoothed = null;
  let gazePoint = null;
  let gazeAt = 0;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;
  let dwellMs = PLAY_DWELL_MS;
  let dwellOffAt = 0;
  let sceneReady = false;
  let skyRect = null;
  let groundRect = null;
  let sunCircle = null;
  let houseNodes = [];
  let barnNode = null;
  let squareNode = null;
  let basketNodes = [];
  let festGroup = null;
  let fieldNodes = [];

  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  function knownBand(band) { return BAND_IDS.indexOf(band) >= 0; }
  function bandSpec() { return BANDS[level] || BANDS.tiny; }
  function stageMs() { return bandSpec().stageMs; }

  function svgEl(name, attrs) {
    const node = document.createElementNS(NS, name);
    if (attrs) {
      for (const k in attrs) node.setAttribute(k, attrs[k]);
    }
    return node;
  }
  function show(node, on) {
    if (!node) return;
    node.setAttribute("visibility", on ? "visible" : "hidden");
  }

  function buildScene() {
    if (sceneReady) return;
    sceneReady = true;
    skyRect = svgEl("rect", { fill: "#c5dff5" });
    groundRect = svgEl("rect", { fill: "#8fbf6a" });
    sunCircle = svgEl("circle", { fill: "#ffc857", stroke: "#e2a62e", "stroke-width": "4" });
    scene.appendChild(skyRect);
    scene.appendChild(sunCircle);
    scene.appendChild(groundRect);
    for (let h = 0; h < 3; h++) {
      const g = svgEl("g");
      g.appendChild(svgEl("rect", { fill: "#fffdf6", stroke: "#2c2416", "stroke-width": "3" }));
      g.appendChild(svgEl("polygon", { fill: "#d55e00", stroke: "#2c2416", "stroke-width": "3" }));
      houseNodes.push(g);
      scene.appendChild(g);
    }
    barnNode = svgEl("g");
    barnNode.appendChild(svgEl("rect", { fill: "#c47b4a", stroke: "#2c2416", "stroke-width": "3" }));
    barnNode.appendChild(svgEl("polygon", { fill: "#8c3b2a", stroke: "#2c2416", "stroke-width": "3" }));
    const barnDoor = svgEl("rect", { fill: "#5c3a22" });
    barnNode.appendChild(barnDoor);
    for (let b = 0; b < 8; b++) {
      const basket = svgEl("g");
      basket.appendChild(svgEl("path", { fill: "#c47b4a", stroke: "#2c2416", "stroke-width": "2" }));
      basket.appendChild(svgEl("path", { fill: "none", stroke: "#2c2416", "stroke-width": "2" }));
      basketNodes.push(basket);
      barnNode.appendChild(basket);
    }
    scene.appendChild(barnNode);
    squareNode = svgEl("rect", { fill: "#e6d3a3", stroke: "#2c2416", "stroke-width": "3", rx: "8" });
    scene.appendChild(squareNode);
    festGroup = svgEl("g");
    for (let i = 0; i < 4; i++) {
      const lamp = svgEl("g");
      lamp.appendChild(svgEl("line", { stroke: "#2c2416", "stroke-width": "2" }));
      lamp.appendChild(svgEl("circle", { fill: "#ffc857", stroke: "#e2a62e", "stroke-width": "2" }));
      festGroup.appendChild(lamp);
    }
    for (let d = 0; d < 3; d++) {
      const dancer = svgEl("g", { class: "dance" });
      dancer.appendChild(svgEl("circle", { fill: "#2458a8", r: "7" }));
      dancer.appendChild(svgEl("path", { fill: "#2458a8", stroke: "#fffdf6", "stroke-width": "2" }));
      festGroup.appendChild(dancer);
    }
    scene.appendChild(festGroup);
    for (let i = 0; i < 4; i++) {
      const g = svgEl("g");
      const soil = svgEl("rect", { fill: "#c4a15a", stroke: "#6b4f2a", "stroke-width": "3", rx: "8" });
      const cracks = svgEl("g");
      for (let c = 0; c < 3; c++) cracks.appendChild(svgEl("path", { fill: "none", stroke: "#6b4f2a", "stroke-width": "2" }));
      const puddle = svgEl("ellipse", { fill: "#7eb6d9", stroke: "#2c2416", "stroke-width": "2" });
      const crop = svgEl("g");
      const seed = svgEl("circle", { fill: "#6b4f2a" });
      const body = svgEl("path", { fill: "#7fbf6a", stroke: "#2c2416", "stroke-width": "2" });
      const fruits = [0, 1, 2].map(function () {
        return svgEl("ellipse", { stroke: "#2c2416", "stroke-width": "2" });
      });
      crop.appendChild(body);
      fruits.forEach(function (fr) { crop.appendChild(fr); });
      crop.appendChild(seed);
      const rain = svgEl("g");
      for (let r = 0; r < 6; r++) {
        rain.appendChild(svgEl("line", { stroke: "#3d7ea6", "stroke-width": "3", "stroke-linecap": "round", class: "drip" }));
      }
      const drops = [0, 1, 2].map(function () {
        return svgEl("path", { stroke: "#1d6fd4", "stroke-width": "2" });
      });
      const sign = svgEl("g");
      sign.appendChild(svgEl("rect", { fill: "#fffdf6", stroke: "#2c2416", "stroke-width": "2", rx: "6" }));
      const label = svgEl("text", {
        fill: "#2c2416",
        "font-family": "Trebuchet MS, Segoe UI, sans-serif",
        "font-size": "13",
        "font-weight": "800",
        "text-anchor": "middle"
      });
      sign.appendChild(label);
      const villager = svgEl("g");
      villager.appendChild(svgEl("circle", { fill: "#f0d2b4", stroke: "#2c2416", "stroke-width": "2", r: "7" }));
      villager.appendChild(svgEl("path", { fill: "#2458a8", stroke: "#2c2416", "stroke-width": "2" }));
      const can = svgEl("g");
      can.appendChild(svgEl("rect", { fill: "#6f86a6", stroke: "#2c2416", "stroke-width": "2" }));
      can.appendChild(svgEl("path", { fill: "none", stroke: "#2c2416", "stroke-width": "2" }));
      villager.appendChild(can);
      const vbasket = svgEl("path", { fill: "#c47b4a", stroke: "#2c2416", "stroke-width": "2" });
      villager.appendChild(vbasket);
      const fieldSun = svgEl("g");
      fieldSun.appendChild(svgEl("circle", { fill: "#ffc857", stroke: "#e2a62e", "stroke-width": "2", r: "8" }));
      for (let s = 0; s < 4; s++) fieldSun.appendChild(svgEl("line", { stroke: "#e2a62e", "stroke-width": "2" }));
      g.appendChild(soil);
      g.appendChild(cracks);
      g.appendChild(puddle);
      g.appendChild(fieldSun);
      g.appendChild(crop);
      g.appendChild(rain);
      drops.forEach(function (d) { g.appendChild(d); });
      g.appendChild(sign);
      g.appendChild(villager);
      scene.appendChild(g);
      fieldNodes.push({
        g: g, soil: soil, cracks: cracks, puddle: puddle, crop: crop, seed: seed, body: body,
        fruits: fruits, rain: rain, drops: drops, sign: sign, label: label, villager: villager,
        can: can, vbasket: vbasket, fieldSun: fieldSun
      });
    }
  }

  function bannerText() {
    if (screen === "menu") return "Pick who is playing.";
    if (screen === "rest") return "The village thanks the sky.";
    if (festLeft > 0) return "Harvest festival!";
    if (fields) {
      for (let i = 0; i < fields.length; i++) {
        if (fields[i].puddle > 0) return "That field is very wet.";
      }
      for (let i = 0; i < fields.length; i++) {
        const f = fields[i];
        if (f.water === 0 && f.stage > 0) {
          return "The " + CROPS[f.crop].name.toLowerCase() + " are thirsty.";
        }
      }
    }
    return "Look at a cloud to bring rain.";
  }

  function resetSitting() {
    const spec = bandSpec();
    fields = spec.fields.map(function (crop) {
      return {
        crop: crop,
        stage: 0,
        water: 3,
        rain: 0,
        puddle: 0,
        drain: 0,
        grow: 0,
        plant: 0,
        harvest: 0
      };
    });
    harvests = 0;
    sinceFest = 0;
    festivals = 0;
    festLeft = 0;
    baskets = 0;
    festNoteAt = 0;
    festNoteI = 0;
  }

  function go(id) {
    if (id !== "menu" && id !== "play" && id !== "rest") {
      render();
      return;
    }
    screen = id;
    render();
  }
  function highlight(band) {
    if (!knownBand(band)) {
      render();
      return;
    }
    level = band;
    render();
  }
  function start(band) {
    if (!knownBand(band)) {
      render();
      return;
    }
    level = band;
    pin = null;
    resetSitting();
    go("play");
  }
  function another() {
    start(level);
  }

  function fieldSnap(f) {
    return {
      crop: f.crop,
      name: CROPS[f.crop].name,
      stage: STAGE_NAME[f.stage],
      water: f.water,
      raining: f.rain > 0,
      thirsty: f.water === 0 && f.stage > 0,
      puddle: f.puddle > 0
    };
  }
  function state() {
    render();
    return {
      level: level,
      screen: screen,
      banner: bannerText(),
      muted: muted,
      fields: fields.map(fieldSnap),
      harvests: harvests,
      festivals: festivals,
      festival: festLeft > 0
    };
  }

  function nextWait() {
    let wait = null;
    function consider(v) {
      if (v > 0 && (wait === null || v < wait)) wait = v;
    }
    if (festLeft > 0) consider(festLeft);
    const sms = stageMs();
    for (let i = 0; i < fields.length; i++) {
      const f = fields[i];
      const drainMs = CROPS[f.crop].drainMs;
      if (f.rain > 0) consider(f.rain);
      if (f.puddle > 0) consider(f.puddle);
      if (f.water > 0) consider(drainMs - f.drain);
      if (f.stage === 0) consider(PLANT_DELAY_MS - f.plant);
      if (f.stage === 4) consider(HARVEST_DELAY_MS - f.harvest);
      if (f.stage >= 1 && f.stage < 4 && f.water > 0 && f.rain <= 0 && f.puddle <= 0) consider(sms - f.grow);
    }
    return wait === null ? 1e15 : wait;
  }
  function applySlice(dt) {
    const sms = stageMs();
    const festOn = festLeft > 0;
    if (festOn) festLeft -= dt;
    for (let i = 0; i < fields.length; i++) {
      const f = fields[i];
      const raining = f.rain > 0;
      const pud = f.puddle > 0;
      const wet = f.water > 0;
      const canGrow = f.stage >= 1 && f.stage < 4 && wet && !raining && !pud;
      if (raining) f.rain -= dt;
      if (pud) f.puddle -= dt;
      if (wet) f.drain += dt;
      if (f.stage === 0) f.plant += dt;
      if (f.stage === 4) f.harvest += dt;
      if (canGrow) f.grow += dt;
    }
    void sms;
  }
  function resolveSlice() {
    let started = false;
    if (festLeft < 1e-6) festLeft = 0;
    const sms = stageMs();
    const every = bandSpec().festivalEvery;
    for (let i = 0; i < fields.length; i++) {
      const f = fields[i];
      const drainMs = CROPS[f.crop].drainMs;
      if (f.rain < 1e-6) f.rain = 0;
      if (f.puddle < 1e-6) f.puddle = 0;
      if (f.stage >= 1 && f.stage < 4 && f.water > 0 && f.rain <= 0 && f.puddle <= 0 && f.grow >= sms) {
        f.stage += 1;
        f.grow = 0;
        f.harvest = 0;
      }

      try { json = JSON.stringify(snap); }
      catch (err) { json = ""; }
      if (!json || json.indexOf("level") < 0 || json.indexOf("screen") < 0 || json.indexOf("banner") < 0 || json.indexOf("muted") < 0) {
        fail("family-plain-state", "state could not be turned into JSON with level, screen, banner, and muted.");
      }
      if (snap.level !== "tiny" || snap.screen !== "menu" || snap.banner !== "Pick who is playing." || snap.muted !== false) {
        fail("family-plain-state", "The menu state did not start on Little Sky.");
      }
      const ban = ["msLeft", "best", "lives", "score", "wrongs", "rank", "speech"];
      for (let i = 0; i < ban.length; i++) {
        if (Object.prototype.hasOwnProperty.call(snap, ban[i])) fail("family-plain-state", "state included " + ban[i] + ".");
      }
    });
    run("family-play-dwell", function () {
      resetInput();
      seed(1);
      start("tiny");
      const box = targetById(centers().targets, "cloud-0");
      if (!box || !box.play) fail("family-play-dwell", "The cloud was not a play target.");
      else {
        step(10000);
        look(box.nx, box.ny);
        step(10000);
        if (dwell() !== 0) fail("family-play-dwell", "The entry step did not start the ring at 0.");
        step(10200);
        if (Math.abs(dwell() - 200 / PLAY_DWELL_MS) > 0.03) fail("family-play-dwell", "The ring at 200 ms was not 200/650.");
        step(10640);
        if (state().fields[0].raining) fail("family-play-dwell", "640 ms started rain.");
        step(10660);
        if (!state().fields[0].raining) fail("family-play-dwell", "660 ms did not start rain.");
      }
      resetInput();
      seed(1);
      start("tiny");
      const tapBox = targetById(centers().targets, "cloud-0");
      tap(tapBox.nx, tapBox.ny);
      if (!state().fields[0].raining) fail("family-play-dwell", "A tap did not start rain.");
    });
    run("family-menu-dwell", function () {
      resetInput();
      if (state().screen !== "menu") go("menu");
      const lets = targetById(centers().targets, "lets-go");
      if (!lets) fail("family-menu-dwell", "Let's go was not a target.");
      else {
        const hit = buttonAt(lets.nx * window.innerWidth, lets.ny * window.innerHeight);
        if (!hit || hit.id !== "lets-go") fail("family-menu-dwell", "The Let's go center was not the button.");
        enterLook(lets, 20000);
        if (dwell() !== 0) fail("family-menu-dwell", "The menu entry step filled the ring.");
        step(20600);
        if (state().screen !== "menu") fail("family-menu-dwell", "600 ms on Let's go left the menu.");
        step(21300);
        if (state().screen !== "play") fail("family-menu-dwell", "1300 ms on Let's go did not open the sky.");
      }
      const back = targetById(centers().targets, "back");
      if (!back) fail("family-menu-dwell", "Back to Menu was not a target.");
      else {
        enterLook(back, 24000);
        step(24600);
        if (state().screen !== "play") fail("family-menu-dwell", "600 ms on Back left the sky.");
        step(25300);
        if (state().screen !== "menu") fail("family-menu-dwell", "1300 ms on Back did not return to the menu.");
      }
    });
    run("family-pointer-blocks", function () {
      resetInput();
      seed(1);
      start("tiny");
      const box = targetById(centers().targets, "cloud-0");
      hold(box.nx, box.ny);
      look(box.nx, box.ny);
      step(30000);
      step(30660);
      if (state().fields[0].raining || dwell() !== 0) fail("family-pointer-blocks", "A look during hold started rain or filled the ring.");
      release();
      releaseLook();
      enterLook(box, 32000);
      step(32660);
      if (!state().fields[0].raining) fail("family-pointer-blocks", "A fresh look after release did not start rain.");
    });
    run("family-stale", function () {
      resetInput();
      seed(1);
      start("tiny");
      const box = targetById(centers().targets, "cloud-0");
      try {
        enterLook(box, 36000);
        step(36200);
        if (!(dwell() > 0) || state().fields[0].raining) fail("family-stale", "The ring did not fill before the sample went stale.");
        refreshHold = false;
        step(36700);
        if (dwell() !== 0) fail("family-stale", "A sample 500 ms old still filled the ring.");
        if (state().fields[0].raining) fail("family-stale", "A stale sample started rain.");
      } finally {
        refreshHold = true;
      }
    });
    run("family-target-size", function () {
      resetInput();
      go("menu");
      function checkView(where) {
        const views = [[390, 844], [1024, 768]];
        for (let v = 0; v < views.length; v++) {
          const lay = targetsAt(views[v][0], views[v][1]);
          if (!lay.ok) fail("family-target-size", where + " at " + views[v][0] + " by " + views[v][1] + " was not ok.");
          const list = lay.targets || [];
          for (let i = 0; i < list.length; i++) {
            if (Math.min(list[i].w, list[i].h) < 72) fail("family-target-size", where + " target " + list[i].id + " was under 72.");
            if (list[i].x < -1 || list[i].y < -1 || list[i].x + list[i].w > views[v][0] + 1 || list[i].y + list[i].h > views[v][1] + 1) {
              fail("family-target-size", where + " target " + list[i].id + " was off the screen.");
            }
          }
        }
        const small = targetsAt(300, 600);
        if (small.ok || (small.targets && small.targets.length)) fail("family-target-size", "A 300 px width was treated as ok.");
      }
      const before = muteBtn.getBoundingClientRect();
      const beforeShort = Math.min(before.width, before.height);
      checkView("menu");
      const after = muteBtn.getBoundingClientRect();
      if (Math.min(after.width, after.height) + 1 < beforeShort) fail("family-target-size", "targetsAt shrank a live button.");
      if (targetById(centers().targets, "back")) fail("family-target-size", "Back was listed on the menu.");
      seed(1);
      start("tiny");
      const liveBefore = targetById(centers().targets, "mute");
      checkView("play");
      const liveAfter = targetById(centers().targets, "mute");
      if (liveBefore && liveAfter && Math.min(liveAfter.w, liveAfter.h) + 1 < Math.min(liveBefore.w, liveBefore.h)) {
        fail("family-target-size", "targetsAt shrank a live play button.");
      }
    });
    run("family-eyes", function () {
      resetInput();
      step(40000);
      look(0.5, 0.5);
      step(40020);
      const eye = eyes();
      const keys = Object.keys(eye);
      if (keys.length !== 2 || keys.indexOf("on") < 0 || keys.indexOf("live") < 0) fail("family-eyes", "eyes() did not return only on and live.");
      if (typeof eye.on !== "boolean" || typeof eye.live !== "boolean") fail("family-eyes", "on or live was not a boolean.");
      if (eye.on !== true || eye.live !== true) fail("family-eyes", "A fresh look did not set on and live.");
      if (gazeSock) fail("family-eyes", "The socket was open.");
      if (eyesEl.hidden || eyesEl.textContent !== "Eyes") fail("family-eyes", "The Eyes chip was hidden or mislabeled.");
      releaseLook();
      if (!eyesEl.hidden) fail("family-eyes", "The Eyes chip stayed up after release.");
    });
    run("family-mute", function () {
      resetInput();
      const muteText = (muteBtn.innerText || "").replace(/\s+/g, "");
      if (muteText !== "") fail("family-mute", "The mute button had visible text.");
      if ((muteBtn.innerText || "").indexOf("Mute") >= 0 || (muteBtn.innerText || "").indexOf("Sound") >= 0) {
        fail("family-mute", "Mute or Sound was visible.");
      }
      if (muteBtn.querySelectorAll("svg").length !== 2) fail("family-mute", "The mute button did not hold two speaker icons.");
      if (state().muted !== false) fail("family-mute", "Sound did not start on.");
      const box = targetById(centers().targets, "mute");
      tap(box.nx, box.ny);
      if (state().muted !== true) fail("family-mute", "The first tap did not mute.");
      tap(box.nx, box.ny);
      if (state().muted !== false) fail("family-mute", "The second tap did not turn sound on.");
    });
    run("rain-dwell", function () {
      const t = fresh("tiny");
      step(t + 10000);
      const box = targetById(centers().targets, "cloud-0");
      if (!box) fail("rain-dwell", "The wheat cloud was missing.");
      else {
        if (state().fields[0].water !== 2) fail("rain-dwell", "Water was not 2 before the look.");
        const nx = box.nx;
        const ny = box.ny;
        step(t + 10000);
        look(nx, ny);
        step(t + 10000);
        step(t + 10640);
        if (state().fields[0].raining || state().fields[0].water !== 2) fail("rain-dwell", "640 ms started rain or changed the water.");
        releaseLook();
        step(t + 10640);
        look(nx, ny);
        step(t + 10640);
        step(t + 11300);
        const poured = state().fields[0];
        if (!poured.raining || poured.water !== 3) fail("rain-dwell", "660 ms did not start rain or set water to 3.");
        releaseLook();
        const t2 = t + 11300;
        step(t2);
        look(nx, ny);
        step(t2);
        step(t2 + 660);
        if (dwell() !== 0) fail("rain-dwell", "A raining cloud took a look.");
        step(t2 + 6000);
        if (state().fields[0].raining) fail("rain-dwell", "A second look kept the rain going.");
      }
    });
    run("drain", function () {
      const t = fresh("tiny");
      const wheat = targetById(centers().targets, "cloud-0");
      tap(wheat.nx, wheat.ny);
      if (state().fields[0].water !== 3) fail("drain", "Rain did not set wheat water to 3.");
      step(t + 10000);
      if (state().fields[0].water !== 2) fail("drain", "Wheat water did not drop after 10 s.");
      step(t + 20000);
      if (state().fields[0].water !== 1) fail("drain", "Wheat water did not drop to 1.");
      step(t + 30000);
      if (state().fields[0].water !== 0) fail("drain", "Wheat water did not stop at 0.");
      step(t + 40000);
      if (state().fields[0].water !== 0) fail("drain", "Wheat water fell below 0.");
      const u = fresh("shop");
      const pump = targetById(centers().targets, "cloud-3");
      if (!pump || state().fields[3].crop !== "pumpkins") fail("drain", "The pumpkin cloud was missing.");
      else {
        tap(pump.nx, pump.ny);
        step(u + 6000);
        if (state().fields[3].water !== 2) fail("drain", "Pumpkin water did not drop after 6 s.");
        step(u + 12000);
        if (state().fields[3].water !== 1) fail("drain", "Pumpkin water did not drop to 1.");
        step(u + 18000);
        if (state().fields[3].water !== 0) fail("drain", "Pumpkin water did not stop at 0.");
        step(u + 24000);
        if (state().fields[3].water !== 0) fail("drain", "Pumpkin water fell below 0.");
      }
    });
    run("grow-and-pause", function () {
      const t = fresh("tiny");
      step(t + 5000);
      if (state().fields[0].stage !== "seed") fail("grow-and-pause", "Tiny wheat was not a seed at 5 s.");
      step(t + 15000);
      if (state().fields[0].stage !== "sprout") fail("grow-and-pause", "Tiny wheat did not grow one stage in 10 s of sun.");
      step(t + 30000);
      const held = state().fields[0];
      if (held.water !== 0) fail("grow-and-pause", "Tiny wheat was not thirsty.");
      if (held.stage === "empty") fail("grow-and-pause", "The thirsty crop was cleared.");
      const stage = held.stage;
      step(t + 40000);
      if (state().fields[0].stage !== stage) fail("grow-and-pause", "A thirsty field kept growing.");
      const u = fresh("little");
      step(u + 5000);
      if (state().fields[0].stage !== "seed") fail("grow-and-pause", "Village wheat was not planted.");
      step(u + 15000);
      if (state().fields[0].stage !== "seed") fail("grow-and-pause", "Village wheat grew before its 15 s stage.");
      step(u + 20000);
      if (state().fields[0].stage !== "sprout") fail("grow-and-pause", "Village wheat did not grow after 15 s of sun.");
    });
    run("villagers", function () {
      const t = fresh("tiny");
      step(t + 4999);
      if (state().fields[0].stage !== "empty") fail("villagers", "The field was planted before 5 s.");
      step(t + 5000);
      if (state().fields[0].stage !== "seed" || state().fields[1].stage !== "seed") fail("villagers", "An empty field was not planted at 5 s.");
      step(t + 25000);
      const wheat = targetById(centers().targets, "cloud-0");
      const carrots = targetById(centers().targets, "cloud-1");
      tap(wheat.nx, wheat.ny);
      tap(carrots.nx, carrots.ny);
      step(t + 41000);
      if (state().fields[0].stage !== "ripe" || state().fields[1].stage !== "ripe") fail("villagers", "The watered fields were not ripe.");
      step(t + 43999);
      if (state().fields[0].stage !== "ripe") fail("villagers", "The ripe field was harvested before 3 s.");
      step(t + 44000);
      if (state().fields[0].stage !== "empty" || state().fields[1].stage !== "empty") fail("villagers", "A ripe field was not empty after 3 s.");
    });
    run("festival", function () {
      const t = fresh("tiny");
      step(t + 25000);
      const a = targetById(centers().targets, "cloud-0");
      const b = targetById(centers().targets, "cloud-1");
      tap(a.nx, a.ny);
      tap(b.nx, b.ny);
      step(t + 43999);
      if (state().banner === "Harvest festival!") fail("festival", "The festival started before the second harvest.");
      step(t + 44000);
      if (state().banner !== "Harvest festival!" || state().screen !== "play") fail("festival", "Two harvests did not start the festival.");
      step(t + 51999);
      if (state().banner !== "Harvest festival!") fail("festival", "The festival ended before 8 s.");
      step(t + 52000);
      if (state().banner === "Harvest festival!") fail("festival", "The festival lasted past 8 s.");
      if (state().screen !== "play") fail("festival", "One festival ended the sky.");
    });
    run("too-wet", function () {
      const t = fresh("rush");
      const cloud = targetById(centers().targets, "cloud-0");
      tap(cloud.nx, cloud.ny);
      if (!state().fields[0].puddle || state().fields[0].water !== 3) fail("too-wet", "Rain on a full Weather Keeper field did not make a puddle.");
      if (state().banner !== "That field is very wet.") fail("too-wet", "The wet banner was missing.");
      step(t + 10000);
      if (state().fields[0].puddle) fail("too-wet", "The puddle stayed past 10 s.");
      step(t + 26000);
      if (state().fields[0].stage !== "seed") fail("too-wet", "The puddle did not pause growth.");
      step(t + 30000);
      if (state().fields[0].stage !== "sprout") fail("too-wet", "Growth did not resume after the puddle.");
      const u = fresh("shop");
      const shopCloud = targetById(centers().targets, "cloud-0");
      tap(shopCloud.nx, shopCloud.ny);
      if (state().fields[0].puddle) fail("too-wet", "Farm Sky made a puddle.");
      step(u + 26000);
      if (state().fields[0].stage !== "sprout") fail("too-wet", "Farm Sky did not grow after ordinary rain.");
    });
    run("rest", function () {
      const t = fresh("tiny");
      const done = targetById(centers().targets, "done");
      if (!done) fail("rest", "Done was not a target.");
      else {
        tap(done.nx, done.ny);
        if (state().screen !== "rest") fail("rest", "Done did not open the rest screen.");
        if (state().banner !== "The village thanks the sky.") fail("rest", "The rest line was missing.");
      }
      const u = fresh("tiny");
      let now = u;
      let guard = 0;
      while (state().screen === "play" && guard < 12) {
        guard += 1;
        step(now + 20000);
        now += 20000;
        const snap = state();
        for (let i = 0; i < snap.fields.length; i++) {
          if (snap.fields[i].water <= 1 && !snap.fields[i].raining) {
            const box = targetById(centers().targets, "cloud-" + i);
            if (box) tap(box.nx, box.ny);
          }
        }
      }
      if (state().screen !== "rest") fail("rest", "Three festivals did not open the rest screen.");
    });
    run("sizes", function () {
      const views = [[390, 700], [1024, 768]];
      const phone = { tiny: [150, 100, 2], little: [110, 90, 3], shop: [83, 80, 4], rush: [83, 80, 4] };
      const bands = ["tiny", "little", "shop", "rush"];
      for (let b = 0; b < bands.length; b++) {
        start(bands[b]);
        for (let v = 0; v < views.length; v++) {
          const w = views[v][0];
          const h = views[v][1];
          const lay = targetsAt(w, h);
          if (!lay.ok) fail("sizes", bands[b] + " at " + w + " by " + h + " was not ok.");
          const clouds = (lay.targets || []).filter(function (t) { return t.id.indexOf("cloud-") === 0; });
          const expectN = phone[bands[b]][2];
          if (clouds.length !== expectN) fail("sizes", bands[b] + " listed " + clouds.length + " clouds.");
          clouds.sort(function (a, c) { return a.x - c.x; });
          for (let i = 0; i < clouds.length; i++) {
            const c = clouds[i];
            if (Math.min(c.w, c.h) < 72) fail("sizes", c.id + " was under 72.");
            if (c.x < 16 || c.y < 16 || c.x + c.w > w - 16 || c.y + c.h > h - 16) fail("sizes", c.id + " left the 16 px margin.");
            if (i > 0) {
              const gap = c.x - (clouds[i - 1].x + clouds[i - 1].w);
              if (gap < 8) fail("sizes", "Clouds were closer than 8 px.");
            }
            if (w === 390) {
              if (c.w !== phone[bands[b]][0] || c.h !== phone[bands[b]][1]) {
                fail("sizes", bands[b] + " cloud was " + c.w + " by " + c.h + ".");
              }
            } else if (c.w > 200 || c.h > 120) {
              fail("sizes", "A wide cloud was over 200 by 120.");
            }
          }
          const cards = [];
          const eyes = eyesBox(w, h, (lay.targets || []).concat(cards));
          for (let i = 0; i < lay.targets.length; i++) {
            if (overlaps(eyes, lay.targets[i])) fail("sizes", "Eyes sat on " + lay.targets[i].id + " at " + w + " by " + h + ".");
          }
        }
      }
      go("menu");
      for (let v = 0; v < views.length; v++) {
        const w = views[v][0];
        const h = views[v][1];
        const lay = targetsAt(w, h);
        const menu = menuLayout(w, h);
        const eyes = eyesBox(w, h, (lay.targets || []).concat([menu.card]));
        if (overlaps(eyes, menu.card)) fail("sizes", "Eyes sat on the menu card at " + w + " by " + h + ".");
        for (let i = 0; i < lay.targets.length; i++) {
          if (overlaps(eyes, lay.targets[i])) fail("sizes", "Eyes sat on " + lay.targets[i].id + ".");
        }
      }
    });
    run("family-plain-state", function () {
      const before = JSON.stringify(state());
      start("nope");
      go("sideways");
      if (JSON.stringify(state()) !== before) fail("family-plain-state", "An unknown band or screen changed the state.");
      const end = state();
      if (!("level" in end) || !("screen" in end) || !("banner" in end) || !("muted" in end)) {
        fail("family-plain-state", "level, screen, banner, or muted was missing.");
      }
    });
    try { assertJunk("at the end"); }
    catch (err) { fail("family-query-inert", err && err.message ? err.message : "The junk check threw."); }
    try {
      if (writes !== 0) fail("family-no-storage", "The page called setItem or removeItem.");
      if (storeLen !== null && localStorage.length !== storeLen) fail("family-no-storage", "localStorage gained a key.");
      if (storeLen !== null && localStorage.getItem("pop-pals-v1") !== pop) fail("family-no-storage", "pop-pals-v1 changed.");
    } catch (err) {
      fail("family-no-storage", "Storage could not be read.");
    }
    try {
      if (origSet) localStorage.setItem = origSet;
      if (origRem) localStorage.removeItem = origRem;
      if (origSpeak && window.speechSynthesis) window.speechSynthesis.speak = origSpeak;
    } catch (err) {}
    return { ok: failures.length === 0, failures: failures };
  }

  window.skyKeeper = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    selfCheck: selfCheck
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let result;
    try { result = selfCheck(); }
    catch (err) {
      result = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] };
    }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("rush")) start("rush");
    else if (params.has("play")) start("tiny");
    connectGaze();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
