<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f0d8">
<title>Coloring Book</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; color: var(--ink); }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #paint, #lines, #look-img {
    position: fixed; z-index: 2; display: block; background: #fffdf6;
  }
  #lines { z-index: 3; pointer-events: none; background: transparent; }
  #look-img { z-index: 4; object-fit: contain; background: var(--paper); pointer-events: none; }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border: none; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 47; pointer-events: none;
    top: 18px; left: 168px;
    background: var(--card); border-radius: 999px; padding: 6px 12px;
    font-weight: 800; font-size: 16px;
  }
  #banner {
    position: fixed; z-index: 40; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); border: 3px solid var(--ink); border-radius: 999px;
    padding: 4px 12px; font-size: clamp(13px, 1.6vw, 20px); font-weight: 800;
    text-align: center; overflow: hidden;
  }
  #screen-menu {
    position: fixed; z-index: 20; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #menu-copy h1 { margin: 0; text-align: center; }
  #menu-copy p { margin: 0; text-align: center; }
  #mute, #full, #back, #lets-go, #pictures, #keep, #new-picture, #put-away,
  #tiny, #little, #shop, #rush, #dock button {
    position: fixed; z-index: 30; pointer-events: auto;
  }
  #mute, #full, #back {
    z-index: 46; border: none; border-radius: 18px;
    background: var(--card); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1;
  }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; }
  #tiny, #little, #shop, #rush, #dock button.choice {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; text-align: left; padding: 6px 12px;
    box-shadow: 0 4px 0 #e2d0b4; font-weight: 800;
  }
  #tiny b, #little b, #shop b, #rush b, #dock button.choice b { display: block; }
  #tiny small, #little small, #shop small, #rush small, #dock button.choice small {
    display: block; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go, #pictures, #keep, #new-picture, #put-away, #dock button.gold {
    border: none; border-radius: 18px; background: var(--sun);
    font-weight: 800; box-shadow: 0 5px 0 var(--sun-d);
  }
  #dock button.dot {
    border: 3px solid var(--ink); border-radius: 50%; padding: 0;
    box-shadow: 0 4px 0 #d5c4a1;
  }
  #dock button.dot[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--ink); }
  #dock button.thumb {
    border: 3px solid var(--ink); border-radius: 16px; padding: 0;
    background: #fffdf6 center / cover no-repeat;
  }
  #screen-menu button { pointer-events: auto; position: fixed; }
</style>
</head>
<body>
<canvas id="paint" hidden></canvas>
<canvas id="lines" hidden></canvas>
<img id="look-img" alt="" hidden>
<button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/>
  </svg>
</button>
<button id="full" type="button" aria-label="Fullscreen">Full</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner" hidden></p>
<section id="screen-menu">
  <div id="menu-copy">
    <h1>Coloring Book</h1>
    <p>Look at a color.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>Big Dots</b><small>Ages 2 to 3. Four big colors. A simple picture.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Fat Crayons</b><small>Ages 4 to 5. Six colors. A few pictures.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Color Box</b><small>Ages 6 to 8. More colors. Free draw or a theme.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Sketchbook</b><small>Ages 9 and up. Smaller colors. Free draw or a busier picture.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<button id="pictures" type="button" hidden>Your pictures</button>
<button id="keep" type="button" hidden>Keep</button>
<button id="new-picture" type="button" hidden>New picture</button>
<button id="put-away" type="button" hidden>Put away</button>
<div id="dock"></div>
<script>
(function () {
  "use strict";
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const STORE = "coloring-book-v1";
  const PALETTE = [
    { id: "red", hex: "#e23d3d", name: "Red" },
    { id: "yellow", hex: "#f2c14e", name: "Yellow" },
    { id: "blue", hex: "#3a7bd5", name: "Blue" },
    { id: "green", hex: "#3c9a4a", name: "Green" },
    { id: "orange", hex: "#f08a24", name: "Orange" },
    { id: "purple", hex: "#7a4ea3", name: "Purple" },
    { id: "pink", hex: "#e56aa0", name: "Pink" },
    { id: "brown", hex: "#8a5a32", name: "Brown" },
    { id: "black", hex: "#2c2416", name: "Black" },
    { id: "white", hex: "#fffdf8", name: "White" },
    { id: "teal", hex: "#2a9d8f", name: "Teal" },
    { id: "gold", hex: "#e2a62e", name: "Gold" },
    { id: "peach", hex: "#f4a582", name: "Peach" },
    { id: "gray", hex: "#8d8478", name: "Gray" }
  ];
  const THEMES = {
    sunny: {
      name: "Sunny Day",
      bands: ["tiny", "little", "shop", "rush"],
      shapes: [
        { kind: "circle", cx: 0.22, cy: 0.22, r: 0.1 },
        { kind: "rays", cx: 0.22, cy: 0.22, r: 0.12, n: 8, len: 0.06 },
        { kind: "ellipse", cx: 0.68, cy: 0.22, rx: 0.14, ry: 0.07 },
        { kind: "ellipse", cx: 0.78, cy: 0.18, rx: 0.09, ry: 0.055 },
        { kind: "polygon", pts: [[0.06, 0.78], [0.94, 0.78], [0.94, 0.94], [0.06, 0.94]] },
        { kind: "polygon", pts: [[0.36, 0.58], [0.64, 0.58], [0.64, 0.8], [0.36, 0.8]] },
        { kind: "polygon", pts: [[0.32, 0.58], [0.5, 0.42], [0.68, 0.58]] },
        { kind: "polygon", pts: [[0.46, 0.66], [0.55, 0.66], [0.55, 0.8], [0.46, 0.8]] },
        { kind: "polygon", pts: [[0.39, 0.62], [0.46, 0.62], [0.46, 0.7], [0.39, 0.7]] }
      ]
    },
    flower: {
      name: "Flower",
      bands: ["tiny", "little", "shop", "rush"],
      shapes: [
        { kind: "polygon", pts: [[0.47, 0.48], [0.53, 0.48], [0.53, 0.86], [0.47, 0.86]] },
        { kind: "ellipse", cx: 0.34, cy: 0.66, rx: 0.12, ry: 0.06 },
        { kind: "ellipse", cx: 0.66, cy: 0.7, rx: 0.12, ry: 0.06 },
        { kind: "circle", cx: 0.5, cy: 0.3, r: 0.08 },
        { kind: "circle", cx: 0.38, cy: 0.38, r: 0.08 },
        { kind: "circle", cx: 0.62, cy: 0.38, r: 0.08 },
        { kind: "circle", cx: 0.4, cy: 0.22, r: 0.08 },
        { kind: "circle", cx: 0.6, cy: 0.22, r: 0.08 },
        { kind: "circle", cx: 0.5, cy: 0.32, r: 0.045 }
      ]
    },
    fish: {
      name: "Fish",
      bands: ["little", "shop", "rush"],
      shapes: [
        { kind: "ellipse", cx: 0.48, cy: 0.52, rx: 0.24, ry: 0.16 },
        { kind: "polygon", pts: [[0.7, 0.52], [0.9, 0.34], [0.9, 0.7]] },
        { kind: "polygon", pts: [[0.42, 0.38], [0.56, 0.38], [0.48, 0.24]] },
        { kind: "circle", cx: 0.34, cy: 0.48, r: 0.035 }
      ]
    },
    picnic: {
      name: "Picnic",
      bands: ["shop", "rush"],
      shapes: [
        { kind: "circle", cx: 0.16, cy: 0.18, r: 0.08 },
        { kind: "rays", cx: 0.16, cy: 0.18, r: 0.09, n: 8, len: 0.04 },
        { kind: "circle", cx: 0.78, cy: 0.32, r: 0.14 },
        { kind: "polygon", pts: [[0.74, 0.42], [0.82, 0.42], [0.82, 0.72], [0.74, 0.72]] },
        { kind: "polygon", pts: [[0.18, 0.62], [0.62, 0.62], [0.62, 0.86], [0.18, 0.86]] },
        { kind: "ellipse", cx: 0.32, cy: 0.7, rx: 0.08, ry: 0.05 },
        { kind: "circle", cx: 0.48, cy: 0.7, r: 0.045 },
        { kind: "polygon", pts: [[0.4, 0.76], [0.5, 0.76], [0.5, 0.84], [0.4, 0.84]] }
      ]
    },
    cat: {
      name: "Cat",
      bands: ["shop", "rush"],
      shapes: [
        { kind: "ellipse", cx: 0.5, cy: 0.66, rx: 0.22, ry: 0.16 },
        { kind: "circle", cx: 0.5, cy: 0.4, r: 0.14 },
        { kind: "polygon", pts: [[0.38, 0.32], [0.44, 0.16], [0.5, 0.32]] },
        { kind: "polygon", pts: [[0.5, 0.32], [0.56, 0.16], [0.62, 0.32]] },
        { kind: "polygon", pts: [[0.68, 0.62], [0.88, 0.5], [0.84, 0.7], [0.68, 0.74]] },
        { kind: "circle", cx: 0.44, cy: 0.38, r: 0.02 },
        { kind: "circle", cx: 0.56, cy: 0.38, r: 0.02 }
      ]
    }
  };

  const paintCanvas = document.getElementById("paint");
  const lineCanvas = document.getElementById("lines");
  const paintCtx = paintCanvas.getContext("2d");
  const lineCtx = lineCanvas.getContext("2d");
  const lookImg = document.getElementById("look-img");
  const menuEl = document.getElementById("screen-menu");
  const dock = document.getElementById("dock");
  const bannerEl = document.getElementById("banner");
  const eyesEl = document.getElementById("eyes");
  const gazeEl = document.getElementById("gaze");
  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const backBtn = document.getElementById("back");
  const picturesBtn = document.getElementById("pictures");
  const keepBtn = document.getElementById("keep");
  const newBtn = document.getElementById("new-picture");
  const awayBtn = document.getElementById("put-away");
  const soundOn = document.getElementById("sound-on");
  const soundOff = document.getElementById("sound-off");

  let level = "tiny";
  let screenId = "menu";
  let mode = null;
  let themeId = null;
  let colorId = null;
  let album = [];
  let lookId = null;
  let muted = false;
  let drawing = false;
  let stamp = 1;
  let builtKey = "";
  let lineKey = "";
  let pageRect = null;
  let brushCursor = null;
  let pointerPaint = false;
  let strokeOn = false;
  let strokeArm = 0;
  let strokeOffAt = 0;
  let checking = false;
  let suppressReconnect = false;
  let clock = 0;
  let audioCtx = null;
  let audioFailed = false;
  let gazeSock = null;
  let gazeBuf = new Uint8Array(0);
  let gazeWarp = null;
  let gazeHold = null;
  let gazePoint = null;
  let gazeAt = 0;
  let smoothed = null;
  let haveSmooth = false;
  let refreshHold = false;
  let pointerActive = false;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;
  let dwellMs = PLAY_DWELL_MS;
  let viaGaze = false;
  let storageWrites = 0;

  function colorsFor(band) {
    const n = band === "tiny" ? 4 : band === "little" ? 6 : band === "shop" ? 10 : 14;
    return PALETTE.slice(0, n);
  }
  function dotWant(band) {
    if (band === "tiny") return 150;
    if (band === "little") return 120;
    if (band === "shop") return 92;
    return 76;
  }
  function themesFor(band) {
    const out = [];
    const ids = ["sunny", "flower", "fish", "picnic", "cat"];
    for (let i = 0; i < ids.length; i++) {
      if (THEMES[ids[i]].bands.indexOf(band) >= 0) out.push(THEMES[ids[i]] === THEMES[ids[i]] ? ids[i] : ids[i]);
    }
    return out;
  }
  function colorById(id) {
    for (let i = 0; i < PALETTE.length; i++) if (PALETTE[i].id === id) return PALETTE[i];
    return null;
  }
  function bannerText() {
    if (screenId === "menu") return "";
    if (screenId === "pick") return "Look at a picture.";
    if (screenId === "album") return album.length ? "Look at a picture you kept." : "No pictures yet.";
    if (screenId === "look") return "That is your picture.";
    if (mode === "free") return "Look at a color, then draw.";
    return "Look at a color, then color the picture.";
  }
  function brushRadius() {
    if (!pageRect) return 18;
    const s = Math.min(pageRect.w, pageRect.h);
    if (level === "tiny") return Math.max(16, s * 0.07);
    if (level === "little") return Math.max(14, s * 0.055);
    if (level === "shop") return Math.max(12, s * 0.04);
    return Math.max(10, s * 0.028);
  }
  function loadAlbum() {
    try {
      const raw = localStorage.getItem(STORE);
      const parsed = raw ? JSON.parse(raw) : [];
      album = [];
      if (!Array.isArray(parsed)) return;
      for (let i = 0; i < parsed.length; i++) {
        const item = parsed[i];
        if (!item || typeof item.id !== "string" || typeof item.url !== "string") continue;
        if (item.url.indexOf("data:image/jpeg") !== 0) continue;
        album.push({ id: item.id, band: item.band || "", theme: item.theme || "", url: item.url });
      }
    } catch (err) {
      album = [];
    }
  }
  function persist() {
    try {
      localStorage.setItem(STORE, JSON.stringify(album));
      storageWrites += 1;
    } catch (err) {}
  }
  function traceShape(ctx, shape, w, h) {
    if (shape.kind === "circle") {
      ctx.beginPath();
      ctx.arc(shape.cx * w, shape.cy * h, shape.r * Math.min(w, h), 0, Math.PI * 2);
      return true;
    }
    if (shape.kind === "ellipse") {
      ctx.beginPath();
      ctx.ellipse(shape.cx * w, shape.cy * h, Math.max(1, shape.rx * w), Math.max(1, shape.ry * h), 0, 0, Math.PI * 2);
      return true;
    }
    if (shape.kind === "polygon" && shape.pts && shape.pts.length) {
      ctx.beginPath();
      ctx.moveTo(shape.pts[0][0] * w, shape.pts[0][1] * h);
      for (let i = 1; i < shape.pts.length; i++) ctx.lineTo(shape.pts[i][0] * w, shape.pts[i][1] * h);
      ctx.closePath();
      return true;
    }
    if (shape.kind === "rays") {
      const cx = shape.cx * w;
      const cy = shape.cy * h;
      const inner = shape.r * Math.min(w, h);
      const outer = inner + shape.len * Math.min(w, h);
      ctx.beginPath();
      for (let i = 0; i < shape.n; i++) {
        const a = (Math.PI * 2 * i) / shape.n - Math.PI / 2;
        ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
        ctx.lineTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
      }
      return false;
    }
    return false;
  }
  function drawLines() {
    const w = lineCanvas.width;
    const h = lineCanvas.height;
    lineCtx.clearRect(0, 0, w, h);
    if (mode !== "theme" || !THEMES[themeId]) return;
    lineCtx.strokeStyle = "#2c2416";
    lineCtx.lineWidth = Math.max(3, Math.min(w, h) * 0.012);
    lineCtx.lineJoin = "round";
    lineCtx.lineCap = "round";
    const shapes = THEMES[themeId].shapes;
    for (let i = 0; i < shapes.length; i++) {
      const closed = traceShape(lineCtx, shapes[i], w, h);
      lineCtx.stroke();
      if (!closed) lineCtx.beginPath();
    }
  }
  function clearPaint() {
    paintCtx.fillStyle = "#fffdf6";
    paintCtx.fillRect(0, 0, paintCanvas.width, paintCanvas.height);
  }
  function resizeSurfaces(rect) {
    const w = Math.max(1, Math.floor(rect.w));
    const h = Math.max(1, Math.floor(rect.h));
    const sizeChanged = paintCanvas.width !== w || paintCanvas.height !== h;
    paintCanvas.style.left = rect.x + "px";
    paintCanvas.style.top = rect.y + "px";
    paintCanvas.style.width = w + "px";
    paintCanvas.style.height = h + "px";
    lineCanvas.style.left = rect.x + "px";
    lineCanvas.style.top = rect.y + "px";
    lineCanvas.style.width = w + "px";
    lineCanvas.style.height = h + "px";
    if (sizeChanged) {
      const snap = document.createElement("canvas");
      snap.width = paintCanvas.width;
      snap.height = paintCanvas.height;
      snap.getContext("2d").drawImage(paintCanvas, 0, 0);
      paintCanvas.width = w;
      paintCanvas.height = h;
      lineCanvas.width = w;
      lineCanvas.height = h;
      paintCtx.fillStyle = "#fffdf6";
      paintCtx.fillRect(0, 0, w, h);
      if (snap.width > 1 && snap.height > 1) paintCtx.drawImage(snap, 0, 0, w, h);
      lineKey = "";
    }
    pageRect = { x: rect.x, y: rect.y, w: w, h: h };
    if (!brushCursor) brushCursor = { x: w / 2, y: h / 2 };
  }
  function paintAt(x, y) {
    if (screenId !== "page" || !colorId || !pageRect) return false;
    const color = colorById(colorId);
    if (!color) return false;
    const px = Math.max(0, Math.min(pageRect.w, x));
    const py = Math.max(0, Math.min(pageRect.h, y));
    paintCtx.fillStyle = color.hex;
    paintCtx.beginPath();
    paintCtx.arc(px, py, brushRadius(), 0, Math.PI * 2);
    paintCtx.fill();
    drawing = true;
    brushCursor = { x: px, y: py };
    return true;
  }
  function packSide(count, colH, want, pageLimit) {
    const gap = 10;
    let best = null;
    for (let cols = 1; cols <= 3; cols++) {
      const rows = Math.ceil(count / cols);
      const room = Math.floor((colH - gap * (rows - 1)) / rows);
      const dot = Math.min(want, room);
      if (dot < 48) continue;
      const trayW = cols * dot + (cols - 1) * gap;
      if (trayW > pageLimit) continue;
      if (!best || dot > best.dot) best = { cols: cols, rows: rows, dot: dot, trayW: trayW };
    }
    return best;
  }
  function layout(w, h) {
    const items = [];
    const edge = 12;
    const top = 88;
    items.push({ id: "mute", x: 8, y: 8, w: 72, h: 72 });
    items.push({ id: "full", x: 88, y: 8, w: 72, h: 72 });
    if (screenId !== "menu") {
      const backW = Math.max(120, Math.min(180, Math.floor(w * 0.16)));
      items.push({ id: "back", x: w - 8 - backW, y: 8, w: backW, h: 72 });
      items.push({ id: "banner", x: 168, y: 8, w: Math.max(80, w - 176 - backW), h: 72, banner: true });
    }
    const page = { x: edge, y: top, w: Math.max(40, w - edge * 2), h: Math.max(40, h - top - edge) };
    if (screenId === "menu") {
      const cardW = Math.min(520, Math.max(200, w - 24));
      const x0 = Math.floor((w - cardW) / 2);
      const btnH = Math.max(64, Math.min(92, Math.floor((h - 160) / 7)));
      let y = 24;
      items.push({ id: "menu", x: x0, y: 16, w: cardW, h: h - 32, menu: true });
      const ids = ["tiny", "little", "shop", "rush", "lets-go", "pictures"];
      for (let i = 0; i < ids.length; i++) {
        items.push({ id: ids[i], x: x0 + 16, y: y + 92, w: cardW - 32, h: btnH });
        y += btnH + 8;
      }
      return { items: items, page: null, dot: 0 };
    }
    if (screenId === "pick") {
      const choices = themesFor(level).slice();
      if (level === "shop" || level === "rush") choices.unshift("free");
      const btnH = Math.max(64, Math.min(88, Math.floor((h - top - 24) / (choices.length + 1))));
      const cardW = Math.min(480, w - 24);
      const x0 = Math.floor((w - cardW) / 2);

      sock.send(new Uint8Array([1, 4, 0, 0, 0, 0, 5, 0, 0]));
    };
    sock.onmessage = function (ev) {
      if (ev.data instanceof ArrayBuffer) takeGaze(new Uint8Array(ev.data));
    };
    sock.onerror = function () {};
    sock.onclose = function () {
      if (gazeSock === sock) gazeSock = null;
      if (!gazeHold && !checking) { gazePoint = null; gazeAt = 0; }
      if (!suppressReconnect && !checking) scheduleGaze();
    };
  }
  function takeGaze(chunk) {
    if (checking || gazeHold) return;
    const buf = gazeBuf.length ? concatBytes(gazeBuf, chunk) : chunk;
    const view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    let pos = 0;
    while (pos + 5 <= buf.length) {
      const len = view.getUint32(pos + 1, true);
      if (len > 1048576) { gazeBuf = new Uint8Array(0); return; }
      if (pos + 5 + len > buf.length) break;
      const payload = new DataView(buf.buffer, buf.byteOffset + pos + 5, len);
      if (buf[pos] === 1 && len >= 56) applyGaze(payload);
      else if (buf[pos] === 4) applyWarpMessage(payload);
      pos += 5 + len;
    }
    gazeBuf = pos === 0 ? buf : buf.slice(pos);
  }
  function concatBytes(a, b) {
    const out = new Uint8Array(a.length + b.length);
    out.set(a, 0);
    out.set(b, a.length);
    return out;
  }
  function applyGaze(view) {
    const mask = view.getUint32(0, true);
    if ((mask & 64) === 0) return;
    if (mask & 12) {
      const left = (mask & 4) ? view.getUint32(8, true) : 4;
      const right = (mask & 8) ? view.getUint32(12, true) : 4;
      if (left !== 0 && right !== 0) return;
    }
    const x = view.getFloat64(40, true);
    const y = view.getFloat64(48, true);
    if (!Number.isFinite(x) || !Number.isFinite(y) || x < 0 || y < 0) return;
    const point = warpPoint(x, y);
    const raw = { x: point.x * window.innerWidth, y: point.y * window.innerHeight };
    if (!haveSmooth) {
      smoothed = raw;
      haveSmooth = true;
    } else {
      smoothed.x += (raw.x - smoothed.x) * 0.45;
      smoothed.y += (raw.y - smoothed.y) * 0.45;
    }
    gazePoint = smoothed;
    gazeAt = clock || performance.now();
  }
  function applyWarpMessage(view) {
    if (view.byteLength === 0) { gazeWarp = null; return; }
    if (view.byteLength < 72) return;
    const nextWarp = new Float64Array(9);
    for (let i = 0; i < 9; i++) nextWarp[i] = view.getFloat64(i * 8, true);
    for (let i = 0; i < 9; i++) if (!Number.isFinite(nextWarp[i])) return;
    gazeWarp = nextWarp;
  }
  function warpPoint(x, y) {
    const m = gazeWarp;
    if (!m) return { x: x, y: y };
    const w = m[6] * x + m[7] * y + m[8];
    if (Math.abs(w) < 1e-9) return { x: x, y: y };
    return { x: (m[0] * x + m[1] * y + m[2]) / w, y: (m[3] * x + m[4] * y + m[5]) / w };
  }
  function inkCount(canvas) {
    const data = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height).data;
    let n = 0;
    for (let i = 3; i < data.length; i += 32) if (data[i] > 40) n += 1;
    return n;
  }
  function selfCheck() {
    const failures = [];
    function fail(name, msg) { failures.push(name + ": " + msg); }
    let popBefore = null;
    let bookBefore = null;
    let storageOk = true;
    try {
      popBefore = localStorage.getItem("pop-pals-v1");
      bookBefore = localStorage.getItem(STORE);
    } catch (err) { storageOk = false; }
    try {
      if (document.body.innerHTML.indexOf(GAZE_URL) < 0 && document.documentElement.innerHTML.indexOf(GAZE_URL) < 0) {
        fail("gaze", "the gaze socket was not the local address.");
      }
      start("tiny");
      if (state().screen !== "pick" || state().colors.length !== 4) fail("tiny-pick", "Big Dots did not offer four colors.");
      pick("free");
      if (state().screen !== "pick" || state().mode === "free") fail("tiny-free", "Big Dots opened a blank page.");
      pick("cat");
      if (state().theme === "cat") fail("tiny-theme", "Big Dots opened a mature picture.");
      pick("sunny");
      if (state().screen !== "page" || state().theme !== "sunny" || state().mode !== "theme") fail("sunny", "Sunny Day did not open.");
      if (state().banner !== "Look at a color, then color the picture.") fail("sunny", "the banner changed.");
      if (inkCount(lineCanvas) < 8) fail("lines", "the picture had no outlines.");
      const sun = paintCanvas.getContext("2d").getImageData(Math.floor(paintCanvas.width * 0.22), Math.floor(paintCanvas.height * 0.22), 1, 1).data;
      selectColor("red");
      paintAt(paintCanvas.width * 0.22, paintCanvas.height * 0.22);
      const painted = paintCanvas.getContext("2d").getImageData(Math.floor(paintCanvas.width * 0.22), Math.floor(paintCanvas.height * 0.22), 1, 1).data;
      if (painted[0] === sun[0] && painted[1] === sun[1]) fail("paint", "the brush did not change the page.");
      colorId = null;
      render();
      const yellow = document.getElementById("color-yellow");
      if (!yellow) fail("dwell", "yellow was missing.");
      else {
        const r = yellow.getBoundingClientRect();
        look((r.left + r.width / 2) / window.innerWidth, (r.top + r.height / 2) / window.innerHeight);
        step(1000);
        step(1600);
        if (state().color === "yellow") fail("dwell", "a color changed at 600 ms.");
        step(1650);
        if (state().color !== "yellow") fail("dwell", "a color did not change at 650 ms.");
        releaseLook();
      }
      const tinyDot = targetsAt(1280, 800).dot;
      start("rush");
      pick("free");
      if (state().screen !== "page" || state().mode !== "free" || state().colors.length !== 14) fail("rush", "Sketchbook did not open a free page with 14 colors.");
      if (state().banner !== "Look at a color, then draw.") fail("rush", "the free-draw banner changed.");
      if (inkCount(lineCanvas) !== 0) fail("rush", "free draw drew outlines.");
      const rushDot = targetsAt(1280, 800).dot;
      if (!(tinyDot > rushDot && rushDot >= 72)) fail("dots", "Big Dots were not larger than Sketchbook dots.");
      start("little");
      if (themesFor("little").indexOf("fish") < 0 || themesFor("tiny").indexOf("fish") >= 0) fail("themes", "the fish picture was on the wrong band.");
      pick("fish");
      if (inkCount(lineCanvas) < 8) fail("fish", "the fish had no outlines.");
      album = [];
      keep();
      if (state().saved !== 1) fail("keep", "Keep did not save the picture.");
      const kept = album[0];
      if (!kept || kept.url.indexOf("data:image/jpeg") !== 0) fail("keep", "the saved picture was not a jpeg.");
      openAlbum();
      if (state().screen !== "album" || state().banner !== "Look at a picture you kept.") fail("album", "the album did not open.");
      if (!document.getElementById("pic-" + kept.id)) fail("album", "the saved picture was not a button.");
      openPicture(kept.id);
      if (state().screen !== "look" || state().banner !== "That is your picture.") fail("look", "the picture did not open.");
      newPicture();
      if (state().screen !== "pick") fail("new", "New picture did not return to the pictures.");
      start("shop");
      pick("picnic");
      paintAt(20, 20);
      newPicture();
      const blank = paintCanvas.getContext("2d").getImageData(20, 20, 1, 1).data;
      if (blank[0] < 240) fail("clear", "New picture left the old color.");
      if (inkCount(lineCanvas) < 8) fail("clear", "New picture erased the lines.");
      const banned = state();
      ["score", "miss", "wrongs", "rank", "clock", "lives"].forEach(function (key) {
        if (key in banned) fail("tally", "state has " + key + ".");
      });
      if ((state().banner || "").toLowerCase().indexOf("fail") >= 0) fail("tally", "the banner scolded.");
    } catch (err) {
      fail("self-check", err && err.message ? err.message : "the check threw.");
    }
    if (storageOk) {
      try {
        if (localStorage.getItem("pop-pals-v1") !== popBefore) fail("storage", "pop-pals-v1 changed.");
        if (bookBefore === null) localStorage.removeItem(STORE);
        else localStorage.setItem(STORE, bookBefore);
      } catch (err) {
        fail("storage", "storage could not be restored.");
      }
    }
    return { ok: failures.length === 0, failures: failures };
  }

  loadAlbum();
  window.colorBook = {
    start: start, go: go, look: look, releaseLook: releaseLook, hold: hold, release: release,
    tap: tap, step: step, dwell: dwell, eyes: eyes, centers: centers, targetsAt: targetsAt,
    state: state, seed: seed, selfCheck: selfCheck, pick: pick, paintAt: paintAt, keep: keep,
    openAlbum: openAlbum, openPicture: openPicture, newPicture: newPicture, selectColor: selectColor,
    putAway: putAway, back: back
  };
  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) { try { gazeSock.close(); } catch (err) {} gazeSock = null; }
    let result;
    try { result = selfCheck(); }
    catch (err) { result = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] }; }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    requestAnimationFrame(function frame(now) {
      if (checking) return;
      step(now);
      if (!checking) requestAnimationFrame(frame);
    });
    connectGaze();
  }
})();
</script>
</body>
</html>
