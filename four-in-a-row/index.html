<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>Four in a Row</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; touch-action: none; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; pointer-events: none; z-index: 1;
  }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 28; pointer-events: none;
    background: var(--card); border-radius: 999px; padding: 8px 12px;
    font-weight: 800; font-size: 16px;
  }
  #banner {
    position: fixed; z-index: 25; pointer-events: none;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 4px 10px; font-size: 16px; font-weight: 800;
    text-align: center; line-height: 1.15;
    display: flex; align-items: center; justify-content: center;
  }
  #menu-card, #rest-card, #who-card {
    position: fixed; z-index: 2; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #screen-menu, #screen-rest, #play, #menu-copy, #rest-line, #who-copy, h1, p, b, small {
    pointer-events: none;
  }
  #menu-copy, #rest-line, #who-copy {
    position: fixed; z-index: 24; margin: 0; text-align: center; overflow: hidden;
  }
  #menu-copy h1, #who-copy h1 { margin: 0; font-size: 26px; line-height: 28px; }
  #menu-copy p, #who-copy p { margin: 0; font-size: 14px; line-height: 16px; }
  #rest-line { font-size: 28px; font-weight: 800; }
  #mute, #full, #back, #lets-go, #tiny, #little, #shop, #rush, #another,
  #vs-cpu, #vs-two, #play button {
    position: fixed; z-index: 30; pointer-events: auto;
  }
  #mute, #full, #back {
    z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1; font-size: 15px; line-height: 1.1;
    padding: 4px;
  }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; display: block; }
  #tiny, #little, #shop, #rush {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; color: var(--ink); text-align: left;
    padding: 4px 10px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  #tiny b, #little b, #shop b, #rush b { display: block; font-size: 18px; line-height: 20px; }
  #tiny small, #little small, #shop small, #rush small {
    display: block; font-size: 12px; line-height: 14px; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go, #another, #vs-cpu, #vs-two {
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink); font-weight: 800;
    box-shadow: 0 5px 0 var(--sun-d); font-size: 26px;
  }
  #vs-two { background: var(--card); box-shadow: 0 5px 0 #d5c4a1; }
  #play button.slot {
    border: 3px solid transparent; border-radius: 18px;
    background: transparent; color: var(--ink); font-weight: 800;
    font-size: 28px; line-height: 1; padding: 12px 0 0;
    display: flex; align-items: flex-start; justify-content: center;
  }
  #play button.slot.picker {
    background: var(--card); border-color: var(--ink);
    box-shadow: 0 4px 0 #d5c4a1; font-size: 32px; padding: 0;
    align-items: center;
  }
  #play button.slot.dim { opacity: 0.35; }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<button id="mute" type="button" aria-label="Mute sound">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8l6 8"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner">Pick a game.</p>
<section id="screen-menu">
  <div id="menu-card"></div>
  <div id="menu-copy">
    <h1>Four in a Row</h1>
    <p>Drop a disc. Make a line.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>Three Up</b><small>Ages 2 to 3. A small board. Three in a row.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Four Fun</b><small>Ages 4 to 5. Four in a row.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Classic</b><small>Ages 6 to 8. The full board.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Clever</b><small>Ages 9 and up. A stronger computer.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden>
  <div id="who-card" hidden></div>
  <div id="who-copy" hidden>
    <h1>Who plays?</h1>
    <p>One screen. Take turns.</p>
  </div>
  <button id="vs-cpu" type="button" hidden>Play the computer</button>
  <button id="vs-two" type="button" hidden>Two players</button>
</div>
<section id="screen-rest" hidden>
  <div id="rest-card"></div>
  <p id="rest-line">Good game.</p>
  <button id="another" type="button" hidden>Another</button>
</section>
<script>
(function () {
  "use strict";
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const BAND_IDS = ["tiny", "little", "shop", "rush"];
  const BANDS = {
    tiny: { cols: 5, rows: 4, need: 3 },
    little: { cols: 6, rows: 5, need: 4 },
    shop: { cols: 7, rows: 6, need: 4 },
    rush: { cols: 7, rows: 6, need: 4 }
  };
  const STAR = "#E69F00";
  const RING = "#56B4E9";
  const BOARD = "#0072B2";

  function makeRng(seed) {
    let state = seed >>> 0;
    return {
      uint() {
        state = (state + 0x6D2B79F5) >>> 0;
        let t = Math.imul(state ^ (state >>> 15), state | 1);
        t = t ^ (t + Math.imul(t ^ (t >>> 7), t | 61));
        return (t ^ (t >>> 14)) >>> 0;
      }
    };
  }
  function rngUint(rng) { return rng.uint(); }
  function rngInt(rng, lo, hi) {
    return lo + (rngUint(rng) % (hi - lo + 1));
  }
  function playSeed(clockMs, counter) {
    return (Math.imul(((clockMs >>> 0) ^ Math.imul(counter >>> 0, 0x9E3779B9)), 0x85EBCA6B)) >>> 0;
  }

  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d");
  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const backBtn = document.getElementById("back");
  const eyesEl = document.getElementById("eyes");
  const gazeEl = document.getElementById("gaze");
  const bannerEl = document.getElementById("banner");
  const menuEl = document.getElementById("screen-menu");
  const menuCard = document.getElementById("menu-card");
  const menuCopy = document.getElementById("menu-copy");
  const playEl = document.getElementById("play");
  const whoCard = document.getElementById("who-card");
  const whoCopy = document.getElementById("who-copy");
  const vsCpu = document.getElementById("vs-cpu");
  const vsTwo = document.getElementById("vs-two");
  const restEl = document.getElementById("screen-rest");
  const restCard = document.getElementById("rest-card");
  const restLine = document.getElementById("rest-line");
  const anotherBtn = document.getElementById("another");
  const soundOn = document.getElementById("sound-on");
  const soundOff = document.getElementById("sound-off");
  const letsBtn = document.getElementById("lets-go");

  let screen = "menu";
  let level = "tiny";
  let muted = false;
  let mode = null;
  let cols = 0;
  let rows = 0;
  let need = 0;
  let cells = [];
  let heights = [];
  let turn = null;
  let starter = null;
  let waiting = false;
  let cpuAt = 0;
  let result = null;
  let resultAt = 0;
  let line = [];
  let sitting = 0;
  let sittingSeed = 1;
  let falls = [];
  let pin = null;
  let counter = 1;
  let rng = makeRng(1);
  let checking = false;
  let suppressReconnect = false;
  let colKey = "";
  let clock = 0;
  let ac = null;
  let master = null;
  let pointerDown = false;
  let armedId = null;
  let gazeSock = null;
  let gazeTimer = 0;
  let gazeBuf = new Uint8Array(0);
  let gazeWarp = null;
  let gazeHold = null;
  let refreshHold = false;
  let haveSmooth = false;
  let smoothed = null;
  let gazePoint = null;
  let gazeAt = 0;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;
  let dwellMs = PLAY_DWELL_MS;
  let dwellOffAt = 0;

  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  function knownBand(band) { return BAND_IDS.indexOf(band) >= 0; }
  function takePageSeed() {
    let s;
    if (pin !== null) s = pin;
    else if (checking) s = 1;
    else s = playSeed(Date.now(), counter);
    pin = null;
    counter += 1;
    return s >>> 0;
  }

  function hasLine(player) {
    const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (cells[r * cols + c] !== player) continue;
        for (let d = 0; d < dirs.length; d++) {
          const dc = dirs[d][0];
          const dr = dirs[d][1];
          let k = 1;
          for (; k < need; k++) {
            const cc = c + dc * k;
            const rr = r + dr * k;
            if (cc < 0 || rr < 0 || cc >= cols || rr >= rows || cells[rr * cols + cc] !== player) break;
          }
          if (k === need) return true;
        }
      }
    }
    return false;
  }
  function collectLine(player) {
    const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
    const seen = {};
    const out = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        for (let d = 0; d < dirs.length; d++) {
          const dc = dirs[d][0];
          const dr = dirs[d][1];
          const got = [];
          let ok = true;
          for (let k = 0; k < need; k++) {
            const cc = c + dc * k;
            const rr = r + dr * k;
            if (cc < 0 || rr < 0 || cc >= cols || rr >= rows || cells[rr * cols + cc] !== player) {
              ok = false;
              break;
            }
            got.push({ c: cc, r: rr });
          }
          if (!ok) continue;
          for (let k = 0; k < got.length; k++) {
            const key = got[k].c + "," + got[k].r;
            if (!seen[key]) {
              seen[key] = true;
              out.push(got[k]);
            }
          }
        }
      }
    }
    return out.length ? out : null;
  }
  function windowScore() {
    let s = 0;
    const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        for (let d = 0; d < dirs.length; d++) {
          const dc = dirs[d][0];
          const dr = dirs[d][1];
          let own = 0;
          let opp = 0;
          let empty = 0;
          let ok = true;
          for (let k = 0; k < need; k++) {
            const cc = c + dc * k;
            const rr = r + dr * k;
            if (cc < 0 || rr < 0 || cc >= cols || rr >= rows) { ok = false; break; }
            const v = cells[rr * cols + cc];
            if (v === 2) own += 1;
            else if (v === 1) opp += 1;
            else empty += 1;
          }
          if (!ok) continue;
          if (own === need) s += 100;
          else if (opp === need) s -= 100;
          else if (own === 3 && empty === 1) s += 5;
          else if (own === 2 && empty === 2) s += 2;
          else if (opp === 3 && empty === 1) s -= 4;
        }
      }
    }
    const mids = cols % 2 === 1 ? [(cols - 1) >> 1] : [cols / 2 - 1, cols / 2];
    for (let i = 0; i < mids.length; i++) {
      const c = mids[i];
      for (let r = 0; r < heights[c]; r++) if (cells[r * cols + c] === 2) s += 3;
    }
    return s;
  }
  function openCols() {
    const out = [];
    for (let c = 0; c < cols; c++) if (heights[c] < rows) out.push(c);
    return out;
  }
  function orderedOpen() {
    const mid = (cols - 1) / 2;
    return openCols().sort(function (a, b) {
      return Math.abs(a - mid) - Math.abs(b - mid) || a - b;
    });
  }
  function winningCols(player) {
    const out = [];
    for (let c = 0; c < cols; c++) {
      if (heights[c] >= rows) continue;
      const r = heights[c];
      cells[r * cols + c] = player;
      heights[c] = r + 1;
      const won = hasLine(player);
      heights[c] = r;
      cells[r * cols + c] = 0;
      if (won) out.push(c);
    }
    return out;
  }
  function handsImmediate(col) {
    const r = heights[col];
    cells[r * cols + col] = 2;
    heights[col] = r + 1;
    if (hasLine(2)) {
      heights[col] = r;
      cells[r * cols + col] = 0;
      return false;
    }
    const danger = winningCols(1).length > 0;
    heights[col] = r;
    cells[r * cols + col] = 0;
    return danger;
  }
  function minimax(depth, alpha, beta, maximizing) {
    if (hasLine(2)) return 100000 + depth;
    if (hasLine(1)) return -100000 - depth;
    const ops = orderedOpen();
    if (!ops.length || depth === 0) return windowScore();
    if (maximizing) {
      let best = -Infinity;
      for (let i = 0; i < ops.length; i++) {
        const c = ops[i];
        const r = heights[c];
        cells[r * cols + c] = 2;
        heights[c] = r + 1;
        const s = minimax(depth - 1, alpha, beta, false);
        heights[c] = r;
        cells[r * cols + c] = 0;
        if (s > best) best = s;
        if (s > alpha) alpha = s;
        if (alpha >= beta) break;
      }
      return best;
    }
    let best = Infinity;
    for (let i = 0; i < ops.length; i++) {
      const c = ops[i];
      const r = heights[c];
      cells[r * cols + c] = 1;
      heights[c] = r + 1;
      const s = minimax(depth - 1, alpha, beta, true);
      heights[c] = r;
      cells[r * cols + c] = 0;
      if (s < best) best = s;
      if (s < beta) beta = s;
      if (alpha >= beta) break;
    }
    return best;
  }
  function rushChoice() {
    const ops = orderedOpen();
    if (!ops.length) return -1;
    let best = -Infinity;
    let choice = ops[0];
    let alpha = -Infinity;
    for (let i = 0; i < ops.length; i++) {
      const c = ops[i];
      const r = heights[c];
      cells[r * cols + c] = 2;
      heights[c] = r + 1;
      const s = minimax(3, alpha, Infinity, false);
      heights[c] = r;
      cells[r * cols + c] = 0;
      if (s > best) { best = s; choice = c; }
      if (s > alpha) alpha = s;
    }
    return choice;
  }
  function pickMove() {
    const ops = openCols();
    if (!ops.length) return -1;
    if (level === "tiny") {
      const wins = winningCols(2);
      if (wins.length && (rngUint(rng) % 2 === 0)) return wins[rngInt(rng, 0, wins.length - 1)];
      return ops[rngInt(rng, 0, ops.length - 1)];
    }
    if (level === "little") {
      const wins = winningCols(2);
      if (wins.length) return wins.length === 1 ? wins[0] : wins[rngInt(rng, 0, wins.length - 1)];
      const weights = [1, 2, 3, 3, 2, 1];
      const bag = [];
      for (let i = 0; i < ops.length; i++) {
        const w = weights[ops[i]] || 1;
        for (let k = 0; k < w; k++) bag.push(ops[i]);
      }
      return bag[rngInt(rng, 0, bag.length - 1)];
    }
    if (level === "shop") {
      const wins = winningCols(2);
      if (wins.length) return wins.length === 1 ? wins[0] : wins[rngInt(rng, 0, wins.length - 1)];
      const blocks = winningCols(1);
      if (blocks.length) return blocks.length === 1 ? blocks[0] : blocks[rngInt(rng, 0, blocks.length - 1)];
      let best = -Infinity;
      const tied = [];
      for (let i = 0; i < ops.length; i++) {
        const c = ops[i];
        const r = heights[c];
        cells[r * cols + c] = 2;
        heights[c] = r + 1;
        const s = windowScore();
        heights[c] = r;
        cells[r * cols + c] = 0;
        if (s > best) { best = s; tied.length = 0; tied.push(c); }
        else if (s === best) tied.push(c);
      }
      return tied.length === 1 ? tied[0] : tied[rngInt(rng, 0, tied.length - 1)];
    }
    if ((rngUint(rng) / 4294967296) < 0.15) {
      const safe = [];
      for (let i = 0; i < ops.length; i++) if (!handsImmediate(ops[i])) safe.push(ops[i]);
      const pool = safe.length ? safe : ops;
      return pool[rngInt(rng, 0, pool.length - 1)];
    }
    return rushChoice();
  }

  function bannerText() {
    if (screen === "menu") return "Pick a game.";
    if (screen === "who") return "Who is playing?";
    if (screen === "rest") return "Good game.";
    if (result === "star") return "Star made a line!";
    if (result === "ring") return "Ring made a line!";
    if (result === "tie") return "The board is full. A tie!";
    if (waiting) return "My turn.";
    if (turn === 2) return "Ring's turn";
    return "Star's turn";
  }
  function chipText() {
    if (result === "ring") return "Ring's turn";
    if (result === "star") return "Star's turn";
    if (turn === 2) return "Ring's turn";
    return "Star's turn";
  }
  function chipPlayer() {
    if (result === "ring" || (result !== "star" && turn === 2)) return 2;
    return 1;
  }

  function go(id) {
    if (id !== "menu" && id !== "who" && id !== "play" && id !== "rest") {
      render();
      return;
    }
    screen = id;
    if (id !== "play") waiting = false;
    render();
  }
  function highlight(band) {
    if (!knownBand(band)) {
      render();
      return;
    }
    level = band;
    render();
  }
  function resetBoard() {
    const spec = BANDS[level];
    cols = spec.cols;
    rows = spec.rows;
    need = spec.need;
    cells = new Array(cols * rows).fill(0);
    heights = new Array(cols).fill(0);
    result = null;
    resultAt = 0;
    line = [];
    falls = [];
    waiting = false;
    if (mode === "two") starter = sitting % 2 === 0 ? 1 : 2;
    else starter = 1;
    turn = starter;
    rng = makeRng(sittingSeed >>> 0);
  }
  function beginGame(nextMode) {
    if (nextMode !== "computer" && nextMode !== "two") {
      render();
      return;
    }
    mode = nextMode;
    resetBoard();
    go("play");
  }
  function start(band) {
    if (!knownBand(band)) {
      render();
      return;
    }
    level = band;
    mode = null;
    sitting = 0;
    cols = 0;
    rows = 0;
    need = 0;
    cells = [];
    heights = [];
    turn = null;
    starter = null;
    result = null;
    line = [];
    falls = [];
    waiting = false;
    sittingSeed = takePageSeed();
    go("who");
  }
  function another() {
    if (!mode) {
      render();
      return;
    }
    sitting += 1;
    sittingSeed = takePageSeed();
    beginGame(mode);
  }
  function loadDiscs(entries) {
    for (let i = 0; i < cells.length; i++) cells[i] = 0;
    for (let c = 0; c < cols; c++) heights[c] = 0;
    for (let i = 0; i < entries.length; i++) {
      const c = entries[i][0];
      const r = entries[i][1];
      const p = entries[i][2];
      cells[r * cols + c] = p;
      if (r + 1 > heights[c]) heights[c] = r + 1;
    }
    result = null;
    line = [];
    falls = [];
    waiting = false;
  }
  function isFull() {
    if (!rows) return false;
    for (let c = 0; c < cols; c++) if (heights[c] < rows) return false;
    return true;
  }
  function drop(col) {
    if (screen !== "play" || result || waiting) {
      render();
      return false;
    }
    if (col !== (col | 0) || col < 0 || col >= cols || heights[col] >= rows) {
      render();
      return false;
    }
    const player = turn;

      function checkView(where) {

        for (let v = 0; v < views.length; v++) {
          const lay = targetsAt(views[v][0], views[v][1]);
          if (!lay.ok) fail("family-target-size", where + " at " + views[v][0] + " by " + views[v][1] + " was not ok.");
          const list = lay.targets || [];
          for (let i = 0; i < list.length; i++) {
            if (Math.min(list[i].w, list[i].h) < 72) fail("family-target-size", where + " target " + list[i].id + " was under 72.");
          }
        }
        const small = targetsAt(300, 600);
        if (small.ok || (small.targets && small.targets.length)) fail("family-target-size", "A 300 px width was treated as ok.");
      }
      const before = muteBtn.getBoundingClientRect();
      const beforeShort = Math.min(before.width, before.height);
      checkView("menu");
      const after = muteBtn.getBoundingClientRect();
      if (Math.min(after.width, after.height) + 1 < beforeShort) fail("family-target-size", "targetsAt shrank a live button.");
      if (targetById(centers().targets, "back")) fail("family-target-size", "Back was listed on the menu.");
      seed(1);
      start("tiny");
      const liveBefore = targetById(centers().targets, "mute");
      checkView("who");
      const liveAfter = targetById(centers().targets, "mute");
      if (liveBefore && liveAfter && Math.min(liveAfter.w, liveAfter.h) + 1 < Math.min(liveBefore.w, liveBefore.h)) {
        fail("family-target-size", "targetsAt shrank a live button.");
      }
      chooseTwo();
      checkView("play");
    });
    run("family-eyes", function () {
      resetInput();
      step(40000);
      look(0.5, 0.5);
      step(40020);
      const eye = eyes();
      const keys = Object.keys(eye);
      if (keys.length !== 2 || keys.indexOf("on") < 0 || keys.indexOf("live") < 0) fail("family-eyes", "eyes() did not return only on and live.");
      if (typeof eye.on !== "boolean" || typeof eye.live !== "boolean") fail("family-eyes", "on or live was not a boolean.");
      if (eye.on !== true || eye.live !== true) fail("family-eyes", "A fresh look did not set on and live.");
      if (gazeSock) fail("family-eyes", "The socket was open.");
      if (eyesEl.hidden || eyesEl.textContent !== "Eyes") fail("family-eyes", "The Eyes chip was hidden or mislabeled.");
      releaseLook();
      if (!eyesEl.hidden) fail("family-eyes", "The Eyes chip stayed up after release.");
    });
    run("family-mute", function () {
      resetInput();
      const muteText = (muteBtn.innerText || "").replace(/\s+/g, "");
      if (muteText !== "") fail("family-mute", "The mute button had visible text.");
      if ((muteBtn.innerText || "").indexOf("Mute") >= 0 || (muteBtn.innerText || "").indexOf("Sound") >= 0) {
        fail("family-mute", "Mute or Sound was visible.");
      }
      if (muteBtn.querySelectorAll("svg").length !== 2) fail("family-mute", "The mute button did not hold two speaker icons.");
      if (state().muted !== false) fail("family-mute", "Sound did not start on.");
      const box = targetById(centers().targets, "mute");
      tap(box.nx, box.ny);
      if (state().muted !== true) fail("family-mute", "The first tap did not mute.");
      tap(box.nx, box.ny);
      if (state().muted !== false) fail("family-mute", "The second tap did not turn sound on.");
    });
    function playCols(band, seq) {
      resetInput();
      seed(1);
      start(band);
      chooseTwo();
      for (let i = 0; i < seq.length; i++) {
        const before = state();
        if (before.result) throw new Error("A line landed before the last disc.");
        const box = targetById(centers().targets, "col-" + seq[i]);
        if (!box || !box.play) throw new Error("Column " + seq[i] + " was not a play target.");
        tap(box.nx, box.ny);
      }
      return state();
    }
    run("drop-lowest", function () {
      resetInput();
      seed(1);
      start("shop");
      chooseTwo();
      const first = targetById(centers().targets, "col-2");
      tap(first.nx, first.ny);
      let snap = state();
      if (snap.cells[2] !== 1 || snap.turn !== 2) fail("drop-lowest", "The first disc was not in the lowest hole, or the turn did not switch.");
      const second = targetById(centers().targets, "col-2");
      tap(second.nx, second.ny);
      snap = state();
      if (snap.cells[2] !== 1 || snap.cells[2 + snap.cols] !== 2 || snap.turn !== 1) {
        fail("drop-lowest", "The second disc did not stack, or the turn did not switch back.");
      }
    });
    run("column-dwell", function () {
      resetInput();
      seed(1);
      start("little");
      chooseTwo();
      const box = targetById(centers().targets, "col-3");
      enterLook(box, 50000);
      step(50640);
      if (state().cells[3] !== 0) fail("column-dwell", "640 ms dropped a disc.");
      step(50660);
      if (state().cells[3] !== 1 || state().turn !== 2) fail("column-dwell", "660 ms did not drop a disc.");
    });
    run("full-column-inert", function () {
      resetInput();
      seed(1);
      start("shop");
      chooseTwo();
      for (let i = 0; i < 6; i++) {
        const box = targetById(centers().targets, "col-0");
        if (!box) throw new Error("Column 0 left the board early.");
        tap(box.nx, box.ny);
      }
      const snap = state();
      if (snap.heights && snap.cells[0] === 0) fail("full-column-inert", "The column did not fill.");
      let filled = 0;
      for (let r = 0; r < snap.rows; r++) if (snap.cells[r * snap.cols] !== 0) filled += 1;
      if (filled !== 6 || snap.result) fail("full-column-inert", "The column was not full, or a line was declared.");
      const btn = document.getElementById("col-0");
      if (!btn || btn.getAttribute("data-play") === "true" || btn.getAttribute("aria-disabled") !== "true") {
        fail("full-column-inert", "The full column still accepted a look.");
      }
      const held = snap.cells.slice();
      const box = targetById(centers().targets, "col-0");
      if (box && box.play) fail("full-column-inert", "The full column stayed a play target.");
      const rect = btn.getBoundingClientRect();
      const nx = (rect.left + rect.width / 2) / window.innerWidth;
      const ny = (rect.top + rect.height / 2) / window.innerHeight;
      tap(nx, ny);
      enterLook({ nx: nx, ny: ny }, 54000);
      step(54660);
      const after = state().cells;
      for (let i = 0; i < held.length; i++) if (after[i] !== held[i]) {
        fail("full-column-inert", "A look or a tap changed a full column.");
        break;
      }
    });
    function expectLine(band, seq, player, expect, label) {
      const snap = playCols(band, seq);
      if (snap.result !== player) fail("win-lines", label + " did not name the winner.");
      if (snap.screen !== "play") fail("win-lines", label + " left the board before the rest.");
      if (!hasCells(snap.line, expect)) fail("win-lines", label + " marked the wrong discs.");
      const word = player === "star" ? "Star made a line!" : "Ring made a line!";
      if (snap.banner !== word) fail("win-lines", label + " banner was not the line sentence.");
    }
    run("win-lines", function () {
      expectLine("tiny", [0, 0, 1, 1, 2], "star", [[0, 0], [1, 0], [2, 0]], "Tiny across");
      expectLine("tiny", [0, 1, 0, 1, 0], "star", [[0, 0], [0, 1], [0, 2]], "Tiny down");
      expectLine("tiny", [0, 1, 1, 2, 2, 4, 2], "star", [[0, 0], [1, 1], [2, 2]], "Tiny up diagonal");
      expectLine("tiny", [2, 1, 1, 0, 0, 4, 0], "star", [[2, 0], [1, 1], [0, 2]], "Tiny down diagonal");
      const across = playCols("shop", [0, 0, 1, 1, 2, 2, 3]);
      if (across.result !== "star" || !hasCells(across.line, [[0, 0], [1, 0], [2, 0], [3, 0]])) {
        fail("win-lines", "Classic across was not four Star discs.");
      }
      const heldClock = clock;
      step(heldClock + 1499);
      if (state().screen !== "play") fail("win-lines", "The line left the board before 1500 ms.");
      step(heldClock + 1500);
      if (state().screen !== "rest" || state().banner !== "Good game.") fail("win-lines", "1500 ms did not open rest.");
      expectLine("shop", [0, 1, 0, 1, 0, 1, 0], "star", [[0, 0], [0, 1], [0, 2], [0, 3]], "Classic down");
      expectLine("shop", [0, 2, 1, 2, 1, 3, 2, 3, 4, 3, 3], "star", [[0, 0], [1, 1], [2, 2], [3, 3]], "Classic up diagonal");
      expectLine("shop", [0, 0, 3, 0, 0, 1, 4, 1, 1, 2, 2], "star", [[0, 3], [1, 2], [2, 1], [3, 0]], "Classic down diagonal");
      if (speakCalls !== 0) fail("win-lines", "A line called speech.");
    });
    run("tie", function () {
      const seq = [5, 3, 6, 5, 1, 6, 1, 0, 1, 0, 3, 4, 6, 4, 2, 4, 5, 6, 0, 1, 3, 6, 3, 2, 4, 3, 4, 6, 3, 1, 0, 0, 1, 4, 0, 5, 5, 2, 2, 5, 2, 2];
      const snap = playCols("shop", seq);
      if (snap.result !== "tie" || snap.screen !== "play" || snap.banner !== "The board is full. A tie!") {
        fail("tie", "A full board did not announce a tie.");
      }
      const T = clock;
      step(T + 1499);
      if (state().screen !== "play") fail("tie", "The tie left the board early.");
      step(T + 1500);
      const done = state();
      if (done.screen !== "rest" || done.result !== "tie" || done.banner !== "Good game.") {
        fail("tie", "The tie did not reach rest.");
      }
      if ((restLine.textContent || "") !== "Good game.") fail("tie", "The rest sentence changed.");
    });
    run("computer-wins-and-blocks", function () {
      resetInput();
      seed(1);
      step(80000);
      start("shop");
      chooseCpu();
      loadDiscs([[0, 0, 2], [1, 0, 2], [2, 0, 2], [0, 1, 1], [4, 0, 1], [5, 0, 1], [6, 0, 1]]);
      turn = 2;
      waiting = true;
      cpuAt = 80000;
      step(80699);
      if (state().cells[3] !== 0 || state().result) fail("computer-wins-and-blocks", "The computer moved before 700 ms on a win.");
      step(80700);
      let snap = state();
      if (snap.cells[3] !== 2 || snap.result !== "ring") fail("computer-wins-and-blocks", "The computer did not take the winning column.");
      if (!hasCells(snap.line, [[0, 0], [1, 0], [2, 0], [3, 0]])) fail("computer-wins-and-blocks", "The winning discs were not the offered line.");
      resetInput();
      step(82000);
      start("shop");
      chooseCpu();
      loadDiscs([[0, 0, 1], [1, 0, 1], [2, 0, 1], [6, 0, 1], [4, 0, 2], [5, 0, 2], [6, 1, 2]]);
      turn = 2;
      waiting = true;
      cpuAt = 82000;
      step(82700);
      snap = state();
      if (snap.cells[3] !== 2 || snap.result) fail("computer-wins-and-blocks", "The computer did not block the open line.");
      if (snap.cells[0] !== 1 || snap.cells[1] !== 1 || snap.cells[2] !== 1) {
        fail("computer-wins-and-blocks", "The block moved a Star disc.");
      }
    });
    run("computer-waits", function () {
      resetInput();
      seed(3);
      step(90000);
      start("shop");
      chooseCpu();
      const first = targetById(centers().targets, "col-0");
      tap(first.nx, first.ny);
      let snap = state();
      if (!snap.waiting || snap.banner !== "My turn." || snap.cells[0] !== 1) {
        fail("computer-waits", "The computer wait did not start after Star.");
      }
      const other = targetById(centers().targets, "col-1");
      tap(other.nx, other.ny);
      if (state().cells[1] !== 0) fail("computer-waits", "A tap landed during the wait.");
      enterLook(other, 90000);
      step(90660);
      snap = state();
      if (snap.cells[1] !== 0 || snap.cells[0] !== 1) fail("computer-waits", "A 660 ms look landed during the wait.");
      let rings = 0;
      for (let i = 0; i < snap.cells.length; i++) if (snap.cells[i] === 2) rings += 1;
      if (rings !== 0) fail("computer-waits", "The computer moved before 700 ms.");
      releaseLook();
      step(90699);
      rings = 0;
      const mid = state();
      for (let i = 0; i < mid.cells.length; i++) if (mid.cells[i] === 2) rings += 1;
      if (rings !== 0 || mid.cells[0] !== 1) fail("computer-waits", "The board changed at 699 ms.");
      step(90700);
      snap = state();
      rings = 0;
      let stars = 0;
      for (let i = 0; i < snap.cells.length; i++) {
        if (snap.cells[i] === 2) rings += 1;
        if (snap.cells[i] === 1) stars += 1;
      }
      if (rings !== 1 || stars !== 1 || snap.waiting) fail("computer-waits", "The wait did not end with one computer disc.");
    });
    run("picker-at-390", function () {
      resetInput();
      seed(1);
      start("shop");
      chooseTwo();
      const phone = targetsAt(390, 700);
      const colsPhone = (phone.targets || []).filter(function (t) { return t.id.indexOf("col-") === 0; });
      if (!phone.ok || colsPhone.length !== 7) fail("picker-at-390", "390 by 700 did not offer seven column targets.");
      for (let i = 0; i < colsPhone.length; i++) {
        if (Math.min(colsPhone[i].w, colsPhone[i].h) < 72) fail("picker-at-390", "A picker button was under 72.");
        if (colsPhone[i].h > 160) fail("picker-at-390", "390 by 700 used a full-column target.");
      }
      const desk = targetsAt(1024, 768);
      const colsDesk = (desk.targets || []).filter(function (t) { return t.id.indexOf("col-") === 0; });
      if (!desk.ok || colsDesk.length !== 7) fail("picker-at-390", "1024 by 768 did not offer seven column targets.");
      for (let i = 0; i < colsDesk.length; i++) {
        if (Math.min(colsDesk[i].w, colsDesk[i].h) < 72) fail("picker-at-390", "A wide column target was under 72.");
        if (colsDesk[i].h < 200) fail("picker-at-390", "1024 by 768 used the picker.");
      }
    });
    run("family-plain-state", function () {
      const before = JSON.stringify(state());
      start("nope");
      go("sideways");
      if (JSON.stringify(state()) !== before) fail("family-plain-state", "An unknown band or screen changed the state.");
      const end = state();
      if (!("level" in end) || !("screen" in end) || !("banner" in end) || !("muted" in end)) {
        fail("family-plain-state", "level, screen, banner, or muted was missing.");
      }
    });
    try {
      assertJunk("at the end");
    } catch (err) {
      fail("family-query-inert", err && err.message ? err.message : "The junk check threw.");
    }
    try {
      if (writes !== 0) fail("family-no-storage", "The page called setItem or removeItem.");
      if (storeLen !== null && localStorage.length !== storeLen) fail("family-no-storage", "localStorage gained a key.");
      if (storeLen !== null && localStorage.getItem("pop-pals-v1") !== pop) fail("family-no-storage", "pop-pals-v1 changed.");
    } catch (err) {
      fail("family-no-storage", "Storage could not be read.");
    }
    try {
      if (origSet) localStorage.setItem = origSet;
      if (origRem) localStorage.removeItem = origRem;
      if (origSpeak && window.speechSynthesis) window.speechSynthesis.speak = origSpeak;
    } catch (err) {}
    return { ok: failures.length === 0, failures: failures };
  }

  window.fourInARow = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    selfCheck: selfCheck
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let resultCheck;
    try { resultCheck = selfCheck(); }
    catch (err) {
      resultCheck = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] };
    }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(resultCheck);
    document.body.appendChild(pre);
    document.title = resultCheck.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("rush")) start("rush");
    else if (params.has("play")) start("tiny");
    connectGaze();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
