<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>Painter of Light</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; touch-action: none; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 1; pointer-events: none;
    background: var(--card); border-radius: 999px; padding: 8px 12px;
    font-weight: 800; font-size: 16px;
  }
  #banner {
    position: fixed; z-index: 3; pointer-events: none;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 6px 14px; font-size: 18px; font-weight: 800;
    text-align: center; overflow: hidden;
  }
  #menu-card, #rest-card {
    position: fixed; z-index: 2; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #screen-menu, #screen-rest, #play, #menu-copy, #rest-line, h1, p, b, small {
    pointer-events: none;
  }
  #menu-copy, #rest-line {
    position: fixed; z-index: 3; margin: 0; text-align: center; overflow: hidden;
  }
  #menu-copy h1 { margin: 0; font-size: 22px; line-height: 24px; }
  #menu-copy p { margin: 0; font-size: 13px; line-height: 15px; }
  #rest-line { font-size: 28px; font-weight: 800; line-height: 32px; }
  #mute, #full, #back, #lets-go, #tiny, #little, #shop, #rush, #another, #play button {
    position: fixed; z-index: 30; pointer-events: auto;
  }
  #mute, #full, #back {
    z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1; font-size: 15px; line-height: 1.1;
    padding: 4px; overflow: hidden;
  }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; display: block; }
  #full { font-size: 13px; }
  #tiny, #little, #shop, #rush {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; color: var(--ink); text-align: left;
    padding: 4px 10px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  #tiny b, #little b, #shop b, #rush b { display: block; font-size: 18px; line-height: 20px; }
  #tiny small, #little small, #shop small, #rush small {
    display: block; font-size: 12px; line-height: 14px; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go, #another {
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink); font-weight: 800;
    box-shadow: 0 5px 0 var(--sun-d); font-size: 26px;
  }
  #scene {
    position: fixed; z-index: 1; pointer-events: none; overflow: visible;
  }
  #play button {
    border: none; border-radius: 16px; padding: 0;
    background: transparent; box-shadow: none;
  }
</style>
</head>
<body>
<button id="mute" type="button" aria-label="Mute sound">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8l6 8"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner">Pick who is playing.</p>
<section id="screen-menu">
  <div id="menu-card"></div>
  <div id="menu-copy">
    <h1>Painter of Light</h1>
    <p>A dark room lights up where you look.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>Little Light</b><small>Ages 2 to 3. A big glow, three things.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Lamp Light</b><small>Ages 4 to 5. Four things.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Morning Light</b><small>Ages 6 to 8. Some things wait for others.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Starlight</b><small>Ages 9 and up. Darker rooms.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden>
  <svg id="scene" viewBox="0 0 1 1" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
</div>
<section id="screen-rest" hidden>
  <div id="rest-card"></div>
  <p id="rest-line">Every room is bright.</p>
  <button id="another" type="button">Another</button>
</section>

      if (muteText !== "") fail("family-mute", "The mute button had visible text.");
      if ((muteBtn.innerText || "").indexOf("Mute") >= 0 || (muteBtn.innerText || "").indexOf("Sound") >= 0) {
        fail("family-mute", "Mute or Sound was visible.");
      }
      if (muteBtn.querySelectorAll("svg").length !== 2) fail("family-mute", "The mute button did not hold two speaker icons.");
      if (state().muted !== false) fail("family-mute", "Sound did not start on.");
      const box = targetById(centers().targets, "mute");
      tap(box.nx, box.ny);
      if (state().muted !== true) fail("family-mute", "The first tap did not mute.");
      tap(box.nx, box.ny);
      if (state().muted !== false) fail("family-mute", "The second tap did not turn sound on.");
    });
    run("glow-not-target", function () {
      resetInput();
      seed(1);
      start("tiny");
      step(50000);
      const floors = [[0.5, 0.5], [0.01, 0.5], [0.99, 0.5], [0.5, 0.01], [0.5, 0.99]];
      let t = 50000;
      for (let i = 0; i < floors.length; i++) {
        const p = sceneFrac(floors[i][0], floors[i][1]);
        const hit = buttonAt(p.x, p.y);
        if (hit) fail("glow-not-target", "A floor point sat on " + hit.id + ".");
        else {
          look(p.nx, p.ny);
          step(t);
          step(t + 700);
          if (state().awake.length !== 0 || state().banner !== PLAY_BANNER) fail("glow-not-target", "A long look on the floor changed the room.");
        }
        t += 800;
      }
      const box = firstPlay();
      enterLook(box, t);
      step(t + 200);
      look(sceneFrac(0.5, 0.5).nx, sceneFrac(0.5, 0.5).ny);
      step(t + 200);
      if (state().awake.length !== 0) fail("glow-not-target", "A short look woke a thing.");
      releaseLook();
      const spot = sceneFrac(0.5, 0.5);
      document.dispatchEvent(new PointerEvent("pointermove", {
        clientX: box.x + box.w / 2,
        clientY: box.y + box.h / 2,
        bubbles: true,
        pointerType: "mouse"
      }));
      step(t + 1000);
      step(t + 1700);
      if (state().awake.length !== 0) fail("glow-not-target", "The pointer woke a thing.");
      const moved = parseFloat(document.getElementById("look-grad").getAttribute("cx"));
      const sc = sceneBox(window.innerWidth, window.innerHeight);
      const expectX = ((box.x + box.w / 2) - sc.x) / sc.size;
      if (Math.abs(moved - expectX) > 0.03) fail("glow-not-target", "The glow did not follow the pointer.");
      look(spot.nx, spot.ny);
      step(t + 1800);
      const gazed = parseFloat(document.getElementById("look-grad").getAttribute("cx"));
      if (Math.abs(gazed - 0.5) > 0.03) fail("glow-not-target", "The glow did not follow the look.");
      releaseLook();
      enterLook(box, t + 2000);
      step(t + 2660);
      const thingId = document.getElementById(box.id).getAttribute("data-thing");
      if (state().awake.length !== 1 || state().awake[0] !== thingId) fail("glow-not-target", "A 660 ms look did not wake only that thing.");
    });
    run("wake-dwell", function () {
      resetInput();
      seed(1);
      start("tiny");
      const box = firstPlay();
      const thingId = document.getElementById(box.id).getAttribute("data-thing");
      step(60000);
      look(box.nx, box.ny);
      step(60000);
      step(60640);
      if (state().awake.indexOf(thingId) >= 0) fail("wake-dwell", "640 ms woke the thing.");
      step(60660);
      if (state().awake.length !== 1 || state().awake[0] !== thingId) fail("wake-dwell", "660 ms did not wake the thing.");
      step(62000);
      if (state().awake.length !== 1) fail("wake-dwell", "Staying on a woken thing woke something else.");
      if (targetById(centers().targets, box.id)) fail("wake-dwell", "A woken thing was still a target.");
      releaseLook();
      step(63000);
      look(box.nx, box.ny);
      step(63000);
      step(63660);
      if (state().awake.length !== 1 || state().screen !== "play") fail("wake-dwell", "A later look on a woken thing changed the room.");
    });
    run("order", function () {
      function listed(id) { return !!targetById(centers().targets, "thing-" + id); }
      resetInput();
      seed(1);
      start("shop");
      if (listed("clock") || listed("plant")) fail("order", "Morning Light offered a thing before the one it follows.");
      if (!listed("window") || !listed("lamp") || !listed("cat")) fail("order", "Morning Light hid a free thing.");
      const win = targetById(centers().targets, "thing-window");
      tap(win.nx, win.ny);
      if (!listed("clock") || !listed("plant")) fail("order", "Morning Light kept a thing asleep after the window woke.");
      if (state().awake.indexOf("clock") >= 0) fail("order", "The clock woke with the window.");
      resetInput();
      seed(1);
      start("rush");
      if (listed("clock")) fail("order", "Starlight offered the clock before the window.");
      resetInput();
      seed(1);
      start("tiny");
      const tinyIds = state().things;
      if (state().order !== false) fail("order", "Little Light used order rules.");
      for (let i = 0; i < tinyIds.length; i++) {
        if (!listed(tinyIds[i])) fail("order", "Little Light hid " + tinyIds[i] + ".");
      }
      if (listed("clock")) fail("order", "Little Light showed a thing past the first three.");
      resetInput();
      seed(1);
      start("little");
      if (state().order !== false) fail("order", "Lamp Light used order rules.");
      if (!listed("clock")) fail("order", "Lamp Light hid the clock even though order is off.");
      if (state().awake.indexOf("window") >= 0) fail("order", "The window was already awake.");
    });
    run("band-counts", function () {
      const expect = {
        tiny: { n: 3, r: 0.35, d: 0.70, order: false, cap: 2 },
        little: { n: 4, r: 0.30, d: 0.78, order: false, cap: 3 },
        shop: { n: 5, r: 0.25, d: 0.85, order: true, cap: 3 },
        rush: { n: 5, r: 0.20, d: 0.90, order: true, cap: 4 }
      };
      const ids = BAND_IDS;
      for (let b = 0; b < ids.length; b++) {
        const band = ids[b];
        const spec = expect[band];
        resetInput();
        seed(1);
        start(band);
        const snap = state();
        const want = SCENES[0].things.slice(0, spec.n).map(function (t) { return t.id; });
        if (snap.things.length !== spec.n || snap.things.join("|") !== want.join("|")) {
          fail("band-counts", band + " did not use the first " + spec.n + " things.");
        }
        if (snap.cap !== spec.cap || snap.order !== spec.order) fail("band-counts", band + " band settings did not match.");
        const buttons = playEl.querySelectorAll("button");
        if (buttons.length !== spec.n) fail("band-counts", band + " drew " + buttons.length + " things.");
        const radius = parseFloat(document.getElementById("look-grad").getAttribute("r"));
        const dark = parseFloat(document.getElementById("dark-layer").getAttribute("opacity"));
        if (Math.abs(radius - spec.r) > 0.001) fail("band-counts", band + " glow radius was " + radius + ".");
        if (Math.abs(dark - spec.d) > 0.001) fail("band-counts", band + " darkness was " + dark + ".");
      }
    });
    run("scene-done", function () {
      const bands = ["tiny", "little", "shop", "rush"];
      let cursor = 100000;
      for (let b = 0; b < bands.length; b++) {
        const band = bands[b];
        resetInput();
        seed(1);
        start(band);
        const cap = BANDS[band].scenes;
        const count = BANDS[band].count;
        for (let s = 0; s < cap; s++) {
          const t0 = cursor;
          step(t0);
          if (state().screen !== "play" || state().scene !== SCENES[s].id) {
            fail("scene-done", band + " did not open scene " + s + ".");
          }
          const ids = SCENES[s].things.slice(0, count).map(function (t) { return t.id; });
          for (let i = 0; i < ids.length; i++) {
            const box = targetById(centers().targets, "thing-" + ids[i]);
            if (!box) fail("scene-done", band + " " + SCENES[s].id + " hid " + ids[i] + ".");
            else tap(box.nx, box.ny);
          }
          if (state().banner !== SCENES[s].ending || state().screen !== "play") {
            fail("scene-done", band + " did not show the ending line for " + SCENES[s].id + ".");
          }
          if (band === "tiny" && s === 0 && !reducedMotion()) {
            const op0 = parseFloat(document.getElementById("dark-layer").getAttribute("opacity"));
            if (!(op0 > 0.5)) fail("scene-done", "The dark layer was already gone.");
            step(t0 + FADE_MS);
            const op1 = parseFloat(document.getElementById("dark-layer").getAttribute("opacity"));
            if (op1 > 0.02) fail("scene-done", "The dark layer had not faded at 1500 ms.");
            if (state().scene !== SCENES[s].id) fail("scene-done", "The scene changed during the fade.");
          }
          step(t0 + NEXT_MS - 1);
          if (state().scene !== SCENES[s].id || state().screen !== "play") {
            fail("scene-done", band + " left " + SCENES[s].id + " before 2500 ms.");
          }
          step(t0 + NEXT_MS);
          cursor = t0 + NEXT_MS + 500;
        }
        if (state().screen !== "rest" || state().banner !== REST_BANNER) {
          fail("scene-done", band + " did not rest after " + cap + " scenes.");
        }
      }
    });
    run("data-valid", function () {
      if (SCENES.length !== 4) fail("data-valid", "The scene count was not 4.");
      let total = 0;
      const effects = { glow: 1, rise: 1, stretch: 1, steam: 1, sparkle: 1, blink: 1 };
      for (let s = 0; s < SCENES.length; s++) {
        const things = SCENES[s].things;
        if (things.length !== 5) fail("data-valid", SCENES[s].id + " did not have 5 things.");
        const seen = {};
        for (let i = 0; i < things.length; i++) {
          total += 1;
          const cell = things[i].cell;
          if (!cell || cell.length !== 2 || cell[0] < 0 || cell[0] > 3 || cell[1] < 0 || cell[1] > 3) {
            fail("data-valid", things[i].id + " had a cell outside the grid.");
          }
          const key = cell[0] + "," + cell[1];
          if (seen[key]) fail("data-valid", SCENES[s].id + " reused a cell.");
          seen[key] = true;
          if (!effects[things[i].effect]) fail("data-valid", things[i].id + " had an unknown effect.");
          if (things[i].after) {
            let at = -1;
            for (let j = 0; j < things.length; j++) if (things[j].id === things[i].after) at = j;
            if (at < 0 || at >= i) fail("data-valid", things[i].id + " follows something that is not earlier.");
          }
        }
      }
      if (total !== 20) fail("data-valid", "The thing count was not 20.");
    });
    run("sizes", function () {
      const views = [[390, 700], [1024, 768]];
      const eyeZ = Number(getComputedStyle(eyesEl).zIndex);
      const cardZ = Number(getComputedStyle(menuCard).zIndex);
      const btnZ = Number(getComputedStyle(muteBtn).zIndex);
      if (!(eyeZ < cardZ) || !(eyeZ < btnZ)) fail("sizes", "Eyes z-index sits over a card or button.");
      for (let v = 0; v < views.length; v++) {
        const w = views[v][0];
        const h = views[v][1];
        for (let b = 0; b < BAND_IDS.length; b++) {
          resetInput();
          seed(1);
          start(BAND_IDS[b]);
          const lay = targetsAt(w, h);
          if (!lay.ok) fail("sizes", BAND_IDS[b] + " at " + w + " by " + h + " was not ok.");
          const sc = sceneBox(w, h);
          const things = SCENES[0].things.slice(0, BANDS[BAND_IDS[b]].count);
          for (let i = 0; i < things.length; i++) {
            const g = thingGeom(sc, things[i].cell);
            if (Math.min(g.w, g.h) < 72) fail("sizes", things[i].id + " was under 72 at " + w + ".");
            if (g.x < 15.9 || g.y < 15.9 || g.x + g.w > w - 15.9 || g.y + g.h > h - 15.9) {
              fail("sizes", things[i].id + " sat inside the 16 px edge at " + w + ".");
            }
          }
          const eye = eyesBox(w);
          const blocks = lay.targets ? lay.targets.slice() : [];
          blocks.push(bannerBox(w));
          if (sc) blocks.push({ id: "scene", x: sc.x, y: sc.y, w: sc.size, h: sc.size });
          for (let i = 0; i < blocks.length; i++) {
            if (intersects(eye, blocks[i])) fail("sizes", "Eyes hit " + blocks[i].id + " at " + w + " by " + h + ".");
          }
        }
        go("menu");
        const menuLay = targetsAt(w, h);
        if (!menuLay.ok) fail("sizes", "The menu at " + w + " by " + h + " was not ok.");
        const menu = menuLayout(w, h);
        const eye = eyesBox(w);
        if (menu && (intersects(eye, menu.card) || intersects(eye, menu.title))) fail("sizes", "Eyes hit the menu card at " + w + " by " + h + ".");
        go("rest");
        const restLay = targetsAt(w, h);
        if (!restLay.ok) fail("sizes", "Rest at " + w + " by " + h + " was not ok.");
        const rest = restLayout(w, h);
        if (rest && (intersects(eye, rest.card) || intersects(eye, rest.another))) fail("sizes", "Eyes hit rest at " + w + " by " + h + ".");
      }
      if (document.documentElement.scrollWidth > window.innerWidth + 2 || document.documentElement.scrollHeight > window.innerHeight + 2) {
        fail("sizes", "The page scrolled.");
      }
      resetInput();
      go("menu");
      look(0.5, 0.02);
      step(clock > 0 ? clock + 20 : 90000);
      if (eyesEl.hidden) fail("sizes", "Eyes was hidden while a look was held.");
      const placed = eyesEl.getBoundingClientRect();
      const live = eyesBox(window.innerWidth);
      if (Math.abs(placed.left - live.x) > 1.5 || Math.abs(placed.top - live.y) > 1.5 || Math.abs(placed.width - live.w) > 1.5 || Math.abs(placed.height - live.h) > 1.5) {
        fail("sizes", "The running layout did not place Eyes from eyesBox.");
      }
      const buttons = document.querySelectorAll("button");
      for (let i = 0; i < buttons.length; i++) {
        const btn = buttons[i];
        if (!buttonVisible(btn)) continue;
        const r = btn.getBoundingClientRect();
        if (intersects({ x: placed.left, y: placed.top, w: placed.width, h: placed.height }, { x: r.left, y: r.top, w: r.width, h: r.height })) {
          fail("sizes", "Eyes hit the " + btn.id + " button.");
        }
      }
      releaseLook();
    });
    run("family-plain-state", function () {
      const before = JSON.stringify(state());
      start("nope");
      go("sideways");
      if (JSON.stringify(state()) !== before) fail("family-plain-state", "An unknown band or screen changed the state.");
      const end = state();
      if (!("level" in end) || !("screen" in end) || !("banner" in end) || !("muted" in end)) {
        fail("family-plain-state", "level, screen, banner, or muted was missing.");
      }
    });
    try { assertJunk("at the end"); }
    catch (err) { fail("family-query-inert", err && err.message ? err.message : "The junk check threw."); }
    try {
      if (writes !== 0) fail("family-no-storage", "The page called setItem or removeItem.");
      if (storeLen !== null && localStorage.length !== storeLen) fail("family-no-storage", "localStorage gained a key.");
      if (storeLen !== null && localStorage.getItem("pop-pals-v1") !== pop) fail("family-no-storage", "pop-pals-v1 changed.");
    } catch (err) {
      fail("family-no-storage", "Storage could not be read.");
    }
    try {
      if (origSet) localStorage.setItem = origSet;
      if (origRem) localStorage.removeItem = origRem;
    } catch (err) {}
    return { ok: failures.length === 0, failures: failures };
  }

  window.painterOfLight = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    selfCheck: selfCheck
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let result;
    try { result = selfCheck(); }
    catch (err) {
      result = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] };
    }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("rush")) start("rush");
    else if (params.has("play")) start("tiny");
    connectGaze();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
