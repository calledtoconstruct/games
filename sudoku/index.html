<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f0d8">
<title>Sudoku</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
    --child: #fff6df;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; pointer-events: none; z-index: 0;
  }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border: none; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 47; pointer-events: none;
    top: 22px; left: 50%; transform: translateX(-50%);
    background: var(--card); border-radius: 999px; padding: 6px 12px;
    font-weight: 800; font-size: 16px;
  }
  #banner {
    position: fixed; z-index: 45; pointer-events: none;
    left: 168px; right: 168px; top: 22px;
    text-align: center; font-size: 18px; font-weight: 800;
    color: var(--ink);
  }
  #mute, #full, #back, #new-board {
    position: fixed; z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1;
    font-size: 15px;
  }
  #mute, #full { width: 72px; height: 72px; }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; }
  #full { font-size: 16px; }
  #screen-menu {
    position: fixed; z-index: 40;
    top: 80px; left: 8px; right: 8px; bottom: 8px;
    overflow: auto;
    background: var(--card); border-radius: 28px;
    padding: 12px 16px 96px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  h1 { font-size: 40px; line-height: 0.95; margin: 0 0 6px; text-align: center; }
  .tag { text-align: center; margin: 0 0 6px; font-size: 16px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .choice {
    background: var(--card); text-align: left; padding: 6px 12px;
    box-shadow: 0 4px 0 #e2d0b4; border: 3px solid transparent;
    border-radius: 18px; min-height: 72px; width: 100%;
    font-weight: 800; color: var(--ink);
  }
  .choice b { display: block; font-size: 22px; }
  .choice small { display: block; font-size: 14px; color: #5c4e3a; font-weight: 800; }
  .choice[aria-pressed="true"] { border-color: var(--ink); background: var(--child); }
  #lets-go {
    position: fixed; z-index: 48;
    left: 24px; right: 24px; bottom: 16px; height: 72px;
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink);
    box-shadow: 0 5px 0 var(--sun-d);
    font-size: 32px; font-weight: 800;
  }
  #screen-rest {
    position: fixed; z-index: 40; left: 50%; top: 46%;
    transform: translate(-50%, -50%);
    width: min(460px, calc(100% - 32px));
    background: var(--card); border-radius: 28px;
    padding: 28px 20px; text-align: center;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #rest-line { font-size: 28px; font-weight: 800; margin: 0 0 16px; }
  #another {
    min-height: 72px; min-width: 180px; width: 100%;
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink);
    box-shadow: 0 5px 0 var(--sun-d);
    font-size: 28px; font-weight: 800;
  }
  .cell, .sym, .boxbtn, #undo, #hint, #boxes {
    border: none; border-radius: 16px;
    font-weight: 800; color: var(--ink);
    padding: 0; overflow: hidden;
  }
  .hole { background: var(--card); box-shadow: inset 0 0 0 3px #e4d3b0; }
  .given { background: var(--card); }
  .placed { background: var(--child); }
  .latched { outline: 4px solid var(--ink); outline-offset: -4px; }
  .sym { background: var(--card); box-shadow: 0 4px 0 #e2d0b4; }
  .sym.live { background: var(--sun); box-shadow: 0 4px 0 var(--sun-d); }
  .dim { background: #efe6cf; opacity: 0.45; box-shadow: none; }
  .boxbtn {
    background: var(--card); box-shadow: 0 4px 0 #e2d0b4;
  }
  #undo, #hint, #boxes, #new-board {
    background: var(--card); box-shadow: 0 4px 0 #d5c4a1; font-size: 20px;
  }
  #undo, #hint, #boxes { z-index: 32; position: fixed; }
  canvas.mark { display: block; width: 100%; height: 100%; pointer-events: none; }
  @media (prefers-reduced-motion: no-preference) {
    .pulse { animation: hintpulse 900ms ease-in-out infinite; }
  }
  @keyframes hintpulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>
<canvas id="view" aria-hidden="true"></canvas>
<button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/>
  </svg>
</button>
<button id="full" type="button" aria-label="Fullscreen">Full</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner" hidden></p>
<section id="screen-menu">
  <h1>Sudoku</h1>
  <p class="tag">Look at an empty square, then at the symbol that belongs there.</p>
  <p class="tag">Ages 2 and up</p>
  <div class="stack">
    <button id="tiny" class="choice" type="button" aria-pressed="true"><b>Picture Squares</b><small>Ages 2 to 3. Four pictures, and a very full board.</small></button>
    <button id="little" class="choice" type="button" aria-pressed="false"><b>Open Board</b><small>Ages 4 to 5. Four pictures, and more empty squares.</small></button>
    <button id="shop" class="choice" type="button" aria-pressed="false"><b>Number Grid</b><small>Ages 6 to 8. Digits on a six by six board.</small></button>
    <button id="rush" class="choice" type="button" aria-pressed="false"><b>Big Board</b><small>Ages 9 and up. Digits, and a nine by nine board when it fits.</small></button>
  </div>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden>
  <div id="board"></div>
  <div id="tray"></div>
  <button id="undo" type="button" data-play="true">Undo</button>
  <button id="hint" type="button" data-play="true">Hint</button>
  <button id="new-board" type="button">New board</button>
  <button id="boxes" type="button" data-play="true" hidden>Boxes</button>
</div>
<section id="screen-rest" hidden>
  <p id="rest-line">That board is done.</p>
</section>
<script>
(function () {
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const TOP = 80;
  const UNDO_H = 72;
  const INK = "#2c2416";

  const FALLBACK = {
    tiny: ["1204", "3012", "2301", "4023"],
    little: ["1004", "3002", "2301", "0003"],
    shop: ["023056", "450103", "230560", "501230", "305610", "602340"],
    rush6: ["020006", "450103", "200500", "501230", "305600", "002340"],
    rush9: ["020400009", "056009023", "780123056", "204007090", "000801200", "091230067", "000608010", "608000005", "910340078"]
  };

  function geom(size) {
    if (size === 4) return { boxRows: 2, boxCols: 2 };
    if (size === 6) return { boxRows: 2, boxCols: 3 };
    return { boxRows: 3, boxCols: 3 };
  }
  function makeRng(seed) { return { state: seed >>> 0 }; }
  function rngUint(rng) {
    rng.state = (rng.state + 0x6D2B79F5) >>> 0;
    let t = Math.imul(rng.state ^ (rng.state >>> 15), rng.state | 1);
    t = (t ^ (t + Math.imul(t ^ (t >>> 7), t | 61))) >>> 0;
    return (t ^ (t >>> 14)) >>> 0;
  }
  function rngInt(rng, lo, hi) { return lo + (rngUint(rng) % (hi - lo + 1)); }
  function rngShuffle(rng, items) {
    const a = items.slice();
    for (let i = a.length - 1; i >= 1; i--) {
      const j = rngInt(rng, 0, i);
      const tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }
  function playSeed(clockMs, counter) {
    return (Math.imul(((clockMs >>> 0) ^ Math.imul(counter >>> 0, 0x9E3779B9)), 0x85EBCA6B)) >>> 0;
  }
  function seq(n) {
    const a = [];
    for (let i = 0; i < n; i++) a.push(i);
    return a;
  }
  function boxIndexAt(size, r, c) {
    const g = geom(size);
    return Math.floor(r / g.boxRows) * (size / g.boxCols) + Math.floor(c / g.boxCols);
  }
  function cellsInBox(size, b) {
    const g = geom(size);
    const across = size / g.boxCols;
    const br = Math.floor(b / across);
    const bc = b % across;
    const cells = [];
    for (let r = br * g.boxRows; r < (br + 1) * g.boxRows; r++) {
      for (let c = bc * g.boxCols; c < (bc + 1) * g.boxCols; c++) cells.push(r * size + c);
    }
    return cells;
  }
  function sudokuCandidates(size, grid, index) {
    if (grid[index] !== 0) return [];
    const r = Math.floor(index / size);
    const c = index % size;
    const used = new Array(size + 1).fill(false);
    for (let i = 0; i < size; i++) {
      used[grid[r * size + i]] = true;
      used[grid[i * size + c]] = true;
    }
    const g = geom(size);
    const br = Math.floor(r / g.boxRows) * g.boxRows;
    const bc = Math.floor(c / g.boxCols) * g.boxCols;
    for (let rr = br; rr < br + g.boxRows; rr++) {
      for (let cc = bc; cc < bc + g.boxCols; cc++) used[grid[rr * size + cc]] = true;
    }
    const out = [];
    for (let v = 1; v <= size; v++) if (!used[v]) out.push(v);
    return out;
  }
  function sudokuCountSolutions(size, grid) {
    const work = grid.slice();
    let nodes = 0;
    function search() {
      nodes++;
      if (nodes > 600) return 2;
      let best = -1;
      let bestC = null;
      for (let i = 0; i < work.length; i++) {
        if (work[i] !== 0) continue;
        const cands = sudokuCandidates(size, work, i);
        if (best < 0 || cands.length < bestC.length) {
          best = i;
          bestC = cands;
          if (cands.length === 0) break;
        }
      }
      if (best < 0) return 1;
      if (bestC.length === 0) return 0;
      let total = 0;
      for (let k = 0; k < bestC.length; k++) {
        work[best] = bestC[k];
        total += search();
        work[best] = 0;
        if (total >= 2) return 2;
      }
      return total;
    }
    return search();
  }
  function findHidden(size, work) {
    const g = geom(size);
    const nBoxes = (size / g.boxRows) * (size / g.boxCols);
    const units = [];
    for (let r = 0; r < size; r++) {
      const u = [];
      for (let c = 0; c < size; c++) u.push(r * size + c);
      units.push(u);
    }
    for (let c = 0; c < size; c++) {
      const u = [];
      for (let r = 0; r < size; r++) u.push(r * size + c);
      units.push(u);
    }
    for (let b = 0; b < nBoxes; b++) units.push(cellsInBox(size, b));
    for (let u = 0; u < units.length; u++) {
      const cells = units[u];
      for (let sym = 1; sym <= size; sym++) {
        let present = false;
        const spots = [];
        for (let k = 0; k < cells.length; k++) {
          const idx = cells[k];
          if (work[idx] === sym) present = true;
          else if (work[idx] === 0) {
            const cands = sudokuCandidates(size, work, idx);
            if (cands.indexOf(sym) >= 0) spots.push(idx);
          }
        }
        if (!present && spots.length === 1) return { index: spots[0], symbol: sym };
      }
    }
    return null;
  }
  function sudokuSolveSingles(size, grid, mode) {
    const work = grid.slice();
    const n = work.length;
    let guard = 0;
    while (guard++ < n * n + 5) {
      let placedAt = -1;
      let sym = 0;
      for (let i = 0; i < n; i++) {
        if (work[i] !== 0) continue;
        const cands = sudokuCandidates(size, work, i);
        if (cands.length === 1) { placedAt = i; sym = cands[0]; break; }
      }
      if (placedAt >= 0) { work[placedAt] = sym; continue; }
      let empty = false;
      for (let i = 0; i < n; i++) if (work[i] === 0) { empty = true; break; }
      if (!empty) return work;
      if (mode !== "both") return null;
      const hid = findHidden(size, work);
      if (!hid) return null;
      work[hid.index] = hid.symbol;
    }
    return null;
  }
  function sudokuOpeningNaked(size, grid) {
    for (let i = 0; i < grid.length; i++) {
      if (grid[i] === 0 && sudokuCandidates(size, grid, i).length !== 1) return false;
    }
    return true;
  }
  function eqArr(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }
  function baseGrid(size) {
    const g = geom(size);
    const grid = new Array(size * size);
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        grid[r * size + c] = (g.boxCols * (r % g.boxRows) + Math.floor(r / g.boxRows) + c) % size + 1;
      }
    }
    return grid;
  }
  function fillComplete(size, rng) {
    const g = geom(size);
    let grid = baseGrid(size);
    const symbols = [];
    for (let v = 1; v <= size; v++) symbols.push(v);
    const map = rngShuffle(rng, symbols);
    for (let i = 0; i < grid.length; i++) grid[i] = map[grid[i] - 1];
    const nBands = size / g.boxRows;
    const rowSrc = seq(size);
    for (let b = 0; b < nBands; b++) {
      const idxs = [];
      for (let i = 0; i < g.boxRows; i++) idxs.push(b * g.boxRows + i);
      const sh = rngShuffle(rng, idxs);
      for (let i = 0; i < g.boxRows; i++) rowSrc[b * g.boxRows + i] = sh[i];
    }
    const bandPerm = rngShuffle(rng, seq(nBands));
    const finalRow = new Array(size);
    for (let b = 0; b < nBands; b++) {
      const srcBand = bandPerm[b];
      for (let i = 0; i < g.boxRows; i++) finalRow[b * g.boxRows + i] = rowSrc[srcBand * g.boxRows + i];
    }
    const rows = [];
    for (let r = 0; r < size; r++) rows.push(grid.slice(r * size, (r + 1) * size));
    let next = new Array(size * size);
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) next[r * size + c] = rows[finalRow[r]][c];
    }
    grid = next;
    const nStacks = size / g.boxCols;
    const colSrc = seq(size);
    for (let s = 0; s < nStacks; s++) {
      const idxs = [];
      for (let i = 0; i < g.boxCols; i++) idxs.push(s * g.boxCols + i);
      const sh = rngShuffle(rng, idxs);
      for (let i = 0; i < g.boxCols; i++) colSrc[s * g.boxCols + i] = sh[i];
    }
    const stackPerm = rngShuffle(rng, seq(nStacks));
    const finalCol = new Array(size);
    for (let s = 0; s < nStacks; s++) {
      const srcStack = stackPerm[s];
      for (let i = 0; i < g.boxCols; i++) finalCol[s * g.boxCols + i] = colSrc[srcStack * g.boxCols + i];
    }
    const out = new Array(size * size);
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) out[r * size + c] = grid[r * size + finalCol[c]];
    }
    return out;
  }
  function givenCount(grid) {
    let n = 0;
    for (let i = 0; i < grid.length; i++) if (grid[i]) n++;
    return n;
  }
  function distinctCount(grid) {
    const seen = [];
    for (let i = 0; i < grid.length; i++) if (grid[i] && seen.indexOf(grid[i]) < 0) seen.push(grid[i]);
    return seen.length;
  }
  function boxEmptyCounts(size, grid) {
    const g = geom(size);
    const n = (size / g.boxRows) * (size / g.boxCols);
    const counts = new Array(n).fill(0);
    for (let i = 0; i < grid.length; i++) {
      if (grid[i] === 0) counts[boxIndexAt(size, Math.floor(i / size), i % size)]++;
    }
    return counts;
  }
  function spreadOk(size, grid) {
    const counts = boxEmptyCounts(size, grid);
    let mn = counts[0];
    let mx = counts[0];
    for (let i = 1; i < counts.length; i++) {
      if (counts[i] < mn) mn = counts[i];
      if (counts[i] > mx) mx = counts[i];
    }
    return mx - mn <= 1;
  }
  function rowMinOk(size, grid, min) {
    for (let r = 0; r < size; r++) {
      let n = 0;
      for (let c = 0; c < size; c++) if (grid[r * size + c]) n++;
      if (n < min) return false;
    }
    return true;
  }
  function specOf(band, size) {
    if (band === "tiny") return { min: 12, max: 12, floor: 12, distinct: 3, row: 0 };
    if (band === "little") return { min: 8, max: 10, floor: 8, distinct: 3, row: 0 };
    if (band === "shop") return { min: 24, max: 28, floor: 24, distinct: 5, row: 4 };
    if (size === 9) return { min: 40, max: 48, floor: 40, distinct: 8, row: 0 };
    return { min: 18, max: 22, floor: 18, distinct: 5, row: 0 };
  }
  function techOk(band, size, grid, solution) {
    if (band === "tiny") return sudokuOpeningNaked(size, grid);
    if (band === "little") {
      const solved = sudokuSolveSingles(size, grid, "naked");
      return !!(solved && eqArr(solved, solution));
    }
    const solved = sudokuSolveSingles(size, grid, "both");
    return !!(solved && eqArr(solved, solution));
  }
  function keepOk(band, size, grid, solution, spec) {
    if (distinctCount(grid) < spec.distinct) return false;
    if (spec.row && !rowMinOk(size, grid, spec.row)) return false;
    if (!techOk(band, size, grid, solution)) return false;
    if (sudokuCountSolutions(size, grid) !== 1) return false;
    return true;
  }
  function parseRows(rows) {
    const out = [];
    for (let r = 0; r < rows.length; r++) {
      for (let c = 0; c < rows[r].length; c++) out.push(rows[r].charCodeAt(c) - 48);
    }
    return out;
  }
  function fallbackPack(band, size) {
    const key = band === "rush" ? (size === 9 ? "rush9" : "rush6") : band;
    return { puzzle: parseRows(FALLBACK[key]), solution: baseGrid(size) };
  }
  function sudokuGenerate(band, size, seed) {
    const spec = specOf(band, size);
    const rng = makeRng(seed >>> 0);
    for (let attempt = 0; attempt < 8; attempt++) {
      const solution = fillComplete(size, rng);
      const puzzle = solution.slice();
      const order = rngShuffle(rng, seq(size * size));
      let stop = false;
      while (!stop) {
        if (givenCount(puzzle) <= spec.floor) break;
        const empties = boxEmptyCounts(size, puzzle);
        let minC = empties[0];
        for (let i = 1; i < empties.length; i++) if (empties[i] < minC) minC = empties[i];
        let cleared = false;
        for (let oi = 0; oi < order.length; oi++) {
          if (givenCount(puzzle) <= spec.floor) { stop = true; break; }
          const idx = order[oi];
          if (puzzle[idx] === 0) continue;
          const b = boxIndexAt(size, Math.floor(idx / size), idx % size);
          if (empties[b] !== minC) continue;
          const saved = puzzle[idx];
          puzzle[idx] = 0;
          if (keepOk(band, size, puzzle, solution, spec)) {
            empties[b]++;
            cleared = true;
          } else puzzle[idx] = saved;
        }
        if (stop) break;
        if (!cleared) break;
      }
      const g = givenCount(puzzle);
      const ok = g >= spec.min && g <= spec.max && spreadOk(size, puzzle) &&
        distinctCount(puzzle) >= spec.distinct &&
        (!spec.row || rowMinOk(size, puzzle, spec.row)) &&
        techOk(band, size, puzzle, solution) &&
        sudokuCountSolutions(size, puzzle) === 1;
      if (ok) {
        return { band: band, size: size, puzzle: puzzle, solution: solution, givens: g, fallbackUsed: false };
      }
    }
    const fb = fallbackPack(band, size);
    return {
      band: band, size: size, puzzle: fb.puzzle, solution: fb.solution,
      givens: givenCount(fb.puzzle), fallbackUsed: true
    };
  }

  let screenId = "menu";
  let level = "tiny";
  let muted = false;
  let bandStarted = false;
  let dealt = 0;
  let sizeN = null;
  let puzzle = null;
  let solution = null;
  let clue = [];
  let clueCount = 0;
  let placed = [];
  let latched = null;

      const hole = state().puzzle.indexOf(0);
      latch("cell-" + hole);
      const cands = sudokuCandidates(4, state().puzzle, hole);
      let dead = 9;
      for (let v = 1; v <= 4; v++) if (cands.indexOf(v) < 0) dead = v;
      const beforeDead = state().puzzle.slice();
      write(dead);
      if (!same(state().puzzle, beforeDead)) fail("dead-symbol", "a dead symbol was written.");
      if ("mistakes" in state()) fail("dead-symbol", "a mistakes field appeared.");
      const probe = "::not-a-symbol::";
      write(probe);
      write("1");
      if (!same(state().puzzle, beforeDead)) fail("dead-symbol", "a string write changed the board.");
      if (pageShows(probe)) fail("dead-symbol", "a string was inserted into the page.");

      seed(1);
      start("tiny");
      const fresh = state().puzzle.slice();
      undo();
      if (!same(state().puzzle, fresh)) fail("undo-child-only", "undo changed a fresh board.");
      hint();
      write(state().hint.symbol);
      if (!state().placed.length) fail("undo-child-only", "the child write was not recorded.");
      undo();
      if (state().placed.length !== 0) fail("undo-child-only", "undo left the child symbol in place.");
      for (let i = 0; i < fresh.length; i++) {
        if (fresh[i] && state().puzzle[i] !== fresh[i]) fail("undo-child-only", "undo changed a given.");
      }

      seed(1);
      start("little");
      const beforeHint = state().puzzle.slice();
      hint();
      const hinted = state();
      if (!hinted.hint || hinted.latched === null || hinted.placed.length !== 0) {
        fail("hint-does-not-write", "hint did not latch a cell without writing.");
      }
      if (!hinted.hint || hinted.puzzle[hinted.hint.index] !== 0 || !same(hinted.puzzle, beforeHint)) {
        fail("hint-does-not-write", "hint filled the cell.");
      }

      seed(1);
      start("tiny");
      const firstPuzzle = state().puzzle.slice();
      again();
      if (state().screen !== "board" || !same(state().puzzle, firstPuzzle)) {
        fail("another-gated", "Another changed the board before it was solved.");
      }
      let guard = 0;
      while (!state().solved && guard < 16) {
        hint();
        const h = state().hint;
        if (!h) break;
        write(h.symbol);
        guard++;
      }
      if (!state().solved || state().screen !== "rest") fail("another-gated", "the first board did not reach rest.");
      seed(2);
      again();
      const second = sudokuGenerate("tiny", 4, 2);
      if (state().screen !== "board" || state().placed.length !== 0 || !same(state().puzzle, second.puzzle)) {
        fail("another-gated", "Another did not deal the seed 2 board.");
      }
      guard = 0;
      while (!state().solved && guard < 16) {
        hint();
        const h = state().hint;
        if (!h) break;
        write(h.symbol);
        guard++;
      }
      if (document.getElementById("another")) fail("another-gated", "Another was offered after the second board.");
      const third = state().puzzle.slice();
      const dealtNow = state().dealt;
      again();
      if (state().dealt !== dealtNow || state().screen !== "rest" || !same(state().puzzle, third)) {
        fail("another-gated", "Another dealt a third board.");
      }

      seed(1);
      start("rush");
      const rushView = targetsAt(390, 844);
      const rushCells = rushView.targets.filter(function (item) { return item.id.indexOf("cell-") === 0; });
      const rushBoxes = rushView.targets.filter(function (item) { return item.id.indexOf("box-") === 0; });
      if (rushCells.length >= 81) fail("rush-narrow", "a full 9 by 9 of cells was listed.");
      for (let i = 0; i < rushCells.length; i++) {
        if (Math.min(rushCells[i].w, rushCells[i].h) < 72) fail("rush-narrow", "a cell was under 72.");
      }
      if (!rushBoxes.length && !rushCells.length) fail("rush-narrow", "no box or cell targets were listed.");
      for (let i = 0; i < rushBoxes.length; i++) {
        if (rushBoxes[i].w !== 114 || rushBoxes[i].h !== 114) {
          fail("rush-narrow", "a box button was " + rushBoxes[i].w + " by " + rushBoxes[i].h + ".");
        }
      }

      const nested = document.querySelectorAll("button button");
      if (nested.length) fail("no-pencil", "a button was nested inside a button.");
      const cellNodes = document.querySelectorAll("[id^='cell-']");
      for (let i = 0; i < cellNodes.length; i++) {
        if (cellNodes[i].querySelector("button")) fail("no-pencil", "a cell contained a button.");
      }

      const tally = state();
      ["mistakes", "wrongs", "rank", "score", "lives", "clock", "msLeft", "said"].forEach(function (key) {
        if (key in tally) fail("no-tally", "state has " + key + ".");
      });
      write("nope");
      const bannerNow = state().banner.toLowerCase();
      if (bannerNow.indexOf("fail") >= 0 || bannerNow.indexOf("wrong") >= 0 || bannerNow.indexOf("mistake") >= 0) {
        fail("no-tally", "the banner scolded a dead write.");
      }
      if (speakCalls !== 0) fail("no-speech", "speech was called.");

      const eng = engineSelfCheck();
      for (let i = 0; i < eng.failures.length; i++) failures.push(eng.failures[i]);
    } catch (err) {
      fail("self-check", err && err.message ? err.message : "the check threw.");
    }
    if (!storageOk) fail("family-no-storage", "storage could not be read.");
    else {
      try {
        const popAfter = localStorage.getItem("pop-pals-v1");
        const keysAfter = [];
        for (let i = 0; i < localStorage.length; i++) keysAfter.push(localStorage.key(i));
        if (popAfter !== popBefore) fail("family-no-storage", "pop-pals-v1 changed.");
        if (storageWrites !== 0) fail("family-no-storage", "storage was written.");
        if (keysAfter.length !== keysBefore.length) fail("family-no-storage", "a storage key was added.");
        for (let i = 0; i < keysAfter.length; i++) {
          if (keysBefore.indexOf(keysAfter[i]) < 0) fail("family-no-storage", "a storage key was added.");
        }
      } catch (e) {
        fail("family-no-storage", "storage could not be read after the cases.");
      }
    }
    return { ok: failures.length === 0, failures: failures };
  }

  document.getElementById("tiny").addEventListener("click", function () { selectBand("tiny"); render(); });
  document.getElementById("little").addEventListener("click", function () { selectBand("little"); render(); });
  document.getElementById("shop").addEventListener("click", function () { selectBand("shop"); render(); });
  document.getElementById("rush").addEventListener("click", function () { selectBand("rush"); render(); });
  letsBtn.addEventListener("click", function () { start(level); });
  backBtn.addEventListener("click", function () { go("menu"); });
  undoBtn.addEventListener("click", undo);
  hintBtn.addEventListener("click", hint);
  newBtn.addEventListener("click", newBoard);
  boxesBtn.addEventListener("click", toBoxes);
  muteBtn.addEventListener("click", toggleMute);
  fullBtn.addEventListener("click", toggleFull);
  document.addEventListener("pointerdown", function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    if (pointerActive) return;
    pointerActive = true;
    activePointer = e.pointerId;
    ensureAudio();
    dwellKey = null;
    dwellFired = false;
    leaveAt = 0;
    dwellProgress = 0;
  }, true);
  function endPointer(e) {
    if (activePointer === null || e.pointerId !== activePointer) return;
    activePointer = null;
    pointerActive = false;
  }
  document.addEventListener("pointerup", endPointer, true);
  document.addEventListener("pointercancel", endPointer, true);
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    if (e.key === "Escape") {
      if (!backBtn.hidden) { backBtn.click(); e.preventDefault(); }
      return;
    }
    if (screenId !== "board" || !sizeN || !puzzle) return;
    if (e.key === "u" || e.key === "U") { undo(); e.preventDefault(); return; }
    if (e.key === "h" || e.key === "H") { hint(); e.preventDefault(); return; }
    if (/^[1-9]$/.test(e.key) && latched !== null) {
      write(Number(e.key));
      e.preventDefault();
      return;
    }
    const arrow = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!arrow) return;
    e.preventDefault();
    if (latched === null) {
      for (let i = 0; i < puzzle.length; i++) {
        if (puzzle[i] === 0) { latch("cell-" + i); return; }
      }
      return;
    }
    let c = (latched % sizeN) + arrow[0];
    let r = Math.floor(latched / sizeN) + arrow[1];
    while (r >= 0 && c >= 0 && r < sizeN && c < sizeN) {
      const idx = r * sizeN + c;
      if (puzzle[idx] === 0) { latch("cell-" + idx); return; }
      c += arrow[0];
      r += arrow[1];
    }
  });
  window.addEventListener("resize", function () { render(); });

  window.sudoku = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    selfCheck: selfCheck,
    latch: latch,
    write: write,
    undo: undo,
    hint: hint,
    zoom: zoom,
    newBoard: newBoard,
    again: again
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (e) { /* already closed */ }
      gazeSock = null;
    }
    const result = selfCheck();
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("play")) start("tiny");
    else if (params.has("rush")) start("rush");
    requestAnimationFrame(function frame(now) {
      if (!checking) step(now);
      requestAnimationFrame(frame);
    });
    connectGaze();
  }
})();
</script>
</body>
</html>
