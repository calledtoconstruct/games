<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>Follow the Lights</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; touch-action: none; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 28; pointer-events: none;
    background: var(--card); border-radius: 999px; padding: 8px 12px;
    font-weight: 800; font-size: 16px;
  }
  #banner {
    position: fixed; z-index: 25; pointer-events: none; margin: 0;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 4px 12px; font-size: 18px; font-weight: 800;
    text-align: center; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #dots {
    position: fixed; z-index: 24; pointer-events: none;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  #dots i {
    width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--ink); background: transparent;
    display: block;
  }
  #dots i.on { background: var(--ink); }
  #menu-card, #rest-card {
    position: fixed; z-index: 2; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #screen-menu, #screen-rest, #play, #menu-copy, #rest-line, h1, p, b, small {
    pointer-events: none;
  }
  #menu-copy, #rest-line {
    position: fixed; z-index: 24; margin: 0; text-align: center; overflow: hidden;
  }
  #menu-copy h1 { margin: 0; font-size: 26px; line-height: 28px; }
  #menu-copy p { margin: 0; font-size: 14px; line-height: 16px; }
  #rest-line { font-size: 28px; font-weight: 800; }
  #mute, #full, #back, #lets-go, #tiny, #little, #shop, #rush, #another, #play button {
    position: fixed; z-index: 30; pointer-events: auto;
  }
  #mute, #full, #back {
    z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1; font-size: 15px; line-height: 1.1;
    padding: 4px; overflow: hidden;
  }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; display: block; }
  #tiny, #little, #shop, #rush {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; color: var(--ink); text-align: left;
    padding: 4px 10px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  #tiny b, #little b, #shop b, #rush b { display: block; font-size: 18px; line-height: 20px; }
  #tiny small, #little small, #shop small, #rush small {
    display: block; font-size: 12px; line-height: 14px; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go, #another {
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink); font-weight: 800;
    box-shadow: 0 5px 0 var(--sun-d); font-size: 26px;
  }
  #play button {
    border: 4px solid var(--ink); border-radius: 28px;
    background: var(--card); color: var(--ink);
    padding: 0; overflow: hidden;
    display: grid; place-items: center;
  }
  #play button.lit {
    background: var(--pad, var(--sun));
    border-width: 8px;
  }
  #play button svg { width: 68%; height: 68%; display: block; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) {
    #play button.lit { transform: none; }
  }
</style>
</head>
<body>
<button id="mute" type="button" aria-label="Mute sound">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8l6 8"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner">Pick who is playing.</p>
<div id="dots" hidden></div>
<section id="screen-menu">
  <div id="menu-card"></div>
  <div id="menu-copy">
    <h1>Follow the Lights</h1>
    <p>Watch the lights, then look at them in the same order.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>One Light</b><small>Ages 2 to 3. Two big pads.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Light Show</b><small>Ages 4 to 5. Three pads.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Light Chain</b><small>Ages 6 to 8. Four pads.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Long Chain</b><small>Ages 9 and up. Four pads, longer chains.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden></div>
<section id="screen-rest" hidden>
  <div id="rest-card"></div>
  <p id="rest-line">You followed every light.</p>
  <button id="another" type="button">Another</button>
</section>
<script>
(function () {
  "use strict";
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const BAND_IDS = ["tiny", "little", "shop", "rush"];
  const PADS = [
    { id: "sun", shape: "circle", color: "#E69F00", tone: 262, label: "Sun" },
    { id: "sea", shape: "square", color: "#56B4E9", tone: 330, label: "Sea" },
    { id: "leaf", shape: "triangle", color: "#009E73", tone: 392, label: "Leaf" },
    { id: "flower", shape: "star", color: "#CC79A7", tone: 523, label: "Flower" }
  ];
  const BANDS = {
    tiny: { pads: 2, start: 1, longest: 3, on: 900, gap: 450 },
    little: { pads: 3, start: 2, longest: 5, on: 800, gap: 400 },
    shop: { pads: 4, start: 2, longest: 7, on: 700, gap: 350 },
    rush: { pads: 4, start: 3, longest: 9, on: 600, gap: 300 }
  };
  const SVG_NS = "http://www.w3.org/2000/svg";
  const STAR = (function () {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? 36 : 15;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      pts.push((50 + r * Math.cos(a)).toFixed(1) + "," + (52 + r * Math.sin(a)).toFixed(1));
    }
    return pts.join(" ");
  })();

  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const backBtn = document.getElementById("back");
  const eyesEl = document.getElementById("eyes");
  const gazeEl = document.getElementById("gaze");
  const bannerEl = document.getElementById("banner");
  const dotsEl = document.getElementById("dots");
  const menuEl = document.getElementById("screen-menu");
  const menuCard = document.getElementById("menu-card");
  const menuCopy = document.getElementById("menu-copy");
  const playEl = document.getElementById("play");
  const restEl = document.getElementById("screen-rest");
  const restCard = document.getElementById("rest-card");
  const restLine = document.getElementById("rest-line");
  const soundOn = document.getElementById("sound-on");
  const soundOff = document.getElementById("sound-off");
  const anotherBtn = document.getElementById("another");

  let screen = "menu";
  let level = "tiny";
  let phase = "menu";
  let pattern = [];
  let matched = 0;
  let misses = 0;
  let lit = null;
  let beats = [];
  let pin = null;
  let counter = 1;
  let rng = null;
  let muted = false;
  let checking = false;
  let suppressReconnect = false;
  let clock = 0;
  let ac = null;
  let master = null;
  let pointerDown = false;
  let armedId = null;
  let padKey = null;
  let gazeSock = null;
  let gazeTimer = 0;
  let gazeBuf = new Uint8Array(0);
  let gazeWarp = null;
  let gazeHold = null;
  let refreshHold = false;
  let haveSmooth = false;
  let smoothed = null;
  let gazePoint = null;
  let gazeAt = 0;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;
  let dwellMs = PLAY_DWELL_MS;
  let dwellOffAt = 0;
  let trailOn = false;

  function makeRng(seed) {
    let state = seed >>> 0;
    return {
      uint() {
        state = (state + 0x6D2B79F5) >>> 0;
        let t = Math.imul(state ^ (state >>> 15), state | 1);
        t = t ^ (t + Math.imul(t ^ (t >>> 7), t | 61));
        return (t ^ (t >>> 14)) >>> 0;
      }
    };
  }
  function rngUint(rngNow) { return rngNow.uint(); }
  function rngInt(rngNow, lo, hi) {
    return lo + (rngUint(rngNow) % (hi - lo + 1));
  }
  function playSeed(clockMs, count) {
    return (Math.imul(((clockMs >>> 0) ^ Math.imul(count >>> 0, 0x9E3779B9)), 0x85EBCA6B)) >>> 0;
  }
  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  function knownBand(band) { return BAND_IDS.indexOf(band) >= 0; }
  function padById(id) {
    for (let i = 0; i < PADS.length; i++) if (PADS[i].id === id) return PADS[i];
    return null;
  }
  function padIndex(id) {
    for (let i = 0; i < PADS.length; i++) if (PADS[i].id === id) return i;
    return -1;
  }
  function allowRepeat() { return level === "shop" || level === "rush"; }
  function padSlot(count, prevIndex, repeatOk) {
    if (prevIndex < 0 || repeatOk) return rngInt(rng, 0, count - 1);
    const pick = rngInt(rng, 0, count - 2);
    return pick >= prevIndex ? pick + 1 : pick;
  }
  function takePageSeed() {
    let s;
    if (pin !== null) s = pin;
    else if (checking) s = 1;
    else s = playSeed(Date.now(), counter);
    pin = null;
    counter += 1;
    return s >>> 0;
  }
  function addOne() {
    const spec = BANDS[level];
    if (!spec || pattern.length >= spec.longest) return;
    const prev = pattern.length ? padIndex(pattern[pattern.length - 1]) : -1;
    pattern.push(PADS[padSlot(spec.pads, prev, allowRepeat())].id);
  }

  function bannerText() {
    if (screen === "menu") return "Pick who is playing.";
    if (screen === "rest") return "You followed every light.";
    if (phase === "again") return "Watch again.";
    if (phase === "turn" || phase === "flash") return "Your turn.";
    return "Watch.";
  }
  function state() {
    const spec = BANDS[level];
    return {
      level: level,
      screen: screen,
      banner: bannerText(),
      muted: muted,
      phase: phase,
      pattern: pattern.slice(),
      matched: matched,
      lit: lit,
      pads: spec ? spec.pads : 0
    };
  }
  function go(next) {
    if (next !== "menu" && next !== "play" && next !== "rest") return;
    screen = next;
    if (next === "menu") {
      beats = [];
      phase = "menu";
      lit = null;
    }
    render();
  }
  function armHead() {
    const beat = beats[0];
    if (!beat || beat.armed) return;
    beat.armed = true;
    if (beat.kind === "show" || beat.kind === "gap") phase = "watch";
    else if (beat.kind === "lock") phase = "flash";
    else if (beat.kind === "pause") phase = "celebrate";
    else if (beat.kind === "again") phase = "again";
    else if (beat.kind === "turn") phase = "turn";
    lit = beat.lit || null;
    if ((beat.kind === "show" || beat.kind === "lock" || beat.kind === "again") && beat.lit) {
      const ms = beat.kind === "again" ? 300 : beat.ms;
      toneFor(beat.lit, ms);
    }
    if (beat.chime === "happy") playChime([262, 330, 392, 523], 80);
    if (beat.chime === "win") playChime([523, 659, 784, 1047], 80);
  }
  function enqueueShow() {
    const spec = BANDS[level];
    const next = [];
    matched = 0;
    if (!spec) {
      beats = [];
      phase = "watch";
      lit = null;
      return;
    }
    for (let i = 0; i < pattern.length; i++) {
      next.push({ kind: "show", ms: spec.on, lit: pattern[i] });
      next.push({ kind: "gap", ms: spec.gap, lit: null });
    }
    next.push({ kind: "turn", ms: 0, lit: null });
    beats = next;
    phase = "watch";
    lit = pattern.length ? pattern[0] : null;
    armHead();
  }
  function finishBeat(beat) {
    if (!beat) return;
    if (beat.kind === "again") {
      misses += 1;
      enqueueShow();
      return;
    }
    if (beat.grow) {
      addOne();
      misses = 0;
      enqueueShow();
      return;
    }
    if (beat.kind === "rest") {
      lit = null;
      beats = [];
      phase = "rest";
      go("rest");
    }
  }
  function advance(ms) {
    if (screen !== "play") return;
    let left = ms;
    let guard = 0;
    while (guard++ < 10000) {
      if (!beats.length) return;
      const beat = beats[0];
      if (beat.kind === "turn") {
        beats.shift();
        const spec = BANDS[level];
        if (misses >= 2 && spec && pattern.length > spec.start) {
          pattern = pattern.slice(0, pattern.length - 1);
          misses = 0;
          enqueueShow();
          return;
        }
        phase = "turn";
        lit = null;
        return;
      }
      if (beat.kind === "rest") {
        beats.shift();
        finishBeat(beat);
        return;
      }
      armHead();
      if (left <= 0) return;
      const slice = Math.min(left, beat.ms);
      if (beat.kind === "again" && beat.litMs != null) {
        beat.litMs -= slice;
        if (beat.litMs <= 0) lit = null;
      }
      beat.ms -= slice;
      left -= slice;
      if (beat.ms > 0) return;
      beats.shift();
      finishBeat(beat);
    }
  }
  function start(band) {
    if (!knownBand(band)) return;
    level = band;
    const spec = BANDS[band];
    rng = makeRng(takePageSeed());
    pattern = [];
    misses = 0;
    matched = 0;
    const repeatOk = band === "shop" || band === "rush";
    for (let i = 0; i < spec.start; i++) {
      const prev = pattern.length ? padIndex(pattern[pattern.length - 1]) : -1;
      pattern.push(PADS[padSlot(spec.pads, prev, repeatOk)].id);
    }
    enqueueShow();
    go("play");
  }
  function highlight(id) {
    if (!knownBand(id) || screen !== "menu") return;
    level = id;
    render();
  }
  function pressPad(pid) {
    if (screen !== "play" || phase !== "turn") {
      render();
      return;
    }
    const spec = BANDS[level];
    const idx = padIndex(pid);
    if (!spec || idx < 0 || idx >= spec.pads || matched < 0 || matched >= pattern.length) {
      render();
      return;
    }
    if (pattern[matched] !== pid) {
      matched = 0;
      beats = [{ kind: "again", ms: 800, lit: pid, litMs: 300 }];
      phase = "again";
      armHead();
      render();
      return;
    }
    matched += 1;
    if (matched >= pattern.length && pattern.length >= spec.longest) {
      beats = [{ kind: "lock", ms: 300, lit: pid, chime: "win" }, { kind: "rest", ms: 0 }];
    } else if (matched >= pattern.length) {
      beats = [{ kind: "lock", ms: 300, lit: pid }, { kind: "pause", ms: 700, grow: true, chime: "happy" }];
    } else {
      beats = [{ kind: "lock", ms: 300, lit: pid }, { kind: "turn", ms: 0 }];
    }
    phase = "flash";
    armHead();
    render();
  }

  function intersects(a, b) {
    return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  }
  function eyesBox(w) {
    const fullX = w - 8 - 72;
    const muteX = fullX - 8 - 72;
    return { x: muteX - 8 - 72, y: 8 + 18, w: 72, h: 36 };
  }
  function chromeBoxes(w) {
    const y = 8;
    const bh = 72;
    const full = { id: "full", x: w - 8 - 72, y: y, w: 72, h: bh };
    const mute = { id: "mute", x: full.x - 8 - 72, y: y, w: 72, h: bh };
    const eye = eyesBox(w);
    const backW = Math.min(176, Math.max(72, eye.x - 8 - 8));
    const back = { id: "back", x: 8, y: y, w: backW, h: bh };
    return { mute: mute, full: full, back: back };
  }
  function clearsEyes(boxes, w) {
    const eye = eyesBox(w);
    for (let i = 0; i < boxes.length; i++) if (intersects(boxes[i], eye)) return false;
    return true;
  }
  function menuLayout(w, h) {
    const btnH = 72;
    const gap = 8;
    const titleH = 64;
    const ids = ["tiny", "little", "shop", "rush", "lets-go"];
    const columnH = titleH + gap + ids.length * btnH + (ids.length - 1) * gap;
    let top = 128;
    if (top + columnH > h - 8) top = 92;
    if (top + columnH <= h - 8) {
      const cardW = w < 480 ? w - 16 : Math.min(460, w - 24);
      const cardX = Math.floor((w - cardW) / 2);
      const title = { x: cardX, y: top, w: cardW, h: titleH };
      const buttons = [];
      let y = top + titleH + gap;
      for (let i = 0; i < ids.length; i++) {
        buttons.push({ id: ids[i], x: cardX, y: y, w: cardW, h: btnH });
        y += btnH + gap;
      }
      const card = { x: cardX, y: top, w: cardW, h: y - gap - top };
      if (clearsEyes([card, title].concat(buttons), w)) return { title: title, buttons: buttons, card: card };
    }
    const gridTitle = 48;
    const cardW = w < 480 ? w - 16 : Math.min(460, w - 24);
    const cardX = Math.floor((w - cardW) / 2);
    top = 92;
    const colW = Math.floor((cardW - gap) / 2);
    if (colW < 72) return null;
    const title = { x: cardX, y: top, w: cardW, h: gridTitle };
    const buttons = [];
    for (let i = 0; i < 4; i++) {
      const col = i % 2;
      const row = Math.floor(i / 2);
      buttons.push({
        id: BAND_IDS[i],
        x: cardX + col * (colW + gap),
        y: top + gridTitle + gap + row * (btnH + gap),
        w: colW,
        h: btnH
      });
    }
    const letsY = top + gridTitle + gap + 2 * (btnH + gap);
    if (letsY + btnH > h - 8) return null;
    buttons.push({ id: "lets-go", x: cardX, y: letsY, w: cardW, h: btnH });
    const card = { x: cardX, y: top, w: cardW, h: letsY + btnH - top };
    if (!clearsEyes([card, title].concat(buttons), w)) return null;
    return { title: title, buttons: buttons, card: card };
  }
  function padFrame(w, h, count) {
    if (!count) return null;
    const portrait = h >= w;
    let cols;
    let rows;
    let gap;
    let top;
    if (count === 4) {
      cols = 2;
      rows = 2;
      gap = portrait ? 16 : 24;
      top = 128;
    } else if (portrait) {
      cols = 1;
      rows = count;
      gap = 16;
      top = count === 3 ? 112 : 128;
    } else {
      cols = count;
      rows = 1;
      gap = 24;
      top = 128;
    }
    const inset = 16;
    const bottom = h - 16;
    const availW = w - inset * 2;
    const availH = bottom - top;
    let cellW;
    let cellH;
    if (portrait && count !== 4) {
      cellW = availW;
      cellH = Math.floor((availH - gap * (rows - 1)) / rows);
    } else if (portrait) {
      cellW = Math.floor((availW - gap) / cols);
      cellH = Math.floor((availH - gap) / rows);
    } else {
      const byW = Math.floor((availW - gap * (cols - 1)) / cols);
      const byH = Math.floor((availH - gap * (rows - 1)) / rows);
      const cell = Math.min(280, byW, byH);
      cellW = cell;
      cellH = cell;
    }
    if (portrait && cellH > 280) cellH = 280;
    if (!(cellW >= 72) || !(cellH >= 72)) return null;
    const boardW = cols * cellW + (cols - 1) * gap;
    const boardH = rows * cellH + (rows - 1) * gap;
    if (top + boardH > bottom + 0.5 || boardW > availW + 0.5) return null;
    const x0 = Math.floor((w - boardW) / 2);
    const y0 = portrait ? top : top + Math.max(0, Math.floor((availH - boardH) / 2));
    const boxes = [];
    for (let i = 0; i < count; i++) {
      const c = i % cols;
      const r = Math.floor(i / cols);
      boxes.push({
        id: "pad-" + PADS[i].id,
        x: x0 + c * (cellW + gap),
        y: y0 + r * (cellH + gap),
        w: cellW,
        h: cellH
      });
    }
    return { boxes: boxes, top: y0, gap: gap };
  }
  function restLayout(w, h) {
    const cardW = Math.min(460, Math.max(160, w - 32));
    const cardH = 140;
    const x = Math.floor((w - cardW) / 2);
    let y = 140;

    run("pad-count", function () {
      const expect = { tiny: 2, little: 3, shop: 4, rush: 4 };
      const table = {
        tiny: { pads: 2, start: 1, longest: 3, on: 900, gap: 450 },
        little: { pads: 3, start: 2, longest: 5, on: 800, gap: 400 },
        shop: { pads: 4, start: 2, longest: 7, on: 700, gap: 350 },
        rush: { pads: 4, start: 3, longest: 9, on: 600, gap: 300 }
      };
      for (let b = 0; b < BAND_IDS.length; b++) {
        const id = BAND_IDS[b];
        const spec = BANDS[id];
        const row = table[id];
        if (spec.pads !== row.pads || spec.start !== row.start || spec.longest !== row.longest || spec.on !== row.on || spec.gap !== row.gap) {
          fail("pad-count", id + " did not keep the band lengths and timings.");
        }
        resetInput();
        seed(1);
        start(id);
        const live = centers().targets.filter(function (item) { return item.id.indexOf("pad-") === 0; });
        if (live.length !== expect[id]) fail("pad-count", id + " showed " + live.length + " pads.");
        const phone = targetsAt(390, 700);
        const desk = targetsAt(1024, 768);
        if (!phone.ok || !desk.ok) fail("pad-count", id + " did not fit 390 by 700 or 1024 by 768.");
        const phonePads = (phone.targets || []).filter(function (item) { return item.id.indexOf("pad-") === 0; });
        const deskPads = (desk.targets || []).filter(function (item) { return item.id.indexOf("pad-") === 0; });
        if (phonePads.length !== expect[id] || deskPads.length !== expect[id]) fail("pad-count", id + " dropped a pad in a checked window.");
        for (let i = 0; i < phonePads.length; i++) {
          const btn = document.getElementById(phonePads[i].id);
          if (!btn || !btn.querySelector("polygon, circle, rect")) fail("pad-count", phonePads[i].id + " did not draw a shape.");
        }
      }
      const four = targetsAt(390, 700);
      const pads4 = (four.targets || []).filter(function (item) { return item.id.indexOf("pad-") === 0; });
      if (state().level !== "rush" || pads4.length !== 4) fail("pad-count", "The 390 by 700 measure was not on four pads.");
      else if (pads4[0].w !== 171 || pads4[0].h !== 270 || pads4[0].x !== 16 || pads4[0].y !== 128) {
        fail("pad-count", "The 2 by 2 pads were not 171 by 270 at 390 by 700.");
      }
      start("little");
      const three = targetsAt(390, 700);
      const pads3 = (three.targets || []).filter(function (item) { return item.id.indexOf("pad-") === 0; });
      if (pads3.length !== 3 || pads3[0].w !== 358 || pads3[0].h !== 180 || pads3[0].x !== 16 || pads3[0].y !== 112) {
        fail("pad-count", "The three stacked pads were not 358 by 180 at 390 by 700.");
      }
      const wide = targetsAt(1024, 768);
      const widePads = (wide.targets || []).filter(function (item) { return item.id.indexOf("pad-") === 0; });
      if (widePads.length !== 3 || widePads[0].w !== 280 || widePads[0].h !== 280) {
        fail("pad-count", "Landscape pads were not capped at 280 px square.");
      }
    });
    run("reduced-motion", function () {
      function sample() {
        resetInput();
        seed(1);
        start("tiny");
        const spec = BANDS.tiny;
        let t = clock || 10000;
        step(t);
        const frames = [];
        function snap(label) {
          const id = state().pattern[0];
          const btn = document.getElementById("pad-" + id);
          frames.push({
            label: label,
            phase: state().phase,
            lit: state().lit,
            on: !!(btn && btn.classList.contains("lit")),
            bg: btn ? getComputedStyle(btn).backgroundColor : "",
            motion: btn ? btn.style.transform : ""
          });
        }
        step(t + Math.floor(spec.on / 2));
        snap("mid");
        step(t + spec.on);
        snap("gap");
        step(t + spec.on + spec.gap);
        snap("turn");
        return frames;
      }
      const plain = sample();
      const orig = window.matchMedia;
      window.matchMedia = function (q) {
        if (String(q).indexOf("prefers-reduced-motion") >= 0) {
          return {
            matches: true,
            media: String(q),
            addEventListener: function () {},
            removeEventListener: function () {},
            addListener: function () {},
            removeListener: function () {}
          };
        }
        return orig.call(window, q);
      };
      let reduced;
      try { reduced = sample(); }
      finally { window.matchMedia = orig; }
      if (plain.length !== 3 || reduced.length !== 3) fail("reduced-motion", "The timeline did not record three beats.");
      else {
        for (let i = 0; i < plain.length; i++) {
          if (plain[i].phase !== reduced[i].phase || plain[i].lit !== reduced[i].lit) {
            fail("reduced-motion", "Reduced motion changed the sequence at " + plain[i].label + ".");
          }
        }
        if (!reduced[0].on || reduced[0].lit == null) fail("reduced-motion", "The pad did not light with reduced motion on.");
        if (reduced[0].bg === plain[0].bg && reduced[0].bg !== "rgb(255, 253, 246)" && reduced[0].bg !== "") {
          if (reduced[0].motion !== "none") fail("reduced-motion", "Reduced motion still scaled the pad.");
        } else if (!reduced[0].on) fail("reduced-motion", "The lit color class was missing.");
        if (reduced[0].motion !== "none") fail("reduced-motion", "Reduced motion still scaled the pad.");
        if (plain[2].phase !== "turn" || reduced[2].phase !== "turn") fail("reduced-motion", "The gap timing did not reach Your turn.");
        const litBg = reduced[0].bg.replace(/\s/g, "");
        if (litBg === "rgb(255,253,246)" || litBg === "rgba(255,253,246,1)") fail("reduced-motion", "The lit pad stayed cream.");
      }
    });
    run("family-plain-state", function () {
      const before = JSON.stringify(state());
      start("nope");
      go("sideways");
      if (JSON.stringify(state()) !== before) fail("family-plain-state", "An unknown band or screen changed the state.");
      const end = state();
      if (!("level" in end) || !("screen" in end) || !("banner" in end) || !("muted" in end)) {
        fail("family-plain-state", "level, screen, banner, or muted was missing.");
      }
    });
    try {
      assertJunk("at the end");
    } catch (err) {
      fail("family-query-inert", err && err.message ? err.message : "The junk check threw.");
    }
    try {
      if (writes !== 0) fail("family-no-storage", "The page called setItem or removeItem.");
      if (storeLen !== null && localStorage.length !== storeLen) fail("family-no-storage", "localStorage gained a key.");
      if (storeLen !== null && localStorage.getItem("pop-pals-v1") !== pop) fail("family-no-storage", "pop-pals-v1 changed.");
    } catch (err) {
      fail("family-no-storage", "Storage could not be read.");
    }
    try {
      if (origSet) localStorage.setItem = origSet;
      if (origRem) localStorage.removeItem = origRem;
    } catch (err) {}
    return { ok: failures.length === 0, failures: failures };
  }

  window.followTheLights = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    selfCheck: selfCheck
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let result;
    try { result = selfCheck(); }
    catch (err) {
      result = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] };
    }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("rush")) start("rush");
    else if (params.has("play")) start("tiny");
    connectGaze();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
