<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3d2a8">
<title>Sugar Counter</title>
<style>
  :root {
    color-scheme: light;
    --ink: #3a2a22;
    --paper: #fff3e4;
    --card: rgba(255, 248, 236, 0.96);
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border: none; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(255, 248, 236, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(255, 248, 236, 0.95);
  }
  #gaze.squeezing { box-shadow: 0 0 0 3px #fff8ec, inset 0 0 0 12px #e86a9a; }
  #gaze[hidden] { display: none !important; }
  #eyes {
    position: fixed; z-index: 45;
    top: calc(18px + env(safe-area-inset-top));
    left: 172px;
    background: var(--card); border-radius: 999px; padding: 7px 12px;
    font-weight: 800; font-size: 16px;
  }
  #eyes[hidden] { display: none !important; }
  .panel {
    position: fixed; z-index: 50; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(460px, calc(100% - 24px));
    background: var(--card); border-radius: 28px;
    padding: 22px 16px 16px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.28);
  }
  .panel[hidden] { display: none !important; }
  h1 { font-size: 52px; line-height: 0.9; margin: 6px 0 8px; text-align: center; letter-spacing: -1px; }
  .tag, .ages { text-align: center; margin: 0 0 8px; }
  .ages { color: #6d5a48; font-size: 15px; }
  .tag { font-size: 18px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .big, .mid {
    border: none; border-radius: 18px; min-height: 76px;
    font-size: 32px; font-weight: 800; color: var(--ink);
  }
  .big { background: var(--sun); box-shadow: 0 5px 0 var(--sun-d); }
  .mid { background: #f7b7cf; box-shadow: 0 5px 0 #d4849f; }
  .big:active, .mid:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  #mute, #full, #done, #back {
    position: fixed; z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #e2d0b4;
  }
  #mute, #full, #back { top: calc(10px + env(safe-area-inset-top)); width: 72px; height: 72px; font-size: 15px; }
  #mute { left: 10px; }
  #full { left: 90px; }
  #back { right: 114px; }
  #done {
    top: calc(10px + env(safe-area-inset-top)); right: 10px;
    width: 96px; height: 96px; font-size: 22px; background: var(--sun);
  }
  #done[hidden], #back[hidden], #tray[hidden], #card[hidden] { display: none !important; }
  #tray { position: fixed; z-index: 44; left: 0; right: 0; bottom: 0; pointer-events: none; }
  #tray > button {
    position: absolute; pointer-events: auto; border: none; border-radius: 50%;
    box-shadow: 0 4px 0 rgba(58, 42, 34, 0.25);
  }
  #tray > button[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 3px; }
  #tool-pink { background: #e86a9a; }
  #tool-chocolate { background: #6b3a2a; }
  #tool-white { background: #fff6ea; box-shadow: 0 4px 0 rgba(58, 42, 34, 0.25), inset 0 0 0 3px #e2c7a4; }
  #tool-blue { background: #6eb5e8; }
  #tool-sprinkles {
    background:
      radial-gradient(circle at 30% 35%, #e23b3b 0 5px, transparent 6px),
      radial-gradient(circle at 70% 30%, #2f8a3e 0 5px, transparent 6px),
      radial-gradient(circle at 40% 70%, #ffc857 0 5px, transparent 6px),
      radial-gradient(circle at 68% 68%, #6eb5e8 0 5px, transparent 6px),
      #fff6ea;
  }
  #tool-cherry { background: radial-gradient(circle at 50% 58%, #e23b3b 0 42%, #2f8a3e 43% 52%, transparent 53%), #fff6ea; }
  #card {
    position: fixed; z-index: 40; display: flex; align-items: center; gap: 10px;
    background: var(--card); border-radius: 18px; padding: 8px 10px; overflow: auto;
  }
  #card.wiggle { animation: wiggle 0.4s ease; }
  @keyframes wiggle {
    0%, 100% { translate: 0 0; }
    25% { translate: -8px 0; }
    75% { translate: 8px 0; }
  }
  #face { width: 54px; height: 54px; border-radius: 50%; background: #ffd7a8; position: relative; flex: none; }
  #face i, #face b { position: absolute; display: block; }
  #face i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); top: 18px; }
  #face i:first-child { left: 14px; }
  #face i:nth-child(2) { right: 14px; }
  #face b {
    left: 16px; right: 16px; bottom: 16px; height: 0;
    border-bottom: 3px solid var(--ink);
  }
  #face.happy b {
    height: 12px; border: 3px solid var(--ink); border-top: none;
    border-radius: 0 0 12px 12px;
  }
  #reqs { display: flex; gap: 8px; align-items: center; }
  .req { display: flex; flex-direction: column; gap: 4px; min-width: 54px; }
  .req b { font-size: 13px; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; }
  .swatch.stripe { width: 36px; height: 14px; border-radius: 8px; margin-top: 7px; }
  .swatch.sprinkle {
    background:
      radial-gradient(circle at 20% 50%, #e23b3b 0 3px, transparent 4px),
      radial-gradient(circle at 50% 50%, #2f8a3e 0 3px, transparent 4px),
      radial-gradient(circle at 80% 50%, #ffc857 0 3px, transparent 4px);
  }
  .swatch.cherry { background: #e23b3b; }
  .pips { display: flex; gap: 4px; }
  .pips i { width: 12px; height: 12px; border-radius: 50%; background: #e6d3bf; display: block; }
  .pips i.on { background: #2f8a3e; }
  .panel { max-height: calc(100dvh - 16px); overflow: auto; }
  .levels { display: flex; flex-direction: column; gap: 8px; }
  .choice {
    text-align: left; border-radius: 16px; border: 3px solid transparent;
    background: #fff; padding: 8px 12px; color: var(--ink);
  }
  .choice b { display: block; font-size: 18px; }
  .choice small { display: block; margin-top: 2px; color: #6d5a48; font-size: 13px; }
  .choice[aria-pressed="true"] { border-color: #e2a62e; background: #fff6df; }
  #order-treat { font-size: 14px; }
  #treats {
    position: absolute; left: 8px; right: 8px; top: 6px; height: 48px;
    display: flex; gap: 6px; justify-content: center; pointer-events: auto;
  }
  #treats[hidden] { display: none !important; }
  #treats button {
    position: static; flex: 1; max-width: 128px; min-height: 44px;
    border: none; border-radius: 12px;
    background: #fff8ec; color: var(--ink); font-weight: 800; font-size: 15px;
    box-shadow: 0 3px 0 #e2d0b4;
  }
  #treats button[hidden] { display: none !important; }
  #treats button[aria-pressed="true"] { background: var(--sun); }
  #clock {
    position: fixed; z-index: 46; top: calc(18px + env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    background: var(--card); border-radius: 999px; padding: 8px 14px;
    font-weight: 800; font-size: 22px;
  }
  #clock.up { background: #ffd0c8; }
  #clock[hidden] { display: none !important; }
  @media (max-width: 799px) {
    #done { width: 64px; height: 64px; font-size: 16px; }
    #back { right: 82px; width: 64px; height: 64px; font-size: 14px; }
    #clock { left: 168px; right: 154px; transform: none; text-align: center; font-size: 16px; line-height: 1.05; padding: 6px 6px; }
    #treats button { font-size: 13px; padding: 0 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #card.wiggle { animation: none; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">Mute</button>
<button id="full" type="button" aria-label="Fullscreen">Full</button>
<button id="back" type="button" hidden aria-label="Back to the start screen">Back</button>
<button id="done" type="button" hidden>Done</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<div id="clock" hidden>1:30</div>
<div id="tray" hidden>
  <div id="treats" hidden>
    <button type="button" data-treat="donut" aria-pressed="true">Donut</button>
    <button type="button" data-treat="cupcake" aria-pressed="false">Cupcake</button>
    <button type="button" data-treat="cake" aria-pressed="false">Cake</button>
    <button type="button" data-treat="scoops" aria-pressed="false">Scoops</button>
    <button type="button" data-treat="soft" aria-pressed="false">Soft</button>
  </div>
  <button id="tool-pink" type="button" data-tool="pink" aria-label="Pink icing" aria-pressed="true"></button>
  <button id="tool-chocolate" type="button" data-tool="chocolate" aria-label="Chocolate icing" aria-pressed="false"></button>
  <button id="tool-white" type="button" data-tool="white" aria-label="White icing" aria-pressed="false"></button>
  <button id="tool-blue" type="button" data-tool="blue" aria-label="Blue icing" aria-pressed="false"></button>
  <button id="tool-sprinkles" type="button" data-tool="sprinkles" aria-label="Sprinkles" aria-pressed="false"></button>
  <button id="tool-cherry" type="button" data-tool="cherry" aria-label="Cherry" aria-pressed="false"></button>
</div>
<aside id="card" hidden>
  <div id="face" aria-hidden="true"><i></i><i></i><b></b></div>
  <div>
    <b id="order-treat"></b>
    <div id="reqs"></div>
  </div>
</aside>
<section id="screen-start" class="panel">
  <h1>Sugar Counter</h1>
  <p id="tag" class="tag">Press and move on the donut to ice it.</p>
  <p class="ages">Ages 2 and up</p>
  <div class="levels" id="level-choices">
    <button class="choice" type="button" data-level="tiny" aria-pressed="true"><b>Tiny Tots</b><small>Ages 2 to 3. Donuts and cupcakes to decorate.</small></button>
    <button class="choice" type="button" data-level="little" aria-pressed="false"><b>Little Pals</b><small>Ages 4 to 5. Cakes too, and picture orders.</small></button>
    <button class="choice" type="button" data-level="shop" aria-pressed="false"><b>Shopkeeper</b><small>Ages 6 to 8. Scoops and soft serve.</small></button>
    <button class="choice" type="button" data-level="rush" aria-pressed="false"><b>Rush</b><small>Ages 9 and up. Fill the card before the clock ends.</small></button>
  </div>
  <div class="stack">
    <button id="decorate" class="big" type="button">Decorate</button>
    <button id="orders" class="mid" type="button" hidden>Orders</button>
  </div>
</section>
<script>
(function () {
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const POINTER_DEAD = 18;
  const COLORS = { pink: "#e86a9a", chocolate: "#6b3a2a", white: "#fff6ea", blue: "#6eb5e8" };
  const FLAVOR_OF = { pink: "strawberry", chocolate: "chocolate", white: "vanilla", blue: "mint" };
  const FLAVOR_COLOR = { strawberry: "#e86a9a", chocolate: "#6b3a2a", vanilla: "#fff6ea", mint: "#3aaa6a" };
  const TOOLS = ["pink", "chocolate", "white", "blue", "sprinkles", "cherry"];
  const TREAT_NAME = { donut: "Donut", cupcake: "Cupcake", cake: "Cake", scoops: "Cone", soft: "Soft serve" };
  const ORDERS = [
    [{ kind: "glob", color: "pink", n: 3 }],
    [{ kind: "stripe", color: "chocolate", n: 1 }, { kind: "cherry", n: 1 }],
    [{ kind: "sprinkle", n: 2 }, { kind: "glob", color: "white", n: 1 }],
    [{ kind: "glob", color: "blue", n: 2 }, { kind: "cherry", n: 1 }],
    [{ kind: "stripe", color: "pink", n: 1 }, { kind: "sprinkle", n: 1 }],
    [{ kind: "stripe", color: "white", n: 1 }, { kind: "cherry", n: 2 }],
    [{ kind: "sprinkle", n: 3 }],
    [{ kind: "glob", color: "chocolate", n: 1 }, { kind: "glob", color: "blue", n: 1 }, { kind: "cherry", n: 1 }]
  ];
  const CUPCAKE_ORDERS = [
    { treat: "cupcake", reqs: [{ kind: "glob", color: "pink", n: 2 }] },
    { treat: "cupcake", reqs: [{ kind: "cherry", n: 1 }] },
    { treat: "cupcake", reqs: [{ kind: "stripe", color: "blue", n: 1 }, { kind: "sprinkle", n: 1 }] },
    { treat: "cupcake", reqs: [{ kind: "sprinkle", n: 3 }] }
  ];
  const CAKE_ORDERS = [
    { treat: "cake", reqs: [{ kind: "glob", color: "white", n: 2 }, { kind: "cherry", n: 1 }] },
    { treat: "cake", reqs: [{ kind: "stripe", color: "chocolate", n: 1 }] },
    { treat: "cake", reqs: [{ kind: "sprinkle", n: 2 }, { kind: "glob", color: "pink", n: 1 }] }
  ];
  const SCOOP_ORDERS = [
    { treat: "scoops", reqs: [{ kind: "scoop", color: "chocolate", n: 1 }] },
    { treat: "scoops", reqs: [{ kind: "scoop", color: "vanilla", n: 2 }] },
    { treat: "scoops", reqs: [{ kind: "scoop", color: "strawberry", n: 1 }, { kind: "scoop", color: "mint", n: 1 }] },
    { treat: "scoops", reqs: [{ kind: "scoop", color: "chocolate", n: 1 }, { kind: "scoop", color: "vanilla", n: 1 }, { kind: "scoop", color: "strawberry", n: 1 }] }
  ];
  const SOFT_ORDERS = [
    { treat: "soft", reqs: [{ kind: "swirl", color: "chocolate", n: 1 }] },
    { treat: "soft", reqs: [{ kind: "swirl", color: "vanilla", n: 2 }] },
    { treat: "soft", reqs: [{ kind: "swirl", color: "strawberry", n: 1 }, { kind: "swirl", color: "mint", n: 1 }] }
  ];
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d");
  const gazeEl = document.getElementById("gaze");
  const eyesEl = document.getElementById("eyes");
  const tag = document.getElementById("tag");
  const screen = document.getElementById("screen-start");
  const tray = document.getElementById("tray");
  const card = document.getElementById("card");
  const face = document.getElementById("face");
  const reqsEl = document.getElementById("reqs");
  const doneBtn = document.getElementById("done");
  const backBtn = document.getElementById("back");
  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const decorateBtn = document.getElementById("decorate");
  const ordersBtn = document.getElementById("orders");
  const treatsEl = document.getElementById("treats");
  const clockEl = document.getElementById("clock");
  const orderTreatEl = document.getElementById("order-treat");
  const toolEls = {};
  TOOLS.forEach((id) => { toolEls[id] = document.getElementById("tool-" + id); });

  let mode = "start";
  let levelId = "tiny";
  let treat = "donut";
  let tool = "pink";
  let orderIndex = 1;
  let timeLeft = 90;
  let timeUp = false;
  let marks = [];
  let score = emptyScore();
  let gesture = null;
  let cherryDrag = null;
  let scoopDrag = null;
  let trayScoop = null;
  let latch = false;
  let pointerActive = false;
  let capId = null;
  let mute = false;
  let clock = 0;
  let checking = false;
  let flashUntil = 0;
  let wiggleUntil = 0;
  let groupSeq = 1;
  let ac = null;
  let master = null;
  let lastTick = -1e9;
  let lastSplat = -1e9;

  let gazeSock = null;
  let gazeBuf = new Uint8Array(0);
  let gazeTimer = 0;
  let gazePoint = null;
  let gazeAt = 0;
  let gazeHold = null;
  let refreshHold = true;
  let gazeWarp = null;
  let haveSmooth = false;
  let smoothed = null;
  let suppressReconnect = false;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;
  let leaveAt = 0;

  function emptyScore() {
    return {
      globs: { pink: 0, chocolate: 0, white: 0, blue: 0 },
      stripes: { pink: 0, chocolate: 0, white: 0, blue: 0 },
      sprinkles: 0,
      cherries: 0,
      scoops: { strawberry: 0, chocolate: 0, vanilla: 0, mint: 0 },
      swirls: { strawberry: 0, chocolate: 0, vanilla: 0, mint: 0 }
    };
  }
  function iceTreat() { return treat === "scoops" || treat === "soft"; }
  function flavorOf(id) { return FLAVOR_OF[id] || null; }
  function treatsForLevel() {
    if (levelId === "tiny") return ["donut", "cupcake"];
    if (levelId === "little") return ["donut", "cupcake", "cake"];
    return ["donut", "cupcake", "cake", "scoops", "soft"];
  }
  function deck() {
    const donutCards = ORDERS.map((reqs) => ({ treat: "donut", reqs }));
    const bakery = donutCards.concat(CUPCAKE_ORDERS, CAKE_ORDERS);
    if (levelId === "shop" || levelId === "rush") return bakery.concat(SCOOP_ORDERS, SOFT_ORDERS);
    if (levelId === "little") return bakery;
    return donutCards;
  }
  function currentCard() {
    const cards = deck();
    return cards[(orderIndex - 1) % cards.length];
  }
  function blobR() {
    return Math.max(18, 0.045 * Math.min(window.innerWidth, window.innerHeight));
  }
  function stripeLength() { return 4 * blobR(); }
  function gazeDead() { return Math.max(28, blobR()); }
  function layout() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const trayBase = Math.min(180, Math.max(120, h * 0.18));
    const trayH = trayBase + (mode === "free" ? 56 : 0);
    const wide = w >= 800;
    const ordersOn = mode === "orders";
    const cardW = ordersOn && wide ? 220 : 0;
    const cardH = ordersOn && !wide ? 82 + 88 : 0;
    const play = { x: cardW, y: cardH, w: Math.max(0, w - cardW), h: Math.max(0, h - trayH - cardH) };
    const short = Math.min(play.w, play.h);
    let rx = 0.42 * short;
    let ry = 0.36 * short;
    rx = Math.min(rx, Math.max(8, play.w / 2 - 12));
    ry = Math.min(ry, Math.max(8, play.h / 2 - 12));
    const gap = 8;
    const shown = iceTreat() ? 4 : 6;
    const toolD = Math.min(112, (w - 16 - gap * (shown - 1)) / shown);
    let cy = play.y + play.h / 2;
    if (treat === "cupcake") cy -= ry * 0.08;
    if (treat === "scoops" || treat === "soft") cy -= ry * 0.12;
    return {
      trayH, wide, cardW, cardH, toolD,
      donut: { cx: play.x + play.w / 2, cy, rx, ry }
    };
  }
  function toUV(x, y) {
    const d = layout().donut;
    return { u: (x - d.cx) / d.rx, v: (y - d.cy) / d.ry };
  }
  function fromUV(u, v) {
    const d = layout().donut;
    return { x: d.cx + u * d.rx, y: d.cy + v * d.ry };
  }
  function inDonut(x, y) {
    const d = layout().donut;
    if (d.rx <= 0 || d.ry <= 0) return false;
    const u = (x - d.cx) / d.rx;
    const v = (y - d.cy) / d.ry;
    if (u * u + v * v <= 1) return true;
    if (treat !== "scoops" && treat !== "soft") return false;
    const rim = d.cy + d.ry * 0.35;
    const tip = d.cy + d.ry * 1.45;
    if (y < rim || y > tip) return false;
    const along = (y - rim) / (tip - rim);
    const half = d.rx * 0.42 * (1 - along) + 16;
    return Math.abs(x - d.cx) <= half;
  }
  function countMarks(type) {
    let n = 0;
    for (let i = 0; i < marks.length; i++) if (marks[i].type === type) n++;
    return n;
  }
  function playSound(name) {
    if (name === "tick") {
      if (clock - lastTick < 80) return;
      lastTick = clock;
    }
    if (!ac || mute) return;
    const t = ac.currentTime + 0.01;
    if (name === "tool") osc(t, 0.08, "triangle", 520, 680, 0.05);
    else if (name === "glob") osc(t, 0.14, "sine", 300, 160, 0.08);
    else if (name === "tick") osc(t, 0.05, "sine", 380, 300, 0.04);
    else if (name === "sprinkle") noise(t, 0.08, 0.06, 800 + Math.random() * 1800);
    else if (name === "splat") {
      const roll = Math.random();
      if (roll < 0.34) noise(t, 0.07, 0.08, 280);
      else if (roll < 0.67) { noise(t, 0.1, 0.07, 480); osc(t, 0.08, "triangle", 240, 130, 0.05); }
      else { noise(t, 0.06, 0.09, 160); osc(t, 0.1, "sine", 180, 90, 0.06); }
    }
    else if (name === "cherry") osc(t, 0.12, "triangle", 620, 440, 0.06);
    else if (name === "release") osc(t, 0.08, "sine", 240, 180, 0.04);
    else if (name === "serve") { osc(t, 0.12, "triangle", 520, 780, 0.07); osc(t + 0.1, 0.16, "sine", 780, 980, 0.06); }
    else if (name === "wait") osc(t, 0.16, "sine", 180, 140, 0.05);
  }
  function ensureAudio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = mute ? 0 : 0.6;
      master.connect(ac.destination);
    }
    if (ac.state === "suspended") ac.resume();
  }
  function envGain(t, dur, peak) {
    const g = ac.createGain();
    g.connect(master);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.03, dur));

      step(outsideAt + LEAVE_MS);
      s = state();
      if (s.latch || s.marks.globs.pink !== 1) fail("Case 5", "expected latch off and one glob, got latch=" + s.latch + " globs=" + s.marks.globs.pink);

      start("free");
      t = latchAtCenter(t).t;
      const blobsAtLatch = state().visuals.icing;
      refreshHold = false;
      step(t + 200);
      s = state();
      if (!s.latch || s.visuals.icing !== blobsAtLatch) fail("Case 6", "expected latch held and no new marks after 200 ms, latch=" + s.latch + " icing " + blobsAtLatch + " -> " + s.visuals.icing);
      refreshHold = true;

      start("free");
      t = latchAtCenter(t).t;
      refreshHold = false;
      step(t + GAZE_FRESH_MS);
      s = state();
      if (s.latch || s.marks.globs.pink !== 1) fail("Case 7", "expected latch off and one glob after 500 ms, latch=" + s.latch + " globs=" + s.marks.globs.pink);
      refreshHold = true;

      start("free");
      t = latchAtCenter(t).t;
      const c8 = approxCenter();
      tap(c8.nx, c8.ny);
      s = state();
      if (s.latch || s.marks.globs.pink !== 2) fail("Case 8", "expected latch off and two globs, latch=" + s.latch + " globs=" + s.marks.globs.pink);

      start("free");
      const choc = centers().tools.chocolate;
      t = park(choc.nx, choc.ny, t);
      step(t + 600);
      if (state().tool !== "pink") fail("Case 9", "tool changed after 600 ms to " + state().tool);
      step(t + MENU_DWELL_MS);
      if (state().tool !== "chocolate") fail("Case 9", "tool was " + state().tool + " after 1300 ms");

      start("orders");
      const c10 = approxCenter();
      tap(c10.nx, c10.ny);
      tap(c10.nx, c10.ny);
      tap(c10.nx, c10.ny);
      if (!state().orderFilled) fail("Case 10", "three pink globs did not fill order 1: " + JSON.stringify(order()));
      start("orders");
      drag(zigzag());
      if (state().orderFilled || state().marks.globs.pink !== 0) fail("Case 10", "a pink stripe filled order 1 or left a glob: " + JSON.stringify(state().marks));

      start("orders");
      tap(c10.nx, c10.ny); tap(c10.nx, c10.ny); tap(c10.nx, c10.ny);
      tap(centers().done.nx, centers().done.ny);
      if (state().orderIndex !== 2) fail("Case 11", "did not reach order 2, index " + state().orderIndex);
      tap(centers().tools.chocolate.nx, centers().tools.chocolate.ny);
      drag(zigzag());
      tap(centers().tools.cherry.nx, centers().tools.cherry.ny);
      tap(approxCenter().nx, approxCenter().ny);
      if (!order().filled) fail("Case 11", "chocolate stripe and cherry did not fill order 2: " + JSON.stringify(order()));

      start("orders");
      tap(approxCenter().nx, approxCenter().ny);
      tap(centers().done.nx, centers().done.ny);
      s = state();
      if (s.orderIndex !== 1 || s.marks.globs.pink !== 1) fail("Case 12", "early Done changed the order or cleared marks: index " + s.orderIndex + " globs " + s.marks.globs.pink);

      start("orders");
      tap(approxCenter().nx, approxCenter().ny);
      tap(approxCenter().nx, approxCenter().ny);
      tap(approxCenter().nx, approxCenter().ny);
      tap(centers().done.nx, centers().done.ny);
      s = state();
      if (s.orderIndex !== 2 || s.marks.globs.pink !== 0 || s.visuals.icing !== 0) fail("Case 13", "finished Done did not advance and clear: " + JSON.stringify(s));

      start("free");
      tap(centers().tools.sprinkles.nx, centers().tools.sprinkles.ny);
      tap(approxCenter().nx, approxCenter().ny);
      if (state().marks.sprinkles !== 1) fail("Case 14", "sprinkle tap counted " + state().marks.sprinkles);
      tap(centers().tools.cherry.nx, centers().tools.cherry.ny);
      const cd = layout().donut;
      drag([
        { x: cd.cx / window.innerWidth, y: cd.cy / window.innerHeight },
        { x: (cd.cx + cd.rx * 0.2) / window.innerWidth, y: cd.cy / window.innerHeight }
      ]);
      if (state().marks.cherries !== 1) fail("Case 14", "cherry drag on the donut counted " + state().marks.cherries);
      drag([
        { x: cd.cx / window.innerWidth, y: cd.cy / window.innerHeight },
        { x: 0.01, y: 0.01 }
      ]);
      if (state().marks.cherries !== 1) fail("Case 14", "cherry released outside changed the count to " + state().marks.cherries);

      start("free");
      releaseLook();
      step(clock + 10);
      if (!gazeEl.hidden) fail("Case 15", "ring was visible without a look");
      const beforeTap = state().marks.globs.pink;
      tap(approxCenter().nx, approxCenter().ny);
      if (state().marks.globs.pink !== beforeTap + 1) fail("Case 15", "tap did not add a glob");

      selectLevel("little");
      start("free");
      setTreat("cupcake");
      tap(approxCenter().nx, approxCenter().ny);
      if (state().treat !== "cupcake" || state().marks.globs.pink !== 1) fail("Case 16", "cupcake tap counted " + JSON.stringify(state().marks) + " treat " + state().treat);
      setTreat("cake");
      tap(approxCenter().nx, approxCenter().ny);
      if (state().treat !== "cake" || state().marks.globs.pink !== 1) fail("Case 16", "cake tap counted " + JSON.stringify(state().marks));

      selectLevel("shop");
      start("free");
      setTreat("scoops");
      tap(centers().tools.chocolate.nx, centers().tools.chocolate.ny);
      tap(approxCenter().nx, approxCenter().ny);
      if (state().marks.scoops.chocolate !== 1) fail("Case 17", "cone tap counted " + state().marks.scoops.chocolate);
      const cone = layout().donut;
      drag([
        { x: cone.cx / window.innerWidth, y: cone.cy / window.innerHeight },
        { x: 0.01, y: 0.01 }
      ]);
      if (state().marks.scoops.chocolate !== 1) fail("Case 17", "a scoop dragged off the cone counted " + state().marks.scoops.chocolate);
      drag([
        { x: cone.cx / window.innerWidth, y: cone.cy / window.innerHeight },
        { x: (cone.cx + cone.rx * 0.15) / window.innerWidth, y: cone.cy / window.innerHeight }
      ]);
      if (state().marks.scoops.chocolate !== 2) fail("Case 17", "a scoop dragged on the cone counted " + state().marks.scoops.chocolate);

      setTreat("soft");
      tap(centers().tools.chocolate.nx, centers().tools.chocolate.ny);
      tap(approxCenter().nx, approxCenter().ny);
      if (state().marks.swirls.chocolate !== 1) fail("Case 18", "soft serve counted " + state().marks.swirls.chocolate);

      selectLevel("shop");
      start("orders");
      orderIndex = deck().findIndex((c) => c.treat === "scoops") + 1;
      treat = currentCard().treat;
      clearDonut();
      showTools();
      placeChrome();
      updateCard();
      tap(centers().tools.chocolate.nx, centers().tools.chocolate.ny);
      tap(approxCenter().nx, approxCenter().ny);
      if (!order().filled || order().treat !== "scoops") fail("Case 19", "one chocolate scoop did not fill the cone order: " + JSON.stringify(order()));

      selectLevel("rush");
      start("orders");
      const t0 = (clock || 1000) + 1000;
      clock = t0;
      timeLeft = 90;
      timeUp = false;
      step(t0 + 1000);
      if (state().timeLeft < 88.5 || state().timeLeft > 89.2) fail("Case 20", "clock after one second was " + state().timeLeft);
      tap(approxCenter().nx, approxCenter().ny);
      step(t0 + 1000 + 100000);
      s = state();
      if (s.timeLeft !== 0 || !s.timeUp || s.marks.globs.pink !== 1) fail("Case 20", "time up changed the donut: " + JSON.stringify(s));

      selectLevel("tiny");
      if (!ordersBtn.hidden) fail("Case 21", "Tiny Tots still showed Orders");
      start("free");
      if (!document.querySelector("[data-treat='cake']").hidden) fail("Case 21", "Tiny Tots showed cake");
      if (!document.querySelector("[data-treat='scoops']").hidden) fail("Case 21", "Tiny Tots showed scoops");
      setTreat("cake");
      if (state().treat !== "donut") fail("Case 21", "Tiny Tots switched to " + state().treat);
      setTreat("cupcake");
      if (state().treat !== "cupcake") fail("Case 21", "cupcake was " + state().treat);

      selectLevel("shop");
      start("orders");
      tap(approxCenter().nx, approxCenter().ny);
      if (backBtn.hidden || centers().back.w < 60) fail("Case 22", "Back was missing in orders");
      const back = centers().back;
      t = park(back.nx, back.ny, t);
      step(t + 600);
      if (state().mode !== "orders" || state().marks.globs.pink !== 1) fail("Case 22", "a short look left orders: " + state().mode);
      step(t + MENU_DWELL_MS);
      s = state();
      if (s.mode !== "start" || s.level !== "shop" || s.marks.globs.pink !== 0 || screen.hidden || !backBtn.hidden) {
        fail("Case 22", "gaze Back did not return to the start screen: " + JSON.stringify(s) + " screenHidden=" + screen.hidden + " backHidden=" + backBtn.hidden);
      }
      if (ordersBtn.hidden) fail("Case 22", "Shopkeeper hid Orders after Back");
      start("free");
      setTreat("cupcake");
      tap(centers().back.nx, centers().back.ny);
      s = state();
      if (s.mode !== "start" || s.treat !== "donut" || !tray.hidden || !backBtn.hidden) fail("Case 22", "tap Back stayed in " + s.mode + " on " + s.treat);
    } catch (err) {
      failures.push("Case error: " + (err && err.stack ? err.stack : err));
    } finally {
      releaseLook();
      selectLevel("tiny");
      showStart();
      checking = false;
      suppressReconnect = false;
      connectGaze();
    }
    return { ok: failures.length === 0, failures };
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    ensureAudio();
    if (capId !== null) return;
    const p = tipFrom(e.clientX, e.clientY, e.pointerType);
    pointerDown(p.x, p.y);
    if (capId !== null) {
      capId = e.pointerId;
      canvas.setPointerCapture(e.pointerId);
    }
    e.preventDefault();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerId !== capId) return;
    const p = tipFrom(e.clientX, e.clientY, e.pointerType);
    pointerMove(p.x, p.y);
  });
  function endPointer(e) {
    if (e.pointerId !== capId) return;
    const p = tipFrom(e.clientX, e.clientY, e.pointerType);
    const id = capId;
    pointerUp(p.x, p.y);
    if (canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  document.addEventListener("pointerdown", (e) => {
    ensureAudio();
    const btn = e.target.closest && e.target.closest("button");
    if (!btn) return;
    pointerActive = true;
    releaseLatch();
  }, true);
  document.addEventListener("pointermove", (e) => {
    if (!trayScoop || e.pointerId !== trayScoop.pid) return;
    trayScoop.x = e.clientX;
    trayScoop.y = e.clientY;
    render();
  }, true);
  document.addEventListener("pointerup", (e) => {
    if (trayScoop && e.pointerId === trayScoop.pid) {
      if (inDonut(e.clientX, e.clientY)) placeScoop(trayScoop.color);
      trayScoop = null;
      render();
    }
    if (capId === null) pointerActive = false;
  }, true);
  document.addEventListener("pointercancel", () => {
    if (capId === null) pointerActive = false;
  }, true);

  TOOLS.forEach((id) => {
    toolEls[id].addEventListener("click", () => selectTool(id));
    toolEls[id].addEventListener("pointerdown", (e) => {
      if (treat !== "scoops" || !flavorOf(id)) return;
      trayScoop = { color: flavorOf(id), x: e.clientX, y: e.clientY, pid: e.pointerId };
      pointerActive = true;
    });
  });
  document.querySelectorAll("[data-level]").forEach((btn) => {
    btn.addEventListener("click", () => selectLevel(btn.dataset.level));
  });
  treatsEl.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => setTreat(btn.dataset.treat));
  });
  decorateBtn.addEventListener("click", () => start("free"));
  ordersBtn.addEventListener("click", () => { if (levelId !== "tiny") start("orders"); });
  doneBtn.addEventListener("click", serve);
  backBtn.addEventListener("click", showStart);
  muteBtn.addEventListener("click", () => {
    mute = !mute;
    muteBtn.setAttribute("aria-pressed", mute ? "true" : "false");
    muteBtn.textContent = mute ? "Sound" : "Mute";
    if (master) master.gain.value = mute ? 0 : 0.6;
  });
  fullBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      const req = document.documentElement.requestFullscreen;
      if (req) req.call(document.documentElement).catch(() => {});
    } else if (document.exitFullscreen) document.exitFullscreen();
  });

  window.addEventListener("resize", resize);
  resize();

  function frame(now) {
    if (!checking) step(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  connectGaze();

  window.sugarCounter = {
    start, look, releaseLook, dwell: () => dwellProgress,
    eyes: () => ({ on: eyesOn(), live: eyesLive(clock || performance.now()) }),
    tap, drag, centers, state, order, step, selfCheck,
    level: selectLevel, treat: setTreat
  };

  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    const result = selfCheck();
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else if (params.has("scoops")) {
    selectLevel("shop"); start("free"); setTreat("scoops");
  } else if (params.has("soft")) {
    selectLevel("shop"); start("free"); setTreat("soft");
  } else if (params.has("cupcake")) {
    selectLevel("tiny"); start("free"); setTreat("cupcake");
  } else if (params.has("cake")) {
    selectLevel("little"); start("free"); setTreat("cake");
  } else if (params.has("rush")) {
    selectLevel("rush"); start("orders");
  } else if (params.has("orders")) {
    selectLevel("little"); start("orders");
  } else if (params.has("play")) {
    selectLevel("tiny"); start("free");
  }
})();
</script>
</body>
</html>
