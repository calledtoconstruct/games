<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3d2a8">
<title>Sugar Counter</title>
<style>
  :root {
    color-scheme: light;
    --ink: #3a2a22;
    --paper: #fff3e4;
    --card: rgba(255, 248, 236, 0.96);
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border: none; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(255, 248, 236, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(255, 248, 236, 0.95);
  }
  #gaze.squeezing { box-shadow: 0 0 0 3px #fff8ec, inset 0 0 0 12px #e86a9a; }
  #gaze[hidden] { display: none !important; }
  #eyes {
    position: fixed; z-index: 45;
    top: calc(18px + env(safe-area-inset-top));
    left: 172px;
    background: var(--card); border-radius: 999px; padding: 7px 12px;
    font-weight: 800; font-size: 16px;
  }
  #eyes[hidden] { display: none !important; }
  .panel {
    position: fixed; z-index: 50; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(460px, calc(100% - 24px));
    background: var(--card); border-radius: 28px;
    padding: 22px 16px 16px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.28);
  }
  .panel[hidden] { display: none !important; }
  h1 { font-size: 52px; line-height: 0.9; margin: 6px 0 8px; text-align: center; letter-spacing: -1px; }
  .tag, .ages { text-align: center; margin: 0 0 8px; }
  .ages { color: #6d5a48; font-size: 15px; }
  .tag { font-size: 18px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .big, .mid {
    border: none; border-radius: 18px; min-height: 76px;
    font-size: 32px; font-weight: 800; color: var(--ink);
  }
  .big { background: var(--sun); box-shadow: 0 5px 0 var(--sun-d); }
  .mid { background: #f7b7cf; box-shadow: 0 5px 0 #d4849f; }
  .big:active, .mid:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  #mute, #full, #done, #back {
    position: fixed; z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #e2d0b4;
  }
  #mute, #full, #back { top: calc(10px + env(safe-area-inset-top)); height: 64px; font-size: 16px; }
  #mute, #full { width: 64px; }
  #mute { left: 10px; display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; }
  #mute svg[hidden] { display: none !important; }
  #full { left: 82px; }
  #back { right: 10px; width: auto; min-width: 148px; padding: 0 16px; }
  #done {
    width: 156px; height: 58px; font-size: 20px; background: var(--sun);
    box-shadow: 0 6px 0 #e2a62e, 0 10px 18px rgba(80, 40, 10, 0.18);
  }
  #done[hidden], #back[hidden], #tray[hidden], #card[hidden] { display: none !important; }
  #tray { position: fixed; z-index: 44; left: 0; right: 0; bottom: 0; pointer-events: none; }
  #tray > button {
    position: absolute; pointer-events: auto; border: none; border-radius: 50%;
    box-shadow: 0 4px 0 rgba(58, 42, 34, 0.25);
  }
  #tray > button[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: 3px; }
  #tool-pink { background: #e86a9a; }
  #tool-chocolate { background: #6b3a2a; }
  #tool-white { background: #fff6ea; box-shadow: 0 4px 0 rgba(58, 42, 34, 0.25), inset 0 0 0 3px #e2c7a4; }
  #tool-blue { background: #6eb5e8; }
  #tool-sprinkles {
    background:
      radial-gradient(circle at 30% 35%, #e23b3b 0 5px, transparent 6px),
      radial-gradient(circle at 70% 30%, #2f8a3e 0 5px, transparent 6px),
      radial-gradient(circle at 40% 70%, #ffc857 0 5px, transparent 6px),
      radial-gradient(circle at 68% 68%, #6eb5e8 0 5px, transparent 6px),
      #fff6ea;
  }
  #tool-cherry { background: #fff6ea; display: grid; place-items: center; }
  #tool-cherry svg { width: 74%; height: 74%; pointer-events: none; }
  #card {
    position: fixed; z-index: 40; display: flex; align-items: center; gap: 14px;
    background: var(--card); border-radius: 22px; padding: 14px 16px; overflow: auto;
    border: 3px solid #fff;
    box-shadow: 0 10px 0 rgba(90, 50, 20, 0.06), 0 16px 36px rgba(50, 30, 10, 0.14);
  }
  #face { width: 112px; height: 112px; flex: none; filter: drop-shadow(0 8px 0 rgba(80, 40, 20, 0.08)); }
  #face svg { width: 100%; height: 100%; display: block; }
  #box-line { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #box-line[hidden] { display: none !important; }
  #box-line b { font-size: 13px; }
  #box-line .slot {
    width: 22px; height: 22px; border-radius: 6px; display: inline-block;
    border: 2px dashed #e2c7a4; background: #fff;
  }
  #box-line .slot.now { border-style: solid; border-color: #e2a62e; background: #fff6df; }
  #box-line .slot.packed { border-style: solid; border-color: #2f8a3e; }
  #box-line .slot.packed.donut { background: radial-gradient(circle at 50% 50%, #f6d7b0 0 4px, #e7b15a 5px 9px, #f2c07a 10px); }
  #box-line .slot.packed.cupcake { background: linear-gradient(#f6d2e4 0 55%, #f4a3c2 55% 100%); }
  #box-line .slot.packed.cake { background: linear-gradient(#fff6ea 0 40%, #f7d7e2 40% 100%); }
  #box-line .slot.packed.scoops { background: linear-gradient(#6b3a2a 0 45%, #e7b15a 45% 100%); }
  #box-line .slot.packed.soft { background: linear-gradient(#fff6ea 0 50%, #d7dee6 50% 100%); }
  #reqs { display: flex; gap: 8px; align-items: center; }
  .req { display: flex; flex-direction: column; gap: 4px; min-width: 54px; }
  .req b { font-size: 16px; line-height: 1.2; }
  .swatch { width: 36px; height: 36px; border-radius: 50%; box-shadow: inset 0 -6px 0 rgba(0,0,0,0.08), 0 3px 0 rgba(80,40,20,0.08); }
  .swatch.stripe { width: 36px; height: 14px; border-radius: 8px; margin-top: 7px; }
  .swatch.sprinkle {
    background:
      radial-gradient(circle at 20% 50%, #e23b3b 0 3px, transparent 4px),
      radial-gradient(circle at 50% 50%, #2f8a3e 0 3px, transparent 4px),
      radial-gradient(circle at 80% 50%, #ffc857 0 3px, transparent 4px);
  }
  .swatch.cherry {
    border-radius: 10px;
    background:
      radial-gradient(circle at 42% 68%, #ff8a8a 0 3px, transparent 4px),
      radial-gradient(circle at 50% 70%, #e23b3b 0 11px, transparent 12px),
      linear-gradient(#2f8a3e, #2f8a3e) 50% 6px / 3px 12px no-repeat,
      #fff;
  }
  .pips { display: flex; gap: 4px; }
  .pips i { width: 12px; height: 12px; border-radius: 50%; background: #e6d3bf; display: block; }
  .pips i.on { background: #2f8a3e; }
  .panel { max-height: calc(100dvh - 16px); overflow: auto; }
  .levels { display: flex; flex-direction: column; gap: 8px; }
  .choice {
    text-align: left; border-radius: 16px; border: 3px solid transparent;
    background: #fff; padding: 8px 12px; color: var(--ink);
  }
  .choice b { display: block; font-size: 18px; }
  .choice small { display: block; margin-top: 2px; color: #6d5a48; font-size: 13px; }
  .choice[aria-pressed="true"] { border-color: #e2a62e; background: #fff6df; }
  #order-treat { font-size: 20px; line-height: 1.25; display: block; }
  #treats {
    position: absolute; left: 8px; right: 8px; top: 6px; height: 48px;
    display: flex; gap: 6px; justify-content: center; pointer-events: auto;
  }
  #treats[hidden] { display: none !important; }
  #treats button {
    position: static; flex: 1; max-width: 128px; min-height: 44px;
    border: none; border-radius: 12px;
    background: #fff8ec; color: var(--ink); font-weight: 800; font-size: 15px;
    box-shadow: 0 3px 0 #e2d0b4;
  }
  #treats button[hidden] { display: none !important; }
  #treats button[aria-pressed="true"] { background: var(--sun); }
  #clock {
    position: fixed; z-index: 46; top: calc(18px + env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    background: var(--card); border-radius: 999px; padding: 8px 14px;
    font-weight: 800; font-size: 22px;
  }
  #clock.up { background: #ffd0c8; }
  #clock.easy { background: #fff6df; }
  #clock[hidden] { display: none !important; }
  #note {
    position: fixed; z-index: 47; left: 50%; top: 22%;
    transform: translateX(-50%);
    margin: 0; pointer-events: none;
    background: #fff8ec; color: var(--ink);
    border: 4px solid var(--ink); border-radius: 18px;
    padding: 10px 18px; font-size: 32px; font-weight: 800;
  }
  #note:empty { visibility: hidden; }
  @media (max-width: 799px) {
    #face { width: 84px; height: 84px; }
    #back { min-width: 0; height: 56px; padding: 0 10px; font-size: 14px; }
    #order-treat { font-size: 16px; }
    .req b { font-size: 14px; }
    #clock { left: 136px; right: 156px; transform: none; text-align: center; font-size: 16px; line-height: 1.05; padding: 6px 4px; }
    #treats button { font-size: 13px; padding: 0 4px; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/>
  </svg>
</button>
<button id="full" type="button" aria-label="Fullscreen">Full</button>
<button id="back" type="button" hidden aria-label="Back to the menu">Back to Menu</button>
<button id="done" type="button" hidden>Item ready</button>
<p id="note" role="status"></p>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<div id="clock" hidden>1:30</div>
<div id="tray" hidden>
  <div id="treats" hidden>
    <button type="button" data-treat="donut" aria-pressed="true">Donut</button>
    <button type="button" data-treat="cupcake" aria-pressed="false">Cupcake</button>
    <button type="button" data-treat="cake" aria-pressed="false">Cake</button>
    <button type="button" data-treat="scoops" aria-pressed="false">Scoops</button>
    <button type="button" data-treat="soft" aria-pressed="false">Soft</button>
  </div>
  <button id="tool-pink" type="button" data-tool="pink" aria-label="Pink icing" aria-pressed="true"></button>
  <button id="tool-chocolate" type="button" data-tool="chocolate" aria-label="Chocolate icing" aria-pressed="false"></button>
  <button id="tool-white" type="button" data-tool="white" aria-label="White icing" aria-pressed="false"></button>
  <button id="tool-blue" type="button" data-tool="blue" aria-label="Blue icing" aria-pressed="false"></button>
  <button id="tool-sprinkles" type="button" data-tool="sprinkles" aria-label="Sprinkles" aria-pressed="false"></button>
  <button id="tool-cherry" type="button" data-tool="cherry" aria-label="Cherry" aria-pressed="false">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M30 28 C32 16 42 12 50 8" fill="none" stroke="#2f8a3e" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="48" cy="10" rx="8" ry="4" fill="#3aaa6a" transform="rotate(-28 48 10)"/>
      <circle cx="24" cy="40" r="13" fill="#e23b3b"/>
      <circle cx="19" cy="35" r="4" fill="#ffb0b0"/>
      <circle cx="40" cy="36" r="12" fill="#d42828"/>
      <circle cx="36" cy="31" r="3.5" fill="#ffb0b0"/>
    </svg>
  </button>
</div>
<aside id="card" hidden>
  <div id="face" aria-hidden="true">
    <svg viewBox="0 0 120 120">
      <defs>
        <radialGradient id="skin" cx="38%" cy="32%" r="70%">
          <stop offset="0" stop-color="#ffe7cc"/>
          <stop offset="1" stop-color="#f0b48a"/>
        </radialGradient>
      </defs>
      <circle cx="60" cy="62" r="50" fill="rgba(120,70,30,0.15)"/>
      <circle cx="60" cy="58" r="52" fill="url(#skin)"/>
      <ellipse cx="28" cy="74" rx="10" ry="6" fill="#f0a0a0" opacity="0.75"/>
      <ellipse cx="92" cy="74" rx="10" ry="6" fill="#f0a0a0" opacity="0.75"/>
      <path id="brow-l" d="M26 44 Q40 30 52 42" fill="none" stroke="#3a2a22" stroke-width="4" stroke-linecap="round"/>
      <path id="brow-r" d="M68 42 Q80 30 94 44" fill="none" stroke="#3a2a22" stroke-width="4" stroke-linecap="round"/>
      <ellipse id="eye-l" cx="42" cy="54" rx="6" ry="6.2" fill="#3a2a22"/>
      <ellipse id="eye-r" cx="78" cy="54" rx="6" ry="6.2" fill="#3a2a22"/>
      <path id="mouth" d="M34 72 Q60 98 86 72" fill="none" stroke="#3a2a22" stroke-width="5" stroke-linecap="round"/>
    </svg>
  </div>
  <div>
    <b id="order-treat"></b>
    <div id="box-line" hidden></div>
    <div id="reqs"></div>
  </div>
</aside>
<section id="screen-start" class="panel">
  <h1>Sugar Counter</h1>
  <p id="tag" class="tag">Press and move on the donut to ice it.</p>
  <p class="ages">Ages 2 and up</p>
  <div class="levels" id="level-choices">
    <button class="choice" type="button" data-level="tiny" aria-pressed="true"><b>Tiny Tots</b><small>Ages 2 to 3. Donuts and cupcakes to decorate.</small></button>
    <button class="choice" type="button" data-level="little" aria-pressed="false"><b>Little Pals</b><small>Ages 4 to 5. Cakes and picture orders. No clock.</small></button>
    <button class="choice" type="button" data-level="shop" aria-pressed="false"><b>Shopkeeper</b><small>Ages 6 to 8. Scoops and soft serve. A long wait, and they stay.</small></button>
    <button class="choice" type="button" data-level="rush" aria-pressed="false"><b>Rush</b><small>Ages 9 and up. Pack a box before the customer leaves.</small></button>
  </div>
  <div class="stack">
    <button id="decorate" class="big" type="button">Decorate</button>
    <button id="orders" class="mid" type="button" hidden>Orders</button>
  </div>
</section>
<script>
(function () {
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const POINTER_DEAD = 18;
  const COLORS = { pink: "#e86a9a", chocolate: "#6b3a2a", white: "#fff6ea", blue: "#6eb5e8" };
  const PLATE_CAPS = { blobs: 800, sprinkleShakes: 200, cherries: 48, scoops: 24, swirls: 12 };
  const FLAVOR_OF = { pink: "strawberry", chocolate: "chocolate", white: "vanilla", blue: "mint" };
  const FLAVOR_COLOR = { strawberry: "#e86a9a", chocolate: "#6b3a2a", vanilla: "#fff6ea", mint: "#3aaa6a" };
  const TOOLS = ["pink", "chocolate", "white", "blue", "sprinkles", "cherry"];
  const TREAT_NAME = { donut: "Donut", cupcake: "Cupcake", cake: "Cake", scoops: "Cone", soft: "Soft serve" };
  const ORDERS = [
    [{ kind: "glob", color: "pink", n: 3 }],
    [{ kind: "stripe", color: "chocolate", n: 1 }, { kind: "cherry", n: 1 }],
    [{ kind: "sprinkle", n: 2 }, { kind: "glob", color: "white", n: 1 }],
    [{ kind: "glob", color: "blue", n: 2 }, { kind: "cherry", n: 1 }],
    [{ kind: "stripe", color: "pink", n: 1 }, { kind: "sprinkle", n: 1 }],
    [{ kind: "stripe", color: "white", n: 1 }, { kind: "cherry", n: 2 }],
    [{ kind: "sprinkle", n: 3 }],
    [{ kind: "glob", color: "chocolate", n: 1 }, { kind: "glob", color: "blue", n: 1 }, { kind: "cherry", n: 1 }]
  ];
  const CUPCAKE_ORDERS = [
    { treat: "cupcake", reqs: [{ kind: "glob", color: "pink", n: 2 }] },
    { treat: "cupcake", reqs: [{ kind: "cherry", n: 1 }] },
    { treat: "cupcake", reqs: [{ kind: "stripe", color: "blue", n: 1 }, { kind: "sprinkle", n: 1 }] },
    { treat: "cupcake", reqs: [{ kind: "sprinkle", n: 3 }] }
  ];
  const CAKE_ORDERS = [
    { treat: "cake", reqs: [{ kind: "glob", color: "white", n: 2 }, { kind: "cherry", n: 1 }] },
    { treat: "cake", reqs: [{ kind: "stripe", color: "chocolate", n: 1 }] },
    { treat: "cake", reqs: [{ kind: "sprinkle", n: 2 }, { kind: "glob", color: "pink", n: 1 }] }
  ];
  const SCOOP_ORDERS = [
    { treat: "scoops", reqs: [{ kind: "scoop", color: "chocolate", n: 1 }] },
    { treat: "scoops", reqs: [{ kind: "scoop", color: "vanilla", n: 2 }] },
    { treat: "scoops", reqs: [{ kind: "scoop", color: "strawberry", n: 1 }, { kind: "scoop", color: "mint", n: 1 }] },
    { treat: "scoops", reqs: [{ kind: "scoop", color: "chocolate", n: 1 }, { kind: "scoop", color: "vanilla", n: 1 }, { kind: "scoop", color: "strawberry", n: 1 }] }
  ];
  const SOFT_ORDERS = [
    { treat: "soft", reqs: [{ kind: "swirl", color: "chocolate", n: 1 }] },
    { treat: "soft", reqs: [{ kind: "swirl", color: "vanilla", n: 2 }] },
    { treat: "soft", reqs: [{ kind: "swirl", color: "strawberry", n: 1 }, { kind: "swirl", color: "mint", n: 1 }] }
  ];
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d");
  const gazeEl = document.getElementById("gaze");
  const eyesEl = document.getElementById("eyes");
  const tag = document.getElementById("tag");
  const screen = document.getElementById("screen-start");
  const tray = document.getElementById("tray");
  const card = document.getElementById("card");
  const face = document.getElementById("face");
  const reqsEl = document.getElementById("reqs");
  const doneBtn = document.getElementById("done");
  const backBtn = document.getElementById("back");
  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const decorateBtn = document.getElementById("decorate");
  const ordersBtn = document.getElementById("orders");
  const treatsEl = document.getElementById("treats");
  const clockEl = document.getElementById("clock");
  const orderTreatEl = document.getElementById("order-treat");
  const toolEls = {};
  TOOLS.forEach((id) => { toolEls[id] = document.getElementById("tool-" + id); });

  let mode = "start";
  let levelId = "tiny";
  let treat = "donut";
  let tool = "pink";
  let orderIndex = 1;
  let timeLeft = 90;
  let patienceTotal = 90;
  let timeUp = false;
  let marks = [];
  let score = emptyScore();
  let gesture = null;
  let cherryDrag = null;
  let scoopDrag = null;
  let trayScoop = null;
  let latch = false;
  let pointerActive = false;
  let capId = null;
  let mute = false;
  let clock = 0;
  let checking = false;
  let flashUntil = 0;
  let groupSeq = 1;
  let ac = null;
  let master = null;
  let lastTick = -1e9;
  let lastSplat = -1e9;
  let noteUntil = 0;
  let correctServes = 0;

  let gazeSock = null;
  let gazeBuf = new Uint8Array(0);
  let gazeTimer = 0;
  let gazePoint = null;
  let gazeAt = 0;
  let gazeHold = null;
  let refreshHold = true;
  let gazeWarp = null;
  let haveSmooth = false;
  let smoothed = null;
  let suppressReconnect = false;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;
  let leaveAt = 0;

  function emptyScore() {
    return {
      globs: { pink: 0, chocolate: 0, white: 0, blue: 0 },
      stripes: { pink: 0, chocolate: 0, white: 0, blue: 0 },
      sprinkles: 0,
      cherries: 0,
      scoops: { strawberry: 0, chocolate: 0, vanilla: 0, mint: 0 },
      swirls: { strawberry: 0, chocolate: 0, vanilla: 0, mint: 0 }
    };
  }
  function iceTreat() { return treat === "scoops" || treat === "soft"; }
  function flavorOf(id) { return FLAVOR_OF[id] || null; }
  function treatsForLevel() {
    if (levelId === "tiny") return ["donut", "cupcake"];
    if (levelId === "little") return ["donut", "cupcake", "cake"];
    return ["donut", "cupcake", "cake", "scoops", "soft"];
  }
  let playDeck = null;
  function catalog() {
    const donutCards = ORDERS.map((reqs) => ({ treat: "donut", reqs }));
    const bakery = donutCards.concat(CUPCAKE_ORDERS, CAKE_ORDERS);
    if (levelId === "shop" || levelId === "rush") return bakery.concat(SCOOP_ORDERS, SOFT_ORDERS);
    if (levelId === "little") return bakery;
    return donutCards;
  }
  function shuffleCards(cards) {
    const next = cards.slice();
    for (let i = next.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const swap = next[i];
      next[i] = next[j];
      next[j] = swap;
    }
    return next;

    const p = tipFrom(e.clientX, e.clientY, e.pointerType);
    pointerDown(p.x, p.y);
    if (capId !== null) {
      capId = e.pointerId;
      canvas.setPointerCapture(e.pointerId);
    }
    e.preventDefault();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerId !== capId) return;
    const p = tipFrom(e.clientX, e.clientY, e.pointerType);
    pointerMove(p.x, p.y);
  });
  function endPointer(e) {
    if (e.pointerId !== capId) return;
    const p = tipFrom(e.clientX, e.clientY, e.pointerType);
    const id = capId;
    pointerUp(p.x, p.y);
    if (canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  document.addEventListener("pointerdown", (e) => {
    ensureAudio();
    const btn = e.target.closest && e.target.closest("button");
    if (!btn) return;
    pointerActive = true;
    releaseLatch();
  }, true);
  document.addEventListener("pointermove", (e) => {
    if (!trayScoop || e.pointerId !== trayScoop.pid) return;
    trayScoop.x = e.clientX;
    trayScoop.y = e.clientY;
    render();
  }, true);
  document.addEventListener("pointerup", (e) => {
    if (trayScoop && e.pointerId === trayScoop.pid) {
      if (inDonut(e.clientX, e.clientY)) placeScoop(trayScoop.color);
      trayScoop = null;
      render();
    }
    if (capId === null) pointerActive = false;
  }, true);
  document.addEventListener("pointercancel", () => {
    if (capId === null) pointerActive = false;
  }, true);

  TOOLS.forEach((id) => {
    toolEls[id].addEventListener("click", () => selectTool(id));
    toolEls[id].addEventListener("pointerdown", (e) => {
      if (treat !== "scoops" || !flavorOf(id)) return;
      trayScoop = { color: flavorOf(id), x: e.clientX, y: e.clientY, pid: e.pointerId };
      pointerActive = true;
    });
  });
  document.querySelectorAll("[data-level]").forEach((btn) => {
    btn.addEventListener("click", () => selectLevel(btn.dataset.level));
  });
  treatsEl.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => setTreat(btn.dataset.treat));
  });
  decorateBtn.addEventListener("click", () => start("free"));
  ordersBtn.addEventListener("click", () => { if (levelId !== "tiny") start("orders"); });
  doneBtn.addEventListener("click", serve);
  backBtn.addEventListener("click", showStart);
  muteBtn.addEventListener("click", () => {
    mute = !mute;
    muteBtn.setAttribute("aria-pressed", mute ? "true" : "false");
    muteBtn.setAttribute("aria-label", mute ? "Turn sound on" : "Mute sound");
    document.getElementById("sound-on").hidden = mute;
    document.getElementById("sound-off").hidden = !mute;
    if (master) master.gain.value = mute ? 0 : 0.6;
  });
  fullBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      const req = document.documentElement.requestFullscreen;
      if (req) req.call(document.documentElement).catch(() => {});
    } else if (document.exitFullscreen) document.exitFullscreen();
  });

  window.addEventListener("resize", resize);
  resize();

  function frame(now) {
    if (!checking) step(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  connectGaze();

  window.sugarCounter = {
    start, look, releaseLook, dwell: () => dwellProgress,
    eyes: () => ({ on: eyesOn(), live: eyesLive(clock || performance.now()) }),
    tap, drag, centers, state, order, step, selfCheck,
    level: selectLevel, treat: setTreat
  };

  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    const result = selfCheck();
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else if (params.has("scoops")) {
    selectLevel("shop"); start("free"); setTreat("scoops");
  } else if (params.has("soft")) {
    selectLevel("shop"); start("free"); setTreat("soft");
  } else if (params.has("sprinkle")) {
    selectLevel("tiny"); start("free"); tool = "sprinkles"; addCluster(layout().donut.cx, layout().donut.cy, 1); render();
  } else if (params.has("cupcake")) {
    selectLevel("tiny"); start("free"); setTreat("cupcake");
  } else if (params.has("cake")) {
    selectLevel("little"); start("free"); setTreat("cake");
  } else if (params.has("rush")) {
    selectLevel("rush"); start("orders");
  } else if (params.has("impatient")) {
    selectLevel("rush"); start("orders");
    timeLeft = patienceTotal * 0.08;
    render();
  } else if (params.has("shop")) {
    selectLevel("shop"); start("orders");
  } else if (params.has("orders")) {
    selectLevel("little"); start("orders");
  } else if (params.has("play")) {
    selectLevel("tiny"); start("free");
  }
})();
</script>
</body>
</html>
