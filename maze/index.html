<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>Maze</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; touch-action: none; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; pointer-events: none; z-index: 1;
  }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 28; pointer-events: none;
    background: var(--card); border-radius: 999px; padding: 8px 12px;
    font-weight: 800; font-size: 16px;
  }
  #banner {
    position: fixed; z-index: 25; pointer-events: none;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 6px 14px; font-size: 18px; font-weight: 800;
    text-align: center;
  }
  #menu-card, #rest-card {
    position: fixed; z-index: 2; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #screen-menu, #screen-rest, #play, #menu-copy, #rest-line, h1, p, b, small {
    pointer-events: none;
  }
  #menu-copy, #rest-line {
    position: fixed; z-index: 24; margin: 0; text-align: center; overflow: hidden;
  }
  #menu-copy h1 { margin: 0; font-size: 26px; line-height: 28px; }
  #menu-copy p { margin: 0; font-size: 14px; line-height: 16px; }
  #rest-line { font-size: 28px; font-weight: 800; }
  #mute, #full, #back, #lets-go, #tiny, #little, #shop, #rush, #another, #play button {
    position: fixed; z-index: 30; pointer-events: auto;
  }
  #mute, #full, #back {
    z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1; font-size: 15px; line-height: 1.1;
    padding: 4px;
  }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; display: block; }
  #tiny, #little, #shop, #rush {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; color: var(--ink); text-align: left;
    padding: 4px 10px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  #tiny b, #little b, #shop b, #rush b { display: block; font-size: 18px; line-height: 20px; }
  #tiny small, #little small, #shop small, #rush small {
    display: block; font-size: 12px; line-height: 14px; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go, #another {
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink); font-weight: 800;
    box-shadow: 0 5px 0 var(--sun-d); font-size: 26px;
  }
  #play button {
    border: 0; border-radius: 50%; padding: 0;
    background: #ffc857;
    box-shadow: 0 0 0 3px #fffdf6, inset 0 0 0 4px #e2a62e;
  }
  #play button.goal {
    box-shadow: 0 0 0 3px #fffdf6, inset 0 0 0 5px #1f8a4c;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<button id="mute" type="button" aria-label="Mute sound">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8l6 8"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner">Pick who is playing.</p>
<section id="screen-menu">
  <div id="menu-card"></div>
  <div id="menu-copy">
    <h1>Maze</h1>
    <p>Look at the next dot. The meeple walks there.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>First Steps</b><small>Ages 2 to 3. A short path. Sometimes a wrong turn.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Hedge Row</b><small>Ages 4 to 5. The next dots light. Up to three.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Twisty</b><small>Ages 6 to 8. Up to three next dots.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Long Trail</b><small>Ages 9 and up. Up to three next dots. A longer walk.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden></div>
<section id="screen-rest" hidden>
  <div id="rest-card"></div>
  <p id="rest-line">You made it.</p>
</section>
<script>
(function () {
  "use strict";
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const BAND_IDS = ["tiny", "little", "shop", "rush"];
  const BANNERS = {
    menu: "Pick who is playing.",
    maze: "Look at the next stone.",
    rest: "You made it."
  };

  function makeRng(seed) {
    let state = seed >>> 0;
    return {
      uint() {
        state = (state + 0x6D2B79F5) >>> 0;
        let t = Math.imul(state ^ (state >>> 15), state | 1);
        t = t ^ (t + Math.imul(t ^ (t >>> 7), t | 61));
        return (t ^ (t >>> 14)) >>> 0;
      }
    };
  }
  function rngUint(rng) { return rng.uint(); }
  function rngInt(rng, lo, hi) {
    return lo + (rngUint(rng) % (hi - lo + 1));
  }
  function rngShuffle(rng, items) {
    const a = items.slice();
    for (let i = a.length - 1; i >= 1; i--) {
      const j = rngInt(rng, 0, i);
      const tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }
  function playSeed(clockMs, counter) {
    return (Math.imul(((clockMs >>> 0) ^ Math.imul(counter >>> 0, 0x9E3779B9)), 0x85EBCA6B)) >>> 0;
  }

  const COMPASS = [[-1, 0], [0, 1], [1, 0], [0, -1]];

  function idOf(r, c) { return r + "," + c; }
  function parseId(id) {
    const p = String(id).split(",");
    return [+p[0], +p[1]];
  }
  function idxOf(id, cols) {
    const rc = parseId(id);
    return rc[0] * cols + rc[1];
  }
  function edgeKey(a, b, cols) {
    const ia = idxOf(a, cols);
    const ib = idxOf(b, cols);
    return ia < ib ? a + "|" + b : b + "|" + a;
  }
  function chebyshev(a, b) {
    const p = parseId(a);
    const q = parseId(b);
    return Math.max(Math.abs(p[0] - q[0]), Math.abs(p[1] - q[1]));
  }
  function cmpId(a, b) {
    const p = parseId(a);
    const q = parseId(b);
    if (p[0] !== q[0]) return p[0] - q[0];
    return p[1] - q[1];
  }

  function pathStats(path) {
    if (path.length < 2) return { turnDwell: 0, straights: 0, straightIdx: [], cornerIdx: [] };
    const straightIdx = [];
    const cornerIdx = [];
    for (let i = 1; i < path.length - 1; i++) {
      const prev = path[i - 1];
      const cur = path[i];
      const next = path[i + 1];
      const opposite = (prev[0] - cur[0] === -(next[0] - cur[0])) && (prev[1] - cur[1] === -(next[1] - cur[1]));
      if (opposite) straightIdx.push(i);
      else cornerIdx.push(i);
    }
    return { turnDwell: cornerIdx.length + 1, straights: straightIdx.length, straightIdx: straightIdx, cornerIdx: cornerIdx };
  }

  function oppositeStep(prev, cur, next) {
    return (prev[0] - cur[0] === -(next[0] - cur[0])) && (prev[1] - cur[1] === -(next[1] - cur[1]));
  }

  function cornerCount(origin, cells) {
    const seq = [origin].concat(cells);
    let n = 0;
    for (let i = 1; i < seq.length - 1; i++) {
      if (!oppositeStep(seq[i - 1], seq[i], seq[i + 1])) n += 1;
    }
    return n;
  }

  function spurStops(attach, cells) {
    const seq = [parseId(attach)].concat(cells);
    const stops = [];
    for (let i = 1; i < seq.length; i++) {
      const cur = seq[i];
      const prev = seq[i - 1];
      const next = i + 1 < seq.length ? seq[i + 1] : null;
      if (!next || !oppositeStep(prev, cur, next)) stops.push(idOf(cur[0], cur[1]));
    }
    return stops;
  }

  function growBent(rng, origin, dir0, occupied, inB, targetLen, minCorners) {
    const cells = [];
    const blocked = new Set(occupied);
    function free(rr, cc) {
      return inB(rr, cc) && !blocked.has(idOf(rr, cc));
    }
    let r = origin[0];
    let c = origin[1];
    let dir = [dir0[0], dir0[1]];
    for (let k = 0; k < 2; k++) {
      r += dir0[0];
      c += dir0[1];
      if (!free(r, c)) return null;
      blocked.add(idOf(r, c));
      cells.push([r, c]);
    }
    while (cells.length < targetLen) {
      const turns = [];
      let straight = null;
      for (let di = 0; di < COMPASS.length; di++) {
        const d = COMPASS[di];
        const nr = r + d[0];
        const nc = c + d[1];
        if (!free(nr, nc)) continue;
        if (d[0] === -dir[0] && d[1] === -dir[1]) continue;
        if (d[0] === dir[0] && d[1] === dir[1]) straight = d;
        else turns.push(d);
      }
      const have = cornerCount(origin, cells);
      const room = targetLen - cells.length;
      let choice = null;
      if (have < minCorners && turns.length && (room >= 2 || have + 1 >= minCorners)) {
        choice = rngShuffle(rng, turns)[0];
      } else if (straight) choice = straight;
      else if (turns.length) choice = rngShuffle(rng, turns)[0];
      else break;
      r += choice[0];
      c += choice[1];
      dir = choice;
      blocked.add(idOf(r, c));
      cells.push([r, c]);
    }
    if (cornerCount(origin, cells) < minCorners) return null;
    if (cells.length < targetLen) return null;
    return cells;
  }

  function finishMaze(band, rows, cols, path, spurs, fallbackUsed) {
    const cellsSet = new Set();
    path.forEach(function (p) { cellsSet.add(idOf(p[0], p[1])); });
    spurs.forEach(function (sp) { sp.cells.forEach(function (p) { cellsSet.add(idOf(p[0], p[1])); }); });
    const cells = Array.from(cellsSet);
    cells.sort(function (a, b) { return idxOf(a, cols) - idxOf(b, cols); });
    const edgeSet = new Set();
    for (let i = 1; i < path.length; i++) {
      edgeSet.add(edgeKey(idOf(path[i - 1][0], path[i - 1][1]), idOf(path[i][0], path[i][1]), cols));
    }
    spurs.forEach(function (sp) {
      let prev = sp.attach;
      sp.cells.forEach(function (p) {
        const id = idOf(p[0], p[1]);
        edgeSet.add(edgeKey(prev, id, cols));
        prev = id;
      });
    });
    const edges = Array.from(edgeSet);
    const stats = pathStats(path);
    const attachSet = new Set(spurs.map(function (sp) { return sp.attach; }));
    const cornerSet = new Set(stats.cornerIdx.map(function (i) { return idOf(path[i][0], path[i][1]); }));
    const solution = [];
    if (band === "tiny") {
      path.forEach(function (p) { solution.push(idOf(p[0], p[1])); });
    } else {
      for (let i = 0; i < path.length; i++) {
        const id = idOf(path[i][0], path[i][1]);
        if (i === 0 || i === path.length - 1 || cornerSet.has(id) || attachSet.has(id)) solution.push(id);
      }
    }
    const deadEnds = spurs.map(function (sp) { return { id: sp.leaf, length: sp.len }; });
    const stones = solution.slice();
    spurs.forEach(function (sp) {
      const stops = sp.stops || spurStops(sp.attach, sp.cells);
      for (let i = 0; i < stops.length; i++) {
        if (stones.indexOf(stops[i]) < 0) stones.push(stops[i]);
      }
    });
    const pathIds = path.map(function (p) { return idOf(p[0], p[1]); });
    return {
      band: band, rows: rows, cols: cols, cells: cells, edges: edges,
      start: pathIds[0],
      goal: pathIds[pathIds.length - 1],
      stones: stones, solution: solution, deadEnds: deadEnds, fallbackUsed: fallbackUsed,
      path: pathIds,
      spurs: spurs.map(function (sp) {
        return {
          attach: sp.attach,
          leaf: sp.leaf,
          len: sp.len,
          cells: sp.cells.map(function (p) { return idOf(p[0], p[1]); }),
          stops: spurStops(sp.attach, sp.cells)
        };
      })
    };
  }

  function tinySpur(rng, path) {
    function inB(r, c) { return r >= 0 && c >= 0 && r < 3 && c < 3; }
    const occupied = new Set(path.map(function (p) { return idOf(p[0], p[1]); }));
    const candidates = [];
    for (let i = 1; i < path.length - 1; i++) {
      const rem = path.length - 1 - i;
      if (rem >= 2) candidates.push({ i: i, cell: path[i], rem: rem });
    }
    const order = rngShuffle(rng, candidates);
    order.sort(function (a, b) { return a.rem - b.rem; });
    for (let ci = 0; ci < order.length; ci++) {
      const cand = order[ci];
      const cid = idOf(cand.cell[0], cand.cell[1]);
      const free = 9 - occupied.size;
      const target = Math.max(3, cand.rem + 1);
      if (target > free) continue;
      const prev = path[cand.i - 1];
      const nextc = path[cand.i + 1];
      const along = new Set([
        (prev[0] - cand.cell[0]) + "," + (prev[1] - cand.cell[1]),
        (nextc[0] - cand.cell[0]) + "," + (nextc[1] - cand.cell[1])
      ]);
      const perp = [];
      for (let di = 0; di < COMPASS.length; di++) {
        const k = COMPASS[di][0] + "," + COMPASS[di][1];
        if (!along.has(k)) perp.push(COMPASS[di]);
      }
      const dirs = rngShuffle(rng, perp);
      for (let di = 0; di < dirs.length; di++) {
        const cells = growBent(rng, cand.cell, dirs[di], occupied, inB, target, 1);
        if (!cells || cells.length <= cand.rem) continue;
        if (spurStops(cid, cells).length - 1 < 1) continue;
        const trial = {
          attach: cid,
          leaf: idOf(cells[cells.length - 1][0], cells[cells.length - 1][1]),
          len: cells.length,
          cells: cells
        };
        const trialMaze = finishMaze("tiny", 3, 3, path, [trial], false);
        if (mazeLit(trialMaze, trialMaze.start).length !== 1) continue;
        if (mazeLit(trialMaze, trialMaze.goal).length) continue;
        if (!stoneChecks(trialMaze)) continue;
        return trial;
      }
    }
    return null;
  }

  function genTiny(seed) {
    const rng = makeRng(seed);
    const dwells = rngInt(rng, 2, 4);
    const straight = rngInt(rng, 0, 1) === 0;
    function straightRow() {
      const path = [];
      for (let c = 0; c <= dwells; c++) path.push([0, c]);
      return finishMaze("tiny", 1, dwells + 1, path, [], false);
    }
    if (straight) return straightRow();
    function inBox(r, c) { return r >= 0 && c >= 0 && r < 3 && c < 3; }
    for (let attempt = 0; attempt < 20; attempt++) {
      const path = [[0, 0]];
      const visited = new Set(["0,0"]);
      let ok = true;
      while (path.length < dwells + 1) {
        const r = path[path.length - 1][0];
        const c = path[path.length - 1][1];
        const free = [];
        for (let di = 0; di < COMPASS.length; di++) {
          const nr = r + COMPASS[di][0];
          const nc = c + COMPASS[di][1];
          if (!inBox(nr, nc) || visited.has(idOf(nr, nc))) continue;
          free.push([nr, nc]);
        }
        if (!free.length) { ok = false; break; }
        const next = rngShuffle(rng, free)[0];
        path.push(next);
        visited.add(idOf(next[0], next[1]));
      }
      if (!(ok && path.length === dwells + 1)) continue;
      const spur = tinySpur(rng, path);
      if (spur) return finishMaze("tiny", 3, 3, path, [spur], false);
      return finishMaze("tiny", 3, 3, path, [], false);
    }
    return straightRow();
  }

  const BANDS = {
    little: { sizes: [[5, 5]], L: [4, 7], D: [1, 2], spur: [1, 1], bend: 1, minBend: 3, minRem: 3 },
    shop: { sizes: [[6, 6], [8, 8]], L: [8, 14], D: [3, 6], spur: [1, 3], bend: 2, minBend: 5, minRem: 4 },
    rush: { sizes: [[10, 10], [12, 12]], L: [12, 20], D: [6, 12], spur: [1, 5], bend: 2, minBend: 5, minRem: 6 }
  };

  function tryBuild(rng, band, rows, cols, spec) {
    const L = rngInt(rng, spec.L[0], spec.L[1]);
    const D = rngInt(rng, spec.D[0], spec.D[1]);
    const goalD = L - D;
    if (goalD < 1) return null;
    const sr = rngInt(rng, 0, rows - 1);
    const sc = rngInt(rng, 0, cols - 1);
    const path = [[sr, sc]];
    const visited = new Set([idOf(sr, sc)]);
    let dir = null;
    let dirSteps = 0;
    function inB(r, c) { return r >= 0 && c >= 0 && r < rows && c < cols; }
    for (let n = 0; n < 80; n++) {
      const r = path[path.length - 1][0];
      const c = path[path.length - 1][1];
      let straight = null;
      if (dir) {
        const nr = r + dir[0];
        const nc = c + dir[1];
        if (inB(nr, nc) && !visited.has(idOf(nr, nc))) straight = [nr, nc];
      }
      let next = null;
      if (dir && dirSteps < 2 && straight) {
        next = straight;
      } else {
        const free = [];
        for (let di = 0; di < COMPASS.length; di++) {
          const nr = r + COMPASS[di][0];
          const nc = c + COMPASS[di][1];
          if (!inB(nr, nc) || visited.has(idOf(nr, nc))) continue;
          free.push([nr, nc]);
        }
        if (!free.length) break;
        const shuffled = rngShuffle(rng, free);
        if (straight) {
          const ix = shuffled.findIndex(function (p) { return p[0] === straight[0] && p[1] === straight[1]; });
          if (ix > 0) {
            const item = shuffled.splice(ix, 1)[0];
            shuffled.unshift(item);
          }
        }
        next = shuffled[0];
      }
      const dr = next[0] - r;
      const dc = next[1] - c;
      if (dir && dr === dir[0] && dc === dir[1]) dirSteps += 1;
      else { dir = [dr, dc]; dirSteps = 1; }
      path.push(next);
      visited.add(idOf(next[0], next[1]));
      const st = pathStats(path);
      if (st.turnDwell >= goalD && st.straights >= D) break;
    }
    let stats = pathStats(path);
    while (stats.turnDwell > goalD && path.length > 2) {
      const last = path.pop();
      visited.delete(idOf(last[0], last[1]));
      stats = pathStats(path);
    }
    if (stats.turnDwell !== goalD || stats.straights < D) return null;
    const occupied = new Set(path.map(function (p) { return idOf(p[0], p[1]); }));
    const order = rngShuffle(rng, stats.straightIdx.map(function (i) {
      return { i: i, cell: path[i], rem: path.length - 1 - i };
    }));
    const spurs = [];
    const used = new Set();
    function dirsFrom(cand) {
      const prev = path[cand.i - 1];
      const nextc = path[cand.i + 1];
      const along = new Set([
        (prev[0] - cand.cell[0]) + "," + (prev[1] - cand.cell[1]),
        (nextc[0] - cand.cell[0]) + "," + (nextc[1] - cand.cell[1])
      ]);
      const perp = [];
      for (let di = 0; di < COMPASS.length; di++) {
        const k = COMPASS[di][0] + "," + COMPASS[di][1];
        if (!along.has(k)) perp.push(COMPASS[di]);
      }
      return rngShuffle(rng, perp);
    }
    function trialOk(nextSpurs) {
      const trialMaze = finishMaze(band, rows, cols, path, nextSpurs, false);
      if (!stoneChecks(trialMaze)) return false;
      if (mazeLit(trialMaze, trialMaze.start).length !== 1) return false;
      return true;
    }
    function placeBent() {
      const candidates = [];
      for (let ci = 0; ci < order.length; ci++) {
        const cand = order[ci];
        if (cand.rem < spec.minRem) continue;
        if (used.has(idOf(cand.cell[0], cand.cell[1]))) continue;
        candidates.push(cand);
      }
      candidates.sort(function (a, b) { return a.rem - b.rem; });
      for (let ci = 0; ci < candidates.length; ci++) {
        const cand = candidates[ci];
        const cid = idOf(cand.cell[0], cand.cell[1]);

  function resizeCanvas() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = window.innerWidth;
    const h = window.innerHeight;

    const bh = Math.max(1, Math.round(h * dpr));

  function gridMetrics(w, h) {
    if (!w) w = window.innerWidth;

    const pfY = 92;
    const pfW = Math.max(0, w - 16);
    const pfH = Math.max(0, h - 92 - 8);
    const cols = maze ? maze.cols : 1;
    const rows = maze ? maze.rows : 1;
    const pitch = Math.min(pfW / cols, pfH / rows);

    const gridH = pitch * rows;
    return {
      ox: pfX + (pfW - gridW) / 2,

  function cellCenter(id, m) {

    if (t >= 1) return pts[pts.length - 1];
    const seg = [];
    let total = 0;
    for (let i = 1; i < pts.length; i++) {

      seg.push(len);
      total += len;
    }
    let dist = t * total;
    for (let i = 1; i < pts.length; i++) {
      if (dist <= seg[i - 1] || i === pts.length - 1) {
        const f = seg[i - 1] ? dist / seg[i - 1] : 1;
        return {
          x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * f,
          y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * f

      }
      dist -= seg[i - 1];
    }
    return pts[pts.length - 1];

  function paint() {
    resizeCanvas();
    const w = window.innerWidth;
    const h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#f4f0d8";
    ctx.fillRect(0, 0, w, h);
    if (screen !== "maze" || !maze) return;
    const m = gridMetrics();
    const edgeSet = new Set(maze.edges);
    ctx.fillStyle = "#4a2c14";
    ctx.fillRect(m.ox, m.oy, m.pitch * m.cols, m.pitch * m.rows);
    const lit = mazeLit(maze, token);
    for (let i = 0; i < maze.cells.length; i++) {
      const id = maze.cells[i];
      const rc = parseId(id);
      const x = m.ox + rc[1] * m.pitch;
      const y = m.oy + rc[0] * m.pitch;
      let L = rc[1] === 0 ? m.thick : m.thick / 2;
      let T = rc[0] === 0 ? m.thick : m.thick / 2;
      let R = rc[1] === m.cols - 1 ? m.thick : m.thick / 2;
      let B = rc[0] === m.rows - 1 ? m.thick : m.thick / 2;
      if (rc[1] > 0 && hasEdge(id, idOf(rc[0], rc[1] - 1), m.cols, edgeSet)) L = 0;
      if (rc[0] > 0 && hasEdge(id, idOf(rc[0] - 1, rc[1]), m.cols, edgeSet)) T = 0;
      if (rc[1] + 1 < m.cols && hasEdge(id, idOf(rc[0], rc[1] + 1), m.cols, edgeSet)) R = 0;

          ctx.lineCap = "round";

      pos = pointAlong(slide.ids, Math.max(0, Math.min(1, t)), m);
    }
    drawMeeple(pos.x, pos.y, m.pitch * 0.62);

  function drawMeeple(x, y, s) {
    ctx.save();

    ctx.moveTo(-s * 0.15, -s * 0.04);
    ctx.lineTo(-s * 0.30, s * 0.36);
    ctx.lineTo(s * 0.30, s * 0.36);
    ctx.lineTo(s * 0.15, -s * 0.04);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -s * 0.16, s * 0.18, 0, Math.PI * 2);
    ctx.moveTo(-s * 0.15, -s * 0.02);
    ctx.lineTo(-s * 0.30, s * 0.36);
    ctx.lineTo(s * 0.30, s * 0.36);
    ctx.lineTo(s * 0.15, -s * 0.02);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

  function buttonVisible(btn) {

  function centers() {

    for (let i = 0; i < buttons.length; i++) {

    const expect = [0xA087EAF3, 0x00B349C9, 0x8706C4EB, 0xFB2627FD];

    if (playSeed(1, 1) !== 0x3B230FE8) failures.push("rng-playseed: playSeed of 1 and 1 was not the pinned value.");

    for (let i = 0; i < 20; i++) {
      const n = rngInt(rng2, 0, 3);
      if (n < 0 || n > 3) failures.push("rng-int: rngInt left the range 0 through 3.");

    const bands = ["tiny", "little", "shop", "rush"];
    for (let b = 0; b < bands.length; b++) {

        const built = mazeGenerate(bands[b], s);
        checkMaze(built, "gen-" + bands[b] + "-" + s, failures, false);

    for (let b = 0; b < bands.length; b++) {

      function rec(prev) {
        if (mazeLit(maze, token).length >= 2 && token !== maze.goal) return true;
        if (steps >= cap) return false;
        const here = token;
        const cands = mazeLit(maze, here).filter(function (id) { return id !== prev && id !== maze.goal; }).sort(cmpId);
        for (let i = 0; i < cands.length; i++) {
          steps += 1;
          move(cands[i]);
          const nowLit = mazeLit(maze, token);
          if (nowLit.length === 1 && nowLit[0] === here) {
            move(here);
            continue;
          }
          if (rec(here)) return true;
          move(here);
        }
        return false;
      }
      return rec(null);
    }
    run("separation", function () {
      resetInput();
      seed(1);
      start("little");
      const live = centers().targets.filter(function (t) { return t.play; });
      const liveBad = dotsOnCells(live, window.innerWidth, window.innerHeight);
      if (live.length && liveBad) fail("separation", "The live lit stones failed the " + liveBad + " rule.");
      if (!parkAtFork()) fail("separation", "Little Pals seed 1 had no stone that lights two or three neighbors.");
      else if (state().token === maze.goal || state().screen !== "maze") fail("separation", "The fork walk entered the goal.");
      else {
        const fork = centers().targets.filter(function (t) { return t.play; });
        if (fork.length < 2 || fork.length > 3) fail("separation", "The fork did not light two or three stones.");
        const forkBad = dotsOnCells(fork, window.innerWidth, window.innerHeight);
        if (forkBad) fail("separation", "The fork stones failed the " + forkBad + " rule.");
        const phone = targetsAt(390, 844);
        const phoneStones = phone.targets.filter(function (t) { return t.id.indexOf("stone-") === 0; });
        if (!phone.ok || phoneStones.length !== fork.length) fail("separation", "The 390 by 844 layout dropped a lit stone.");
        const phoneBad = dotsOnCells(phoneStones, 390, 844);
        if (phoneBad) fail("separation", "The 390 by 844 dots failed the " + phoneBad + " rule.");
        const desk = targetsAt(1024, 768);
        const deskStones = desk.targets.filter(function (t) { return t.id.indexOf("stone-") === 0; });
        if (!desk.ok || deskStones.length !== fork.length) fail("separation", "The 1024 by 768 layout dropped a lit stone.");
        const deskBad = dotsOnCells(deskStones, 1024, 768);
        if (deskBad) fail("separation", "The 1024 by 768 dots failed the " + deskBad + " rule.");
      }
      resetInput();
      seed(1);
      start("tiny");
      const one = centers().targets.filter(function (t) { return t.play; });
      if (one.length !== 1) fail("separation", "Tiny did not show one next dot.");
      const oneBad = dotsOnCells(one, window.innerWidth, window.innerHeight);
      if (oneBad) fail("separation", "The fresh Tiny dot failed the " + oneBad + " rule.");
      const phoneOne = targetsAt(390, 844).targets.filter(function (t) { return t.id.indexOf("stone-") === 0; });
      const deskOne = targetsAt(1024, 768).targets.filter(function (t) { return t.id.indexOf("stone-") === 0; });
      if (phoneOne.length !== 1 || dotsOnCells(phoneOne, 390, 844)) fail("separation", "Tiny at 390 by 844 was not one dot on the next cell.");
      if (deskOne.length !== 1 || dotsOnCells(deskOne, 1024, 768)) fail("separation", "Tiny at 1024 by 768 was not one dot on the next cell.");
    });
    function walkGoal() {
      const cap = maze.cells.length;
      let steps = 0;
      function rec(prev) {
        if (token === maze.goal) return state().screen === "rest";
        if (steps >= cap) return false;
        const here = token;
        const lit = mazeLit(maze, here).slice().sort(cmpId);
        for (let i = 0; i < lit.length; i++) {
          const id = lit[i];
          if (id === prev) continue;
          steps += 1;
          if (steps > cap) return false;
          move(id);
          if (token === maze.goal) return state().screen === "rest";
          const nowLit = mazeLit(maze, token);
          if (nowLit.length === 1 && nowLit[0] === here) {
            move(here);
            continue;
          }
          if (rec(here)) return true;
          move(here);
        }
        return false;
      }
      return rec(null);
    }
    run("goal-rest", function () {
      resetInput();
      seed(1);
      start("little");
      if (!walkGoal()) fail("goal-rest", "The walk did not reach the goal.");
      const snap = state();
      if (snap.screen !== "rest") fail("goal-rest", "Landing on the goal did not open rest.");
      if (snap.banner !== "You made it.") fail("goal-rest", "The rest banner was not the calm sentence.");
      const low = snap.banner.toLowerCase();
      if (low.indexOf("lose") >= 0 || low.indexOf("fail") >= 0) fail("goal-rest", "The banner said lose or fail.");
      const ban = ["msLeft", "best", "lives", "score", "wrongs", "rank"];
      for (let i = 0; i < ban.length; i++) {
        if (Object.prototype.hasOwnProperty.call(snap, ban[i])) fail("goal-rest", "state included " + ban[i] + ".");
      }
      const restText = restEl.innerText || "";
      if (/grade|miss|rank|time/i.test(restText)) fail("goal-rest", "The rest card showed a grade.");
      const anotherBtn = document.getElementById("another");
      if (!anotherBtn || anotherBtn.getAttribute("data-play") === "true") fail("goal-rest", "Another was missing or marked as play.");
      const anotherBox = targetById(centers().targets, "another");
      if (!anotherBox) fail("goal-rest", "Another was not a target after the first maze.");
      else tap(anotherBox.nx, anotherBox.ny);
      if (state().screen !== "maze") fail("goal-rest", "Another did not deal the next maze.");
      if (document.getElementById("another")) fail("goal-rest", "Another stayed on the maze screen.");
      if (!walkGoal()) fail("goal-rest", "The second maze did not reach the goal.");
      if (document.getElementById("another")) fail("goal-rest", "Another stayed after the ceiling.");
      const rowsBefore = state().rows;
      const tokenBefore = state().token;
      another();
      if (state().screen !== "rest" || state().rows !== rowsBefore || state().token !== tokenBefore) {
        fail("goal-rest", "A third maze was dealt after the ceiling.");
      }
    });
    run("no-speech", function () {
      if (speakCalls !== 0) fail("no-speech", "speechSynthesis.speak was called.");
      if (Object.prototype.hasOwnProperty.call(state(), "speech")) fail("no-speech", "state kept a speech field.");
    });
    run("no-jump", function () {
      resetInput();
      seed(1);
      start("tiny");
      if (maze.solution.length > 2) {
        const beforeJump = state().token;
        const farTiny = maze.solution[2];
        if (move(farTiny) !== null || state().token !== beforeJump) fail("no-jump", "Tiny moved to a stone that was not the first lit stone.");
      }
      const oldTiny = state().token;
      const litTiny = state().stones.filter(function (s) { return s.lit; })[0];
      const walkedTiny = move(litTiny.id);
      if (!walkedTiny || walkedTiny.length !== 2 || walkedTiny[0] !== oldTiny || walkedTiny[walkedTiny.length - 1] !== litTiny.id) {
        fail("no-jump", "The Tiny walk was not a two-cell polyline.");
      } else {
        const p = parseId(walkedTiny[0]);
        const q = parseId(walkedTiny[1]);
        if (Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) !== 1) fail("no-jump", "The Tiny step was not orthogonal.");
      }
      resetInput();
      seed(1);
      start("little");
      const old = state().token;
      const lit = state().stones.filter(function (s) { return s.lit; })[0];
      const walked = move(lit.id);
      if (!walked || walked[0] !== old || walked[walked.length - 1] !== lit.id) fail("no-jump", "The walk did not connect the old token to the new token.");
      const stoneSet = new Set(maze.stones);
      for (let i = 1; i < walked.length - 1; i++) {
        if (stoneSet.has(walked[i])) fail("no-jump", "The polyline passed another stone.");
      }
      for (let i = 1; i < walked.length; i++) {
        const p = parseId(walked[i - 1]);
        const q = parseId(walked[i]);
        if (Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) !== 1) fail("no-jump", "A step was not an orthogonal edge.");
        if (maze.edges.indexOf(edgeKey(walked[i - 1], walked[i], maze.cols)) < 0) fail("no-jump", "A step was missing from the edges.");
      }
      resetInput();
      seed(1);
      start("shop");
      if (maze.solution.length > 2) {
        const before = state().token;
        const far = maze.solution[2];
        if (mazeLit(maze, before).indexOf(far) >= 0) fail("no-jump", "The second solution stone was already the first lit stone.");
        if (move(far) !== null || state().token !== before) fail("no-jump", "A jump to a later solution stone moved the token.");
      }
      if (state().moves !== 0) fail("no-jump", "A rejected move incremented moves.");
    });
    run("family-plain-state", function () {
      const before = JSON.stringify(state());
      start("nope");
      go("sideways");
      if (JSON.stringify(state()) !== before) fail("family-plain-state", "An unknown band or screen changed the state.");
      const end = state();
      if (!("level" in end) || !("screen" in end) || !("banner" in end) || !("muted" in end)) {
        fail("family-plain-state", "level, screen, banner, or muted was missing.");
      }
    });
    run("engine", function () {
      const engine = engineSelfCheck();
      for (let i = 0; i < engine.failures.length; i++) failures.push(engine.failures[i]);
    });
    try {
      assertJunk("at the end");
    } catch (err) {
      fail("family-query-inert", err && err.message ? err.message : "The junk check threw.");
    }
    try {
      if (writes !== 0) fail("family-no-storage", "The page called setItem or removeItem.");
      if (storeLen !== null && localStorage.length !== storeLen) fail("family-no-storage", "localStorage gained a key.");
      if (storeLen !== null && localStorage.getItem("pop-pals-v1") !== pop) fail("family-no-storage", "pop-pals-v1 changed.");
    } catch (err) {
      fail("family-no-storage", "Storage could not be read.");
    }
    try {
      if (origSet) localStorage.setItem = origSet;
      if (origRem) localStorage.removeItem = origRem;
      if (origSpeak && window.speechSynthesis) window.speechSynthesis.speak = origSpeak;
    } catch (err) {}
    return { ok: failures.length === 0, failures: failures };
  }

  window.maze = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    move: move,
    selfCheck: selfCheck
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let result;
    try { result = selfCheck(); }
    catch (err) {
      result = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] };
    }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("rush")) start("rush");
    else if (params.has("play")) start("tiny");
    connectGaze();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
