<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>Echo Garden</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; touch-action: none; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 1; pointer-events: none;
    background: var(--card); border-radius: 999px; padding: 4px 8px;
    font-weight: 800; font-size: 16px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #banner {
    position: fixed; z-index: 4; pointer-events: none; margin: 0;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 2px 10px; font-size: 16px; font-weight: 800;
    text-align: center; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #menu-card, #rest-card {
    position: fixed; z-index: 2; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #screen-menu, #screen-rest, #play, #menu-copy, #rest-line, h1, p, b, small {
    pointer-events: none;
  }
  #menu-copy, #rest-line {
    position: fixed; z-index: 4; margin: 0; text-align: center; overflow: hidden;
  }
  #menu-copy h1 { margin: 0; font-size: 26px; line-height: 28px; }
  #menu-copy p { margin: 0; font-size: 14px; line-height: 16px; }
  #rest-line { font-size: 28px; font-weight: 800; }
  #mute, #full, #back, #lets-go, #tiny, #little, #shop, #rush, #another,
  #start-over, #done, #play button {
    position: fixed; z-index: 30; pointer-events: auto;
  }
  #mute, #full, #back, #start-over, #done {
    z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1; font-size: 14px; line-height: 1.05;
    padding: 4px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; display: block; }
  #done {
    background: var(--sun);
    box-shadow: 0 4px 0 var(--sun-d);
  }
  #tiny, #little, #shop, #rush {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; color: var(--ink); text-align: left;
    padding: 4px 10px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  #tiny b, #little b, #shop b, #rush b { display: block; font-size: 18px; line-height: 20px; }
  #tiny small, #little small, #shop small, #rush small {
    display: block; font-size: 12px; line-height: 14px; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go, #another {
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink); font-weight: 800;
    box-shadow: 0 5px 0 var(--sun-d); font-size: 26px;
  }
  #play button.bloom, #play button.song, #play button.sprout {
    border: 3px solid var(--ink); border-radius: 22px;
    background: #fffdf6; padding: 2px; overflow: hidden;
    display: block;
  }
  #play button svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  #play button.glow { box-shadow: 0 0 0 5px #fff6df, 0 0 0 9px #e2a62e; }
  #play button.sway { animation: sway 0.6s ease; transform-origin: 50% 80%; }
  .slot {
    position: fixed; z-index: 3; pointer-events: none;
    border-radius: 18px; background: #efe2b8; border: 3px solid #e2d0b4;
  }
  #tune {
    position: fixed; z-index: 4; pointer-events: none;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  #tune span {
    border-radius: 50%; border: 3px solid var(--ink); background: transparent;
    display: grid; place-items: center; overflow: hidden;
  }
  #tune span svg { width: 70%; height: 70%; display: block; }
  @keyframes sway {
    0% { transform: rotate(0deg); }
    30% { transform: rotate(-7deg); }
    60% { transform: rotate(6deg); }
    100% { transform: rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    #play button.sway { animation: none; }
  }
</style>
</head>
<body>
<button id="mute" type="button" aria-label="Mute sound">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8l6 8"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner">Pick who is playing.</p>
<section id="screen-menu">
  <div id="menu-card"></div>
  <div id="menu-copy">
    <h1>Echo Garden</h1>
    <p>Look at the flowers. A tune grows a new flower.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>Hum</b><small>Ages 2 to 3. Three flowers, two-note songs.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Sing</b><small>Ages 4 to 5. Five flowers.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Chorus</b><small>Ages 6 to 8. Five flowers, longer songs.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Choir</b><small>Ages 9 and up. Eight flowers.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden>
  <button id="start-over" type="button">Start over</button>
  <button id="done" type="button">Done</button>
  <button id="sprout" type="button" class="sprout" data-play="true" hidden aria-label="New flower"></button>
  <div id="tune"></div>
</div>
<section id="screen-rest" hidden>
  <div id="rest-card"></div>
  <p id="rest-line">Your garden is singing.</p>
  <button id="another" type="button">Another</button>
</section>
<script>
(function () {
  "use strict";
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const WAIT_MS = 600;
  const NOTE_MS = 400;
  const GROW_MS = 800;
  const STORE = "echo-garden-v1";
  const SVG_NS = "http://www.w3.org/2000/svg";
  const BAND_IDS = ["tiny", "little", "shop", "rush"];
  const NOTES = [
    { id: "c", freq: 262, color: "#E69F00", symbol: "circle" },
    { id: "d", freq: 294, color: "#F0E442", symbol: "square" },
    { id: "e", freq: 330, color: "#009E73", symbol: "triangle" },
    { id: "g", freq: 392, color: "#56B4E9", symbol: "diamond" },
    { id: "a", freq: 440, color: "#0072B2", symbol: "star" },
    { id: "c2", freq: 523, color: "#CC79A7", symbol: "heart" },
    { id: "d2", freq: 587, color: "#D55E00", symbol: "moon" },
    { id: "e2", freq: 659, color: "#8C5A2B", symbol: "cross" }
  ];
  const BANDS = {
    tiny: { flowers: ["c", "e", "g"], tune: 2 },
    little: { flowers: ["c", "d", "e", "g", "a"], tune: 3 },
    shop: { flowers: ["c", "d", "e", "g", "a"], tune: 4 },
    rush: { flowers: ["c", "d", "e", "g", "a", "c2", "d2", "e2"], tune: 4 }
  };
  const SYMBOL_LABEL = {
    circle: "Circle", square: "Square", triangle: "Triangle", diamond: "Diamond",
    star: "Star", heart: "Heart", moon: "Moon", cross: "Cross"
  };

  const muteBtn = document.getElementById("mute");
  const fullBtn = document.getElementById("full");
  const backBtn = document.getElementById("back");
  const eyesEl = document.getElementById("eyes");
  const gazeEl = document.getElementById("gaze");
  const bannerEl = document.getElementById("banner");
  const menuEl = document.getElementById("screen-menu");
  const menuCard = document.getElementById("menu-card");
  const menuCopy = document.getElementById("menu-copy");
  const playEl = document.getElementById("play");
  const restEl = document.getElementById("screen-rest");
  const restCard = document.getElementById("rest-card");
  const restLine = document.getElementById("rest-line");
  const anotherBtn = document.getElementById("another");
  const startOverBtn = document.getElementById("start-over");
  const doneBtn = document.getElementById("done");
  const sproutBtn = document.getElementById("sprout");
  const tuneEl = document.getElementById("tune");
  const soundOn = document.getElementById("sound-on");
  const soundOff = document.getElementById("sound-off");

  let level = "tiny";
  let screen = "menu";
  let muted = false;
  let songs = [];
  let tune = [];
  let phase = "idle";
  let pendingSong = null;
  let echoNotes = [];
  let echoAt = 0;
  let echoPlayed = 0;
  let glowNote = null;
  let swayNote = null;
  let swayAt = 0;
  let bannerMode = "sing";
  let lastSung = null;
  let bedKey = "";
  let sproutKey = "";
  let pin = null;
  let checking = false;
  let suppressReconnect = false;
  let clock = 0;
  let ac = null;
  let master = null;
  let pointerDown = false;
  let armedId = null;
  let gazeSock = null;
  let gazeTimer = 0;
  let gazeBuf = new Uint8Array(0);
  let gazeWarp = null;
  let gazeHold = null;
  let refreshHold = false;
  let haveSmooth = false;
  let smoothed = null;
  let gazePoint = null;
  let gazeAt = 0;
  let dwellKey = null;
  let dwellStart = 0;
  let dwellFired = false;
  let dwellProgress = 0;
  let dwellMs = PLAY_DWELL_MS;
  let dwellOffAt = 0;
  let trailOn = false;

  function noteById(id) {
    for (let i = 0; i < NOTES.length; i++) if (NOTES[i].id === id) return NOTES[i];
    return null;
  }
  function noteIndex(id) {
    for (let i = 0; i < NOTES.length; i++) if (NOTES[i].id === id) return i;
    return -1;
  }
  function knownBand(band) { return BAND_IDS.indexOf(band) >= 0; }
  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }
  function petalShape(notes) {
    const a = noteIndex(notes[0]);
    const b = noteIndex(notes[notes.length - 1]);
    if (b > a) return "pointed";
    if (b < a) return "round";
    return "heart";
  }
  function stemRatio(notes) {
    let sum = 0;
    for (let i = 0; i < notes.length; i++) sum += noteIndex(notes[i]);
    return 0.45 + 0.4 * ((sum / notes.length) / 7);
  }
  function bannerText() {
    if (screen === "menu") return "Pick who is playing.";
    if (screen === "rest") return "Your garden is singing.";
    if (bannerMode === "fresh") return "A new flower!";
    return "Look at the flowers to sing.";
  }

  function loadGarden() {
    songs = [];
    let raw = null;
    try { raw = localStorage.getItem(STORE); }
    catch (err) { return; }
    if (raw === null || raw === undefined || raw === "") return;
    let data = null;
    try { data = JSON.parse(raw); }
    catch (err) { return; }
    if (!data || typeof data !== "object" || data.version !== 1 || !Array.isArray(data.songs)) return;
    const next = [];
    for (let i = 0; i < data.songs.length; i++) {
      const song = data.songs[i];
      if (!song || typeof song !== "object" || !Array.isArray(song.notes) || song.notes.length < 1) {
        songs = [];
        return;
      }
      const notes = [];
      for (let n = 0; n < song.notes.length; n++) {
        if (!noteById(song.notes[n])) {
          songs = [];
          return;
        }
        notes.push(song.notes[n]);
      }
      next.push({ notes: notes });
    }
    songs = next.slice(-24);
  }
  function saveGarden() {
    if (songs.length > 24) songs = songs.slice(songs.length - 24);
    const payload = {
      version: 1,
      songs: songs.map(function (song) { return { notes: song.notes.slice() }; })
    };
    try { localStorage.setItem(STORE, JSON.stringify(payload)); }
    catch (err) {}
  }

  function ensureAudio() {
    if (checking || ac) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    try {
      ac = new Ctx();
      master = ac.createGain();
      master.gain.value = muted ? 0 : 0.5;
      master.connect(ac.destination);
      if (ac.resume) ac.resume();
    } catch (err) {
      ac = null;
      master = null;
    }
  }
  function playTone(note) {
    lastSung = note.id;
    if (checking || !ac || !master || !note) return;
    try {
      const t0 = ac.currentTime;
      const sine = ac.createOscillator();
      const tri = ac.createOscillator();
      const g1 = ac.createGain();
      const g2 = ac.createGain();
      sine.type = "sine";
      tri.type = "triangle";
      sine.frequency.value = note.freq;
      tri.frequency.value = note.freq * 2;
      sine.connect(g1);
      tri.connect(g2);
      g1.connect(master);
      g2.connect(master);
      g1.gain.setValueAtTime(0.0001, t0);
      g1.gain.linearRampToValueAtTime(0.22, t0 + 0.01);
      g1.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.71);
      g2.gain.setValueAtTime(0.0001, t0);
      g2.gain.linearRampToValueAtTime(0.06, t0 + 0.01);
      g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.71);
      sine.start(t0);
      tri.start(t0);
      sine.stop(t0 + 0.72);
      tri.stop(t0 + 0.72);
    } catch (err) {}
  }
  function playBloom() {
    if (checking || !ac || !master) return;
    try {
      const t0 = ac.currentTime;
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(400, t0);
      osc.frequency.linearRampToValueAtTime(800, t0 + 0.3);
      osc.connect(g);
      g.connect(master);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.16, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      osc.start(t0);
      osc.stop(t0 + 0.31);
    } catch (err) {}
  }
  function toggleMute() {
    muted = !muted;
    muteBtn.setAttribute("aria-label", muted ? "Turn sound on" : "Mute sound");
    if (master) master.gain.value = muted ? 0 : 0.5;
    render();
  }
  function toggleFull() {
    const root = document.documentElement;
    try {
      if (document.fullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen();
      } else if (root.requestFullscreen) {
        const pending = root.requestFullscreen();
        if (pending && pending.catch) pending.catch(function () {});
      }
    } catch (err) {}
    render();
  }

  function svgEl(name, attrs) {
    const node = document.createElementNS(SVG_NS, name);
    if (attrs) {
      for (const key in attrs) node.setAttribute(key, attrs[key]);
    }
    return node;
  }
  function starPoints() {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 === 0 ? 40 : 16;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      pts.push((50 + Math.cos(a) * rad).toFixed(1) + "," + (50 + Math.sin(a) * rad).toFixed(1));
    }
    return pts.join(" ");
  }
  function symbolNode(kind) {
    const ink = "#2c2416";
    if (kind === "circle") return svgEl("circle", { cx: "50", cy: "50", r: "28", fill: ink });
    if (kind === "square") return svgEl("rect", { x: "22", y: "22", width: "56", height: "56", rx: "8", fill: ink });
    if (kind === "triangle") return svgEl("polygon", { points: "50,14 88,82 12,82", fill: ink });
    if (kind === "diamond") return svgEl("polygon", { points: "50,10 90,50 50,90 10,50", fill: ink });
    if (kind === "star") return svgEl("polygon", { points: starPoints(), fill: ink });
    if (kind === "heart") {
      return svgEl("path", { d: "M50 84 C22 62 14 44 28 30 C38 22 48 26 50 36 C52 26 62 22 72 30 C86 44 78 62 50 84 Z", fill: ink });
    }
    if (kind === "moon") {
      return svgEl("path", { d: "M64 16 A34 34 0 1 0 64 84 A24 24 0 1 1 64 16 Z", fill: ink });
    }
    return svgEl("path", { d: "M38 12 H62 V38 H88 V62 H62 V88 H38 V62 H12 V38 H38 Z", fill: ink });
  }
  function singingSvg(note) {
    const svg = svgEl("svg", { viewBox: "0 0 100 100", "aria-hidden": "true" });
    for (let i = 0; i < 5; i++) {
      svg.appendChild(svgEl("ellipse", {
        cx: "50", cy: "16", rx: "14", ry: "20", fill: note.color, class: "petal",
        transform: "rotate(" + (-90 + i * 72) + " 50 50)"
      }));
    }
    svg.appendChild(svgEl("circle", { cx: "50", cy: "50", r: "18", fill: "#fffdf6" }));
    const g = svgEl("g", { transform: "translate(50 50) scale(0.34) translate(-50 -50)" });
    g.appendChild(symbolNode(note.symbol));
    svg.appendChild(g);
    return svg;
  }
  function addLeaf(svg, x, y, dir, color) {
    const cx = x + dir * 18;
    svg.appendChild(svgEl("ellipse", {
      class: "leaf", cx: String(cx), cy: String(y), rx: "14", ry: "7", fill: color,
      transform: "rotate(" + (dir * -32) + " " + cx + " " + y + ")"
    }));
  }
  function addSongPetal(svg, shape, i, count, cx, cy, color) {
    const ang = -90 + (i * 360) / count;
    const spin = "translate(" + cx + " " + cy + ") rotate(" + ang + ")";
    if (shape === "pointed") {
      svg.appendChild(svgEl("polygon", {
        class: "petal", points: "0,-34 -13,10 13,10", fill: color, transform: spin
      }));
    } else if (shape === "round") {
      svg.appendChild(svgEl("ellipse", {
        class: "petal", cx: "0", cy: "-20", rx: "13", ry: "18", fill: color, transform: spin
      }));
    } else {
      svg.appendChild(svgEl("path", {
        class: "petal", fill: color,
        d: "M0 6 C-8 -2 -16 -4 -14 -14 C-12 -22 -4 -20 0 -12 C4 -20 12 -22 14 -14 C16 -4 8 -2 0 6 Z",
        transform: spin + " translate(0 -18)"
      }));
    }
  }
  function songSvg(notes) {
    const shape = petalShape(notes);
    const count = notes.length * 2;
    const ratio = stemRatio(notes);
    const svg = svgEl("svg", { viewBox: "0 0 100 160", "aria-hidden": "true" });
    const base = 152;
    const head = base - ratio * 136;
    svg.appendChild(svgEl("line", {
      class: "stem", x1: "50", y1: String(base), x2: "50", y2: String(head + 6),
      stroke: "#3d7a4a", "stroke-width": "6", "stroke-linecap": "round"
    }));
    const mid = Math.floor(notes.length / 2);
    const leafY = head + (base - head) * 0.42;
    addLeaf(svg, 50, leafY, -1, noteById(notes[0]).color);
    addLeaf(svg, 50, leafY + 12, 1, noteById(notes[mid]).color);
    for (let i = 0; i < count; i++) {
      addSongPetal(svg, shape, i, count, 50, head, noteById(notes[i % notes.length]).color);
    }
    svg.appendChild(svgEl("circle", {
      class: "face", cx: "50", cy: String(head), r: "16", fill: "#ffc857", stroke: "#e2a62e", "stroke-width": "2"
    }));
    const g = svgEl("g", { transform: "translate(50 " + head + ") scale(0.28) translate(-50 -50)" });
    g.appendChild(symbolNode(noteById(notes[0]).symbol));
    svg.appendChild(g);
    return svg;
  }

  function intersects(a, b) {
    if (!a || !b) return false;
    return a.x < b.x + b.w - 0.5 && b.x < a.x + a.w - 0.5 && a.y < b.y + b.h - 0.5 && b.y < a.y + a.h - 0.5;
  }
  function inside(box, w, h) {
    return box.x >= -0.5 && box.y >= -0.5 && box.x + box.w <= w + 0.5 && box.y + box.h <= h + 0.5;
  }
  function eyesBox(w) {
    return { id: "eyes", x: w - 8 - 78, y: 84, w: 78, h: 34 };
  }
  function bannerBox(w) {
    const eye = eyesBox(w);
    return { x: 8, y: eye.y, w: Math.max(72, eye.x - 16), h: eye.h };
  }
  function chromeBoxes(w) {
    const y = 8;
    const bh = 72;
    const edge = 8;
    const narrow = w < 760;
    const gapMF = narrow ? 4 : 8;
    const full = { id: "full", x: w - edge - 72, y: y, w: 72, h: bh };
    const mute = { id: "mute", x: full.x - gapMF - 72, y: y, w: 72, h: bh };
    const right = mute.x - (narrow ? 4 : 8);
    const left = edge;
    if (screen !== "play") {
      const backW = Math.max(72, Math.min(200, right - left));
      return {

        step(21300);
        if (state().screen !== "play") fail("family-menu-dwell", "1300 ms on Let's go did not open the garden.");
      }
      const back = targetById(centers().targets, "back");
      if (!back) fail("family-menu-dwell", "Back to Menu was not a target.");
      else {
        enterLook(back, 24000);
        step(24600);
        if (state().screen !== "play") fail("family-menu-dwell", "600 ms on Back left the garden.");
        step(25300);
        if (state().screen !== "menu") fail("family-menu-dwell", "1300 ms on Back did not return to the menu.");
      }
    });
    run("family-pointer-blocks", function () {
      resetInput();
      start("tiny");
      step(30000);
      const box = targetById(centers().targets, "flower-e");
      hold(box.nx, box.ny);
      look(box.nx, box.ny);
      step(30000);
      step(30660);
      if (state().tune.length !== 0 || dwell() !== 0) fail("family-pointer-blocks", "A look during hold played or filled the ring.");
      release();
      releaseLook();
      enterLook(box, 32000);
      step(32660);
      if (state().tune.join(",") !== "e") fail("family-pointer-blocks", "A fresh look after release did not play.");
    });
    run("family-stale", function () {
      resetInput();
      start("tiny");
      step(36000);
      const box = targetById(centers().targets, "flower-g");
      try {
        enterLook(box, 36000);
        step(36200);
        if (!(dwell() > 0) || state().tune.length !== 0) fail("family-stale", "The ring did not fill before the sample went stale.");
        refreshHold = false;
        step(36700);
        if (dwell() !== 0) fail("family-stale", "A sample 500 ms old still filled the ring.");
        if (state().tune.length !== 0) fail("family-stale", "A stale sample played a flower.");
      } finally {
        refreshHold = true;
      }
    });
    run("family-target-size", function () {
      resetInput();
      go("menu");
      function checkView(where) {
        const views = [[390, 844], [1024, 768]];
        for (let v = 0; v < views.length; v++) {
          const lay = targetsAt(views[v][0], views[v][1]);
          if (!lay.ok) fail("family-target-size", where + " at " + views[v][0] + " by " + views[v][1] + " was not ok.");
          const list = lay.targets || [];
          for (let i = 0; i < list.length; i++) {
            if (Math.min(list[i].w, list[i].h) < 72) fail("family-target-size", where + " target " + list[i].id + " was under 72.");
          }
        }
        const small = targetsAt(300, 600);
        if (small.ok || (small.targets && small.targets.length)) fail("family-target-size", "A 300 px width was treated as ok.");
      }
      const before = muteBtn.getBoundingClientRect();
      const beforeShort = Math.min(before.width, before.height);
      checkView("menu");
      const after = muteBtn.getBoundingClientRect();
      if (Math.min(after.width, after.height) + 1 < beforeShort) fail("family-target-size", "targetsAt shrank a live button.");
      if (targetById(centers().targets, "back")) fail("family-target-size", "Back was listed on the menu.");
      start("tiny");
      const liveBefore = targetById(centers().targets, "mute");
      checkView("play");
      const liveAfter = targetById(centers().targets, "mute");
      if (liveBefore && liveAfter && Math.min(liveAfter.w, liveAfter.h) + 1 < Math.min(liveBefore.w, liveBefore.h)) {
        fail("family-target-size", "targetsAt shrank a live play button.");
      }
    });
    run("family-eyes", function () {
      resetInput();
      step(40000);
      look(0.5, 0.12);
      step(40020);
      const eye = eyes();
      const keys = Object.keys(eye);
      if (keys.length !== 2 || keys.indexOf("on") < 0 || keys.indexOf("live") < 0) fail("family-eyes", "eyes() did not return only on and live.");
      if (typeof eye.on !== "boolean" || typeof eye.live !== "boolean") fail("family-eyes", "on or live was not a boolean.");
      if (eye.on !== true || eye.live !== true) fail("family-eyes", "A fresh look did not set on and live.");
      if (gazeSock) fail("family-eyes", "The socket was open.");
      if (eyesEl.hidden || eyesEl.textContent !== "Eyes") fail("family-eyes", "The Eyes chip was hidden or mislabeled.");
      const ez = parseInt(window.getComputedStyle(eyesEl).zIndex, 10) || 0;
      const cz = parseInt(window.getComputedStyle(menuCard).zIndex, 10) || 0;
      const bz = parseInt(window.getComputedStyle(document.getElementById("lets-go")).zIndex, 10) || 0;
      if (ez >= cz || ez >= bz) fail("family-eyes", "The Eyes chip sat above a card or a button.");
      releaseLook();
      if (!eyesEl.hidden) fail("family-eyes", "The Eyes chip stayed up after release.");
    });
    run("family-mute", function () {
      resetInput();
      go("menu");
      const muteText = (muteBtn.innerText || "").replace(/\s+/g, "");
      if (muteText !== "") fail("family-mute", "The mute button had visible text.");
      if ((muteBtn.innerText || "").indexOf("Mute") >= 0 || (muteBtn.innerText || "").indexOf("Sound") >= 0) {
        fail("family-mute", "Mute or Sound was visible.");
      }
      if (muteBtn.querySelectorAll("svg").length !== 2) fail("family-mute", "The mute button did not hold two speaker icons.");
      if (state().muted !== false) fail("family-mute", "Sound did not start on.");
      const box = targetById(centers().targets, "mute");
      tap(box.nx, box.ny);
      if (state().muted !== true) fail("family-mute", "The first tap did not mute.");
      tap(box.nx, box.ny);
      if (state().muted !== false) fail("family-mute", "The second tap did not turn sound on.");
    });
    run("sing", function () {
      resetInput();
      start("tiny");
      step(80000);
      const box = targetById(centers().targets, "flower-c");
      enterLook(box, 80000);
      step(80640);
      if (state().tune.length !== 0 || state().sung === "c") fail("sing", "640 ms played a note.");
      releaseLook();
      enterLook(box, 81000);
      step(81660);
      if (state().sung !== "c" || state().tune.join(",") !== "c") fail("sing", "660 ms did not play the note or fill a seed.");
      const dot = tuneEl.children[0];
      if (!dot || dot.hidden || dot.getAttribute("data-symbol") !== "circle") fail("sing", "The seed did not take the note symbol.");
    });
    run("tune-grows-flower", function () {
      resetInput();
      songs = [];
      bedKey = "";
      start("little");
      step(90000);
      const before = state().songs.length;
      press("flower-c");
      press("flower-d");
      press("flower-e");
      if (state().tune.join(",") !== "c,d,e" || state().phase !== "wait") fail("tune-grows-flower", "Three notes did not fill the tune.");
      const t0 = clock;
      step(t0 + 100);
      if (state().phase !== "wait" || state().songs.length !== before) fail("tune-grows-flower", "The garden answered before 600 ms.");
      step(t0 + WAIT_MS + 50);
      if (state().phase !== "echo" || state().echoed < 1 || state().sung !== "c") fail("tune-grows-flower", "Playback did not start with the first note.");
      step(t0 + WAIT_MS + NOTE_MS + 50);
      if (state().echoed < 2 || state().sung !== "d") fail("tune-grows-flower", "The second note did not play back.");
      step(t0 + WAIT_MS + NOTE_MS * 2 + 50);
      if (state().echoed < 3 || state().sung !== "e" || state().songs.length !== before) fail("tune-grows-flower", "The third note did not play back.");
      step(t0 + WAIT_MS + NOTE_MS * 3 + GROW_MS);
      const after = state();
      if (after.songs.length !== before + 1) fail("tune-grows-flower", "The garden did not grow one song flower.");
      if (after.tune.length !== 0) fail("tune-grows-flower", "The tune row did not clear.");
      if (after.songs[after.songs.length - 1].notes.join(",") !== "c,d,e") fail("tune-grows-flower", "The new flower was not that tune.");
      if (after.banner !== "A new flower!") fail("tune-grows-flower", "The banner did not welcome the flower.");
    });
    run("no-input-during-playback", function () {
      resetInput();
      songs = [];
      bedKey = "";
      start("little");
      step(120000);
      press("flower-c");
      press("flower-g");
      press("flower-a");
      const t0 = clock;
      step(t0 + WAIT_MS + 100);
      if (state().phase !== "echo") fail("no-input-during-playback", "The tune was not playing back.");
      const songsBefore = state().songs.length;
      press("flower-d");
      press("start-over");
      press("done");
      const flower = targetById(centers().targets, "flower-e");
      enterLook(flower, clock);
      step(clock + 660);
      const mid = state();
      if (mid.screen !== "play" || mid.tune.join(",") !== "c,g,a" || mid.songs.length !== songsBefore) {
        fail("no-input-during-playback", "A look or a tap changed the garden during playback.");
      }
      releaseLook();
      step(t0 + WAIT_MS + 3 * NOTE_MS + GROW_MS);
      if (state().songs.length !== songsBefore + 1) fail("no-input-during-playback", "The tune did not finish into one flower.");
    });
    run("shape-rules", function () {
      resetInput();
      songs = [];
      bedKey = "";
      function grow(band, notes) {
        start(band);
        step(clock + 50);
        for (let i = 0; i < notes.length; i++) press("flower-" + notes[i]);
        finishTune(notes.length);
      }
      grow("little", ["c", "d", "e"]);
      grow("little", ["e", "d", "c"]);
      grow("little", ["d", "d", "d"]);
      grow("tiny", ["c", "e"]);
      grow("shop", ["c", "d", "e", "g"]);
      const made = [
        ["c", "d", "e"],
        ["e", "d", "c"],
        ["d", "d", "d"],
        ["c", "e"],
        ["c", "d", "e", "g"]
      ];
      start("rush");
      if (state().songs.length !== made.length) fail("shape-rules", "The garden did not keep each tune.");
      for (let i = 0; i < made.length; i++) {
        const btn = document.getElementById("bed-" + i);
        const expect = shapeName(made[i]);
        const petals = made[i].length * 2;
        if (!btn) { fail("shape-rules", "A song flower was missing."); continue; }
        if (btn.getAttribute("data-shape") !== expect) fail("shape-rules", "Tune " + i + " was not " + expect + ".");
        if (btn.getAttribute("data-petals") !== String(petals)) fail("shape-rules", "Tune " + i + " petal count was off.");
        if (btn.querySelectorAll(".petal").length !== petals) fail("shape-rules", "Tune " + i + " did not draw that many petals.");
        const stem = parseFloat(btn.getAttribute("data-stem"));
        if (Math.abs(stem - stemExpect(made[i])) > 0.0001) fail("shape-rules", "Tune " + i + " stem height was off.");
        if (btn.querySelectorAll(".leaf").length !== 2) fail("shape-rules", "Tune " + i + " did not draw two leaves.");
      }
      if (shapeName(["c", "d", "e"]) !== "pointed" || shapeName(["e", "d", "c"]) !== "round" || shapeName(["d", "d", "d"]) !== "heart") {
        fail("shape-rules", "Rising, falling, and level tunes did not pick pointed, round, and heart.");
      }
    });
    run("song-replay", function () {
      resetInput();
      songs = [];
      bedKey = "";
      start("little");
      step(160000);
      press("flower-c");
      press("flower-e");
      press("flower-g");
      finishTune(3);
      if (state().songs.length !== 1 || state().tune.length !== 0) fail("song-replay", "The song flower was not ready.");
      const bed = targetById(centers().targets, "bed-0");
      if (!bed || !bed.play) fail("song-replay", "The song flower was not a play target.");
      else {
        enterLook(bed, clock + 20);
        step(clock + 640);
        if (state().phase !== "idle" || state().songs.length !== 1 || state().tune.length !== 0) {
          fail("song-replay", "640 ms started a replay.");
        }
        releaseLook();
        const again = targetById(centers().targets, "bed-0");
        enterLook(again, clock + 20);
        step(clock + 660);
        if (state().phase !== "wait" || state().songs.length !== 1) fail("song-replay", "660 ms did not replay the song.");
        const t0 = clock;
        step(t0 + WAIT_MS + 50);
        if (state().phase !== "replay" || state().sung !== "c" || state().songs.length !== 1) fail("song-replay", "The replay did not sing the first note.");
        step(t0 + WAIT_MS + 3 * NOTE_MS + 20);
        const end = state();
        if (end.songs.length !== 1 || end.tune.length !== 0 || end.phase !== "idle") fail("song-replay", "The replay added a flower or left the tune row filled.");
      }
    });
    run("storage-roundtrip", function () {
      resetInput();
      songs = [];
      bedKey = "";
      saveGarden();
      start("little");
      step(180000);
      press("flower-c");
      press("flower-d");
      press("flower-e");
      finishTune(3);
      start("tiny");
      step(clock + 30);
      press("flower-g");
      press("flower-c");
      finishTune(2);
      let data = null;
      try { data = JSON.parse(localStorage.getItem(STORE)); }
      catch (err) { data = null; }
      if (!data || data.version !== 1 || !data.songs || data.songs.length !== 2) fail("storage-roundtrip", "Storage did not hold two songs.");
      else if (data.songs[0].notes.join(",") !== "c,d,e" || data.songs[1].notes.join(",") !== "g,c") {
        fail("storage-roundtrip", "The stored songs were not the tunes just grown.");
      }
      songs = [];
      loadGarden();
      if (songs.length !== 2 || songs[0].notes.join(",") !== "c,d,e" || songs[1].notes.join(",") !== "g,c") {
        fail("storage-roundtrip", "A fresh read did not bring the garden back.");
      }
      try { localStorage.setItem(STORE, "{"); }
      catch (err) { fail("storage-roundtrip", "Storage could not take a broken value."); }
      loadGarden();
      if (songs.length !== 0) fail("storage-roundtrip", "A broken value did not start an empty garden.");
      try { localStorage.setItem(STORE, JSON.stringify({ version: 2, songs: [{ notes: ["c"] }] })); }
      catch (err) {}
      loadGarden();
      if (songs.length !== 0) fail("storage-roundtrip", "A different version did not start an empty garden.");
      try { localStorage.setItem(STORE, JSON.stringify({ version: 1, songs: [{ notes: ["zz"] }] })); }
      catch (err) {}
      loadGarden();
      if (songs.length !== 0) fail("storage-roundtrip", "A song outside the scale did not start an empty garden.");
    });
    run("storage-cap", function () {
      resetInput();
      songs = [];
      bedKey = "";
      saveGarden();
      const ids = BANDS.little.flowers;
      function tuneAt(i) {
        return [ids[i % 5], ids[Math.floor(i / 5) % 5], ids[Math.floor(i / 25) % 5]];
      }
      start("little");
      step(200000);
      for (let i = 0; i < 25; i++) {
        const notes = tuneAt(i);
        if (state().screen !== "play" || state().phase !== "idle") start("little");
        for (let n = 0; n < notes.length; n++) press("flower-" + notes[n]);
        finishTune(notes.length);
      }
      if (songs.length !== 24) fail("storage-cap", "The garden did not keep 24 songs.");
      if (songs[0].notes.join(",") !== tuneAt(1).join(",")) fail("storage-cap", "The oldest song was still kept.");
      if (songs[23].notes.join(",") !== tuneAt(24).join(",")) fail("storage-cap", "The newest song was dropped.");
      let data = null;
      try { data = JSON.parse(localStorage.getItem(STORE)); }
      catch (err) { data = null; }
      if (!data || data.songs.length !== 24) fail("storage-cap", "Storage did not keep 24 songs.");
    });
    run("sizes", function () {
      resetInput();
      const views = [[390, 700], [1024, 768]];
      const bands = ["tiny", "little", "shop", "rush"];
      for (let b = 0; b < bands.length; b++) {
        start(bands[b]);
        for (let v = 0; v < views.length; v++) {
          const w = views[v][0];
          const h = views[v][1];
          const lay = computeLayout(w, h);
          if (!lay.ok) fail("sizes", bands[b] + " at " + w + " by " + h + " " + (lay.reason || "was not ok") + ".");
          else {
            const list = lay.targets;
            for (let i = 0; i < list.length; i++) {
              if (Math.min(list[i].w, list[i].h) < 72) fail("sizes", list[i].id + " was under 72.");
            }
            for (let i = 0; i < lay.slots.length; i++) {
              if (Math.min(lay.slots[i].w, lay.slots[i].h) < 72) fail("sizes", "A bed slot was under 72.");
              if (lay.slots[i].x < 16 || lay.slots[i].y + lay.slots[i].h > h) fail("sizes", "A bed slot was off the glass.");
            }
            for (let i = 0; i < lay.flowers.length; i++) {
              if (Math.min(lay.flowers[i].w, lay.flowers[i].h) < 72) fail("sizes", "A singing flower was under 72.");
              if (lay.flowers[i].x < 16) fail("sizes", "A singing flower sat inside the edge.");
            }
            if (w === 390) {
              if (lay.slotW !== 83 || lay.slotH !== 90) fail("sizes", "The phone bed was not 83 by 90.");
              const count = BANDS[bands[b]].flowers.length;
              const fw = count <= 5 ? 114 : 83;
              const fh = count <= 3 ? 140 : (count <= 5 ? 110 : 100);
              for (let i = 0; i < lay.flowers.length; i++) {
                if (lay.flowers[i].w !== fw || lay.flowers[i].h !== fh) fail("sizes", "A phone flower was not the named size.");
              }
            }
            if (w === 1024) {
              if (lay.slotW !== 140 || lay.slotH !== 150) fail("sizes", "The wide bed was not about 140 by 150.");
              for (let i = 0; i < lay.flowers.length; i++) {
                if (lay.flowers[i].h !== 110 || lay.flowers[i].w < 72) fail("sizes", "A wide flower was not about 110 px.");
              }
            }
            const eye = lay.eyes;
            const ez = parseInt(window.getComputedStyle(eyesEl).zIndex, 10) || 0;
            if (ez >= 2) fail("sizes", "Eyes painted over a card.");
            for (let i = 0; i < list.length; i++) if (intersects(list[i], eye)) fail("sizes", "Eyes sat on " + list[i].id + ".");
          }
        }
      }
      const before = muteBtn.getBoundingClientRect();
      targetsAt(390, 700);
      targetsAt(1024, 768);
      const after = muteBtn.getBoundingClientRect();
      if (Math.abs(before.width - after.width) > 1 || Math.abs(before.height - after.height) > 1) {
        fail("sizes", "The size check moved a live button.");
      }
    });
    run("done-rest", function () {
      resetInput();
      start("tiny");
      step(clock + 40);
      press("done");
      const snapDone = state();
      if (snapDone.screen !== "rest" || snapDone.banner !== "Your garden is singing.") fail("done-rest", "Done did not rest the garden.");
      if ((restLine.textContent || "").indexOf("Your garden is singing.") < 0) fail("done-rest", "The rest line changed.");
      press("another");
      if (state().screen !== "play" || state().level !== "tiny") fail("done-rest", "Another did not start Hum again.");
    });
    try { assertJunk("at the end"); }
    catch (err) { fail("family-query-inert", err && err.message ? err.message : "The junk check threw."); }
    run("family-plain-state", function () {
      const before = JSON.stringify(state());
      start("nope");
      go("sideways");
      if (JSON.stringify(state()) !== before) fail("family-plain-state", "An unknown band or screen changed the state.");
    });
    if (speakCalls !== 0) fail("no-speech", "speechSynthesis.speak was called.");
    run("storage-only-own-key", function () {
      for (let i = 0; i < writes.length; i++) {
        if (writes[i] !== STORE) fail("storage-only-own-key", "Another key was written.");
      }
    });
    try {
      if (origSet) localStorage.setItem = origSet;
      if (origRem) localStorage.removeItem = origRem;
      if (origSpeak && window.speechSynthesis) window.speechSynthesis.speak = origSpeak;
    } catch (err) {}
    try {
      const seen = {};
      for (let i = 0; i < snap.length; i++) seen[snap[i][0]] = true;
      const nowKeys = [];
      for (let i = 0; i < localStorage.length; i++) nowKeys.push(localStorage.key(i));
      for (let i = 0; i < nowKeys.length; i++) {
        if (!seen[nowKeys[i]]) localStorage.removeItem(nowKeys[i]);
      }
      for (let i = 0; i < snap.length; i++) {
        if (snap[i][1] === null) localStorage.removeItem(snap[i][0]);
        else localStorage.setItem(snap[i][0], snap[i][1]);
      }
      for (let i = 0; i < snap.length; i++) {
        if (localStorage.getItem(snap[i][0]) !== snap[i][1]) fail("storage-only-own-key", "The previous value was not restored.");
      }
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!seen[key]) fail("storage-only-own-key", "An extra key remained.");
      }
    } catch (err) {
      fail("storage-only-own-key", "Storage could not be restored.");
    }
    return { ok: failures.length === 0, failures: failures };
  }

  ensureFlowers();
  loadGarden();
  window.echoGarden = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    selfCheck: selfCheck
  };
  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let result;
    try { result = selfCheck(); }
    catch (err) {
      result = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] };
    }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("rush")) start("rush");
    else if (params.has("play")) start("tiny");
    connectGaze();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
