<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f0d8">
<title>Flash Cards</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --gold: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; pointer-events: none; z-index: 0;
  }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border: none; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 47; pointer-events: none;
    top: 14px; left: 176px;
    background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 7px 12px;
    font-weight: 800; font-size: 16px;
  }
  #banner {
    position: fixed; z-index: 40; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 4px 12px; font-size: clamp(14px, 2vw, 20px); font-weight: 800;
    text-align: center; overflow: hidden; line-height: 1.15;
  }
  #mute, #full, #back {
    position: fixed; z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1;
    top: 8px; height: 72px; font-size: 16px;
  }
  #mute, #full { width: 72px; }
  #mute { left: 8px; display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; }
  #mute svg[hidden] { display: none !important; }
  #full { left: 88px; }
  #back { padding: 0 12px; }
  #screen-menu, #screen-rest {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 96px 16px 24px;
  }
  #screen-menu {
    justify-content: flex-start;
    gap: 8px;
    padding: 84px 16px 96px;
    overflow: hidden;
  }
  #lets-go {
    position: fixed; z-index: 22;
    left: 50%; bottom: 12px;
    transform: translateX(-50%);
    height: 72px; min-height: 72px;
  }
  #screen-menu h1 { margin: 0; font-size: 48px; letter-spacing: -1px; text-align: center; }
  #screen-menu p, #screen-rest p { margin: 0; font-size: 22px; font-weight: 800; text-align: center; }
  #screen-menu button, #screen-rest button, #stop, .subject-btn {
    pointer-events: auto;
    border: 3px solid transparent; border-radius: 18px;
    background: var(--card); color: var(--ink);
    font-weight: 800; font-size: 28px;
    min-height: 72px; width: min(460px, calc(100% - 32px));
    box-shadow: 0 4px 0 #e2d0b4;
  }
  #screen-menu button[aria-pressed="true"] { border-color: var(--ink); background: #fff6df; }
  #screen-menu #tiny b, #screen-menu #little b, #screen-menu #shop b, #screen-menu #rush b {
    display: block; font-size: 18px; line-height: 20px;
  }
  #screen-menu #tiny small, #screen-menu #little small, #screen-menu #shop small, #screen-menu #rush small {
    display: block; margin-top: 2px; font-size: 13px; line-height: 16px; font-weight: 700; color: #6d5a48;
  }
  #lets-go, #another, #stop {
    background: var(--sun); box-shadow: 0 5px 0 var(--gold); color: var(--ink);
  }
  #play { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
  #prompt, .choice, #stop, .subject-btn { position: fixed; pointer-events: auto; }
  #prompt, .choice {
    border-radius: 22px;
    box-shadow: 0 8px 0 #e2d0b4;
  }
  .face-picture {
    background: transparent; color: transparent; border: none;
    box-shadow: 0 8px 0 #e2d0b4; padding: 0; border-radius: 22px;
  }
  .face-print {
    background: var(--card); color: var(--ink); border: none; border-radius: 22px;
    font-weight: 800; line-height: 1;
    display: grid; place-items: center; padding: 8px;
    box-shadow: 0 8px 0 #e2d0b4;
  }
  .face-pair {
    background: transparent; color: var(--ink); border: none; border-radius: 22px;
    font-weight: 800; line-height: 1;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0 8px 10px; box-shadow: none;
  }
  #gaze[hidden], #eyes[hidden], #back[hidden], #screen-menu[hidden], #screen-rest[hidden], #play[hidden] {
    display: none !important;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/>
  </svg>
</button>
<button id="full" type="button" aria-label="Fullscreen">Full</button>
<button id="back" type="button" hidden>Back to Menu</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner">Pick who is playing.</p>
<section id="screen-menu">
  <h1>Flash Cards</h1>
  <p>Match the card on the other side.</p>
  <p>Ages 2 and up.</p>
  <button id="tiny" type="button" aria-pressed="true"><b>Peek</b><small>Ages 2 to 3. Hear a word, match the picture.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Say It</b><small>Ages 4 to 5. Three cards. A few words to read.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Read It</b><small>Ages 6 to 8. Four cards. Words and pictures.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Flip</b><small>Ages 9 and up. Four cards. Half start from the word.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden>
  <button id="prompt" type="button" hidden></button>
  <button id="choice-0" class="choice" type="button" hidden></button>
  <button id="choice-1" class="choice" type="button" hidden></button>
  <button id="choice-2" class="choice" type="button" hidden></button>
  <button id="choice-3" class="choice" type="button" hidden></button>
  <button id="stop" type="button">Stop</button>
</div>
<section id="screen-rest" hidden>
  <p>We can play again.</p>
  <button id="another" type="button">Another</button>
</section>
<script>
(function () {
  const GAZE_URL = "ws://127.0.0.1:7081";
  const PLAY_DWELL_MS = 650;
  const MENU_DWELL_MS = 1300;
  const GAZE_FRESH_MS = 500;
  const LEAVE_MS = 280;
  const SHOW_MS = 800;

  const INK = "#2c2416";
  const CREAM = "#f4f0d8";
  const PAPER = "#fffdf6";
  const BROWN = "#8a5a2b";
  const DBROWN = "#5c3a1e";
  const TAN = "#d7b07a";
  const ORANGE = "#e07a2f";
  const YELLOW = "#f2c14e";
  const RED = "#d64545";
  const PINK = "#f2a3b5";
  const BLUE = "#3a7bd5";
  const GREEN = "#3f8f4e";
  const PURPLE = "#7a4ea3";
  const GRAY = "#9aa3ad";
  const METAL = "#c5ccd6";
  const SKIN = "#f0c9a0";
  const BLACK = "#1b1b1b";

  const CEILING = { tiny: 240000, little: 480000, shop: 720000, rush: 900000 };

  const BANDS = {
    tiny: {
      subjects: [
        { id: "animals", name: "Animals", words: ["dog", "cat", "bird", "fish", "cow", "duck"] },
        { id: "food", name: "Food", words: ["milk", "apple", "banana", "bread", "cookie", "water"] },
        { id: "body", name: "Body", words: ["eye", "nose", "mouth", "hand", "foot", "tummy"] }
      ]
    },
    little: {
      subjects: [
        { id: "animals", name: "Animals", words: ["dog", "cat", "bird", "fish", "cow", "duck", "pig", "horse"] },
        { id: "food", name: "Food", words: ["milk", "apple", "banana", "bread", "cookie", "water", "egg", "carrot"] },
        { id: "body", name: "Body", words: ["eye", "nose", "mouth", "hand", "foot", "tummy", "ear", "hair"] },
        { id: "clothing", name: "Clothes", words: ["hat", "shoe", "sock", "coat", "shirt", "pants", "dress", "boot"] },
        { id: "toys", name: "Toys", words: ["ball", "doll", "block", "book", "drum", "kite", "top", "bell"] },
        { id: "vehicles", name: "Vehicles", words: ["car", "bus", "bike", "boat", "plane", "train", "truck", "wagon"] },
        { id: "colors", name: "Colors", words: ["red", "yellow", "blue", "green", "black", "white"] }
      ]
    },
    shop: {
      subjects: [
        { id: "animals", name: "Animals", words: ["dog", "cat", "cow", "horse", "sheep", "goat", "pig", "frog", "mouse", "duck"] },
        { id: "food", name: "Food", words: ["apple", "banana", "bread", "cheese", "egg", "carrot", "corn", "grape", "milk", "soup"] },
        { id: "household", name: "Household", words: ["cup", "spoon", "bowl", "plate", "fork", "pan", "pot", "key", "clock", "phone"] },
        { id: "furniture", name: "Furniture", words: ["bed", "chair", "table", "desk", "sofa", "lamp", "shelf", "rug", "door", "crib"] },
        { id: "clothing", name: "Clothes", words: ["hat", "shoe", "sock", "coat", "shirt", "pants", "dress", "boot", "glove", "scarf"] },
        { id: "vehicles", name: "Vehicles", words: ["car", "bus", "bike", "boat", "plane", "train", "truck", "wagon", "sled", "cart"] },
        { id: "outside", name: "Outside", words: ["tree", "flower", "rock", "sun", "moon", "star", "rain", "cloud", "grass", "leaf"] },
        { id: "colors", name: "Colors", words: ["red", "yellow", "blue", "green", "black", "white", "orange", "purple", "brown", "pink"] }
      ]
    },
    rush: {
      subjects: [
        { id: "kitchen", name: "Kitchen", words: ["ladle", "whisk", "grater", "kettle", "oven", "sink", "tray", "mixer", "scoop", "sieve", "mitt", "peeler"] },
        { id: "weather", name: "Weather", words: ["rain", "cloud", "sun", "wind", "snow", "storm", "fog", "hail", "rainbow", "puddle", "umbrella", "frost"] },
        { id: "places", name: "Places", words: ["home", "school", "park", "farm", "store", "beach", "hill", "lake", "bridge", "road", "garden", "library"] },
        { id: "animals", name: "Animals", words: ["owl", "fox", "whale", "crab", "ant", "bee", "seal", "toad", "hare", "moth", "crane", "dolphin"] },
        { id: "colors", name: "Colors", words: ["red", "yellow", "blue", "green", "black", "white", "orange", "purple", "brown", "pink", "gray", "tan"] },
        { id: "time", name: "Time", words: ["morning", "noon", "evening", "night"] }
      ]
    }
  };

  const CLUSTERS = {
    tiny: {
      animals: { dog: "pet", cat: "pet", bird: "sky", fish: "water", cow: "farm", duck: "sky" },
      food: { milk: "drink", apple: "fruit", banana: "fruit", bread: "bake", cookie: "bake", water: "drink" },
      body: { eye: "face", nose: "face", mouth: "face", hand: "limb", foot: "limb", tummy: "core" }
    },
    shop: {
      animals: { dog: "pet", cat: "pet", cow: "farm", horse: "farm", sheep: "farm", goat: "farm", pig: "farm", frog: "pond", mouse: "small", duck: "sky" },
      food: { apple: "fruit", banana: "fruit", grape: "fruit", carrot: "vegetable", corn: "vegetable", milk: "drink", cheese: "dairy", bread: "bake", egg: "egg", soup: "soup" },
      household: { cup: "cup", bowl: "dish", plate: "dish", spoon: "utensil", fork: "utensil", pan: "cook", pot: "cook", key: "key", clock: "clock", phone: "phone" },
      furniture: { bed: "sleep", crib: "sleep", chair: "seat", sofa: "seat", table: "top", desk: "top", lamp: "lamp", shelf: "shelf", rug: "rug", door: "door" },
      clothing: { shoe: "foot", sock: "foot", boot: "foot", coat: "warm", scarf: "warm", glove: "warm", shirt: "shirt", dress: "dress", pants: "pants", hat: "hat" },
      vehicles: { car: "road", bus: "road", truck: "road", wagon: "haul", cart: "haul", bike: "bike", boat: "boat", plane: "plane", train: "train", sled: "sled" },
      outside: { tree: "plant", flower: "plant", grass: "plant", leaf: "plant", sun: "sky", moon: "sky", star: "sky", cloud: "sky", rock: "rock", rain: "rain" }
    },
    rush: {
      kitchen: { ladle: "utensil", whisk: "utensil", scoop: "utensil", grater: "tool", peeler: "tool", sieve: "tool", kettle: "heat", oven: "heat", sink: "sink", tray: "tray", mixer: "mixer", mitt: "mitt" },
      weather: { rain: "wet", storm: "wet", puddle: "wet", hail: "ice", snow: "ice", frost: "ice", cloud: "sky", fog: "sky", sun: "sky", rainbow: "sky", wind: "wind", umbrella: "umbrella" },
      places: { home: "building", school: "building", store: "building", library: "building", farm: "building", park: "land", hill: "land", garden: "land", beach: "water", lake: "water", bridge: "bridge", road: "road" },
      animals: { owl: "bird", crane: "bird", fox: "land", hare: "land", whale: "sea", seal: "sea", dolphin: "sea", ant: "bug", bee: "bug", moth: "bug", crab: "crab", toad: "toad" }
    }
  };

  function makeRng(seed) {
    return { state: seed >>> 0 };
  }

  function rngUint(rng) {
    const state = (rng.state + 0x6D2B79F5) >>> 0;
    rng.state = state;
    let t = Math.imul(state ^ (state >>> 15), state | 1);
    const mixed = Math.imul(t ^ (t >>> 7), t | 61);
    const sum = (t + mixed) >>> 0;
    t = (t ^ sum) >>> 0;
    return (t ^ (t >>> 14)) >>> 0;
  }

  function rngInt(rng, lo, hi) {
    return lo + (rngUint(rng) % (hi - lo + 1));
  }

  function rngShuffle(rng, items) {
    const a = items.slice();
    for (let i = a.length - 1; i >= 1; i--) {
      const j = rngInt(rng, 0, i);
      const tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  function playSeed(clockMs, counter) {
    return (Math.imul((clockMs >>> 0) ^ Math.imul(counter >>> 0, 0x9E3779B9), 0x85EBCA6B)) >>> 0;
  }

  function choiceSeed(seed, index) {
    return (Math.imul(seed ^ (index + 1), 0x9E3779B1)) >>> 0;
  }

  function flashCap(band) {
    if (band === "tiny") return 8;
    if (band === "little") return 12;
    if (band === "shop" || band === "rush") return 16;
    return 0;
  }

  function flashChoices(band) {
    if (band === "tiny" || band === "little") return 3;
    if (band === "shop" || band === "rush") return 4;
    return 0;
  }

  function subjectMeta(band, id) {
    const pack = BANDS[band];
    if (!pack) return null;
    for (let i = 0; i < pack.subjects.length; i++) {
      if (pack.subjects[i].id === id) return pack.subjects[i];
    }
    return null;
  }

  function clusterOf(band, subject, id) {
    const table = CLUSTERS[band] && CLUSTERS[band][subject];
    if (!table) return id;
    return table[id] || id;
  }

  function flashPlan(band, subject, seed) {
    const meta = subjectMeta(band, subject);
    if (!meta) return null;
    const rng = makeRng(seed);
    const shuffled = rngShuffle(rng, meta.words.slice());
    const cap = flashCap(band);
    const order = [];
    let i = 0;
    while (order.length < cap) {
      const id = shuffled[i % shuffled.length];
      order.push(id);
      if (order.length < cap) order.push(id);
      i += 1;
    }
    let directions;
    if (band === "tiny") {
      directions = order.map(function () { return "hear-picture"; });
    } else if (band === "little") {
      directions = order.map(function () { return null; });
    } else {
      const nRev = band === "shop" ? Math.floor(cap / 3) : cap / 2;
      const idx = rngShuffle(rng, order.map(function (_, n) { return n; }));
      directions = order.map(function () { return "picture-word"; });
      for (let k = 0; k < nRev; k++) directions[idx[k]] = "word-picture";
    }
    return { order: order, directions: directions };
  }

  function foilsFor(band, subject, words, answer) {
    const need = flashChoices(band) - 1;
    if (band === "tiny") {
      const group = clusterOf(band, subject, answer);
      const rest = [];
      for (let i = 0; i < words.length; i++) {
        if (clusterOf(band, subject, words[i]) !== group) rest.push(words[i]);
      }
      return rest.slice(0, need);
    }
    if (band === "little") {
      const start = words.indexOf(answer);
      const out = [];
      let k = 1;
      while (out.length < need && k <= words.length) {
        const id = words[(start + k) % words.length];
        if (id !== answer) out.push(id);
        k += 1;
      }
      return out;
    }
    const group = clusterOf(band, subject, answer);
    const same = [];
    const other = [];
    for (let i = 0; i < words.length; i++) {
      const id = words[i];
      if (id === answer) continue;
      if (clusterOf(band, subject, id) === group) same.push(id);
      else other.push(id);
    }
    return same.concat(other).slice(0, need);
  }

  function littleDirection(subject, index, history, answerId) {
    let missed = 0;
    const heard = {};
    for (let i = 0; i < history.length; i++) {
      const row = history[i];
      if (row.direction === "picture-word" && row.correct === false) missed += 1;
      if (row.direction === "hear-picture") heard[row.promptId] = true;
    }
    if (subject !== "colors" && index % 4 === 3 && missed < 2 && heard[answerId]) return "picture-word";
    return "hear-picture";
  }

  function flashTrial(band, subject, plan, index, history, seed) {
    if (!plan || index < 0 || index >= plan.order.length) return null;
    const meta = subjectMeta(band, subject);
    if (!meta) return null;
    const answerId = plan.order[index];
    let direction = plan.directions[index];
    if (band === "little") direction = littleDirection(subject, index, history, answerId);
    const face = direction === "picture-word" ? "print" : "picture";
    const foil = foilsFor(band, subject, meta.words, answerId);
    const before = [answerId].concat(foil);
    const ids = rngShuffle(makeRng(choiceSeed(seed, index)), before);
    const choices = ids.map(function (id) { return { id: id, face: face }; });
    return { direction: direction, promptId: answerId, choices: choices, answerId: answerId };
  }

  function tracePaper(ctx, fill) {
    if (fill !== PAPER) return;
    ctx.save();
    ctx.strokeStyle = "#7a6552";
    ctx.lineWidth = 1.6;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke();
    ctx.restore();
  }

  function el(ctx, fill, cx, cy, rx, ry) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.ellipse(cx, cy, Math.max(0.5, rx), Math.max(0.5, ry), 0, 0, Math.PI * 2);
    ctx.fill();
    tracePaper(ctx, fill);
  }

  function rc(ctx, fill, x, y, w, h) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.fill();
    tracePaper(ctx, fill);
  }

  function pg(ctx, fill, pts) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.closePath();
    ctx.fill();
    tracePaper(ctx, fill);
  }

  function ln(ctx, color, w, x1, y1, x2, y2) {
    ctx.strokeStyle = color;
    ctx.lineWidth = w;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function nctx(ctx, x, y, w, h, draw) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.translate(x, y);
    ctx.scale(w / 100, h / 100);
    draw(ctx);
    ctx.restore();
  }

  function drawItems(ctx, x, y, w, h, items) {
    nctx(ctx, x, y, w, h, function (g) {
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        if (it[0] === "e") el(g, it[1], it[2], it[3], it[4], it[5]);
        else if (it[0] === "r") rc(g, it[1], it[2], it[3], it[4], it[5]);
        else if (it[0] === "p") pg(g, it[1], it.slice(2));
        else if (it[0] === "l") ln(g, it[1], it[2], it[3], it[4], it[5], it[6]);
      }
    });
  }

  function painter(items) {
    return function (ctx, x, y, w, h) { drawItems(ctx, x, y, w, h, items); };
  }

  function diskPainter(hex, rim) {
    return function (ctx, x, y, w, h) {
      const cx = x + w / 2;
      const cy = y + h / 2;
      const radius = Math.min(w, h) * 0.32;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = hex;

    for (let i = 0; i < count; i++) {

  function look(nx, ny) {

  function releaseLook() {

  function connectGaze() {
    if (suppressReconnect || checking) return;

  function takeGaze(chunk) {

    const view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    let pos = 0;

      const len = view.getUint32(pos + 1, true);
      if (len > 1048576) { gazeBuf = new Uint8Array(0); return; }

    const out = new Uint8Array(a.length + b.length);

    out.set(b, a.length);

  function applyGaze(view) {
    const mask = view.getUint32(0, true);
    if ((mask & 64) === 0) return;
    if (mask & 12) {
      const left = (mask & 4) ? view.getUint32(8, true) : 4;
      const right = (mask & 8) ? view.getUint32(12, true) : 4;

    const x = view.getFloat64(40, true);

        if (box.x + box.w > 390.5 || box.y + box.h > 844.5) fail("shop-four", "An answer left the 390 px screen.");
      });
      if (promptBox.w < 140 || promptBox.h < 140) fail("shop-four", "The prompt card was under 140 px.");
      let pictureWords = 0;
      let wordPictures = 0;
      let guard = 0;
      while (state().screen === "trial" && guard < 16) {
        guard += 1;
        if (state().direction === "picture-word") pictureWords += 1;
        if (state().direction === "word-picture") wordPictures += 1;
        choose(state().prompt);
        step(clock + 800);
      }
      if (pictureWords !== 11 || wordPictures !== 5) fail("shop-four", "The direction split was not 11 and 5.");
    });

    run("rush-half", function () {
      seed(31);
      start("rush");
      subject("animals");
      let wp = 0;
      let pw = 0;
      let guard = 0;
      while (state().screen === "trial" && guard < 16) {
        guard += 1;
        if (state().direction === "word-picture") wp += 1;
        if (state().direction === "picture-word") pw += 1;
        choose(state().prompt);
        step(clock + 800);
      }
      if (wp !== 8 || pw !== 8 || wp === 16 || pw === 16) fail("rush-half", "Rush animals was not 8 of 16.");
      seed(31);
      start("rush");
      subject("time");
      if (state().cap !== 16) fail("rush-half", "Time used a cap other than 16.");
      wp = 0;
      pw = 0;
      guard = 0;
      const allowed = { morning: true, noon: true, evening: true, night: true };
      while (state().screen === "trial" && guard < 16) {
        guard += 1;
        if (!allowed[state().prompt]) fail("rush-half", "Time used a word outside morning, noon, evening, and night.");
        if (state().choices.length !== 4) fail("rush-half", "Time did not show four choices.");
        if (state().direction === "word-picture") wp += 1;
        if (state().direction === "picture-word") pw += 1;
        choose(state().prompt);
        step(clock + 800);
      }
      if (wp !== 8 || pw !== 8) fail("rush-half", "Time was not 8 of 16.");
    });

    run("colors-not-print", function () {
      seed(31);
      start("little");
      subject("colors");
      const seen = {};
      let guard = 0;
      while (state().screen === "trial" && guard < 12) {
        guard += 1;
        seen[state().prompt] = true;
        state().choices.forEach(function (c, i) {
          seen[c.id] = true;
          if (c.face !== "picture" || document.getElementById("choice-" + i).textContent.trim() !== "") {
            fail("colors-not-print", "Little colors printed a color word.");
          }
        });
        if (state().direction !== "hear-picture") fail("colors-not-print", "Little colors left hear-picture.");
        choose(state().prompt);
        step(clock + 800);
      }
      ["red", "yellow", "blue", "green", "black", "white"].forEach(function (id) {
        if (!seen[id]) fail("colors-not-print", "Little colors dropped " + id + ".");
      });
      seed(31);
      start("shop");
      subject("colors");
      let printed = false;
      let orangeSeen = false;
      guard = 0;
      while (state().screen === "trial" && guard < 16) {
        guard += 1;
        if (state().prompt === "orange" || state().choices.some(function (c) { return c.id === "orange"; })) orangeSeen = true;
        if (state().direction === "picture-word") {
          printed = true;
          state().choices.forEach(function (c, i) {
            const el = document.getElementById("choice-" + i);
            if (el.textContent !== c.id) fail("colors-not-print", "A shop color card did not print its id.");
          });
        }
        if (state().direction === "picture-word" && state().prompt === "orange") {
          const area = trialLayout(window.innerWidth, window.innerHeight, 4, "none").area;
          const px = samplePixel(area.x + area.w / 2, area.y + area.h / 2);
          if (!nearHex(px, "#e07a2f", 12)) fail("colors-not-print", "Orange was not drawn as the color disk.");
        }
        state().choices.forEach(function (c, i) {
          if (c.id === "orange" && c.face === "picture") {
            const el = document.getElementById("choice-" + i);
            const r = el.getBoundingClientRect();
            const px = samplePixel(r.left + r.width / 2, r.top + r.height / 2);
            if (!nearHex(px, "#e07a2f", 18)) fail("colors-not-print", "Orange was not drawn as the color disk.");
          }
        });
        choose(state().prompt);
        step(clock + 800);
      }
      if (!printed) fail("colors-not-print", "Shop colors never printed a word.");
      if (!orangeSeen) fail("colors-not-print", "Shop colors left out orange.");
    });

    run("cap-rest", function () {
      seed(31);
      start("tiny");
      subject("animals");
      let guard = 0;
      while (state().screen === "trial" && guard < 8) {
        guard += 1;
        choose(state().prompt);
        step(clock + 800);
      }
      if (state().screen !== "rest" || state().trial !== 8) fail("cap-rest", "The eighth show did not rest.");
      const restText = document.getElementById("screen-rest").innerText || "";
      ["fail", "wrong", "no", "grade", "score"].forEach(function (word) {
        if (wordBound(restText, word) || wordBound(state().banner, word)) fail("cap-rest", "The rest card has a grade word.");
      });
      if (state().banner !== "That was a good sitting.") fail("cap-rest", "The rest banner changed.");
      if (restText.indexOf("We can play again.") < 0) fail("cap-rest", "The rest card lost its sentence.");
      let T = clock + 1000;
      step(T);
      seed(31);
      start("tiny");
      subject("animals");
      step(T + 119000);
      if (state().screen !== "trial") fail("cap-rest", "The first 119000 ms gap left the trial.");
      step(T + 238000);
      if (state().screen !== "trial") fail("cap-rest", "The second 119000 ms gap left the trial.");
      step(T + 240000);
      if (state().screen !== "rest") fail("cap-rest", "The following 2000 ms gap did not rest.");
      if (/fail/i.test(state().banner)) fail("cap-rest", "The ceiling banner says fail.");
      T = clock + 1000;
      step(T);
      seed(31);
      start("tiny");
      subject("animals");
      step(T + 240000);
      if (state().screen !== "trial") fail("cap-rest", "A single 240000 ms gap rested.");
      if (/fail/i.test(state().banner)) fail("cap-rest", "The rest banner says fail.");
    });

    run("subject-reject", function () {
      const before = state().screen;
      subject("not-a-subject");
      if (state().screen !== before) fail("subject-reject", "An unknown subject changed the screen.");
      if (pageHas("not-a-subject")) fail("subject-reject", "The unknown id was written into the page.");
    });

    run("no-remote-art", function () {
      const root = document.documentElement.cloneNode(true);
      root.querySelectorAll("script").forEach(function (node) { node.remove(); });
      const markup = root.outerHTML;
      const scriptText = document.querySelector("script").textContent;
      function has(hay, parts) { return hay.indexOf(parts.join("")) >= 0; }
      if (has(markup.toLowerCase(), ["mul", "berry"]) || has(scriptText.toLowerCase(), ["mul", "berry"])) {
        fail("no-remote-art", "The file names a downloaded symbol set.");
      }
      if (has(markup, ["ht", "tp://"]) || has(markup, ["ht", "tps://"]) || has(scriptText, ["ht", "tp://"]) || has(scriptText, ["ht", "tps://"])) {
        fail("no-remote-art", "The document has an image, font, or script URL.");
      }
      if (/<img\b/i.test(markup) || /url\s*\(/i.test(markup) || /@font-face/i.test(markup) || /<script\b[^>]*\bsrc\s*=/i.test(markup) || /<link\b/i.test(markup)) {
        fail("no-remote-art", "The document loads an image, font, or script.");
      }
      if (has(scriptText, ["url", "("]) || has(scriptText, ["fe", "tch("]) || has(scriptText, ["ev", "al("])) {
        fail("no-remote-art", "The script reaches the network or evaluates a string.");
      }
      ["tiny", "little", "shop", "rush"].forEach(function (band) {
        BANDS[band].subjects.forEach(function (sub) {
          sub.words.forEach(function (id) {
            if (typeof PAINT[id] !== "function") fail("no-remote-art", id + " has no painter.");
          });
        });
      });
    });

    junk.forEach(function (value) {
      if (document.documentElement.outerHTML.indexOf(value) >= 0) fail("family-query-inert", "A junk flag value is in the document.");
    });
    if (gazeSock) fail("family-query-inert", "A socket was opened.");

    try {
      if (!storageReady) fail("family-no-storage", "localStorage could not be read.");
      else {
        const popAfter = localStorage.getItem("pop-pals-v1");
        const keysAfter = Object.keys(localStorage);
        if (popAfter !== popBefore) fail("family-no-storage", "pop-pals-v1 changed.");
        if (keysAfter.length !== keysBefore.length || keysAfter.some(function (key, i) { return key !== keysBefore[i]; })) {
          fail("family-no-storage", "This game wrote a localStorage key.");
        }
        if (storageWrites !== 0) fail("family-no-storage", "The page called setItem or removeItem.");
        if (keysAfter.some(function (key) { return /flash/i.test(key); })) fail("family-no-storage", "A flash cards key is stored.");
      }
    } catch (err) {
      fail("family-no-storage", "The storage check could not finish.");
    }

    return { ok: failures.length === 0, failures: failures };
  }

  function emptyPoint() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    for (let y = 4; y < h; y += 18) {
      for (let x = 4; x < w; x += 18) {
        const el = document.elementFromPoint(x, y);
        const btn = el && el.closest ? el.closest("button") : null;
        if (!btn) return { nx: x / w, ny: y / h };
      }
    }
    return { nx: 0.5, ny: 0.5 };
  }

  function samplePixel(x, y) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const px = Math.max(0, Math.min(canvas.width - 1, Math.round(x * dpr)));
    const py = Math.max(0, Math.min(canvas.height - 1, Math.round(y * dpr)));
    const data = ctx.getImageData(px, py, 1, 1).data;
    return { r: data[0], g: data[1], b: data[2] };
  }

  function nearHex(px, hex, tol) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return Math.abs(px.r - r) <= tol && Math.abs(px.g - g) <= tol && Math.abs(px.b - b) <= tol;
  }

  choiceBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.dataset.id) onChoice(btn.dataset.id);
    });
  });
  promptBtn.addEventListener("click", function () { hear(); });
  stopBtn.addEventListener("click", function () { go("rest"); });
  backBtn.addEventListener("click", function () { go("menu"); });
  anotherBtn.addEventListener("click", function () { start(level); });
  document.getElementById("lets-go").addEventListener("click", function () { start(highlighted); });
  ["tiny", "little", "shop", "rush"].forEach(function (id) {
    document.getElementById(id).addEventListener("click", function () { selectBand(id); });
  });
  muteBtn.addEventListener("click", function () { setMuted(!muted); render(); });
  fullBtn.addEventListener("click", function () {
    if (!document.fullscreenElement) {
      const req = document.documentElement.requestFullscreen;
      if (req) req.call(document.documentElement).catch(function () {});
    } else if (document.exitFullscreen) document.exitFullscreen();
  });
  document.addEventListener("pointerdown", function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    if (pointerActive || activePointer !== null) return;
    activePointer = e.pointerId;
    pointerActive = true;
    clearVisit();
    ensureAudio();
  }, true);
  function endPointer(e) {
    if (e.pointerId !== activePointer) return;
    activePointer = null;
    pointerActive = false;
  }
  document.addEventListener("pointerup", endPointer, true);
  document.addEventListener("pointercancel", endPointer, true);
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "Escape") {
      if (!backBtn.hidden) { backBtn.click(); e.preventDefault(); }
      return;
    }
    const n = "1234".indexOf(e.key);
    if (n < 0) return;
    const choice = choiceBtns[n];
    if (choice && !choice.hidden) { choice.click(); e.preventDefault(); return; }
    const shown = [];
    for (let i = 0; i < subjectBtns.length; i++) {
      if (!subjectBtns[i].hidden) shown.push(subjectBtns[i]);
    }
    if (shown[n]) { shown[n].click(); e.preventDefault(); }
  });
  window.addEventListener("resize", function () { render(); });

  function frame(now) {
    if (checking) return;
    step(now);
    if (!checking) requestAnimationFrame(frame);
  }

  window.flashCards = {
    start: start,
    go: go,
    subject: subject,
    choose: choose,
    hear: hear,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    selfCheck: selfCheck
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let result;
    try { result = selfCheck(); }
    catch (err) { result = { ok: false, failures: ["selfCheck stopped before it could finish."] }; }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("play")) start("tiny");
    else if (params.has("rush")) start("rush");
    requestAnimationFrame(frame);
    connectGaze();
  }
})();
</script>
</body>
</html>
