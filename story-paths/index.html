<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0d8">
<title>Story Paths</title>
<style>
  :root {
    color-scheme: light;
    --ink: #2c2416;
    --paper: #f4f0d8;
    --card: #fffdf6;
    --sun: #ffc857;
    --sun-d: #e2a62e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  button { font-family: inherit; cursor: pointer; margin: 0; touch-action: none; color: var(--ink); }
  button:focus-visible { outline: 3px solid #1d6fd4; outline-offset: 2px; }
  [hidden] { display: none !important; }
  #gaze {
    --p: 0%;
    position: fixed; z-index: 60; width: 54px; height: 54px;
    margin: 0; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
    background: conic-gradient(#2f8a3e var(--p), rgba(244, 240, 216, 0.45) 0);
    box-shadow: 0 0 0 3px rgba(244, 240, 216, 0.95);
  }
  #eyes {
    position: fixed; z-index: 28; pointer-events: none;
    background: var(--card); border-radius: 999px; padding: 8px 12px;
    font-weight: 800; font-size: 16px;
  }
  #banner {
    position: fixed; z-index: 25; pointer-events: none;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px;
    padding: 6px 14px; font-size: 18px; font-weight: 800;
    text-align: center; overflow: hidden;
  }
  #menu-card, #rest-card {
    position: fixed; z-index: 2; pointer-events: none;
    background: var(--card); border-radius: 28px;
    box-shadow: 0 18px 50px rgba(50, 30, 10, 0.18);
  }
  #screen-menu, #screen-rest, #play, #menu-copy, #rest-line, #scene, #sentence, h1, p, b, small {
    pointer-events: none;
  }
  #menu-copy, #rest-line {
    position: fixed; z-index: 24; margin: 0; text-align: center; overflow: hidden;
  }
  #menu-copy h1 { margin: 0; font-size: 26px; line-height: 28px; }
  #menu-copy p { margin: 0; font-size: 14px; line-height: 16px; }
  #rest-line { font-size: 28px; font-weight: 800; }
  #mute, #full, #back, #back-page, #lets-go, #tiny, #little, #shop, #rush, #another, #play button {
    position: fixed; z-index: 30; pointer-events: auto;
  }
  #mute, #full, #back, #back-page {
    z-index: 46; border: none; border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #d5c4a1; font-size: 15px; line-height: 1.1;
    padding: 4px;
  }
  #mute { display: grid; place-items: center; padding: 0; }
  #mute svg { width: 34px; height: 34px; display: block; }
  #full { font-size: 14px; line-height: 16px; }
  #tiny, #little, #shop, #rush {
    border: 3px solid transparent; border-radius: 18px;
    background: #fffdf6; color: var(--ink); text-align: left;
    padding: 4px 10px; box-shadow: 0 4px 0 #e2d0b4; overflow: hidden;
  }
  #tiny b, #little b, #shop b, #rush b { display: block; font-size: 18px; line-height: 20px; }
  #tiny small, #little small, #shop small, #rush small {
    display: block; font-size: 12px; line-height: 14px; color: #5c4e3a; font-weight: 800;
  }
  #tiny[aria-pressed="true"], #little[aria-pressed="true"],
  #shop[aria-pressed="true"], #rush[aria-pressed="true"] {
    border-color: var(--ink); background: #fff6df;
  }
  #lets-go, #another {
    border: none; border-radius: 18px;
    background: var(--sun); color: var(--ink); font-weight: 800;
    box-shadow: 0 5px 0 var(--sun-d); font-size: 26px;
  }
  #scene {
    position: fixed; z-index: 2; overflow: hidden;
    background: var(--card); border-radius: 24px;
    box-shadow: 0 8px 24px rgba(50, 30, 10, 0.08);
  }
  #scene .fig { position: absolute; }
  #scene .fig svg { width: 100%; height: 100%; display: block; }
  #sentence {
    position: fixed; z-index: 3; margin: 0; overflow: hidden;
    font-weight: 800; text-align: center;
  }
  #play button {
    border: 3px solid var(--ink); border-radius: 18px;
    background: var(--card); color: var(--ink); font-weight: 800;
    box-shadow: 0 4px 0 #e2d0b4; padding: 8px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  #play button .art { display: block; }
  #play button .art svg { width: 100%; height: 100%; display: block; }
  #play button .label { display: block; text-align: center; }
  #play button.story { flex-direction: column; }
  #play button.story .art { width: 54%; height: 62%; }
  #play button.story .label { font-size: 28px; line-height: 32px; }
  #play button.choice .label { font-size: 22px; line-height: 26px; }
  #play.layout-pair button.choice { flex-direction: column; }
  #play.layout-pair button.choice .art { width: 62%; height: 58%; }
  #play.layout-stack button.choice { flex-direction: row; justify-content: flex-start; padding-left: 12px; }
  #play.layout-stack button.choice .art { width: 88px; height: 88px; flex: 0 0 88px; }
  #play.layout-stack button.choice .label { font-size: 24px; text-align: left; }
  #play.layout-wide button.choice { flex-direction: row; justify-content: flex-start; padding-left: 16px; }
  #play.layout-wide button.choice .art { width: 120px; height: 120px; flex: 0 0 120px; }
  #play.layout-wide button.choice .label { font-size: 26px; text-align: left; }
  #play.band-rush button.choice { flex-direction: row; justify-content: flex-start; }
  #play.band-rush button.choice .art { width: 72px; height: 72px; flex: 0 0 72px; }
  #play.band-rush button.choice .label { font-size: 28px; line-height: 32px; text-align: left; }
  #play button.end-btn { justify-content: center; }
  #play button.end-btn .label { font-size: 24px; line-height: 28px; }
  @media (prefers-reduced-motion: reduce) {
    #scene, #sentence, #play button { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<button id="mute" type="button" aria-label="Mute sound">
  <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16.5 8.5a5 5 0 010 7"/>
  </svg>
  <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
    <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8l6 8"/>
  </svg>
</button>
<button id="full" type="button">Fullscreen</button>
<button id="back" type="button" hidden>Back to Menu</button>
<button id="back-page" type="button" hidden>Back a page</button>
<div id="eyes" hidden>Eyes</div>
<div id="gaze" hidden></div>
<p id="banner">Pick who is playing.</p>
<section id="screen-menu">
  <div id="menu-card"></div>
  <div id="menu-copy">
    <h1>Story Paths</h1>
    <p>Look at a choice to turn the page.</p>
    <p>Ages 2 and up</p>
  </div>
  <button id="tiny" type="button" aria-pressed="true"><b>Picture Book</b><small>Ages 2 to 3. Pictures only.</small></button>
  <button id="little" type="button" aria-pressed="false"><b>Story Time</b><small>Ages 4 to 5. Short sentences.</small></button>
  <button id="shop" type="button" aria-pressed="false"><b>Choose a Path</b><small>Ages 6 to 8. Three choices sometimes.</small></button>
  <button id="rush" type="button" aria-pressed="false"><b>Story Explorer</b><small>Ages 9 and up. Read and choose.</small></button>
  <button id="lets-go" type="button">Let's go</button>
</section>
<div id="play" hidden>
  <div id="scene" hidden></div>
  <p id="sentence" hidden></p>
</div>
<section id="screen-rest" hidden>
  <div id="rest-card"></div>
  <p id="rest-line">Thanks for reading.</p>
  <button id="another" type="button">Another</button>
</section>
<script>

  function knownBand(band) { return BAND_IDS.indexOf(band) >= 0; }
  function svgEl(name, attrs) {
    const el = document.createElementNS(SVGNS, name);
    if (attrs) {
      for (const k in attrs) {

      }
    }
    return el;
  }
  function shape(parent, tag, attrs) {
    const el = svgEl(tag, attrs);
    if (!el.hasAttribute("fill")) el.setAttribute("fill", "none");
    if (!el.hasAttribute("stroke")) el.setAttribute("stroke", INK);
    if (!el.hasAttribute("stroke-width")) el.setAttribute("stroke-width", "3");
    el.setAttribute("stroke-linejoin", "round");
    el.setAttribute("stroke-linecap", "round");
    parent.appendChild(el);
    return el;
  }
  function picture(name) {
    const svg = svgEl("svg", { viewBox: "0 0 100 100", "aria-hidden": "true" });
    const draw = KIT[name];
    if (draw) draw(svg);
    return svg;
  }

  function storiesFor(band) {

  }

    if (!page || page.end || !page.choices) return [];

      if (choice.older && (band === "tiny" || band === "little")) continue;
      out.push(choice);
    }
    return out;
  }

    if (!page) return "";

      const story = storyObj();
      return story ? story.title : "Pick a story.";

  function place(el, box, dx) {

    el.style.height = box.h + "px";
    el.style.transform = dx ? "translateX(" + dx + "px)" : "";
  }

    if (!turn || reducedMotion()) return 0;
    const t = turn.ms > 0 ? (clock - turn.t0) / turn.ms : 1;

    return Math.round((1 - p) * 40);

  function chromePlan(w, wantBack, wantPage) {
    const gap = 8;
    const bh = 72;
    const y = 8;
    const full = { id: "full", x: w - 8 - 72, y: y, w: 72, h: bh };
    const mute = { id: "mute", x: full.x - gap - 72, y: y, w: 72, h: bh };
    if (mute.x < 8) return null;
    const targets = [mute, full];
    let bottom = y + bh;
    let leftEnd = 8;
    if (wantBack) {
      const room = mute.x - gap - 8;
      if (wantPage) {
        let backW = 160;
        let pageW = 140;
        if (room >= backW + gap + pageW) {
          targets.push({ id: "back", x: 8, y: y, w: backW, h: bh });
          targets.push({ id: "back-page", x: 8 + backW + gap, y: y, w: pageW, h: bh });
          leftEnd = 8 + backW + gap + pageW;
        } else if (room >= 72 + gap + 72) {
          const usable = room - gap;
          backW = Math.max(72, Math.floor(usable * 0.55));
          pageW = usable - backW;
          if (pageW < 72) { pageW = 72; backW = usable - 72; }
          if (backW < 72) return null;
          targets.push({ id: "back", x: 8, y: y, w: backW, h: bh });
          targets.push({ id: "back-page", x: 8 + backW + gap, y: y, w: pageW, h: bh });
          leftEnd = 8 + backW + gap + pageW;
        } else if (room >= 72) {
          backW = Math.min(176, room);
          targets.push({ id: "back", x: 8, y: y, w: backW, h: bh });
          leftEnd = 8 + backW;
          pageW = Math.min(200, w - 16);
          const pageY = y + bh + gap;
          targets.push({ id: "back-page", x: 8, y: pageY, w: Math.max(72, pageW), h: bh });
          bottom = pageY + bh;
        } else return null;
      } else {
        if (room < 72) return null;
        const backW = Math.min(176, room);
        targets.push({ id: "back", x: 8, y: y, w: backW, h: bh });
        leftEnd = 8 + backW;
      }
    }
    return { targets: targets, bottom: bottom, leftEnd: leftEnd, muteX: mute.x };
  }

    const bw = chrome.muteX - 8 - x;
    if (chrome.bottom <= 80 && bw >= 140) {

    if (banner.inline) return chrome.bottom + 8;

  function menuLayout(w, h) {
    const btnH = 72;
    const gap = 8;
    const titleH = 64;
    const ids = ["tiny", "little", "shop", "rush", "lets-go"];
    const columnH = titleH + gap + ids.length * btnH + (ids.length - 1) * gap;
    const belowTop = 92;
    let cardW = w < 480 ? w - 16 : Math.min(460, w - 24);

    if (belowTop + columnH <= h - 8) {

      let y = belowTop + titleH + gap;
      for (let i = 0; i < ids.length; i++) {

        y += btnH + gap;

      return { title: title, buttons: buttons, card: { x: cardX, y: belowTop, w: cardW, h: y - gap - belowTop } };
    }
    const gridTitle = 48;
    const gridH = gridTitle + gap + btnH + gap + btnH + gap + btnH;
    let top = belowTop;
    if (top + gridH > h - 8) top = 8;
    if (top + gridH > h - 8) return null;
    if (top < 80) {
      const muteX = w - 8 - 72 - 8 - 72;
      if (cardX + cardW > muteX - 8) {
        cardW = muteX - 8 - 8;
        cardX = 8;
        if (cardW < 160) return null;
      }
    }
    const title = { x: cardX, y: top, w: cardW, h: gridTitle };
    const colW = Math.max(72, Math.floor((cardW - gap) / 2));
    const gridW = colW * 2 + gap;
    const gridX = cardX + Math.max(0, Math.floor((cardW - gridW) / 2));
    const bandIds = ["tiny", "little", "shop", "rush"];
    for (let i = 0; i < bandIds.length; i++) {
      const col = i % 2;
      const row = Math.floor(i / 2);
      buttons.push({

        x: gridX + col * (colW + gap),
        y: top + gridTitle + gap + row * (btnH + gap),

    return { title: title, buttons: buttons, card: { x: cardX, y: top, w: cardW, h: letsY + btnH - top } };
  }

  function ensureAudio() {

  function buttonVisible(btn) {

      const r = btn.getBoundingClientRect();

      start("shop");
      const shop = titles();
      if (shop.length !== 3) fail("band-stories", "Choose a Path did not offer three stories.");
      resetInput();
      start("rush");
      const rush = titles();
      if (rush.length !== 3 || rush.indexOf("story-boat") < 0) fail("band-stories", "Story Explorer did not offer three stories.");
      tapId("story-ball");
      const choice = document.getElementById("choice-0");
      const art = choice && choice.querySelector(".art");
      const label = choice && choice.querySelector(".label");
      if (!choice || !art || !label) fail("band-stories", "Story Explorer did not show a choice card.");
      else if (parseFloat(getComputedStyle(label).fontSize) < 28) fail("band-stories", "Story Explorer did not show the label large.");
      else if (art.getBoundingClientRect().width > 80) fail("band-stories", "Story Explorer did not show the picture small.");
    });
    run("back-a-page", function () {
      resetInput();
      start("tiny");
      openBall();
      if (targetById(centers().targets, "back-page")) fail("back-a-page", "Back a page showed on the first page.");
      tapId("choice-0");
      if (state().page !== "p2") fail("back-a-page", "The bed choice did not turn the page.");
      const back = targetById(centers().targets, "back-page");
      if (!back || back.play) fail("back-a-page", "Back a page was missing or marked as play.");
      else {
        enterLook(back, 80000);
        step(80600);
        if (state().page !== "p2") fail("back-a-page", "600 ms on Back a page turned the page.");
        step(81300);
        if (state().page !== "p1") fail("back-a-page", "1300 ms on Back a page did not return.");
      }
      if (targetById(centers().targets, "back-page")) fail("back-a-page", "Back a page stayed on the first page.");
      tapId("choice-1");
      tapId("back-page");
      if (state().page !== "p1") fail("back-a-page", "A tap on Back a page did not return.");
    });
    run("ending-buttons", function () {
      function toEnd() {
        resetInput();
        start("tiny");
        openBall();
        tapId("choice-0");
        tapId("choice-0");
      }
      toEnd();
      if (!state().end || state().page !== "e1") fail("ending-buttons", "The cat path did not reach an ending.");
      if (sentenceEl.textContent !== "The end") fail("ending-buttons", "Picture Book ending did not say The end.");
      if ((sentenceEl.textContent || "").indexOf("sleeping") >= 0) fail("ending-buttons", "Picture Book ending showed the long sentence.");
      const ids = ["read-again", "another-story", "all-done"];
      for (let i = 0; i < ids.length; i++) {
        const box = targetById(centers().targets, ids[i]);
        if (!box || box.play) fail("ending-buttons", ids[i] + " was missing or marked as play.");
      }
      tapId("read-again");
      if (state().screen !== "play" || state().story !== "ball" || state().page !== "p1" || state().end) {
        fail("ending-buttons", "Read again did not start the same story.");
      }
      toEnd();
      tapId("another-story");
      if (state().screen !== "stories" || state().story !== null) fail("ending-buttons", "Another story did not return to the stories.");
      const offered = centers().targets.filter(function (t) { return t.id.indexOf("story-") === 0; });
      if (offered.length !== 1) fail("ending-buttons", "Another story left the band.");
      toEnd();
      tapId("all-done");
      if (state().screen !== "rest") fail("ending-buttons", "All done did not open rest.");
      if (restLine.textContent !== "Thanks for reading." || state().banner !== "Thanks for reading.") {
        fail("ending-buttons", "Rest did not say thanks for reading.");
      }
      const restText = (restEl.innerText || "").toLowerCase();
      if (/grade|miss|rank|score|time|wrong/.test(restText)) fail("ending-buttons", "Rest showed a grade.");
      const again = targetById(centers().targets, "another");
      if (!again || again.play) fail("ending-buttons", "Another was missing on rest.");
      else tap(again.nx, again.ny);
      if (state().screen !== "stories" || state().level !== "tiny") fail("ending-buttons", "Another did not start the same band.");
    });
    run("sizes", function () {
      const views = [[390, 700], [1024, 768]];
      function check(where, wantChoice) {
        for (let v = 0; v < views.length; v++) {
          const w = views[v][0];
          const h = views[v][1];
          const lay = targetsAt(w, h);
          if (!lay.ok) fail("sizes", where + " at " + w + " by " + h + " was not ok.");
          const list = lay.targets || [];
          for (let i = 0; i < list.length; i++) {
            const t = list[i];
            if (t.x < -0.5 || t.y < -0.5 || t.x + t.w > w + 0.5 || t.y + t.h > h + 0.5) {
              fail("sizes", where + " target " + t.id + " was off the " + w + " by " + h + " page.");
            }
            if (Math.min(t.w, t.h) < 72) fail("sizes", where + " target " + t.id + " was under 72.");
            if (wantChoice && t.id.indexOf("choice-") === 0 && Math.min(t.w, t.h) < 112) {
              fail("sizes", where + " choice " + t.id + " was under 112 at " + w + " by " + h + ".");
            }
          }
        }
      }
      resetInput();
      go("menu");
      check("menu", false);
      start("tiny");
      check("stories", false);
      openBall();
      check("two choices", true);
      const two = targetsAt(390, 700).targets.filter(function (t) { return t.id.indexOf("choice-") === 0; });
      if (two.length !== 2) fail("sizes", "Picture Book at 390 by 700 did not lay out two choices.");
      else {
        two.sort(function (a, b) { return a.x - b.x; });
        if (Math.abs(two[0].w - 171) > 2 || Math.abs(two[0].h - 180) > 2) fail("sizes", "The 390 by 700 pair was not 171 by 180.");
      }
      tapId("choice-0");
      tapId("choice-0");
      check("ending", false);
      resetInput();
      start("shop");
      tapId("story-boat");
      check("three choices", true);
      const three = targetsAt(390, 700).targets.filter(function (t) { return t.id.indexOf("choice-") === 0; });
      if (three.length !== 3) fail("sizes", "The boat page at 390 by 700 did not lay out three choices.");
      else if (Math.min(three[0].w, three[0].h) < 112) fail("sizes", "A stacked choice was under 112.");
      const root = document.documentElement;
      if (root.scrollWidth > root.clientWidth + 2 || root.scrollHeight > root.clientHeight + 2) {
        fail("sizes", "The page needed scrolling.");
      }
    });
    run("no-speech", function () {
      if (speakCalls !== 0) fail("no-speech", "speechSynthesis.speak was called.");
      if (Object.prototype.hasOwnProperty.call(state(), "speech")) fail("no-speech", "state kept a speech field.");
    });
    run("family-plain-state", function () {
      const before = JSON.stringify(state());
      start("nope");
      go("sideways");
      if (JSON.stringify(state()) !== before) fail("family-plain-state", "An unknown band or screen changed the state.");
      const end = state();
      if (!("level" in end) || !("screen" in end) || !("banner" in end) || !("muted" in end)) {
        fail("family-plain-state", "level, screen, banner, or muted was missing.");
      }
    });
    try { assertJunk("at the end"); }
    catch (err) { fail("family-query-inert", err && err.message ? err.message : "The junk check threw."); }
    try {
      if (writes !== 0) fail("family-no-storage", "The page called setItem or removeItem.");
      if (storeLen !== null && localStorage.length !== storeLen) fail("family-no-storage", "localStorage gained a key.");
      if (storeLen !== null && localStorage.getItem("pop-pals-v1") !== pop) fail("family-no-storage", "pop-pals-v1 changed.");
    } catch (err) {
      fail("family-no-storage", "Storage could not be read.");
    }
    try {
      if (origSet) localStorage.setItem = origSet;
      if (origRem) localStorage.removeItem = origRem;
      if (origSpeak && window.speechSynthesis) window.speechSynthesis.speak = origSpeak;
    } catch (err) {}
    return { ok: failures.length === 0, failures: failures };
  }

  window.storyPaths = {
    start: start,
    go: go,
    look: look,
    releaseLook: releaseLook,
    hold: hold,
    release: release,
    tap: tap,
    step: step,
    dwell: dwell,
    eyes: eyes,
    centers: centers,
    targetsAt: targetsAt,
    state: state,
    seed: seed,
    choose: choose,
    openStory: openStory,
    selfCheck: selfCheck
  };

  render();
  const params = new URLSearchParams(location.search);
  if (params.has("selfcheck")) {
    checking = true;
    suppressReconnect = true;
    if (gazeSock) {
      try { gazeSock.close(); } catch (err) {}
      gazeSock = null;
    }
    let result;
    try { result = selfCheck(); }
    catch (err) {
      result = { ok: false, failures: ["self-check: " + (err && err.message ? err.message : "The check threw.")] };
    }
    const pre = document.createElement("pre");
    pre.id = "selfcheck-result";
    pre.textContent = JSON.stringify(result);
    document.body.appendChild(pre);
    document.title = result.ok ? "SELFCHECK_OK" : "SELFCHECK_FAIL";
  } else {
    if (params.has("rush")) start("rush");
    else if (params.has("play")) start("tiny");
    connectGaze();
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
